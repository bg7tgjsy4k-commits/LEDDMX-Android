              void requestBlePermissions() {

                  if (Build.VERSION.SDK_INT >= 31) {

                      if (
                              checkSelfPermission(
                                      Manifest.permission.BLUETOOTH_SCAN
                              )
                              != PackageManager.PERMISSION_GRANTED
                              ||
                              checkSelfPermission(
                                      Manifest.permission.BLUETOOTH_CONNECT
                              )
                              != PackageManager.PERMISSION_GRANTED
                      ) {

                          requestPermissions(
                                  new String[] {
                                      Manifest.permission.BLUETOOTH_SCAN,
                                      Manifest.permission.BLUETOOTH_CONNECT
                                  },
                                  50
                          );
                      }

                  } else if (Build.VERSION.SDK_INT >= 23) {

                      if (
                              checkSelfPermission(
                                      Manifest.permission.ACCESS_FINE_LOCATION
                              )
                              != PackageManager.PERMISSION_GRANTED
                      ) {

                          requestPermissions(
                                  new String[] {
                                      Manifest.permission.ACCESS_FINE_LOCATION
                                  },
                                  50
                          );
                      }
                  }
              }

              boolean hasScanPermission() {

                  if (Build.VERSION.SDK_INT >= 31) {

                      return
                              checkSelfPermission(
                                      Manifest.permission.BLUETOOTH_SCAN
                              )
                              == PackageManager.PERMISSION_GRANTED;

                  }

                  if (Build.VERSION.SDK_INT < 23) {
                      return true;
                  }

                  return
                          checkSelfPermission(
                                  Manifest.permission.ACCESS_FINE_LOCATION
                          )
                          == PackageManager.PERMISSION_GRANTED;
              }

              void scanBle() {

                  if (adapter == null) {
                      status.setText(
                              "Status: Bluetooth adapter tidak tersedia"
                      );
                      return;
                  }

                  if (!adapter.isEnabled()) {

                      status.setText(
                              "Status: Bluetooth OFF"
                      );

                      try {
                          startActivityForResult(
                                  new Intent(
                                          BluetoothAdapter.ACTION_REQUEST_ENABLE
                                  ),
                                  100
                          );
                      } catch (Exception ignored) {
                      }

                      return;
                  }

                  if (!hasScanPermission()) {
                      requestBlePermissions();
                      return;
                  }

                  long now =
                          System.currentTimeMillis();

                  if (now - lastScan < 2500) {
                      status.setText(
                              "Status: tunggu sebentar sebelum scan ulang"
                      );
                      return;
                  }

                  if (scanning) {
                      return;
                  }

                  lastScan = now;

                  devices.clear();
                  labels.clear();

                  if (deviceAdapter != null) {
                      deviceAdapter.notifyDataSetChanged();
                  }

                  scanner =
                          adapter.getBluetoothLeScanner();

                  if (scanner == null) {

                      status.setText(
                              "Status: BLE scanner null"
                      );

                      return;
                  }

                  scanning = true;

                  status.setText(
                          "Status: scanning semua BLE device..."
                  );

                  try {

                      ScanSettings settings =
                              new ScanSettings.Builder()
                                      .setScanMode(
                                              ScanSettings.SCAN_MODE_LOW_LATENCY
                                      )
                                      .build();

                      scanner.startScan(
                              null,
                              settings,
                              scanCallback
                      );

                  } catch (Exception e) {

                      scanning = false;

                      status.setText(
                              "Scan error: "
                                      + e.getClass()
                                      .getSimpleName()
                      );

                      return;
                  }

                  main.postDelayed(
                          new Runnable() {
                              @Override
                              public void run() {
                                  stopScan();
                              }
                          },
                          10000
                  );
              }

              void stopScan() {

                  if (!scanning) {
                      return;
                  }

                  try {

                      if (scanner != null) {
                          scanner.stopScan(scanCallback);
                      }

                  } catch (Exception ignored) {
                  }

                  scanning = false;

                  if (devices.isEmpty()) {

                      status.setText(
                              "Status: scan selesai, device 0"
                      );

                  } else {

                      status.setText(
                              "Status: ditemukan "
                                      + devices.size()
                                      + " BLE device"
                      );
                  }
              }

              final ScanCallback scanCallback =
                      new ScanCallback() {

                          @Override
                          public void onScanResult(
                                  int callbackType,
                                  ScanResult result
                          ) {

                              BluetoothDevice device =
                                      result.getDevice();

                              if (device == null) {
                                  return;
                              }

                              String name = null;

                              try {

                                  if (
                                          result.getScanRecord()
                                                  != null
                                  ) {

                                      name =
                                              result
                                                      .getScanRecord()
                                                      .getDeviceName();
                                  }

                              } catch (Exception ignored) {
                              }

                              if (
                                      name == null
                                              ||
                                      name.trim().isEmpty()
                              ) {

                                  try {
                                      name =
                                              device.getName();
                                  } catch (Exception ignored) {
                                  }
                              }

                              if (
                                      name == null
                                              ||
                                      name.trim().isEmpty()
                              ) {

                                  name = "UNKNOWN BLE";
                              }

                              String address =
                                      device.getAddress();

                              int rssi =
                                      result.getRssi();

                              String line =
                                      name
                                              + " | "
                                              + address
                                              + " | RSSI "
                                              + rssi;

                              int existing = -1;

                              for (int i = 0;
                                   i < devices.size();
                                   i++) {

                                  try {

                                      if (
                                              devices
                                                      .get(i)
                                                      .getAddress()
                                                      .equals(address)
                                      ) {

                                          existing = i;
                                          break;
                                      }

                                  } catch (Exception ignored) {
                                  }
                              }

                              if (existing >= 0) {

                                  labels.set(
                                          existing,
                                          line
                                  );

                              } else {

                                  devices.add(device);
                                  labels.add(line);
                              }

                              runOnUiThread(
                                      new Runnable() {
                                          @Override
                                          public void run() {

                                              if (
                                                      deviceAdapter
                                                              != null
                                              ) {

                                                  deviceAdapter
                                                          .notifyDataSetChanged();
                                              }
                                          }
                                      }
                              );
                          }

                          @Override
                          public void onScanFailed(
                                  int errorCode
                          ) {

                              scanning = false;

                              final String message =
                                      "SCAN FAILED: CODE "
                                              + errorCode;

                              runOnUiThread(
                                      new Runnable() {
                                          @Override
                                          public void run() {
                                              status.setText(
                                                      message
                                              );
                                          }
                                      }
                              );
                          }
                      };

              void connect(
                      BluetoothDevice device
              ) {

                  if (device == null) {
                      return;
                  }

                  try {

                      status.setText(
                              "Status: connecting "
                                      + device.getAddress()
                      );

                      if (Build.VERSION.SDK_INT >= 23) {

                          gatt =
                                  device.connectGatt(
                                          this,
                                          false,
                                          gattCallback,
                                          BluetoothDevice.TRANSPORT_LE
                                  );

                      } else {

                          gatt =
                                  device.connectGatt(
                                          this,
                                          false,
                                          gattCallback
                                  );
                      }

                  } catch (Exception e) {

                      status.setText(
                              "Connect error: "
                                      + e.getClass()
                                      .getSimpleName()
                      );
                  }
              }

              final BluetoothGattCallback gattCallback =
                      new BluetoothGattCallback() {

                          @Override
                          public void onConnectionStateChange(
                                  BluetoothGatt g,
                                  int statusCode,
                                  int newState
                          ) {

                              if (
                                      newState
                                              == BluetoothProfile.STATE_CONNECTED
                              ) {

                                  runOnUiThread(
                                          new Runnable() {
                                              @Override
                                              public void run() {
                                                  status.setText(
                                                          "Status: connected, discovering services..."
                                                  );
                                              }
                                          }
                                  );

                                  try {
                                      g.discoverServices();
                                  } catch (Exception ignored) {
                                  }

                              } else {

                                  writeChar = null;

                                  try {
                                      g.close();
                                  } catch (Exception ignored) {
                                  }

                                  runOnUiThread(
                                          new Runnable() {
                                              @Override
                                              public void run() {
                                                  status.setText(
                                                          "Status: disconnected"
                                                  );
                                              }
                                          }
                                  );
                              }
                          }

                          @Override
                          public void onServicesDiscovered(
                                  BluetoothGatt g,
                                  int serviceStatus
                          ) {

                              BluetoothGattService service =
                                      g.getService(SVC);

                              if (service != null) {

                                  writeChar =
                                          service.getCharacteristic(
                                                  WRITE
                                          );
                              }

                              boolean ready =
                                      writeChar != null;

                              boolean ota =
                                      g.getService(OTA_SVC) != null;

                              BluetoothGattCharacteristic notifyChar =
                                      null;

                              for (
                                      BluetoothGattService s
                                      : g.getServices()
                              ) {

                                  for (
                                          BluetoothGattCharacteristic c
                                          : s.getCharacteristics()
                                  ) {

                                      int properties =
                                              c.getProperties();

                                      if (
                                              (
                                                      properties
                                                              & BluetoothGattCharacteristic.PROPERTY_NOTIFY
                                              ) != 0
                                      ) {

                                          notifyChar = c;
                                          break;
                                      }

                                      if (
                                              (
                                                      properties
                                                              & BluetoothGattCharacteristic.PROPERTY_INDICATE
                                              ) != 0
                                      ) {

                                          notifyChar = c;
                                          break;
                                      }
                                  }

                                  if (notifyChar != null) {
                                      break;
                                  }
                              }

                              if (notifyChar != null) {

                                  try {

                                      g.setCharacteristicNotification(
                                              notifyChar,
                                              true
                                      );

                                      BluetoothGattDescriptor descriptor =
                                              notifyChar.getDescriptor(
                                                      UUID.fromString(
                                                              "00002902-0000-1000-8000-00805F9B34FB"
                                                      )
                                              );

                                      if (descriptor != null) {

                                          descriptor.setValue(
                                                  BluetoothGattDescriptor
                                                          .ENABLE_NOTIFICATION_VALUE
                                          );

                                          g.writeDescriptor(
                                                  descriptor
                                          );
                                      }

                                  } catch (Exception ignored) {
                                  }
                              }

                              final boolean readyFinal =
                                      ready;

                              final boolean otaFinal =
                                      ota;

                              final BluetoothGattCharacteristic
                                      notifyFinal =
                                      notifyChar;

                              runOnUiThread(
                                      new Runnable() {
                                          @Override
                                          public void run() {

                                              if (readyFinal) {

                                                  status.setText(
                                                          "READY FFE1"
                                                                  + (
                                                                  otaFinal
                                                                          ? " | OTA SERVICE"
                                                                          : ""
                                                          )
                                                                  + (
                                                                  notifyFinal
                                                                          != null
                                                                          ? " | NOTIFY"
                                                                          : ""
                                                          )
                                                  );

                                              } else {

                                                  status.setText(
                                                          "Connected but FFE1 not found"
                                                  );
                                              }
                                          }
                                      }
                              );

                              analyzerAppend(
                                      "GATT DISCOVERED\n"
                                              + "FFE1 WRITE = "
                                              + (
                                              ready
                                                      ? "YES"
                                                      : "NO"
                                      )
                                              + "\n"
                                              + "OTA SERVICE = "
                                              + ota
                                              + "\n"
                              );
                          }

                          @Override
                          public void onCharacteristicChanged(
                                  BluetoothGatt g,
                                  BluetoothGattCharacteristic c
                          ) {

                              byte[] value =
                                      c.getValue();

                              String data =
                                      value == null
                                              ? ""
                                              : hex(value);

                              analyzerAppend(
                                      "RX [MODULE]\n"
                                              + "CHAR="
                                              + c.getUuid()
                                              + "\n"
                                              + data
                                              + "\n"
                              );
                          }

                          @Override
                          public void onCharacteristicRead(
                                  BluetoothGatt g,
                                  BluetoothGattCharacteristic c,
                                  int statusCode
                          ) {

                              byte[] value =
                                      c.getValue();

                              String data =
                                      value == null
                                              ? ""
                                              : hex(value);

                              analyzerAppend(
                                      "READ [MODULE]\n"
                                              + "CHAR="
                                              + c.getUuid()
                                              + "\n"
                                              + data
                                              + "\n"
                              );
                          }
                      };

              void analyzerAppend(
                      final String text
              ) {

                  runOnUiThread(
                          new Runnable() {
                              @Override
                              public void run() {

                                  if (analyzer == null) {
                                      return;
                                  }

                                  String old =
                                          analyzer
                                                  .getText()
                                                  .toString();

                                  String combined =
                                          old
                                                  + "\n"
                                                  + text;

                                  if (combined.length() > 12000) {

                                      combined =
                                              combined.substring(
                                                      combined.length()
                                                              - 12000
                                              );
                                  }

                                  analyzer.setText(
                                          combined
                                  );
                              }
                          }
                  );
              }

              void send(
                      byte[] data
              ) {

                  if (
                          data == null
                                  ||
                          data.length == 0
                  ) {
                      return;
                  }

                  synchronized (queue) {
                      queue.add(data);
                  }

                  drain();
              }

              void drain() {

                  if (writing) {
                      return;
                  }

                  byte[] data;

                  synchronized (queue) {
                      data = queue.poll();
                  }

                  if (data == null) {
                      return;
                  }

                  if (
                          gatt == null
                                  ||
                          writeChar == null
                  ) {

                      analyzerAppend(
                              "TX [APP]\n"
                                      + hex(data)
                                      + "\n"
                                      + "NOT SENT: FFE1 NOT READY\n"
                      );

                      return;
                  }

                  writing = true;

                  final byte[] packet =
                          data;

                  main.postDelayed(
                          new Runnable() {
                              @Override
                              public void run() {

                                  try {

                                      writeChar.setWriteType(
                                              BluetoothGattCharacteristic
                                                      .WRITE_TYPE_DEFAULT
                                      );

                                      writeChar.setValue(
                                              packet
                                      );

                                      boolean accepted =
                                              gatt.writeCharacteristic(
                                                      writeChar
                                              );

                                      analyzerAppend(
                                              "TX [APP]\n"
                                                      + hex(packet)
                                                      + "\n"
                                                      + (
                                                      accepted
                                                              ? "WRITE ACCEPTED"
                                                              : "WRITE REJECTED"
                                              )
                                                      + "\n"
                                      );

                                  } catch (Exception e) {

                                      analyzerAppend(
                                              "TX ERROR\n"
                                                      + e.getClass()
                                                      .getSimpleName()
                                                      + "\n"
                                      );
                                  }

                                  writing = false;

                                  drain();
                              }
                          },
                          90
                  );
              }

              byte[] packet(
                      int... values
              ) {

                  byte[] result =
                          new byte[values.length];

                  for (
                          int i = 0;
                          i < values.length;
                          i++
                  ) {

                      result[i] =
                              (byte) values[i];
                  }

                  return result;
              }

              byte[] powerPacket(
                      boolean on
              ) {

                  return packet(
                          0x7B,
                          0xFF,
                          0x04,
                          on ? 0x01 : 0x00,
                          0xFF,
                          0xFF,
                          0xFF,
                          0xFF,
                          0xBF
                  );
              }

              byte[] rgbPacket(
                      int r,
                      int g,
                      int b
              ) {

                  return packet(
                          0x7B,
                          0xFF,
                          0x07,
                          r,
                          g,
                          b,
                          0x00,
                          0xFF,
                          0xBF
                  );
              }

              byte[] brightnessPacket(
                      int percent
              ) {

                  percent =
                          Math.max(
                                  0,
                                  Math.min(
                                          100,
                                          percent
                                  )
                          );

                  int level =
                          (percent * 32) / 100;

                  return packet(
                          0x7B,
                          0xFF,
                          0x01,
                          level,
                          percent,
                          0x00,
                          0xFF,
                          0xFF,
                          0xBF
                  );
              }

              byte[] speedPacket(
                      int value
              ) {

                  value =
                          Math.max(
                                  0,
                                  Math.min(
                                          255,
                                          value
                                  )
                          );

                  return packet(
                          0x7B,
                          0xFF,
                          0x02,
                          value,
                          0x00,
                          0xFF,
                          0xFF,
                          0xFF,
                          0xBF
                  );
              }

              byte[] modePacket(
                      int mode
              ) {

                  mode =
                          Math.max(
                                  0,
                                  Math.min(
                                          210,
                                          mode
                                  )
                          );

                  return packet(
                          0x7B,
                          0xFF,
                          0x03,
                          mode,
                          0xFF,
                          0xFF,
                          0xFF,
                          0xFF,
                          0xBF
                  );
              }

              byte[] micPacket(
                      int mode
              ) {

                  mode =
                          Math.max(
                                  0,
                                  Math.min(
                                          255,
                                          mode
                                  )
                          );

                  return packet(
                          0x7B,
                          0xFF,
                          0x0B,
                          mode,
                          0x00,
                          0xFF,
                          0xFF,
                          0xFF,
                          0xBF
                  );
              }

              void setRgb() {

                  try {

                      String value =
                              rgbBox
                                      .getText()
                                      .toString()
                                      .trim()
                                      .replace(
                                              "#",
                                              ""
                                      );

                      if (value.length() != 6) {
                          throw new Exception();
                      }

                      int rgb =
                              Integer.parseInt(
                                      value,
                                      16
                              );

                      send(
                              rgbPacket(
                                      (rgb >> 16) & 255,
                                      (rgb >> 8) & 255,
                                      rgb & 255
                              )
                      );

                  } catch (Exception e) {

                      Toast.makeText(
                              this,
                              "HEX harus RRGGBB",
                              Toast.LENGTH_SHORT
                      ).show();
                  }
              }

              void applyCustom(
                      String text,
                      int mode,
                      boolean forward
              ) {

                  String[] colors =
                          text.split(",");

                  ArrayList<Integer> values =
                          new ArrayList<>();

                  for (
                          String color
                          : colors
                  ) {

                      try {

                          String value =
                                  color
                                          .trim()
                                          .replace(
                                                  "#",
                                                  ""
                                          );

                          if (
                                  value.length() == 6
                          ) {

                              values.add(
                                      Integer.parseInt(
                                              value,
                                              16
                                      )
                              );
                          }

                      } catch (Exception ignored) {
                      }
                  }

                  if (
                          values.size() < 1
                                  ||
                          values.size() > 16
                  ) {

                      Toast.makeText(
                              this,
                              "Masukkan 1-16 warna HEX",
                              Toast.LENGTH_SHORT
                      ).show();

                      return;
                  }

                  for (
                          int i = 0;
                          i < values.size();
                          i++
                  ) {

                      int rgb =
                              values.get(i);

                      send(
                              packet(
                                      0x7B,
                                      i + 1,
                                      0x0E,
                                      0xFD,
                                      (rgb >> 16) & 255,
                                      (rgb >> 8) & 255,
                                      rgb & 255,
                                      values.size(),
                                      0xBF
                              )
                      );
                  }

                  send(
                          packet(
                                  0x7B,
                                  0xFF,
                                  0x13,
                                  mode,
                                  0xFF,
                                  0xFF,
                                  0xFF,
                                  0xFF,
                                  0xBF
                          )
                  );

                  send(
                          packet(
                                  0x7B,
                                  0xFF,
                                  0x0D,
                                  forward ? 0 : 1,
                                  0xFF,
                                  0xFF,
                                  0xFF,
                                  0xFF,
                                  0xBF
                          )
                  );

                  Toast.makeText(
                          this,
                          "CUSTOM dikirim ke modul",
                          Toast.LENGTH_SHORT
                  ).show();
              }

              byte[] parseHex(
                      String text
              ) {

                  if (
                          text == null
                                  ||
                          text.trim().isEmpty()
                  ) {
                      return null;
                  }

                  String cleaned =
                          text
                                  .replace(
                                          ",",
                                          " "
                                  )
                                  .trim();

                  String[] parts =
                          cleaned.split(
                                  "\\s+"
                          );

                  byte[] result =
                          new byte[parts.length];

                  try {

                      for (
                              int i = 0;
                              i < parts.length;
                              i++
                      ) {

                          result[i] =
                                  (byte)
                                          Integer.parseInt(
                                                  parts[i],
                                                  16
                                          );
                      }

                  } catch (Exception e) {

                      return null;
                  }

                  return result;
              }

              String hex(
                      byte[] data
              ) {

                  if (data == null) {
                      return "";
                  }

                  StringBuilder result =
                          new StringBuilder();

                  for (
                          byte b
                          : data
                  ) {

                      result.append(
                              String.format(
                                      Locale.US,
                                      "%02X ",
                                      b & 255
                              )
                      );
                  }

                  return result
                          .toString()
                          .trim();
              }

              void inspectGatt() {

                  if (gatt == null) {

                      Toast.makeText(
                              this,
                              "Belum connected",
                              Toast.LENGTH_SHORT
                      ).show();

                      return;
                  }

                  StringBuilder result =
                          new StringBuilder();

                  result.append(
                          "SOURCE = MODULE DEVICE\n\n"
                  );

                  for (
                          BluetoothGattService service
                          : gatt.getServices()
                  ) {

                      result.append(
                              "SERVICE\n"
                      );

                      result.append(
                              service.getUuid()
                      );

                      result.append(
                              "\n"
                      );

                      for (
                              BluetoothGattCharacteristic characteristic
                              : service.getCharacteristics()
                      ) {

                          result.append(
                                  "  CHAR "
                          );

                          result.append(
                                  characteristic.getUuid()
                          );

                          result.append(
                                  " PROPS="
                          );

                          result.append(
                                  characteristic.getProperties()
                          );

                          result.append(
                                  "\n"
                          );
                      }

                      result.append(
                              "\n"
                      );
                  }

                  analyzerAppend(
                          result.toString()
                  );

                  Toast.makeText(
                          this,
                          "GATT data dibaca dari module",
                          Toast.LENGTH_SHORT
                  ).show();
              }

              @Override
              protected void onDestroy() {

                  super.onDestroy();

                  try {

                      if (scanner != null && scanning) {
                          scanner.stopScan(scanCallback);
                      }

                  } catch (Exception ignored) {
                  }

                  try {

                      if (gatt != null) {
                          gatt.close();
                      }

                  } catch (Exception ignored) {
                  }
              }
          }
          EOF

