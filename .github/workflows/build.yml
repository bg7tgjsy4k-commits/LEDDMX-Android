              fun parseHex(s:String):ByteArray {
                  val clean=s
                      .replace("0x","",true)
                      .replace("[^0-9A-Fa-f]".toRegex()," ")

                  val tokens=clean
                      .trim()
                      .split(Regex("\\s+"))
                      .filter{it.isNotBlank()}

                  return try {
                      tokens.map {
                          it.toInt(16).toByte()
                      }.toByteArray()
                  } catch(e:Exception) {
                      ByteArray(0)
                  }
              }

              fun hex(vararg values:Int):ByteArray {
                  return values.map{
                      it.coerceIn(0,255).toByte()
                  }.toByteArray()
              }

