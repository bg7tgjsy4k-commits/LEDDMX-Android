              private class PreviewView extends View {

                  private int index=0;
                  private final Handler h=new Handler();

                  PreviewView(Context c) {
                      super(c);
                  }

                  protected void onDraw(
                          android.graphics.Canvas c) {

                      super.onDraw(c);

                      if(frames.isEmpty()) return;

                      Frame f=frames.get(
                              Math.min(index,frames.size()-1));

                      android.graphics.Paint p=
                              new android.graphics.Paint();

                      p.setColor(f.left);
                      c.drawRect(
                              0,0,
                              getWidth()/2,
                              getHeight(),
                              p);

                      p.setColor(f.right);

                      c.drawRect(
                              getWidth()/2,
                              0,
                              getWidth(),
                              getHeight(),
                              p);

                      p.setColor(Color.WHITE);
                      p.setTextSize(18);

                      c.drawText(
                              "LEFT",
                              20,
                              30,
                              p);

                      c.drawText(
                              "RIGHT",
                              getWidth()/2+20,
                              30,
                              p);
                  }

                  void play() {

                      stop();

                      Runnable r=new Runnable() {

                          public void run() {

                              if(!playing ||
                                      frames.isEmpty()) {
                                  return;
                              }

                              invalidate();

                              Frame f=frames.get(index);

                              index=(index+1)%frames.size();

                              h.postDelayed(
                                      this,
                                      Math.max(50,f.duration));
                          }
                      };

                      h.post(r);
                  }

                  void stop() {
                      h.removeCallbacksAndMessages(null);
                  }

                  void restart() {
                      index=0;
                      invalidate();
                      play();
                  }
              }

              private void playToLed() {

                  if(frames.isEmpty()) return;

                  playing=true;

                  handler.removeCallbacksAndMessages(null);

                  handler.post(new Runnable() {

                      int i=0;

                      public void run() {

                          if(!playing ||
                                  frames.isEmpty()) {
                              return;
                          }

                          Frame f=frames.get(
                                  i%frames.size());

                          /*
                           * IMPORTANT:
                           *
                           * Independent LEFT/RIGHT BLE command
                           * has not been proven for this controller.
                           *
                           * Therefore we do NOT invent 0x08.
                           *
                           * We combine both editor colors into one
                           * proven RGB 0x07 command.
                           */

                          int r =
                                  (Color.red(f.left)+
                                  Color.red(f.right))/2;

                          int g =
                                  (Color.green(f.left)+
                                  Color.green(f.right))/2;

                          int b =
                                  (Color.blue(f.left)+
                                  Color.blue(f.right))/2;

                          sendRgb(r,g,b);

                          i++;

                          handler.postDelayed(
                                  this,
                                  Math.max(50,f.duration));
                      }
                  });
              }

