              private byte[] parseHex(
                      String input
              ) {
                  String cleaned =
                          input
                                  .trim();

                  if (cleaned.isEmpty()) {
                      throw new IllegalArgumentException();
                  }

                  String[] parts =
                          cleaned.split(
                                  "[,\\s]+"
                          );

                  byte[] result =
                          new byte[parts.length];

                  for (
                          int i = 0;
                          i < parts.length;
                          i++
                  ) {
                      String value =
                              parts[i]
                                      .trim();

                      if (
                              value.startsWith(
                                      "0x"
                              )
                      ) {
                          value =
                                  value.substring(
                                          2
                                  );
                      }

                      if (
                              value.length() > 2
                      ) {
                          throw new IllegalArgumentException();
                      }

                      result[i] =
                              (byte)
                                      Integer.parseInt(
                                              value,
                                              16
                                      );
                  }

                  return result;
              }

              private void log(
                      String message
              ) {
                  String timestamp =
                          new SimpleDateFormat(
                                  "HH:mm:ss.SSS",
                                  Locale.US
                          ).format(
                                  new Date()
                          );

                  terminal.add(
                          timestamp
                                  + "  "
                                  + message
                  );

                  while (
                          terminal.size() > 300
                  ) {
                      terminal.remove(0);
                  }
              }

              private String terminalText() {
                  StringBuilder text =
                          new StringBuilder();

                  for (
                          String line :
                          terminal
                  ) {
                      text.append(line)
                              .append("\n");
                  }

                  if (
                          text.length() == 0
                  ) {
                      return "NOT EXPOSED BY DEVICE";
                  }

                  return text.toString();
              }

              private String hex(
                      byte[] data
              ) {
                  if (
                          data == null
                  ) {
                      return "";
                  }

                  StringBuilder result =
                          new StringBuilder();

                  for (
                          byte value :
                          data
                  ) {
                      result.append(
                                      String.format(
                                              Locale.US,
                                              "%02X",
                                              value & 0xFF
                                      )
                              )
                              .append(" ");
                  }

                  return result.toString()
                          .trim();
              }

