              // ====================================================

              private void showModes() {

                  page("210 EFFECTS");

                  add(
                          text(
                                  "MODE 1–210\n" +
                                  "Nama diambil dari PatternList LEDDMX.\n" +
                                  "Tap untuk mengirim command asli ke module.",
                                  14
                          )
                  );

                  EditText search =
                          new EditText(this);

                  search.setTextColor(Color.WHITE);
                  search.setHintTextColor(Color.GRAY);
                  search.setHint(
                          "Cari nomor / nama effect..."
                  );

                  add(search);

                  LinearLayout list =
                          vertical();

                  add(list);

                  Runnable rebuild =
                          () -> {

                              list.removeAllViews();

                              String q =
                                      search.getText()
                                              .toString()
                                              .toLowerCase(
                                                      Locale.US
                                              );

                              for (int mode = 1;
                                   mode <= 210;
                                   mode++) {

                                  String name =
                                          modeName(mode);

                                  String item =
                                          String.format(
                                                  Locale.US,
                                                  "%03d  %s",
                                                  mode,
                                                  name
                                          );

                                  if (!q.isEmpty() &&
                                          !item.toLowerCase(
                                                  Locale.US
                                          ).contains(q)) {
                                      continue;
                                  }

                                  Button b =
                                          button(item);

                                  b.setOnClickListener(
                                          v -> {

                                              selectedMode =
                                                      mode;

                                              sendMode(mode);

                                              toast(
                                                      "MODE " +
                                                              mode
                                              );
                                          }
                                  );

                                  list.addView(
                                          b,
                                          new LinearLayout.LayoutParams(
                                                  ViewGroup.LayoutParams.MATCH_PARENT,
                                                  60
                                          )
                                  );
                              }
                          };

                  rebuild.run();

                  search.addTextChangedListener(
                          new TextWatcher() {

                              public void beforeTextChanged(
                                      CharSequence s,
                                      int a,
                                      int b,
                                      int c) {}

                              public void onTextChanged(
                                      CharSequence s,
                                      int a,
                                      int b,
                                      int c) {

                                  rebuild.run();
                              }

                              public void afterTextChanged(
                                      Editable e) {}
                          }
                  );
              }

              private String modeName(int mode) {

                  if (mode >= 1 &&
                          mode <= 210 &&
                          PatternList.NAMES.length >= 211) {

                      return PatternList.NAMES[mode];
                  }

                  return "LEDDMX EFFECT " +
                          String.format(
                                  Locale.US,
                                  "%03d",
                                  mode
                          );
              }

