              private void showRaw() {

                  final EditText input =
                          new EditText(this);

                  input.setHint(
                          "7B FF 07 FF 00 00 BF");

                  input.setTextColor(
                          Color.WHITE);

                  input.setInputType(
                          InputType.TYPE_CLASS_TEXT);

                  new AlertDialog.Builder(this)
                          .setTitle("RAW HEX")
                          .setView(input)
                          .setPositiveButton(
                                  "SEND",
                                  (d,w) -> {

                                      try {

                                          String[] p =
                                                  input.getText()
                                                          .toString()
                                                          .trim()
                                                          .split(
                                                                  "\\s+");

                                          byte[] packet =
                                                  new byte[p.length];

                                          for (int i = 0;
                                               i < p.length;
                                               i++) {

                                              packet[i] =
                                                      (byte)
                                                      Integer.parseInt(
                                                              p[i],
                                                              16);
                                          }

                                          send(packet);

                                      } catch (Exception e) {

                                          toast(
                                                  "Format HEX salah.");
                                      }
                                  })
                          .setNegativeButton(
                                  "CANCEL",
                                  null)
                          .show();
              }

              private void basePage(
                      String title) {

                  stopPreview();

                  LinearLayout root =
                          vertical();

                  root.setBackgroundColor(
                          Color.rgb(
                                  8,
                                  9,
                                  11));

                  LinearLayout top =
                          horizontal();

                  TextView t =
                          text(
                                  title,
                                  21);

                  t.setTypeface(
                          null,
                          android.graphics.Typeface.BOLD);

                  top.addView(
                          t,
                          new LinearLayout.LayoutParams(
                                  0,
                                  64,
                                  1f));

                  connectionText =
                          text(
                                  connected
                                          ? "● CONNECTED"
                                          : "○ OFFLINE",
                                  12);

                  connectionText.setGravity(
                          Gravity.CENTER);

                  top.addView(
                          connectionText,
                          new LinearLayout.LayoutParams(
                                  125,
                                  64));

                  root.addView(top);

                  ScrollView scroll =
                          new ScrollView(this);

                  content =
                          vertical();

                  content.setPadding(
                          10,
                          4,
                          10,
                          20);

                  scroll.addView(content);

                  root.addView(
                          scroll,
                          new LinearLayout.LayoutParams(
                                  ViewGroup.LayoutParams.MATCH_PARENT,
                                  0,
                                  1f));

                  LinearLayout nav =
                          horizontal();

                  String[] names = {
                          "HOME",
                          "MODES",
                          "CUSTOM",
                          "AI",
                          "SETTINGS"
                  };

                  for (String n : names) {

                      Button b =
                              button(n);

                      nav.addView(
                              b,
                              new LinearLayout.LayoutParams(
                                      0,
                                      62,
                                      1f));

                      if (n.equals("HOME")) {

                          b.setOnClickListener(
                                  v -> showHome());

                      } else if (
                              n.equals("MODES")) {

                          b.setOnClickListener(
                                  v -> showModes());

                      } else if (
                              n.equals("CUSTOM")) {

                          b.setOnClickListener(
                                  v -> showCustom());

                      } else if (
                              n.equals("AI")) {

                          b.setOnClickListener(
                                  v -> showAI());

                      } else {

                          b.setOnClickListener(
                                  v -> showSettings());
                      }
                  }

                  root.addView(nav);

                  setContentView(root);
              }

