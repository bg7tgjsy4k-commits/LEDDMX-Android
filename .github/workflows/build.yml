              private void openMore(
                      View anchor) {

                  PopupMenu popup =
                      new PopupMenu(
                          this,
                          anchor
                      );

                  popup.getMenu().add(
                      "SCAN BLUETOOTH"
                  );

                  popup.getMenu().add(
                      "DISCONNECT"
                  );

                  popup.getMenu().add(
                      "MODULE ANALYZER"
                  );

                  popup.getMenu().add(
                      "RAW HEX"
                  );

                  popup.setOnMenuItemClickListener(
                      item -> {

                          String s =
                              item.getTitle()
                                  .toString();

                          if(s.equals(
                              "SCAN BLUETOOTH"
                          )) {
                              startScan();
                          }

                          else if(s.equals(
                              "DISCONNECT"
                          )) {
                              disconnect();
                          }

                          else {
                              showAnalyzer();
                          }

                          return true;
                      }
                  );

                  popup.show();
              }

