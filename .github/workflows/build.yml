                  @Override
                  protected void onDraw(
                          Canvas canvas
                  ) {
                      int count = 40;

                      float width =
                              getWidth()
                                      / (
                                      float
                                              count
                              );

                      for (
                              int i = 0;
                              i < count;
                              i++
                      ) {
                          float hue =
                                  (
                                          i * 9
                                                  + phase
                                  ) % 360;

                          paint.setColor(
                                  Color.HSVToColor(
                                          new float[]{
                                                  hue,
                                                  1f,
