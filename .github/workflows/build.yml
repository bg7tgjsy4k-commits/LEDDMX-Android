name: LEDDMX AI PRO FINAL

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Create Android project
        shell: bash
        run: |
          set -e

          rm -rf app settings.gradle build.gradle gradle.properties
          mkdir -p app/src/main/java/com/leddmx/aipro
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/assets

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "LEDDMX-AI-PRO"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.leddmx.aipro'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.leddmx.aipro'
                  minSdk 23
                  targetSdk 35
                  versionCode 100
                  versionName '10.0 FINAL'
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
                  debug {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.15.0'
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-feature
                  android:name="android.hardware.bluetooth_le"
                  android:required="false" />

              <uses-permission android:name="android.permission.BLUETOOTH" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" />

              <uses-permission
                  android:name="android.permission.BLUETOOTH_SCAN"
                  android:usesPermissionFlags="neverForLocation" />

              <uses-permission
                  android:name="android.permission.BLUETOOTH_CONNECT" />

              <uses-permission
                  android:name="android.permission.ACCESS_FINE_LOCATION" />

              <application
                  android:theme="@style/AppTheme"
                  android:label="LEDDMX AI PRO"
                  android:allowBackup="false"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>
          </manifest>
          EOF

          mkdir -p app/src/main/res/values

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">#090B10</item>
                  <item name="android:navigationBarColor">#050609</item>
                  <item name="android:colorAccent">#AFC7FF</item>
                  <item name="android:windowBackground">#07090D</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/res/drawable/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="rectangle">
              <solid android:color="#11151D"/>
              <corners android:radius="20dp"/>
          </shape>
          EOF

          echo "Downloading official LEDDMX pattern list..."

          curl -L --fail --retry 3 \
            https://raw.githubusercontent.com/user154lt/LEDDMX-00/main/PatternList.kt \
            -o /tmp/PatternList.kt

          python3 - <<'PY'
          import re
          src=open('/tmp/PatternList.kt','r',encoding='utf-8').read()
          strings=re.findall(r'"((?:\\.|[^"\\])*)"',src)
          out=[]
          for s in strings:
              try:
                  s=bytes(s,'utf8').decode('unicode_escape')
              except:
                  pass
              s=s.strip()
              if s:
                  out.append(s)
          open('app/src/main/assets/patterns.txt','w',encoding='utf8').write('\n'.join(out))
          print("PATTERN COUNT:",len(out))
          PY

          cat > app/src/main/java/com/leddmx/aipro/MainActivity.kt <<'EOF'
          package com.leddmx.aipro

          import android.Manifest
          import android.app.*
          import android.bluetooth.*
          import android.bluetooth.le.*
          import android.content.*
          import android.content.pm.PackageManager
          import android.graphics.*
          import android.graphics.drawable.GradientDrawable
          import android.os.*
          import android.provider.Settings
          import android.view.*
          import android.widget.*
          import androidx.core.app.ActivityCompat
          import androidx.core.content.ContextCompat
          import java.util.*
          import kotlin.math.*

          class MainActivity : Activity() {

              companion object {
                  const val REQ = 9001
                  val SERVICE = UUID.fromString("0000FFE0-0000-1000-8000-00805F9B34FB")
                  val WRITE = UUID.fromString("0000FFE1-0000-1000-8000-00805F9B34FB")

                  val OTA_SERVICE =
                      UUID.fromString("5833FF01-9B8B-5191-6142-22A4536EF123")

                  val OTA_WRITE =
                      UUID.fromString("5833FF02-9B8B-5191-6142-22A4536EF123")

                  val OTA_NOTIFY =
                      UUID.fromString("5833FF03-9B8B-5191-6142-22A4536EF123")
              }

              lateinit var root: FrameLayout
              lateinit var content: LinearLayout
              lateinit var status: TextView
              lateinit var drawer: LinearLayout

              var scanner: BluetoothLeScanner? = null
              var scanning = false
              var lastScan = 0L

              var gatt: BluetoothGatt? = null
              var writeChar: BluetoothGattCharacteristic? = null
              var connectedName = "DISCONNECTED"

              var red = 255
              var green = 40
              var blue = 40
              var brightness = 43
              var speed = 202

              var currentPage = "HOME"

              val deviceList = mutableListOf<BluetoothDevice>()
              val txLog = mutableListOf<String>()
              val rxLog = mutableListOf<String>()

              val prefs by lazy {
                  getSharedPreferences("leddmx", MODE_PRIVATE)
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  window.statusBarColor = Color.rgb(8,10,14)
                  window.navigationBarColor = Color.rgb(4,5,8)

                  buildRoot()
                  requestPermissionsIfNeeded()
                  showHome()
              }

              fun buildRoot() {
                  root = FrameLayout(this)
                  root.setBackgroundColor(Color.rgb(7,9,13))

                  val main = LinearLayout(this)
                  main.orientation = LinearLayout.VERTICAL

                  val bar = LinearLayout(this)
                  bar.orientation = LinearLayout.HORIZONTAL
                  bar.gravity = Gravity.CENTER_VERTICAL
                  bar.setPadding(dp(14),dp(10),dp(12),dp(8))

                  val menu = TextView(this)
                  menu.text = "☰"
                  menu.textSize = 32f
                  menu.setTextColor(Color.WHITE)
                  menu.gravity = Gravity.CENTER
                  menu.setOnClickListener { toggleDrawer() }

                  bar.addView(menu, LinearLayout.LayoutParams(dp(58),dp(58)))

                  val title = TextView(this)
                  title.text = "LEDDMX AI PRO"
                  title.textSize = 22f
                  title.setTypeface(null,1)
                  title.setTextColor(Color.WHITE)
                  bar.addView(
                      title,
                      LinearLayout.LayoutParams(0,dp(58),1f)
                  )

                  status = TextView(this)
                  status.text = "DISCONNECTED"
                  status.textSize = 12f
                  status.setTextColor(Color.LTGRAY)
                  status.gravity = Gravity.CENTER
                  status.setPadding(dp(12),0,dp(12),0)
                  status.background = strokeBg()
                  bar.addView(
                      status,
                      LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.WRAP_CONTENT,
                          dp(42)
                      )
                  )

                  main.addView(bar)

                  val line = View(this)
                  line.setBackgroundColor(Color.rgb(35,39,48))
                  main.addView(line,LinearLayout.LayoutParams(-1,1))

                  content = LinearLayout(this)
                  content.orientation = LinearLayout.VERTICAL

                  val scroll = ScrollView(this)
                  scroll.addView(content)

                  main.addView(
                      scroll,
                      LinearLayout.LayoutParams(-1,0,1f)
                  )

                  root.addView(main)

                  drawer = LinearLayout(this)
                  drawer.orientation = LinearLayout.VERTICAL
                  drawer.setPadding(dp(20),dp(35),dp(20),dp(20))
                  drawer.setBackgroundColor(Color.rgb(12,15,21))
                  drawer.visibility = View.GONE
                  drawer.elevation = dp(20).toFloat()

                  root.addView(
                      drawer,
                      FrameLayout.LayoutParams(
                          dp(300),
                          -1,
                          Gravity.START
                      )
                  )

                  setContentView(root)
              }

              fun toggleDrawer() {
                  drawer.visibility =
                      if(drawer.visibility == View.VISIBLE)
                          View.GONE else View.VISIBLE

                  if(drawer.childCount == 0) buildDrawer()
              }

              fun buildDrawer() {
                  drawer.removeAllViews()

                  val head = TextView(this)
                  head.text = "LEDDMX AI PRO"
                  head.textSize = 23f
                  head.setTypeface(null,1)
                  head.setTextColor(Color.WHITE)
                  head.setPadding(0,0,0,dp(20))
                  drawer.addView(head)

                  drawerButton("⌂  HOME") { showHome() }
                  drawerButton("✨  EFFECTS 1–210") { showEffects() }
                  drawerButton("🎨  CUSTOM STUDIO") { showCustom() }
                  drawerButton("💾  MY MODES 171–210") { showSlots() }
                  drawerButton("🤖  AI SCENE") { showAI() }

                  val sep = View(this)
                  sep.setBackgroundColor(Color.rgb(40,44,52))
                  drawer.addView(
                      sep,
                      LinearLayout.LayoutParams(-1,dp(1))
                  )

                  drawerButton("🔧  MODULE / MCU ANALYZER") {
                      showAnalyzer()
                  }

                  drawerButton("📡  GATT / BLE INSPECTOR") {
                      showGatt()
                  }

                  drawerButton("HEX  PROTOCOL LAB") {
                      showProtocol()
                  }

                  drawerButton("⬆  OTA / FIRMWARE") {
                      showOTA()
                  }

                  drawerButton("⚙  SETTINGS") {
                      showSettings()
                  }
              }

              fun drawerButton(text:String, action:()->Unit) {
                  val b = TextView(this)
                  b.text = text
                  b.textSize = 15f
                  b.setTextColor(Color.WHITE)
                  b.gravity = Gravity.CENTER_VERTICAL
                  b.setPadding(dp(12),0,dp(8),0)
                  b.setOnClickListener {
                      drawer.visibility = View.GONE
                      action()
                  }
                  drawer.addView(
                      b,
                      LinearLayout.LayoutParams(-1,dp(54))
                  )
              }

              fun baseTitle(name:String, subtitle:String="") {
                  content.removeAllViews()

                  val h = TextView(this)
                  h.text = name
                  h.textSize = 26f
                  h.setTypeface(null,1)
                  h.setTextColor(Color.WHITE)
                  h.setPadding(dp(16),dp(14),dp(16),dp(4))
                  content.addView(h)

                  if(subtitle.isNotEmpty()) {
                      val s = TextView(this)
                      s.text = subtitle
                      s.textSize = 13f
                      s.setTextColor(Color.GRAY)
                      s.setPadding(dp(16),0,dp(16),dp(15))
                      content.addView(s)
                  }
              }

              fun showHome() {
                  currentPage = "HOME"
                  baseTitle("Control Center","Bluetooth LED controller")

                  val power = card("POWER")

                  val on = button("POWER ON")
                  on.setOnClickListener {
                      send(hex(
                          0x7B,0xFF,0x04,0x01,
                          0xFF,0xFF,0xFF,0xFF,0xBF
                      ))
                  }

                  val off = button("POWER OFF")
                  off.setOnClickListener {
                      send(hex(
                          0x7B,0xFF,0x04,0x00,
                          0xFF,0xFF,0xFF,0xFF,0xBF
                      ))
                  }

                  row(power,on,off)

                  val rgb = card("RGB COLOUR")

                  val wheel = ColorWheelView(this)
                  wheel.setColor(red,green,blue)
                  wheel.onColorChanged = { r,g,b ->
                      red=r
                      green=g
                      blue=b
                      sendRGB()
                  }

                  rgb.addView(
                      wheel,
                      LinearLayout.LayoutParams(-1,dp(245))
                  )

                  val quick = LinearLayout(this)
                  quick.orientation = LinearLayout.HORIZONTAL

                  val rr=button("RED")
                  rr.setOnClickListener { setColor(255,0,0) }

                  val gg=button("GREEN")
                  gg.setOnClickListener { setColor(0,255,0) }

                  val bb=button("BLUE")
                  bb.setOnClickListener { setColor(0,0,255) }

                  val ww=button("WHITE")
                  ww.setOnClickListener { setColor(255,255,255) }

                  quick.addView(rr,LinearLayout.LayoutParams(0,dp(52),1f))
                  quick.addView(gg,LinearLayout.LayoutParams(0,dp(52),1f))
                  quick.addView(bb,LinearLayout.LayoutParams(0,dp(52),1f))
                  quick.addView(ww,LinearLayout.LayoutParams(0,dp(52),1f))

                  rgb.addView(quick)

                  content.addView(rgb)

                  val ctl=card("BRIGHTNESS / SPEED")

                  val brightLabel=TextView(this)
                  brightLabel.setTextColor(Color.WHITE)
                  brightLabel.textSize=15f
                  brightLabel.text="BRIGHTNESS $brightness%"
                  ctl.addView(brightLabel)

                  val bs=SeekBar(this)
                  bs.max=100
                  bs.progress=brightness
                  bs.setOnSeekBarChangeListener(
                      object:SeekBar.OnSeekBarChangeListener {
                          override fun onProgressChanged(
                              s:SeekBar?,v:Int,from:Boolean
                          ) {
                              brightness=v
                              brightLabel.text="BRIGHTNESS $v%"
                          }
                          override fun onStartTrackingTouch(s:SeekBar?){}
                          override fun onStopTrackingTouch(s:SeekBar?) {
                              sendBrightness()
                          }
                      }
                  )
                  ctl.addView(bs)

                  val speedLabel=TextView(this)
                  speedLabel.setTextColor(Color.WHITE)
                  speedLabel.textSize=15f
                  speedLabel.text="SPEED $speed"
                  ctl.addView(speedLabel)

                  val ss=SeekBar(this)
                  ss.max=255
                  ss.progress=speed
                  ss.setOnSeekBarChangeListener(
                      object:SeekBar.OnSeekBarChangeListener {
                          override fun onProgressChanged(
                              s:SeekBar?,v:Int,from:Boolean
                          ) {
                              speed=v
                              speedLabel.text="SPEED $v"
                          }
                          override fun onStartTrackingTouch(s:SeekBar?){}
                          override fun onStopTrackingTouch(s:SeekBar?) {
                              sendSpeed()
                          }
                      }
                  )
                  ctl.addView(ss)

                  content.addView(ctl)

                  val connect=button("SCAN BLUETOOTH DEVICES")
                  connect.setOnClickListener { startScan(true) }
                  content.addView(connect)

                  val device=button("CONNECT LAST / SELECTED DEVICE")
                  device.setOnClickListener {
                      if(deviceList.isNotEmpty()) {
                          showDevices()
                      } else {
                          startScan(true)
                      }
                  }
                  content.addView(device)
              }

              fun showDevices() {
                  val d=Dialog(this)
                  val box=LinearLayout(this)
                  box.orientation=LinearLayout.VERTICAL
                  box.setPadding(dp(20),dp(20),dp(20),dp(20))
                  box.setBackgroundColor(Color.rgb(12,15,21))

                  val title=TextView(this)
                  title.text="BLUETOOTH DEVICES"
                  title.textSize=21f
                  title.setTypeface(null,1)
                  title.setTextColor(Color.WHITE)
                  box.addView(title)

                  val info=TextView(this)
                  info.text="Select the LED module to connect"
                  info.setTextColor(Color.GRAY)
                  box.addView(info)

                  val scroll=ScrollView(this)
                  val list=LinearLayout(this)
                  list.orientation=LinearLayout.VERTICAL

                  for(dev in deviceList) {
                      val b=button(
                          try {
                              val n=dev.name
                              if(n.isNullOrBlank()) dev.address else "$n\n${dev.address}"
                          } catch(e:Exception) {
                              dev.address
                          }
                      )

                      b.setOnClickListener {
                          d.dismiss()
                          connect(dev)
                      }

                      list.addView(b)
                  }

                  scroll.addView(list)
                  box.addView(
                      scroll,
                      LinearLayout.LayoutParams(-1,dp(400))
                  )

                  val close=button("CLOSE")
                  close.setOnClickListener { d.dismiss() }
                  box.addView(close)

                  d.setContentView(box)
                  d.window?.setBackgroundDrawableResource(android.R.color.transparent)
                  d.show()
              }

              fun showEffects() {
                  currentPage="EFFECTS"
                  baseTitle(
                      "210 EFFECTS",
                      "Official LEDDMX pattern names"
                  )

                  val search=EditText(this)
                  search.hint="Search effect..."
                  search.setTextColor(Color.WHITE)
                  search.setHintTextColor(Color.GRAY)
                  search.setPadding(dp(16),0,dp(16),0)
                  search.background=strokeBg()
                  content.addView(
                      search,
                      LinearLayout.LayoutParams(-1,dp(55))
                  )

                  val list=LinearLayout(this)
                  list.orientation=LinearLayout.VERTICAL
                  content.addView(list)

                  val names=loadPatterns()

                  fun render(filter:String="") {
                      list.removeAllViews()

                      names.forEachIndexed { index,name ->
                          if(filter.isNotEmpty() &&
                              !name.contains(filter,true)) return@forEachIndexed

                          val b=button(
                              "${index+1}.  $name"
                          )

                          b.setOnClickListener {
                              sendMode(index+1)
                              showEffectPreview(index+1,name)
                          }

                          list.addView(b)
                      }
                  }

                  search.addTextChangedListener(
                      object:android.text.TextWatcher {
                          override fun beforeTextChanged(
                              s:CharSequence?,st:Int,c:Int,a:Int){}
                          override fun onTextChanged(
                              s:CharSequence?,st:Int,b:Int,c:Int
                          ){
                              render(s?.toString() ?: "")
                          }
                          override fun afterTextChanged(
                              e:android.text.Editable?){}
                      }
                  )

                  render()
              }

              fun showEffectPreview(mode:Int,name:String) {
                  val d=Dialog(this)

                  val box=LinearLayout(this)
                  box.orientation=LinearLayout.VERTICAL
                  box.setPadding(dp(20),dp(20),dp(20),dp(20))
                  box.setBackgroundColor(Color.rgb(9,11,16))

                  val t=TextView(this)
                  t.text="$mode  •  $name"
                  t.textSize=19f
                  t.setTypeface(null,1)
                  t.setTextColor(Color.WHITE)
                  box.addView(t)

                  val preview=ModePreviewView(this)
                  preview.start(mode)

                  box.addView(
                      preview,
                      LinearLayout.LayoutParams(-1,dp(150))
                  )

                  val sendb=button("APPLY MODE $mode")
                  sendb.setOnClickListener {
                      sendMode(mode)
                      d.dismiss()
                  }
                  box.addView(sendb)

                  val close=button("CLOSE")
                  close.setOnClickListener { d.dismiss() }
                  box.addView(close)

                  d.setContentView(box)
                  d.window?.setBackgroundDrawableResource(
                      android.R.color.transparent
                  )
                  d.show()
              }

              fun showCustom() {
                  currentPage="CUSTOM"
                  baseTitle(
                      "CUSTOM STUDIO",
                      "Create and preview your animation"
                  )

                  val preview=StripPreviewView(this)
                  content.addView(
                      preview,
                      LinearLayout.LayoutParams(-1,dp(155))
                  )

                  val target=card("OUTPUT")

                  val whole=button("WHOLE")
                  val left=button("LEFT")
                  val right=button("RIGHT")
                  val both=button("BOTH")

                  var selected="BOTH"

                  fun refresh() {
                      whole.text=if(selected=="WHOLE")"✓ WHOLE" else "WHOLE"
                      left.text=if(selected=="LEFT")"✓ LEFT" else "LEFT"
                      right.text=if(selected=="RIGHT")"✓ RIGHT" else "RIGHT"
                      both.text=if(selected=="BOTH")"✓ BOTH" else "BOTH"
                  }

                  whole.setOnClickListener {
                      selected="WHOLE"
                      refresh()
                  }
                  left.setOnClickListener {
                      selected="LEFT"
                      refresh()
                  }
                  right.setOnClickListener {
                      selected="RIGHT"
                      refresh()
                  }
                  both.setOnClickListener {
                      selected="BOTH"
                      refresh()
                  }

                  row(target,whole,left,right,both)

                  content.addView(target)

                  val colors=card("COLOURS")

                  val wheel=ColorWheelView(this)
                  wheel.setColor(red,green,blue)
                  wheel.onColorChanged={r,g,b->
                      red=r
                      green=g
                      blue=b
                      preview.primary=Color.rgb(r,g,b)
                      preview.invalidate()
                  }

                  colors.addView(
                      wheel,
                      LinearLayout.LayoutParams(-1,dp(230))
                  )

                  val add=button("ADD CURRENT COLOUR")
                  add.setOnClickListener {
                      preview.colors.add(
                          Color.rgb(red,green,blue)
                      )
                      preview.invalidate()
                  }
                  colors.addView(add)

                  content.addView(colors)

                  val templates=card("ANIMATION TEMPLATES")

                  val templateNames=arrayOf(
                      "RAINBOW",
                      "WAVE",
                      "CHASE",
                      "COMET",
                      "SCANNER",
                      "MIRROR",
                      "PULSE",
                      "COLOUR CYCLE",
                      "STRIPE / BELANG",
                      "FADE",
                      "POLICE",
                      "FIRE",
                      "WATER",
                      "RANDOM"
                  )

                  templateNames.forEach { n->
                      val b=button(n)
                      b.setOnClickListener {
                          preview.template=n
                          preview.restart()
                      }
                      templates.addView(b)
                  }

                  content.addView(templates)

                  val sliders=card("SPEED / BRIGHTNESS")

                  val sp=SeekBar(this)
                  sp.max=255
                  sp.progress=speed
                  sp.setOnSeekBarChangeListener(
                      object:SeekBar.OnSeekBarChangeListener{
                          override fun onProgressChanged(
                              s:SeekBar?,v:Int,f:Boolean){
                              preview.animationSpeed=v
                          }
                          override fun onStartTrackingTouch(s:SeekBar?){}
                          override fun onStopTrackingTouch(s:SeekBar?){
                              speed=preview.animationSpeed
                              sendSpeed()
                          }
                      }
                  )
                  sliders.addView(sp)

                  val br=SeekBar(this)
                  br.max=100
                  br.progress=brightness
                  br.setOnSeekBarChangeListener(
                      object:SeekBar.OnSeekBarChangeListener{
                          override fun onProgressChanged(
                              s:SeekBar?,v:Int,f:Boolean){
                              preview.animationBrightness=v
                          }
                          override fun onStartTrackingTouch(s:SeekBar?){}
                          override fun onStopTrackingTouch(s:SeekBar?){
                              brightness=preview.animationBrightness
                              sendBrightness()
                          }
                      }
                  )
                  sliders.addView(br)

                  content.addView(sliders)

                  val apply=button("APPLY CUSTOM ANIMATION")
                  apply.setOnClickListener {
                      applyCustom(preview.template)
                  }
                  content.addView(apply)

                  val save=button("SAVE PROJECT")
                  save.setOnClickListener {
                      prefs.edit()
                          .putString("custom_template",preview.template)
                          .putInt("custom_r",red)
                          .putInt("custom_g",green)
                          .putInt("custom_b",blue)
                          .apply()

                      toast("Project saved locally")
                  }
                  content.addView(save)
              }

              fun applyCustom(template:String) {
                  val map=mapOf(
                      "RAINBOW" to 1,
                      "WAVE" to 2,
                      "CHASE" to 3,
                      "COMET" to 4,
