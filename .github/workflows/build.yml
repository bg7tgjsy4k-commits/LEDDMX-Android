              // ======================================================
              // BLE SCAN
              // ======================================================

              private void scan() {

                  if (adapter == null) {

                      toast(
                              "Bluetooth tidak tersedia"
                      );

                      return;
                  }


                  if (!adapter.isEnabled()) {

                      toast(
                              "Aktifkan Bluetooth"
                      );

                      return;
                  }


                  scanner =
                          adapter.getBluetoothLeScanner();


                  if (scanner == null) {

                      toast(
                              "BLE scanner tidak tersedia"
                      );

                      return;
                  }


                  try {

                      scanner.startScan(
                              scanCallback
                      );


                      toast(
                              "Scanning LEDDMX..."
                      );


                      handler.postDelayed(
                              () -> {

                                  try {

                                      if (
                                              scanner != null
                                      ) {

                                          scanner.stopScan(
                                                  scanCallback
                                          );
                                      }

                                  } catch (Exception ignored) {
                                  }

                              },
                              10000
                      );


                  } catch (
                          SecurityException e
                  ) {

                      toast(
                              "Izin Bluetooth ditolak"
                      );
                  }
              }


              private final ScanCallback scanCallback =
                      new ScanCallback() {

                          @Override
                          public void onScanResult(
                                  int callbackType,
                                  ScanResult result
                          ) {

                              BluetoothDevice device =
                                      result.getDevice();


                              String name =
                                      null;


                              try {

                                  name =
                                          device.getName();

                              } catch (
                                      SecurityException ignored
                              ) {
                              }


                              if (
                                      name != null &&
                                      name.toUpperCase(
                                              Locale.US
                                      ).contains(
                                              "LEDDMX"
                                      )
                              ) {

                                  try {

                                      if (
                                              scanner != null
                                      ) {

                                          scanner.stopScan(
                                                  scanCallback
                                          );
                                      }

                                  } catch (Exception ignored) {
                                  }


                                  connect(
                                          device
                                  );
                              }
                          }
                      };


              // ======================================================
              // CONNECT
              // ======================================================

              private void connect(
                      BluetoothDevice device
              ) {

                  try {

                      ble.disconnect();


                      ble.gatt =
                              device.connectGatt(
                                      this,
                                      false,
                                      gattCallback,
                                      BluetoothDevice
                                              .TRANSPORT_LE
                              );


                      toast(
                              "Connecting..."
                      );


                  } catch (
                          SecurityException e
                  ) {

                      toast(
                              "Bluetooth permission denied"
                      );
                  }
              }


              // ======================================================
              // GATT
              // ======================================================

              private final BluetoothGattCallback gattCallback =
                      new BluetoothGattCallback() {

                          @Override
                          public void onConnectionStateChange(
                                  BluetoothGatt gatt,
                                  int status,
                                  int newState
                          ) {

                              if (
                                      newState ==
                                              BluetoothGatt
                                                      .STATE_CONNECTED
                              ) {

                                  ble.gatt =
                                          gatt;

                                  ble.connected =
                                          true;


                                  runOnUiThread(
                                          () -> {

                                              updateConnectionStatus();

                                              toast(
                                                      "LEDDMX CONNECTED"
                                              );
                                          }
                                  );


                                  try {

                                      gatt.discoverServices();

                                  } catch (
                                          SecurityException ignored
                                  ) {
                                  }


                              } else {

                                  ble.connected =
                                          false;


                                  runOnUiThread(
                                          thisActivity::updateConnectionStatus
                                  );
                              }
                          }


                          @Override
                          public void onServicesDiscovered(
                                  BluetoothGatt gatt,
                                  int status
                          ) {

                              BluetoothGattService service =
                                      gatt.getService(
                                              BluetoothService
                                                      .SERVICE_FFE0
                                      );


                              if (
                                      service == null
                              ) {
                                  return;
                              }


                              BluetoothGattCharacteristic characteristic =
                                      service.getCharacteristic(
                                              BluetoothService
                                                      .CHAR_FFE1
                                      );


                              if (
                                      characteristic != null
                              ) {

                                  ble.gatt =
                                          gatt;

                                  ble.writeChar =
                                          characteristic;

                                  ble.connected =
                                          true;


                                  runOnUiThread(
                                          MainActivity.this::
                                                  updateConnectionStatus
                                  );
                              }
                          }
                      };


              private final MainActivity thisActivity =
                      this;


              // ======================================================
              // MODE
              // ======================================================

              private void sendMode(
                      int mode
              ) {

                  if (
                          mode < 1 ||
                          mode > 210
                  ) {
                      return;
                  }


                  selectedMode =
                          mode;


                  byte[] packet = {

                          0x7B,

                          (byte) 0xFF,

                          0x03,

                          (byte) mode,

                          (byte) 0xFF,

                          (byte) 0xFF,

                          (byte) 0xFF,

                          (byte) 0xFF,

                          (byte) 0xBF
                  };


                  ble.send(
                          packet
                  );


                  if (
                          modeStatus != null
                  ) {

                      modeStatus.setText(
                              "MODE " +
                                      selectedMode
                      );
                  }


                  toast(
                          "MODE " +
                                  selectedMode
                  );
              }


              // ======================================================
              // COLOR
              // ======================================================

              private void sendColor(
                      int r,
                      int g,
                      int b
              ) {

                  r =
                          scaleBrightness(
                                  r
                          );

                  g =
                          scaleBrightness(
                                  g
                          );

                  b =
                          scaleBrightness(
                                  b
                          );


                  byte[] packet = {

                          0x7B,

                          (byte) 0xFF,

                          0x07,

                          (byte) clamp(r),

                          (byte) clamp(g),

                          (byte) clamp(b),

                          (byte) 0xBF
                  };


                  ble.send(
                          packet
                  );
              }


              private int scaleBrightness(
                      int value
              ) {

                  return (
                          value *
                                  brightness
                  ) / 255;
              }


              // ======================================================
              // OFF
              // ======================================================

              private void sendOff() {

                  byte[] packet = {

                          0x7B,

                          (byte) 0xFF,

                          0x07,

                          0x00,

                          0x00,

                          0x00,

                          (byte) 0xBF
                  };


                  ble.send(
                          packet
                  );


                  toast(
                          "POWER OFF"
                  );
              }


              // ======================================================
              // SEND ANIMATION
              // ======================================================

              private void sendAnimation() {

                  if (
                          frames.isEmpty()
                  ) {

                      toast(
                              "Animation kosong"
                      );

                      return;
                  }


                  stopPreview();


                  for (
                          Frame f :
                          frames
                  ) {

                      int r =
                              (
                                      f.lr +
                                              f.rr
                              ) / 2;


                      int g =
                              (
                                      f.lg +
                                              f.rg
                              ) / 2;


                      int b =
                              (
                                      f.lb +
                                              f.rb
                              ) / 2;


                      sendColor(
                              r,
                              g,
                              b
                      );


                      try {

                          Thread.sleep(
                                  Math.min(
                                          300,
                                          Math.max(
                                                  30,
                                                  f.duration
                                          )
                                  )
                          );

                      } catch (
                              InterruptedException ignored
                      ) {
                      }
                  }


                  toast(
                          "Animation sent"
                  );
              }


