              private void openDrawer() {

                  final LinearLayout drawer =
                      vertical();

                  drawer.setPadding(
                      20,35,20,25
                  );

                  drawer.setBackgroundColor(
                      Color.rgb(14,17,24)
                  );

                  TextView title =
                      text(
                          "LEDDMX AI PRO",
                          24
                      );

                  title.setTypeface(
                      null,
                      android.graphics.Typeface.BOLD
                  );

                  drawer.addView(title);

                  drawer.addView(
                      text(
                          "CONTROL MENU",
                          12
                      )
                  );

                  String[] items = {
                      "HOME",
                      "210 EFFECTS",
                      "CUSTOM STUDIO",
                      "AI SCENE COMPOSER",
                      "MODULE / MCU ANALYZER",
                      "SETTINGS"
                  };

                  for(String item:items) {

                      Button b =
                          button(item);

                      b.setGravity(
                          Gravity.LEFT |
                          Gravity.CENTER_VERTICAL
                      );

                      drawer.addView(
                          b,
                          new LinearLayout.LayoutParams(
                              -1,
                              62
                          )
                      );

                      if(item.equals("HOME"))
                          b.setOnClickListener(
                              v -> {
                                  closeDrawer(drawer);
                                  showHome();
                              }
                          );

                      else if(item.equals("210 EFFECTS"))
                          b.setOnClickListener(
                              v -> {
                                  closeDrawer(drawer);
                                  showModes();
                              }
                          );

                      else if(item.equals("CUSTOM STUDIO"))
                          b.setOnClickListener(
                              v -> {
                                  closeDrawer(drawer);
                                  showCustom();
                              }
                          );

                      else if(item.equals("AI SCENE COMPOSER"))
                          b.setOnClickListener(
                              v -> {
                                  closeDrawer(drawer);
                                  showAI();
                              }
                          );

                      else if(item.contains("ANALYZER"))
                          b.setOnClickListener(
                              v -> {
                                  closeDrawer(drawer);
                                  showAnalyzer();
                              }
                          );

                      else
                          b.setOnClickListener(
                              v -> {
                                  closeDrawer(drawer);
                                  showSettings();
                              }
                          );
                  }

                  Button close =
                      button("CLOSE");

                  close.setOnClickListener(
                      v -> closeDrawer(drawer)
                  );

                  drawer.addView(close);

                  FrameLayout.LayoutParams lp =
                      new FrameLayout.LayoutParams(
                          310,
                          -1
                      );

                  lp.gravity =
                      Gravity.LEFT |
                      Gravity.TOP;

                  rootFrame.addView(
                      drawer,
                      lp
                  );
              }

