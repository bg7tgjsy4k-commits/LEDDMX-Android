              private void generateAI(String text) {

                  String s=text.toLowerCase(
                          Locale.ROOT);

                  if(s.contains("rainbow") ||
                          s.contains("pelangi")) {

                      generateRainbow();
                      return;
                  }

                  if(s.contains("police") ||
                          s.contains("polisi")) {

                      generatePolice();
                      return;
                  }

                  if(s.contains("fire") ||
                          s.contains("api")) {

                      generateFire();
                      return;
                  }

                  if(s.contains("water") ||
                          s.contains("air")) {

                      generateWater();
                      return;
                  }

                  if(s.contains("strobe") ||
                          s.contains("strobo")) {

                      generateStrobe();
                      return;
                  }

                  if(s.contains("chase") ||
                          s.contains("running") ||
                          s.contains("lari")) {

                      generateChase();
                      return;
                  }

                  if(s.contains("fade") ||
                          s.contains("fade in") ||
                          s.contains("napas")) {

                      generateFade();
                      return;
                  }

                  if(s.contains("wave") ||
                          s.contains("gelombang")) {

                      generateWave();
                      return;
                  }

                  if(s.contains("comet") ||
                          s.contains("komet")) {

                      generateComet();
                      return;
                  }

                  if(s.contains("scanner") ||
                          s.contains("scan")) {

                      generateScanner();
                      return;
                  }

                  if(s.contains("pulse") ||
                          s.contains("denyut")) {

                      generatePulse();
                      return;
                  }

                  if(s.contains("belang") ||
                          s.contains("alternating") ||
                          s.contains("selang")) {

                      generateBelang();
                      return;
                  }

                  if(s.contains("random") ||
                          s.contains("acak")) {

                      generateRandom();
                      return;
                  }

                  /*
                   * Simple natural-language color parser.
                   */

                  int left=
                          findColor(s);

                  int right=
                          findSecondColor(s,left);

                  frames.clear();

                  if(s.contains("strobo")) {

                      frames.add(
                              new Frame(
                                      left,
                                      right,
                                      80));

                      frames.add(
                              new Frame(
                                      Color.BLACK,
                                      Color.BLACK,
                                      80));

                  } else {

                      frames.add(
                              new Frame(
                                      left,
                                      right,
                                      s.contains("cepat")
                                              ?80
                                              :300));

                      frames.add(
                              new Frame(
                                      right,
                                      left,
                                      s.contains("cepat")
                                              ?80
                                              :300));
                  }
              }

              private int findColor(String s) {

                  if(s.contains("merah") ||
                          s.contains("red"))
                      return Color.RED;

                  if(s.contains("hijau") ||
                          s.contains("green"))
                      return Color.GREEN;

                  if(s.contains("biru") ||
                          s.contains("blue"))
                      return Color.BLUE;

                  if(s.contains("kuning") ||
                          s.contains("yellow"))
                      return Color.YELLOW;

                  if(s.contains("cyan"))
                      return Color.CYAN;

                  if(s.contains("ungu") ||
                          s.contains("purple"))
                      return Color.MAGENTA;

                  if(s.contains("putih") ||
                          s.contains("white"))
                      return Color.WHITE;

                  if(s.contains("orange"))
                      return Color.rgb(
                              255,120,0);

                  if(s.contains("pink"))
                      return Color.rgb(
                              255,80,150);

                  return Color.RED;
              }

              private int findSecondColor(
                      String s,
                      int first) {

                  String[] names={
                          "merah",
                          "hijau",
                          "biru",
                          "kuning",
                          "cyan",
                          "ungu",
                          "putih",
                          "red",
                          "green",
                          "blue",
                          "yellow",
                          "purple",
                          "white"
                  };

                  for(String n:names) {

                      if(s.indexOf(n)>=0) {

                          int c=findColor(
                                  s.substring(
                                          s.indexOf(n)));

                          if(c!=first)
                              return c;
                      }
                  }

                  return first==Color.RED
                          ?Color.BLUE
                          :Color.RED;
              }

