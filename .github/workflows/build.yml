              private void generateFromAI(
                      String command
              ) {

                  String c =
                          command.toLowerCase(
                                  Locale.US
                          );

                  timelineFrames.clear();

                  boolean red =
                          c.contains("merah")
                          ||
                          c.contains("red");

                  boolean blue =
                          c.contains("biru")
                          ||
                          c.contains("blue");

                  boolean green =
                          c.contains("hijau")
                          ||
                          c.contains("green");

                  boolean yellow =
                          c.contains("kuning")
                          ||
                          c.contains("yellow");

                  int first =
                          red
                          ? Color.RED
                          : green
                          ? Color.GREEN
                          : yellow
                          ? Color.YELLOW
                          : Color.RED;

                  int second =
                          blue
                          ? Color.BLUE
                          : green
                          ? Color.GREEN
                          : Color.BLUE;

                  int duration =
                          c.contains("cepat")
                          ||
                          c.contains("fast")
                          ? 70
                          : 150;

                  if (c.contains("rainbow")) {

                      loadTemplate(
                              "Rainbow"
                      );

                  } else if (
                          c.contains("police")
                  ) {

                      loadTemplate(
                              "Police"
                      );

                  } else if (
                          c.contains("belang")
                          ||
                          c.contains("stripe")
                  ) {

                      timelineFrames.add(
                              new AnimFrame(
                                      first,
                                      second,
                                      duration
                              )
                      );

                      timelineFrames.add(
                              new AnimFrame(
                                      second,
                                      first,
                                      duration
                              )
                      );

                  } else if (
                          c.contains("chase")
                  ) {

                      loadTemplate(
                              "Chase"
                      );

                  } else if (
                          c.contains("strobe")
                  ) {

                      loadTemplate(
                              "Strobe"
                      );

                  } else if (
                          c.contains("fire")
                  ) {

                      loadTemplate(
                              "Fire"
                      );

                  } else {

                      timelineFrames.add(
                              new AnimFrame(
                                      first,
                                      second,
                                      duration
                              )
                      );

                      timelineFrames.add(
                              new AnimFrame(
                                      second,
                                      first,
                                      duration
                              )
                      );
                  }
              }

              /*
               * =========================================================
               * RAW HEX
               * =========================================================
               */

              private void showRawHexScreen() {

                  clearContent();

                  contentLayout.addView(
                          header(
                                  "RAW HEX • FFE1"
                          )
                  );

                  EditText input =
                          edit(
                                  "7B FF 04 01 FF FF FF FF BF"
                          );

                  contentLayout.addView(input);

                  Button send =
                          createButton(
                                  "SEND RAW HEX",
                                  Color.rgb(
                                          0,
                                          120,
                                          140
                                  )
                          );

                  send.setOnClickListener(
                          v -> {

                              try {

                                  byte[] packet =
                                          parseHex(
                                                  input.getText()
                                                          .toString()
                              );

                                  if (packet.length == 0) {
                                      throw new Exception();
                                  }

                                  enqueuePacket(packet);

                                  toast(
                                          "HEX sent"
                                  );

                              } catch (Exception e) {

                                  toast(
                                          "Format HEX salah"
                                  );
                              }
                          }
                  );

                  contentLayout.addView(send);

                  contentLayout.addView(
                          label(
                                  "Format contoh:"
                          )
                  );

                  contentLayout.addView(
                          label(
                                  "7B FF 07 R G B 00 FF BF"
                          )
                  );

                  contentLayout.addView(
                          label(
                                  "Live custom animation tidak memakai 0x08 karena command dual-channel hardware belum terbukti untuk modul ini."
                          )
                  );
              }

              private byte[] parseHex(
                      String text
              ) {

                  String clean =
                          text.trim();

                  if (clean.isEmpty()) {
                      return new byte[0];
                  }

                  String[] parts =
                          clean.split(
                                  "\\s+"
                          );

                  byte[] data =
                          new byte[
                                  parts.length
                          ];

                  for (int i = 0;
                       i < parts.length;
                       i++) {

                      data[i] =
                              (byte) Integer.parseInt(
                                      parts[i],
                                      16
                              );
                  }

                  return data;
              }

              /*
               * =========================================================
               * LOCAL SLOTS
               * =========================================================
               */

              private void saveSlotToLocal(
                      int slot
              ) {

                  StringBuilder sb =
                          new StringBuilder();

                  for (AnimFrame f :
                          timelineFrames) {

                      sb.append(
                              f.leftColor
                      )
                      .append(",")
                      .append(
                              f.rightColor
                      )
                      .append(",")
                      .append(
                              f.duration
                      )
                      .append(";");

                  }

                  prefs.edit()
                          .putString(
                                  "slot_" + slot,
                                  sb.toString()
                          )
                          .apply();
              }

              private void loadSlotFromLocal(
                      int slot
              ) {

                  String data =
                          prefs.getString(
                                  "slot_" + slot,
                                  ""
                          );

                  if (data.isEmpty()) {
                      return;
                  }

                  timelineFrames.clear();

                  String[] rows =
                          data.split(";");

                  for (String row :
                          rows) {

                      try {

                          String[] p =
                                  row.split(",");

                          if (p.length >= 3) {

                              timelineFrames.add(
                                      new AnimFrame(
                                              Integer.parseInt(
                                                      p[0]
                                              ),
                                              Integer.parseInt(
                                                      p[1]
                                              ),
                                              Integer.parseInt(
                                                      p[2]
                                              )
                                      )
                              );
                          }

                      } catch (Exception ignored) {}
                  }

                  if (timelineFrames.isEmpty()) {

                      timelineFrames.add(
                              new AnimFrame(
                                      Color.RED,
                                      Color.BLUE,
                                      150
                              )
                      );
                  }
              }

              /*
               * =========================================================
               * LIVE ANIMATION
               * =========================================================
               */

              private void startAnimationLoop() {

                  if (timelineFrames.isEmpty()) {
                      return;
                  }

                  if (!gattReady) {
                      toast(
                              "Connect ke LEDDMX dulu"
                      );
                      return;
                  }

                  stopAnimationLoop();

                  isPlaying = true;

                  handler.post(
                          new Runnable() {

                              int index = 0;

                              @Override
                              public void run() {

                                  if (!isPlaying) {
                                      return;
                                  }

                                  if (timelineFrames
                                          .isEmpty()) {
                                      return;
                                  }

                                  AnimFrame f =
                                          timelineFrames.get(
                                                  index %
                                                  timelineFrames.size()
                                          );

                                  /*
                                   * Exact LEFT/RIGHT hardware command
                                   * belum terbukti pada LEDDMX-00-b2cd.
                                   *
                                   * Karena itu live hardware memakai
                                   * RGB frame 0x07 yang terbukti.
                                   *
                                   * Preview editor tetap LEFT/RIGHT.
                                   */

                                  int r =
                                          (
                                              Color.red(
                                                      f.leftColor
                                              )
                                              +
                                              Color.red(
                                                      f.rightColor
                                              )
                                          ) / 2;

                                  int g =
                                          (
                                              Color.green(
                                                      f.leftColor
                                              )
                                              +
                                              Color.green(
                                                      f.rightColor
                                              )
                                          ) / 2;

                                  int b =
                                          (
                                              Color.blue(
                                                      f.leftColor
                                              )
                                              +
                                              Color.blue(
                                                      f.rightColor
                                              )
                                          ) / 2;

                                  byte[] packet = {
                                          0x7B,
                                          (byte) 0xFF,
                                          0x07,
                                          (byte) r,
                                          (byte) g,
                                          (byte) b,
                                          0x00,
                                          (byte) 0xFF,
                                          (byte) 0xBF
                                  };

                                  enqueuePacket(packet);

                                  index++;

                                  handler.postDelayed(
                                          this,
                                          Math.max(
                                                  80,
                                                  f.duration
                                          )
                                  );
                              }
                          }
                  );
              }

              private void stopAnimationLoop() {

                  isPlaying = false;

                  handler.removeCallbacksAndMessages(
                          null
                  );
              }

