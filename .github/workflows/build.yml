              // ====================================================
              // BLE SCANNER
              // ====================================================

              private final ScanCallback scanCallback =
                      new ScanCallback() {

                          @Override
                          public void onScanResult(
                                  int callbackType,
                                  ScanResult result) {

                              try {

                                  BluetoothDevice d =
                                          result.getDevice();

                                  String name = null;

                                  if (result.getScanRecord()
                                          != null) {

                                      name =
                                              result.getScanRecord()
                                              .getDeviceName();
                                  }

                                  if (name == null ||
                                          name.trim().isEmpty()) {

                                      try {
                                          name = d.getName();
                                      } catch (Exception ignored) {
                                      }
                                  }

                                  if (name == null ||
                                          name.trim().isEmpty()) {

                                      name =
                                              "(UNKNOWN BLE DEVICE)";
                                  }

                                  String address;

                                  try {
                                      address = d.getAddress();
                                  } catch (Exception e) {
                                      address = "(NO ADDRESS)";
                                  }

                                  int rssi =
                                          result.getRssi();

                                  boolean led =
                                          name.toUpperCase(
                                                  Locale.US)
                                          .contains("LEDDMX");

                                  BleItem item =
                                          devices.get(address);

                                  if (item == null) {

                                      item =
                                              new BleItem();

                                      item.device = d;
                                      item.address =
                                              address;

                                      devices.put(
                                              address,
                                              item);
                                  }

                                  item.name = name;
                                  item.rssi = rssi;
                                  item.ledDmx = led;

                                  addTerminal(
                                          "DEVICE SOURCE: "
                                          + "SCAN\n"
                                          + "NAME="
                                          + name
                                          + "\nADDRESS="
                                          + address
                                          + "\nRSSI="
                                          + rssi
                                          + " dBm");

                                  runOnUiThread(
                                          () -> {

                                              status.setText(
                                                      devices.size()
                                                      + " BLE DEVICE(S) FOUND");

                                              if (page == 0)
                                                  showHome();
                                          });

                              } catch (Exception e) {

                                  addTerminal(
                                          "DEVICE SOURCE: "
                                          + "SCAN ERROR\n"
                                          + e.toString());
                              }
                          }

                          @Override
                          public void onScanFailed(
                                  int errorCode) {

                              scanning = false;

                              addTerminal(
                                      "DEVICE SOURCE: "
                                      + "SCAN FAILED\n"
                                      + "CODE="
                                      + errorCode);

                              runOnUiThread(
                                      () -> {

                                          status.setText(
                                                  "SCAN FAILED • CODE "
                                                  + errorCode);

                                          Toast.makeText(
                                                  MainActivity.this,
                                                  "BLE scan failed: "
                                                  + errorCode,
                                                  Toast.LENGTH_LONG)
                                                  .show();
                                      });
                          }
                      };

              private void toggleScan() {

                  if (scanning)
                      stopScan();
                  else
                      startScan();
              }

              private void startScan() {

                  if (btAdapter == null) {

                      Toast.makeText(
                              this,
                              "Bluetooth unavailable",
                              Toast.LENGTH_LONG)
                              .show();

                      return;
                  }

                  if (!btAdapter.isEnabled()) {

                      Toast.makeText(
                              this,
                              "Turn Bluetooth ON first",
                              Toast.LENGTH_LONG)
                              .show();

                      return;
                  }

                  if (!hasBlePermission()) {

                      requestBlePermissions();
                      return;
                  }

                  if (scanner == null)
                      scanner =
                              btAdapter
                                      .getBluetoothLeScanner();

                  if (scanner == null) {

                      Toast.makeText(
                              this,
                              "BLE scanner unavailable",
                              Toast.LENGTH_LONG)
                              .show();

                      return;
                  }

                  devices.clear();

                  scanning = true;

                  status.setText(
                          "SCANNING ALL BLE DEVICES...");

                  try {

                      ScanSettings settings =
                              new ScanSettings.Builder()
                                      .setScanMode(
                                              ScanSettings
                                              .SCAN_MODE_LOW_LATENCY)
                                      .build();

                      scanner.startScan(
                              null,
                              settings,
                              scanCallback);

                  } catch (Exception e) {

                      scanning = false;

                      status.setText(
                              "SCAN ERROR");

                      addTerminal(
                              "DEVICE SOURCE: "
                              + "SCAN START ERROR\n"
                              + e.toString());

                      return;
                  }

                  handler.postDelayed(
                          () -> stopScan(),
                          12000);
              }

              private void stopScan() {

                  if (!scanning)
                      return;

                  scanning = false;

                  try {

                      if (scanner != null &&
                              hasBlePermission()) {

                          scanner.stopScan(
                                  scanCallback);
                      }

                  } catch (Exception ignored) {
                  }

                  status.setText(
                          devices.size()
                          + " BLE DEVICE(S) FOUND");
              }

              // ====================================================
              // BLE CONNECT
              // ====================================================

              private void connect(
                      BluetoothDevice device) {

                  stopScan();

                  if (device == null)
                      return;

                  if (!hasBlePermission()) {
                      requestBlePermissions();
                      return;
                  }

                  disconnect();

                  connection.setText(
                          "CONNECTING...");

                  connection.setTextColor(
                          Color.YELLOW);

                  status.setText(
                          "CONNECTING TO "
                          + safeName(device));

                  addTerminal(
                          "DEVICE SOURCE: CONNECT\n"
                          + "NAME="
                          + safeName(device)
                          + "\nADDRESS="
                          + safeAddress(device));

                  try {

                      if (Build.VERSION.SDK_INT >= 23) {

                          gatt =
                                  device.connectGatt(
                                          this,
                                          false,
                                          gattCallback,
                                          BluetoothDevice
                                          .TRANSPORT_LE);

                      } else {

                          gatt =
                                  device.connectGatt(
                                          this,
                                          false,
                                          gattCallback);
                      }

                  } catch (Exception e) {

                      connection.setText(
                              "CONNECT ERROR");

                      connection.setTextColor(
                              RED);

                      addTerminal(
                              "DEVICE SOURCE: CONNECT ERROR\n"
                              + e.toString());
                  }
              }

              private final BluetoothGattCallback
                      gattCallback =
                      new BluetoothGattCallback() {

                          @Override
                          public void onConnectionStateChange(
                                  BluetoothGatt g,
                                  int st,
                                  int newState) {

                              if (newState ==
                                      BluetoothProfile
                                      .STATE_CONNECTED) {

                                  gatt = g;

                                  addTerminal(
                                          "DEVICE SOURCE: "
                                          + "GATT\n"
                                          + "STATE=CONNECTED\n"
                                          + "STATUS="
                                          + st);

                                  runOnUiThread(
                                          () -> {

                                              connection.setText(
                                                      "CONNECTED • "
                                                      + "DISCOVERING GATT");

                                              connection.setTextColor(
                                                      Color.YELLOW);

                                              status.setText(
                                                      "DISCOVERING SERVICES...");
                                          });

                                  try {

                                      g.requestConnectionPriority(
                                              BluetoothGatt
                                              .CONNECTION_PRIORITY_HIGH);

                                  } catch (Exception ignored) {
                                  }

                                  handler.postDelayed(
                                          () -> {

                                              try {
                                                  g.discoverServices();
                                              } catch (Exception e) {
                                                  addTerminal(
                                                          "DEVICE SOURCE: "
                                                          + "GATT DISCOVERY ERROR\n"
                                                          + e.toString());
                                              }

                                          },
                                          350);

                              } else if (
                                      newState ==
                                      BluetoothProfile
                                      .STATE_DISCONNECTED) {

                                  writeChar = null;

                                  addTerminal(
                                          "DEVICE SOURCE: GATT\n"
                                          + "STATE=DISCONNECTED\n"
                                          + "STATUS="
                                          + st);

                                  try {
                                      g.close();
                                  } catch (Exception ignored) {
                                  }

                                  if (gatt == g)
                                      gatt = null;

                                  runOnUiThread(
                                          () -> {

                                              connection.setText(
                                                      "DISCONNECTED");

                                              connection.setTextColor(
                                                      RED);

                                              status.setText(
                                                      "MODULE DISCONNECTED");
                                          });
                              }
                          }

                          @Override
                          public void onServicesDiscovered(
                                  BluetoothGatt g,
                                  int statusCode) {

                              addTerminal(
                                      "DEVICE SOURCE: "
                                      + "GATT SERVICES\n"
                                      + "DISCOVERY STATUS="
                                      + statusCode);

                              BluetoothGattCharacteristic found =
                                      null;

                              boolean ota = false;

                              for (BluetoothGattService s :
                                      g.getServices()) {

                                  String su =
                                          s.getUuid()
                                          .toString()
                                          .toUpperCase(
                                                  Locale.US);

                                  addTerminal(
                                          "DEVICE SOURCE: GATT\n"
                                          + "SERVICE="
                                          + su);

                                  if (OTA_SERVICE
                                          .toString()
                                          .equalsIgnoreCase(
                                                  s.getUuid()
                                                  .toString())) {

                                      ota = true;
                                  }

                                  for (
                                          BluetoothGattCharacteristic c :
                                          s.getCharacteristics()) {

                                      String cu =
                                              c.getUuid()
                                              .toString()
                                              .toUpperCase(
                                                      Locale.US);

                                      addTerminal(
                                              "DEVICE SOURCE: GATT\n"
                                              + "CHAR="
                                              + cu
                                              + "\nPROPERTIES="
                                              + c.getProperties());

                                      if (CHAR_FFE1
                                              .toString()
                                              .equalsIgnoreCase(
                                                      c.getUuid()
                                                      .toString())) {

                                          found = c;
                                      }
                                  }
                              }

                              writeChar = found;

                              final boolean otaDetected = ota;

                              runOnUiThread(
                                      () -> {

                                          if (writeChar != null) {

                                              connection.setText(
                                                      "READY • FFE1");

                                              connection.setTextColor(
                                                      GREEN);

                                              status.setText(
                                                      "LEDDMX COMMAND CHANNEL READY");

                                          } else {

                                              connection.setText(
                                                      "CONNECTED • "
                                                      + "FFE1 NOT FOUND");

                                              connection.setTextColor(
                                                      RED);

                                              status.setText(
                                                      "FFE1 NOT EXPOSED BY DEVICE");
                                          }

                                          if (otaDetected)
                                              addTerminal(
                                                      "DEVICE SOURCE: OTA\n"
                                                      + "5833FF01 SERVICE DETECTED");

                                      });
                          }
                      };

              // ====================================================
              // GATT INSPECTOR
              // ====================================================

              private void inspectGatt() {

                  if (gatt == null) {

                      Toast.makeText(
                              this,
                              "No GATT connection",
                              Toast.LENGTH_SHORT)
                              .show();

                      return;
                  }

                  addTerminal(
                          "DEVICE SOURCE: GATT\n"
                          + "LIVE INSPECTION REQUESTED");

                  try {
                      gatt.discoverServices();
                  } catch (Exception e) {
                      addTerminal(
                              "DEVICE SOURCE: GATT ERROR\n"
                              + e.toString());
                  }

                  showAnalyzer();
              }

              private void checkOta() {

                  if (gatt == null) {

                      Toast.makeText(
                              this,
                              "Connect module first",
                              Toast.LENGTH_SHORT)
                              .show();

                      return;
                  }

                  boolean found = false;

                  for (BluetoothGattService s :
                          gatt.getServices()) {

                      if (OTA_SERVICE
                              .toString()
                              .equalsIgnoreCase(
                                      s.getUuid()
                                      .toString())) {

                          found = true;
                          break;
                      }
                  }

                  if (found) {

                      addTerminal(
                              "DEVICE SOURCE: OTA\n"
                              + "5833FF01 DETECTED\n"
                              + "5833FF02 WRITE DETECTED?\n"
                              + "5833FF03 NOTIFY DETECTED?\n"
                              + "NO FIRMWARE FLASH PERFORMED");

                      Toast.makeText(
                              this,
                              "OTA SERVICE DETECTED",
                              Toast.LENGTH_LONG)
                              .show();

                  } else {

                      addTerminal(
                              "DEVICE SOURCE: OTA\n"
                              + "NOT EXPOSED BY DEVICE");

                      Toast.makeText(
                              this,
                              "OTA service not exposed",
                              Toast.LENGTH_SHORT)
                              .show();
                  }

                  showAnalyzer();
              }

              // ====================================================
              // COMMAND QUEUE
              // ====================================================

              private void send(String hex) {

                  if (writeChar == null ||
                          gatt == null) {

                      Toast.makeText(
                              this,
                              "Module not READY / FFE1 unavailable",
                              Toast.LENGTH_SHORT)
                              .show();

                      return;
                  }

                  byte[] data;

                  try {
                      data = parseHex(hex);
                  } catch (Exception e) {

                      Toast.makeText(
                              this,
                              "Invalid HEX",
                              Toast.LENGTH_SHORT)
                              .show();

                      return;
                  }

                  addTerminal(
                          "DEVICE SOURCE: TX\n"
                          + "HEX="
                          + hex.replace("\n", " "));

                  try {

                      writeChar.setValue(data);

                      if (Build.VERSION.SDK_INT >= 33) {

                          gatt.writeCharacteristic(
                                  writeChar,
                                  data,
                                  BluetoothGatt
                                  .WRITE_TYPE_DEFAULT);

                      } else {

                          writeChar.setWriteType(
                                  BluetoothGattCharacteristic
                                  .WRITE_TYPE_DEFAULT);

                          gatt.writeCharacteristic(
                                  writeChar);
                      }

                  } catch (Exception e) {

                      addTerminal(
                              "DEVICE SOURCE: TX ERROR\n"
                              + e.toString());
                  }
              }

              private void sendRgb(
                      int r,
                      int g,
                      int b) {

                  send(
                          String.format(
                                  Locale.US,
                                  "7B FF 07 %02X %02X %02X 00 FF BF",
                                  r,
                                  g,
                                  b));
              }

              private void sendMode(int mode) {

                  if (mode < 1)
                      mode = 1;

                  if (mode > 210)
                      mode = 210;

                  send(
                          String.format(
                                  Locale.US,
                                  "7B FF 03 %02X FF FF FF FF BF",
                                  mode));
              }

              private void sendBrightness(
                      int pct) {

                  pct = Math.max(
                          0,
                          Math.min(100, pct));

                  int raw =
                          (pct * 32) / 100;

                  send(
                          String.format(
                                  Locale.US,
                                  "7B FF 01 %02X %02X 00 FF FF BF",
                                  raw,
                                  pct));
              }

              private void sendSpeed(int speed) {

                  speed = Math.max(
                          0,
                          Math.min(255, speed));

                  send(
                          String.format(
                                  Locale.US,
                                  "7B FF 02 %02X 00 FF FF FF BF",
                                  speed));
              }

              private void sendDirection(
                      int direction) {

                  send(
                          String.format(
                                  Locale.US,
                                  "7B FF 0D %02X FF FF FF FF BF",
                                  direction));
              }

              private byte[] parseHex(
                      String value) {

                  String s =
                          value
                          .replace("0x", "")
                          .replace("0X", "")
                          .replaceAll(
                                  "[^0-9A-Fa-f]",
                                  "");

                  if (s.length() == 0 ||
                          s.length() % 2 != 0)
                      throw new IllegalArgumentException();

                  byte[] out =
                          new byte[s.length() / 2];

                  for (int i = 0;
                       i < out.length;
                       i++) {

                      out[i] =
                              (byte)Integer.parseInt(
                                      s.substring(
                                              i * 2,
                                              i * 2 + 2),
                                      16);
                  }

                  return out;
              }

              // ====================================================
              // DISCONNECT
              // ====================================================

              private void disconnect() {

                  writeChar = null;

                  if (gatt != null) {

                      try {
                          gatt.disconnect();
                      } catch (Exception ignored) {
                      }

                      try {
                          gatt.close();
                      } catch (Exception ignored) {
                      }

                      gatt = null;
                  }

                  connection.setText(
                          "DISCONNECTED");

                  connection.setTextColor(
                          RED);
              }

              // ====================================================
              // PERMISSIONS
              // ====================================================

              private boolean hasBlePermission() {

                  if (Build.VERSION.SDK_INT >= 31) {

                      return checkSelfPermission(
                              Manifest.permission.BLUETOOTH_SCAN)
                              == PackageManager.PERMISSION_GRANTED
                              &&
                              checkSelfPermission(
                              Manifest.permission.BLUETOOTH_CONNECT)
                              == PackageManager.PERMISSION_GRANTED;

                  } else {

                      return checkSelfPermission(
                              Manifest.permission.ACCESS_FINE_LOCATION)
                              == PackageManager.PERMISSION_GRANTED;
                  }
              }

              private void requestBlePermissions() {

                  if (Build.VERSION.SDK_INT >= 31) {

                      requestPermissions(
                              new String[] {
                                      Manifest.permission.BLUETOOTH_SCAN,
                                      Manifest.permission.BLUETOOTH_CONNECT
                              },
                              REQ_BLE);

                  } else {

                      requestPermissions(
                              new String[] {
                                      Manifest.permission.ACCESS_FINE_LOCATION
                              },
                              REQ_BLE);
                  }
              }

              @Override
              public void onRequestPermissionsResult(
                      int requestCode,
                      String[] permissions,
                      int[] results) {

                  super.onRequestPermissionsResult(
                          requestCode,
                          permissions,
                          results);

                  if (requestCode == REQ_BLE) {

                      boolean ok = true;

                      for (int r : results) {

                          if (r !=
                                  PackageManager.PERMISSION_GRANTED) {

                              ok = false;
                              break;
                          }
                      }

                      if (ok) {

                          status.setText(
                                  "BLE PERMISSION READY");

                      } else {

                          status.setText(
                                  "BLE PERMISSION DENIED");
                      }
                  }
              }

              // ====================================================
              // TERMINAL
              // ====================================================

              private void addTerminal(
                      String s) {

                  synchronized (terminal) {

                      terminal.add(
                              "[" + System.currentTimeMillis()
                              + "] "
                              + s);

                      while (terminal.size() > 300)
                          terminal.remove(0);
                  }
              }

              private String terminalText() {

                  StringBuilder b =
                          new StringBuilder();

                  synchronized (terminal) {

                      for (String s : terminal) {

                          b.append(s)
                           .append("\n\n");
                      }
                  }

                  if (b.length() == 0)
                      return
                              "DEVICE SOURCE:\n"
                              + "NO DATA YET\n\n"
                              + "NOT EXPOSED BY DEVICE";

                  return b.toString();
              }

              private void copyText(
                      String s) {

                  android.content.ClipboardManager cm =
                          (android.content.ClipboardManager)
                          getSystemService(
                                  CLIPBOARD_SERVICE);

                  if (cm != null) {

                      cm.setPrimaryClip(
                              android.content.ClipData
                              .newPlainText(
                                      "LEDDMX RAW",
                                      s));

                      Toast.makeText(
                              this,
                              "Copied",
                              Toast.LENGTH_SHORT)
                              .show();
                  }
              }

