        private fun drawMiniEffect(
            c: Canvas,
            x: Float,
            y: Float,
            w: Float,
            h: Float,
            index: Int
        ) {
            val count = 12

            for (i in 0 until count) {
                val phase =
                    (previewPhase * 2f + i * 0.22f + index * 0.03f) % 1f

                val xx = x + phase * w

                val color =
                    Color.HSVToColor(
                        floatArrayOf(
                            ((index * 17f) + i * 28f) % 360f,
                            0.9f,
                            1f
                        )
                    )

                rect(
                    c,
                    xx,
                    y,
                    xx + 6f,
                    y + h,
                    color
                )
            }
        }

