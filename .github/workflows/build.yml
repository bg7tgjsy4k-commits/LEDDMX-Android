              private void startScan() {

                  long now =
                          System.currentTimeMillis();

                  if (
                          now - lastScan < 2500
                  ) {

                      toast(
                              "Tunggu 2,5 detik sebelum scan ulang."
                      );

                      return;
                  }

                  if (!bluetoothReady())
                      return;

                  stopScan();

                  devices.clear();
                  rssis.clear();

                  if (deviceList != null)
                      deviceList.removeAllViews();

                  scanner =
                          adapter.getBluetoothLeScanner();

                  if (scanner == null) {

                      scanError(
                              -100,
                              "BluetoothLeScanner NULL"
                      );

                      return;
                  }

                  lastScan =
                          System.currentTimeMillis();

                  status.setText(
                          "Status: SCANNING..."
                  );

                  ScanSettings settings =
                          new ScanSettings.Builder()
                                  .setScanMode(
                                          ScanSettings
                                                  .SCAN_MODE_LOW_LATENCY
                                  )
                                  .build();

                  scanCallback =
                          new ScanCallback() {

                              @Override
                              public void onScanResult(
                                      int type,
                                      ScanResult result
                              ) {

                                  addDevice(result);
                              }

                              @Override
                              public void onBatchScanResults(
                                      List<ScanResult> results
                              ) {

                                  for (
                                          ScanResult r :
                                          results
                                  ) {

                                      addDevice(r);
                                  }
                              }

                              @Override
                              public void onScanFailed(
                                      int code
                              ) {

                                  runOnUiThread(
                                          () -> scanError(
                                                  code,
                                                  scanErrorName(code)
                                          )
                                  );
                              }
                          };

                  try {

                      scanner.startScan(
                              null,
                              settings,
                              scanCallback
                      );

                      handler.postDelayed(
                              () -> {

                                  stopScan();

                                  status.setText(
                                          "Status: SCAN SELESAI"
                                  );

                                  if (
                                          devices.isEmpty()
                                  ) {

                                      toast(
                                              "Tidak ada BLE ditemukan."
                                      );
                                  }

                              },
                              10000
                      );

                  } catch (SecurityException e) {

                      scanError(
                              -101,
                              "Permission"
                      );

                  } catch (Exception e) {

                      scanError(
                              -102,
                              e.getClass()
                                      .getSimpleName()
                      );
                  }
              }

              private String scanErrorName(
                      int code
              ) {

                  switch (code) {

                      case 1:
                          return "ALREADY_STARTED";

                      case 2:
                          return "APPLICATION_REGISTRATION_FAILED";

                      case 3:
                          return "INTERNAL_ERROR";

                      case 4:
                          return "FEATURE_UNSUPPORTED";

                      case 5:
                          return "OUT_OF_HARDWARE_RESOURCES";

                      case 6:
                          return "SCANNING_TOO_FREQUENTLY";

                      default:
                          return "UNKNOWN";
                  }
              }

              private void scanError(
                      int code,
                      String reason
              ) {

                  stopScan();

                  status.setText(
                          "Status: SCAN FAILED " + code
                  );

                  toast(
                          "BLE Scan FAILED "
                                  + code
                                  + " / "
                                  + reason
                  );
              }

              private void stopScan() {

                  try {

                      if (
                              scanner != null
                              &&
                              scanCallback != null
                      ) {

                          scanner.stopScan(
                                  scanCallback
                          );
                      }

                  } catch (Exception ignored) {
                  }

                  scanCallback = null;
              }

              private void addDevice(
                      ScanResult result
              ) {

                  BluetoothDevice d =
                          result.getDevice();

                  String name = "";

                  try {
                      name = d.getName();
                  } catch (Exception ignored) {
                  }

                  if (
                          name == null
                          ||
                          name.trim().isEmpty()
                  ) {

                      try {

                          if (
                                  result.getScanRecord()
                                          != null
                          ) {

                              name =
                                      result.getScanRecord()
                                              .getDeviceName();
                          }

                      } catch (Exception ignored) {
                      }
                  }

                  if (name == null)
                      name = "";

                  boolean target =
                          name.toUpperCase(
                                  Locale.US
                          ).contains("LEDDMX")
                          ||
                          name.toLowerCase(
                                  Locale.US
                          ).contains("b2cd")
                          ||
                          hasFFE0(result);

                  if (
                          name.trim().isEmpty()
                          &&
                          !target
                  ) {
                      return;
                  }

                  String address =
                          d.getAddress();

                  devices.put(
                          address,
                          d
                  );

                  rssis.put(
                          address,
                          result.getRssi()
                  );

                  runOnUiThread(
                          this::renderDevices
                  );
              }

              private boolean hasFFE0(
                      ScanResult result
              ) {

                  try {

                      if (
                              result.getScanRecord()
                                      == null
                      )
                          return false;

                      List<ParcelUuid> list =
                              result.getScanRecord()
                                      .getServiceUuids();

                      if (list == null)
                          return false;

                      for (
                              ParcelUuid p :
                              list
                      ) {

                          if (
                                  SERVICE_FFE0.equalsIgnoreCase(
                                          p.getUuid()
                                                  .toString()
                                  )
                          )
                              return true;
                      }

                  } catch (Exception ignored) {
                  }

                  return false;
              }

              private void renderDevices() {

                  if (deviceList == null)
                      return;

                  deviceList.removeAllViews();

                  for (
                          String address :
                          devices.keySet()
                  ) {

                      BluetoothDevice d =
                              devices.get(address);

                      String name = "";

                      try {
                          name = d.getName();
                      } catch (Exception ignored) {
                      }

                      if (
                              name == null
                              ||
                              name.trim().isEmpty()
                      )
                          name = "BLE DEVICE";

                      boolean target =
                              name.toUpperCase(
                                      Locale.US
                              ).contains("LEDDMX")
                              ||
                              name.toLowerCase(
                                      Locale.US
                              ).contains("b2cd");

                      Button b =
                              btn(
                                      (target
                                              ? "★ "
                                              : "")
                                              + name
                                              + "\n"
                                              + address
                                              + "  RSSI "
                                              + rssis.get(
                                                      address
                                              ),
                                      target
                                              ? Color.rgb(
                                                      0,
                                                      100,
                                                      120
                                              )
                                              : Color.rgb(
                                                      35,
                                                      40,
                                                      50
                                              )
                              );

                      b.setOnClickListener(
                              v -> {

                                  stopScan();

                                  connect(d);
                              }
                      );

                      deviceList.addView(b);
                  }
              }

              // ============================================================
              // GATT
              // ============================================================

              private void connect(
                      BluetoothDevice device
              ) {

                  try {

                      if (gatt != null)
                          gatt.close();

                  } catch (Exception ignored) {
                  }

                  gatt = null;
                  writeChar = null;

                  status.setText(
                          "Status: CONNECTING..."
                  );

                  BluetoothGattCallback callback =
                          new BluetoothGattCallback() {

                              @Override
                              public void onConnectionStateChange(
                                      BluetoothGatt g,
                                      int statusCode,
                                      int newState
                              ) {

                                  if (
                                          newState
                                                  ==
                                          BluetoothProfile
                                                  .STATE_CONNECTED
                                  ) {

                                      gatt = g;

                                      runOnUiThread(
                                              () -> status.setText(
                                                      "Status: CONNECTED — DISCOVERING GATT"
                                              )
                                      );

                                      g.discoverServices();

                                  } else if (
                                          newState
                                                  ==
                                          BluetoothProfile
                                                  .STATE_DISCONNECTED
                                  ) {

                                      writeChar = null;

                                      try {
                                          g.close();
                                      } catch (Exception ignored) {
                                      }

                                      runOnUiThread(
                                              () -> status.setText(
                                                      "Status: DISCONNECTED "
                                                              + statusCode
                                              )
                                      );
                                  }
                              }

                              @Override
                              public void onServicesDiscovered(
                                      BluetoothGatt g,
                                      int result
                              ) {

                                  BluetoothGattCharacteristic found =
                                          null;

                                  boolean ota = false;

                                  if (
                                          result
                                                  ==
                                          BluetoothGatt
                                                  .GATT_SUCCESS
                                  ) {

                                      for (
                                              BluetoothGattService s :
                                              g.getServices()
                                      ) {

                                          if (
                                                  OTA_SERVICE.equalsIgnoreCase(
                                                          s.getUuid()
                                                                  .toString()
                                                  )
                                          )
                                              ota = true;

                                          for (
                                                  BluetoothGattCharacteristic c :
                                                  s.getCharacteristics()
                                          ) {

                                              if (
                                                      CHAR_FFE1.equalsIgnoreCase(
                                                              c.getUuid()
                                                                      .toString()
                                                      )
                                              ) {

                                                  found = c;
                                              }
                                          }
                                      }
                                  }

                                  writeChar = found;

                                  final boolean ready =
                                          found != null;

                                  final boolean otaFound =
                                          ota;

                                  runOnUiThread(
                                          () -> {

                                              if (ready) {

                                                  status.setText(
                                                          "Status: READY — FFE1"
                                                  );

                                                  info.setText(
                                                          "LEDDMX-00 | "
                                                                  + "FFE1 OK | OTA "
                                                                  + (
                                                                  otaFound
                                                                          ? "DETECTED"
                                                                          : "NOT DETECTED"
                                                          )
                                                  );

                                                  home();

                                              } else {

                                                  status.setText(
                                                          "CONNECTED tapi FFE1 TIDAK ADA"
                                                  );

                                                  toast(
                                                          "FFE1 tidak ditemukan."
                                                  );
                                              }
                                          }
                                  );
                              }
                          };

                  try {

                      if (Build.VERSION.SDK_INT >= 23) {

                          gatt =
                                  device.connectGatt(
                                          this,
                                          false,
                                          callback,
                                          BluetoothDevice
                                                  .TRANSPORT_LE
                                  );

                      } else {

                          gatt =
                                  device.connectGatt(
                                          this,
                                          false,
                                          callback
                                  );
                      }

                  } catch (SecurityException e) {

                      requestPermissionsBle();

                  } catch (Exception e) {

                      toast(
                              "Connect gagal: "
                                      + e.getMessage()
                      );
                  }
              }

              // ============================================================
              // BLE TX QUEUE
              // ============================================================

              private void send(
                      byte[] data
              ) {

                  if (
                          gatt == null
                          ||
                          writeChar == null
                  ) {

                      toast(
                              "Belum READY FFE1."
                      );

                      return;
                  }

                  txQueue.offer(
                          data
                  );

                  processTx();
              }

              private void processTx() {

                  if (txBusy)
                      return;

                  if (txQueue.isEmpty())
                      return;

                  if (
                          gatt == null
                          ||
                          writeChar == null
                  ) {

                      txQueue.clear();
                      return;
                  }

                  byte[] data =
                          txQueue.poll();

                  txBusy = true;

                  try {

                      writeChar.setValue(
                              data
                      );

                      int props =
                              writeChar.getProperties();

                      if (
                              (
                                      props
                                              &
                                      BluetoothGattCharacteristic
                                              .PROPERTY_WRITE
                              ) != 0
                      ) {

                          writeChar.setWriteType(
                                  BluetoothGattCharacteristic
                                          .WRITE_TYPE_DEFAULT
                          );

                      } else {

                          writeChar.setWriteType(
                                  BluetoothGattCharacteristic
                                          .WRITE_TYPE_NO_RESPONSE
                          );
                      }

                      boolean ok =
                              gatt.writeCharacteristic(
                                      writeChar
                              );

                      if (!ok) {

                          txBusy = false;

                          handler.postDelayed(
                                  this::processTx,
                                  80
                          );

                      }

                  } catch (Exception e) {

                      txBusy = false;

                      handler.postDelayed(
                              this::processTx,
                              100
                      );
                  }
              }

              // ============================================================
              // PACKET BUILDER
              // ============================================================

              private byte[] frame(
                      int opcode,
                      int a,
                      int b,
                      int c,
                      int d,
                      int e
              ) {

                  return new byte[] {
                          0x7B,
                          (byte) 0xFF,
                          (byte) opcode,
                          (byte) a,
                          (byte) b,
                          (byte) c,
                          (byte) d,
                          (byte) e,
                          (byte) 0xBF
                  };
              }

              private byte[] power(
                      boolean on
              ) {

                  /*
                   * LEDDMX-00 family verified dialect-B.
                   *
                   * 01/00 is retained as the primary implementation
                   * used by the existing working application baseline.
                   */

                  return frame(
                          0x04,
                          on ? 1 : 0,
                          0xFF,
                          0xFF,
                          0xFF,
                          0xFF
                  );
              }

              private byte[] modePacket(
                      int m
              ) {

                  return frame(
                          0x03,
                          clamp(
                                  m,
                                  0,
                                  255
                          ),
                          0xFF,
                          0xFF,
                          0xFF,
                          0xFF
                  );
              }

              private byte[] brightnessPacket(
                      int value
              ) {

                  value =
                          clamp(
                                  value,
                                  0,
                                  100
                          );

                  int fine =
                          (value * 32) / 100;

                  return new byte[] {
                          0x7B,
                          (byte) 0xFF,
                          0x01,
                          (byte) fine,
                          (byte) value,
                          0x00,
                          (byte) 0xFF,
                          (byte) 0xFF,
                          (byte) 0xBF
                  };
              }

              private byte[] speedPacket(
                      int value
              ) {

                  value =
                          clamp(
                                  value,
                                  0,
                                  100
                          );

                  return frame(
                          0x02,
                          value,
                          0x00,
                          0xFF,
                          0xFF,
                          0xFF
                  );
              }

              private byte[] directionPacket(
                      boolean forward
              ) {

                  return frame(
                          0x0D,
                          forward ? 0 : 1,
                          0xFF,
                          0xFF,
                          0xFF,
                          0xFF
                  );
              }

              private byte[] micPacket(
                      int value
              ) {

                  return frame(
                          0x0B,
                          clamp(
                                  value,
                                  0,
                                  255
                          ),
                          0,
                          0xFF,
                          0xFF,
                          0xFF
                  );
              }

              private byte[] rgbPacket(
                      int color
              ) {

                  int r =
                          Color.red(color);

                  int g =
                          Color.green(color);

                  int b =
                          Color.blue(color);

                  int x = r;
                  int y = g;
                  int z = b;

                  if (
                          rgbOrder.equals("RBG")
                  ) {

                      x = r;
                      y = b;
                      z = g;

                  } else if (
                          rgbOrder.equals("GRB")
                  ) {

                      x = g;
                      y = r;
                      z = b;

                  } else if (
                          rgbOrder.equals("GBR")
                  ) {

                      x = g;
                      y = b;
                      z = r;

                  } else if (
                          rgbOrder.equals("BRG")
                  ) {

                      x = b;
                      y = r;
                      z = g;

                  } else if (
                          rgbOrder.equals("BGR")
                  ) {

                      x = b;
                      y = g;
                      z = r;
                  }

                  return new byte[] {
                          0x7B,
                          (byte) 0xFF,
                          0x07,
                          (byte) x,
                          (byte) y,
                          (byte) z,
                          0x00,
                          (byte) 0xFF,
                          (byte) 0xBF
                  };
              }

              private byte[] stripConfig(
                      int type,
                      int pixels,
                      int order
              ) {

                  return new byte[] {
                          0x7B,
                          (byte) 0xFF,
                          0x05,
                          (byte) type,
                          (byte) ((pixels >> 8) & 0xFF),
                          (byte) (pixels & 0xFF),
                          (byte) order,
                          (byte) 0xFF,
                          (byte) 0xBF
                  };
              }

              // ============================================================
              // CUSTOM PATTERN — VERIFIED LEDDMX-00
              // ============================================================

              private byte[] customColorPacket(
                      int color,
                      int position,
                      int total
              ) {

                  int r =
                          Color.red(color);

                  int g =
                          Color.green(color);

                  int b =
                          Color.blue(color);

                  /*
                   * Exact LEDDMX-00 custom color frame:
                   *
                   * 7B
                   * position
                   * 0E
                   * FD
                   * R
                   * G
                   * B
                   * total
                   * BF
                   *
                   * Position starts at 1.
                   */

                  return new byte[] {
                          0x7B,
                          (byte) position,
                          0x0E,
                          (byte) 0xFD,
                          (byte) r,
                          (byte) g,
                          (byte) b,
                          (byte) total,
                          (byte) 0xBF
                  };
              }

              private byte[] customModePacket(
                      int custom
              ) {

                  return new byte[] {
                          0x7B,
                          (byte) 0xFF,
                          0x13,
                          (byte) clamp(
                                  custom,
                                  0,
                                  7
                          ),
                          (byte) 0xFF,
                          (byte) 0xFF,
                          (byte) 0xFF,
                          (byte) 0xFF,
                          (byte) 0xBF
                  };
              }

