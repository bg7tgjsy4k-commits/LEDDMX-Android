              private void loadTemplate(
                      String name
              ) {

                  timeline.clear();

                  if (name.equals("Rainbow")) {

                      int[] c = {
                              Color.RED,
                              Color.YELLOW,
                              Color.GREEN,
                              Color.CYAN,
                              Color.BLUE,
                              Color.MAGENTA
                      };

                      for (int i = 0; i < c.length; i++) {

                          timeline.add(
                                  new AnimFrame(
                                          c[i],
                                          c[(i + 1) % c.length],
                                          140
                                  )
                          );
                      }

                  } else if (name.equals("Belang")) {

                      for (int i = 0; i < 8; i++) {

                          if (i % 2 == 0) {

                              timeline.add(
                                      new AnimFrame(
                                              Color.RED,
                                              Color.RED,
                                              160
                                      )
                              );

                          } else {

                              timeline.add(
                                      new AnimFrame(
                                              Color.BLUE,
                                              Color.BLUE,
                                              160
                                      )
                              );
                          }
                      }

                  } else if (name.equals("Police")) {

                      for (int i = 0; i < 8; i++) {

                          timeline.add(
                                  new AnimFrame(
                                          i % 2 == 0
                                                  ? Color.RED
                                                  : Color.BLUE,
                                          i % 2 == 0
                                                  ? Color.BLUE
                                                  : Color.RED,
                                          120
                                  )
                          );
                      }

                  } else if (name.equals("Fire")) {

                      timeline.add(
                              new AnimFrame(
                                      Color.rgb(255, 20, 0),
                                      Color.rgb(255, 80, 0),
                                      120
                              )
                      );

                      timeline.add(
                              new AnimFrame(
                                      Color.rgb(255, 120, 0),
                                      Color.RED,
                                      100
                              )
                      );

                      timeline.add(
                              new AnimFrame(
                                      Color.YELLOW,
                                      Color.rgb(255, 40, 0),
                                      80
                              )
                      );

                  } else if (name.equals("Water")) {

                      timeline.add(
                              new AnimFrame(
                                      Color.CYAN,
                                      Color.BLUE,
                                      180
                              )
                      );

                      timeline.add(
                              new AnimFrame(
                                      Color.BLUE,
                                      Color.rgb(0, 80, 255),
                                      120
                              )
                      );

                  } else if (name.equals("Strobe")) {

                      for (int i = 0; i < 10; i++) {

                          timeline.add(
                                  new AnimFrame(
                                          Color.WHITE,
                                          Color.WHITE,
                                          70
                                  )
                          );

                          timeline.add(
                                  new AnimFrame(
                                          Color.BLACK,
                                          Color.BLACK,
                                          70
                                  )
                          );
                      }

                  } else {

                      int[] c = {
                              Color.RED,
                              Color.GREEN,
                              Color.BLUE,
                              Color.YELLOW,
                              Color.MAGENTA,
                              Color.CYAN
                      };

                      for (int i = 0; i < 10; i++) {

                          timeline.add(
                                  new AnimFrame(
                                          c[i % c.length],
                                          c[(i + 2) % c.length],
                                          130
                                  )
                          );
                      }
                  }

                  if (timeline.isEmpty()) {

                      timeline.add(
                              new AnimFrame(
                                      Color.RED,
                                      Color.BLUE,
                                      150
                              )
                      );
                  }
              }

