              private void requestBlePermissions() {

                  if (Build.VERSION.SDK_INT >= 31) {

                      requestPermissions(
                          new String[]{
                              Manifest.permission.BLUETOOTH_SCAN,
                              Manifest.permission.BLUETOOTH_CONNECT
                          },
                          50
                      );

                  } else if (
                      Build.VERSION.SDK_INT >= 23
                  ) {

                      requestPermissions(
                          new String[]{
                              Manifest.permission.ACCESS_FINE_LOCATION
                          },
                          50
                      );
                  }
              }

              private boolean hasScanPermission() {

                  if (
                      Build.VERSION.SDK_INT >= 31
                  ) {

                      return checkSelfPermission(
                          Manifest.permission.BLUETOOTH_SCAN
                      ) ==
                      PackageManager.PERMISSION_GRANTED;
                  }

                  return
                      Build.VERSION.SDK_INT < 23 ||
                      checkSelfPermission(
                          Manifest.permission.ACCESS_FINE_LOCATION
                      ) ==
                      PackageManager.PERMISSION_GRANTED;
              }

              private boolean hasConnectPermission() {

                  return
                      Build.VERSION.SDK_INT < 31 ||
                      checkSelfPermission(
                          Manifest.permission.BLUETOOTH_CONNECT
                      ) ==
                      PackageManager.PERMISSION_GRANTED;
              }

              private void scanBle() {

                  if (adapter == null) {

                      status.setText(
                          "BLE: adapter null"
                      );

                      return;
                  }

                  if (
                      Build.VERSION.SDK_INT >= 31 &&
                      !hasConnectPermission()
                  ) {

                      requestBlePermissions();
                      return;
                  }

                  if (!hasScanPermission()) {

                      requestBlePermissions();
                      return;
                  }

                  if (!adapter.isEnabled()) {

                      try {

                          startActivity(
                              new Intent(
                                  BluetoothAdapter
                                      .ACTION_REQUEST_ENABLE
                              )
                          );

                      } catch (Exception ignored) {
                      }

                      return;
                  }

                  if (scanning) {
                      return;
                  }

                  scanner =
                      adapter.getBluetoothLeScanner();

                  if (scanner == null) {

                      status.setText(
                          "BLE: scanner null"
                      );

                      return;
                  }

                  deviceMap.clear();
                  deviceLabels.clear();

                  if (deviceAdapter != null) {
                      deviceAdapter.notifyDataSetChanged();
                  }

                  scanning = true;

                  status.setText(
                      "BLE: scanning..."
                  );

                  ScanSettings settings =
                      new ScanSettings.Builder()
                          .setScanMode(
                              ScanSettings.SCAN_MODE_LOW_LATENCY
                          )
                          .build();

                  try {

                      scanner.startScan(
                          null,
                          settings,
                          scanCallback
                      );

                  } catch (Exception e) {

                      scanning = false;

                      status.setText(
                          "BLE scan error: " +
                          e.getClass()
                              .getSimpleName()
                      );

                      return;
                  }

                  main.postDelayed(
                      this::stopScan,
                      12000
                  );
              }

              private void stopScan() {

                  if (!scanning) {
                      return;
                  }

                  try {

                      if (scanner != null) {
                          scanner.stopScan(
                              scanCallback
                          );
                      }

                  } catch (Exception ignored) {
                  }

                  scanning = false;

                  status.setText(
                      deviceMap.isEmpty()
                          ? "BLE: 0 device found"
                          : "BLE: " +
                            deviceMap.size() +
                            " device found — tap device to connect"
                  );
              }

              private final ScanCallback scanCallback =
                  new ScanCallback() {

                      @Override
                      public void onScanResult(
                          int callbackType,
                          ScanResult result
                      ) {

                          runOnUiThread(
                              () -> {

                                  BluetoothDevice d =
                                      result.getDevice();

                                  String address =
                                      d.getAddress();

                                  String name = null;

                                  if (
                                      result.getScanRecord()
                                          != null
                                  ) {

                                      name =
                                          result
                                              .getScanRecord()
                                              .getDeviceName();
                                  }

                                  if (
                                      name == null ||
                                      name.trim().isEmpty()
                                  ) {

                                      name =
                                          "UNKNOWN BLE";
                                  }

                                  String line =
                                      name +
                                      "  |  " +
                                      address +
                                      "  |  RSSI " +
                                      result.getRssi();

                                  if (
                                      !deviceMap.containsKey(
                                          address
                                      )
                                  ) {

                                      deviceMap.put(
                                          address,
                                          d
                                      );

                                      deviceLabels.add(
                                          line
                                      );

                                  } else {

                                      for (
                                          int i = 0;
                                          i < deviceLabels.size();
                                          i++
                                      ) {

                                          if (
                                              deviceLabels
                                                  .get(i)
                                                  .contains(
                                                      address
                                                  )
                                          ) {

                                              deviceLabels.set(
                                                  i,
                                                  line
                                              );

                                              break;
                                          }
                                      }
                                  }

                                  if (
                                      deviceAdapter != null
                                  ) {

                                      deviceAdapter
                                          .notifyDataSetChanged();
                                  }
                              }
                          );
                      }

                      @Override
                      public void onScanFailed(
                          int errorCode
                      ) {

                          runOnUiThread(
                              () -> {

                                  scanning = false;

                                  status.setText(
                                      "BLE SCAN FAILED: " +
                                      errorCode
                                  );
                              }
                          );
                      }
                  };

              private void connect(
                  BluetoothDevice device
              ) {

                  if (
                      Build.VERSION.SDK_INT >= 31 &&
                      !hasConnectPermission()
                  ) {

                      requestBlePermissions();
                      return;
                  }

                  try {

                      if (gatt != null) {
                          gatt.close();
                      }

                      writeChar = null;

                      status.setText(
                          "BLE: connecting " +
                          device.getAddress()
                      );

                      if (
                          Build.VERSION.SDK_INT >= 23
                      ) {

                          gatt =
                              device.connectGatt(
                                  this,
                                  false,
                                  gattCallback,
                                  BluetoothDevice.TRANSPORT_LE
                              );

                      } else {

                          gatt =
                              device.connectGatt(
                                  this,
                                  false,
                                  gattCallback
                              );
                      }

                  } catch (Exception e) {

                      status.setText(
                          "BLE connect error: " +
                          e.getClass()
                              .getSimpleName()
                      );
                  }
              }

              private final BluetoothGattCallback gattCallback =
                  new BluetoothGattCallback() {

                      @Override
                      public void onConnectionStateChange(
                          BluetoothGatt g,
                          int statusCode,
                          int newState
                      ) {

                          runOnUiThread(
                              () -> {

                                  if (
                                      newState ==
                                      BluetoothProfile
                                          .STATE_CONNECTED
                                  ) {

                                      status.setText(
                                          "BLE: connected — discovering GATT"
                                      );

                                  } else {

                                      status.setText(
                                          "BLE: disconnected"
                                      );
                                  }
                              }
                          );

                          if (
                              newState ==
                              BluetoothProfile
                                  .STATE_CONNECTED
                          ) {

                              try {
                                  g.discoverServices();
                              } catch (Exception ignored) {
                              }

                          } else {

                              writeChar = null;

                              try {
                                  g.close();
                              } catch (Exception ignored) {
                              }
                          }
                      }

                      @Override
                      public void onServicesDiscovered(
                          BluetoothGatt g,
                          int statusCode
                      ) {

                          BluetoothGattService service =
                              g.getService(
                                  LED_SERVICE
                              );

                          writeChar =
                              service == null
                                  ? null
                                  : service.getCharacteristic(
                                      LED_WRITE
                                  );

                          enableNotifications(g);

                          boolean ready =
                              writeChar != null;

                          boolean ota =
                              g.getService(
                                  OTA_SERVICE
                              ) != null;

                          runOnUiThread(
                              () ->
                                  status.setText(
                                      ready
                                          ? "BLE: READY FFE1" +
                                            (
                                                ota
                                                    ? " • OTA exposed"
                                                    : ""
                                            )
                                          : "BLE: connected, FFE1 not exposed"
                                  )
                          );
                      }

                      @Override
                      public void onCharacteristicChanged(
                          BluetoothGatt g,
                          BluetoothGattCharacteristic characteristic
                      ) {

                          byte[] value =
                              characteristic.getValue();

                          runOnUiThread(
                              () ->
                                  status.setText(
                                      "BLE RX: " +
                                      toHex(value)
                                  )
                          );
                      }
                  };

              private void enableNotifications(
                  BluetoothGatt g
              ) {

                  for (
                      BluetoothGattService service :
                      g.getServices()
                  ) {

                      for (
                          BluetoothGattCharacteristic c :
                          service.getCharacteristics()
                      ) {

                          int properties =
                              c.getProperties();

                          boolean notify =
                              (
                                  properties &
                                  BluetoothGattCharacteristic
                                      .PROPERTY_NOTIFY
                              ) != 0;

                          boolean indicate =
                              (
                                  properties &
                                  BluetoothGattCharacteristic
                                      .PROPERTY_INDICATE
                              ) != 0;

                          if (
                              !notify &&
                              !indicate
                          ) {
                              continue;
                          }

                          try {

                              g.setCharacteristicNotification(
                                  c,
                                  true
                              );

                              BluetoothGattDescriptor descriptor =
                                  c.getDescriptor(
                                      CCCD
                                  );

                              if (
                                  descriptor != null
                              ) {

                                  descriptor.setValue(
                                      indicate
                                          ? BluetoothGattDescriptor
                                              .ENABLE_INDICATION_VALUE
                                          : BluetoothGattDescriptor
                                              .ENABLE_NOTIFICATION_VALUE
                                  );

                                  g.writeDescriptor(
                                      descriptor
                                  );
                              }

                          } catch (Exception ignored) {
                          }
                      }
                  }
              }

              private void send(
                  byte[] data
              ) {

                  if (
                      data == null ||
                      data.length == 0
                  ) {
                      return;
                  }

                  synchronized (queue) {
                      queue.add(data);
                  }

                  drain();
              }

              private void drain() {

                  if (writing) {
                      return;
                  }

                  byte[] data;

                  synchronized (queue) {
                      data = queue.poll();
                  }

                  if (data == null) {
                      return;
                  }

                  if (
                      gatt == null ||
                      writeChar == null
                  ) {

                      status.setText(
                          "BLE: not READY FFE1"
                      );

                      return;
                  }

                  writing = true;

                  main.postDelayed(
                      () -> {

                          try {

                              writeChar.setWriteType(
                                  BluetoothGattCharacteristic
                                      .WRITE_TYPE_DEFAULT
                              );

                              writeChar.setValue(
                                  data
                              );

                              boolean ok =
                                  gatt.writeCharacteristic(
                                      writeChar
                                  );

                              if (ok) {

                                  status.setText(
                                      "BLE TX: " +
                                      toHex(data)
                                  );

                              } else {

                                  status.setText(
                                      "BLE: write rejected"
                                  );
                              }

                          } catch (Exception e) {

                              status.setText(
                                  "BLE write error: " +
                                  e.getClass()
                                      .getSimpleName()
                              );
                          }

                          writing = false;

                          drain();

                      },
                      90
                  );
              }

              private byte[] packet(
                  int... values
              ) {

                  byte[] b =
                      new byte[values.length];

                  for (
                      int i = 0;
                      i < values.length;
                      i++
                  ) {

                      b[i] =
                          (byte)(
                              values[i] & 0xFF
                          );
                  }

                  return b;
              }

              private byte[] powerPacket(
                  boolean on
              ) {

                  return packet(
                      0x7B,
                      0xFF,
                      0x04,
                      on ? 0x01 : 0x00,
                      0xFF,
                      0xFF,
                      0xFF,
                      0xFF,
                      0xBF
                  );
              }

              private byte[] rgbPacket(
                  int r,
                  int g,
                  int b
              ) {

                  return packet(
                      0x7B,
                      0xFF,
                      0x07,
                      r,
                      g,
                      b,
                      0x00,
                      0xFF,
                      0xBF
                  );
              }

              private byte[] brightnessPacket(
                  int value
              ) {

                  value =
                      Math.max(
                          0,
                          Math.min(
                              100,
                              value
                          )
                      );

                  return packet(
                      0x7B,
                      0xFF,
                      0x01,
                      (value * 32) / 100,
                      value,
                      0x00,
                      0xFF,
                      0xFF,
                      0xBF
                  );
              }

              private byte[] speedPacket(
                  int value
              ) {

                  return packet(
                      0x7B,
                      0xFF,
                      0x02,
                      value,
                      0x00,
                      0xFF,
                      0xFF,
                      0xFF,
                      0xBF
                  );
              }

              private byte[] modePacket(
                  int mode
              ) {

                  mode =
                      Math.max(
                          0,
                          Math.min(
                              210,
                              mode
                          )
                      );

                  return packet(
                      0x7B,
                      0xFF,
                      0x03,
                      mode,
                      0xFF,
                      0xFF,
                      0xFF,
                      0xFF,
                      0xBF
                  );
              }

              private byte[] directionPacket(
                  int direction
              ) {

                  return packet(
                      0x7B,
                      0xFF,
                      0x0D,
                      direction,
                      0xFF,
                      0xFF,
                      0xFF,
                      0xFF,
                      0xBF
                  );
              }

              private void applyCustom(
                  String text,
                  int mode,
                  boolean forward
              ) {

                  String[] values =
                      text.split(",");

                  ArrayList<Integer> colors =
                      new ArrayList<>();

                  for (String value : values) {

                      try {

                          String s =
                              value
                                  .trim()
                                  .replace(
                                      "#",
                                      ""
                                  );

                          if (
                              s.length() == 6
                          ) {

                              colors.add(
                                  Integer.parseInt(
                                      s,
                                      16
                                  )
                              );
                          }

                      } catch (Exception ignored) {
                      }
                  }

                  if (
                      colors.size() < 1 ||
                      colors.size() > 16
                  ) {

                      Toast.makeText(
                          this,
                          "Masukkan 1–16 warna HEX",
                          Toast.LENGTH_SHORT
                      ).show();

                      return;
                  }

                  for (
                      int i = 0;
                      i < colors.size();
                      i++
                  ) {

                      int value =
                          colors.get(i);

                      send(
                          packet(
                              0x7B,
                              i + 1,
                              0x0E,
                              0xFD,
                              (value >> 16) & 255,
                              (value >> 8) & 255,
                              value & 255,
                              colors.size(),
                              0xBF
                          )
                      );
                  }

                  send(
                      packet(
                          0x7B,
                          0xFF,
                          0x13,
                          mode,
                          0xFF,
                          0xFF,
                          0xFF,
                          0xFF,
                          0xBF
                      )
                  );

                  send(
                      directionPacket(
                          forward ? 0 : 1
                      )
                  );
              }

              private byte[] parseHex(
                  String text
              ) {

                  try {

                      String trimmed =
                          text
                              .replace(
                                  ",",
                                  " "
                              )
                              .trim();

                      if (
                          trimmed.isEmpty()
                      ) {

                          return null;
                      }

                      String[] parts =
                          trimmed.split(
                              "\\s+"
                          );

                      byte[] data =
                          new byte[
                              parts.length
                          ];

                      for (
                          int i = 0;
                          i < parts.length;
                          i++
                      ) {

                          if (
                              parts[i].length() > 2
                          ) {

                              throw new Exception();
                          }

                          data[i] =
                              (byte)
                              Integer.parseInt(
                                  parts[i],
                                  16
                              );
                      }

                      return data;

                  } catch (Exception e) {

                      Toast.makeText(
                          this,
                          "HEX tidak valid",
                          Toast.LENGTH_SHORT
                      ).show();

                      return null;
                  }
              }

              private String toHex(
                  byte[] data
              ) {

                  if (data == null) {
                      return "";
                  }

                  StringBuilder s =
                      new StringBuilder();

                  for (byte b : data) {

                      s.append(
                          String.format(
                              Locale.US,
                              "%02X ",
                              b & 255
                          )
                      );
                  }

                  return s.toString().trim();
              }

              private int parseColor(
                  String text,
                  int fallback
              ) {

                  try {
                      return Color.parseColor(
                          text
                      );
                  } catch (Exception e) {
                      return fallback;
                  }
              }

              @Override
              protected void onDestroy() {

                  super.onDestroy();

                  try {

                      if (
                          scanner != null &&
                          scanning
                      ) {

                          scanner.stopScan(
                              scanCallback
                          );
                      }

                  } catch (Exception ignored) {
                  }

                  try {

                      if (gatt != null) {
                          gatt.close();
                      }

                  } catch (Exception ignored) {
                  }

                  tx.shutdownNow();
              }

              private class StripView
                  extends View {

                  private final Paint paint =
                      new Paint(3);

                  private int mode = 1;
                  private int primary =
                      Color.CYAN;

                  private boolean mirror = false;

                  StripView(
                      android.content.Context context
                  ) {

                      super(context);

                      /*
                       * IMPORTANT:
                       * preview tidak clickable.
                       * Jadi preview tidak menelan
                       * touch event tombol di atas/bawahnya.
                       */
                      setClickable(false);
                      setFocusable(false);
                  }

                  void setMode(
                      int value
                  ) {

                      mode = value;
                  }

                  void setPrimary(
                      int value
                  ) {

                      primary = value;
                  }

                  void setMirror(
                      boolean value
                  ) {

                      mirror = value;
                  }

                  @Override
                  protected void onDraw(
                      Canvas canvas
                  ) {

                      super.onDraw(canvas);

                      paint.setStyle(
                          Paint.Style.FILL
                      );

                      paint.setColor(
                          Color.rgb(
                              11,
                              15,
                              21
                          )
                      );

                      canvas.drawRoundRect(
                          new RectF(
                              6,
                              6,
                              getWidth() - 6,
                              getHeight() - 6
                          ),
                          18,
                          18,
                          paint
                      );

                      int count = 32;

                      float y =
                          getHeight() / 2f;

                      float gap =
                          (getWidth() - 28) /
                          (float)count;

                      float phase =
                          System.currentTimeMillis()
                          / 80f;

                      for (
                          int i = 0;
                          i < count;
                          i++
                      ) {

                          int index =
                              mirror
                                  ? count - 1 - i
                                  : i;

                          float wave =
                              (float)
                              Math.sin(
                                  (
                                      index +
                                      phase
                                  ) *
                                  0.45
                              );

                          int alpha =
                              90 +
                              (
                                  int
                                  (
                                      145 *
                                      Math.max(
                                          0,
                                          wave
                                      )
                                  )
                              );

                          int color =
                              Color.HSVToColor(
                                  new float[]{
                                      (
                                          i *
                                          360f /
                                          count +
                                          mode * 7
                                      ) % 360,
                                      0.82f,
                                      1f
                                  }
                              );

                          if (mode == 0) {
                              color =
                                  Color.DKGRAY;
                          }

                          if (mode % 11 == 0) {
                              color =
                                  primary;
                          }

                          paint.setColor(
                              Color.argb(
                                  Math.min(
                                      255,
                                      alpha
                                  ),
                                  Color.red(color),
                                  Color.green(color),
                                  Color.blue(color)
                              )
                          );

                          canvas.drawCircle(
                              14 +
                              i * gap,
                              y,
                              Math.max(
                                  4,
                                  gap * 0.28f
                              ),
                              paint
                          );
                      }

                      postInvalidateDelayed(
                          60
                      );
                  }
              }

              private class ColorWheelView
                  extends View {

                  private final Paint paint =
                      new Paint(3);

                  private float centerX;
                  private float centerY;
                  private float radius;

                  private int color =
                      Color.CYAN;

                  private OnColorSelectedListener listener;

                  interface OnColorSelectedListener {
                      void onColor(int color);
                  }

                  ColorWheelView(
                      android.content.Context context
                  ) {

                      super(context);

                      setClickable(true);
                      setFocusable(true);
                  }

                  void setOnColorSelectedListener(
                      OnColorSelectedListener l
                  ) {

                      listener = l;
                  }

                  void setColor(
                      int value
                  ) {

                      color = value;
                      invalidate();
                  }

                  @Override
                  protected void onDraw(
                      Canvas canvas
                  ) {

                      super.onDraw(canvas);

                      centerX =
                          getWidth() / 2f;

                      centerY =
                          getHeight() / 2f;

                      radius =
                          Math.min(
                              centerX,
                              centerY
                          ) -
                          dp(14);

                      paint.setStyle(
                          Paint.Style.FILL
                      );

                      paint.setShader(
                          new SweepGradient(
                              centerX,
                              centerY,
                              new int[]{
                                  Color.RED,
                                  Color.MAGENTA,
                                  Color.BLUE,
                                  Color.CYAN,
                                  Color.GREEN,
                                  Color.YELLOW,
                                  Color.RED
                              },
                              null
                          )
                      );

                      canvas.drawCircle(
                          centerX,
                          centerY,
                          radius,
                          paint
                      );

                      paint.setShader(null);

                      paint.setColor(
                          Color.rgb(
                              18,
                              22,
                              29
                          )
                      );

                      canvas.drawCircle(
                          centerX,
                          centerY,
                          radius * 0.42f,
                          paint
                      );

                      paint.setStyle(
                          Paint.Style.STROKE
                      );

                      paint.setStrokeWidth(
                          dp(3)
                      );

                      paint.setColor(
                          Color.WHITE
                      );

                      float[] hsv =
                          new float[3];

                      Color.colorToHSV(
                          color,
                          hsv
                      );

                      double angle =
                          Math.toRadians(
                              hsv[0] - 90
                          );

                      float markerRadius =
                          radius * 0.70f;

                      float x =
                          centerX +
                          (float)
                          Math.cos(angle) *
                          markerRadius;

                      float y =
                          centerY +
                          (float)
                          Math.sin(angle) *
                          markerRadius;

                      canvas.drawCircle(
                          x,
                          y,
                          dp(9),
                          paint
                      );

                      paint.setStyle(
                          Paint.Style.FILL
                      );
                  }

                  @Override
                  public boolean onTouchEvent(
                      MotionEvent event
                  ) {

                      if (
                          event.getAction() ==
                              MotionEvent.ACTION_DOWN ||
                          event.getAction() ==
                              MotionEvent.ACTION_MOVE
                      ) {

                          float dx =
                              event.getX() -
                              centerX;

                          float dy =
                              event.getY() -
                              centerY;

                          double distance =
                              Math.sqrt(
                                  dx * dx +
                                  dy * dy
                              );

                          if (
                              distance >
                              radius * 0.35
                          ) {

                              float degrees =
                                  (
                                      float
                                      Math.toDegrees(
                                          Math.atan2(
                                              dy,
                                              dx
                                          )
                                      )
                                  ) +
                                  90f;

                              if (
                                  degrees < 0
                              ) {
                                  degrees +=
                                      360f;
                              }

                              color =
                                  Color.HSVToColor(
                                      new float[]{
                                          degrees,
                                          1f,
                                          1f
                                      }
                                  );

                              invalidate();

                              if (
                                  listener != null
                              ) {

                                  listener.onColor(
                                      color
                                  );
                              }
                          }

                          return true;
                      }

                      return true;
                  }
              }
          }
