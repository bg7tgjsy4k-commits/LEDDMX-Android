              private void editFrame(
                      int index,
                      PreviewView preview,
                      Runnable rebuild) {

                  Frame f=frames.get(index);

                  LinearLayout box =
                      vertical();

                  EditText duration =
                      new EditText(this);

                  duration.setText(
                      String.valueOf(
                          f.duration
                      )
                  );

                  duration.setInputType(
                      2
                  );

                  box.addView(duration);

                  new AlertDialog.Builder(this)
                      .setTitle(
                          "FRAME " +
                          (index+1)
                      )
                      .setMessage(
                          "Duration milliseconds"
                      )
                      .setView(box)
                      .setPositiveButton(
                          "SAVE",
                          (d,w) -> {

                              try {
                                  f.duration =
                                      Math.max(
                                          50,
                                          Integer.parseInt(
                                              duration
                                                  .getText()
                                                  .toString()
                                          )
                                      );
                              } catch(Exception ignored){}

                              rebuild.run();
                              preview.invalidate();
                          }
                      )
                      .setNegativeButton(
                          "CANCEL",
                          null
                      )
                      .show();
              }

              private void saveSlot() {

                  StringBuilder data =
                      new StringBuilder();

                  for(Frame f:frames) {

                      data.append(
                          f.left
                      ).append(",")
                       .append(
                          f.right
                      ).append(",")
                       .append(
                          f.duration
                      ).append(";");

                  }

                  prefs.edit()
                      .putString(
                          "slot_"+customSlot,
                          data.toString()
                      )
                      .apply();

                  toast(
                      "SLOT " +
                      customSlot +
                      " SAVED"
                  );
              }

              private void loadSlot(
                      int slot) {

                  frames.clear();

                  String data =
                      prefs.getString(
                          "slot_"+slot,
                          ""
                      );

                  if(data.isEmpty()) return;

                  String[] fs =
                      data.split(";");

                  for(String x:fs) {

                      try {

                          String[] p =
                              x.split(",");

                          frames.add(
                              new Frame(
                                  Integer.parseInt(p[0]),
                                  Integer.parseInt(p[1]),
                                  Integer.parseInt(p[2])
                              )
                          );

                      } catch(Exception ignored){}
                  }
              }

              private void applyCustom() {

                  if(!connected) {
                      toast(
                          "Connect LEDDMX terlebih dahulu."
                      );
                      return;
                  }

                  ArrayList<Integer> colors =
                      new ArrayList<>();

                  for(Frame f:frames) {

                      if(!colors.contains(f.left)) {
                          colors.add(f.left);
                      }

                      if(!colors.contains(f.right)) {
                          colors.add(f.right);
                      }
                  }

                  if(colors.isEmpty()) {
                      colors.add(Color.RED);
                  }

                  int total =
                      Math.min(
                          16,
                          colors.size()
                      );

                  for(int i=0;i<total;i++) {

                      int c =
                          colors.get(i);

                      enqueue(
                          customColorPacket(
                              i+1,
                              total,
                              Color.red(c),
                              Color.green(c),
                              Color.blue(c)
                          )
                      );
                  }

                  /*
                   * CustomPatternMode:
                   * 0 GD
                   * 1 FD
                   * 2 FW
                   * 3 FS
                   * 4 AC
                   * 5 PU
                   * 6 FL
                   * 7 HO
                   */

                  enqueue(
                      customModePacket(1)
                  );

                  enqueue(
                      directionPacket(false)
                  );

                  toast(
                      "CUSTOM PATTERN SENT"
                  );
              }

