name: Build LEDDMX Pro FINAL

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

env:
  GRADLE_VERSION: 7.6.1
  AGP_VERSION: 7.4.2
  COMPILE_SDK: 33
  BUILD_TOOLS: 33.0.2

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Gradle 7.6.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.6.1'
          cache-disabled: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 33
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-${COMPILE_SDK}" \
            "build-tools;${BUILD_TOOLS}"

          yes | sdkmanager --licenses >/dev/null || true

      - name: Create clean project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf app build.gradle settings.gradle gradle.properties gradle local.properties src

          mkdir -p app/src/main/java/com/leddmx/pro
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = 'LEDDMX-Pro'

include ':app'
EOF

          cat > build.gradle <<'EOF'
plugins {
    id 'com.android.application' version '7.4.2' apply false
}
EOF

          cat > gradle.properties <<'EOF'
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.daemon=false
android.useAndroidX=false
android.nonTransitiveRClass=true
EOF

          cat > app/build.gradle <<'EOF'
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.leddmx.pro'

    compileSdk 33
    buildToolsVersion '33.0.2'

    defaultConfig {
        applicationId 'com.leddmx.pro'
        minSdk 21
        targetSdk 33

        versionCode 100
        versionName '1.0.0-FINAL'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
<resources>
    <string name="app_name">LEDDMX Pro</string>
</resources>
EOF

          cat > app/src/main/res/values/colors.xml <<'EOF'
<resources>
    <color name="black">#05070A</color>
    <color name="white">#F5F7FA</color>
</resources>
EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
<resources>

    <style name="AppTheme"
        parent="android:style/Theme.Material.NoActionBar">

        <item name="android:fontFamily">sans</item>

        <item name="android:windowLightStatusBar">false</item>

        <item name="android:statusBarColor">#05070A</item>
        <item name="android:navigationBarColor">#05070A</item>

        <item name="android:colorAccent">#35D07F</item>

        <item name="android:windowActionModeOverlay">true</item>

    </style>

</resources>
EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
<manifest xmlns:android="http://schemas.android.com/apk/res/android">

    <uses-feature
        android:name="android.hardware.bluetooth_le"
        android:required="false" />

    <!-- Android <= 30 -->
    <uses-permission
        android:name="android.permission.BLUETOOTH"
        android:maxSdkVersion="30" />

    <uses-permission
        android:name="android.permission.BLUETOOTH_ADMIN"
        android:maxSdkVersion="30" />

    <uses-permission
        android:name="android.permission.ACCESS_FINE_LOCATION"
        android:maxSdkVersion="30" />

    <!-- Android 12+ -->
    <uses-permission
        android:name="android.permission.BLUETOOTH_SCAN" />

    <uses-permission
        android:name="android.permission.BLUETOOTH_CONNECT" />

    <application
        android:theme="@style/AppTheme"
        android:label="LEDDMX Pro"
        android:allowBackup="false"
        android:supportsRtl="true">

        <activity
            android:name=".MainActivity"
            android:screenOrientation="portrait"
            android:exported="true">

            <intent-filter>

                <action android:name="android.intent.action.MAIN" />

                <category
                    android:name="android.intent.category.LAUNCHER" />

            </intent-filter>

        </activity>

    </application>

</manifest>
EOF

      - name: Generate 210 mode names
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import re
          import urllib.request

          url = "https://raw.githubusercontent.com/user154lt/LEDDMX-00/main/PatternList.kt"

          names = []

          try:
              text = urllib.request.urlopen(
                  url,
                  timeout=15
              ).read().decode("utf-8")

              names = re.findall(
                  r'"((?:\\.|[^"\\])*)"',
                  text
              )

          except Exception:
              names = []

          try:
              names = [
                  bytes(x, "utf-8").decode("unicode_escape")
                  for x in names
              ]
          except Exception:
              pass

          if len(names) < 211:
              names = ["Off"] + [
                  f"Effect {i}"
                  for i in range(1, 211)
              ]

          names = names[:211]

          with open(
              "app/src/main/java/com/leddmx/pro/Patterns.java",
              "w",
              encoding="utf-8"
          ) as f:

              f.write(
                  "package com.leddmx.pro;\n"
                  "public final class Patterns {\n"
                  "public static final String[] NAMES = new String[]{\n"
              )

              for n in names:

                  safe = (
                      n.replace("\\", "\\\\")
                       .replace('"', '\\"')
                       .replace("\n", " ")
                  )

                  f.write(
                      '"' + safe + '",\n'
                  )

              f.write(
                  "};\n"
                  "private Patterns(){}\n"
                  "}\n"
              )
          PY

      - name: Write final MainActivity
        shell: bash
        run: |
          set -euo pipefail

          cat > app/src/main/java/com/leddmx/pro/MainActivity.java <<'JAVA'
package com.leddmx.pro;

import android.Manifest;
import android.app.*;
import android.bluetooth.*;
import android.bluetooth.le.*;
import android.content.*;
import android.content.pm.PackageManager;
import android.graphics.*;
import android.graphics.drawable.GradientDrawable;
import android.os.*;
import android.view.*;
import android.widget.*;

import java.util.*;
import java.util.concurrent.*;

public class MainActivity extends Activity {

    static final String SERVICE =
            "0000FFE0-0000-1000-8000-00805F9B34FB";

    static final String WRITE =
            "0000FFE1-0000-1000-8000-00805F9B34FB";

    static final String OTA =
            "5833FF01-9B8B-5191-6142-22A4536EF123";

    final int GREEN =
            Color.rgb(53,208,127);

    final int BG =
            Color.rgb(5,7,10);

    final int CARD =
            Color.rgb(18,23,29);

    final int TEXT =
            Color.rgb(242,246,250);

    final int MUTED =
            Color.rgb(145,154,166);

    BluetoothAdapter adapter;
    BluetoothLeScanner scanner;
    BluetoothGatt gatt;
    BluetoothGattCharacteristic tx;

    final LinkedHashMap<String,BluetoothDevice> devices =
            new LinkedHashMap<>();

    final LinkedHashMap<String,String> deviceInfo =
            new LinkedHashMap<>();

    ScanCallback scanCallback;

    final Handler handler =
            new Handler(Looper.getMainLooper());

    boolean scanning = false;

    long lastScan = 0;

    String page = "Home";

    int rgb = Color.WHITE;

    int brightness = 100;

    int speed = 50;

    boolean power = false;

    SharedPreferences prefs;

    LinearLayout root;
    LinearLayout content;

    TextView status;
    TextView title;

    DrawerLayoutCompat drawer;

    final ArrayDeque<byte[]> queue =
            new ArrayDeque<>();

    boolean writing = false;

    long lastWrite = 0;

    @Override
    public void onCreate(Bundle b) {

        super.onCreate(b);

        getWindow().setStatusBarColor(BG);
        getWindow().setNavigationBarColor(BG);

        prefs =
                getSharedPreferences(
                        "leddmx",
                        0
                );

        buildShell();

        requestBle();
    }

    void buildShell() {

        drawer =
                new DrawerLayoutCompat(this);

        root =
                col();

        LinearLayout bar =
                row();

        bar.setPadding(
                22,
                18,
                14,
                12
        );

        TextView menu =
                txt(
                        "☰",
                        30,
                        TEXT
                );

        bar.addView(
                menu,
                new LinearLayout.LayoutParams(
                        55,
                        60
                )
        );

        title =
                txt(
                        "LEDDMX Pro",
                        23,
                        TEXT
                );

        title.setTypeface(
                null,
                1
        );

        bar.addView(
                title,
                new LinearLayout.LayoutParams(
                        0,
                        60,
                        1
                )
        );

        status =
                txt(
                        "OFFLINE • Tap SCAN",
                        13,
                        MUTED
                );

        status.setGravity(
                Gravity.CENTER_VERTICAL
        );

        bar.addView(
                status,
                new LinearLayout.LayoutParams(
                        155,
                        60
                )
        );

        root.addView(bar);

        menu.setOnClickListener(
                v -> drawer.open()
        );

        content =
                col();

        ScrollView sv =
                new ScrollView(this);

        sv.addView(content);

        root.addView(
                sv,
                new LinearLayout.LayoutParams(
                        -1,
                        0,
                        1
                )
        );

        setContentView(drawer);

        buildDrawer();

        showHome();
    }

    LinearLayout col() {

        LinearLayout x =
                new LinearLayout(this);

        x.setOrientation(
                LinearLayout.VERTICAL
        );

        x.setBackgroundColor(BG);

        return x;
    }

    LinearLayout row() {

        LinearLayout x =
                new LinearLayout(this);

        x.setOrientation(
                LinearLayout.HORIZONTAL
        );

        x.setGravity(
                Gravity.CENTER_VERTICAL
        );

        return x;
    }

    TextView txt(
            String s,
            float z,
            int c
    ) {

        TextView t =
                new TextView(this);

        t.setText(s);
        t.setTextSize(z);
        t.setTextColor(c);

        t.setPadding(
                8,
                8,
                8,
                8
        );

        return t;
    }

    Button btn(String s) {

        Button b =
                new Button(this);

        b.setText(s);

        b.setTextColor(TEXT);

        b.setTextSize(13);

        b.setAllCaps(false);

        b.setBackground(
                round(
                        CARD,
                        18
                )
        );

        return b;
    }

    GradientDrawable round(
            int c,
            float r
    ) {

        GradientDrawable g =
                new GradientDrawable();

        g.setColor(c);

        g.setCornerRadius(r);

        return g;
    }

    TextView h2(String s) {

        TextView t =
                txt(
                        s,
                        18,
                        TEXT
                );

        t.setTypeface(
                null,
                1
        );

        t.setPadding(
                20,
                18,
                20,
                10
        );

        return t;
    }

    void clear() {

        content.removeAllViews();

        title.setText(page);
    }

    void add(View v) {

        content.addView(
                v,
                new LinearLayout.LayoutParams(
                        -1,
                        -2
                )
