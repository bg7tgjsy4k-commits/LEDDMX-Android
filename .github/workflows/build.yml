              // ============================================================
              // PERMISSIONS
              // ============================================================

              private void requestPermissionsBle() {

                  ArrayList<String> list =
                          new ArrayList<>();

                  if (Build.VERSION.SDK_INT >= 31) {

                      if (checkSelfPermission(
                              Manifest.permission.BLUETOOTH_SCAN
                      ) != PackageManager.PERMISSION_GRANTED) {

                          list.add(
                                  Manifest.permission.BLUETOOTH_SCAN
                          );
                      }

                      if (checkSelfPermission(
                              Manifest.permission.BLUETOOTH_CONNECT
                      ) != PackageManager.PERMISSION_GRANTED) {

                          list.add(
                                  Manifest.permission.BLUETOOTH_CONNECT
                          );
                      }

                  } else if (Build.VERSION.SDK_INT >= 23) {

                      if (checkSelfPermission(
                              Manifest.permission.ACCESS_FINE_LOCATION
                      ) != PackageManager.PERMISSION_GRANTED) {

                          list.add(
                                  Manifest.permission.ACCESS_FINE_LOCATION
                          );
                      }
                  }

                  if (!list.isEmpty()) {

                      requestPermissions(
                              list.toArray(
                                      new String[0]
                              ),
                              500
                      );
                  }
              }

              @Override
              public void onRequestPermissionsResult(
                      int requestCode,
                      String[] permissions,
                      int[] results
              ) {

                  super.onRequestPermissionsResult(
                          requestCode,
                          permissions,
                          results
                  );

                  if (requestCode != 500)
                      return;

                  boolean ok = true;

                  for (int r : results) {

                      if (r != PackageManager.PERMISSION_GRANTED) {
                          ok = false;
                          break;
                      }
                  }

                  if (ok)
                      toast(
                              "Permission BLE aktif."
                      );
                  else
                      toast(
                              "Permission BLE ditolak. Izinkan Nearby Devices."
                      );
              }

              // ============================================================
              // BLUETOOTH READY
              // ============================================================

              private boolean bluetoothReady() {

                  if (adapter == null) {

                      toast(
                              "Bluetooth LE tidak tersedia."
                      );

                      return false;
                  }

                  try {

                      if (!adapter.isEnabled()) {

                          startActivity(
                                  new Intent(
                                          BluetoothAdapter
                                                  .ACTION_REQUEST_ENABLE
                                  )
                          );

                          return false;
                      }

                  } catch (SecurityException e) {

                      requestPermissionsBle();
                      return false;
                  }

                  if (Build.VERSION.SDK_INT >= 31) {

                      if (
                              checkSelfPermission(
                                      Manifest.permission.BLUETOOTH_SCAN
                              ) != PackageManager.PERMISSION_GRANTED
                              ||
                              checkSelfPermission(
                                      Manifest.permission.BLUETOOTH_CONNECT
                              ) != PackageManager.PERMISSION_GRANTED
                      ) {

                          requestPermissionsBle();
                          return false;
                      }

                  } else if (Build.VERSION.SDK_INT >= 23) {

                      if (
                              checkSelfPermission(
                                      Manifest.permission.ACCESS_FINE_LOCATION
                              ) != PackageManager.PERMISSION_GRANTED
                      ) {

                          requestPermissionsBle();
                          return false;
                      }

                      try {

                          android.location.LocationManager lm =
                                  (android.location.LocationManager)
                                          getSystemService(
                                                  Context.LOCATION_SERVICE
                                          );

                          if (
                                  lm != null
                                  &&
                                  !lm.isProviderEnabled(
                                          android.location.LocationManager
                                                  .GPS_PROVIDER
                                  )
                                  &&
                                  !lm.isProviderEnabled(
                                          android.location.LocationManager
                                                  .NETWORK_PROVIDER
                                  )
                          ) {

                              toast(
                                      "Aktifkan Location/GPS untuk BLE scan Android lama."
                              );

                              return false;
                          }

                      } catch (Exception ignored) {
                      }
                  }

                  return true;
              }

