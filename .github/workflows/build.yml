                                  .toLowerCase(
                                      Locale.US
                                  );

                          frames.clear();

                          ArrayList<Integer> cs =
                              new ArrayList<>();

                          if(q.contains("merah") ||
                             q.contains("red"))
                              cs.add(Color.RED);

                          if(q.contains("hijau") ||
                             q.contains("green"))
                              cs.add(Color.GREEN);

                          if(q.contains("biru") ||
                             q.contains("blue"))
                              cs.add(Color.BLUE);

                          if(q.contains("putih") ||
                             q.contains("white"))
                              cs.add(Color.WHITE);

                          if(q.contains("kuning") ||
                             q.contains("yellow"))
                              cs.add(Color.YELLOW);

                          if(q.contains("cyan"))
                              cs.add(Color.CYAN);

                          if(cs.isEmpty())
                              cs.add(Color.RED);

                          if(q.contains("rainbow")) {

