              private static class ColorWheel
                      extends View {

                  private final Paint paint =
                          new Paint(
                                  Paint.ANTI_ALIAS_FLAG
                          );

                  private float centerX;
                  private float centerY;
                  private float radius;

                  interface Listener {
                      void select(
                              int r,
                              int g,
                              int b
                      );
                  }

                  private Listener listener;

                  ColorWheel(
                          Context context
                  ) {
                      super(context);

                      paint.setStyle(
                              Paint.Style.FILL
                      );
                  }

                  @Override
                  protected void onDraw(
                          Canvas canvas
                  ) {
                      super.onDraw(canvas);

                      centerX =
                              getWidth() / 2f;

                      centerY =
                              getHeight() / 2f;

                      radius =
                              Math.min(
                                      centerX,
                                      centerY
                              )
                                      - 18;

                      for (
                              int angle = 0;
                              angle < 360;
                              angle++
                      ) {
                          paint.setColor(
                                  Color.HSVToColor(
                                          new float[]{
                                                  angle,
                                                  1f,
                                                  1f
                                          }
                                  )
                          );

                          canvas.drawArc(
                                  centerX - radius,
                                  centerY - radius,
                                  centerX + radius,
                                  centerY + radius,
                                  angle,
                                  1.2f,
                                  true,
                                  paint
                          );
                      }

                      paint.setStyle(
                              Paint.Style.STROKE
                      );

                      paint.setStrokeWidth(4);

                      paint.setColor(
                              Color.WHITE
                      );

                      canvas.drawCircle(
                              centerX,
                              centerY,
                              radius,
                              paint
                      );

                      paint.setStyle(
                              Paint.Style.FILL
                      );
                  }

                  @Override
                  public boolean onTouchEvent(
                          MotionEvent event
                  ) {
                      if (
                              event.getAction()
                                      ==
                              MotionEvent.ACTION_DOWN
                                      ||
                              event.getAction()
                                      ==
                              MotionEvent.ACTION_MOVE
                      ) {
                          float dx =
                                  event.getX()
                                          - centerX;

                          float dy =
                                  event.getY()
                                          - centerY;

                          double angle =
                                  Math.toDegrees(
                                          Math.atan2(
                                                  dy,
                                                  dx
                                          )
                                  );

                          if (
                                  angle < 0
                          ) {
                              angle += 360;
                          }

                          int color =
                                  Color.HSVToColor(
                                          new float[]{
                                                  (float)
                                                          angle,
                                                  1f,
                                                  1f
                                          }
                                  );

                          if (
                                  listener != null
                          ) {
                              listener.select(
                                      Color.red(
                                              color
                                      ),
                                      Color.green(
                                              color
                                      ),
                                      Color.blue(
                                              color
                                      )
                              );
                          }

                          invalidate();

                          return true;
                      }

                      return true;
                  }
              }

