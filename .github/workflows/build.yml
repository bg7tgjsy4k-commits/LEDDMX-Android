          cat > app/src/main/java/com/leddmx/pro/BluetoothService.java <<'EOF'
package com.leddmx.pro;

import android.bluetooth.BluetoothGatt;
import android.bluetooth.BluetoothGattCharacteristic;

import java.util.UUID;

public final class BluetoothService {

    public static final UUID SERVICE_FFE0 =
            UUID.fromString("0000FFE0-0000-1000-8000-00805F9B34FB");

    public static final UUID CHAR_FFE1 =
            UUID.fromString("0000FFE1-0000-1000-8000-00805F9B34FB");

    public static final UUID OTA_SERVICE =
            UUID.fromString("5833FF01-9B8B-5191-6142-22A4536EF123");

    public static final UUID OTA_WRITE =
            UUID.fromString("5833FF02-9B8B-5191-6142-22A4536EF123");

    public static final UUID OTA_NOTIFY =
            UUID.fromString("5833FF03-9B8B-5191-6142-22A4536EF123");

    private static final BluetoothService INSTANCE =
            new BluetoothService();

    public BluetoothGatt gatt;
    public BluetoothGattCharacteristic writeChar;
    public boolean connected;

    private BluetoothService() {
    }

    public static BluetoothService get() {
        return INSTANCE;
    }

    public synchronized boolean send(byte[] packet) {
        if (gatt == null ||
                writeChar == null ||
                !connected ||
                packet == null ||
                packet.length == 0) {
            return false;
        }

        try {
            int props = writeChar.getProperties();

            if ((props &
                    BluetoothGattCharacteristic.PROPERTY_WRITE) != 0) {

                writeChar.setWriteType(
                        BluetoothGattCharacteristic.WRITE_TYPE_DEFAULT
                );

            } else if ((props &
                    BluetoothGattCharacteristic.PROPERTY_WRITE_NO_RESPONSE) != 0) {

                writeChar.setWriteType(
                        BluetoothGattCharacteristic.WRITE_TYPE_NO_RESPONSE
                );

            } else {
                return false;
            }

            writeChar.setValue(packet);
            return gatt.writeCharacteristic(writeChar);

        } catch (Exception ignored) {
            return false;
        }
    }

    public synchronized void disconnect() {
        try {
            if (gatt != null) {
                gatt.disconnect();
                gatt.close();
            }
        } catch (Exception ignored) {
        }

        gatt = null;
        writeChar = null;
        connected = false;
    }
}
EOF

