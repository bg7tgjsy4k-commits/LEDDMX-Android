              private String propertyText(
                      int p) {

                  StringBuilder s =
                          new StringBuilder();

                  if ((p & BluetoothGattCharacteristic
                          .PROPERTY_READ) != 0)
                      s.append("READ ");

                  if ((p & BluetoothGattCharacteristic
                          .PROPERTY_WRITE) != 0)
                      s.append("WRITE ");

                  if ((p & BluetoothGattCharacteristic
                          .PROPERTY_WRITE_NO_RESPONSE) != 0)
                      s.append("WRITE_NO_RESPONSE ");

                  if ((p & BluetoothGattCharacteristic
                          .PROPERTY_NOTIFY) != 0)
                      s.append("NOTIFY ");

                  if ((p & BluetoothGattCharacteristic
                          .PROPERTY_INDICATE) != 0)
                      s.append("INDICATE ");

                  return s.toString();
              }

