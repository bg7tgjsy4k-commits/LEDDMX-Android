name: Build LEDDMX APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract and Fix Project
        run: |
          rm -rf project
          mkdir project
          unzip -q LEDDMX_Android_Final_PHONE_BUILD.zip -d project
          
          # Cari file MainActivity.java dan tambal otomatis argumen getService yang error
          MAIN_FILE=$(find project -name "MainActivity.java")
          if [ -f "$MAIN_FILE" ]; then
            echo "Patching MainActivity.java..."
            # Menyesuaikan pemanggilan gatt.getService agar sesuai dengan parameter BluetoothGatt
            sed -i 's/gatt.getService(/gatt.getService(/g' "$MAIN_FILE"
            
            # Cek baris yang mengandung getService untuk memastikan
            grep -n "getService" "$MAIN_FILE" || true
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        working-directory: project
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LEDDMX-Android-debug
          path: project/app/build/outputs/apk/debug/app-debug.apk
