              private void addRaw(
                      String source,
                      byte[] data) {

                  StringBuilder sb =
                          new StringBuilder();

                  sb.append(
                          source
                  ).append("  ");

                  for (byte b :
                          data) {

                      sb.append(
                              String.format(
                                      Locale.US,
                                      "%02X ",
                                      b & 0xFF
                              )
                      );
                  }

                  rawLog.add(
                          sb.toString()
                  );

                  if (rawLog.size() > 300) {
                      rawLog.remove(0);
                  }
              }

