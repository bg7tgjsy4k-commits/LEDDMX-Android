name: LEDDMX Pro FINAL Stable

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Gradle 7.6.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.6.1'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 33
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2"

      - name: Create clean Android project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf app
          rm -rf gradle
          rm -f build.gradle
          rm -f settings.gradle
          rm -f gradle.properties
          rm -f gradlew
          rm -f gradlew.bat

          mkdir -p app/src/main/java/com/leddmx/pro
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          rootProject.name = "LEDDMX-Pro"
          include ":app"
          EOF

          cat > build.gradle <<'EOF'
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }

              dependencies {
                  classpath "com.android.tools.build:gradle:7.4.2"
              }
          }

          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=false
          android.enableJetifier=false
          EOF

          cat > app/build.gradle <<'EOF'
          apply plugin: "com.android.application"

          android {
              compileSdkVersion 33

              defaultConfig {
                  applicationId "com.leddmx.pro"
                  minSdkVersion 21
                  targetSdkVersion 33
                  versionCode 1
                  versionName "1.0"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">LEDDMX Pro Controller</string>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.BLUETOOTH" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" />
              <uses-permission android:name="android.permission.BLUETOOTH_SCAN" />
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />

              <uses-feature
                  android:name="android.hardware.bluetooth_le"
                  android:required="false" />

              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:theme="@android:style/Theme.Material.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > app/src/main/java/com/leddmx/pro/MainActivity.java <<'JAVAEOF'
          package com.leddmx.pro;

          import android.Manifest;
          import android.app.Activity;
          import android.bluetooth.BluetoothAdapter;
          import android.bluetooth.BluetoothDevice;
          import android.bluetooth.BluetoothGatt;
          import android.bluetooth.BluetoothGattCallback;
          import android.bluetooth.BluetoothGattCharacteristic;
          import android.bluetooth.BluetoothGattService;
          import android.bluetooth.BluetoothManager;
          import android.bluetooth.BluetoothProfile;
          import android.bluetooth.le.BluetoothLeScanner;
          import android.bluetooth.le.ScanCallback;
          import android.bluetooth.le.ScanResult;
          import android.content.ClipData;
          import android.content.ClipboardManager;
          import android.content.Context;
          import android.content.SharedPreferences;
          import android.content.pm.PackageManager;
          import android.graphics.Canvas;
          import android.graphics.Color;
          import android.graphics.Paint;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.view.Gravity;
          import android.view.MotionEvent;
          import android.view.View;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.LinearLayout;
          import android.widget.PopupWindow;
          import android.widget.ScrollView;
          import android.widget.SeekBar;
          import android.widget.TextView;
          import android.widget.Toast;

          import java.text.SimpleDateFormat;
          import java.util.ArrayDeque;
          import java.util.ArrayList;
          import java.util.Date;
          import java.util.Locale;
          import java.util.UUID;

          public class MainActivity extends Activity {

              private static final UUID SERVICE_FFE0 =
                      UUID.fromString(
                              "0000ffe0-0000-1000-8000-00805f9b34fb"
                      );

              private static final UUID CHAR_FFE1 =
                      UUID.fromString(
                              "0000ffe1-0000-1000-8000-00805f9b34fb"
                      );

              private static final UUID OTA_SERVICE =
                      UUID.fromString(
                              "5833ff01-9b8b-5191-6142-22a4536ef123"
                      );

              private final Handler handler =
                      new Handler(Looper.getMainLooper());

              private BluetoothAdapter bluetoothAdapter;
              private BluetoothGatt bluetoothGatt;
              private BluetoothGattCharacteristic writeCharacteristic;
              private ScanCallback scanCallback;

              private boolean scanning = false;
              private boolean powerState = true;

              private int red = 255;
              private int green = 0;
              private int blue = 0;
              private int brightnessValue = 100;
              private int speedValue = 50;
              private int selectedMode = 1;

              private String selectedOutput = "BOTH";
              private String page = "HOME";

              private LinearLayout root;
              private LinearLayout body;
              private TextView statusText;

              private SharedPreferences preferences;

              private final ArrayList<BluetoothDevice> foundDevices =
                      new ArrayList<>();

              private final ArrayList<String> terminal =
                      new ArrayList<>();

              private final ArrayDeque<byte[]> writeQueue =
                      new ArrayDeque<>();

              private boolean writeBusy = false;

              private int dp(float value) {
                  return (int) (
                          value *
                          getResources()
                                  .getDisplayMetrics()
                                  .density
                          + 0.5f
                  );
              }

              private LinearLayout row() {
                  LinearLayout layout =
                          new LinearLayout(this);

                  layout.setOrientation(
                          LinearLayout.HORIZONTAL
                  );

                  layout.setPadding(
                          dp(8),
                          dp(4),
                          dp(8),
                          dp(4)
                  );

                  return layout;
              }

              private LinearLayout column() {
                  LinearLayout layout =
                          new LinearLayout(this);

                  layout.setOrientation(
                          LinearLayout.VERTICAL
                  );

                  layout.setPadding(
                          dp(10),
                          dp(6),
                          dp(10),
                          dp(6)
                  );

                  return layout;
              }

              private TextView text(
                      String value,
                      int size
              ) {
                  TextView view =
                          new TextView(this);

                  view.setText(value);
                  view.setTextSize(size);
                  view.setTextColor(Color.WHITE);

                  view.setPadding(
                          dp(12),
                          dp(8),
                          dp(12),
                          dp(8)
                  );

                  return view;
              }

              private Button button(String value) {
                  Button b = new Button(this);

                  b.setText(value);
                  b.setTextColor(Color.WHITE);

                  return b;
              }

              @Override
              protected void onCreate(
                      Bundle savedInstanceState
              ) {
                  super.onCreate(savedInstanceState);

                  preferences =
                          getSharedPreferences(
                                  "LEDDMX_PRO",
                                  MODE_PRIVATE
                          );

                  BluetoothManager manager =
                          (BluetoothManager)
                                  getSystemService(
                                          Context.BLUETOOTH_SERVICE
                                  );

                  if (manager != null) {
                      bluetoothAdapter =
                              manager.getAdapter();
                  }

                  buildInterface();
                  requestBluetoothPermissions();
              }

              private void buildInterface() {
                  root = column();
                  root.setBackgroundColor(
                          Color.rgb(10, 13, 17)
                  );

                  setContentView(root);

                  LinearLayout top = row();

                  Button menu = button("☰");

                  top.addView(
                          menu,
                          new LinearLayout.LayoutParams(
                                  dp(55),
                                  dp(55)
                          )
                  );

                  TextView title =
                          text("LEDDMX PRO", 20);

                  title.setGravity(
                          Gravity.CENTER_VERTICAL
                  );

                  top.addView(
                          title,
                          new LinearLayout.LayoutParams(
                                  0,
                                  dp(55),
                                  1
                          )
                  );

                  Button scan = button("SCAN");

                  top.addView(
                          scan,
                          new LinearLayout.LayoutParams(
                                  dp(90),
                                  dp(55)
                          )
                  );

                  root.addView(top);

                  statusText =
                          text(
                                  "● DISCONNECTED",
                                  13
                          );

                  statusText.setTextColor(
                          Color.YELLOW
                  );

                  root.addView(statusText);

                  ScrollView scroll =
                          new ScrollView(this);

                  body = column();

                  scroll.addView(body);

                  root.addView(
                          scroll,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  0,
                                  1
                          )
                  );

                  menu.setOnClickListener(
                          v -> showDrawer()
                  );

                  scan.setOnClickListener(
                          v -> startScan()
                  );

                  showHome();
              }

              private void clearBody() {
                  body.removeAllViews();
              }

              private void heading(String value) {
                  TextView t =
                          text(value, 22);

                  t.setTextColor(Color.CYAN);

                  body.addView(t);
              }

              private void showHome() {
                  page = "HOME";

                  clearBody();

                  heading("LEDDMX-00-b2cd");

                  body.addView(
                          text(
                                  "POWER • RGB • BRIGHTNESS • SPEED",
                                  12
                          )
                  );

                  Button power =
                          button(
                                  powerState
                                          ? "POWER ON"
                                          : "POWER OFF"
                          );

                  power.setOnClickListener(
                          v -> {
                              powerState =
                                      !powerState;

                              power.setText(
                                      powerState
                                              ? "POWER ON"
                                              : "POWER OFF"
                              );

                              send(
                                      powerPacket(
                                              powerState
                                      )
                              );
                          }
                  );

                  body.addView(power);

                  addColorWheel();

                  addSlider(
                          "BRIGHTNESS",
                          brightnessValue,
                          value -> {
                              brightnessValue =
                                      value;

                              send(
                                      brightnessPacket(
                                              value
                                      )
                              );
                          }
                  );

                  addSlider(
                          "SPEED",
                          speedValue,
                          value -> {
                              speedValue =
                                      value;

                              send(
                                      speedPacket(
                                              value
                                      )
                              );
                          }
                  );

                  LinearLayout outputRow =
                          row();

                  String[] outputs = {
                          "LEFT",
                          "RIGHT",
                          "BOTH"
                  };

                  for (String output : outputs) {
                      Button b =
                              button(output);

                      b.setOnClickListener(
                              v -> {
                                  selectedOutput =
                                          output;

                                  toast(
                                          "Preview: "
                                                  + output
                                                  + "\n"
                                                  + "Hardware routing: NOT PROVEN"
                                  );
                              }
                      );

                      outputRow.addView(
                              b,
                              new LinearLayout.LayoutParams(
                                      0,
                                      dp(52),
                                      1
                              )
                      );
                  }

                  body.addView(outputRow);

                  Button effects =
                          button(
                                  "OPEN 210 EFFECTS"
                          );

                  effects.setOnClickListener(
                          v -> showEffects()
                  );

                  body.addView(effects);

                  Button custom =
                          button(
                                  "CUSTOM STUDIO"
                          );

                  custom.setOnClickListener(
                          v -> showCustomStudio()
                  );

                  body.addView(custom);
              }

              private interface SliderAction {
                  void apply(int value);
              }

              private void addSlider(
                      String label,
                      int value,
                      SliderAction action
              ) {
                  TextView labelView =
                          text(
                                  label + " : " + value,
                                  14
                          );

                  body.addView(labelView);

                  SeekBar bar =
                          new SeekBar(this);

                  bar.setMax(100);
                  bar.setProgress(value);

                  bar.setOnSeekBarChangeListener(
                          new SeekBar.OnSeekBarChangeListener() {

                              @Override
                              public void onProgressChanged(
                                      SeekBar seekBar,
                                      int progress,
                                      boolean fromUser
                              ) {
                                  labelView.setText(
                                          label
                                                  + " : "
                                                  + progress
                                  );

                                  if (fromUser) {
                                      action.apply(
                                              progress
                                      );
                                  }
                              }

                              @Override
                              public void onStartTrackingTouch(
                                      SeekBar seekBar
                              ) {
                              }

                              @Override
                              public void onStopTrackingTouch(
                                      SeekBar seekBar
                              ) {
                              }
                          }
                  );

                  body.addView(bar);
              }

              private void addColorWheel() {
                  body.addView(
                          text("COLOR WHEEL", 15)
                  );

                  ColorWheel wheel =
                          new ColorWheel(this);

                  body.addView(
                          wheel,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  dp(245)
                          )
                  );

                  TextView rgbText =
                          text(
                                  "RGB "
                                          + red
                                          + " / "
                                          + green
                                          + " / "
                                          + blue,
                                  14
                          );

                  body.addView(rgbText);

                  wheel.listener =
                          (r, g, b) -> {
                              red = r;
                              green = g;
                              blue = b;

                              rgbText.setText(
                                      "RGB "
                                              + r
                                              + " / "
                                              + g
                                              + " / "
                                              + b
                              );

                              send(
                                      rgbPacket(
                                              r,
                                              g,
                                              b
                                      )
                              );
                          };
              }

              private void showEffects() {
                  page = "EFFECTS";

                  clearBody();

                  heading(
                          "210 BUILT-IN EFFECTS"
                  );

                  body.addView(
                          text(
                                  "LIVE EFFECT PREVIEW",
                                  12
                          )
                  );

                  for (int i = 1; i <= 210; i++) {
                      final int mode = i;

                      String name =
                              Patterns.NAME[i];

                      Button b =
                              button(
                                      String.format(
                                              Locale.US,
                                              "%03d  %s",
                                              i,
                                              name
                                      )
                              );

                      b.setOnClickListener(
                              v -> {
                                  selectedMode =
                                          mode;

                                  send(
                                          modePacket(
                                                  mode
                                          )
                                  );

                                  toast(
                                          "MODE "
                                                  + mode
                                                  + "\n"
                                                  + Patterns.NAME[mode]
                                  );
                              }
                      );

                      body.addView(
                              b,
                              new LinearLayout.LayoutParams(
                                      -1,
                                      dp(48)
                              )
                      );
                  }
              }

              private void showCustomStudio() {
                  page = "CUSTOM";

                  clearBody();

                  heading("CUSTOM STUDIO");

                  body.addView(
                          new StripPreview(this),
                          new LinearLayout.LayoutParams(
                                  -1,
                                  dp(130)
                          )
                  );

                  body.addView(
                          text(
                                  "ANIMATION TEMPLATES",
                                  14
                          )
                  );

                  LinearLayout templates =
                          row();

                  String[] names = {
                          "RAINBOW",
                          "WAVE",
                          "CHASE",
                          "COMET",
                          "SCANNER",
                          "PULSE",
                          "STRIPE",
                          "FIRE",
                          "WATER",
                          "RANDOM"
                  };

                  for (String name : names) {
                      Button b =
                              button(name);

                      b.setOnClickListener(
                              v -> toast(
                                      "LIVE PREVIEW: "
                                              + name
                              )
                      );

                      templates.addView(
                              b,
                              new LinearLayout.LayoutParams(
                                      0,
                                      dp(52),
                                      1
                              )
                      );
                  }

                  body.addView(templates);

                  addColorWheel();

                  addSlider(
                          "BRIGHTNESS",
                          brightnessValue,
                          value ->
                                  brightnessValue =
                                          value
                  );

                  addSlider(
                          "SPEED",
                          speedValue,
                          value ->
                                  speedValue =
                                          value
                  );

                  LinearLayout direction =
                          row();

                  Button forward =
                          button("FORWARD");

                  Button reverse =
                          button("REVERSE");

                  forward.setOnClickListener(
                          v -> send(
                                  directionPacket(0)
                          )
                  );

                  reverse.setOnClickListener(
                          v -> send(
                                  directionPacket(1)
                          )
                  );

                  direction.addView(
                          forward,
                          new LinearLayout.LayoutParams(
                                  0,
                                  dp(52),
                                  1
                          )
                  );

                  direction.addView(
                          reverse,
                          new LinearLayout.LayoutParams(
                                  0,
                                  dp(52),
                                  1
                          )
                  );

                  body.addView(direction);

                  body.addView(
                          text(
                                  "OUTPUT PREVIEW",
                                  14
                          )
                  );

                  LinearLayout output =
                          row();

                  String[] outputModes = {
                          "WHOLE",
                          "LEFT",
                          "RIGHT",
                          "BOTH"
                  };

                  for (String name : outputModes) {
                      Button b =
                              button(name);

                      b.setOnClickListener(
                              v -> {
                                  selectedOutput =
                                          name;

                                  toast(
                                          "Preview output: "
                                                  + name
                                                  + "\n"
                                                  + "Hardware routing is not proven."
                                  );
                              }
                      );

                      output.addView(
                              b,
                              new LinearLayout.LayoutParams(
                                      0,
                                      dp(50),
                                      1
                              )
                      );
                  }

                  body.addView(output);

                  body.addView(
                          text(
                                  "LOCAL CUSTOM SLOTS 171–210",
                                  15
                          )
                  );

                  for (int slot = 171;
                       slot <= 210;
                       slot++) {

                      final int s = slot;

                      Button save =
                              button(
                                      "SAVE / APPLY SLOT "
                                              + slot
                              );

                      save.setOnClickListener(
                              v -> {
                                  preferences
                                          .edit()
                                          .putInt(
                                                  "slot_"
                                                          + s,
                                                  selectedMode
                                          )
                                          .apply();

                                  toast(
                                          "Saved local slot "
                                                  + s
                                  );
                              }
                      );

                      body.addView(save);
                  }

                  Button apply =
                          button(
                                  "APPLY CUSTOM PATTERN"
                          );

                  apply.setOnClickListener(
                          v -> {
                              send(
                                      customColorPacket(
                                              1,
                                              red,
                                              green,
                                              blue,
                                              1
                                      )
                              );

                              send(
                                      customModePacket(
                                              0
                                      )
                              );

                              toast(
                                      "Custom pattern packets sent."
                              );
                          }
                  );

                  body.addView(apply);
              }

              private void showAnalyzer() {
                  page = "ANALYZER";

                  clearBody();

                  heading(
                          "MODULE / MCU ANALYZER"
                  );

                  body.addView(
                          text(
                                  "DEVICE SOURCE ONLY",
                                  14
                          )
                  );

                  body.addView(
                          text(
                                  "No guessed MCU data is displayed.",
                                  12
                          )
                  );

                  Button gatt =
                          button("READ GATT");

                  gatt.setOnClickListener(
                          v -> readGatt()
                  );

                  body.addView(gatt);

                  Button refresh =
                          button(
                                  "REFRESH TERMINAL"
                          );

                  refresh.setOnClickListener(
                          v -> showAnalyzer()
                  );

                  body.addView(refresh);

                  String connectionInfo;

                  if (bluetoothGatt == null) {
                      connectionInfo =
                              "DEVICE: NOT CONNECTED";
                  } else {
                      connectionInfo =
                              "DEVICE: "
                                      + safeDeviceName()
                                      + "\n"
                                      + "SERVICE FFE0: CHECK GATT"
                                      + "\n"
                                      + "CHAR FFE1: CHECK GATT";
                  }

                  body.addView(
                          text(
                                  connectionInfo,
                                  12
                          )
                  );

                  if (bluetoothGatt != null) {
                      boolean otaFound = false;

                      for (
                              BluetoothGattService service :
                              bluetoothGatt.getServices()
                      ) {
                          if (
                                  OTA_SERVICE.equals(
                                          service.getUuid()
                                  )
                          ) {
                              otaFound = true;
                          }
                      }

                      body.addView(
                              text(
                                      "OTA SERVICE: "
                                              + (
                                              otaFound
                                                      ? "DETECTED"
                                                      : "NOT EXPOSED BY DEVICE"
                                      ),
                                      12
                              )
                      );
                  } else {
                      body.addView(
                              text(
                                      "OTA SERVICE: NOT EXPOSED BY DEVICE",
                                      12
                              )
                      );
                  }

                  EditText raw =
                          new EditText(this);

                  raw.setHint(
                          "RAW HEX"
                  );

                  raw.setTextColor(
                          Color.WHITE
                  );

                  raw.setHintTextColor(
                          Color.GRAY
                  );

                  body.addView(raw);

                  Button send =
                          button(
                                  "SEND RAW HEX"
                          );

                  send.setOnClickListener(
                          v -> {
                              try {
                                  send(
                                          parseHex(
                                                  raw.getText()
                                                          .toString()
                                          )
                                  );
                              } catch (Exception e) {
                                  toast(
                                          "Invalid HEX"
                                  );
                              }
                          }
                  );

                  body.addView(send);

                  Button copy =
                          button(
                                  "COPY TERMINAL"
                          );

                  copy.setOnClickListener(
                          v -> {
                              ClipboardManager manager =
                                      (ClipboardManager)
                                              getSystemService(
                                                      CLIPBOARD_SERVICE
                                              );

                              if (manager != null) {
                                  manager.setPrimaryClip(
                                          ClipData.newPlainText(
                                                  "LEDDMX DEVICE TERMINAL",
                                                  terminalText()
                                          )
                                  );

                                  toast("Terminal copied");
                              }
                          }
                  );

                  body.addView(copy);

                  body.addView(
                          text(
                                  terminalText(),
                                  11
                          )
                  );
              }

              private void showProtocolLab() {
                  showAnalyzer();

                  page = "PROTOCOL";

                  TextView title =
                          text(
                                  "PROTOCOL LAB",
                                  18
                          );

                  title.setTextColor(
                          Color.CYAN
                  );

                  body.addView(title);
              }

              private void showSettings() {
                  page = "SETTINGS";

                  clearBody();

                  heading("SETTINGS");

                  body.addView(
                          text(
                                  "Language: Indonesian / English",
                                  13
                          )
                  );

                  body.addView(
                          text(
                                  "RGB order baseline: RBG.",
                                  13
                          )
                  );

                  body.addView(
                          text(
                                  "Password command: NOT VERIFIED.",
                                  13
                          )
                  );

                  body.addView(
                          text(
                                  "No unverified password packet will be sent.",
                                  13
                          )
                  );

                  body.addView(
                          text(
                                  "OTA: DETECTION ONLY until firmware format is proven.",
                                  13
                          )
                  );

                  body.addView(
                          text(
                                  "LEFT/RIGHT hardware routing: NOT PROVEN.",
                                  13
                          )
                  );

                  Button clear =
                          button(
                                  "RESET LOCAL CUSTOM SLOTS"
                          );

                  clear.setOnClickListener(
                          v -> {
                              preferences
                                      .edit()
                                      .clear()
