                          Color.WHITE
                  );

                  t.setTextSize(
                          18
                  );

                  t.setGravity(
                          Gravity.CENTER
                  );

                  t.setBackgroundColor(
                          color
                  );

                  return t;
              }

              private int nextColor(
                      int color
              ) {

                  if (color == Color.RED)
                      return Color.GREEN;

                  if (color == Color.GREEN)
                      return Color.BLUE;

                  if (color == Color.BLUE)
                      return Color.YELLOW;

                  if (color == Color.YELLOW)
                      return Color.CYAN;

                  if (color == Color.CYAN)
                      return Color.MAGENTA;

                  return Color.RED;
              }

