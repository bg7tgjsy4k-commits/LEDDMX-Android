        rawHex =
                new EditText(this);


        rawHex.setHint(
                "7B FF 04 01 FF FF FF FF BF"
        );


        rawHex.setTextColor(
                Color.WHITE
        );


        rawHex.setHintTextColor(
                Color.GRAY
        );


        root.addView(
