                          )
                  );

                  root.addView(
                          scroll,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  0,
                                  1
                          )
                  );

                  LinearLayout nav =
                          new LinearLayout(this);

                  nav.setPadding(
