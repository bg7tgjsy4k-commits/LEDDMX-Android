name: Build LEDDMX Pro FINAL

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build LEDDMX Pro
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      # 2. JDK 17
      # ============================================================
      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # ============================================================
      # 3. GRADLE 7.6.1
      # ============================================================
      - name: Setup Gradle 7.6.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.6.1'

      # ============================================================
      # 4. ANDROID SDK
      # ============================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: |
          set -e
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2"
          echo "ANDROID SDK READY"

      # ============================================================
      # 5. VERIFY TOOLCHAIN
      # ============================================================
      - name: Verify toolchain
        shell: bash
        run: |
          set -e
          java -version
          gradle --version
          sdkmanager --list_installed | grep -E "platforms;android-33|build-tools;33.0.2" || true

      # ============================================================
      # 6. CREATE CLEAN ANDROID PROJECT
      # ============================================================
      - name: Create project
        shell: bash
        run: |
          set -e

          rm -rf app
          rm -rf build
          rm -rf gradle
          rm -f build.gradle
          rm -f settings.gradle
          rm -f gradle.properties
          rm -f gradlew
          rm -f gradlew.bat

          mkdir -p app/src/main/java/com/leddmx/pro
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "LEDDMX-Pro"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }

              dependencies {
                  classpath 'com.android.tools.build:gradle:7.4.2'
              }
          }

          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=false
          android.enableJetifier=false
          org.gradle.daemon=false
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.leddmx.pro'
              compileSdk 33

              defaultConfig {
                  applicationId 'com.leddmx.pro'
                  minSdk 21
                  targetSdk 33
                  versionCode 100
                  versionName '1.0-FINAL'
              }

              buildTypes {
                  debug {
                      minifyEnabled false
                  }
                  release {
                      minifyEnabled false
                      shrinkResources false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }
          EOF

          cat > app/src/main/res/values/colors.xml <<'EOF'
          <resources>
              <color name="black">#080B10</color>
              <color name="dark">#10151D</color>
              <color name="panel">#171E28</color>
              <color name="panel2">#202936</color>
              <color name="white">#FFFFFF</color>
              <color name="gray">#9BA7B5</color>
              <color name="green">#20D46B</color>
              <color name="red">#FF4B5C</color>
              <color name="blue">#4CA3FF</color>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-feature
                  android:name="android.hardware.bluetooth_le"
                  android:required="false" />

              <uses-permission android:name="android.permission.BLUETOOTH" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" />

              <uses-permission
                  android:name="android.permission.BLUETOOTH_SCAN"
                  android:usesPermissionFlags="neverForLocation" />

              <uses-permission
                  android:name="android.permission.BLUETOOTH_CONNECT" />

              <uses-permission
                  android:name="android.permission.ACCESS_FINE_LOCATION" />

              <uses-permission
                  android:name="android.permission.ACCESS_COARSE_LOCATION" />

              <application
                  android:allowBackup="false"
                  android:label="LEDDMX Pro"
                  android:theme="@style/AppTheme"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme"
                  parent="android:style/Theme.Material.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">#080B10</item>
                  <item name="android:navigationBarColor">#080B10</item>
                  <item name="android:colorAccent">#20D46B</item>
                  <item name="android:windowActionModeOverlay">true</item>
              </style>
          </resources>
          EOF

      # ============================================================
      # 7. MAIN ACTIVITY
      # ============================================================
      - name: Write MainActivity
        shell: bash
        run: |
          set -e

          cat > app/src/main/java/com/leddmx/pro/MainActivity.java <<'EOF'
          package com.leddmx.pro;

          import android.Manifest;
          import android.app.Activity;
          import android.bluetooth.BluetoothAdapter;
          import android.bluetooth.BluetoothDevice;
          import android.bluetooth.BluetoothGatt;
          import android.bluetooth.BluetoothGattCallback;
          import android.bluetooth.BluetoothGattCharacteristic;
          import android.bluetooth.BluetoothGattService;
          import android.bluetooth.BluetoothManager;
          import android.bluetooth.BluetoothProfile;
          import android.bluetooth.le.BluetoothLeScanner;
          import android.bluetooth.le.ScanCallback;
          import android.bluetooth.le.ScanResult;
          import android.bluetooth.le.ScanSettings;
          import android.content.Context;
          import android.content.pm.PackageManager;
          import android.graphics.Canvas;
          import android.graphics.Color;
          import android.graphics.Paint;
          import android.graphics.RectF;
          import android.graphics.SweepGradient;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.text.InputType;
          import android.view.Gravity;
          import android.view.MotionEvent;
          import android.view.View;
          import android.view.ViewGroup;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.HorizontalScrollView;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.SeekBar;
          import android.widget.TextView;
          import android.widget.Toast;

          import java.nio.charset.StandardCharsets;
          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.Comparator;
          import java.util.HashMap;
          import java.util.LinkedHashMap;
          import java.util.Locale;
          import java.util.Map;
          import java.util.UUID;

          public class MainActivity extends Activity {

              private static final int REQ_BLE = 9001;

              private static final UUID SERVICE_FFE0 =
                      UUID.fromString("0000FFE0-0000-1000-8000-00805F9B34FB");

              private static final UUID CHAR_FFE1 =
                      UUID.fromString("0000FFE1-0000-1000-8000-00805F9B34FB");

              private static final UUID OTA_SERVICE =
                      UUID.fromString("5833FF01-9B8B-5191-6142-22A4536EF123");

              private static final UUID OTA_WRITE =
                      UUID.fromString("5833FF02-9B8B-5191-6142-22A4536EF123");

              private static final UUID OTA_NOTIFY =
                      UUID.fromString("5833FF03-9B8B-5191-6142-22A4536EF123");

              private BluetoothManager btManager;
              private BluetoothAdapter btAdapter;
              private BluetoothLeScanner scanner;
              private BluetoothGatt gatt;
              private BluetoothGattCharacteristic writeChar;

              private final Handler handler =
                      new Handler(Looper.getMainLooper());

              private boolean scanning = false;

              private final LinkedHashMap<String, BleItem> devices =
                      new LinkedHashMap<>();

              private final ArrayList<String> terminal =
                      new ArrayList<>();

              private LinearLayout root;
              private LinearLayout content;
              private TextView status;
              private TextView connection;
              private TextView title;

              private int page = 0;

              private final int BG = Color.rgb(8, 11, 16);
              private final int PANEL = Color.rgb(23, 30, 40);
              private final int PANEL2 = Color.rgb(31, 41, 53);
              private final int WHITE = Color.WHITE;
              private final int GRAY = Color.rgb(155, 167, 181);
              private final int GREEN = Color.rgb(32, 212, 107);
              private final int RED = Color.rgb(255, 75, 92);
              private final int BLUE = Color.rgb(76, 163, 255);

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);

                  getWindow().setStatusBarColor(BG);
                  getWindow().setNavigationBarColor(BG);

                  btManager =
                          (BluetoothManager)getSystemService(
                                  Context.BLUETOOTH_SERVICE);

                  if (btManager != null)
                      btAdapter = btManager.getAdapter();

                  buildShell();

                  requestBlePermissions();

                  showHome();
              }

              private void buildShell() {

                  root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setBackgroundColor(BG);

                  LinearLayout top = new LinearLayout(this);
                  top.setGravity(Gravity.CENTER_VERTICAL);
                  top.setPadding(dp(14), dp(12), dp(14), dp(10));
                  top.setBackgroundColor(BG);

                  Button menu = button("☰", PANEL2);
                  menu.setTextSize(23);
                  menu.setOnClickListener(v -> openDrawer());

                  top.addView(
                          menu,
                          new LinearLayout.LayoutParams(
                                  dp(54), dp(48)));

                  LinearLayout titles = new LinearLayout(this);
                  titles.setOrientation(LinearLayout.VERTICAL);
                  titles.setPadding(dp(12), 0, 0, 0);

                  title = text("LEDDMX PRO", 20, WHITE);
                  titles.addView(title);

                  connection = text(
                          "DISCONNECTED",
                          12,
                          RED);

                  titles.addView(connection);

                  top.addView(
                          titles,
                          new LinearLayout.LayoutParams(
                                  0,
                                  -2,
                                  1));

                  Button scan = button("SCAN", GREEN);
                  scan.setTextColor(Color.BLACK);
                  scan.setOnClickListener(v -> toggleScan());

                  top.addView(
                          scan,
                          new LinearLayout.LayoutParams(
                                  dp(92), dp(48)));

                  root.addView(
                          top,
                          new LinearLayout.LayoutParams(
                                  -1, -2));

                  status = text(
                          "Bluetooth ready",
                          12,
                          GRAY);

                  status.setPadding(
                          dp(16),
                          dp(2),
                          dp(16),
                          dp(8));

                  root.addView(status);

                  content = new LinearLayout(this);
                  content.setOrientation(
                          LinearLayout.VERTICAL);

                  ScrollView scroll = new ScrollView(this);
                  scroll.setFillViewport(true);
                  scroll.addView(content);

                  root.addView(
                          scroll,
                          new LinearLayout.LayoutParams(
                                  -1, 0, 1));

                  setContentView(root);
              }

              private void openDrawer() {

                  final android.app.Dialog dialog =
                          new android.app.Dialog(this);

                  LinearLayout box =
                          new LinearLayout(this);

                  box.setOrientation(
                          LinearLayout.VERTICAL);

                  box.setPadding(
                          dp(18),
                          dp(22),
                          dp(18),
                          dp(22));

                  box.setBackgroundColor(
                          Color.rgb(13, 18, 25));

                  TextView h =
                          text("LEDDMX PRO", 24, WHITE);

                  box.addView(
                          h,
                          new LinearLayout.LayoutParams(
                                  -1, dp(60)));

                  String[] pages = {
                          "⌂  HOME",
                          "●  210 EFFECTS",
                          "✦  CUSTOM STUDIO",
                          "▣  MY MODES 171–210",
                          "⌁  MODULE / MCU ANALYZER",
                          "⌘  PROTOCOL LAB",
                          "⚙  SETTINGS"
                  };

                  for (int i = 0; i < pages.length; i++) {

                      final int p = i;

                      Button b =
                              button(
                                      pages[i],
                                      PANEL);

                      b.setGravity(
                              Gravity.CENTER_VERTICAL |
                              Gravity.LEFT);

                      b.setPadding(
                              dp(18),
                              0,
                              dp(8),
                              0);

                      b.setOnClickListener(v -> {
                          dialog.dismiss();
                          showPage(p);
                      });

                      box.addView(
                              b,
                              new LinearLayout.LayoutParams(
                                      -1, dp(56)));
                  }

                  dialog.setContentView(box);

                  android.view.Window w =
                          dialog.getWindow();

                  if (w != null) {
                      w.setBackgroundDrawableResource(
                              android.R.color.transparent);

                      w.setLayout(
                              dp(330),
                              -1);
                  }

                  dialog.show();

                  if (w != null) {
                      w.setLayout(
                              dp(330),
                              -1);
                  }
              }

              private void showPage(int p) {

                  page = p;

                  switch (p) {
                      case 0:
                          showHome();
                          break;

                      case 1:
                          showEffects();
                          break;

                      case 2:
                          showCustom();
                          break;

                      case 3:
                          showSlots();
                          break;

                      case 4:
                          showAnalyzer();
                          break;

                      case 5:
                          showProtocol();
                          break;

                      case 6:
                          showSettings();
                          break;
                  }
              }

              private void clear() {
                  content.removeAllViews();
              }

              private void showHome() {

                  clear();

                  addHeader(
                          "HOME",
                          "BLE controller • live device connection");

                  LinearLayout card =
                          card();

                  TextView dev =
                          text(
                                  "DEVICE",
                                  13,
                                  GRAY);

                  card.addView(dev);

                  TextView name =
                          text(
                                  gatt == null
                                          ? "No module connected"
                                          : "LEDDMX MODULE READY",
                                  20,
                                  WHITE);

                  card.addView(name);

                  card.addView(
                          text(
                                  writeChar == null
                                          ? "FFE1: NOT READY"
                                          : "FFE1: WRITE READY",
                                  12,
                                  writeChar == null
                                          ? RED
                                          : GREEN));

                  Button scan =
                          button(
                                  scanning
                                          ? "STOP SCAN"
                                          : "SCAN BLE DEVICES",
                                  GREEN);

                  scan.setTextColor(Color.BLACK);
                  scan.setOnClickListener(
                          v -> toggleScan());

                  card.addView(
                          scan,
                          lp(-1, 52));

                  content.addView(card);

                  LinearLayout power =
                          card();

                  power.addView(
                          text(
                                  "POWER",
                                  13,
                                  GRAY));

                  Button on =
                          button(
                                  "POWER ON",
                                  GREEN);

                  on.setTextColor(Color.BLACK);
                  on.setOnClickListener(
                          v -> send(
                                  "7B FF 04 01 FF FF FF FF BF"));

                  Button off =
                          button(
                                  "POWER OFF",
                                  RED);

                  off.setOnClickListener(
                          v -> send(
                                  "7B FF 04 00 FF FF FF FF BF"));

                  power.addView(on, lp(-1, 52));
                  power.addView(off, lp(-1, 52));

                  content.addView(power);

                  LinearLayout rgb =
                          card();

                  rgb.addView(
                          text(
                                  "RGB",
                                  13,
                                  GRAY));

                  ColorWheel wheel =
                          new ColorWheel(this);

                  rgb.addView(
                          wheel,
                          lp(-1, 300));

                  Button apply =
                          button(
                                  "APPLY COLOR",
                                  BLUE);

                  apply.setOnClickListener(
                          v -> sendRgb(
                                  wheel.r,
                                  wheel.g,
                                  wheel.b));

                  rgb.addView(
                          apply,
                          lp(-1, 52));

                  content.addView(rgb);

                  LinearLayout control =
                          card();

                  control.addView(
                          text(
                                  "BRIGHTNESS",
                                  13,
                                  GRAY));

                  SeekBar bright =
                          new SeekBar(this);

                  bright.setMax(100);
                  bright.setProgress(80);

                  bright.setOnSeekBarChangeListener(
                          new SeekBar.OnSeekBarChangeListener() {

                              public void onProgressChanged(
                                      SeekBar s,
                                      int v,
                                      boolean from) {

                                  if (from)
                                      sendBrightness(v);
                              }

                              public void onStartTrackingTouch(
                                      SeekBar s) {}

                              public void onStopTrackingTouch(
                                      SeekBar s) {}
                          });

                  control.addView(
                          bright,
                          lp(-1, 48));

                  control.addView(
                          text(
                                  "SPEED",
                                  13,
                                  GRAY));

                  SeekBar speed =
                          new SeekBar(this);

                  speed.setMax(255);
                  speed.setProgress(120);

                  speed.setOnSeekBarChangeListener(
                          new SeekBar.OnSeekBarChangeListener() {

                              public void onProgressChanged(
                                      SeekBar s,
                                      int v,
                                      boolean from) {

                                  if (from && v % 5 == 0)
                                      sendSpeed(v);
                              }

                              public void onStartTrackingTouch(
                                      SeekBar s) {}

                              public void onStopTrackingTouch(
                                      SeekBar s) {}
                          });

                  control.addView(
                          speed,
                          lp(-1, 48));

                  content.addView(control);

                  showScanResults();
              }

              private void showScanResults() {

                  if (devices.size() == 0)
                      return;

                  LinearLayout box = card();

                  box.addView(
                          text(
                                  "BLE DEVICES",
                                  14,
                                  WHITE));

                  ArrayList<BleItem> list =
                          new ArrayList<>(
                                  devices.values());

                  Collections.sort(
                          list,
                          new Comparator<BleItem>() {

                              public int compare(
                                      BleItem a,
                                      BleItem b) {

                                  if (a.ledDmx &&
                                          !b.ledDmx)
                                      return -1;

                                  if (!a.ledDmx &&
                                          b.ledDmx)
                                      return 1;

                                  return b.rssi -
                                         a.rssi;
                              }
                          });

                  for (BleItem item : list) {

                      Button b =
                              button(
                                      (item.ledDmx
                                              ? "★ "
                                              : "")
                                      + item.name
                                      + "\n"
                                      + item.address
                                      + "   "
                                      + item.rssi
                                      + " dBm",
                                      item.ledDmx
                                              ? GREEN
                                              : PANEL2);

                      b.setGravity(
                              Gravity.LEFT |
                              Gravity.CENTER_VERTICAL);

                      b.setTextColor(
                              item.ledDmx
                                      ? Color.BLACK
                                      : WHITE);

                      b.setOnClickListener(
                              v -> connect(item.device));

                      box.addView(
                              b,
                              lp(-1, 72));
                  }

                  content.addView(box);
              }

              private void showEffects() {

                  clear();

                  addHeader(
                          "210 EFFECTS",
                          "Exact effect slots 1–210");

                  for (int i = 1; i <= 210; i++) {

                      final int mode = i;

                      Button b =
                              button(
                                      String.format(
                                              Locale.US,
                                              "%03d   EFFECT %03d",
                                              i,
                                              i),
                                      PANEL);

                      b.setGravity(
                              Gravity.LEFT |
                              Gravity.CENTER_VERTICAL);

                      b.setOnClickListener(
                              v -> {
                                  sendMode(mode);
                                  status.setText(
                                          "MODE "
                                          + mode
                                          + " SENT");
                              });

                      content.addView(
                              b,
                              lp(-1, 50));
                  }
              }

              private void showCustom() {

                  clear();

                  addHeader(
                          "CUSTOM STUDIO",
                          "Create and preview your own LED animation");

                  LinearLayout box =
                          card();

                  box.addView(
                          text(
                                  "LIVE LED STRIP",
                                  14,
                                  WHITE));

                  LedStripView strip =
                          new LedStripView(this);

                  box.addView(
                          strip,
                          lp(-1, 130));

                  box.addView(
                          text(
                                  "COLOR WHEEL",
                                  13,
                                  GRAY));

                  ColorWheel wheel =
                          new ColorWheel(this);

                  box.addView(
                          wheel,
                          lp(-1, 280));

                  Button addColor =
                          button(
                                  "+ ADD COLOR",
                                  BLUE);

                  addColor.setOnClickListener(
                          v -> Toast.makeText(
                                  this,
                                  "Color added to animation",
                                  Toast.LENGTH_SHORT)
                                  .show());

                  box.addView(
                          addColor,
                          lp(-1, 50));

                  box.addView(
                          text(
                                  "ANIMATION",
                                  13,
                                  GRAY));

                  String[] templates = {
                          "RAINBOW",
                          "WAVE",
                          "CHASE",
                          "COMET",
                          "SCANNER",
                          "MIRROR",
                          "PULSE",
                          "COLOR CYCLE",
                          "STRIPE / BELANG",
                          "FADE",
                          "POLICE",
                          "FIRE",
                          "WATER",
                          "RANDOM"
                  };

                  for (String t : templates) {

                      Button b =
                              button(
                                      t,
                                      PANEL2);

                      b.setOnClickListener(
                              v -> {
                                  strip.template = t;
                                  strip.invalidate();

                                  status.setText(
                                          "PREVIEW: " + t);
                              });

                      box.addView(
                              b,
                              lp(-1, 46));
                  }

                  box.addView(
                          text(
                                  "OUTPUT",
                                  13,
                                  GRAY));

                  LinearLayout outputs =
                          new LinearLayout(this);

                  String[] outs = {
                          "WHOLE",
                          "LEFT",
                          "RIGHT",
                          "BOTH"
                  };

                  for (String o : outs) {

                      Button b =
                              button(
                                      o,
                                      PANEL2);

                      b.setOnClickListener(
                              v -> Toast.makeText(
                                      this,
                                      "OUTPUT " + o
                                      + " • HARDWARE ROUTING: "
                                      + "NOT PROVEN",
                                      Toast.LENGTH_SHORT)
                                      .show());

                      outputs.addView(
                              b,
                              new LinearLayout.LayoutParams(
                                      0,
                                      52,
                                      1));
                  }

                  box.addView(outputs);

                  box.addView(
                          text(
                                  "DIRECTION",
                                  13,
                                  GRAY));

                  Button direction =
                          button(
                                  "FORWARD",
                                  PANEL2);

                  direction.setOnClickListener(
                          v -> {

                              boolean reverse =
                                      direction.getText()
                                              .toString()
                                              .equals("FORWARD");

                              direction.setText(
                                      reverse
                                              ? "REVERSE"
                                              : "FORWARD");

                              sendDirection(
                                      reverse ? 1 : 0);
                          });

                  box.addView(
                          direction,
                          lp(-1, 50));

                  Button save =
                          button(
                                  "SAVE TO SLOT",
                                  GREEN);

                  save.setTextColor(
                          Color.BLACK);

                  save.setOnClickListener(
                          v -> showSlotPicker());

                  box.addView(
                          save,
                          lp(-1, 54));

                  Button apply =
                          button(
                                  "APPLY CUSTOM",
                                  BLUE);

                  apply.setOnClickListener(
                          v -> applyCustom());

                  box.addView(
                          apply,
                          lp(-1, 54));

                  content.addView(box);
              }

              private void showSlotPicker() {

                  final String[] slots =
                          new String[40];

                  for (int i = 0; i < 40; i++)
                      slots[i] =
                              "SLOT "
                              + (171 + i);

                  new android.app.AlertDialog.Builder(this)
                          .setTitle(
                                  "SAVE CUSTOM MODE")
                          .setItems(
                                  slots,
                                  (d, which) -> {

                                      getPreferences(
                                              MODE_PRIVATE)
                                              .edit()
                                              .putString(
                                                      "slot_"
                                                      + (171 + which),
                                                      "CUSTOM")
                                              .apply();

                                      Toast.makeText(
                                              this,
                                              "Saved slot "
                                              + (171 + which),
                                              Toast.LENGTH_SHORT)
                                              .show();
                                  })
                          .show();
              }

              private void applyCustom() {

                  send(
                          customColorPacket(
                                  1,
                                  255,
                                  0,
                                  0,
                                  1));

                  handler.postDelayed(
                          () -> send(
                                  customModePacket(0)),
                          120);

                  handler.postDelayed(
                          () -> sendDirection(0),
                          240);

                  status.setText(
                          "CUSTOM PATTERN APPLIED");
              }

              private String customColorPacket(
                      int position,
                      int r,
                      int g,
                      int b,
                      int total) {

                  return String.format(
                          Locale.US,
                          "7B %02X 0E FD %02X %02X %02X %02X BF",
                          position,
                          r,
                          g,
                          b,
                          total);
              }

              private String customModePacket(
                      int ordinal) {

                  return String.format(
                          Locale.US,
                          "7B FF 13 %02X FF FF FF FF BF",
                          ordinal);
              }

