name: LEDDMX AI PRO FINAL

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 7.6.1
        shell: bash
        run: |
          curl -L -o gradle.zip https://services.gradle.org/distributions/gradle-7.6.1-bin.zip
          unzip -q gradle.zip
          echo "$PWD/gradle-7.6.1/bin" >> "$GITHUB_PATH"

      - name: Create Android project
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/leddmx/aipro
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/assets

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "LEDDMX-AI-PRO"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '7.4.2' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.leddmx.aipro'
              compileSdk 33

              defaultConfig {
                  applicationId 'com.leddmx.aipro'
                  minSdk 21
                  targetSdk 33
                  versionCode 100
                  versionName "1.0-FINAL"
              }
          }
          EOF

          cat > app/src/main/res/values/colors.xml <<'EOF'
          <resources>
              <color name="black">#050505</color>
              <color name="white">#FFFFFF</color>
          </resources>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">#050505</item>
                  <item name="android:navigationBarColor">#050505</item>
                  <item name="android:colorAccent">#FFFFFF</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-feature
                  android:name="android.hardware.bluetooth_le"
                  android:required="false" />

              <uses-permission android:name="android.permission.BLUETOOTH" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" />

              <uses-permission
                  android:name="android.permission.BLUETOOTH_SCAN"
                  android:usesPermissionFlags="neverForLocation" />

              <uses-permission
                  android:name="android.permission.BLUETOOTH_CONNECT" />

              <uses-permission
                  android:name="android.permission.ACCESS_FINE_LOCATION" />

              <application
                  android:theme="@style/AppTheme"
                  android:label="LEDDMX AI PRO"
                  android:allowBackup="false"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>
              </application>

          </manifest>
          EOF

          cat > app/src/main/assets/index.html <<'EOF'
          <!DOCTYPE html>
          <html>
          <head>
          <meta name="viewport"
                content="width=device-width,initial-scale=1,
                         maximum-scale=1,user-scalable=no">

          <style>
          *{
            box-sizing:border-box;
            -webkit-tap-highlight-color:transparent;
          }

          html,body{
            margin:0;
            padding:0;
            background:#050505;
            color:#fff;
            font-family:Arial,sans-serif;
            min-height:100%;
          }

          body{
            overflow-x:hidden;
          }

          button{
            font-family:inherit;
            color:#fff;
            background:#141414;
            border:1px solid #303030;
            border-radius:13px;
            padding:13px 12px;
            font-size:14px;
            font-weight:600;
          }

          button:active{
            transform:scale(.98);
          }

          .top{
            position:sticky;
            top:0;
            z-index:50;
            height:68px;
            display:flex;
            align-items:center;
            gap:8px;
            padding:0 13px;
            background:rgba(5,5,5,.97);
            border-bottom:1px solid #222;
          }

          .hamb{
            width:48px;
            height:48px;
            padding:0;
            border:0;
            background:transparent;
            font-size:31px;
          }

          .title{
            flex:1;
            font-size:19px;
            font-weight:800;
            letter-spacing:.8px;
          }

          .status{
            font-size:10px;
            border:1px solid #333;
            border-radius:20px;
            padding:8px 10px;
            color:#999;
            white-space:nowrap;
          }

          .page{
            display:none;
            padding:15px;
            padding-bottom:100px;
          }

          .page.active{
            display:block;
          }

          .card{
            background:#101010;
            border:1px solid #242424;
            border-radius:20px;
            padding:16px;
            margin-bottom:14px;
          }

          h1{
            margin:0 0 14px;
            font-size:25px;
          }

          h2{
            margin:0 0 14px;
            font-size:20px;
          }

          h3{
            margin:18px 0 9px;
            font-size:12px;
            color:#999;
            letter-spacing:1.2px;
          }

          .sub{
            color:#777;
            font-size:12px;
            line-height:1.5;
          }

          .grid2{
            display:grid;
            grid-template-columns:1fr 1fr;
            gap:10px;
          }

          .grid3{
            display:grid;
            grid-template-columns:repeat(3,1fr);
            gap:8px;
          }

          .primary{
            background:#fff;
            color:#000;
            border-color:#fff;
          }

          .danger{
            border-color:#553030;
          }

          /* DRAWER */

          .drawer{
            position:fixed;
            z-index:200;
            top:0;
            left:-310px;
            width:292px;
            height:100vh;
            overflow:auto;
            padding:22px 16px;
            background:#0b0b0b;
            border-right:1px solid #282828;
            transition:left .22s ease;
            box-shadow:15px 0 50px rgba(0,0,0,.7);
          }

          .drawer.open{
            left:0;
          }

          .drawerTitle{
            font-size:21px;
            font-weight:800;
            padding:5px 8px 18px;
          }

          .drawer button{
            width:100%;
            text-align:left;
            margin:4px 0;
            padding:14px;
            background:#141414;
          }

          .drawerSep{
            height:1px;
            background:#272727;
            margin:15px 0;
          }

          .overlay{
            display:none;
            position:fixed;
            z-index:150;
            inset:0;
            background:rgba(0,0,0,.65);
          }

          .overlay.show{
            display:block;
          }

          /* COLOR WHEEL */

          .wheelWrap{
            display:flex;
            justify-content:center;
            align-items:center;
            padding:10px 0 16px;
          }

          .wheel{
            width:min(78vw,300px);
            height:min(78vw,300px);
            max-width:300px;
            max-height:300px;
            min-width:220px;
            min-height:220px;
            position:relative;
            border-radius:50%;
            touch-action:none;
            background:
              radial-gradient(
                circle,
                #fff 0%,
                rgba(255,255,255,0) 68%
              ),
              conic-gradient(
                #ff0000,
                #ffff00,
                #00ff00,
                #00ffff,
                #0000ff,
                #ff00ff,
                #ff0000
              );
            box-shadow:
              0 0 0 2px #282828,
              0 0 40px rgba(255,255,255,.08);
          }

          .wheelDot{
            position:absolute;
            left:50%;
            top:50%;
            width:20px;
            height:20px;
            margin-left:-10px;
            margin-top:-10px;
            border-radius:50%;
            border:3px solid #fff;
            background:transparent;
            box-shadow:
              0 0 0 2px #000,
              0 0 10px rgba(255,255,255,.8);
            z-index:5;
            pointer-events:none;
          }

          .colorPreview{
            height:42px;
            border-radius:13px;
            border:1px solid #333;
            margin:5px 0 13px;
          }

          .preset{
            height:50px;
            border-radius:12px;
          }

          .preset.red{background:#f00}
          .preset.green{background:#0f0}
          .preset.blue{background:#00f}
          .preset.white{background:#fff;color:#000}
          .preset.yellow{background:#ff0;color:#000}
          .preset.cyan{background:#0ff;color:#000}
          .preset.magenta{background:#f0f;color:#000}

          input[type=range]{
            width:100%;
            accent-color:#fff;
          }

          .value{
            float:right;
            color:#fff;
          }

          /* LED STRIP */

          .strip{
            display:flex;
            align-items:center;
            gap:4px;
            height:90px;
            padding:17px 8px;
            border-radius:18px;
            overflow:hidden;
            background:#070707;
            border:1px solid #222;
          }

          .led{
            flex:1;
            min-width:8px;
            height:42px;
            border-radius:8px;
            background:#111;
            transition:
              background .07s,
              box-shadow .07s,
              transform .07s;
          }

          /* EFFECTS */

          .effectPreview{
            height:120px;
            display:flex;
            align-items:center;
            gap:4px;
            padding:15px 7px;
            border-radius:18px;
            background:#070707;
            border:1px solid #222;
            overflow:hidden;
            margin-bottom:12px;
          }

          .effectPreview .led{
            height:60px;
          }

          .search{
            width:100%;
            background:#0b0b0b;
            border:1px solid #333;
            color:#fff;
            padding:13px;
            border-radius:12px;
            outline:none;
            margin-bottom:10px;
          }

          .effects{
            display:grid;
            grid-template-columns:1fr 1fr;
            gap:8px;
            max-height:520px;
            overflow:auto;
          }

          .effect{
            min-height:68px;
            text-align:left;
            background:#141414;
          }

          .effect b{
            display:block;
            font-size:12px;
            margin-bottom:5px;
          }

          .effect small{
            color:#777;
            font-size:10px;
          }

          /* CUSTOM */

          .frames{
            display:flex;
            gap:8px;
            overflow-x:auto;
            padding:5px 0 10px;
          }

          .frame{
            min-width:85px;
            height:58px;
            border-radius:11px;
            border:1px solid #333;
          }

          .chips{
            display:flex;
            flex-wrap:wrap;
            gap:7px;
            margin-bottom:10px;
          }

          .chip{
            width:38px;
            height:30px;
            border-radius:9px;
            border:2px solid #555;
          }

          /* ANALYZER */

          .terminal{
            background:#000;
            border:1px solid #272727;
            border-radius:13px;
            padding:12px;
            min-height:120px;
            max-height:330px;
            overflow:auto;
            white-space:pre-wrap;
            word-break:break-all;
            font-family:monospace;
            font-size:11px;
            line-height:1.55;
          }

          textarea{
            width:100%;
            min-height:150px;
            resize:vertical;
            background:#080808;
            border:1px solid #333;
            border-radius:13px;
            color:#fff;
            padding:12px;
            outline:none;
            font-family:monospace;
          }

          .device{
            border:1px solid #292929;
            border-radius:14px;
            background:#111;
            padding:13px;
            margin:8px 0;
          }

          .deviceName{
            font-weight:800;
            font-size:14px;
          }

          .deviceAddress{
            color:#777;
            font-size:11px;
            margin:6px 0 10px;
            font-family:monospace;
          }

          .pill{
            display:inline-block;
            border:1px solid #333;
            border-radius:20px;
            padding:7px 10px;
            color:#aaa;
            font-size:10px;
            margin:3px;
          }

          .notice{
            padding:12px;
            border-radius:12px;
            background:#0c0c0c;
            border:1px solid #292929;
            color:#888;
            font-size:11px;
            line-height:1.5;
          }

          </style>
          </head>

          <body>

          <div id="overlay" class="overlay" onclick="closeDrawer()"></div>

          <div id="drawer" class="drawer">

            <div class="drawerTitle">LEDDMX AI PRO</div>

            <button onclick="go('home')">🏠 HOME</button>
            <button onclick="go('effects')">✨ 210 EFFECTS</button>
            <button onclick="go('custom')">🎨 CUSTOM STUDIO</button>
            <button onclick="go('slots')">💾 MY MODES 171–210</button>
            <button onclick="go('ai')">🤖 AI SCENE</button>

            <div class="drawerSep"></div>

            <button onclick="go('analyzer')">🧠 MODULE / MCU ANALYZER</button>
            <button onclick="go('protocol')">🧪 PROTOCOL LAB</button>
            <button onclick="go('gatt')">📡 GATT / BLE INSPECTOR</button>
            <button onclick="go('ota')">🔧 OTA / FIRMWARE</button>

            <div class="drawerSep"></div>

            <button onclick="go('settings')">⚙ SETTINGS</button>

          </div>

          <header class="top">
            <button class="hamb" onclick="toggleDrawer()">☰</button>
            <div class="title">LEDDMX AI PRO</div>
            <div id="status" class="status">DISCONNECTED</div>
          </header>

          <!-- HOME -->

          <section id="home" class="page active">

            <div class="card">

              <h2>Control Center</h2>

              <div class="grid2">
                <button class="primary" onclick="LED.power(true)">
                  POWER ON
                </button>

                <button onclick="LED.power(false)">
                  POWER OFF
                </button>
              </div>

            </div>

            <div class="card">

              <h3>RGB COLOUR</h3>

              <div class="wheelWrap">
                <div id="wheel" class="wheel">
                  <div id="dot" class="wheelDot"></div>
                </div>
              </div>

              <div id="colorPreview" class="colorPreview"></div>

              <div class="grid3">
                <button class="preset red"
                        onclick="setRGB(255,0,0)"></button>
                <button class="preset green"
                        onclick="setRGB(0,255,0)"></button>
                <button class="preset blue"
                        onclick="setRGB(0,0,255)"></button>

                <button class="preset white"
                        onclick="setRGB(255,255,255)">WHITE</button>
                <button class="preset yellow"
                        onclick="setRGB(255,255,0)">YELLOW</button>
                <button class="preset cyan"
                        onclick="setRGB(0,255,255)">CYAN</button>

                <button class="preset magenta"
                        onclick="setRGB(255,0,255)">MAGENTA</button>
                <button onclick="setRGB(255,128,0)">ORANGE</button>
                <button onclick="setRGB(128,0,255)">PURPLE</button>
              </div>

            </div>

            <div class="card">

              <h3>
                BRIGHTNESS
                <span id="brightVal" class="value">100%</span>
              </h3>

              <input id="bright"
                     type="range"
                     min="0"
                     max="100"
                     value="100"
                     oninput="
                       brightVal.innerText=this.value+'%';
                     "
                     onchange="
                       LED.brightness(+this.value);
                     ">

              <h3>
                SPEED
                <span id="speedVal" class="value">128</span>
              </h3>

              <input id="speed"
                     type="range"
                     min="0"
                     max="255"
                     value="128"
                     oninput="
                       speedVal.innerText=this.value;
                     "
                     onchange="
                       LED.speed(+this.value);
                     ">

              <h3>DIRECTION</h3>

              <div class="grid2">
                <button onclick="LED.direction(0)">
                  → FORWARD
                </button>

                <button onclick="LED.direction(1)">
                  ← REVERSE
                </button>
              </div>

            </div>

            <div class="card">

              <h3>LIVE PREVIEW</h3>

              <div id="homeStrip" class="strip"></div>

            </div>

            <div class="card">

              <h2>LEDDMX DEVICE</h2>

              <div id="scanStatus" class="notice">
                Press SCAN DEVICE to search for LEDDMX Bluetooth.
              </div>

              <br>

              <button class="primary"
                      style="width:100%"
                      onclick="scanDevice()">
                🔍 SCAN DEVICE
              </button>

              <div id="devices"></div>

            </div>

          </section>

          <!-- EFFECTS -->

          <section id="effects" class="page">

            <div class="card">

              <h2>210 EFFECTS</h2>

              <div id="effectPreview" class="effectPreview"></div>

              <div id="effectName" class="sub">
                Select an effect
              </div>

              <br>

              <input
                id="effectSearch"
                class="search"
                placeholder="Search effect..."
                oninput="filterEffects()">

              <div id="effectsList" class="effects"></div>

            </div>

          </section>

          <!-- CUSTOM -->

          <section id="custom" class="page">

            <div class="card">

              <h2>Custom Animation Studio</h2>

              <div id="customStrip" class="strip"></div>

              <h3>TEMPLATE</h3>

              <div class="grid2">
                <button onclick="template('belang')">BELANG</button>
                <button onclick="template('rainbow')">RAINBOW</button>
                <button onclick="template('chase')">CHASE</button>
                <button onclick="template('wave')">WAVE</button>
                <button onclick="template('comet')">COMET</button>
                <button onclick="template('scanner')">SCANNER</button>
                <button onclick="template('pulse')">PULSE</button>
                <button onclick="template('fade')">FADE</button>
              </div>

              <h3>OUTPUT</h3>

              <div class="grid2">
                <button onclick="output='WHOLE'">WHOLE</button>
                <button onclick="output='BOTH'">BOTH</button>
                <button onclick="output='LEFT'">LEFT</button>
                <button onclick="output='RIGHT'">RIGHT</button>
              </div>

            </div>

            <div class="card">

              <h3>COLOUR</h3>

              <div class="wheelWrap">
                <div id="customWheel" class="wheel">
                  <div id="customDot" class="wheelDot"></div>
                </div>
              </div>

              <div id="chips" class="chips"></div>

              <div class="grid2">
                <button onclick="addColor()">＋ ADD COLOR</button>
                <button onclick="clearColors()">CLEAR</button>
              </div>

            </div>

            <div class="card">

              <h3>FRAMES</h3>

              <div id="frames" class="frames"></div>

              <div class="grid2">
                <button onclick="addFrame()">＋ FRAME</button>
                <button onclick="removeFrame()">− FRAME</button>
              </div>

              <h3>FRAME DURATION</h3>

              <input
                id="duration"
                type="range"
                min="50"
                max="1500"
                value="250">

              <div class="grid2" style="margin-top:12px">
                <button class="primary"
                        onclick="previewCustom()">
                  ▶ PREVIEW
                </button>

                <button onclick="sendCustom()">
                  ⚡ SEND
                </button>
              </div>

            </div>

          </section>

          <!-- SLOTS -->

          <section id="slots" class="page">

            <div class="card">

              <h2>MY MODES 171–210</h2>

              <div class="notice">
                Slot disimpan lokal di HP.
                Permanent storage pada MCU tidak dianggap tersedia
                sebelum command storage terbukti dari modul.
              </div>

              <div id="slotsList"></div>

            </div>

          </section>

          <!-- AI -->

          <section id="ai" class="page">

            <div class="card">

              <h2>AI SCENE COMPOSER</h2>

              <div class="notice">
                Offline natural-language composer.
                Tidak membutuhkan API AI.
              </div>

              <br>

              <textarea
                id="aiText"
                placeholder="Contoh:
belang merah biru cepat
rainbow pelan
kiri merah kanan biru
chase merah cepat"></textarea>

              <br><br>

              <div class="grid2">
                <button class="primary"
                        onclick="generateAI()">
                  ✨ GENERATE
                </button>

                <button onclick="previewCustom()">
                  ▶ PREVIEW
                </button>
              </div>

              <br>

              <button style="width:100%"
                      onclick="sendCustom()">
                ⚡ SEND TO MODULE
              </button>

            </div>

          </section>

          <!-- ANALYZER -->

          <section id="analyzer" class="page">

            <div class="card">

              <h2>MODULE / MCU ANALYZER</h2>

              <span class="pill">SOURCE: DEVICE</span>
              <span class="pill">LIVE BLE</span>

              <p class="sub">
                Data RX/TX di sini adalah data komunikasi aktual.
                Aplikasi tidak boleh mengisi informasi MCU yang tidak
                diberikan oleh device.
              </p>

              <h3>MODULE → PHONE / RX</h3>

              <div id="rxLog" class="terminal">
                NOT EXPOSED BY DEVICE
              </div>

              <br>

              <button onclick="copyBox('rxLog')">
                COPY RX
              </button>

              <h3>PHONE → MODULE / TX</h3>

              <div id="txLog" class="terminal">
                NO PACKET SENT
              </div>

              <br>

              <button onclick="copyBox('txLog')">
                COPY TX
              </button>

            </div>

          </section>

          <!-- PROTOCOL -->

          <section id="protocol" class="page">

            <div class="card">

              <h2>PROTOCOL LAB</h2>

              <div class="notice">
                HEX di bawah adalah draft.
                Tidak akan dikirim sampai SEND ditekan.
              </div>

              <br>

              <textarea
                id="hex"
                spellcheck="false"
                placeholder="7B FF 03 01 FF FF FF FF BF"></textarea>

              <br><br>

              <button
                class="primary"
                style="width:100%"
                onclick="sendHex()">
                SEND HEX
              </button>

            </div>

          </section>

          <!-- GATT -->

          <section id="gatt" class="page">

            <div class="card">

              <h2>GATT / BLE INSPECTOR</h2>

              <div class="notice">
                Service dan characteristic akan ditampilkan
                berdasarkan GATT yang benar-benar ditemukan
                pada device.
              </div>

              <div id="gattInfo"
                   class="terminal"
                   style="margin-top:12px">
                NOT CONNECTED
              </div>

            </div>

          </section>

          <!-- OTA -->

          <section id="ota" class="page">

            <div class="card">

              <h2>OTA / FIRMWARE</h2>

              <div id="otaInfo" class="notice">
                OTA STATUS: NOT EXPOSED BY DEVICE
              </div>

              <br>

              <div class="notice">
                OTA tidak melakukan flash firmware sembarangan.
                Service OTA hanya dianggap terdeteksi jika benar-benar
                muncul pada GATT device.
              </div>

            </div>

          </section>

          <!-- SETTINGS -->

          <section id="settings" class="page">

            <div class="card">

              <h2>SETTINGS</h2>

              <div class="grid2">
                <button onclick="scanDevice()">SCAN DEVICE</button>
                <button onclick="LED.disconnect()">DISCONNECT</button>
              </div>

              <h3>APP</h3>

              <span class="pill">LEDDMX AI PRO FINAL</span>
              <span class="pill">210 EFFECTS</span>
              <span class="pill">CUSTOM STUDIO</span>
              <span class="pill">BLE FFE0 / FFE1</span>

              <h3>PROTOCOL</h3>

              <div class="notice">
                Primary service:
                0000FFE0-0000-1000-8000-00805F9B34FB

                <br><br>

                Write characteristic:
                0000FFE1-0000-1000-8000-00805F9B34FB
              </div>

            </div>

          </section>

          <script>

          let rgb=[255,0,0];

          let colors=[
            [255,0,0],
            [0,0,255]
          ];

          let frames=[];

          let output="WHOLE";

          let previewTimer=null;

          let effects=[];

          let currentEffect=0;

          let phase=0;

          /* NAVIGATION */

          function toggleDrawer(){
            document.getElementById("drawer")
              .classList.toggle("open");

            document.getElementById("overlay")
              .classList.toggle("show");
          }

          function closeDrawer(){
            document.getElementById("drawer")
              .classList.remove("open");

            document.getElementById("overlay")
              .classList.remove("show");
          }

          function go(id){

            document.querySelectorAll(".page")
              .forEach(x=>x.classList.remove("active"));

            let p=document.getElementById(id);

            if(p){
              p.classList.add("active");
            }

            closeDrawer();

            if(id==="effects"){
              loadEffects();
            }

            if(id==="slots"){
              loadSlots();
            }
          }

          /* COLOR */

          function clamp(v){
            return Math.max(0,Math.min(255,Math.round(v)));
          }

          function hsvToRgb(h,s,v){

            let c=v*s;
            let x=c*(1-Math.abs((h/60)%2-1));
            let m=v-c;

            let r=0;
            let g=0;
            let b=0;

            if(h<60){
              r=c;g=x;b=0;
            }else if(h<120){
              r=x;g=c;b=0;
            }else if(h<180){
              r=0;g=c;b=x;
            }else if(h<240){
              r=0;g=x;b=c;
            }else if(h<300){
              r=x;g=0;b=c;
            }else{
              r=c;g=0;b=x;
            }

            return [
              Math.round((r+m)*255),
              Math.round((g+m)*255),
              Math.round((b+m)*255)
            ];
          }

          function wheelPoint(el,dot,e){

            let r=el.getBoundingClientRect();

            let cx=r.left+r.width/2;
            let cy=r.top+r.height/2;

            let dx=e.clientX-cx;
            let dy=e.clientY-cy;

            let radius=Math.min(r.width,r.height)/2;

            let dist=Math.sqrt(dx*dx+dy*dy);

            if(dist>radius){

              dx=dx/dist*radius;
              dy=dy/dist*radius;
              dist=radius;
            }

            let hue=
              (Math.atan2(dy,dx)*180/Math.PI+360)%360;

            let sat=
              Math.min(1,dist/radius);

            let x=
              r.width/2+dx;

            let y=
              r.height/2+dy;

            dot.style.left=x+"px";
            dot.style.top=y+"px";

            let c=hsvToRgb(hue,sat,1);

            setRGB(c[0],c[1],c[2]);
          }

          function bindWheel(id,dotId){

            let el=document.getElementById(id);
            let dot=document.getElementById(dotId);

            if(!el || !dot)return;

            let dragging=false;

            el.addEventListener(
              "pointerdown",
              function(e){

                dragging=true;

                try{
                  el.setPointerCapture(e.pointerId);
                }catch(x){}

                wheelPoint(el,dot,e);
                e.preventDefault();
              }
            );

            el.addEventListener(
              "pointermove",
              function(e){

                if(!dragging)return;

                wheelPoint(el,dot,e);
                e.preventDefault();
              }
            );

            el.addEventListener(
              "pointerup",
              function(){

                dragging=false;
              }
            );

            el.addEventListener(
              "pointercancel",
              function(){

                dragging=false;
              }
            );
          }

          function setRGB(r,g,b){

            rgb=[
              clamp(r),
              clamp(g),
              clamp(b)
            ];

            let p=document.getElementById("colorPreview");

            if(p){
              p.style.background=
                "rgb("+rgb.join(",")+")";

              p.style.boxShadow=
                "0 0 25px rgba("+
                rgb.join(",")+
                ",.35)";
            }

            drawStrip("homeStrip",rgb);

            LED.color(
              rgb[0],
              rgb[1],
              rgb[2]
            );
          }

          /* STRIP */

          function drawStrip(id,c,move=0){

            let el=document.getElementById(id);

            if(!el)return;

            el.innerHTML="";

            let n=id==="effectPreview"?20:28;

            for(let i=0;i<n;i++){

              let d=document.createElement("div");

              d.className="led";

              let active=
                ((i+move)%n);

              let factor=1;

              if(id==="effectPreview"){

                factor=
                  active%7===0 ? 1 :
                  active%7===1 ? .75 :
                  .15;
              }

              let rr=Math.round(c[0]*factor);
              let gg=Math.round(c[1]*factor);
              let bb=Math.round(c[2]*factor);

              d.style.background=
                "rgb("+rr+","+gg+","+bb+")";

              d.style.boxShadow=
                "0 0 14px rgba("+
                rr+","+gg+","+bb+",.75)";

              if(id==="customStrip"){
                d.style.transform=
                  "translateX("+((move%4)-2)+"px)";
              }

              el.appendChild(d);
            }
          }

          setInterval(function(){

            phase=(phase+1)%28;

            drawStrip(
              "homeStrip",
              rgb,
              phase
            );

            if(frames.length){
              drawCustomPreview(
                frames[
                  phase%frames.length
                ]
              );
            }

          },110);

          function drawCustomPreview(f){

            if(!f)return;

            let el=
              document.getElementById(
                "customStrip"
              );

            if(!el)return;

            el.innerHTML="";

            let n=28;

            for(let i=0;i<n;i++){

              let d=document.createElement("div");

              d.className="led";

              let c;

              if(output==="LEFT"){
                c=f.l;
              }else if(output==="RIGHT"){
                c=f.r;
              }else{
                c=i<n/2?f.l:f.r;
              }

              let factor=
                ((i+phase)%8===0)?1:
                ((i+phase)%8===1)?.65:.2;

              let rr=Math.round(c[0]*factor);
              let gg=Math.round(c[1]*factor);
              let bb=Math.round(c[2]*factor);

              d.style.background=
                "rgb("+rr+","+gg+","+bb+")";

              d.style.boxShadow=
                "0 0 16px rgba("+
                rr+","+gg+","+bb+",.8)";

              el.appendChild(d);
            }
          }

          /* BLE */

          function scanDevice(){

            let box=
              document.getElementById(
                "scanStatus"
              );

            box.innerText=
              "REQUESTING BLUETOOTH ACCESS...";

            document.getElementById(
              "devices"
            ).innerHTML="";

            LED.scan();
          }

          function scanStarted(){

            document.getElementById(
              "scanStatus"
            ).innerText=
              "SCANNING FOR LEDDMX DEVICES...";
          }

          function scanStopped(){

            let box=
              document.getElementById(
                "scanStatus"
              );

            if(!document.getElementById(
              "devices"
            ).children.length){

              box.innerText=
                "SCAN FINISHED — NO LEDDMX DEVICE FOUND.";
            }else{

              box.innerText=
                "DEVICE FOUND — SELECT CONNECT.";
            }
          }

          function scanBusy(){

            document.getElementById(
              "scanStatus"
            ).innerText=
              "PLEASE WAIT BEFORE SCANNING AGAIN.";
          }

          function scanError(code){

            let msg=
              "BLUETOOTH SCAN ERROR: "+code;

            if(code===1)
              msg+=" — ALREADY_STARTED";

            if(code===2)
              msg+=" — APPLICATION_REGISTRATION_FAILED";

            if(code===3)
              msg+=" — INTERNAL_ERROR";

            if(code===4)
              msg+=" — FEATURE_UNSUPPORTED";

            if(code===5)
              msg+=" — OUT_OF_HARDWARE_RESOURCES";

            if(code===6)
              msg+=" — SCANNING_TOO_FREQUENTLY";

            document.getElementById(
              "scanStatus"
            ).innerText=msg;
          }

          function bluetoothOff(){

            document.getElementById(
              "scanStatus"
            ).innerText=
              "BLUETOOTH IS OFF.";
          }

          function deviceFound(name,address){

            let box=
              document.getElementById(
                "devices"
              );

            let row=
              document.createElement(
                "div"
              );

            row.className="device";

            let safeName=
              String(name||"LEDDMX DEVICE");

            let safeAddress=
              String(address||"");

            row.innerHTML=
              "<div class='deviceName'>"+
              safeName+
              "</div>"+
              "<div class='deviceAddress'>"+
              safeAddress+
              "</div>"+
              "<button class='primary' "+
              "onclick=\"LED.connect('"+
              safeAddress.replace(
                /'/g,
                "\\'"
              )+
              "')\">"+
              "CONNECT"+
              "</button>";

            box.appendChild(row);
          }

          function connectionState(ok){

            let s=
              document.getElementById(
                "status"
              );

            s.innerText=
              ok?"CONNECTED":"DISCONNECTED";

            s.style.color=
              ok?"#fff":"#999";
          }

          function moduleReady(write,ota){

            let text=
              write?
              "CONNECTED • FFE1 READY":
              "CONNECTED • FFE1 NOT FOUND";

            document.getElementById(
              "status"
            ).innerText=text;

            document.getElementById(
              "otaInfo"
            ).innerText=
              ota?
              "OTA SERVICE DETECTED ON DEVICE":
              "OTA STATUS: NOT EXPOSED BY DEVICE";
          }

          function logDevice(x){

            let box=
              document.getElementById(
                "rxLog"
              );

            if(
              box.innerText===
              "NOT EXPOSED BY DEVICE"
            ){
              box.innerText="";
            }

            box.innerText+=
              x+"\n";

            box.scrollTop=
              box.scrollHeight;
          }

          function tx(x){

            let box=
              document.getElementById(
                "txLog"
              );

            if(
              box.innerText===
              "NO PACKET SENT"
            ){
              box.innerText="";
            }

            box.innerText+=
              "TX  "+x+"\n";

            box.scrollTop=
              box.scrollHeight;
          }

          function rx(x){

            logDevice(
              "RX  "+x
            );
          }

          function sendHex(){

            let value=
              document.getElementById(
                "hex"
              ).value.trim();

            if(!value)return;

            LED.hex(value);
          }

          function copyBox(id){

            let text=
              document.getElementById(
                id
              ).innerText;

            if(
              navigator.clipboard
            ){

              navigator.clipboard
                .writeText(text);
            }
          }

          /* EFFECTS */

          function loadEffects(){

            if(effects.length)return;

            let raw=LED.modes();

            if(!raw){

              for(
                let i=1;
                i<=210;
                i++
              ){
                effects.push([
                  i,
                  "MODE "+i
                ]);
              }

            }else{

              raw.trim()
                .split("\n")
                .forEach(function(line){

                  let p=line.split("|");

                  if(p.length>=2){

                    effects.push([
                      parseInt(p[0]),
                      p.slice(1).join("|")
                    ]);
                  }

                });
            }

            renderEffects();
          }

          function renderEffects(){

            let box=
              document.getElementById(
                "effectsList"
              );

            box.innerHTML="";

            effects.forEach(function(e){

              let b=
                document.createElement(
                  "button"
                );

              b.className="effect";

              b.dataset.name=
                String(e[1]).toLowerCase();

              b.innerHTML=
                "<b>"+e[0]+
                "</b><small>"+
                e[1]+
                "</small>";

              b.onclick=function(){

                currentEffect=e[0];

                LED.mode(e[0]);

                document.getElementById(
                  "effectName"
                ).innerText=
                  e[0]+" • "+e[1];

                startEffectPreview(
                  e[0]
                );
              };

              box.appendChild(b);
            });
          }

          function filterEffects(){

            let q=
              document.getElementById(
                "effectSearch"
              ).value
               .toLowerCase();

            document
              .querySelectorAll(
                ".effect"
              )
              .forEach(function(b){

                b.style.display=
                  b.dataset.name
                    .includes(q)
                  ?"block"
                  :"none";
              });
          }

          function startEffectPreview(mode){

            clearInterval(
              previewTimer
            );

            let local=0;

            previewTimer=
              setInterval(function(){

                local++;

                let c=
                  hsvToRgb(
                    (mode*17+local*8)%360,
                    1,
                    1
                  );

                drawStrip(
                  "effectPreview",
                  c,
                  local
                );

              },90);
          }

          /* CUSTOM */

          function addColor(){

            colors.push([
              rgb[0],
              rgb[1],
              rgb[2]
            ]);

            renderChips();
          }

          function clearColors(){

            colors=[];

            renderChips();
          }

          function renderChips(){

            let box=
              document.getElementById(
                "chips"
              );

            box.innerHTML="";

            colors.forEach(function(c){

              let d=
                document.createElement(
                  "div"
                );

              d.className="chip";

              d.style.background=
                "rgb("+c.join(",")+")";

              box.appendChild(d);
            });
          }

          function addFrame(){

            let left=
              colors.length?
              colors[
                frameIndex()%colors.length
              ]:
              rgb;

            let right=
              colors.length>1?
              colors[
                (frameIndex()+1)%colors.length
              ]:
              rgb;

            frames.push({
              l:[...left],
              r:[...right],
              d:+document.getElementById(
                "duration"
              ).value
            });

            renderFrames();
          }

          function frameIndex(){

            return frames.length;
          }

          function removeFrame(){

            if(frames.length){
              frames.pop();
            }

            renderFrames();
          }

          function renderFrames(){

            let box=
              document.getElementById(
                "frames"
              );

            box.innerHTML="";

            frames.forEach(function(f){

              let d=
                document.createElement(
                  "div"
                );

              d.className="frame";

              d.style.background=
                "linear-gradient(90deg,"+
                "rgb("+f.l.join(",")+"),"+
                "rgb("+f.r.join(",")+")"+
                ")";

              box.appendChild(d);
            });
          }

          function template(type){

            frames=[];

            if(type==="belang"){

              for(
                let i=0;
                i<16;
                i++
              ){

                frames.push({
                  l:i%2?
                    [255,255,255]:
                    [255,0,0],

                  r:i%2?
                    [255,255,255]:
                    [0,0,255],

                  d:180
                });
              }

            }else if(type==="rainbow"){

              for(
                let i=0;
                i<30;
                i++
              ){

                let c=
                  hsvToRgb(
                    i*12,
                    1,
                    1
                  );

                frames.push({
                  l:c,
                  r:c,
                  d:120
                });
              }

            }else if(type==="chase"){

              for(
                let i=0;
                i<24;
                i++
              ){

                frames.push({
                  l:
                    i%4===0?
                    [255,0,0]:
                    [10,0,0],

                  r:
                    i%4===2?
                    [0,0,255]:
                    [0,0,10],

                  d:100
                });
              }

            }else if(type==="wave"){

              for(
                let i=0;
                i<24;
                i++
              ){

                frames.push({
                  l:
                    hsvToRgb(
                      i*15,
                      1,
                      1
                    ),

                  r:
                    hsvToRgb(
                      i*15+180,
                      1,
                      1
                    ),

                  d:130
                });
              }

            }else if(
              type==="comet" ||
              type==="scanner"
            ){

              for(
                let i=0;
                i<20;
                i++
              ){

                frames.push({
                  l:
                    i%7===0?
                    [255,0,0]:
                    [35,0,0],

                  r:
                    i%7===3?
                    [0,0,255]:
                    [0,0,35],

                  d:100
                });
              }

            }else if(type==="pulse"){

              for(
                let i=0;
                i<18;
                i++
              ){

                let v=
                  Math.round(
                    255*
                    Math.abs(
                      Math.sin(
                        i/17*Math.PI
                      )
                    )
                  );

                frames.push({
                  l:[v,0,0],
                  r:[0,0,v],
                  d:90
                });
              }

            }else if(type==="fade"){

              for(
                let i=0;
                i<20;
                i++
              ){

                let v=
                  Math.round(
                    255*i/19
                  );

                frames.push({
                  l:[v,0,0],
                  r:[0,0,v],
                  d:100
                });
              }
            }

            renderFrames();
          }

          function previewCustom(){

            if(!frames.length){
              template("belang");
            }

            clearInterval(
              previewTimer
            );

            let i=0;

            previewTimer=
              setInterval(function(){

                let f=
                  frames[
                    i%frames.length
                  ];

                i++;

                drawCustomPreview(f);

              },
              Math.max(
                50,
                frames[0].d
              ));
          }

          function sendCustom(){

            if(!frames.length){
              template("belang");
            }

            clearInterval(
              previewTimer
            );

            let i=0;

            previewTimer=
              setInterval(function(){

                let f=
                  frames[
                    i%frames.length
                  ];

                i++;

                /*
                 * Exact custom color-list protocol:
                 *
                 * 7B position 0E FD R G B total BF
                 *
                 * Custom mode:
                 *
                 * 7B FF 13 modeOrdinal FF FF FF FF BF
                 *
                 * LEFT/RIGHT hardware routing remains
                 * unclaimed until proven by actual MCU.
                 */

                let list=[];

                if(output==="LEFT"){
                  list=[f.l];
                }else if(output==="RIGHT"){
                  list=[f.r];
                }else{
                  list=[f.l,f.r];
                }

                for(
                  let p=0;
                  p<list.length;
                  p++
                ){

                  let c=list[p];

                  LED.customColor(
                    p+1,
                    c[0],
                    c[1],
                    c[2],
                    list.length
                  );
                }

                /*
                 * GD = 0
                 */
                LED.customMode(0);

              },
              Math.max(
                100,
                frames[0].d
              ));
          }

          /* AI */

          function generateAI(){

            let s=
              document.getElementById(
                "aiText"
              ).value
               .toLowerCase();

            if(
              s.includes("rainbow") ||
              s.includes("pelangi")
            ){

              template("rainbow");
              return;
            }

            if(
              s.includes("belang") ||
              s.includes("stripe") ||
              s.includes("bergantian")
            ){

              let a=
                s.includes("merah")?
                [255,0,0]:
                [255,255,255];

              let b=
                s.includes("biru")?
                [0,0,255]:
                s.includes("hijau")?
                [0,255,0]:
                [0,0,255];

              let d=
                s.includes("cepat")?
                80:
                s.includes("pelan")||
                s.includes("lambat")?
                500:
                220;

              frames=[];

              for(
                let i=0;
                i<18;
                i++
              ){

                frames.push({
                  l:i%2?a:b,
                  r:i%2?b:a,
                  d:d
                });
              }

              renderFrames();
              return;
            }

            if(
              s.includes("chase") ||
              s.includes("jalan") ||
              s.includes("running")
            ){

              template("chase");
              return;
            }

            if(
              s.includes("fade") ||
              s.includes("memudar")
            ){

              template("fade");
              return;
            }

            let c=
              s.includes("biru")?
              [0,0,255]:
              s.includes("hijau")?
              [0,255,0]:
              s.includes("putih")?
              [255,255,255]:
              [255,0,0];

            frames=[];

            for(
              let i=0;
              i<10;
              i++
            ){

              frames.push({
                l:c,
                r:c,
                d:
                  s.includes("cepat")?
                  90:
                  250
              });
            }

            renderFrames();
          }

          /* SLOTS */

          function saveSlot(n){

            localStorage.setItem(
              "LEDDMX_SLOT_"+n,
              JSON.stringify(frames)
            );

            loadSlots();
          }

          function loadSlot(n){

            let x=
              localStorage.getItem(
                "LEDDMX_SLOT_"+n
              );

            if(!x)return;

            try{

              frames=
                JSON.parse(x);

              renderFrames();

              go("custom");

            }catch(e){}
          }

          function loadSlots(){

            let box=
              document.getElementById(
                "slotsList"
              );

            if(!box)return;

            box.innerHTML="";

            for(
              let n=171;
              n<=210;
              n++
            ){

              let exists=
                !!localStorage.getItem(
                  "LEDDMX_SLOT_"+n
                );

              let row=
                document.createElement(
                  "div"
                );

              row.className="card";

              row.innerHTML=
                "<b>SLOT "+n+"</b>"+
                "<span class='pill'>"+
                (exists?
                  "SAVED":
                  "EMPTY")+
                "</span>"+
                "<br><br>"+
                "<button onclick='loadSlot("+
                n+
                ")'>LOAD</button> "+
                "<button onclick='saveSlot("+
                n+
                ")'>SAVE</button>";

              box.appendChild(row);
            }
          }

          /* INIT */

          bindWheel(
            "wheel",
            "dot"
          );

          bindWheel(
            "customWheel",
            "customDot"
          );

          setRGB(255,0,0);

          renderChips();

          template("belang");

          </script>

          </body>
          </html>
          EOF

