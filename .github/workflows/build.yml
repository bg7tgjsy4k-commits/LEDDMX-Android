              private void startBleScan() {

                  if (bluetoothAdapter == null) {
                      toast("Bluetooth unavailable");
                      return;
                  }

                  if (!bluetoothAdapter.isEnabled()) {
                      toast("Bluetooth belum aktif");
                      return;
                  }

                  if (Build.VERSION.SDK_INT >= 31) {

                      if (checkSelfPermission(
                              Manifest.permission.BLUETOOTH_SCAN
                      ) != PackageManager.PERMISSION_GRANTED) {

                          requestBluetoothPermissions();
                          return;
                      }
                  }

                  try {

                      bleScanner =
                              bluetoothAdapter
                                      .getBluetoothLeScanner();

                      if (bleScanner == null) {
                          toast("BLE scanner unavailable");
                          return;
                      }

                      discoveredDevices.clear();
                      discoveredButtons.clear();

                      if (scanDeviceListLayout != null) {
                          scanDeviceListLayout.removeAllViews();
                      }

                      isScanning = true;

                      statusText.setText(
                              "Status: Scanning..."
                      );

                      bleScanner.startScan(
                              scanCallback
                      );

                      handler.postDelayed(
                              () -> stopBleScan(),
                              12000
                      );

                  } catch (Exception e) {

                      toast(
                              "Scan error: " +
                              e.getMessage()
                      );
                  }
              }

              private final ScanCallback scanCallback =
                      new ScanCallback() {

                          @Override
                          public void onScanResult(
                                  int callbackType,
                                  ScanResult result
                          ) {

                              BluetoothDevice device =
                                      result.getDevice();

                              String name = "";

                              try {
                                  if (device.getName() != null) {
                                      name =
                                              device.getName();
                                  }
                              } catch (SecurityException ignored) {}

                              if ((name == null
                                      || name.isEmpty())
                                      &&
                                      result.getScanRecord()
                                              != null) {

                                  name =
                                          result
                                          .getScanRecord()
                                          .getDeviceName();
                              }

                              if (name == null) {
                                  name = "";
                              }

                              String address = "";

                              try {
                                  address =
                                          device.getAddress();
                              } catch (SecurityException ignored) {}

                              String upper =
                                      name.toUpperCase(
                                              Locale.US
                                      );

                              boolean likelyLEDDMX =
                                      upper.contains("LEDDMX")
                                      ||
                                      upper.contains("B2CD");

                              if (!likelyLEDDMX) {

                                  if (result.getScanRecord()
                                          != null) {

                                      byte[] data =
                                              result
                                              .getScanRecord()
                                              .getBytes();

                                      String raw =
                                              bytesToHex(data);

                                      likelyLEDDMX =
                                              raw.contains(
                                                      "FFE0"
                                              );
                                  }
                              }

                              final String displayName =
                                      name.isEmpty()
                                      ? "BLE DEVICE"
                                      : name;

                              final String displayAddress =
                                      address;

                              if (!likelyLEDDMX) {
                                  return;
                              }

                              runOnUiThread(() -> {

                                  if (discoveredDevices
                                          .containsKey(
                                                  displayAddress
                                          )) {
                                      return;
                                  }

                                  discoveredDevices.put(
                                          displayAddress,
                                          device
                                  );

                                  Button deviceButton =
                                          createButton(
                                                  displayName +
                                                  "\n" +
                                                  displayAddress,
                                                  Color.rgb(
                                                          0,
                                                          120,
                                                          140
                                                  )
                                          );

                                  deviceButton.setTextSize(
                                          11
                                  );

                                  deviceButton
                                          .setOnClickListener(
                                                  v -> {

                                                      stopBleScan();

                                                      BluetoothDevice selected =
                                                              discoveredDevices
                                                              .get(
                                                                      displayAddress
                                                              );

                                                      if (selected != null) {
                                                          connectDevice(
                                                                  selected
                                                          );
                                                      }
                                                  }
                                          );

                                  discoveredButtons.put(
                                          displayAddress,
                                          deviceButton
                                  );

                                  if (scanDeviceListLayout != null) {
                                      scanDeviceListLayout
                                              .addView(
                                                      deviceButton
                                              );
                                  }
                              });
                          }

                          @Override
                          public void onScanFailed(
                                  int errorCode
                          ) {

                              runOnUiThread(() -> {

                                  isScanning = false;

                                  statusText.setText(
                                          "Status: Scan failed " +
                                          errorCode
                                  );

                                  toast(
                                          "BLE scan failed: " +
                                          errorCode
                                  );
                              });
                          }
                      };

              private void stopBleScan() {

                  if (!isScanning) {
                      return;
                  }

                  isScanning = false;

                  try {

                      if (bleScanner != null) {
                          bleScanner.stopScan(
                                  scanCallback
                          );
                      }

                  } catch (Exception ignored) {}

                  runOnUiThread(() ->
                          statusText.setText(
                                  "Status: Scan stopped"
                          )
                  );
              }

              private void connectDevice(
                      BluetoothDevice device
              ) {

                  stopBleScan();

                  gattReady = false;
                  targetChar = null;

                  runOnUiThread(() ->
                          statusText.setText(
                                  "Status: Connecting..."
                          )
                  );

                  try {

                      if (bluetoothGatt != null) {
                          try {
                              bluetoothGatt.disconnect();
                              bluetoothGatt.close();
                          } catch (Exception ignored) {}

                          bluetoothGatt = null;
                      }

                      bluetoothGatt =
                              device.connectGatt(
                                      MainActivity.this,
                                      false,
                                      gattCallback
                              );

                  } catch (Exception e) {

                      toast(
                              "Connection error: " +
                              e.getMessage()
                      );
                  }
              }

              private final BluetoothGattCallback gattCallback =
                      new BluetoothGattCallback() {

                          @Override
                          public void onConnectionStateChange(
                                  BluetoothGatt gatt,
                                  int status,
                                  int newState
                          ) {

                              if (newState ==
                                      BluetoothGatt.STATE_CONNECTED) {

                                  bluetoothGatt = gatt;

                                  runOnUiThread(() ->
                                          statusText.setText(
                                                  "Status: Connected - discovering FFE1..."
                                          )
                                  );

                                  try {
                                      if (Build.VERSION.SDK_INT >= 21) {
                                          gatt.requestConnectionPriority(
                                                  BluetoothGatt
                                                          .CONNECTION_PRIORITY_HIGH
                                          );
                                      }
                                  } catch (Exception ignored) {}

                                  try {
                                      gatt.discoverServices();
                                  } catch (Exception e) {

                                      runOnUiThread(() ->
                                              statusText.setText(
                                                      "Status: Service discovery error"
                                              )
                                      );
                                  }

                              } else if (
                                      newState ==
                                      BluetoothGatt.STATE_DISCONNECTED
                              ) {

                                  gattReady = false;
                                  targetChar = null;

                                  try {
                                      gatt.close();
                                  } catch (Exception ignored) {}

                                  bluetoothGatt = null;

                                  runOnUiThread(() ->
                                          statusText.setText(
                                                  "Status: Disconnected"
                                          )
                                  );
                              }
                          }

                          @Override
                          public void onServicesDiscovered(
                                  BluetoothGatt gatt,
                                  int status
                          ) {

                              if (status !=
                                      BluetoothGatt.GATT_SUCCESS) {

                                  runOnUiThread(() ->
                                          statusText.setText(
                                                  "Status: GATT error " +
                                                  status
                                          )
                                  );

                                  return;
                              }

                              BluetoothGattCharacteristic found =
                                      null;

                              for (BluetoothGattService service :
                                      gatt.getServices()) {

                                  if (service.getUuid()
                                          .equals(
                                                  SERVICE_FFE0
                                          )
                                          ||
                                          service.getUuid()
                                                  .toString()
                                                  .toLowerCase(
                                                          Locale.US
                                                  )
                                                  .contains(
                                                          "ffe0"
                                                  )) {

                                      for (
                                              BluetoothGattCharacteristic c :
                                              service.getCharacteristics()
                                      ) {

                                          if (c.getUuid()
                                                  .equals(
                                                          CHAR_FFE1
                                                  )
                                                  ||
                                                  c.getUuid()
                                                          .toString()
                                                          .toLowerCase(
                                                                  Locale.US
                                                          )
                                                          .contains(
                                                                  "ffe1"
                                                          )) {

                                              found = c;
                                              break;
                                          }
                                      }
                                  }

                                  if (found != null) {
                                      break;
                                  }
                              }

                              if (found == null) {

                                  gattReady = false;

                                  runOnUiThread(() -> {

                                      statusText.setText(
                                              "Status: FFE1 not found"
                                      );

                                      toast(
                                              "FFE1 characteristic tidak ditemukan"
                                      );
                                  });

                                  return;
                              }

                              targetChar = found;
                              gattReady = true;

                              runOnUiThread(() -> {

                                  statusText.setText(
                                          "Status: CONNECTED • FFE1 READY"
                                  );

                                  toast(
                                          "LEDDMX connected!"
                                  );

                                  showHomeDashboard();
                              });

                              drainPacketQueue();
                          }
                      };

              private void enqueuePacket(
                      byte[] packet
              ) {

                  if (!gattReady
                          || bluetoothGatt == null
                          || targetChar == null) {

                      toast(
                              "Belum terhubung ke FFE1"
                      );

                      return;
                  }

                  synchronized (packetQueue) {

                      packetQueue.add(
                              packet
                      );
                  }

                  drainPacketQueue();
              }

              private void drainPacketQueue() {

                  if (writingPacket) {
                      return;
                  }

                  byte[] packet = null;

                  synchronized (packetQueue) {

                      if (!packetQueue.isEmpty()) {
                          packet =
                                  packetQueue.remove(0);
                      }
                  }

                  if (packet == null) {
                      return;
                  }

                  if (bluetoothGatt == null
                          || targetChar == null
                          || !gattReady) {
                      return;
                  }

                  writingPacket = true;

                  try {

                      int properties =
                              targetChar.getProperties();

                      if ((properties &
                              BluetoothGattCharacteristic
                                      .PROPERTY_WRITE)
                              != 0) {

                          targetChar.setWriteType(
                                  BluetoothGattCharacteristic
                                          .WRITE_TYPE_DEFAULT
                          );

                      } else {

                          targetChar.setWriteType(
                                  BluetoothGattCharacteristic
                                          .WRITE_TYPE_NO_RESPONSE
                          );
                      }

                      targetChar.setValue(packet);

                      bluetoothGatt.writeCharacteristic(
                              targetChar
                      );

                  } catch (Exception e) {

                      writingPacket = false;

                      handler.postDelayed(
                              this::drainPacketQueue,
                              80
                      );
                  }

                  handler.postDelayed(() -> {

                      writingPacket = false;
                      drainPacketQueue();

                  }, 55);
              }

              /*
               * =========================================================
               * PROVEN LEDDMX DIALECT-B PACKETS
               * =========================================================
               */

              private void sendPower(
                      boolean on
              ) {

                  byte[] p = {
                          0x7B,
                          (byte) 0xFF,
                          0x04,
                          (byte) (on ? 0x01 : 0x00),
                          (byte) 0xFF,
                          (byte) 0xFF,
                          (byte) 0xFF,
                          (byte) 0xFF,
                          (byte) 0xBF
                  };

                  enqueuePacket(p);
              }

              private void sendBrightness(
                      int value
              ) {

                  value =
                          Math.max(
                                  0,
                                  Math.min(
                                          100,
                                          value
                                  )
                          );

                  int scaled =
                          (value * 32) / 100;

                  byte[] p = {
                          0x7B,
                          (byte) 0xFF,
                          0x01,
                          (byte) scaled,
                          (byte) value,
                          0x01,
                          (byte) 0xFF,
                          (byte) 0xFF,
                          (byte) 0xBF
                  };

                  enqueuePacket(p);
              }

              private void sendSpeed(
                      int value
              ) {

                  value =
                          Math.max(
                                  0,
                                  Math.min(
                                          100,
                                          value
                                  )
                          );

                  byte[] p = {
                          0x7B,
                          (byte) 0xFF,
                          0x02,
                          (byte) value,
                          0x00,
                          (byte) 0xFF,
                          (byte) 0xFF,
                          (byte) 0xFF,
                          (byte) 0xBF
                  };

                  enqueuePacket(p);
              }

              private void sendMode(
                      int mode
              ) {

                  mode =
                          Math.max(
                                  1,
                                  Math.min(
                                          210,
                                          mode
                                  )
                          );

                  byte[] p = {
                          0x7B,
                          (byte) 0xFF,
                          0x03,
                          (byte) mode,
                          (byte) 0xFF,
                          (byte) 0xFF,
                          (byte) 0xFF,
                          (byte) 0xFF,
                          (byte) 0xBF
                  };

                  enqueuePacket(p);
              }

              private void sendDirection(
                      int dir
              ) {

                  byte[] p = {
                          0x7B,
                          (byte) 0xFF,
                          0x0D,
                          (byte) dir,
                          (byte) 0xFF,
                          (byte) 0xFF,
                          (byte) 0xFF,
                          (byte) 0xFF,
                          (byte) 0xBF
                  };

                  enqueuePacket(p);
              }

              private void sendRGB(
                      int color
              ) {

                  int r = Color.red(color);
                  int g = Color.green(color);
                  int b = Color.blue(color);

                  byte[] p = {
                          0x7B,
                          (byte) 0xFF,
                          0x07,
                          (byte) r,
                          (byte) g,
                          (byte) b,
                          0x00,
                          (byte) 0xFF,
                          (byte) 0xBF
                  };

                  enqueuePacket(p);
              }

              private void sendPixelConfig(
                      int pixels
              ) {

                  pixels =
                          Math.max(
                                  1,
                                  Math.min(
                                          65535,
                                          pixels
                                  )
                          );

                  int hi =
                          (pixels >> 8) & 0xFF;

                  int lo =
                          pixels & 0xFF;

                  /*
                   * 0x05 frame:
                   * 7B FF 05 TYPE PIX_HI PIX_LO SORT FF BF
                   *
                   * TYPE/SORT kept at documented neutral defaults.
                   */

                  byte[] p = {
                          0x7B,
                          (byte) 0xFF,
                          0x05,
                          0x00,
                          (byte) hi,
                          (byte) lo,
                          0x00,
                          (byte) 0xFF,
                          (byte) 0xBF
                  };

                  enqueuePacket(p);
              }

