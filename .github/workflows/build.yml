name: Build LEDDMX Direct Gradle v13

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build APK via Gradle Wrapper
        shell: bash
        run: |
          set -e
          rm -rf app build.gradle settings.gradle gradle.properties local.properties gradlew gradlew.bat gradle

          # Buat struktur direktori Android standar
          mkdir -p app/src/main/java/com/leddmx/pro
          mkdir -p app/src/main/res/values
          mkdir -p gradle/wrapper

          # Konfigurasi local.properties agar otomatis mendeteksi Android SDK bawaan runner Linux
          echo "sdk.dir=$ANDROID_HOME" > local.properties

          cat > settings.gradle << 'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "LEDDMX-Pro"
          include ':app'
          EOF

          cat > build.gradle << 'EOF'
          plugins {
              id 'com.android.application' version '8.2.0' apply false
          }
          EOF

          cat > gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

          cat > app/build.gradle << 'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.leddmx.pro'
              compileSdk 34
              defaultConfig {
                  applicationId "com.leddmx.pro"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "13.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOF

          cat > app/src/main/res/values/strings.xml << 'EOF'
          <resources>
              <string name="app_name">LEDDMX Pro v13</string>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.BLUETOOTH" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" />
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
              <uses-permission android:name="android.permission.BLUETOOTH_SCAN" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-feature android:name="android.hardware.bluetooth_le" android:required="false" />
              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:theme="@android:style/Theme.Material.NoActionBar"
                  android:supportsRtl="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/leddmx/pro/MainActivity.java << 'EOF'
          package com.leddmx.pro;
          import android.app.Activity;
          import android.os.Bundle;
          import android.widget.TextView;
          import android.graphics.Color;

          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  TextView tv = new TextView(this);
                  tv.setText("LEDDMX Pro v13 - Direct Build Success");
                  tv.setTextSize(18);
                  tv.setTextColor(Color.WHITE);
                  tv.setBackgroundColor(Color.BLACK);
                  setContentView(tv);
              }
          }
          EOF

          # Download dan gunakan gradle wrapper versi 8.5 secara mandiri
          gradle wrapper --gradle-version 8.5
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LEDDMX-Pro-v13
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
