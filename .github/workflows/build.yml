              private byte[] parseHex(
                      String value
              ) {

                  String[] p =
                          value.trim()
                                  .split("\\s+");

                  byte[] data =
                          new byte[p.length];

                  for (int i = 0;
                       i < p.length;
                       i++) {

                      data[i] =
                              (byte) Integer.parseInt(
                                      p[i],
                                      16
                              );
                  }

                  return data;
              }

