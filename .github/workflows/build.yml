        shell: bash
        run: |
          set -e
          gradle wrapper --gradle-version 8.10.2

      - name: Build APK
        shell: bash
        run: |
          set -e
          ./gradlew --no-daemon clean assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LEDDMX-AI-Pro-v13
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
