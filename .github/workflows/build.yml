              private int read(
                      EditText field,
                      int fallback
              ) {

                  try {

                      return clamp(
                              Integer.parseInt(
                                      field
                                              .getText()
                                              .toString()
                                              .trim()
                              )
                      );

                  } catch (
                          Exception e
                  ) {

                      return fallback;
                  }
              }


              private int clamp(
                      int value
              ) {

                  return Math.max(
                          0,
                          Math.min(
                                  255,
                                  value
                          )
                  );
              }


              private String rgb(
                      int r,
                      int g,
                      int b
              ) {

                  return String.format(
                          Locale.US,
                          "#%02X%02X%02X",
                          clamp(r),
                          clamp(g),
                          clamp(b)
                  );
              }


              private void updateConnectionStatus() {

                  if (
                          connectionStatus == null
                  ) {
                      return;
                  }


                  connectionStatus.setText(
                          ble.connected
                                  ? "CONNECTED"
                                  : "OFFLINE"
                  );


                  connectionStatus.setTextColor(
                          ble.connected
                                  ? Color.GREEN
                                  : Color.GRAY
                  );
              }


              private void toast(
                      String message
              ) {

                  Toast.makeText(
                          this,
                          message,
                          Toast.LENGTH_SHORT
                  ).show();
              }


              @Override
              protected void onDestroy() {

                  stopPreview();

                  super.onDestroy();
              }


              // ======================================================
              // FRAME
              // ======================================================

              private static class Frame {

                  int lr;
                  int lg;
                  int lb;

                  int rr;
                  int rg;
                  int rb;

                  int duration;


                  Frame(
                          int lr,
                          int lg,
                          int lb,
                          int rr,
                          int rg,
                          int rb,
                          int duration
                  ) {

                      this.lr = lr;
                      this.lg = lg;
                      this.lb = lb;

                      this.rr = rr;
                      this.rg = rg;
                      this.rb = rb;

                      this.duration = duration;
                  }


                  Frame copy() {

                      return new Frame(
                              lr,
                              lg,
                              lb,
                              rr,
                              rg,
                              rb,
                              duration
                      );
                  }
              }
          }
          EOF


      # ============================================================
      # 14. GENERATE GRADLE WRAPPER
      # ============================================================

      - name: Generate Gradle wrapper
        shell: bash
        run: |
          gradle wrapper --gradle-version 8.10.2


      # ============================================================
      # 15. BUILD
      # ============================================================

      - name: Build Debug APK
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew clean assembleDebug --stacktrace


      # ============================================================
      # 16. VERIFY APK
      # ============================================================

      - name: Verify generated APK
        shell: bash
        run: |
          echo "========================================"
          echo "APK OUTPUT"
          echo "========================================"

          find app/build/outputs -type f -name "*.apk" -print

          echo "========================================"
          echo "APK DIRECTORY"
          echo "========================================"

          ls -lah app/build/outputs/apk/debug/


      # ============================================================
      # 17. UPLOAD ARTIFACT
      # ============================================================

      - name: Upload FINAL APK
        uses: actions/upload-artifact@v4
        with:
          name: LEDDMX-AI-PRO-FINAL
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
