                  // ==================================================
                  // BRIGHTNESS
                  // ==================================================

                  root.addView(
                          text(
                                  "BRIGHTNESS"
                          )
                  );


                  SeekBar brightness =
                          new SeekBar(this);


                  brightness.setMax(
                          100
                  );


                  brightness.setProgress(
                          100
                  );


                  root.addView(
                          brightness
                  );


                  brightness.setOnSeekBarChangeListener(
                          new SeekBar.OnSeekBarChangeListener() {

                              public void onProgressChanged(
                                      SeekBar s,
                                      int p,
