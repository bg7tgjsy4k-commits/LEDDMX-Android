              private void startBleScan() {

                  if (!hasBluetoothPermission()) {

                      requestBluetoothPermissions();

                      return;
                  }

                  if (bluetoothAdapter == null) {

                      Toast.makeText(
                              this,
                              "Bluetooth tidak tersedia",
                              Toast.LENGTH_SHORT
                      ).show();

                      return;
                  }

                  if (!bluetoothAdapter.isEnabled()) {

                      Toast.makeText(
                              this,
                              "Aktifkan Bluetooth terlebih dahulu",
                              Toast.LENGTH_SHORT
                      ).show();

                      return;
                  }

                  stopBleScan();

                  scanner =
                          bluetoothAdapter
                                  .getBluetoothLeScanner();

                  if (scanner == null) {

                      Toast.makeText(
                              this,
                              "BLE scanner tidak tersedia",
                              Toast.LENGTH_SHORT
                      ).show();

                      return;
                  }

                  scanDevices.clear();
                  scanAddresses.clear();

                  if (scanDeviceListLayout != null) {
                      scanDeviceListLayout.removeAllViews();
                  }

                  scanning = true;

                  statusText.setText(
                          "Status: Scanning..."
                  );

                  activeScanCallback =
                          new ScanCallback() {

                              @Override
                              public void onScanResult(
                                      int callbackType,
                                      ScanResult result
                              ) {

                                  BluetoothDevice device =
                                          result.getDevice();

                                  String deviceName =
                                          "";

                                  try {

                                      if (device.getName()
                                              != null) {

                                          deviceName =
                                                  device.getName();
                                      }

                                  } catch (SecurityException ignored) {
                                  }

                                  try {

                                      if (result.getScanRecord()
                                              != null
                                              &&
                                              result.getScanRecord()
                                                      .getDeviceName()
                                                      != null) {

                                          String recordName =
                                                  result.getScanRecord()
                                                          .getDeviceName();

                                          if (deviceName.isEmpty()) {
                                              deviceName =
                                                      recordName;
                                          }
                                      }

                                  } catch (Exception ignored) {
                                  }

                                  String address =
                                          "";

                                  try {
                                      address =
                                              device.getAddress();
                                  } catch (SecurityException ignored) {
                                  }

                                  final String finalName =
                                          deviceName.isEmpty()
                                                  ? "BLE DEVICE"
                                                  : deviceName;

                                  final String finalAddress =
                                          address;

                                  boolean likely =
                                          finalName
                                                  .toUpperCase(
                                                          Locale.US
                                                  )
                                                  .contains("LEDDMX")
                                                  ||
                                          finalName
                                                  .toLowerCase(
                                                          Locale.US
                                                  )
                                                  .contains("b2cd");

                                  runOnUiThread(
                                          () -> {

                                              if (finalAddress
                                                      .isEmpty()) {
                                                  return;
                                              }

                                              if (!likely
                                                      && !scanAddresses
                                                      .isEmpty()) {
                                                  return;
                                              }

                                              if (scanAddresses
                                                      .contains(
                                                              finalAddress
                                                      )) {
                                                  return;
                                              }

                                              scanAddresses.add(
                                                      finalAddress
                                              );

                                              scanDevices.add(
                                                      new DeviceEntry(
                                                              device,
                                                              finalName,
                                                              finalAddress,
                                                              result.getRssi(),
                                                              likely
                                                      )
                                              );

                                              addScanDevice(
                                                      device,
                                                      finalName,
                                                      finalAddress,
                                                      result.getRssi(),
                                                      likely
                                              );
                                          }
                                  );
                              }

                              @Override
                              public void onScanFailed(
                                      int errorCode
                              ) {

                                  runOnUiThread(
                                          () -> {

                                              scanning = false;

                                              statusText.setText(
                                                      "Status: Scan failed "
                                                              + errorCode
                                              );
                                          }
                                  );
                              }
                          };

                  try {

                      scanner.startScan(
                              activeScanCallback
                      );

                  } catch (SecurityException e) {

                      Toast.makeText(
                              this,
                              "Permission Bluetooth ditolak",
                              Toast.LENGTH_SHORT
                      ).show();

                      return;
                  }

                  handler.postDelayed(
                          () -> {

                              if (scanning) {
                                  stopBleScan();
                                  statusText.setText(
                                          "Status: Scan selesai"
                                  );
                              }

                          },
                          10000
                  );
              }

              private void addScanDevice(
                      BluetoothDevice device,
                      String name,
                      String address,
                      int rssi,
                      boolean likely
              ) {

                  if (scanDeviceListLayout == null) {
                      return;
                  }

                  String text =
                          (likely ? "★ " : "")
                                  + name
                                  + "\n"
                                  + address
                                  + "\nRSSI: "
                                  + rssi
                                  + " dBm";

                  Button b =
                          createButton(
                                  text,
                                  likely
                                          ? Color.rgb(0, 130, 160)
                                          : Color.rgb(35, 40, 50)
                          );

                  b.setGravity(
                          Gravity.CENTER_VERTICAL
                  );

                  b.setOnClickListener(
                          v -> {

                              stopBleScan();

                              connectDevice(
                                      device
                              );
                          }
                  );

                  scanDeviceListLayout.addView(b);
              }

              private void stopBleScan() {

                  if (!scanning
                          && activeScanCallback == null) {
                      return;
                  }

                  scanning = false;

                  if (scanner != null
                          && activeScanCallback != null) {

                      try {

                          scanner.stopScan(
                                  activeScanCallback
                          );

                      } catch (SecurityException ignored) {
                      }
                  }

                  activeScanCallback = null;
              }

              private void connectDevice(
                      BluetoothDevice device
              ) {

                  if (!hasBluetoothPermission()) {

                      requestBluetoothPermissions();

                      return;
                  }

                  disconnectGatt();

                  statusText.setText(
                          "Status: Connecting..."
                  );

                  try {

                      bluetoothGatt =
                              device.connectGatt(
                                      this,
                                      false,
                                      new BluetoothGattCallback() {

                                          @Override
                                          public void onConnectionStateChange(
                                                  BluetoothGatt gatt,
                                                  int status,
                                                  int newState
                                          ) {

                                              if (newState
                                                      == BluetoothGatt.STATE_CONNECTED) {

                                                  bluetoothGatt =
                                                          gatt;

                                                  gattReady =
                                                          false;

                                                  runOnUiThread(
                                                          () -> statusText.setText(
                                                                  "Status: Connected - discovering FFE1..."
                                                          )
                                                  );

                                                  try {

                                                      gatt.discoverServices();

                                                  } catch (Exception ignored) {
                                                  }

                                              } else if (
                                                      newState
                                                              == BluetoothGatt.STATE_DISCONNECTED
                                              ) {

                                                  gattReady =
                                                          false;

                                                  targetChar =
                                                          null;

                                                  bluetoothGatt =
                                                          null;

                                                  runOnUiThread(
                                                          () -> statusText.setText(
                                                                  "Status: Disconnected"
                                                          )
                                                  );

                                                  try {
                                                      gatt.close();
                                                  } catch (Exception ignored) {
                                                  }
                                              }
                                          }

                                          @Override
                                          public void onServicesDiscovered(
                                                  BluetoothGatt gatt,
                                                  int status
                                          ) {

                                              BluetoothGattCharacteristic found =
                                                      null;

                                              if (status
                                                      == BluetoothGatt.GATT_SUCCESS) {

                                                  for (BluetoothGattService service :
                                                          gatt.getServices()) {

                                                      if (service.getUuid()
                                                              .equals(
                                                                      SERVICE_FFE0
                                                              )
                                                              ||
                                                              service.getUuid()
                                                                      .toString()
                                                                      .contains(
                                                                              "ffe0"
                                                                      )) {

                                                          for (
                                                                  BluetoothGattCharacteristic c :
                                                                  service.getCharacteristics()
                                                          ) {

                                                              if (c.getUuid()
                                                                      .equals(
                                                                              CHAR_FFE1
                                                                      )
                                                                      ||
                                                                      c.getUuid()
                                                                              .toString()
                                                                              .contains(
                                                                                      "ffe1"
                                                                              )) {

                                                                  found =
                                                                          c;

                                                                  break;
                                                              }
                                                          }
                                                      }

                                                      if (found != null) {
                                                          break;
                                                      }
                                                  }
                                              }

                                              final BluetoothGattCharacteristic resultChar =
                                                      found;

                                              runOnUiThread(
                                                      () -> {

                                                          if (resultChar != null) {

                                                              targetChar =
                                                                      resultChar;

                                                              gattReady =
                                                                      true;

                                                              int props =
                                                                      resultChar
                                                                              .getProperties();

                                                              String writeType =
                                                                      (
                                                                              props
                                                                                      &
                                                                                      BluetoothGattCharacteristic.PROPERTY_WRITE
                                                                      ) != 0
                                                                              ? "WRITE"
                                                                              :
                                                                              (
                                                                                      props
                                                                                              &
                                                                                              BluetoothGattCharacteristic.PROPERTY_WRITE_NO_RESPONSE
                                                                              ) != 0
                                                                                      ? "WRITE_NO_RESPONSE"
                                                                                      : "UNKNOWN";

                                                              statusText.setText(
                                                                      "Status: READY FFE1 ["
                                                                              + writeType
                                                                              + "]"
                                                              );

                                                              Toast.makeText(
                                                                      MainActivity.this,
                                                                      "FFE1 siap digunakan",
                                                                      Toast.LENGTH_SHORT
                                                              ).show();

                                                              showHomeDashboard();

                                                          } else {

                                                              gattReady =
                                                                      false;

                                                              statusText.setText(
                                                                      "Status: FFE1 tidak ditemukan"
                                                              );

                                                              Toast.makeText(
                                                                      MainActivity.this,
                                                                      "Service FFE0 / characteristic FFE1 tidak ditemukan",
                                                                      Toast.LENGTH_LONG
                                                              ).show();
                                                          }
                                                      }
                                              );
                                          }
                                      }
                              );

                  } catch (SecurityException e) {

                      Toast.makeText(
                              this,
                              "Bluetooth permission error",
                              Toast.LENGTH_SHORT
                      ).show();
                  }
              }

              private void disconnectGatt() {

                  stopAnimationLoop();

                  if (bluetoothGatt != null) {

                      try {
                          bluetoothGatt.disconnect();
                      } catch (Exception ignored) {
                      }

                      try {
                          bluetoothGatt.close();
                      } catch (Exception ignored) {
                      }
                  }

                  bluetoothGatt = null;
                  targetChar = null;
                  gattReady = false;
              }

              /*
               * ============================================================
               * PROVEN LEDDMX DIALECT-B FRAMES USED HERE
               * ============================================================
               *
               * POWER ON:
               * 7B FF 04 01 FF FF FF FF BF
               *
               * POWER OFF:
               * 7B FF 04 00 FF FF FF FF BF
               *
               * MODE:
               * 7B FF 03 MODE FF FF FF FF BF
               *
               * RGB:
               * 7B FF 07 R G B 00 FF BF
               *
               * BRIGHTNESS:
               * 7B FF 01 B32 B 01 FF FF BF
               *
               * SPEED:
               * 7B FF 02 SPEED 00 FF FF FF BF
               *
               * DIRECTION:
               * 7B FF 0D DIR FF FF FF FF BF
               *
               * IMPORTANT:
               * No unverified 0x08 left/right packet is used.
               * ============================================================
               */

              private void sendPower(
                      boolean on
              ) {

                  if (on) {

                      sendCommand(
                              new byte[]{
                                      0x7B,
                                      (byte) 0xFF,
                                      0x04,
                                      0x01,
                                      (byte) 0xFF,
                                      (byte) 0xFF,
                                      (byte) 0xFF,
                                      (byte) 0xFF,
                                      (byte) 0xBF
                              }
                      );

                  } else {

                      sendCommand(
                              new byte[]{
                                      0x7B,
                                      (byte) 0xFF,
                                      0x04,
                                      0x00,
                                      (byte) 0xFF,
                                      (byte) 0xFF,
                                      (byte) 0xFF,
                                      (byte) 0xFF,
                                      (byte) 0xBF
                              }
                      );
                  }
              }

              private void sendMode(
                      int mode
              ) {

                  mode =
                          Math.max(
                                  1,
                                  Math.min(
                                          210,
                                          mode
                                  )
                          );

                  sendCommand(
                          new byte[]{
                                  0x7B,
                                  (byte) 0xFF,
                                  0x03,
                                  (byte) mode,
                                  (byte) 0xFF,
                                  (byte) 0xFF,
                                  (byte) 0xFF,
                                  (byte) 0xFF,
                                  (byte) 0xBF
                          }
                  );
              }

              private void sendBrightness(
                      int value
              ) {

                  value =
                          Math.max(
                                  0,
                                  Math.min(
                                          100,
                                          value
                                  )
                          );

                  int scaled =
                          (value * 32) / 100;

                  sendCommand(
                          new byte[]{
                                  0x7B,
                                  (byte) 0xFF,
                                  0x01,
                                  (byte) scaled,
                                  (byte) value,
                                  0x01,
                                  (byte) 0xFF,
                                  (byte) 0xFF,
                                  (byte) 0xBF
                          }
                  );
              }

              private void sendSpeed(
                      int value
              ) {

                  value =
                          Math.max(
                                  0,
                                  Math.min(
                                          100,
                                          value
                                  )
                          );

                  sendCommand(
                          new byte[]{
                                  0x7B,
                                  (byte) 0xFF,
                                  0x02,
                                  (byte) value,
                                  0x00,
                                  (byte) 0xFF,
                                  (byte) 0xFF,
                                  (byte) 0xFF,
                                  (byte) 0xBF
                          }
                  );
              }

              private void sendDirection(
                      int value
              ) {

                  value =
                          value == 0
                                  ? 0
                                  : 1;

                  sendCommand(
                          new byte[]{
                                  0x7B,
                                  (byte) 0xFF,
                                  0x0D,
                                  (byte) value,
                                  (byte) 0xFF,
                                  (byte) 0xFF,
                                  (byte) 0xFF,
                                  (byte) 0xFF,
                                  (byte) 0xBF
                          }
                  );
              }

              private void sendRGB(
                      int left,
                      int right
              ) {

                  /*
                   * Exact independent LEFT/RIGHT hardware command
                   * has NOT been proven for this controller.
                   *
                   * Therefore the live hardware packet uses one
                   * standard 0x07 RGB frame.
                   *
                   * LEFT/RIGHT remain independent in the editor
                   * and preview.
                   */

                  int r =
                          (
                                  Color.red(left)
                                          + Color.red(right)
                          ) / 2;

                  int g =
                          (
                                  Color.green(left)
                                          + Color.green(right)
                          ) / 2;

                  int b =
                          (
                                  Color.blue(left)
                                          + Color.blue(right)
                          ) / 2;

                  sendRGBSingle(
                          r,
                          g,
                          b
                  );
              }

              private void sendRGBSingle(
                      int r,
                      int g,
                      int b
              ) {

                  r =
                          Math.max(
                                  0,
                                  Math.min(255, r)
                          );

                  g =
                          Math.max(
                                  0,
                                  Math.min(255, g)
                          );

                  b =
                          Math.max(
                                  0,
                                  Math.min(255, b)
                          );

                  sendCommand(
                          new byte[]{
                                  0x7B,
                                  (byte) 0xFF,
                                  0x07,
                                  (byte) r,
                                  (byte) g,
                                  (byte) b,
                                  0x00,
                                  (byte) 0xFF,
                                  (byte) 0xBF
                          }
                  );
              }

              private synchronized void sendCommand(
                      byte[] data
              ) {

                  if (bluetoothGatt == null
                          || targetChar == null
                          || !gattReady) {

                      Toast.makeText(
                              this,
                              "Belum terhubung ke FFE1",
                              Toast.LENGTH_SHORT
                      ).show();

                      return;
                  }

                  long now =
                          System.currentTimeMillis();

                  long delta =
                          now - lastWriteTime;

                  if (delta < 35) {

                      try {

                          Thread.sleep(
                                  35 - delta
                          );

                      } catch (InterruptedException ignored) {
                      }
                  }

                  try {

                      int props =
                              targetChar.getProperties();

                      if (
                              (
                                      props
                                              &
                                              BluetoothGattCharacteristic.PROPERTY_WRITE
                              ) != 0
                      ) {

                          targetChar.setWriteType(
                                  BluetoothGattCharacteristic
                                          .WRITE_TYPE_DEFAULT
                          );

                      } else if (
                              (
                                      props
                                              &
                                              BluetoothGattCharacteristic
                                                      .PROPERTY_WRITE_NO_RESPONSE
                              ) != 0
                      ) {

                          targetChar.setWriteType(
                                  BluetoothGattCharacteristic
                                          .WRITE_TYPE_NO_RESPONSE
                          );

                      } else {

                          Toast.makeText(
                                  this,
                                  "FFE1 tidak memiliki property WRITE",
                                  Toast.LENGTH_SHORT
                          ).show();

                          return;
                      }

                      targetChar.setValue(data);

                      boolean accepted =
                              bluetoothGatt
                                      .writeCharacteristic(
                                              targetChar
                                      );

                      if (!accepted) {

                          statusText.setText(
                                  "Status: BLE write rejected"
                          );
                      }

                      lastWriteTime =
                              System.currentTimeMillis();

                  } catch (SecurityException e) {

                      Toast.makeText(
                              this,
                              "Bluetooth permission error",
                              Toast.LENGTH_SHORT
                      ).show();

                  } catch (Exception e) {

                      statusText.setText(
                              "Status: BLE write error"
                      );
                  }
              }

              private void startAnimationLoop() {

                  if (timeline.isEmpty()) {
                      return;
                  }

                  stopAnimationLoop();

                  playing = true;

                  animationRunnable =
                          new Runnable() {

                              int index = 0;

                              @Override
                              public void run() {

                                  if (!playing
                                          || timeline.isEmpty()) {
                                      return;
                                  }

                                  AnimFrame frame =
                                          timeline.get(
                                                  index
                                                          % timeline.size()
                                          );

                                  if (previewView != null) {

                                      previewView.setFrame(
                                              frame.leftColor,
                                              frame.rightColor
                                      );
                                  }

                                  sendRGB(
                                          frame.leftColor,
                                          frame.rightColor
                                  );

                                  index++;

                                  handler.postDelayed(
                                          this,
                                          Math.max(
                                                  80,
                                                  frame.duration
                                          )
                                  );
                              }
                          };

                  handler.post(
                          animationRunnable
                  );
              }

              private void stopAnimationLoop() {

                  playing = false;

                  if (animationRunnable != null) {

                      handler.removeCallbacks(
                              animationRunnable
                      );

                      animationRunnable =
                              null;
                  }
              }

              private void saveSlot(
                      int slot
              ) {

                  StringBuilder data =
                          new StringBuilder();

                  for (AnimFrame frame :
                          timeline) {

                      data.append(
                              frame.leftColor
                      ).append(",")
                              .append(
                                      frame.rightColor
                              ).append(",")
                              .append(
                                      frame.duration
                              ).append(";");

                  }

                  prefs.edit()
                          .putString(
                                  "slot_" + slot,
                                  data.toString()
                          )
                          .apply();
              }

              private void loadSlot(
                      int slot
              ) {

                  String data =
                          prefs.getString(
                                  "slot_" + slot,
                                  ""
                          );

                  if (data.isEmpty()) {
                      return;
                  }

                  ArrayList<AnimFrame> loaded =
                          new ArrayList<>();

                  String[] rows =
                          data.split(";");

                  for (String row : rows) {

                      try {

                          String[] p =
                                  row.split(",");

                          if (p.length >= 3) {

                              loaded.add(
                                      new AnimFrame(
                                              Integer.parseInt(
                                                      p[0]
                                              ),
                                              Integer.parseInt(
                                                      p[1]
                                              ),
                                              Integer.parseInt(
                                                      p[2]
                                              )
                                      )
                              );
                          }

                      } catch (Exception ignored) {
                      }
                  }

                  if (!loaded.isEmpty()) {

                      timeline.clear();
                      timeline.addAll(loaded);
                  }
              }

              @Override
              protected void onDestroy() {

                  stopBleScan();
                  stopAnimationLoop();
                  disconnectGatt();

                  super.onDestroy();
              }

              private static class AnimFrame {

                  int leftColor;
                  int rightColor;
                  int duration;

                  AnimFrame(
                          int left,
                          int right,
                          int duration
                  ) {

                      this.leftColor = left;
                      this.rightColor = right;
                      this.duration = duration;
                  }
              }

