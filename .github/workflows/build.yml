    private void showEffects() {

        stopPreview();

        buildBase(
                "210 EFFECTS",
                true
        );

        EditText search =
                new EditText(this);

        search.setHint(
                "Cari effect..."
        );

        search.setTextColor(WHITE);
        search.setHintTextColor(GRAY);

        content.addView(search);

        LinearLayout list =
                new LinearLayout(this);

        list.setOrientation(
                LinearLayout.VERTICAL
        );

        content.addView(list);

        Runnable refresh =
                () -> {

                    list.removeAllViews();

                    String q =
                            search.getText()
                                    .toString()
                                    .toLowerCase(
                                            Locale.US
                                    );

                    int max =
                            Math.min(
                                    210,
                                    Patterns.NAMES.length - 1
                            );

                    for (int i = 1; i <= max; i++) {

                        String name =
                                Patterns.NAMES[i];

                        if (!q.isEmpty() &&
                                !name.toLowerCase(
                                        Locale.US)
                                        .contains(q)) {

                            continue;
                        }

                        final int mode = i;

                        Button item =
                                button(
                                        String.format(
                                                Locale.US,
                                                "%03d  %s",
                                                mode,
                                                name
                                        )
                                );

                        item.setOnClickListener(
                                v -> {

                                    currentMode = mode;
                                    sendMode(mode);

                                    toast(
                                            "MODE " +
                                                    mode +
                                                    " • " +
                                                    name
                                    );
                                }
                        );

                        list.addView(item);
                    }
                };

        search.addTextChangedListener(
                new android.text.TextWatcher() {

                    public void beforeTextChanged(
                            CharSequence s,
                            int start,
                            int count,
                            int after) {
                    }

                    public void onTextChanged(
                            CharSequence s,
                            int start,
                            int before,
                            int count) {

                        refresh.run();
                    }

                    public void afterTextChanged(
                            android.text.Editable e) {
                    }
                }
        );

        refresh.run();
    }

