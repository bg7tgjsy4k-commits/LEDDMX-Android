    /*
     * Circular HSV color wheel.
     * Small white selector follows the touch point.
     */
    private class ColorWheelView
            extends View {

        private final Paint paint =
                new Paint(Paint.ANTI_ALIAS_FLAG);

        private float cx;
        private float cy;
        private float radius;

        ColorWheelView(Context c) {
            super(c);
            setLayerType(
                    View.LAYER_TYPE_SOFTWARE,
                    null);
        }

        @Override
        protected void onDraw(Canvas c) {
            super.onDraw(c);

            cx = getWidth() / 2f;
            cy = getHeight() / 2f;
            radius =
                    Math.min(
                            getWidth(),
                            getHeight()) *
                    0.38f;

            int steps = 360;

            for (int i = 0;
                 i < steps;
                 i++) {

                float a1 =
                        (float)
                        Math.toRadians(i);

                float a2 =
                        (float)
                        Math.toRadians(i + 2);

                float x1 =
                        cx +
                        radius *
                        (float)Math.cos(a1);

                float y1 =
                        cy +
                        radius *
                        (float)Math.sin(a1);

                float x2 =
                        cx +
                        radius *
                        (float)Math.cos(a2);

                float y2 =
                        cy +
                        radius *
                        (float)Math.sin(a2);

                paint.setStyle(
                        Paint.Style.STROKE);

                paint.setStrokeWidth(
                        dp(18));

                paint.setColor(
                        Color.HSVToColor(
                                new float[] {
                                        i,
                                        1f,
                                        1f
                                }));

                c.drawLine(
                        x1,
                        y1,
                        x2,
                        y2,
                        paint);
            }

            paint.setStyle(
                    Paint.Style.FILL);

            paint.setColor(Color.DKGRAY);

            c.drawCircle(
                    cx,
                    cy,
                    radius * .45f,
                    paint);

            paint.setColor(
                    Color.rgb(
                            red,
                            green,
                            blue));

            c.drawCircle(
                    cx,
                    cy,
                    radius * .40f,
                    paint);

            paint.setStyle(
                    Paint.Style.STROKE);

            paint.setStrokeWidth(dp(4));
            paint.setColor(Color.WHITE);

            float[] hsv = new float[3];

            Color.RGBToHSV(
                    red,
                    green,
                    blue,
                    hsv);

            double a =
                    Math.toRadians(
                            hsv[0]);

            float sx =
                    cx +
                    radius *
                    (float)Math.cos(a);

            float sy =
                    cy +
                    radius *
                    (float)Math.sin(a);

            c.drawCircle(
                    sx,
                    sy,
                    dp(9),
                    paint);
        }

        @Override
        public boolean onTouchEvent(
                MotionEvent e) {

            if (e.getAction() !=
                    MotionEvent.ACTION_DOWN &&
                e.getAction() !=
                    MotionEvent.ACTION_MOVE &&
                e.getAction() !=
                    MotionEvent.ACTION_UP) {
                return true;
            }

            float dx =
                    e.getX() - cx;

            float dy =
                    e.getY() - cy;

            float distance =
                    (float)Math.sqrt(
                            dx * dx +
                            dy * dy);

            if (distance <=
                    radius * 1.25f) {

                float hue =
                        (float)
                        Math.toDegrees(
                                Math.atan2(
                                        dy,
                                        dx));

                if (hue < 0)
                    hue += 360;

                int color =
                        Color.HSVToColor(
                                new float[] {
                                        hue,
                                        1f,
                                        1f
                                });

                red = Color.red(color);
                green = Color.green(color);
                blue = Color.blue(color);

                invalidate();
            }

            return true;
        }
    }

    /*
     * Live LED strip preview.
     * This is visual only and does not pretend to be
     * hardware routing data.
     */
    private class StripView
            extends View {

        private final Paint p =
                new Paint(Paint.ANTI_ALIAS_FLAG);

        private String template =
                "RAINBOW";

        private long started =
                System.currentTimeMillis();

        StripView(Context c) {
            super(c);

            main.post(new Runnable() {
                @Override
                public void run() {
                    invalidate();
                    main.postDelayed(
                            this,
                            45);
                }
            });
        }

        void setTemplate(String s) {
            template = s;
            started =
                    System.currentTimeMillis();
            invalidate();
        }

        @Override
        protected void onDraw(Canvas c) {
            super.onDraw(c);

            int count = 42;

            float w =
                    getWidth() /
                    (float)count;

            long elapsed =
                    System.currentTimeMillis()
                    - started;

            float phase =
                    (elapsed / 100f);

            for (int i = 0;
                 i < count;
                 i++) {

                float x =
                        i * w +
                        w * .5f;

                int color;

                if (template.equals(
                        "RAINBOW")) {

                    float hue =
                            (i * 360f /
                            count +
                            phase * 2) %
                            360;

                    color =
                            Color.HSVToColor(
                                    new float[] {
                                            hue,
                                            1,
                                            .95f
                                    });

                } else if (
                        template.equals(
                                "POLICE")) {

                    int side =
                            (int)
                            ((i +
                            (int)phase / 4)
                            % 2);

                    color =
                            side == 0
                                    ? Color.RED
                                    : Color.BLUE;

                } else if (
                        template.equals(
                                "STRIPE / BELANG")) {

                    int q =
                            (int)
                            ((i +
                            (int)phase / 3)
                            % 6);

                    color =
                            q < 3
                                    ? Color.rgb(
                                            red,
                                            green,
                                            blue)
                                    : Color.BLACK;

                } else if (
                        template.equals(
                                "SCANNER")) {

                    int pos =
                            (int)
                            (phase % count);

                    int d =
                            Math.abs(i - pos);

                    int v =
                            Math.max(
                                    0,
                                    255 -
                                    d * 70);

                    color =
                            Color.rgb(
                                    v,
                                    0,
                                    v);

                } else if (
                        template.equals(
                                "PULSE")) {

                    double pulse =
                            (Math.sin(
                                    phase / 4.0)
                                    + 1) /
                                    2.0;

                    int v =
                            (int)
                            (40 +
                            pulse * 215);

                    color =
                            Color.rgb(
                                    red * v / 255,
                                    green * v / 255,
                                    blue * v / 255);

                } else {

                    float hue =
                            (i * 13 +
                            phase * 3) % 360;

                    color =
                            Color.HSVToColor(
                                    new float[] {
                                            hue,
                                            .9f,
                                            .9f
                                    });
                }

                p.setStyle(
                        Paint.Style.FILL);

                p.setColor(color);

                RectF r =
                        new RectF(
                                i * w + 2,
                                getHeight() / 2f -
                                        dp(13),
                                (i + 1) * w - 2,
                                getHeight() / 2f +
                                        dp(13));

                c.drawRoundRect(
                        r,
                        dp(7),
                        dp(7),
                        p);
            }

            p.setColor(Color.WHITE);
            p.setTextSize(dp(12));
            p.setTextAlign(
                    Paint.Align.CENTER);

            c.drawText(
                    template,
                    getWidth() / 2f,
                    dp(25),
                    p);
        }
    }
}
EOF

      - name: Verify generated project
        shell: bash
        run: |
          set -e
          cd LEDDMX-Android

          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/leddmx/pro/MainActivity.java
          test -f app/src/main/java/com/leddmx/pro/Patterns.java

          echo "===== JAVA ====="
          java -version

          echo "===== GRADLE ====="
          gradle --version

          echo "===== PROJECT ====="
          find . -maxdepth 5 -type f | sort | head -200

      - name: Build APK
        shell: bash
        run: |
          set -e
          cd LEDDMX-Android

          gradle \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            clean \
            assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -e
          cd LEDDMX-Android

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK NOT FOUND"
            find app/build -type f -maxdepth 8 -print || true
            exit 1
          fi

          echo "APK READY:"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LEDDMX-Pro-FINAL
          path: LEDDMX-Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
