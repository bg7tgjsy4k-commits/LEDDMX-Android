name: Build LEDDMX Final Wrapper Fix v34

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build APK v34 with Wrapper
        shell: bash
        run: |
          set -e
          rm -rf app build.gradle settings.gradle gradle.properties local.properties gradlew gradlew.bat gradle

          mkdir -p app/src/main/java/com/leddmx/pro
          mkdir -p app/src/main/res/values

          echo "sdk.dir=$ANDROID_HOME" > local.properties

          cat > settings.gradle << 'EOF'
          rootProject.name = "LEDDMX-Pro"
          include ':app'
          EOF

          cat > build.gradle << 'EOF'
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:7.4.2'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          cat > gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

          cat > app/build.gradle << 'EOF'
          apply plugin: 'com.android.application'

          android {
              compileSdkVersion 33
              defaultConfig {
                  applicationId "com.leddmx.pro"
                  minSdkVersion 21
                  targetSdkVersion 33
                  versionCode 1
                  versionName "34.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOF

          cat > app/src/main/res/values/strings.xml << 'EOF'
          <resources>
              <string name="app_name">LEDDMX Pro Controller</string>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.leddmx.pro">
              <uses-permission android:name="android.permission.BLUETOOTH" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" />
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
              <uses-permission android:name="android.permission.BLUETOOTH_SCAN" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-feature android:name="android.hardware.bluetooth_le" android:required="false" />
              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:theme="@android:style/Theme.Material.NoActionBar"
                  android:supportsRtl="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/leddmx/pro/MainActivity.java << 'EOF'
          package com.leddmx.pro;

          import android.Manifest;
          import android.app.Activity;
          import android.bluetooth.BluetoothAdapter;
          import android.bluetooth.BluetoothDevice;
          import android.bluetooth.BluetoothGatt;
          import android.bluetooth.BluetoothGattCallback;
          import android.bluetooth.BluetoothGattCharacteristic;
          import android.bluetooth.BluetoothGattService;
          import android.bluetooth.BluetoothManager;
          import android.bluetooth.le.BluetoothLeScanner;
          import android.bluetooth.le.ScanCallback;
          import android.bluetooth.le.ScanResult;
          import android.content.Context;
          import android.content.SharedPreferences;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.os.Handler;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.SeekBar;
          import android.widget.Spinner;
          import android.widget.TextView;
          import android.widget.Toast;
          import java.util.ArrayList;
          import java.util.UUID;

          public class MainActivity extends Activity {
              private static final UUID SERVICE_FFE0 = UUID.fromString("0000ffe0-0000-1000-8000-00805f9b34fb");
              private static final UUID CHAR_FFE1 = UUID.fromString("0000ffe1-0000-1000-8000-00805f9b34fb");

              private BluetoothAdapter bluetoothAdapter;
              private BluetoothGatt bluetoothGatt;
              private BluetoothGattCharacteristic targetChar;

              private TextView statusText;
              private LinearLayout contentLayout;
              private SharedPreferences sharedPrefs;
              private final Handler handler = new Handler();

              private int currentMode = 1;
              private int brightness = 100;
              private int speed = 50;
              private int pixelCount = 60;
              private int direction = 0;
              private String rgbOrder = "RGB";
              private int selectedSlot = 171;
              private boolean isPlaying = false;
              private final ArrayList<AnimFrame> timelineFrames = new ArrayList<>();
              private LinearLayout scanDeviceListLayout;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  sharedPrefs = getSharedPreferences("LEDDMX_EXACT_SLOTS", MODE_PRIVATE);

                  BluetoothManager bm = (BluetoothManager) getSystemService(Context.BLUETOOTH_SERVICE);
                  if (bm != null) bluetoothAdapter = bm.getAdapter();

                  if (timelineFrames.isEmpty()) {
                      timelineFrames.add(new AnimFrame(Color.RED, Color.BLUE, 150));
                      timelineFrames.add(new AnimFrame(Color.BLUE, Color.RED, 150));
                  }

                  buildUI();
                  showHomeDashboard();

                  if (checkSelfPermission(Manifest.permission.BLUETOOTH_SCAN) != android.content.pm.PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(new String[]{
                          Manifest.permission.BLUETOOTH_SCAN,
                          Manifest.permission.BLUETOOTH_CONNECT,
                          Manifest.permission.ACCESS_FINE_LOCATION
                      }, 100);
                  }
              }

              private void buildUI() {
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setBackgroundColor(Color.parseColor("#121418"));

                  LinearLayout topBar = new LinearLayout(this);
                  topBar.setGravity(Gravity.CENTER_VERTICAL);
                  topBar.setPadding(20, 20, 20, 20);

                  TextView title = new TextView(this);
                  title.setText("LEDDMX-00-b2cd Pro");
                  title.setTextColor(Color.parseColor("#00E5FF"));
                  title.setTextSize(15);
                  topBar.addView(title, new LinearLayout.LayoutParams(0, -2, 1));

                  Button scanBtn = new Button(this);
                  scanBtn.setText("SCAN BLE");
                  scanBtn.setTextColor(Color.WHITE);
                  scanBtn.setBackgroundColor(Color.parseColor("#1F2430"));
                  scanBtn.setOnClickListener(v -> showScanScreen());
                  topBar.addView(scanBtn);
                  root.addView(topBar);

                  statusText = new TextView(this);
                  statusText.setText("Status: Disconnected");
                  statusText.setTextColor(Color.YELLOW);
                  statusText.setPadding(20, 0, 20, 10);
                  root.addView(statusText);

                  ScrollView scroll = new ScrollView(this);
                  contentLayout = new LinearLayout(this);
                  contentLayout.setOrientation(LinearLayout.VERTICAL);
                  contentLayout.setPadding(20, 10, 20, 10);
                  scroll.addView(contentLayout, new LinearLayout.LayoutParams(-1, -2));
                  root.addView(scroll, new LinearLayout.LayoutParams(-1, 0, 1));

                  LinearLayout nav = new LinearLayout(this);
                  nav.setPadding(10, 10, 10, 10);
                  nav.setBackgroundColor(Color.parseColor("#1A1D24"));
                  String[] tabs = {"HOME", "MODES", "EDITOR", "TEMPLATES", "RAW HEX"};
                  for (String tab : tabs) {
                      Button b = new Button(this);
                      b.setText(tab);
                      b.setTextSize(10);
                      b.setTextColor(Color.WHITE);
                      b.setBackgroundColor(Color.parseColor("#252A34"));
                      b.setOnClickListener(v -> {
                          if (tab.equals("HOME")) showHomeDashboard();
                          else if (tab.equals("MODES")) showModeScreen();
                          else if (tab.equals("EDITOR")) showEditorScreen();
                          else if (tab.equals("TEMPLATES")) showTemplatesScreen();
                          else if (tab.equals("RAW HEX")) showRawHexScreen();
                      });
                      nav.addView(b, new LinearLayout.LayoutParams(0, 70, 1));
                  }
                  root.addView(nav);

                  setContentView(root);
              }

              private void clearContent() {
                  stopAnimationLoop();
                  contentLayout.removeAllViews();
              }

              private void showHomeDashboard() {
                  clearContent();
                  contentLayout.addView(createHeader("DASHBOARD HARDWARE (FFE1)"));

                  LinearLayout pwrRow = new LinearLayout(this);
                  Button onBtn = createButton("POWER ON", Color.parseColor("#00C853"));
                  onBtn.setOnClickListener(v -> sendCommand(new byte[]{0x7B, (byte)0xFF, 0x04, 0x01, (byte)0xBF}));
                  Button offBtn = createButton("POWER OFF", Color.parseColor("#D50000"));
                  offBtn.setOnClickListener(v -> sendCommand(new byte[]{0x7B, (byte)0xFF, 0x04, 0x00, (byte)0xBF}));
                  pwrRow.addView(onBtn, new LinearLayout.LayoutParams(0, -2, 1));
                  pwrRow.addView(offBtn, new LinearLayout.LayoutParams(0, -2, 1));
                  contentLayout.addView(pwrRow);

                  contentLayout.addView(createLabel("Brightness: " + brightness + "%"));
                  SeekBar brightSeek = new SeekBar(this);
                  brightSeek.setMax(100);
                  brightSeek.setProgress(brightness);
                  brightSeek.setOnSeekBarChangeListener(new SeekBar.OnSeekBarChangeListener() {
                      public void onProgressChanged(SeekBar s, int p, boolean u) { brightness = p; }
                      public void onStartTrackingTouch(SeekBar s) {}
                      public void onStopTrackingTouch(SeekBar s) {
                          sendCommand(new byte[]{0x7B, (byte)0xFF, 0x02, (byte)brightness, (byte)0xBF});
                      }
                  });
                  contentLayout.addView(brightSeek);

                  contentLayout.addView(createLabel("Speed: " + speed));
                  SeekBar speedSeek = new SeekBar(this);
                  speedSeek.setMax(100);
                  speedSeek.setProgress(speed);
                  speedSeek.setOnSeekBarChangeListener(new SeekBar.OnSeekBarChangeListener() {
                      public void onProgressChanged(SeekBar s, int p, boolean u) { speed = p; }
                      public void onStartTrackingTouch(SeekBar s) {}
                      public void onStopTrackingTouch(SeekBar s) {
                          sendCommand(new byte[]{0x7B, (byte)0xFF, 0x04, (byte)speed, (byte)0xBF});
                      }
                  });
                  contentLayout.addView(speedSeek);

                  Button dirBtn = createButton("Direction: " + (direction == 0 ? "Forward" : "Reverse"), Color.parseColor("#1F2430"));
                  dirBtn.setOnClickListener(v -> {
                      direction = (direction == 0) ? 1 : 0;
                      sendCommand(new byte[]{0x7B, (byte)0xFF, (byte)0x0D, (byte)direction, (byte)0xBF});
                      Toast.makeText(MainActivity.this, "Direction diubah", Toast.LENGTH_SHORT).show();
                      showHomeDashboard();
                  });
                  contentLayout.addView(dirBtn);

                  contentLayout.addView(createLabel("Pixel Count:"));
                  EditText pixelInput = createEditText(String.valueOf(pixelCount));
                  contentLayout.addView(pixelInput);

                  Button applyPixel = createButton("Kirim Config Pixel (0x05)", Color.parseColor("#00838F"));
                  applyPixel.setOnClickListener(v -> {
                      try { pixelCount = Integer.parseInt(pixelInput.getText().toString()); } catch(Exception ignored){}
                      sendCommand(new byte[]{0x7B, (byte)0xFF, 0x05, (byte)(pixelCount >> 8), (byte)(pixelCount & 0xFF), (byte)0xBF});
                      Toast.makeText(MainActivity.this, "Pixel Count " + pixelCount + " Terkirim!", Toast.LENGTH_SHORT).show();
                  });
                  contentLayout.addView(applyPixel);

                  contentLayout.addView(createLabel("RGB Order (0x07):"));
                  LinearLayout rgbRow = new LinearLayout(this);
                  String[] orders = {"RGB", "RBG", "GRB", "GBR", "BRG", "BGR"};
                  for (int i = 0; i < orders.length; i++) {
                      final int ordVal = i;
                      final String ordName = orders[i];
                      Button b = createButton(ordName, ordName.equals(rgbOrder) ? Color.parseColor("#00E5FF") : Color.parseColor("#1F2430"));
                      b.setOnClickListener(v -> {
                          rgbOrder = ordName;
                          sendCommand(new byte[]{0x7B, (byte)0xFF, 0x07, (byte)ordVal, (byte)0xBF});
                          Toast.makeText(MainActivity.this, "RGB Order: " + ordName, Toast.LENGTH_SHORT).show();
                          showHomeDashboard();
                      });
                      rgbRow.addView(b, new LinearLayout.LayoutParams(0, 60, 1));
                  }
                  contentLayout.addView(rgbRow);
              }

              private void showModeScreen() {
                  clearContent();
                  contentLayout.addView(createHeader("PILIH MODE (1 - 210)"));

                  EditText searchBox = createEditText("");
                  searchBox.setHint("Cari Mode...");
                  contentLayout.addView(searchBox);

                  LinearLayout grid = new LinearLayout(this);
                  grid.setOrientation(LinearLayout.VERTICAL);
                  contentLayout.addView(grid);

                  populateModes(grid, "");
                  searchBox.addTextChangedListener(new android.text.TextWatcher() {
                      public void beforeTextChanged(CharSequence s, int start, int count, int after) {}
                      public void onTextChanged(CharSequence s, int start, int before, int count) {
                          populateModes(grid, s.toString().trim());
                      }
                      public void afterTextChanged(android.text.Editable s) {}
                  });
              }

              private void populateModes(LinearLayout container, String query) {
                  container.removeAllViews();
                  LinearLayout row = null;
                  for (int i = 1; i <= 210; i++) {
                      final int m = i;
                      String title = String.format("Mode %03d", m);
                      if (!query.isEmpty() && !title.contains(query)) continue;

                      if (row == null || row.getChildCount() == 3) {
                          row = new LinearLayout(this);
                          row.setOrientation(LinearLayout.HORIZONTAL);
                          container.addView(row);
                      }

                      Button b = createButton(String.valueOf(m), m == currentMode ? Color.parseColor("#00E5FF") : Color.parseColor("#1F2430"));
                      b.setOnClickListener(v -> {
                          currentMode = m;
                          sendCommand(new byte[]{0x7B, (byte)0xFF, 0x03, (byte)m, (byte)0xBF});
                          Toast.makeText(MainActivity.this, "Mode " + m + " Dikirim", Toast.LENGTH_SHORT).show();
                          showModeScreen();
                      });
                      row.addView(b, new LinearLayout.LayoutParams(0, 80, 1));
                  }
              }

              private void showEditorScreen() {
                  clearContent();
                  contentLayout.addView(createHeader("CUSTOM ANIMATION & SLOT 171-210"));

                  contentLayout.addView(createLabel("Pilih Slot Lokal HP (171 - 210):"));
                  Spinner slotSpinner = new Spinner(this);
                  String[] slots = new String[40];
                  for (int i = 0; i < 40; i++) slots[i] = "Slot Custom " + (171 + i);
                  android.widget.ArrayAdapter<String> adapter = new android.widget.ArrayAdapter<>(this, android.R.layout.simple_spinner_dropdown_item, slots);
                  slotSpinner.setAdapter(adapter);
                  slotSpinner.setSelection(selectedSlot - 171);
                  slotSpinner.setOnItemSelectedListener(new android.widget.AdapterView.OnItemSelectedListener() {
                      public void onItemSelected(android.widget.AdapterView<?> p, View v, int pos, long id) {
                          selectedSlot = 171 + pos;
                          loadSlotFromLocal(selectedSlot);
                      }
                      public void onNothingSelected(android.widget.AdapterView<?> p) {}
                  });
                  contentLayout.addView(slotSpinner);

                  Button addFrame = createButton("+ TAMBAH FRAME TIMELINE", Color.parseColor("#1F2430"));
                  addFrame.setOnClickListener(v -> {
                      timelineFrames.add(new AnimFrame(Color.RED, Color.BLUE, 150));
                      showEditorScreen();
                  });
                  contentLayout.addView(addFrame);

                  for (int i = 0; i < timelineFrames.size(); i++) {
                      final int idx = i;
                      AnimFrame fr = timelineFrames.get(i);

                      LinearLayout card = new LinearLayout(this);
                      card.setOrientation(LinearLayout.VERTICAL);
                      card.setPadding(15, 15, 15, 15);
                      card.setBackgroundColor(Color.parseColor("#1A1D24"));

                      card.addView(createLabel("Frame " + (idx + 1)));

                      LinearLayout lrRow = new LinearLayout(this);
                      lrRow.setOrientation(LinearLayout.HORIZONTAL);

                      Button leftBox = createButton("LEFT", fr.leftColor);
                      leftBox.setOnClickListener(v -> {
                          fr.leftColor = (fr.leftColor == Color.RED) ? Color.BLUE : (fr.leftColor == Color.BLUE) ? Color.GREEN : Color.RED;
                          showEditorScreen();
                      });

                      Button rightBox = createButton("RIGHT", fr.rightColor);
                      rightBox.setOnClickListener(v -> {
                          fr.rightColor = (fr.rightColor == Color.BLUE) ? Color.RED : (fr.rightColor == Color.RED) ? Color.YELLOW : Color.BLUE;
                          showEditorScreen();
                      });

                      lrRow.addView(leftBox, new LinearLayout.LayoutParams(0, 80, 1));
                      lrRow.addView(rightBox, new LinearLayout.LayoutParams(0, 80, 1));
                      card.addView(lrRow);

                      Button delBtn = createButton("Hapus", Color.parseColor("#D50000"));
                      delBtn.setOnClickListener(v -> {
                          timelineFrames.remove(idx);
                          showEditorScreen();
                      });
                      card.addView(delBtn);

                      contentLayout.addView(card);
                  }

                  Button saveLocalBtn = createButton("💾 Simpan ke Slot Lokal HP", Color.parseColor("#00838F"));
                  saveLocalBtn.setOnClickListener(v -> {
                      saveSlotToLocal(selectedSlot);
                      Toast.makeText(MainActivity.this, "Tersimpan di Slot " + selectedSlot, Toast.LENGTH_SHORT).show();
                  });
                  contentLayout.addView(saveLocalBtn);

                  Button applyLiveBtn = createButton("⚡ Play / Apply Directly to LED", Color.parseColor("#00C853"));
                  applyLiveBtn.setOnClickListener(v -> startAnimationLoop());
                  contentLayout.addView(applyLiveBtn);

                  Button stopLiveBtn = createButton("⏹ Pause / Stop", Color.parseColor("#D50000"));
                  stopLiveBtn.setOnClickListener(v -> stopAnimationLoop());
                  contentLayout.addView(stopLiveBtn);
              }

              private void showTemplatesScreen() {
                  clearContent();
                  contentLayout.addView(createHeader("TEMPLATE EFEK"));
                  String[] templates = {"Rainbow", "Rainbow Flow", "Wave", "Comet", "Scanner", "Mirror", "Pulse", "Color Cycle", "Belang", "Chase", "Strobe", "Fade", "Police", "Fire", "Water", "Random"};
                  for (String tpl : templates) {
                      Button b = createButton("Template: " + tpl, Color.parseColor("#1F2430"));
                      b.setOnClickListener(v -> {
                          loadTemplate(tpl);
                          Toast.makeText(MainActivity.this, "Dimuat ke Editor!", Toast.LENGTH_SHORT).show();
                          showEditorScreen();
                      });
                      contentLayout.addView(b);
                  }
              }

              private void loadTemplate(String name) {
                  timelineFrames.clear();
                  if (name.equals("Belang") || name.equals("Chase")) {
                      timelineFrames.add(new AnimFrame(Color.RED, Color.BLUE, 120));
                      timelineFrames.add(new AnimFrame(Color.BLUE, Color.RED, 120));
                  } else {
                      timelineFrames.add(new AnimFrame(Color.RED, Color.GREEN, 150));
                      timelineFrames.add(new AnimFrame(Color.GREEN, Color.BLUE, 150));
                  }
              }

              private void showRawHexScreen() {
                  clearContent();
                  contentLayout.addView(createHeader("RAW HEX & OFFLINE AI"));

                  EditText hexInput = createEditText("7B FF 04 01 BF");
                  contentLayout.addView(hexInput);

                  Button sendHex = createButton("Kirim Raw HEX", Color.parseColor("#00838F"));
                  sendHex.setOnClickListener(v -> {
                      try {
                          String[] parts = hexInput.getText().toString().trim().split("\\s+");
                          byte[] data = new byte[parts.length];
                          for (int i = 0; i < parts.length; i++) data[i] = (byte) Integer.parseInt(parts[i], 16);
                          sendCommand(data);
                          Toast.makeText(MainActivity.this, "HEX Terkirim!", Toast.LENGTH_SHORT).show();
                      } catch(Exception e) {
                          Toast.makeText(MainActivity.this, "Format Salah!", Toast.LENGTH_SHORT).show();
                      }
                  });
                  contentLayout.addView(sendHex);
              }

              private void showScanScreen() {
                  clearContent();
                  contentLayout.addView(createHeader("SCAN BLE: LEDDMX-00-b2cd"));

                  scanDeviceListLayout = new LinearLayout(this);
                  scanDeviceListLayout.setOrientation(LinearLayout.VERTICAL);
                  contentLayout.addView(scanDeviceListLayout);

                  Button scanBtn = createButton("MULAI SCAN", Color.parseColor("#1F2430"));
                  scanBtn.setOnClickListener(v -> startBleScan());
                  contentLayout.addView(scanBtn);

                  Button back = createButton("KEMBALI", Color.parseColor("#D50000"));
                  back.setOnClickListener(v -> showHomeDashboard());
                  contentLayout.addView(back);

                  startBleScan();
              }

              private void startBleScan() {
                  if (bluetoothAdapter == null) return;
                  BluetoothLeScanner bleScanner = bluetoothAdapter.getBluetoothLeScanner();
                  if (bleScanner == null) return;
                  if (scanDeviceListLayout != null) scanDeviceListLayout.removeAllViews();

                  statusText.setText("Status: Scanning...");
                  try {
                      bleScanner.startScan(new ScanCallback() {
                          public void onScanResult(int callbackType, ScanResult result) {
                              BluetoothDevice dev = result.getDevice();
                              String name = "";
                              try { if (dev.getName() != null) name = dev.getName(); } catch(SecurityException ignored){}

                              if (name.contains("LEDDMX") || name.contains("b2cd")) {
                                  runOnUiThread(() -> {
                                      Button devBtn = createButton(name + "\n[" + dev.getAddress() + "]", Color.parseColor("#00838F"));
                                      devBtn.setOnClickListener(v -> {
                                          bleScanner.stopScan(this);
                                          connectDevice(dev);
                                      });
                                      if (scanDeviceListLayout != null) scanDeviceListLayout.addView(devBtn);
                                  });
                              }
                          }
                      });
                  } catch (Exception ignored) {}
              }

              private void connectDevice(BluetoothDevice device) {
                  statusText.setText("Status: Connecting...");
                  try {
                      bluetoothGatt = device.connectGatt(MainActivity.this, false, new BluetoothGattCallback() {
                          public void onConnectionStateChange(BluetoothGatt gatt, int status, int newState) {
                              if (newState == BluetoothGatt.STATE_CONNECTED) {
                                  bluetoothGatt = gatt;
                                  gatt.discoverServices();
                                  runOnUiThread(() -> {
                                      statusText.setText("Status: Connected");
                                      Toast.makeText(MainActivity.this, "Terhubung!", Toast.LENGTH_SHORT).show();
                                      showHomeDashboard();
                                  });
                              } else if (newState == BluetoothGatt.STATE_DISCONNECTED) {
                                  bluetoothGatt = null;
                                  targetChar = null;
                                  runOnUiThread(() -> statusText.setText("Status: Disconnected"));
                              }
                          }

                          public void onServicesDiscovered(BluetoothGatt gatt, int status) {
                              if (status == BluetoothGatt.GATT_SUCCESS) {
                                  for (BluetoothGattService s : gatt.getServices()) {
                                      if (s.getUuid().equals(SERVICE_FFE0) || s.getUuid().toString().contains("ffe0")) {
                                          for (BluetoothGattCharacteristic c : s.getCharacteristics()) {
                                              if (c.getUuid().equals(CHAR_FFE1) || c.getUuid().toString().contains("ffe1")) {
                                                  targetChar = c;
                                                  break;
                                              }
                                          }
                                      }
                                  }
                              }
                          }
                      });
                  } catch (SecurityException ignored) {}
              }

              private void sendCommand(byte[] data) {
                  if (bluetoothGatt == null || targetChar == null) {
                      Toast.makeText(MainActivity.this, "Belum terhubung ke FFE1!", Toast.LENGTH_SHORT).show();
                      return;
                  }
                  try {
                      targetChar.setValue(data);
                      targetChar.setWriteType(BluetoothGattCharacteristic.WRITE_TYPE_NO_RESPONSE);
                      bluetoothGatt.writeCharacteristic(targetChar);
                  } catch (Exception ignored) {}
              }

              private void saveSlotToLocal(int slot) {
                  StringBuilder sb = new StringBuilder();
                  for (AnimFrame f : timelineFrames) {
                      sb.append(f.leftColor).append(",").append(f.rightColor).append(",").append(f.duration).append(";");
                  }
                  sharedPrefs.edit().putString("slot_" + slot, sb.toString()).apply();
              }

              private void loadSlotFromLocal(int slot) {
                  timelineFrames.clear();
                  String data = sharedPrefs.getString("slot_" + slot, "");
                  if (data.isEmpty()) {
                      timelineFrames.add(new AnimFrame(Color.RED, Color.BLUE, 150));
                      return;
                  }
                  String[] rows = data.split(";");
                  for (String r : rows) {
                      try {
                          String[] p = r.split(",");
                          if (p.length >= 3) timelineFrames.add(new AnimFrame(Integer.parseInt(p[0]), Integer.parseInt(p[1]), Integer.parseInt(p[2])));
                      } catch (Exception ignored) {}
                  }
              }

              private void startAnimationLoop() {
                  if (timelineFrames.isEmpty()) return;
                  isPlaying = true;
                  handler.post(new Runnable() {
                      int idx = 0;
                      public void run() {
                          if (!isPlaying || timelineFrames.isEmpty()) return;
                          AnimFrame f = timelineFrames.get(idx % timelineFrames.size());
                          int r1 = Color.red(f.leftColor), g1 = Color.green(f.leftColor), b1 = Color.blue(f.leftColor);
                          int r2 = Color.red(f.rightColor), g2 = Color.green(f.rightColor), b2 = Color.blue(f.rightColor);

                          byte[] packet = {(byte)0x7B, (byte)0xFF, (byte)0x08, (byte)r1, (byte)g1, (byte)b1, (byte)r2, (byte)g2, (byte)b2, (byte)0xBF};
                          sendCommand(packet);
                          idx++;
                          handler.postDelayed(this, Math.max(80, f.duration));
                      }
                  });
              }

              private void stopAnimationLoop() {
                  isPlaying = false;
                  handler.removeCallbacksAndMessages(null);
              }

              private TextView createHeader(String text) {
                  TextView t = new TextView(MainActivity.this); t.setText(text); t.setTextColor(Color.parseColor("#00E5FF")); t.setTextSize(16); t.setPadding(0, 10, 0, 10); return t;
              }
              private TextView createLabel(String text) {
                  TextView t = new TextView(MainActivity.this); t.setText(text); t.setTextColor(Color.WHITE); t.setTextSize(13); t.setPadding(0, 8, 0, 4); return t;
              }
              private Button createButton(String text, int bgColor) {
                  Button b = new Button(MainActivity.this); b.setText(text); b.setTextColor(Color.WHITE); b.setBackgroundColor(bgColor); return b;
              }
              private EditText createEditText(String text) {
                  EditText e = new EditText(MainActivity.this); e.setText(text); e.setTextColor(Color.WHITE); e.setBackgroundColor(Color.parseColor("#1F2430")); return e;
              }
              private static class AnimFrame {
                  int leftColor, rightColor, duration;
                  AnimFrame(int l, int r, int d) { this.leftColor = l; this.rightColor = r; this.duration = d; }
              }
          }
          EOF

