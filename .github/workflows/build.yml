                                          pixelCount
                                  )
                          );

                  contentLayout.addView(pixel);

                  Button pixelButton =
                          createButton(
                                  "KIRIM PIXEL CONFIG",
                                  Color.rgb(0, 131, 143)
                          );

                  pixelButton.setOnClickListener(
                          v -> {

                              try {

                                  pixelCount =
                                          Integer.parseInt(
                                                  pixel.getText()
                                                          .toString()
                                          );

                                  if (pixelCount < 1) {
                                      pixelCount = 1;
                                  }

                                  if (pixelCount > 65535) {
                                      pixelCount = 65535;
                                  }

                              } catch (Exception ignored) {
                              }

                              sendCommand(
                                      packetPixelConfig(
                                              pixelCount
                                      )
                              );
                          }
                  );

                  contentLayout.addView(
                          pixelButton
                  );

                  contentLayout.addView(
                          createLabel(
                                  "RGB Order"
                          )
                  );

                  String[] orders = {
                          "RGB",
                          "RBG",
                          "GRB",
                          "GBR",
                          "BRG",
                          "BGR"
