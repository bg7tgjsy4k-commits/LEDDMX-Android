              // ====================================================
              // PERMISSIONS
              // ====================================================

              private boolean bluetoothPermission() {

                  if (Build.VERSION.SDK_INT < 31) {
                      return true;
                  }

                  return checkSelfPermission(
                          Manifest.permission.BLUETOOTH_SCAN
                  ) == PackageManager.PERMISSION_GRANTED
                          &&
                          checkSelfPermission(
                                  Manifest.permission.BLUETOOTH_CONNECT
                          ) == PackageManager.PERMISSION_GRANTED;
              }

              private void requestBluetoothPermission() {

                  if (Build.VERSION.SDK_INT >= 31) {

                      requestPermissions(
                              new String[]{
                                      Manifest.permission.BLUETOOTH_SCAN,
                                      Manifest.permission.BLUETOOTH_CONNECT
                              },
                              500
                      );

                  } else {

                      requestPermissions(
                              new String[]{
                                      Manifest.permission.ACCESS_FINE_LOCATION
                              },
                              501
                      );
                  }
              }

              // ====================================================
              // BLE SCANNER
              // ====================================================

              private void startScan() {

                  if (adapter == null) {
                      toast("Bluetooth tidak tersedia.");
                      return;
                  }

                  if (!bluetoothPermission()) {
                      requestBluetoothPermission();
                      return;
                  }

                  try {

                      if (!adapter.isEnabled()) {
                          toast("Nyalakan Bluetooth.");
                          return;
                      }

                  } catch (SecurityException e) {
                      toast("Bluetooth permission error.");
                      return;
                  }

                  if (scanning) {
                      return;
                  }

                  scanner =
                          adapter.getBluetoothLeScanner();

                  if (scanner == null) {
                      toast("BLE scanner tidak tersedia.");
                      return;
                  }

                  devices.clear();

                  showDeviceDialog();

                  scanning = true;

                  scanCallback =
                          new ScanCallback() {

                              @Override
                              public void onScanResult(
                                      int type,
                                      ScanResult result) {

                                  BluetoothDevice d =
                                          result.getDevice();

                                  String name = "";

                                  try {
                                      name = d.getName();
                                  } catch (Exception ignored) {}

                                  if (name == null) {
                                      name = "";
                                  }

                                  String upper =
                                          name.toUpperCase(
                                                  Locale.US
                                          );

                                  boolean match =
                                          upper.contains(
                                                  "LEDDMX"
                                          )
                                          ||
                                          upper.contains(
                                                  "LED LAMP"
                                          );

                                  if (!match) {
                                      return;
                                  }

                                  boolean exists = false;

                                  for (ScanResult x :
                                          devices) {

                                      try {

                                          if (x.getDevice()
                                                  .getAddress()
                                                  .equals(
                                                          d.getAddress()
                                                  )) {

                                              exists = true;
                                              break;
                                          }

                                      } catch (Exception ignored) {}
                                  }

                                  if (!exists) {
                                      devices.add(result);
                                      refreshDeviceDialog();
                                  }
                              }

                              @Override
                              public void onScanFailed(
                                      int errorCode) {

                                  scanning = false;

                                  toast(
                                          "BLE scan error: " +
                                                  errorCode
                                  );
                              }
                          };

                  try {
                      scanner.startScan(
                              scanCallback
                      );
                  } catch (Exception e) {
                      scanning = false;
                      toast(
                              "Gagal memulai BLE scan: " +
                                      e.getMessage()
                      );
                      return;
                  }

                  handler.postDelayed(
                          () -> stopScan(),
                          10000
                  );
              }

