name: Build LEDDMX APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create Android project
        run: |
          rm -rf project
          mkdir -p project/app/src/main/java/com/leddmx/finalapp
          mkdir -p project/app/src/main/res/values

          cat > project/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "LEDDMX"
          include(":app")
          EOF

          cat > project/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF

          cat > project/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=false
          EOF

          cat > project/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.leddmx.finalapp'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.leddmx.finalapp'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '2.2'
              }
          }
          EOF

          cat > project/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation" />
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />

              <uses-feature
                  android:name="android.hardware.bluetooth_le"
                  android:required="true" />

              <application
                  android:allowBackup="false"
                  android:label="LEDDMX Dark Pro"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <activity
                      android:name=".EditorActivity"
                      android:exported="false" />
              </application>

          </manifest>
          EOF

          cat > project/app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="@android:style/Theme.Material.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowBackground">#121212</item>
                  <item name="android:textColor">#FFFFFF</item>
                  <item name="android:colorAccent">#03DAC5</item>
              </style>
          </resources>
          EOF

          cat > project/app/src/main/java/com/leddmx/finalapp/BluetoothService.java <<'EOF'
          package com.leddmx.finalapp;

          import android.bluetooth.BluetoothGatt;
          import android.bluetooth.BluetoothGattCharacteristic;
          import java.util.UUID;

          public class BluetoothService {
              private static BluetoothService instance;
              public static synchronized BluetoothService getInstance() {
                  if (instance == null) instance = new BluetoothService();
                  return instance;
              }

              public BluetoothGatt gatt;
              public BluetoothGattCharacteristic writeChar;
              public BluetoothGattCharacteristic notifyChar;
              public boolean isConnected = false;

              public static final UUID SERVICE_FFE0 = UUID.fromString("0000FFE0-0000-1000-8000-00805F9B34FB");
              public static final UUID CHAR_FFE1 = UUID.fromString("0000FFE1-0000-1000-8000-00805F9B34FB");
              public static final UUID CHAR_FFF4 = UUID.fromString("0000FFF4-0000-1000-8000-00805F9B34FB");

              public void sendPacket(byte[] data) {
                  if (gatt == null || writeChar == null) return;
                  try {
                      writeChar.setValue(data);
                      gatt.writeCharacteristic(writeChar);
                  } catch (SecurityException ignored) {}
              }
          }
          EOF

          cat > project/app/src/main/java/com/leddmx/finalapp/EditorActivity.java <<'EOF'
          package com.leddmx.finalapp;

          import android.app.Activity;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.view.Gravity;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;

          public class EditorActivity extends Activity {

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  ScrollView scroll = new ScrollView(this);
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(30, 30, 30, 30);
                  root.setBackgroundColor(Color.parseColor("#121212"));

                  TextView title = new TextView(this);
                  title.setText("Preset Animasi & Belang Kanan-Kiri");
                  title.setTextSize(20);
                  title.setTextColor(Color.WHITE);
                  title.setGravity(Gravity.CENTER);
                  root.addView(title);

                  TextView desc = new TextView(this);
                  desc.setText("\nPilih Preset Mode Animasi:");
                  desc.setTextSize(16);
                  desc.setTextColor(Color.parseColor("#BBBBBB"));
                  root.addView(desc);

                  Button btnPreset1 = new Button(this);
                  btnPreset1.setText("🔥 Rainbow Flow (Mode 171)");
                  styleDarkButton(btnPreset1, Color.parseColor("#3700B3"));
                  btnPreset1.setOnClickListener(v -> sendModePreset(171));
                  root.addView(btnPreset1);

                  Button btnPreset2 = new Button(this);
                  btnPreset2.setText("⚡ Running Fire (Mode 185)");
                  styleDarkButton(btnPreset2, Color.parseColor("#018786"));
                  btnPreset2.setOnClickListener(v -> sendModePreset(185));
                  root.addView(btnPreset2);

                  Button btnPreset3 = new Button(this);
                  btnPreset3.setText("✨ Strobe Party (Mode 200)");
                  styleDarkButton(btnPreset3, Color.parseColor("#B00020"));
                  btnPreset3.setOnClickListener(v -> sendModePreset(200));
                  root.addView(btnPreset3);

                  TextView splitDesc = new TextView(this);
                  splitDesc.setText("\nPreset Belang Kanan / Kiri (Custom Split):");
                  splitDesc.setTextSize(16);
                  splitDesc.setTextColor(Color.parseColor("#BBBBBB"));
                  root.addView(splitDesc);

                  Button btnSplit1 = new Button(this);
                  btnSplit1.setText("🔴 Kiri Merah 🔵 Kanan Biru (Split Mode)");
                  styleDarkButton(btnSplit1, Color.parseColor("#442222"));
                  btnSplit1.setOnClickListener(v -> {
                      // Kirim paket kustom kombinasi belahan sisi
                      BluetoothService.getInstance().sendPacket(new byte[]{0x7B, (byte)0xFF, 0x03, (byte)190, (byte)0xFF, (byte)0x00, (byte)0xFF, (byte)0xFF, (byte)0xBF});
                  });
                  root.addView(btnSplit1);

                  Button btnSplit2 = new Button(this);
                  btnSplit2.setText("🟢 Kiri Hijau 🟡 Kanan Kuning (Split Mode)");
                  styleDarkButton(btnSplit2, Color.parseColor("#224422"));
                  btnSplit2.setOnClickListener(v -> {
                      BluetoothService.getInstance().sendPacket(new byte[]{0x7B, (byte)0xFF, 0x03, (byte)195, (byte)0x00, (byte)0xFF, (byte)0xFF, (byte)0xFF, (byte)0xBF});
                  });
                  root.addView(btnSplit2);

                  Button backBtn = new Button(this);
                  backBtn.setText("\nKembali ke Menu Utama");
                  styleDarkButton(backBtn, Color.parseColor("#333333"));
                  backBtn.setOnClickListener(v -> finish());
                  root.addView(backBtn);

                  scroll.addView(root);
                  setContentView(scroll);
              }

              private void styleDarkButton(Button btn, int bgColor) {
                  btn.setBackgroundColor(bgColor);
                  btn.setTextColor(Color.WHITE);
                  LinearLayout.LayoutParams params = new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                  );
                  params.setMargins(0, 10, 0, 10);
                  btn.setLayoutParams(params);
              }

              private void sendModePreset(int mode) {
                  byte[] packet = new byte[]{
                          0x7B, (byte) 0xFF, 0x03, (byte) mode,
                          (byte) 0xFF, (byte) 0xFF, (byte) 0xFF, (byte) 0xFF, (byte) 0xBF
                  };
                  BluetoothService.getInstance().sendPacket(packet);
              }
          }
          EOF

          cat > project/app/src/main/java/com/leddmx/finalapp/MainActivity.java <<'EOF'
          package com.leddmx.finalapp;

          import android.Manifest;
          import android.app.Activity;
          import android.bluetooth.BluetoothAdapter;
          import android.bluetooth.BluetoothDevice;
          import android.bluetooth.BluetoothGatt;
          import android.bluetooth.BluetoothGattCallback;
          import android.bluetooth.BluetoothGattCharacteristic;
          import android.bluetooth.BluetoothGattDescriptor;
          import android.bluetooth.BluetoothGattService;
          import android.bluetooth.BluetoothManager;
          import android.bluetooth.le.BluetoothLeScanner;
          import android.bluetooth.le.ScanCallback;
          import android.bluetooth.le.ScanResult;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.SeekBar;
          import android.widget.TextView;
          import java.util.ArrayList;
          import java.util.UUID;

          public class MainActivity extends Activity {

              private BluetoothAdapter adapter;
              private BluetoothLeScanner scanner;
              private final ArrayList<BluetoothDevice> devices = new ArrayList<>();
              private LinearLayout deviceList;
              private LinearLayout connectionPanel;
              private TextView status;
              private TextView speedLabel;

              private boolean powerState = true;
              private final Handler handler = new Handler(Looper.getMainLooper());
              private BluetoothService ble = BluetoothService.getInstance();

              private final ScanCallback scanCallback = new ScanCallback() {
                  @Override
                  public void onScanResult(int callbackType, ScanResult result) {
                      BluetoothDevice device = result.getDevice();
                      if (device == null) return;
                      String name = device.getName();
                      if (name == null || name.isEmpty()) name = "Unknown Device";

                      boolean exists = false;
                      for (BluetoothDevice d : devices) {
                          if (d.getAddress().equals(device.getAddress())) {
                              exists = true;
                              break;
                          }
                      }
                      if (!exists) {
                          devices.add(device);
                          addDeviceButton(device, name);
                      }
                  }
              };

              private final BluetoothGattCallback gattCallback = new BluetoothGattCallback() {
                  @Override
                  public void onConnectionStateChange(BluetoothGatt g, int statusCode, int newState) {
                      if (newState == BluetoothGatt.STATE_CONNECTED) {
                          ble.gatt = g;
                          ble.isConnected = true;
                          handler.post(() -> status.setText("Terhubung - Siap"));
                          g.discoverServices();
                      } else if (newState == BluetoothGatt.STATE_DISCONNECTED) {
                          ble.gatt = null;
                          ble.isConnected = false;
                          handler.post(() -> status.setText("Terputus"));
                          ble.writeChar = null;
                          ble.notifyChar = null;
                      }
                  }

                  @Override
                  public void onServicesDiscovered(BluetoothGatt g, int statusCode) {
                      if (statusCode != BluetoothGatt.GATT_SUCCESS) return;
                      BluetoothGattService service = g.getService(BluetoothService.SERVICE_FFE0);
                      if (service == null) return;

                      ble.writeChar = service.getCharacteristic(BluetoothService.CHAR_FFE1);
                      ble.notifyChar = service.getCharacteristic(BluetoothService.CHAR_FFF4);

                      if (ble.notifyChar != null) {
                          try {
                              g.setCharacteristicNotification(ble.notifyChar, true);
                              BluetoothGattDescriptor desc = ble.notifyChar.getDescriptor(UUID.fromString("00002902-0000-1000-8000-00805F9B34FB"));
                              if (desc != null) {
                                  desc.setValue(BluetoothGattDescriptor.ENABLE_NOTIFICATION_VALUE);
                                  g.writeDescriptor(desc);
                              }
                          } catch (SecurityException ignored) {}
                      }

                      if (ble.writeChar != null) {
                          handler.post(() -> status.setText("READY - Terhubung ke FFE1"));
                      }
                  }
              };

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  BluetoothManager manager = (BluetoothManager) getSystemService(Context.BLUETOOTH_SERVICE);
                  adapter = manager.getAdapter();

                  buildUi();
                  requestBlePermission();
              }

              private void buildUi() {
                  ScrollView scroll = new ScrollView(this);
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(20, 20, 20, 20);
                  root.setBackgroundColor(Color.parseColor("#121212"));

                  // TOP BAR (MENU ☰)
                  LinearLayout topBar = new LinearLayout(this);
                  topBar.setOrientation(LinearLayout.HORIZONTAL);
                  topBar.setGravity(Gravity.CENTER_VERTICAL);

                  Button menuBtn = new Button(this);
                  menuBtn.setText("☰");
                  menuBtn.setTextSize(20);
                  menuBtn.setTextColor(Color.WHITE);
                  menuBtn.setBackgroundColor(Color.parseColor("#333333"));
                  menuBtn.setOnClickListener(v -> toggleConnectionPanel());
                  topBar.addView(menuBtn, new LinearLayout.LayoutParams(120, LinearLayout.LayoutParams.WRAP_CONTENT));

                  TextView title = new TextView(this);
                  title.setText("LEDDMX Dark Pro");
                  title.setTextSize(18);
                  title.setTextColor(Color.WHITE);
                  title.setGravity(Gravity.CENTER);
                  topBar.addView(title, new LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1));

                  root.addView(topBar);

                  // PANEL KONEKSI (MINIMIZE / DROPDOWN)
                  connectionPanel = new LinearLayout(this);
                  connectionPanel.setOrientation(LinearLayout.VERTICAL);
                  connectionPanel.setVisibility(View.GONE);
                  connectionPanel.setPadding(0, 10, 0, 10);

                  status = new TextView(this);
                  status.setText("Status: Belum Terhubung");
                  status.setTextSize(14);
                  status.setTextColor(Color.parseColor("#AAAAAA"));
                  connectionPanel.addView(status);

                  Button scan = new Button(this);
                  scan.setText("SCAN PERANGKAT BLE");
                  scan.setBackgroundColor(Color.parseColor("#03DAC5"));
                  scan.setTextColor(Color.BLACK);
                  scan.setOnClickListener(v -> startScan());
                  connectionPanel.addView(scan);

                  deviceList = new LinearLayout(this);
                  deviceList.setOrientation(LinearLayout.VERTICAL);
                  connectionPanel.addView(deviceList);

                  root.addView(connectionPanel);

                  // TOMBOL UTAMA (POWER & EDITOR PAGE)
                  LinearLayout actionRow = new LinearLayout(this);
                  actionRow.setOrientation(LinearLayout.HORIZONTAL);

                  Button btnPower = new Button(this);
                  btnPower.setText("POWER ON/OFF");
                  btnPower.setBackgroundColor(Color.parseColor("#CF6679"));
                  btnPower.setTextColor(Color.BLACK);
                  btnPower.setOnClickListener(v -> togglePower());
                  actionRow.addView(btnPower, new LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1));

                  Button btnOpenEditor = new Button(this);
                  btnOpenEditor.setText("Preset & Editor ↗");
                  btnOpenEditor.setBackgroundColor(Color.parseColor("#6200EE"));
                  btnOpenEditor.setTextColor(Color.WHITE);
                  btnOpenEditor.setOnClickListener(v -> {
                      startActivity(new Intent(MainActivity.this, EditorActivity.class));
                  });
                  actionRow.addView(btnOpenEditor, new LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1));

                  root.addView(actionRow);

                  // SLIDER SPEED ANIMASI
                  speedLabel = new TextView(this);
                  speedLabel.setText("Kecepatan Animasi: 50%");
                  speedLabel.setTextSize(15);
                  speedLabel.setTextColor(Color.WHITE);
                  root.addView(speedLabel);

                  SeekBar speedBar = new SeekBar(this);
                  speedBar.setMax(100);
                  speedBar.setProgress(50);
                  speedBar.setOnSeekBarChangeListener(new SeekBar.OnSeekBarChangeListener() {
                      @Override
                      public void onProgressChanged(SeekBar seekBar, int progress, boolean fromUser) {
                          speedLabel.setText("Kecepatan Animasi: " + progress + "%");
                          if (fromUser) {
                              int val = (progress * 255) / 100;
                              ble.sendPacket(new byte[]{0x7B, (byte)0xFF, 0x02, (byte)val, (byte)0xFF, 0x00, (byte)0xFF, (byte)0xFF, (byte)0xBF});
                          }
                      }
                      @Override public void onStartTrackingTouch(SeekBar seekBar) {}
                      @Override public void onStopTrackingTouch(SeekBar seekBar) {}
                  });
                  root.addView(speedBar);

                  // DAFTAR MODE 1 SAMPAI 210 DENGAN PREVIEW WARNA VISUAL
                  TextView modeTitle = new TextView(this);
                  modeTitle.setText("\nPILIHAN MODE DENGAN PREVIEW WARNA (1 - 210)");
                  modeTitle.setTextSize(15);
                  modeTitle.setTextColor(Color.parseColor("#03DAC5"));
                  root.addView(modeTitle);

                  LinearLayout modes = new LinearLayout(this);
                  modes.setOrientation(LinearLayout.VERTICAL);

                  for (int start = 1; start <= 210; start += 5) {
                      LinearLayout row = new LinearLayout(this);
                      for (int mode = start; mode < start + 5 && mode <= 210; mode++) {
                          final int id = mode;
                          Button b = new Button(this);
                          b.setText(String.valueOf(id));
                          b.setTextSize(12);

                          // Berikan warna preview visual yang bervariasi tiap rentang mode
                          if (id <= 50) {
                              b.setBackgroundColor(Color.parseColor("#1F3B4D")); // Nuansa Biru Air/Flow
                          } else if (id <= 100) {
                              b.setBackgroundColor(Color.parseColor("#4D1F3B")); // Nuansa Ungu/Magenta
                          } else if (id <= 150) {
                              b.setBackgroundColor(Color.parseColor("#1F4D2B")); // Nuansa Hijau Menyala
                          } else if (id <= 190) {
                              b.setBackgroundColor(Color.parseColor("#4D3E1F")); // Nuansa Kuning/Orange Api
                          } else {
                              b.setBackgroundColor(Color.parseColor("#4D1F1F")); // Nuansa Merah Strobe
                          }
                          b.setTextColor(Color.WHITE);

                          b.setOnClickListener(v -> sendMode(id));
                          row.addView(b, new LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1));
                      }
                      modes.addView(row);
                  }
                  root.addView(modes);

                  scroll.addView(root);
                  setContentView(scroll);
              }

              private void toggleConnectionPanel() {
                  if (connectionPanel.getVisibility() == View.GONE) {
                      connectionPanel.setVisibility(View.VISIBLE);
                  } else {
                      connectionPanel.setVisibility(View.GONE);
                  }
              }

              private void togglePower() {
                  powerState = !powerState;
                  if (powerState) {
                      sendMode(171);
                  } else {
                      ble.sendPacket(new byte[]{0x7B, (byte)0xFF, 0x07, 0x00, 0x00, 0x00, (byte)0xBF});
                  }
              }

              private void requestBlePermission() {
                  String[] perms;
                  if (android.os.Build.VERSION.SDK_INT >= 31) {
                      perms = new String[]{
                              Manifest.permission.BLUETOOTH_SCAN,
                              Manifest.permission.BLUETOOTH_CONNECT,
                              Manifest.permission.ACCESS_FINE_LOCATION
                      };
                  } else {
                      perms = new String[]{
                              Manifest.permission.ACCESS_FINE_LOCATION
                      };
                  }
                  requestPermissions(perms, 100);
              }

              private void startScan() {
                  if (adapter == null) return;
                  scanner = adapter.getBluetoothLeScanner();
                  if (scanner == null) return;

                  devices.clear();
                  deviceList.removeAllViews();
                  status.setText("Memindai perangkat...");

                  try {
                      scanner.startScan(scanCallback);
                      handler.postDelayed(() -> {
                          try {
                              scanner.stopScan(scanCallback);
                          } catch (Exception ignored) {}
                          status.setText("Pemindaian selesai. Ditemukan: " + devices.size());
                      }, 10000);
                  } catch (SecurityException ignored) {}
              }

              private void addDeviceButton(BluetoothDevice device, String name) {
                  Button b = new Button(this);
                  b.setText(name + "\n" + device.getAddress());
                  b.setBackgroundColor(Color.parseColor("#2C2C2C"));
                  b.setTextColor(Color.WHITE);
                  b.setOnClickListener(v -> {
                      try {
                          if (ble.gatt != null) ble.gatt.close();
                          status.setText("Menghubungkan...");
                          device.connectGatt(this, false, gattCallback, BluetoothDevice.TRANSPORT_LE);
                      } catch (SecurityException ignored) {}
                  });
                  deviceList.addView(b);
              }

              private void sendMode(int mode) {
                  byte[] packet = new byte[]{
                          0x7B, (byte) 0xFF, 0x03, (byte) mode,
                          (byte) 0xFF, (byte) 0xFF, (byte) 0xFF, (byte) 0xFF, (byte) 0xBF
                  };
                  ble.sendPacket(packet);
              }
          }
          EOF

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        working-directory: project
        run: |
          gradle --no-daemon clean assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LEDDMX-Android-debug
          path: project/app/build/outputs/apk/debug/app-debug.apk
