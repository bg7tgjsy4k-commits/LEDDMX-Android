              /*
               * =========================================================
               * COLOR WHEEL
               * =========================================================
               */

              private static class ColorWheelView
                      extends View {

                  private final Paint paint =
                          new Paint(
                                  Paint.ANTI_ALIAS_FLAG
                          );

                  private final Paint selector =
                          new Paint(
                                  Paint.ANTI_ALIAS_FLAG
                          );

                  private Shader shader;

                  private float hue = 0f;
                  private float saturation = 1f;

                  private OnColorChangedListener listener;

                  interface OnColorChangedListener {
                      void onColorChanged(int color);
                  }

                  ColorWheelView(
                          Context context
                  ) {
                      super(context);

                      selector.setStyle(
                              Paint.Style.STROKE
                      );

                      selector.setStrokeWidth(6);
                      selector.setColor(
                              Color.WHITE
                      );

                      setLayerType(
                              View.LAYER_TYPE_SOFTWARE,
                              null
                      );
                  }

                  void setOnColorChangedListener(
                          OnColorChangedListener l
                  ) {
                      listener = l;
                  }

                  @Override
                  protected void onDraw(
                          Canvas canvas
                  ) {

                      super.onDraw(canvas);

                      float cx =
                              getWidth() / 2f;

                      float cy =
                              getHeight() / 2f;

                      float radius =
                              Math.min(
                                      cx,
                                      cy
                              ) - 20;

                      int[] colors = {
                              Color.RED,
                              Color.MAGENTA,
                              Color.BLUE,
                              Color.CYAN,
                              Color.GREEN,
                              Color.YELLOW,
                              Color.RED
                      };

                      float[] positions = {
                              0f,
                              .166f,
                              .333f,
                              .5f,
                              .666f,
                              .833f,
                              1f
                      };

                      shader =
                              new SweepGradient(
                                      cx,
                                      cy,
                                      colors,
                                      positions
                              );

                      paint.setShader(
                              shader
                      );

                      canvas.drawCircle(
                              cx,
                              cy,
                              radius,
                              paint
                      );

                      paint.setShader(null);

                      paint.setColor(
                              Color.argb(
                                      130,
                                      0,
                                      0,
                                      0
                              )
                      );

                      canvas.drawCircle(
                              cx,
                              cy,
                              radius * 0.42f,
                              paint
                      );

                      double angle =
                              Math.toRadians(
                                      hue
                              );

                      float sx =
                              cx +
                              (float)
                              Math.cos(angle)
                              *
                              radius
                              *
                              saturation;

                      float sy =
                              cy +
                              (float)
                              Math.sin(angle)
                              *
                              radius
                              *
                              saturation;

                      canvas.drawCircle(
                              sx,
                              sy,
                              12,
                              selector
                      );
                  }

                  @Override
                  public boolean onTouchEvent(
                          MotionEvent event
                  ) {

                      if (
                              event.getAction()
                              != MotionEvent.ACTION_DOWN
                              &&
                              event.getAction()
                              != MotionEvent.ACTION_MOVE
                      ) {
                          return true;
                      }

                      float cx =
                              getWidth() / 2f;

                      float cy =
                              getHeight() / 2f;

                      float dx =
                              event.getX() - cx;

                      float dy =
                              event.getY() - cy;

                      float distance =
                              (float)
                              Math.sqrt(
                                      dx * dx +
                                      dy * dy
                              );

                      if (distance < 10) {
                          return true;
                      }

                      hue =
                              (float)
                              Math.toDegrees(
                                      Math.atan2(
                                              dy,
                                              dx
                                      )
                              );

                      if (hue < 0) {
                          hue += 360;
                      }

                      float radius =
                              Math.min(
                                      cx,
                                      cy
                              ) - 20;

                      saturation =
                              Math.min(
                                      1f,
                                      distance /
                                      radius
                              );

                      float[] hsv = {
                              hue,
                              saturation,
                              1f
                      };

                      int color =
                              Color.HSVToColor(
                                      hsv
                              );

                      if (listener != null) {
                          listener.onColorChanged(
                                  color
                          );
                      }

                      invalidate();

                      return true;
                  }
              }

              private static class AnimFrame {

                  int leftColor;
                  int rightColor;
                  int duration;

                  AnimFrame(
                          int left,
                          int right,
                          int duration
                  ) {

                      this.leftColor =
                              left;

                      this.rightColor =
                              right;

                      this.duration =
                              duration;
                  }
              }

              private void toast(
                      String text
              ) {

                  Toast.makeText(
                          this,
                          text,
                          Toast.LENGTH_SHORT
                  ).show();
              }

              private static String bytesToHex(
                      byte[] data
              ) {

                  if (data == null) {
                      return "";
                  }

                  StringBuilder sb =
                          new StringBuilder();

                  for (byte b : data) {

                      sb.append(
                              String.format(
                                      Locale.US,
                                      "%02X",
                                      b & 0xFF
                              )
                      );
                  }

                  return sb.toString();
              }

              private void disconnect() {

                  stopAnimationLoop();

                  gattReady = false;
                  targetChar = null;

                  synchronized (packetQueue) {
                      packetQueue.clear();
                  }

                  if (bluetoothGatt != null) {

                      try {
                          bluetoothGatt.disconnect();
                      } catch (Exception ignored) {}

                      try {
                          bluetoothGatt.close();
                      } catch (Exception ignored) {}

                      bluetoothGatt = null;
                  }

                  statusText.setText(
                          "Status: Disconnected"
                  );
              }

              @Override
              protected void onDestroy() {

                  stopAnimationLoop();
                  stopBleScan();
                  disconnect();

                  super.onDestroy();
              }
          }
