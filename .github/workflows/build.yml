                              showEditorScreen();
                          }
                  );

                  contentLayout.addView(add);

                  for (int i = 0;
                       i < timelineFrames.size();
                       i++) {

                      final int index = i;

                      AnimFrame frame =
                              timelineFrames.get(i);

                      LinearLayout card =
                              new LinearLayout(
                                      this
                              );

                      card.setOrientation(
                              LinearLayout.VERTICAL
                      );

                      card.setPadding(
                              12, 12, 12, 12
                      );

                      card.setBackgroundColor(
                              Color.rgb(
                                      26, 29, 36
                              )
