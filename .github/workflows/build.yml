              int colorFromText(String s,int fallback) {
                  s=s.toLowerCase();

                  if(s.contains("merah") || s.contains("red"))
                      return Color.RED;

                  if(s.contains("hijau") || s.contains("green"))
                      return Color.GREEN;

                  if(s.contains("biru") || s.contains("blue"))
                      return Color.BLUE;

                  if(s.contains("putih") || s.contains("white"))
                      return Color.WHITE;

                  if(s.contains("kuning") || s.contains("yellow"))
                      return Color.YELLOW;

                  if(s.contains("cyan"))
                      return Color.CYAN;

                  if(s.contains("ungu") || s.contains("purple"))
                      return Color.MAGENTA;

                  if(s.contains("orange"))
                      return Color.rgb(255,128,0);

                  return fallback;
              }

              void addColorFrame(int left,int right,int duration) {
                  frames.add(new Frame(
                          Color.red(left),
                          Color.green(left),
                          Color.blue(left),
                          Color.red(right),
                          Color.green(right),
                          Color.blue(right),
                          duration));
              }

              void generateAI(String command) {
                  frames.clear();

                  String c=command.toLowerCase();

                  int duration=c.contains("cepat") ||
                          c.contains("fast") ? 120 :
                          c.contains("pelan") ||
                          c.contains("slow") ? 700 : 300;

                  int red=Color.RED;
                  int blue=Color.BLUE;
                  int white=Color.WHITE;

                  if(c.contains("rainbow")) {
                      generateRainbow();
                      return;
                  }

                  if(c.contains("strobo") ||
                          c.contains("strobe")) {

                      int col=colorFromText(c,Color.RED);

                      for(int i=0;i<8;i++) {
                          addColorFrame(
                                  i%2==0?col:Color.BLACK,
                                  i%2==0?col:Color.BLACK,
                                  80);
                      }

                      return;
                  }

                  boolean left=c.contains("kiri") ||
                          c.contains("left");

                  boolean right=c.contains("kanan") ||
                          c.contains("right");

                  int lc=colorFromText(c,red);
                  int rc=colorFromText(c,blue);

                  Matcher m=Pattern.compile(
                          "(merah|red|biru|blue|putih|white|hijau|green|kuning|yellow|ungu|purple)")
                          .matcher(c);

                  ArrayList<Integer> colors=
                          new ArrayList<>();

                  while(m.find()) {
                      int cc=colorFromText(
                              m.group(),Color.WHITE);

                      colors.add(cc);
                  }

                  if(c.contains("belang") ||
                          c.contains("stripe") ||
                          c.contains("bergantian") ||
                          c.contains("alternating")) {

                      if(colors.size()>=2) {
                          for(int i=0;i<10;i++) {
                              int a=colors.get(i%colors.size());
                              int b=colors.get(
                                      (i+1)%colors.size());

                              addColorFrame(a,b,duration);
                          }
                      } else {
                          for(int i=0;i<8;i++) {
                              addColorFrame(
                                      i%2==0?red:white,
                                      i%2==0?blue:white,
                                      duration);
                          }
                      }

                      return;
                  }

                  if(colors.size()>=2) {
                      for(int i=0;i<colors.size()*2;i++) {
                          int a=colors.get(i%colors.size());
                          int b=colors.get(
                                  (i+1)%colors.size());

                          addColorFrame(a,b,duration);
                      }
                      return;
                  }

                  addColorFrame(lc,rc,duration);
                  addColorFrame(Color.WHITE,Color.WHITE,duration);
              }

