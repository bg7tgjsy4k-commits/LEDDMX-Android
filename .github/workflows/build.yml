    byte[] parseHex(
            String s
    ) {

        try {

            String[] q =
                    s.trim()
                            .split(
                                    "[ ,\\n\\t]+"
                            );

            byte[] b =
                    new byte[q.length];

            for(int i = 0; i < q.length; i++) {

                b[i] =
                        (byte)
                                Integer.parseInt(
                                        q[i],
                                        16
                                );
            }

            return b;

        } catch(Exception e) {

            return null;
        }
    }

