            action.run();
        });

        box.addView(b);
    }

    private void requestBlePermissions() {
        ArrayList<String> list =
                new ArrayList<>();

        if (Build.VERSION.SDK_INT >= 31) {
            if (checkSelfPermission(
                    Manifest.permission.BLUETOOTH_SCAN)
                    != PackageManager.PERMISSION_GRANTED) {
                list.add(
                        Manifest.permission.BLUETOOTH_SCAN);
            }

            if (checkSelfPermission(
                    Manifest.permission.BLUETOOTH_CONNECT)
                    != PackageManager.PERMISSION_GRANTED) {
                list.add(
                        Manifest.permission.BLUETOOTH_CONNECT);
            }
        } else if (Build.VERSION.SDK_INT >= 23) {
            if (checkSelfPermission(
                    Manifest.permission.ACCESS_FINE_LOCATION)
                    != PackageManager.PERMISSION_GRANTED) {
                list.add(
                        Manifest.permission.ACCESS_FINE_LOCATION);
            }
        }

        if (!list.isEmpty()) {
            requestPermissions(
                    list.toArray(
                            new String[0]),
                    1001);
        }
    }

    @Override
    public void onRequestPermissionsResult(
            int request,
            String[] permissions,
            int[] results) {

        super.onRequestPermissionsResult(
                request, permissions, results);

        if (request == 1001) {
            boolean ok = true;

            for (int r : results) {
                if (r != PackageManager.PERMISSION_GRANTED) {
                    ok = false;
                    break;
                }
            }

            if (ok) {
                toast("BLE permission ready");
                main.postDelayed(
                        this::scanBle,
                        400);
            } else {
                toast("BLE permission required");
            }
        }
    }

    private void scanBle() {
        if (adapter == null) {
            toast("Bluetooth unavailable");
            return;
        }

        if (!adapter.isEnabled()) {
            toast("Turn Bluetooth ON first");
            return;
        }

        if (Build.VERSION.SDK_INT >= 31 &&
                checkSelfPermission(
                        Manifest.permission.BLUETOOTH_SCAN)
                        != PackageManager.PERMISSION_GRANTED) {
            requestBlePermissions();
            return;
        }

        if (Build.VERSION.SDK_INT < 31 &&
                checkSelfPermission(
                        Manifest.permission.ACCESS_FINE_LOCATION)
                        != PackageManager.PERMISSION_GRANTED) {
            requestBlePermissions();
            return;
        }

        if (scanner == null) {
            scanner = adapter.getBluetoothLeScanner();
        }

        if (scanner == null) {
            toast("BLE scanner unavailable");
            return;
        }

        if (scanning) {
            stopScan();
            return;
        }

        devices.clear();

        showScanPage();

        scanning = true;

        ScanSettings settings =
                new ScanSettings.Builder()
                        .setScanMode(
                                ScanSettings.SCAN_MODE_LOW_LATENCY)
                        .setReportDelay(0)
                        .build();

        try {
            scanner.startScan(
                    null,
                    settings,
                    scanCallback);

            toast("Scanning nearby BLE devices...");
        } catch (Exception e) {
            scanning = false;
            toast("Scan error: " + e.getMessage());
        }

        main.postDelayed(() -> {
            if (scanning) stopScan();
        }, 12000);
    }

    private final ScanCallback scanCallback =
            new ScanCallback() {

        @Override
        public void onScanResult(
                int type,
                ScanResult result) {

            BluetoothDevice d =
                    result.getDevice();

            String key = d.getAddress();

            devices.put(key, result);

            main.post(() -> refreshDeviceList());
        }

        @Override
        public void onBatchScanResults(
                java.util.List<ScanResult> results) {

            for (ScanResult r : results) {
                BluetoothDevice d =
                        r.getDevice();

                devices.put(
                        d.getAddress(),
                        r);
            }

            main.post(() -> refreshDeviceList());
        }

        @Override
        public void onScanFailed(int errorCode) {
            scanning = false;

            main.post(() ->
                    toast("BLE scan failed: " +
                            errorCode));
        }
    };

    private void stopScan() {
        if (!scanning) return;

        try {
            if (scanner != null)
                scanner.stopScan(scanCallback);
        } catch (Exception ignored) {}

        scanning = false;

        refreshDeviceList();
    }

    private void showScanPage() {
        currentPage = 7;
        clear();

        title.setText("BLE DEVICES");

        addHeader("NEARBY DEVICES",
                "Live BLE scan • tap a device to connect");

        Button refresh = button(
                scanning ? "STOP SCAN" : "SCAN AGAIN");

        refresh.setOnClickListener(v -> {
            if (scanning) stopScan();
            else scanBle();
        });

        content.addView(refresh);

        refreshDeviceList();
    }

    private void refreshDeviceList() {
        if (currentPage != 7) return;

        int count = content.getChildCount();

        while (count > 2) {
            content.removeViewAt(2);
            count--;
        }

        for (ScanResult r : devices.values()) {
            BluetoothDevice d =
                    r.getDevice();

            String name = "UNKNOWN BLE";

            try {
                if (d.getName() != null &&
                        !d.getName().trim().isEmpty()) {
                    name = d.getName();
                }
            } catch (SecurityException ignored) {}

            String address = d.getAddress();

            int rssi = r.getRssi();

            Button b = button(
                    name +
                    "\n" +
                    address +
                    "   RSSI " +
                    rssi +
                    " dBm");

            b.setGravity(
                    Gravity.LEFT |
                    Gravity.CENTER_VERTICAL);

            final BluetoothDevice device = d;

            b.setOnClickListener(v ->
                    connectDevice(device));

            content.addView(b);
        }

        if (devices.isEmpty()) {
            content.addView(label(
                    scanning
                            ? "SEARCHING FOR BLE DEVICES..."
                            : "NO DEVICE FOUND"));
        }
    }

    private void connectDevice(
            BluetoothDevice device) {

        stopScan();

        try {
            if (gatt != null) {
                gatt.disconnect();
                gatt.close();
                gatt = null;
            }

            connected = false;
            writeChar = null;

            connectionState.setText(
                    "● CONNECTING...");

            gatt = device.connectGatt(
                    this,
                    false,
                    gattCallback);

        } catch (Exception e) {
            toast("Connect error: " +
                    e.getMessage());
        }
    }

    private final BluetoothGattCallback
            gattCallback =
            new BluetoothGattCallback() {

        @Override
        public void onConnectionStateChange(
                BluetoothGatt g,
                int status,
                int newState) {

            main.post(() -> {

                if (newState ==
                        BluetoothGatt.STATE_CONNECTED) {

                    connected = true;

                    connectionState.setText(
                            "● CONNECTED");

                    addModuleLog(
                            "MODULE: GATT CONNECTED");

                    try {
                        g.discoverServices();
                    } catch (Exception e) {
                        addModuleLog(
                                "MODULE: discover error " +
                                e.getMessage());
                    }

                } else if (
                        newState ==
                        BluetoothGatt.STATE_DISCONNECTED) {

                    connected = false;
                    writeChar = null;

                    connectionState.setText(
                            "● DISCONNECTED");

                    addModuleLog(
                            "MODULE: GATT DISCONNECTED");
                }
            });
        }

        @Override
        public void onServicesDiscovered(
                BluetoothGatt g,
                int status) {

            main.post(() ->
                    inspectGatt());
        }

        @Override
        public void onCharacteristicChanged(
                BluetoothGatt g,
                BluetoothGattCharacteristic c,
                byte[] value) {

            addModuleLog(
                    "MODULE RX  " +
                    hex(value));
        }

        @Override
        public void onCharacteristicRead(
                BluetoothGatt g,
                BluetoothGattCharacteristic c,
                byte[] value,
                int status) {

            addModuleLog(
                    "MODULE READ " +
                    c.getUuid().toString() +
                    " = " +
                    hex(value));
        }

        @Override
        public void onCharacteristicWrite(
                BluetoothGatt g,
                BluetoothGattCharacteristic c,
                int status) {

            txBusy = false;

            main.postDelayed(
                    () -> sendNext(),
                    70);
        }
    };

    private void inspectGatt() {
        if (gatt == null) {
            toast("Not connected");
            return;
        }

        addModuleLog(
                "MODULE: ===== GATT INSPECTION =====");

        boolean foundWrite = false;
        boolean foundOta = false;

        for (BluetoothGattService s :
                gatt.getServices()) {

            String su = s.getUuid().toString();

            addModuleLog(
                    "MODULE SERVICE: " + su);

            if (OTA_SERVICE.equals(s.getUuid())) {
                foundOta = true;
            }

            for (BluetoothGattCharacteristic c :
                    s.getCharacteristics()) {

                int p = c.getProperties();

                addModuleLog(
                        "MODULE CHAR: " +
                        c.getUuid() +
                        " PROP=0x" +
                        Integer.toHexString(p));

                if (FFE1.equals(c.getUuid())) {
                    writeChar = c;
                    foundWrite = true;

                    enableNotify(c);
                }

                if (OTA_WRITE.equals(c.getUuid())) {
                    addModuleLog(
                            "MODULE OTA WRITE DETECTED");
                }

                if (OTA_NOTIFY.equals(c.getUuid())) {
                    addModuleLog(
                            "MODULE OTA NOTIFY DETECTED");
                }

                if ((p &
                        BluetoothGattCharacteristic
                                .PROPERTY_READ) != 0) {

                    try {
                        gatt.readCharacteristic(c);
                    } catch (Exception ignored) {}
                }
            }
        }

        addModuleLog(
                "MODULE FFE1 WRITE = " +
                (foundWrite ? "EXPOSED" :
                        "NOT EXPOSED BY DEVICE"));

        addModuleLog(
                "MODULE OTA SERVICE = " +
                (foundOta ? "DETECTED" :
                        "NOT EXPOSED BY DEVICE"));

        addModuleLog(
                "MODULE ROUTING LEFT/RIGHT = " +
                "NOT EXPOSED BY DEVICE");
    }

    private void enableNotify(
            BluetoothGattCharacteristic c) {

        if (gatt == null) return;

        try {
            gatt.setCharacteristicNotification(
                    c,
                    true);

            BluetoothGattDescriptor d =
                    c.getDescriptor(UUID.fromString(
                            "00002902-0000-1000-8000-00805F9B34FB"));

            if (d != null) {
                d.setValue(
                        BluetoothGattDescriptor
                                .ENABLE_NOTIFICATION_VALUE);

                gatt.writeDescriptor(d);
            }

            addModuleLog(
                    "MODULE: FFE1 notification enabled");

        } catch (Exception e) {
            addModuleLog(
                    "MODULE: notify error " +
                    e.getMessage());
        }
    }

    private void sendPower(boolean on) {
        /*
         * User-proven LEDDMX-00 baseline:
         * ON  = 7B FF 04 01 FF FF FF FF BF
         * OFF = 7B FF 04 00 FF FF FF FF BF
         */
        enqueue(new byte[] {
                0x7B, (byte)0xFF, 0x04,
                (byte)(on ? 0x01 : 0x00),
                (byte)0xFF,
                (byte)0xFF,
                (byte)0xFF,
                (byte)0xFF,
                (byte)0xBF
        });
    }

    private void sendMode(int mode) {
        if (mode < 1) mode = 1;
        if (mode > 210) mode = 210;

        enqueue(new byte[] {
                0x7B,
                (byte)0xFF,
                0x03,
                (byte)mode,
                (byte)0xFF,
                (byte)0xFF,
                (byte)0xFF,
                (byte)0xFF,
                (byte)0xBF
        });
    }

    private void sendRgb() {
        enqueue(new byte[] {
                0x7B,
                (byte)0xFF,
                0x07,
                (byte)red,
                (byte)green,
                (byte)blue,
                0x00,
                (byte)0xFF,
                (byte)0xBF
        });
    }

    private void sendBrightness() {
        int v = brightness * 32 / 100;

        enqueue(new byte[] {
                0x7B,
                (byte)0xFF,
                0x01,
                (byte)v,
                (byte)brightness,
                0x00,
                (byte)0xFF,
                (byte)0xFF,
                (byte)0xBF
        });
    }

    private void sendSpeed() {
        enqueue(new byte[] {
                0x7B,
                (byte)0xFF,
                0x02,
                (byte)speed,
                0x00,
                (byte)0xFF,
                (byte)0xFF,
                (byte)0xFF,
                (byte)0xBF
        });
    }

    private void sendDirection() {
        enqueue(new byte[] {
                0x7B,
                (byte)0xFF,
                0x0D,
                (byte)direction,
                (byte)0xFF,
                (byte)0xFF,
                (byte)0xFF,
                (byte)0xFF,
                (byte)0xBF
        });
    }

    private void applyCustom() {
        /*
         * Proven custom protocol:
         * 7B position 0E FD R G B total BF
         *
         * Then:
         * 7B FF 13 modeOrdinal FF FF FF FF BF
         *
         * Custom enum:
         * 0 GD
         * 1 FD
         * 2 FW
         * 3 FS
         * 4 AC
         * 5 PU
         * 6 FL
         * 7 HO
         */

        int total = customColors.size();

        if (total == 0) {
            toast("Add at least one color");
            return;
        }

        for (int i = 0; i < total; i++) {
            int c = customColors.get(i);

            int rr = Color.red(c);
            int gg = Color.green(c);
            int bb = Color.blue(c);

            enqueue(new byte[] {
                    0x7B,
                    (byte)(i + 1),
                    0x0E,
                    (byte)0xFD,
                    (byte)rr,
                    (byte)gg,
                    (byte)bb,
                    (byte)total,
                    (byte)0xBF
            });
        }

        /*
         * FW = flowing/wave style.
         * Direction is sent separately.
         */
        enqueue(new byte[] {
                0x7B,
                (byte)0xFF,
                0x13,
                0x02,
                (byte)0xFF,
                (byte)0xFF,
                (byte)0xFF,
                (byte)0xFF,
                (byte)0xBF
        });

        sendDirection();

        toast("Custom pattern sent");
    }

