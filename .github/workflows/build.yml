name: Build LEDDMX Pro FINAL

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build LEDDMX Pro
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 33
        shell: bash
        run: |
          set -euxo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2"

      - name: Install Gradle 7.6.1
        shell: bash
        run: |
          set -euxo pipefail

          cd "$RUNNER_TEMP"

          curl -fL --retry 5 --retry-delay 2 \
            -o gradle.zip \
            https://services.gradle.org/distributions/gradle-7.6.1-bin.zip

          rm -rf gradle-7.6.1
          unzip -q gradle.zip

          echo "$RUNNER_TEMP/gradle-7.6.1/bin" >> "$GITHUB_PATH"

          gradle --version

      - name: Create clean project
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf LEDDMX-Pro
          mkdir -p LEDDMX-Pro

          cd LEDDMX-Pro

          mkdir -p \
            app/src/main/java/com/leddmx/pro \
            app/src/main/res/values

          cat > settings.gradle <<'EOF'
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = "LEDDMX-Pro"
include(":app")
EOF

