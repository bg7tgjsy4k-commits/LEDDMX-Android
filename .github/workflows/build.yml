              class ColorWheel extends View {

                  Paint paint=
                          new Paint(
                                  Paint.ANTI_ALIAS_FLAG);

                  float cx,cy,rad;

                  ColorWheel(Context c) {
                      super(c);
                  }

                  @Override
                  protected void onDraw(
                          Canvas canvas) {

                      cx=getWidth()/2f;
                      cy=getHeight()/2f;

                      rad=Math.min(
                              cx,
                              cy)-15;

                      for(int a=0;a<360;a++) {

                          paint.setColor(
                                  Color.HSVToColor(
                                          new float[]{
                                                  a,
                                                  1,
                                                  1}));

                          canvas.drawArc(
                                  cx-rad,
                                  cy-rad,
                                  cx+rad,
                                  cy+rad,
                                  a,
                                  1.2f,
                                  true,
                                  paint);
                      }

                      paint.setStyle(
                              Paint.Style.STROKE);

                      paint.setStrokeWidth(5);

                      paint.setColor(
                              Color.WHITE);

                      canvas.drawCircle(
                              cx,
                              cy,
                              rad,
                              paint);

                      paint.setStyle(
                              Paint.Style.FILL);
                  }

                  @Override
                  public boolean onTouchEvent(
                          MotionEvent e) {

                      if(e.getAction()!=
                              MotionEvent.ACTION_DOWN &&
                              e.getAction()!=
                                      MotionEvent.ACTION_MOVE)
                          return true;

                      float dx=e.getX()-cx;
                      float dy=e.getY()-cy;

                      double a=
                              Math.toDegrees(
                                      Math.atan2(
                                              dy,
                                              dx));

                      if(a<0)a+=360;

                      int color=
                              Color.HSVToColor(
                                      new float[]{
                                              (float)a,
                                              1,
                                              1});

                      r=Color.red(color);
                      g=Color.green(color);
                      b=Color.blue(color);

                      send(
                              rgbPacket(
                                      r,
                                      g,
                                      b));

                      invalidate();

                      return true;
                  }
              }

              class Strip extends View {

                  Paint paint=
                          new Paint(
                                  Paint.ANTI_ALIAS_FLAG);

                  float phase;

                  Strip(Context c) {

                      super(c);

                      post(new Runnable() {

                          public void run() {

                              phase+=6;

                              invalidate();

                              postDelayed(
                                      this,
                                      40);
                          }
                      });
                  }

                  @Override
                  protected void onDraw(
                          Canvas canvas) {

                      int count=42;

                      float w=
                              getWidth()/
                                      (float)count;

                      for(int i=0;i<count;i++) {

                          float hue=
                                  (i*9+phase)%360;

                          paint.setColor(
                                  Color.HSVToColor(
                                          new float[]{
                                                  hue,
                                                  1,
                                                  1}));

                          canvas.drawRoundRect(
                                  i*w+2,
                                  getHeight()/2f-12,
                                  (i+1)*w-2,
                                  getHeight()/2f+12,
                                  8,
                                  8,
                                  paint);
                      }
                  }
              }
          }
