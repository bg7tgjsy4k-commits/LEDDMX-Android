                  LinearLayout l =
                          new LinearLayout(this);

                  l.setOrientation(
                          LinearLayout.VERTICAL);

                  l.setPadding(
                          0, 5, 0, 5);

                  return l;
              }

              private LinearLayout horizontal() {

                  LinearLayout l =
                          new LinearLayout(this);

                  l.setOrientation(
                          LinearLayout.HORIZONTAL);

                  l.setGravity(
                          Gravity.CENTER_VERTICAL);

                  return l;
              }

              private Button button(
                      String s) {

                  Button b =
                          new Button(this);

                  b.setText(s);
                  b.setTextColor(
                          Color.WHITE);

                  return b;
              }

              private TextView text(
                      String s,
                      int size) {

                  TextView t =
                          new TextView(this);

                  t.setText(s);
                  t.setTextColor(
                          Color.WHITE);

                  t.setTextSize(size);

                  t.setPadding(
                          8, 8, 8, 8);

                  return t;
              }

              private TextView heading(
                      String s) {

                  TextView t =
                          text(s, 16);

                  t.setPadding(
                          8, 18, 8, 8);

                  return t;
              }

              private void addSpace(
                      int h) {

                  Space s =
                          new Space(this);

                  add(
                          s,
                          new LinearLayout.LayoutParams(
                                  1, h));
              }

              @Override
              protected void onDestroy() {

                  handler.removeCallbacksAndMessages(
                          null);

                  try {

                      if (scanner != null &&
                          scanning) {

                          scanner.stopScan(
                                  scanCallback);
                      }

                  } catch (Exception ignored) {}

                  try {

                      if (gatt != null)
                          gatt.close();

                  } catch (Exception ignored) {}

                  super.onDestroy();
              }

              private static class Frame {

                  int lr, lg, lb;
                  int rr, rg, rb;
                  int duration;

                  Frame(
                          int lr,
                          int lg,
                          int lb,
                          int rr,
                          int rg,
                          int rb,
                          int duration) {

                      this.lr = clampStatic(lr);
                      this.lg = clampStatic(lg);
                      this.lb = clampStatic(lb);

                      this.rr = clampStatic(rr);
                      this.rg = clampStatic(rg);
                      this.rb = clampStatic(rb);

                      this.duration =
                              Math.max(
                                      50,
                                      duration);
                  }

                  Frame copy() {

                      return new Frame(
                              lr, lg, lb,
                              rr, rg, rb,
                              duration);
                  }

                  private static int clampStatic(
                          int v) {

                      return Math.max(
                              0,
                              Math.min(255, v));
                  }
              }

              private interface ColorListener {
                  void changed(
                          int r,
                          int g,
                          int b);
              }

              private static class ColorWheel
                      extends View {

                  private final Paint paint =
                          new Paint(
                                  Paint.ANTI_ALIAS_FLAG);

                  private float cx;
                  private float cy;
                  private float radius;

                  ColorListener listener;

                  ColorWheel(Context context) {

                      super(context);

                      paint.setDither(true);
                  }

                  @Override
                  protected void onDraw(
                          Canvas canvas) {

                      super.onDraw(canvas);

                      cx =
                              getWidth() / 2f;

                      cy =
                              getHeight() / 2f;

                      radius =
                              Math.min(
                                      getWidth(),
                                      getHeight())
                              * .40f;

                      SweepGradient hue =
                              new SweepGradient(
                                      cx,
                                      cy,
                                      new int[]{
                                              Color.RED,
                                              Color.MAGENTA,
                                              Color.BLUE,
                                              Color.CYAN,
                                              Color.GREEN,
                                              Color.YELLOW,
                                              Color.RED
                                      },
                                      null);

                      paint.setShader(hue);

                      paint.setStyle(
                              Paint.Style.FILL);

                      canvas.drawCircle(
                              cx,
                              cy,
                              radius,
                              paint);

                      RadialGradient sat =
                              new RadialGradient(
                                      cx,
                                      cy,
                                      radius,
                                      Color.WHITE,
                                      Color.TRANSPARENT,
                                      Shader.TileMode.CLAMP);

                      paint.setShader(sat);

                      canvas.drawCircle(
                              cx,
                              cy,
                              radius,
                              paint);

                      paint.setShader(null);

                      paint.setStyle(
                              Paint.Style.STROKE);

                      paint.setStrokeWidth(4);

                      paint.setColor(
                              Color.WHITE);

                      canvas.drawCircle(
                              cx,
                              cy,
                              radius,
                              paint);
                  }

                  @Override
                  public boolean onTouchEvent(
                          MotionEvent e) {

                      int action =
                              e.getAction();

                      if (action !=
                                  MotionEvent.ACTION_DOWN &&
                          action !=
                                  MotionEvent.ACTION_MOVE) {

                          return true;
                      }

                      float dx =
                              e.getX() - cx;

                      float dy =
                              e.getY() - cy;

                      float distance =
                              (float)Math.sqrt(
                                      dx * dx +
                                      dy * dy);

                      if (distance > radius)
                          return true;

                      float hue =
                              (float)(
                                  (
                                      Math.toDegrees(
                                          Math.atan2(
                                              dy,
                                              dx))
                                      + 360
                                  ) % 360);

                      float saturation =
                              Math.min(
                                      1f,
                                      distance /
                                      radius);

                      int color =
                              Color.HSVToColor(
                                  new float[]{
                                      hue,
                                      saturation,
                                      1f
                                  });

                      if (listener != null) {

                          listener.changed(
                                  Color.red(color),
                                  Color.green(color),
                                  Color.blue(color));
                      }

                      return true;
                  }
              }

              private static class ModePreviewView
                      extends View {

                  private final Paint paint =
                          new Paint(
                                  Paint.ANTI_ALIAS_FLAG);

                  private int mode = 1;
                  private int phase = 0;

                  private final Handler h =
                          new Handler(
                                  Looper.getMainLooper());

                  private final Runnable anim =
                          new Runnable() {

                      @Override
                      public void run() {

                          phase++;

                          invalidate();

                          h.postDelayed(
                                  this,
                                  180);
                      }
                  };

                  ModePreviewView(
                          Context context) {

                      super(context);

                      h.postDelayed(
                              anim,
                              180);
                  }

                  void setMode(int m) {

                      mode = Math.max(
                              1,
                              Math.min(
                                      210,
                                      m));

                      invalidate();
                  }

                  @Override
                  protected void onDetachedFromWindow() {

                      h.removeCallbacks(anim);

                      super.onDetachedFromWindow();
                  }

                  @Override
                  protected void onDraw(
                          Canvas canvas) {

                      int w =
                              getWidth();

                      int h =
                              getHeight();

                      int a =
                              Color.HSVToColor(
                                  new float[]{
                                      (mode * 31 +
                                      phase * 8)
                                      % 360,
                                      1f,
                                      1f
                                  });

                      int b =
                              Color.HSVToColor(
                                  new float[]{
                                      (mode * 31 +
                                      180 +
                                      phase * 8)
                                      % 360,
                                      1f,
                                      1f
                                  });

                      paint.setStyle(
                              Paint.Style.FILL);

                      paint.setColor(a);

                      canvas.drawRoundRect(
                              8,
                              8,
                              w / 2f - 5,
                              h - 8,
                              20,
                              20,
                              paint);

                      paint.setColor(b);

                      canvas.drawRoundRect(
                              w / 2f + 5,
                              8,
                              w - 8,
                              h - 8,
                              20,
                              20,
                              paint);

                      paint.setColor(
                              Color.WHITE);

                      paint.setTextAlign(
                              Paint.Align.CENTER);

                      paint.setTextSize(18);

                      canvas.drawText(
                              "MODE " +
                              mode +
                              " • VISUAL PREVIEW",
                              w / 2f,
                              h / 2f,
                              paint);
                  }
              }

              private static class PreviewView
                      extends View {

                  private final Paint paint =
                          new Paint(
                                  Paint.ANTI_ALIAS_FLAG);

                  private Frame frame;

                  PreviewView(Context c) {
                      super(c);
                  }

                  void setFrame(Frame f) {

                      frame = f;

                      invalidate();
                  }

                  @Override
                  protected void onDraw(
                          Canvas canvas) {

                      canvas.drawColor(
                              Color.BLACK);

                      if (frame == null)
                          return;

                      int w =
                              getWidth();

                      int h =
                              getHeight();

                      paint.setStyle(
                              Paint.Style.FILL);

                      paint.setColor(
                              Color.rgb(
                                  frame.lr,
                                  frame.lg,
                                  frame.lb));

                      canvas.drawRoundRect(
                              12,
                              18,
                              w / 2f - 8,
                              h - 18,
                              24,
                              24,
                              paint);

                      paint.setColor(
                              Color.rgb(
                                  frame.rr,
                                  frame.rg,
                                  frame.rb));

                      canvas.drawRoundRect(
                              w / 2f + 8,
                              18,
                              w - 12,
                              h - 18,
                              24,
                              24,
                              paint);

                      paint.setColor(
                              Color.WHITE);

                      paint.setTextSize(22);

                      paint.setTextAlign(
                              Paint.Align.CENTER);

                      canvas.drawText(
                              "LEFT",
                              w / 4f,
                              h / 2f,
                              paint);

                      canvas.drawText(
                              "RIGHT",
                              w * .75f,
                              h / 2f,
                              paint);
                  }
              }
          }
