              private void generateAI(
                      String command) {

                  frames.clear();

                  String s =
                          command.toLowerCase(
                                  Locale.US
                          );

                  if (s.contains("pelan") ||
                      s.contains("slow")) {

                      frames.add(
                              new Frame(
                                      255,0,0,
                                      0,0,255,
                                      1000
                              )
                      );

                      frames.add(
                              new Frame(
                                      0,0,255,
                                      255,0,0,
                                      1000
                              )
                      );

                      return;
                  }

                  if (s.contains("cepat") ||
                      s.contains("fast")) {

                      frames.add(
                              new Frame(
                                      255,0,0,
                                      0,0,255,
                                      120
                              )
                      );

                      frames.add(
                              new Frame(
                                      0,0,255,
                                      255,0,0,
                                      120
                              )
                      );

                      return;
                  }

                  if (s.contains("pelangi") ||
                      s.contains("rainbow")) {

                      int[][] c = {
                              {255,0,0},
                              {255,255,0},
                              {0,255,0},
                              {0,255,255},
                              {0,0,255},
                              {255,0,255}
                      };

                      for (int[] x : c) {

                          frames.add(
                                  new Frame(
                                          x[0],x[1],x[2],
                                          x[2],x[0],x[1],
                                          250
                                  )
                          );
                      }

                      return;
                  }

                  if (s.contains("biru")) {

                      frames.add(
                              new Frame(
                                      0,0,255,
                                      0,0,255,
                                      500
                              )
                      );

                      return;
                  }

                  if (s.contains("hijau")) {

                      frames.add(
                              new Frame(
                                      0,255,0,
                                      0,255,0,
                                      500
                              )
                      );

                      return;
                  }

                  frames.add(
                          new Frame(
                                  255,0,0,
                                  0,0,255,
                                  400
                          )
                  );

                  frames.add(
                          new Frame(
                                  0,0,255,
                                  255,0,0,
                                  400
                          )
                  );
              }

