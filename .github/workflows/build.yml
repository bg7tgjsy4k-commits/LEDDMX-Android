name: LEDDMX AI PRO FINAL

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Create Android project
        shell: bash
        run: |
          set -e

          rm -rf app build.gradle settings.gradle gradle.properties
          mkdir -p app/src/main/java/com/leddmx/pro
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "LEDDMX-AI-PRO"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=false
          android.nonTransitiveRClass=false
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.leddmx.pro'
              compileSdk 35

              defaultConfig {
                  applicationId "com.leddmx.pro"
                  minSdk 23
                  targetSdk 35
                  versionCode 20
                  versionName "20.0"
              }
          }
          EOF

          cat > app/src/main/res/values/colors.xml <<'EOF'
          <resources>
              <color name="black">#07090D</color>
              <color name="white">#FFFFFF</color>
          </resources>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">#07090D</item>
                  <item name="android:navigationBarColor">#07090D</item>
                  <item name="android:colorAccent">#4EA1FF</item>
                  <item name="android:windowActionModeOverlay">true</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.BLUETOOTH"/>
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN"/>
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>

              <uses-permission
                  android:name="android.permission.BLUETOOTH_SCAN"
                  android:usesPermissionFlags="neverForLocation"/>

              <uses-permission
                  android:name="android.permission.BLUETOOTH_CONNECT"/>

              <application
                  android:allowBackup="false"
                  android:label="LEDDMX AI PRO"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>
              </application>

          </manifest>
          EOF

          echo "Downloading official LEDDMX pattern list..."

          curl -L --fail --silent --show-error \
            https://raw.githubusercontent.com/user154lt/LEDDMX-00/main/PatternList.kt \
            -o /tmp/PatternList.kt || true

          python3 - <<'PY'
          import re
          from pathlib import Path

          src = Path("/tmp/PatternList.kt")

          names = []

          if src.exists():
              txt = src.read_text(errors="ignore")
              names = re.findall(r'"([^"]*)"', txt)

          names = names[:211]

          if len(names) < 211:
              names = ["Off"] + [f"Mode {i}" for i in range(1,211)]

          out = []
          out.append("package com.leddmx.pro;")
          out.append("")
          out.append("public final class PatternNames {")
          out.append("public static final String[] NAMES = new String[] {")

          for n in names:
              n = n.replace("\\","\\\\").replace('"','\\"')
              out.append('"' + n + '",')

          out.append("};")
          out.append("private PatternNames() {}")
          out.append("}")

          Path(
              "app/src/main/java/com/leddmx/pro/PatternNames.java"
          ).write_text("\n".join(out))

          print("PATTERN COUNT:", len(names))
          PY

          cat > app/src/main/java/com/leddmx/pro/MainActivity.java <<'EOF'
          package com.leddmx.pro;

          import android.Manifest;
          import android.app.Activity;
          import android.app.AlertDialog;
          import android.bluetooth.BluetoothAdapter;
          import android.bluetooth.BluetoothDevice;
          import android.bluetooth.BluetoothGatt;
          import android.bluetooth.BluetoothGattCallback;
          import android.bluetooth.BluetoothGattCharacteristic;
          import android.bluetooth.BluetoothGattService;
          import android.bluetooth.BluetoothManager;
          import android.bluetooth.BluetoothProfile;
          import android.bluetooth.le.BluetoothLeScanner;
          import android.bluetooth.le.ScanCallback;
          import android.bluetooth.le.ScanResult;
          import android.bluetooth.le.ScanSettings;
          import android.content.Context;
          import android.content.SharedPreferences;
          import android.content.pm.PackageManager;
          import android.graphics.Canvas;
          import android.graphics.Color;
          import android.graphics.Paint;
          import android.graphics.RadialGradient;
          import android.graphics.Shader;
          import android.graphics.SweepGradient;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.text.Editable;
          import android.text.TextWatcher;
          import android.view.Gravity;
          import android.view.MotionEvent;
          import android.view.View;
          import android.view.ViewGroup;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.FrameLayout;
          import android.widget.GridLayout;
          import android.widget.LinearLayout;
          import android.widget.PopupMenu;
          import android.widget.ScrollView;
          import android.widget.SeekBar;
          import android.widget.TextView;
          import android.widget.Toast;

          import java.util.ArrayDeque;
          import java.util.ArrayList;
          import java.util.LinkedHashMap;
          import java.util.Locale;
          import java.util.Map;
          import java.util.UUID;

          public class MainActivity extends Activity {

              private static final String SERVICE_UUID =
                      "0000FFE0-0000-1000-8000-00805F9B34FB";

              private static final String WRITE_UUID =
                      "0000FFE1-0000-1000-8000-00805F9B34FB";

              private static final String OTA_SERVICE =
                      "5833FF01-9B8B-5191-6142-22A4536EF123";

              private BluetoothAdapter adapter;
              private BluetoothLeScanner scanner;
              private BluetoothGatt gatt;
              private BluetoothGattCharacteristic writeChar;

              private boolean scanning = false;
              private boolean connected = false;

              private final Handler handler =
                      new Handler(Looper.getMainLooper());

              private final Map<String,BluetoothDevice> devices =
                      new LinkedHashMap<>();

              private final ArrayDeque<byte[]> txQueue =
                      new ArrayDeque<>();

              private boolean txBusy = false;

              private LinearLayout content;
              private FrameLayout rootFrame;
              private TextView connectionLabel;

              private SharedPreferences prefs;

              private int red = 255;
              private int green = 0;
              private int blue = 0;

              private int brightness = 100;
              private int speed = 50;
              private int selectedMode = 1;

              private int customSlot = 171;

              private final ArrayList<Frame> frames =
                      new ArrayList<>();

              private final ArrayList<String> analyzerLog =
                      new ArrayList<>();

              private final Runnable stopScanRunnable =
                      new Runnable() {
                          @Override
                          public void run() {
                              stopScan();
                              if (!devices.isEmpty()) {
                                  showDeviceDialog();
                              } else {
                                  toast(
                                      "Tidak ditemukan LEDDMX. Pastikan modul aktif."
                                  );
                              }
                          }
                      };

              private final ScanCallback scanCallback =
                      new ScanCallback() {

                          @Override
                          public void onScanResult(
                                  int callbackType,
                                  ScanResult result) {

                              BluetoothDevice device =
                                      result.getDevice();

                              String name = null;

                              if (result.getScanRecord() != null) {
                                  name =
                                      result.getScanRecord()
                                          .getDeviceName();
                              }

                              if (name == null) {
                                  try {
                                      name = device.getName();
                                  } catch (Exception ignored) {}
                              }

                              if (name == null) {
                                  name = "";
                              }

                              String u =
                                  name.toUpperCase(Locale.US);

                              if (u.contains("LEDDMX") ||
                                  u.contains("LED LAMP")) {

                                  devices.put(
                                      device.getAddress(),
                                      device
                                  );

                                  runOnUiThread(() ->
                                      connectionLabel.setText(
                                          "FOUND " +
                                          devices.size() +
                                          " DEVICE"
                                      )
                                  );
                              }
                          }

                          @Override
                          public void onScanFailed(int errorCode) {
                              scanning = false;

                              runOnUiThread(() ->
                                  toast(
                                      "Bluetooth scan error: " +
                                      scanError(errorCode)
                                  )
                              );
                          }
                      };

              @Override
              protected void onCreate(Bundle state) {
                  super.onCreate(state);

                  prefs =
                      getSharedPreferences(
                          "leddmx_pro",
                          MODE_PRIVATE
                      );

                  red = prefs.getInt("r",255);
                  green = prefs.getInt("g",0);
                  blue = prefs.getInt("b",0);

                  brightness =
                      prefs.getInt("brightness",100);

                  speed =
                      prefs.getInt("speed",50);

                  selectedMode =
                      prefs.getInt("mode",1);

                  BluetoothManager manager =
                      (BluetoothManager)
                      getSystemService(
                          Context.BLUETOOTH_SERVICE
                      );

                  if (manager != null) {
                      adapter = manager.getAdapter();
                  }

                  if (adapter != null) {
                      scanner = adapter.getBluetoothLeScanner();
                  }

                  showHome();
              }

              @Override
              protected void onDestroy() {
                  handler.removeCallbacksAndMessages(null);

                  try {
                      if (scanner != null && scanning) {
                          scanner.stopScan(scanCallback);
                      }
                  } catch(Exception ignored){}

                  try {
                      if (gatt != null) {
                          gatt.disconnect();
                          gatt.close();
                      }
                  } catch(Exception ignored){}

                  super.onDestroy();
              }

              private boolean permissionOK() {

                  if (Build.VERSION.SDK_INT >= 31) {

                      return checkSelfPermission(
                          Manifest.permission.BLUETOOTH_SCAN
                      ) == PackageManager.PERMISSION_GRANTED
                      &&
                      checkSelfPermission(
                          Manifest.permission.BLUETOOTH_CONNECT
                      ) == PackageManager.PERMISSION_GRANTED;

                  }

                  return checkSelfPermission(
                      Manifest.permission.ACCESS_FINE_LOCATION
                  ) == PackageManager.PERMISSION_GRANTED;
              }

              private void requestBluetoothPermission() {

                  if (Build.VERSION.SDK_INT >= 31) {

                      requestPermissions(
                          new String[]{
                              Manifest.permission.BLUETOOTH_SCAN,
                              Manifest.permission.BLUETOOTH_CONNECT
                          },
                          500
                      );

                  } else {

                      requestPermissions(
                          new String[]{
                              Manifest.permission.ACCESS_FINE_LOCATION
                          },
                          501
                      );
                  }
              }

              @Override
              public void onRequestPermissionsResult(
                      int requestCode,
                      String[] permissions,
                      int[] results) {

                  super.onRequestPermissionsResult(
                      requestCode,
                      permissions,
                      results
                  );

                  if (requestCode == 500 ||
                      requestCode == 501) {

                      if (permissionOK()) {
                          handler.postDelayed(
                              () -> startScan(),
                              250
                          );
                      } else {
                          toast(
                              "Izin Bluetooth belum diberikan."
                          );
                      }
                  }
              }

              private String scanError(int code) {

                  switch(code) {
                      case 1:
                          return "ALREADY_STARTED";
                      case 2:
                          return "APPLICATION_REGISTRATION_FAILED";
                      case 3:
                          return "INTERNAL_ERROR";
                      case 4:
                          return "FEATURE_UNSUPPORTED";
                      case 5:
                          return "OUT_OF_HARDWARE_RESOURCES";
                      case 6:
                          return "SCANNING_TOO_FREQUENTLY";
                      default:
                          return "ERROR " + code;
                  }
              }

              private void startScan() {

                  if (adapter == null) {
                      toast("Bluetooth tidak tersedia.");
                      return;
                  }

                  if (!permissionOK()) {
                      requestBluetoothPermission();
                      return;
                  }

                  try {
                      if (!adapter.isEnabled()) {
                          toast(
                              "Nyalakan Bluetooth terlebih dahulu."
                          );
                          return;
                      }
                  } catch(Exception e) {
                      toast("Bluetooth tidak siap.");
                      return;
                  }

                  if (scanning) return;

                  if (scanner == null) {
                      scanner =
                          adapter.getBluetoothLeScanner();
                  }

                  if (scanner == null) {
                      toast("BLE scanner tidak tersedia.");
                      return;
                  }

                  devices.clear();
                  scanning = true;

                  connectionLabel.setText("SCANNING...");

                  try {

                      ScanSettings settings =
                          new ScanSettings.Builder()
                              .setScanMode(
                                  ScanSettings.SCAN_MODE_LOW_LATENCY
                              )
                              .build();

                      scanner.startScan(
                          null,
                          settings,
                          scanCallback
                      );

                      handler.removeCallbacks(
                          stopScanRunnable
                      );

                      handler.postDelayed(
                          stopScanRunnable,
                          8500
                      );

                  } catch(Exception e) {

                      scanning = false;

                      toast(
                          "Gagal memulai scan: " +
                          e.getMessage()
                      );
                  }
              }

              private void stopScan() {

                  if (!scanning) return;

                  scanning = false;

                  try {
                      if (scanner != null) {
                          scanner.stopScan(scanCallback);
                      }
                  } catch(Exception ignored){}

                  handler.removeCallbacks(
                      stopScanRunnable
                  );
              }

              private void showDeviceDialog() {

                  final ArrayList<BluetoothDevice> list =
                      new ArrayList<>(
                          devices.values()
                      );

                  String[] names =
                      new String[list.size()];

                  for (int i=0;i<list.size();i++) {

                      BluetoothDevice d = list.get(i);

                      String name = null;

                      try {
                          name = d.getName();
                      } catch(Exception ignored){}

                      if (name == null ||
                          name.trim().isEmpty()) {
                          name = "LEDDMX DEVICE";
                      }

                      names[i] =
                          name +
                          "\n" +
                          d.getAddress();
                  }

                  new AlertDialog.Builder(this)
                      .setTitle(
                          "PILIH DEVICE LEDDMX"
                      )
                      .setItems(
                          names,
                          (dialog, which) ->
                              connect(list.get(which))
                      )
                      .setNegativeButton(
                          "CANCEL",
                          null
                      )
                      .show();
              }

              private void connect(
                      BluetoothDevice device) {

                  stopScan();

                  try {
                      if (gatt != null) {
                          gatt.close();
                      }
                  } catch(Exception ignored){}

                  connected = false;
                  writeChar = null;

                  String name = "";

                  try {
                      name = device.getName();
                  } catch(Exception ignored){}

                  toast(
                      "Connecting " +
                      (name == null ? "LEDDMX" : name)
                  );

                  try {

                      gatt =
                          device.connectGatt(
                              this,
                              false,
                              new BluetoothGattCallback() {

                                  @Override
                                  public void onConnectionStateChange(
                                          BluetoothGatt g,
                                          int status,
                                          int newState) {

                                      if (newState ==
                                          BluetoothProfile.STATE_CONNECTED) {

                                          gatt = g;

                                          runOnUiThread(() -> {
                                              connected = true;
                                              connectionLabel.setText(
                                                  "CONNECTED"
                                              );
                                              toast(
                                                  "LEDDMX CONNECTED"
                                              );
                                          });

                                          try {
                                              g.discoverServices();
                                          } catch(Exception ignored){}
                                      }

                                      if (newState ==
                                          BluetoothProfile.STATE_DISCONNECTED) {

                                          connected = false;
                                          writeChar = null;

                                          runOnUiThread(() -> {
                                              connectionLabel.setText(
                                                  "DISCONNECTED"
                                              );
                                          });
                                      }
                                  }

                                  @Override
                                  public void onServicesDiscovered(
                                          BluetoothGatt g,
                                          int status) {

                                      BluetoothGattService service =
                                          g.getService(
                                              UUID.fromString(
                                                  SERVICE_UUID
                                              )
                                          );

                                      if (service != null) {

                                          BluetoothGattCharacteristic c =
                                              service.getCharacteristic(
                                                  UUID.fromString(
                                                      WRITE_UUID
                                                  )
                                              );

                                          writeChar = c;

                                          runOnUiThread(() ->
                                              toast(
                                                  c != null
                                                  ? "FFE1 READY"
                                                  : "FFE1 TIDAK DITEMUKAN"
                                              )
                                          );
                                      }

                                      dumpGatt(g);
                                  }

                                  @Override
                                  public void onCharacteristicChanged(
                                          BluetoothGatt g,
                                          BluetoothGattCharacteristic c) {

                                      logRx(c.getValue());
                                  }

                                  @Override
                                  public void onCharacteristicRead(
                                          BluetoothGatt g,
                                          BluetoothGattCharacteristic c,
                                          int status) {

                                      logRx(c.getValue());
                                  }
                              }
                          );

                  } catch(Exception e) {

                      toast(
                          "Connect gagal: " +
                          e.getMessage()
                      );
                  }
              }

              private void dumpGatt(
                      BluetoothGatt g) {

                  analyzerLog.clear();

                  try {

                      for (BluetoothGattService s :
                           g.getServices()) {

                          analyzerLog.add(
                              "SERVICE  " +
                              s.getUuid()
                          );

                          for (BluetoothGattCharacteristic c :
                               s.getCharacteristics()) {

                              analyzerLog.add(
                                  "  CHAR   " +
                                  c.getUuid() +
                                  " PROP=" +
                                  c.getProperties()
                              );
                          }
                      }

                      runOnUiThread(() -> {
                          if (content != null) {
                              connectionLabel.setText(
                                  "CONNECTED • GATT READY"
                              );
                          }
                      });

                  } catch(Exception ignored){}
              }

              private void logRx(byte[] data) {

                  if (data == null) return;

                  StringBuilder sb =
                      new StringBuilder("RX  ");

                  for(byte b:data) {
                      sb.append(
                          String.format(
                              Locale.US,
                              "%02X ",
                              b & 0xFF
                          )
                      );
                  }

                  analyzerLog.add(sb.toString());
              }

              private void enqueue(
                      byte[] packet) {

                  if (!connected ||
                      gatt == null ||
                      writeChar == null) {

                      toast("LEDDMX belum connected.");
                      return;
                  }

                  synchronized(txQueue) {
                      txQueue.add(packet);
                  }

                  pumpTX();
              }

              private void pumpTX() {

                  if (txBusy) return;

                  byte[] packet;

                  synchronized(txQueue) {
                      packet = txQueue.poll();
                  }

                  if (packet == null) return;

                  txBusy = true;

                  try {

                      int props =
                          writeChar.getProperties();

                      if ((props &
                          BluetoothGattCharacteristic.PROPERTY_WRITE_NO_RESPONSE)
                          != 0) {

                          writeChar.setWriteType(
                              BluetoothGattCharacteristic
                                  .WRITE_TYPE_NO_RESPONSE
                          );

                      } else {

                          writeChar.setWriteType(
                              BluetoothGattCharacteristic
                                  .WRITE_TYPE_DEFAULT
                          );
                      }

                      writeChar.setValue(packet);

                      gatt.writeCharacteristic(
                          writeChar
                      );

                  } catch(Exception e) {

                      txBusy = false;

                      handler.postDelayed(
                          this::pumpTX,
                          100
                      );

                      return;
                  }

                  handler.postDelayed(() -> {

                      txBusy = false;
                      pumpTX();

                  }, 85);
              }

              private byte[] powerPacket(
                      boolean on) {

                  /*
                   * LEDDMX-00 dialect used by this app.
                   * Default follows the user's known-working
                   * 01/00 power command.
                   */

                  return new byte[]{
                      0x7B,
                      (byte)0xFF,
                      0x04,
                      (byte)(on ? 0x01 : 0x00),
                      (byte)0xFF,
                      (byte)0xFF,
                      (byte)0xFF,
                      (byte)0xFF,
                      (byte)0xBF
                  };
              }

              private byte[] modePacket(
                      int mode) {

                  return new byte[]{
                      0x7B,
                      (byte)0xFF,
                      0x03,
                      (byte)Math.max(
                          0,
                          Math.min(210,mode)
                      ),
                      (byte)0xFF,
                      (byte)0xFF,
                      (byte)0xFF,
                      (byte)0xFF,
                      (byte)0xBF
                  };
              }

              private byte[] colorPacket(
                      int r,
                      int g,
                      int b) {

                  return new byte[]{
                      0x7B,
                      (byte)0xFF,
                      0x07,
                      (byte)clamp(r),
                      (byte)clamp(g),
                      (byte)clamp(b),
                      0x00,
                      (byte)0xFF,
                      (byte)0xBF
                  };
              }

              private byte[] brightnessPacket(
                      int pct) {

                  pct = clamp100(pct);

                  int adjusted =
                      (pct * 32) / 100;

                  return new byte[]{
                      0x7B,
                      (byte)0xFF,
                      0x01,
                      (byte)adjusted,
                      (byte)pct,
                      0x00,
                      (byte)0xFF,
                      (byte)0xFF,
                      (byte)0xBF
                  };
              }

              private byte[] speedPacket(
                      int value) {

                  value = clamp(value);

                  return new byte[]{
                      0x7B,
                      (byte)0xFF,
                      0x02,
                      (byte)value,
                      0x00,
                      (byte)0xFF,
                      (byte)0xFF,
                      (byte)0xFF,
                      (byte)0xBF
                  };
              }

              private byte[] directionPacket(
                      boolean reverse) {

                  return new byte[]{
                      0x7B,
                      (byte)0xFF,
                      0x0D,
                      (byte)(reverse ? 1 : 0),
                      (byte)0xFF,
                      (byte)0xFF,
                      (byte)0xFF,
                      (byte)0xFF,
                      (byte)0xBF
                  };
              }

              private byte[] customColorPacket(
                      int position,
                      int total,
                      int r,
                      int g,
                      int b) {

                  return new byte[]{
                      0x7B,
                      (byte)position,
                      0x0E,
                      (byte)0xFD,
                      (byte)clamp(r),
                      (byte)clamp(g),
                      (byte)clamp(b),
                      (byte)total,
                      (byte)0xBF
                  };
              }

              private byte[] customModePacket(
                      int ordinal) {

                  return new byte[]{
                      0x7B,
                      (byte)0xFF,
                      0x13,
                      (byte)ordinal,
                      (byte)0xFF,
                      (byte)0xFF,
                      (byte)0xFF,
                      (byte)0xFF,
                      (byte)0xBF
                  };
              }

              private int clamp(int v) {
                  return Math.max(0,Math.min(255,v));
              }

              private int clamp100(int v) {
                  return Math.max(0,Math.min(100,v));
              }

              private void sendPower(
                      boolean on) {

                  enqueue(powerPacket(on));
              }

              private void sendMode(
                      int mode) {

                  selectedMode = mode;

                  prefs.edit()
                      .putInt("mode",mode)
                      .apply();

                  enqueue(modePacket(mode));
              }

              private void sendColor() {

                  prefs.edit()
                      .putInt("r",red)
                      .putInt("g",green)
                      .putInt("b",blue)
                      .apply();

                  enqueue(
                      colorPacket(
                          red,
                          green,
                          blue
                      )
                  );
              }

              private void sendBrightness(
                      int pct) {

                  brightness = pct;

                  prefs.edit()
                      .putInt("brightness",pct)
                      .apply();

                  enqueue(
                      brightnessPacket(pct)
                  );
              }

              private void disconnect() {

                  stopScan();

                  try {
                      if (gatt != null) {
                          gatt.disconnect();
                          gatt.close();
                      }
                  } catch(Exception ignored){}

                  gatt = null;
                  writeChar = null;
                  connected = false;

                  connectionLabel.setText(
                      "DISCONNECTED"
                  );
              }

