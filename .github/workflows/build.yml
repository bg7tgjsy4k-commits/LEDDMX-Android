name: Build LEDDMX Pro FINAL

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build LEDDMX Pro
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 7.6.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.6.1'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 33
        shell: bash
        run: |
          set -e
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT"
          adb version || true

      - name: Create clean Android project
        shell: bash
        run: |
          set -e

          rm -rf LEDDMX-Android
          mkdir -p LEDDMX-Android/app/src/main/java/com/leddmx/pro
          mkdir -p LEDDMX-Android/app/src/main/res/values
          mkdir -p LEDDMX-Android/app/src/main/res/drawable
          cd LEDDMX-Android

          cat > settings.gradle <<'EOF'
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = "LEDDMX-Pro"
include(":app")
EOF

          cat > build.gradle <<'EOF'
plugins {
    id 'com.android.application' version '7.4.2' apply false
}
EOF

          cat > gradle.properties <<'EOF'
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=false
android.enableJetifier=false
EOF

          cat > app/build.gradle <<'EOF'
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.leddmx.pro'
    compileSdk 33

    defaultConfig {
        applicationId 'com.leddmx.pro'
        minSdk 21
        targetSdk 33
        versionCode 100
        versionName '1.0.0-FINAL'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
        }

        debug {
            minifyEnabled false
        }
    }
}
EOF

          cat > app/src/main/res/values/colors.xml <<'EOF'
<resources>
    <color name="black">#05070A</color>
    <color name="white">#FFFFFF</color>
</resources>
EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
<resources>
    <style name="AppTheme" parent="android:style/Theme.Material.NoActionBar">
        <item name="android:fontFamily">sans</item>
        <item name="android:windowLightStatusBar">false</item>
        <item name="android:statusBarColor">#05070A</item>
        <item name="android:navigationBarColor">#05070A</item>
        <item name="android:colorAccent">#25D366</item>
        <item name="android:windowActionModeOverlay">true</item>
    </style>
</resources>
EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
<manifest xmlns:android="http://schemas.android.com/apk/res/android">

    <uses-feature
        android:name="android.hardware.bluetooth_le"
        android:required="false" />

    <uses-permission android:name="android.permission.BLUETOOTH" />
    <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" />

    <uses-permission
        android:name="android.permission.BLUETOOTH_SCAN"
        android:usesPermissionFlags="neverForLocation" />

    <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />

    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />

    <application
        android:allowBackup="false"
        android:label="LEDDMX Pro"
        android:theme="@style/AppTheme"
        android:supportsRtl="true">

        <activity
            android:name=".MainActivity"
            android:screenOrientation="portrait"
            android:exported="true">

            <intent-filter>
                <action android:name="android.intent.action.MAIN" />
                <category android:name="android.intent.category.LAUNCHER" />
            </intent-filter>

        </activity>
    </application>
</manifest>
EOF

      - name: Get exact LEDDMX mode names
        shell: bash
        run: |
          set -e
          cd LEDDMX-Android

          curl -fsSL \
            "https://raw.githubusercontent.com/user154lt/LEDDMX-00/main/PatternList.kt" \
            -o /tmp/PatternList.kt || true

          python3 <<'PY'
          import re
          from pathlib import Path

          src = Path("/tmp/PatternList.kt")

          names = []

          if src.exists():
              text = src.read_text(errors="ignore")
              names = re.findall(r'"((?:\\.|[^"\\])*)"', text)

          # The upstream source contains 211 entries: indexes 0..210.
          # Keep exact upstream names when available.
          if len(names) < 211:
              names = ["Off"] + [f"Mode {i}" for i in range(1, 211)]
          else:
              names = names[:211]

          out = Path("app/src/main/java/com/leddmx/pro/Patterns.java")

          with out.open("w", encoding="utf-8") as f:
              f.write("package com.leddmx.pro;\n\n")
              f.write("public final class Patterns {\n")
              f.write("    private Patterns() {}\n")
              f.write("    public static final String[] NAMES = new String[] {\n")

              for i, name in enumerate(names):
                  name = name.replace("\\", "\\\\").replace('"', '\\"')
                  f.write(f'        "{name}"')
                  if i != len(names) - 1:
                      f.write(",")
                  f.write("\n")

              f.write("    };\n")
              f.write("}\n")
          PY

          echo "Generated mode table:"
          wc -l app/src/main/java/com/leddmx/pro/Patterns.java

      - name: Write MainActivity
        shell: bash
        run: |
          set -e
          cd LEDDMX-Android

          cat > app/src/main/java/com/leddmx/pro/MainActivity.java <<'EOF'
package com.leddmx.pro;

import android.Manifest;
import android.app.Activity;
import android.bluetooth.BluetoothAdapter;
import android.bluetooth.BluetoothDevice;
import android.bluetooth.BluetoothGatt;
import android.bluetooth.BluetoothGattCallback;
import android.bluetooth.BluetoothGattCharacteristic;
import android.bluetooth.BluetoothGattDescriptor;
import android.bluetooth.BluetoothGattService;
import android.bluetooth.le.BluetoothLeScanner;
import android.bluetooth.le.ScanCallback;
import android.bluetooth.le.ScanResult;
import android.bluetooth.le.ScanSettings;
import android.content.ClipData;
import android.content.ClipboardManager;
import android.content.Context;
import android.content.pm.PackageManager;
