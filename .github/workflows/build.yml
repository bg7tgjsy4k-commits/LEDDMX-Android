              private void generateOfflineAI(
                      String input
              ) {

                  String q =
                          input.toLowerCase(
                                  Locale.US
                          );

                  if (q.contains("rainbow")
                          || q.contains("pelangi")) {

                      loadTemplate("Rainbow");

                  } else if (q.contains("police")
                          || q.contains("polisi")) {

                      loadTemplate("Police");

                  } else if (q.contains("fire")
                          || q.contains("api")) {

                      loadTemplate("Fire");

                  } else if (q.contains("water")
                          || q.contains("air")) {

                      loadTemplate("Water");

                  } else if (q.contains("belang")
                          || q.contains("stripe")) {

                      loadTemplate("Belang");

                  } else if (q.contains("strobe")
                          || q.contains("kedip")) {

                      loadTemplate("Strobe");

                  } else if (q.contains("chase")
                          || q.contains("kejar")) {

                      loadTemplate("Chase");

                  } else if (q.contains("wave")
                          || q.contains("gelombang")) {

                      loadTemplate("Wave");

                  } else if (q.contains("comet")
                          || q.contains("komet")) {

                      loadTemplate("Comet");

                  } else if (q.contains("scanner")
                          || q.contains("scan")) {

                      loadTemplate("Scanner");

                  } else if (q.contains("mirror")
                          || q.contains("cermin")) {

                      loadTemplate("Mirror");

                  } else {

                      loadTemplate("Color Cycle");
                  }

                  if (q.contains("merah")
                          || q.contains("red")) {

                      applyPrimaryColor(
                              Color.RED
                      );

                  } else if (q.contains("hijau")
                          || q.contains("green")) {

                      applyPrimaryColor(
                              Color.GREEN
                      );

                  } else if (q.contains("biru")
                          || q.contains("blue")) {

                      applyPrimaryColor(
                              Color.BLUE
                      );

                  } else if (q.contains("kuning")
                          || q.contains("yellow")) {

                      applyPrimaryColor(
                              Color.YELLOW
                      );

                  } else if (q.contains("ungu")
                          || q.contains("purple")) {

                      applyPrimaryColor(
                              Color.MAGENTA
                      );

                  } else if (q.contains("putih")
                          || q.contains("white")) {

                      applyPrimaryColor(
                              Color.WHITE
                      );
                  }
              }

              private void applyPrimaryColor(
                      int color
              ) {

                  for (AnimFrame frame : timeline) {

                      frame.leftColor = color;
                  }
              }

