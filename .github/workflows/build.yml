                          button("SEND HEX");

                  send.setOnClickListener(v -> {

                      try {

                          String[] p =
                              input.getText()
                                  .toString()
                                  .trim()
                                  .split("\\s+");

                          if (p.length == 0)
                              throw new Exception();

                          byte[] data =
                                  new byte[p.length];

                          for (int i = 0;
                               i < p.length;
                               i++) {

                              data[i] =
                                  (byte)
                                  Integer.parseInt(
                                      p[i],
                                      16);
                          }

                          send(data);

                      } catch (Exception e) {

                          toast(
                                  "HEX tidak valid.");
                      }
                  });

                  add(send);
              }

              private void disconnect() {

                  try {

                      if (gatt != null) {
                          gatt.disconnect();
                          gatt.close();
                      }

                  } catch (Exception ignored) {}

                  gatt = null;
                  writeChar = null;
                  connected = false;

                  status("DISCONNECTED");

                  toast("BLE disconnected.");
              }

              private Frame defaultFrame() {

                  return new Frame(
                          255, 0, 0,
                          0, 0, 255,
                          300);
              }

              private int clamp(int v) {

                  return Math.max(
                          0,
                          Math.min(255, v));
              }

              private EditText number(int value) {

                  EditText e =
                          new EditText(this);

                  e.setText(
                          String.valueOf(value));

                  e.setTextColor(
                          Color.WHITE);

                  e.setHintTextColor(
                          Color.GRAY);

                  e.setInputType(
                          InputType.TYPE_CLASS_NUMBER);

                  return e;
              }

              private int value(EditText e) {

                  try {

                      return clamp(
                              Integer.parseInt(
                                  e.getText()
                                   .toString()));

                  } catch (Exception ignored) {

                      return 0;
                  }
              }

