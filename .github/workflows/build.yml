        private fun makeWheel() {
            val w = wheel.width
            val h = wheel.height
            val cx = w / 2f
            val cy = h / 2f
            val r = min(cx, cy) - 2f

            val pixels = IntArray(w * h)

            for (y in 0 until h) {
                for (x in 0 until w) {
                    val dx = x - cx
                    val dy = y - cy
                    val d = sqrt(dx * dx + dy * dy)

                    if (d <= r) {
                        val sat = (d / r).coerceIn(0f, 1f)
                        var hue =
                            Math.toDegrees(
                                atan2(dy.toDouble(), dx.toDouble())
                            ).toFloat() + 90f

                        if (hue < 0) hue += 360f

                        pixels[y * w + x] =
                            Color.HSVToColor(
                                floatArrayOf(
                                    hue,
                                    sat,
                                    1f
                                )
                            )
                    } else {
                        pixels[y * w + x] = Color.TRANSPARENT
                    }
                }
            }

            wheel.setPixels(
                pixels,
                0,
                w,
                0,
                0,
                w,
                h
            )

            wheelReady = true
        }

        fun logDevice(s: String) {
            val stamp =
                String.format(
                    Locale.US,
                    "%02d:%02d:%02d",
                    Calendar.getInstance().get(Calendar.HOUR_OF_DAY),
                    Calendar.getInstance().get(Calendar.MINUTE),
                    Calendar.getInstance().get(Calendar.SECOND)
                )

            logs.add("$stamp  $s")

            if (logs.size > 350) {
                logs.removeAt(0)
            }

            invalidate()
        }

        override fun onDraw(c: Canvas) {
            super.onDraw(c)

            c.drawColor(bg)

            drawTop(c)

            when (page) {
                Page.HOME -> drawHome(c)
                Page.EFFECTS -> drawEffects(c)
                Page.CUSTOM -> drawCustom(c)
                Page.ANALYZER -> drawAnalyzer(c)
                Page.PROTOCOL -> drawProtocol(c)
                Page.SETTINGS -> drawSettings(c)
            }

            if (drawer) {
                drawDrawer(c)
            }

            previewPhase += 0.025f

            if (page == Page.HOME ||
                page == Page.CUSTOM ||
                page == Page.EFFECTS
            ) {
                postInvalidateDelayed(32)
            }
        }

