    }

    void buildDrawer() {

        LinearLayout d =
                col();

        d.setPadding(
                20,
                55,
                20,
                20
        );

        d.setBackgroundColor(
                Color.rgb(
                        10,
                        13,
                        17
                )
        );

        TextView logo =
                txt(
                        "LEDDMX PRO",
                        25,
                        TEXT
                );

        logo.setTypeface(
                null,
                1
        );

        d.addView(logo);

        d.addView(
                txt(
                        "BLE • RGB • 210 EFFECTS",
                        11,
                        GREEN
                )
        );

        String[] pages = {

                "Home",

                "210 Effects",

                "Custom Studio",

                "Slots 171–210",

                "Module / MCU Analyzer",

                "Protocol Lab",

                "GATT / BLE Inspector",

                "AI Scene Composer",

                "OTA / Firmware",

                "Settings"
        };

        for(String s : pages) {

            Button b =
                    btn(s);

            b.setGravity(
                    Gravity.START |
                    Gravity.CENTER_VERTICAL
            );

            b.setPadding(
                    18,
                    0,
                    8,
                    0
            );

            b.setOnClickListener(
                    v -> {

                        page = s;

                        drawer.close();

                        if(
                                s.equals("Home")
                        )
                            showHome();

                        else if(
                                s.equals("210 Effects")
                        )
                            showEffects();

                        else if(
                                s.equals("Custom Studio")
                        )
                            showCustom();

                        else if(
                                s.startsWith("Slots")
                        )
                            showSlots();

                        else if(
                                s.startsWith("Module")
                        )
                            showAnalyzer();

                        else if(
                                s.startsWith("Protocol")
                        )
                            showProtocol();

                        else if(
                                s.startsWith("GATT")
                        )
                            showGatt();

                        else if(
                                s.startsWith("AI")
                        )
                            showAI();

                        else if(
                                s.startsWith("OTA")
                        )
                            showOta();

                        else
                            showSettings();
                    }
            );

            d.addView(
                    b,
                    new LinearLayout.LayoutParams(
                            -1,
                            52
                    )
            );
        }

        drawer.addDrawer(d);
    }

    void requestBle() {

        if(Build.VERSION.SDK_INT >= 31) {

            if(
                    checkSelfPermission(
                            Manifest.permission.BLUETOOTH_SCAN
                    )
                    != PackageManager.PERMISSION_GRANTED

                    ||

                    checkSelfPermission(
                            Manifest.permission.BLUETOOTH_CONNECT
                    )
                    != PackageManager.PERMISSION_GRANTED
            ) {

                requestPermissions(
                        new String[]{
                                Manifest.permission.BLUETOOTH_SCAN,
                                Manifest.permission.BLUETOOTH_CONNECT
                        },
                        20
                );

            } else {

                initBle();
            }

        } else if(
                Build.VERSION.SDK_INT >= 23

                &&

                checkSelfPermission(
                        Manifest.permission.ACCESS_FINE_LOCATION
                )
                != PackageManager.PERMISSION_GRANTED
        ) {

            requestPermissions(
                    new String[]{
                            Manifest.permission.ACCESS_FINE_LOCATION
                    },
                    21
            );

        } else {

            initBle();
        }
    }

    @Override
    public void onRequestPermissionsResult(
            int r,
            String[] p,
            int[] g
    ) {

        super.onRequestPermissionsResult(
                r,
                p,
                g
        );

        if(r == 20 || r == 21) {

            handler.postDelayed(
                    this::initBle,
                    250
            );
        }
    }

    void initBle() {

        BluetoothManager bm =
                (BluetoothManager)
                        getSystemService(
                                BLUETOOTH_SERVICE
                        );

        adapter =
                bm.getAdapter();

        if(adapter == null) {

            setStatus(
                    "BLE NOT AVAILABLE",
                    Color.RED
            );

            return;
        }

        if(!adapter.isEnabled()) {

            setStatus(
                    "BLUETOOTH OFF • TAP",
                    Color.YELLOW
            );

            try {

                startActivity(
                        new Intent(
                                BluetoothAdapter.ACTION_REQUEST_ENABLE
                        )
                );

            } catch(Exception ignored) {}

        } else {

            scanner =
                    adapter.getBluetoothLeScanner();

            setStatus(
                    "READY • Tap SCAN",
                    GREEN
            );
        }
    }

    void setStatus(
            String s,
            int c
    ) {

        if(status != null) {

            status.setText(s);

            status.setTextColor(c);
        }
    }

    void showHome() {

        clear();

        add(
                h2("DEVICE")
        );

        LinearLayout scan =
                row();

        Button sb =
