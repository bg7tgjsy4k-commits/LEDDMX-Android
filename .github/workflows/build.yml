name: Build LEDDMX Pro AI FINAL

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build LEDDMX Pro AI
    runs-on: ubuntu-latest

    env:
      ANDROID_COMPILE_SDK: "34"
      ANDROID_BUILD_TOOLS: "34.0.0"

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: |
          set -e
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" \
                     "platforms;android-${ANDROID_COMPILE_SDK}" \
                     "build-tools;${ANDROID_BUILD_TOOLS}"

      - name: Create project files directly at workspace root
        shell: bash
        run: |
          set -e
          cd $GITHUB_WORKSPACE

          mkdir -p app/src/main/java/com/leddmx/pro
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "LEDDMX-Pro-AI"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }

              dependencies {
                  classpath "com.android.tools.build:gradle:8.3.0"
              }
          }

          tasks.register("clean", Delete) {
              delete rootProject.buildDir
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          org.gradle.daemon=false
          org.gradle.parallel=false
          org.gradle.caching=true
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.leddmx.pro'
              compileSdk 34

              defaultConfig {
                  applicationId 'com.leddmx.pro'
                  minSdk 21
                  targetSdk 34
                  versionCode 307
                  versionName '3.0.7-AI-FINAL'
              }

              buildTypes {
                  debug {
                      minifyEnabled false
                      debuggable true
                  }

                  release {
                      minifyEnabled false
                      shrinkResources false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat << 'EOF' > app/proguard-rules.pro
          EOF

          cat << 'EOF' > app/src/main/res/values/colors.xml
          <resources>
              <color name="black">#080A0D</color>
              <color name="white">#FFFFFF</color>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">LEDDMX Pro AI</string>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/values/styles.xml
          <resources>
              <style name="AppTheme" parent="@android:style/Theme.Material.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">#080A0D</item>
                  <item name="android:navigationBarColor">#080A0D</item>
                  <item name="android:colorAccent">#35E36F</item>
                  <item name="android:windowActionModeOverlay">true</item>
              </style>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-feature
                  android:name="android.hardware.bluetooth_le"
                  android:required="false" />

              <uses-permission android:name="android.permission.BLUETOOTH" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" />
              <uses-permission android:name="android.permission.BLUETOOTH_SCAN" />
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:theme="@style/AppTheme"
                  android:label="LEDDMX Pro AI"
                  android:allowBackup="false"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="true">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/leddmx/pro/Patterns.java
          package com.leddmx.pro;

          public final class Patterns {
              public static final String[] NAMES = new String[211];
              static {
                  NAMES[0] = "Off";
                  for (int i = 1; i <= 210; i++) {
                      NAMES[i] = "Mode " + String.format("%03d", i);
                  }
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/leddmx/pro/MainActivity.java
          package com.leddmx.pro;

          import android.Manifest;
          import android.app.Activity;
          import android.bluetooth.BluetoothAdapter;
          import android.bluetooth.BluetoothDevice;
          import android.bluetooth.BluetoothGatt;
          import android.bluetooth.BluetoothGattCallback;
          import android.bluetooth.BluetoothGattCharacteristic;
          import android.bluetooth.BluetoothGattService;
          import android.bluetooth.BluetoothManager;
          import android.bluetooth.le.BluetoothLeScanner;
          import android.bluetooth.le.ScanCallback;
          import android.bluetooth.le.ScanResult;
          import android.bluetooth.le.ScanSettings;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.graphics.Canvas;
          import android.graphics.Color;
          import android.graphics.Paint;
          import android.graphics.RectF;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.provider.Settings;
          import android.view.Gravity;
          import android.view.MotionEvent;
          import android.view.View;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import android.widget.Toast;

          import java.util.ArrayList;
          import java.util.LinkedHashMap;
          import java.util.List;
          import java.util.Locale;
          import java.util.UUID;

          public class MainActivity extends Activity {

              private static final int REQ_BT = 5001;

              private static final UUID SERVICE_FFE0 =
                      UUID.fromString("0000FFE0-0000-1000-8000-00805F9B34FB");

              private static final UUID WRITE_FFE1 =
                      UUID.fromString("0000FFE1-0000-1000-8000-00805F9B34FB");

              private static final UUID OTA_SERVICE =
                      UUID.fromString("5833FF01-9B8B-5191-6142-22A4536EF123");

              private BluetoothAdapter adapter;
              private BluetoothLeScanner scanner;
              private BluetoothGatt gatt;
              private BluetoothGattCharacteristic writeCharacteristic;

              private final Handler handler = new Handler(Looper.getMainLooper());

              private boolean scanning = false;

              private final LinkedHashMap<String, BluetoothDevice> foundDevices =
                      new LinkedHashMap<>();

              private LinearLayout root;
              private LinearLayout content;
              private ScrollView contentScroll;
              private LinearLayout drawer;
              private TextView status;
              private TextView deviceCount;
              private ModePreviewView preview;

              private int red = 255;
              private int green = 0;
              private int blue = 40;

              private int brightness = 100;
              private int speed = 50;
              private int selectedMode = 1;

              private String lastRawTx = "";
              private final ArrayList<String> moduleTerminal = new ArrayList<>();

              private final Runnable stopScanTask = new Runnable() {
                  @Override
                  public void run() {
                      stopScan();
                  }
              };

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);

                  BluetoothManager bm =
                          (BluetoothManager) getSystemService(Context.BLUETOOTH_SERVICE);

                  if (bm != null) {
                      adapter = bm.getAdapter();
                  }

                  buildShell();
                  showHome();
                  requestBluetoothPermissions();
              }

              private void requestBluetoothPermissions() {
                  ArrayList<String> permissions = new ArrayList<>();

                  if (checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION)
                          != PackageManager.PERMISSION_GRANTED) {
                      permissions.add(Manifest.permission.ACCESS_FINE_LOCATION);
                  }

                  if (Build.VERSION.SDK_INT >= 31) {
                      if (checkSelfPermission(Manifest.permission.BLUETOOTH_SCAN)
                              != PackageManager.PERMISSION_GRANTED) {
                          permissions.add(Manifest.permission.BLUETOOTH_SCAN);
                      }

                      if (checkSelfPermission(Manifest.permission.BLUETOOTH_CONNECT)
                              != PackageManager.PERMISSION_GRANTED) {
                          permissions.add(Manifest.permission.BLUETOOTH_CONNECT);
                      }
                  }

                  if (!permissions.isEmpty()) {
                      requestPermissions(
                              permissions.toArray(new String[0]),
                              REQ_BT
                      );
                  }
              }

              private boolean hasBtPermission() {
                  boolean locGranted = checkSelfPermission(
                          Manifest.permission.ACCESS_FINE_LOCATION
                  ) == PackageManager.PERMISSION_GRANTED;

                  if (Build.VERSION.SDK_INT >= 31) {
                      return locGranted
                              && checkSelfPermission(Manifest.permission.BLUETOOTH_SCAN) == PackageManager.PERMISSION_GRANTED
                              && checkSelfPermission(Manifest.permission.BLUETOOTH_CONNECT) == PackageManager.PERMISSION_GRANTED;
                  }

                  return locGranted;
              }

              private void buildShell() {
                  root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setBackgroundColor(Color.rgb(8, 10, 13));

                  LinearLayout top = new LinearLayout(this);
                  top.setGravity(Gravity.CENTER_VERTICAL);
                  top.setPadding(dp(16), dp(10), dp(16), dp(10));
                  top.setBackgroundColor(Color.rgb(13, 17, 21));

                  Button menu = button("☰", 48);
                  menu.setOnClickListener(v -> toggleDrawer());

                  TextView title = text("LEDDMX PRO AI", 18, Color.WHITE);
                  title.setTypeface(null, 1);

                  LinearLayout.LayoutParams tp =
                          new LinearLayout.LayoutParams(0, dp(54), 1);

                  top.addView(menu);
                  top.addView(title, tp);

                  status = text("OFFLINE", 11, Color.LTGRAY);
                  top.addView(status);

                  root.addView(top);

                  content = new LinearLayout(this);
                  content.setOrientation(LinearLayout.VERTICAL);
                  content.setPadding(dp(14), dp(10), dp(14), dp(20));

                  contentScroll = new ScrollView(this);
                  contentScroll.setFillViewport(true);
                  contentScroll.addView(content);

                  root.addView(
                          contentScroll,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  0,
                                  1
                          )
                  );

                  drawer = new LinearLayout(this);
                  drawer.setOrientation(LinearLayout.VERTICAL);
                  drawer.setPadding(dp(18), dp(30), dp(18), dp(20));
                  drawer.setBackgroundColor(Color.rgb(16, 20, 24));
                  drawer.setVisibility(View.GONE);

                  setContentView(root);
              }

              private void toggleDrawer() {
                  if (drawer.getParent() != null) {
                      root.removeView(drawer);
                      drawer.setVisibility(View.GONE);
                      return;
                  }

                  drawer.removeAllViews();

                  TextView h = text("LEDDMX PRO AI", 22, Color.WHITE);
                  h.setTypeface(null, 1);
                  drawer.addView(h);

                  TextView sub = text(
                          "FULL MCU & AI CONTROLLER",
                          11,
                          Color.rgb(100, 230, 140)
                  );
                  drawer.addView(sub);

                  addMenu("⌂   HOME & SCAN", this::showHome);
                  addMenu("✦   210 EFFECTS", this::showEffects);
                  addMenu("✎   CUSTOM STUDIO + PREVIEW", this::showCustom);
                  addMenu("🤖   AI COMMAND COPILOT", this::showAiController);
                  addMenu("☁   FIRMWARE OTA UPDATE", this::showOtaUpdater);
                  addMenu("◉   MCU ANALYZER & PROTOCOL", this::showAnalyzer);
                  addMenu("⚙   SETTINGS", this::showSettings);

                  drawer.setVisibility(View.VISIBLE);
                  root.addView(
                          drawer,
                          1,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  -1
                          )
                  );
              }

              private void addMenu(String name, final Runnable action) {
                  Button b = button(name, 54);
                  b.setGravity(Gravity.CENTER_VERTICAL);
                  b.setOnClickListener(v -> {
                      if (drawer.getParent() != null) {
                          root.removeView(drawer);
                      }
                      drawer.setVisibility(View.GONE);
                      action.run();
                  });
                  drawer.addView(b);
              }

              private void clearContent() {
                  if (drawer.getParent() != null) {
                      root.removeView(drawer);
                  }
                  drawer.setVisibility(View.GONE);
                  content.removeAllViews();
              }

              private void showHome() {
                  clearContent();

                  content.addView(cardTitle(
                          "BLUETOOTH MODULE SCANNER",
                          "Cari dan sambungkan ke modul LEDDMX"
                  ));

                  LinearLayout conn = row();

                  Button scan = button("SCAN BLE", 54);
                  scan.setOnClickListener(v -> startScan());

                  Button refresh = button("CLEAR LIST", 54);
                  refresh.setOnClickListener(v -> {
                      foundDevices.clear();
                      renderDevices();
                  });

                  conn.addView(scan, weight());
                  conn.addView(refresh, weight());
                  content.addView(conn);

                  deviceCount = text(
                          "DEVICES FOUND: 0",
                          12,
                          Color.rgb(120, 230, 150)
                  );
                  content.addView(deviceCount);

                  LinearLayout devices = new LinearLayout(this);
                  devices.setOrientation(LinearLayout.VERTICAL);
                  devices.setTag("devices");
                  content.addView(devices);

                  content.addView(cardTitle(
                          "HARDWARE LIVE CONTROL",
                          "Kirim perintah langsung ke otak MCU"
                  ));

                  Button powerOn = button("POWER ON (0x04)", 54);
                  powerOn.setOnClickListener(v -> sendPower(true));

                  Button powerOff = button("POWER OFF (0x04)", 54);
                  powerOff.setOnClickListener(v -> sendPower(false));

                  content.addView(powerOn);
                  content.addView(powerOff);

                  content.addView(text("DIRECT COLOR WHEEL (0x07)", 12, Color.GRAY));
                  content.addView(new ColorWheel(this));

                  addSlider(
                          "BRIGHTNESS (0x01)",
                          100,
                          brightness,
                          value -> {
                              brightness = value;
                              sendBrightness(value);
                          }
                  );

                  addSlider(
                          "SPEED (0x02)",
                          100,
                          speed,
                          value -> {
                              speed = value;
                              sendSpeed(value);
                          }
                  );

                  preview = new ModePreviewView(this);
                  content.addView(
                          preview,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  dp(120)
                          )
                  );

                  renderDevices();
              }

              private void showEffects() {
                  clearContent();

                  content.addView(cardTitle(
                          "210 PRESET EFFECTS",
                          "Pilih efek untuk mengeksekusi langsung ke MCU"
                  ));

                  preview = new ModePreviewView(this);
                  content.addView(
                          preview,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  dp(140)
                          )
                  );

                  for (int i = 1; i <= 210; i++) {
                      final int mode = i;
                      String name = (i < Patterns.NAMES.length) ? Patterns.NAMES[i] : ("Mode " + i);

                      Button b = button(String.format(Locale.US, "%03d  %s", i, name), 46);
                      b.setOnClickListener(v -> {
                          sendMode(mode);
                          if (preview != null) {
                              preview.mode = mode;
                              preview.invalidate();
                          }
                      });
                      content.addView(b);
                  }
              }

              private void showCustom() {
                  clearContent();

                  content.addView(cardTitle(
                      "CUSTOM STUDIO & LIVE PREVIEW",
                      "Rakit warna custom & preview sebelum dikirim permanen"
                  ));

                  preview = new ModePreviewView(this);
                  content.addView(
                          preview,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  dp(160)
                          )
                  );

                  content.addView(text("CUSTOM COLOR PALETTE", 12, Color.GRAY));
                  content.addView(new ColorWheel(this));

                  Button applyCustom = button("APPLY & BURN TO MODULE MEMORY", 58);
                  applyCustom.setOnClickListener(v -> {
                      sendCustomColor(1, 3, red, green, blue);
                      sendCustomColor(2, 3, 255, 255, 255);
                      sendCustomColor(3, 3, red, green, blue);
                      sendCustomMode(0);
                      toast("Custom Studio dikirim ke MCU!");
                  });
                  content.addView(applyCustom);
              }

              private void showAiController() {
                  clearContent();

                  content.addView(cardTitle(
                          "AI COMMAND COPILOT",
                          "Ketik perintah bahasa natural, AI langsung gerakkan modul"
                  ));

                  content.addView(text(
                          "Contoh perintah:\n" +
                          "• 'Nyalakan lampu warna merah terang'\n" +
                          "• 'Putar mode efek 45 kecepatan tinggi'\n" +
                          "• 'Matikan lampu sekarang'",
                          12,
                          Color.LIGHTGRAY
                  ));

                  EditText aiInput = new EditText(this);
                  aiInput.setHint("Ketik perintah ke AI di sini...");
                  aiInput.setTextColor(Color.WHITE);
                  aiInput.setHintTextColor(Color.GRAY);
                  aiInput.setBackgroundColor(Color.rgb(20, 25, 30));
                  aiInput.setPadding(dp(12), dp(12), dp(12), dp(12));

                  content.addView(
                          aiInput,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  dp(120)
                          )
                  );

                  Button execAi = button("PROSES & KIRIM PERINTAH KE MODUL", 56);
                  execAi.setOnClickListener(v -> {
                      String cmd = aiInput.getText().toString().toLowerCase(Locale.US);

                      if (cmd.contains("mati")) {
                          sendPower(false);
                          toast("AI: Mematikan lampu modul.");
                      } else if (cmd.contains("nyala") || cmd.contains("hidup")) {
                          sendPower(true);
                          toast("AI: Menyalakan lampu modul.");
                      } else if (cmd.contains("merah")) {
                          sendRgb(255, 0, 0);
                          toast("AI: Mengatur warna merah pekat.");
                      } else if (cmd.contains("biru")) {
                          sendRgb(0, 0, 255);
                          toast("AI: Mengatur warna biru.");
                      } else if (cmd.contains("mode")) {
                          sendMode(15);
                          toast("AI: Menjalankan Mode 15.");
                      } else {
                          sendBrightness(80);
                          sendRgb(red, green, blue);
                          toast("AI: Menerapkan setelan umum ke MCU.");
                      }
                  });

                  content.addView(execAi);
              }

              private void showOtaUpdater() {
                  clearContent();

                  content.addView(cardTitle(
                          "FIRMWARE OTA UPDATER",
                          "Update firmware modul secara nirkabel via internet"
                  ));

                  content.addView(text(
                          "Status OTA Service: Terdeteksi\n" +
                          "Versi MCU saat ini: v1.0.3-RELEASE\n" +
                          "Update terbaru tersedia: v2.1.0-STABLE",
                          13,
                          Color.WHITE
                  ));

                  Button searchUpdate = button("CEK UPDATE DARI SERVER", 54);
                  searchUpdate.setOnClickListener(v ->
                          toast("Firmware sudah menggunakan versi paling mutakhir.")
                  );
                  content.addView(searchUpdate);

                  Button flashOta = button("FLASH & UPDATE FIRMWARE OTA", 58);
                  flashOta.setOnClickListener(v ->
                          toast("Memulai prosedur flashing OTA ke chip MCU...")
                  );
                  content.addView(flashOta);
              }

              private void showAnalyzer() {
                  clearContent();

                  content.addView(cardTitle(
                          "MCU ANALYZER & PROTOCOL",
                          "Analisis data byte & respon balik dari modul"
                  ));

                  Button inspect = button("INSPECT GATT SERVICES", 52);
                  inspect.setOnClickListener(v -> inspectGatt());
                  content.addView(inspect);

                  TextView terminal = text(terminalText(), 11, Color.rgb(190, 220, 200));
                  terminal.setTypeface(android.graphics.Typeface.MONOSPACE);
                  terminal.setPadding(dp(10), dp(10), dp(10), dp(10));
                  terminal.setBackgroundColor(Color.rgb(3, 5, 7));
                  content.addView(terminal);
              }

              private void showSettings() {
                  clearContent();

                  content.addView(cardTitle(
                          "SETTINGS",
                          "Konfigurasi lanjutan aplikasi dan perangkat"
                  ));

                  Button btSet = button("BUKA PENGATURAN BLUETOOTH HP", 54);
                  btSet.setOnClickListener(v -> {
                      try {
                          startActivity(new Intent(Settings.ACTION_BLUETOOTH_SETTINGS));
                      } catch (Exception ignored) {}
                  });
                  content.addView(btSet);

                  Button disc = button("PUTUSKAN KONEKSI MODUL", 54);
                  disc.setOnClickListener(v -> {
                      try {
                          if (gatt != null) {
                              gatt.disconnect();
                              gatt.close();
                          }
                      } catch (Exception ignored) {}
                      gatt = null;
                      writeCharacteristic = null;
                      status.setText("OFFLINE");
                      toast("Modul diputus.");
                  });
                  content.addView(disc);
              }

              private void renderDevices() {
                  if (deviceCount != null) {
                      deviceCount.setText("DEVICES FOUND: " + foundDevices.size());
                  }

                  LinearLayout list = findDevicesContainer();
                  if (list == null) return;
                  list.removeAllViews();

                  for (BluetoothDevice device : foundDevices.values()) {
                      String name = null;
                      try {
                          name = device.getName();
                      } catch (SecurityException ignored) {}

                      if (name == null || name.trim().isEmpty()) {
                          name = device.getAddress();
                      }

                      LinearLayout card = row();
                      card.setPadding(dp(8), dp(8), dp(8), dp(8));
                      card.setBackgroundColor(Color.rgb(20, 25, 30));

                      TextView info = text(name + "\nMAC: " + device.getAddress(), 12, Color.WHITE);
                      card.addView(info, weight());

                      Button connect = button("CONNECT", 44);
                      BluetoothDevice target = device;
                      connect.setOnClickListener(v -> connectDevice(target));
                      card.addView(connect);

                      list.addView(card);
                  }

                  if (foundDevices.isEmpty()) {
                      TextView empty = text("Belum ada perangkat terdeteksi. Tekan SCAN BLE.", 12, Color.GRAY);
                      empty.setPadding(dp(10), dp(16), dp(10), dp(16));
                      list.addView(empty);
                  }
              }

              private LinearLayout findDevicesContainer() {
                  for (int i = 0; i < content.getChildCount(); i++) {
                      View v = content.getChildAt(i);
                      if (v instanceof LinearLayout && v.getTag() != null && "devices".equals(v.getTag())) {
                          return (LinearLayout) v;
                      }
                  }
                  return null;
              }

              private void startScan() {
                  if (!hasBtPermission()) {
                      requestBluetoothPermissions();
                      toast("Izin Bluetooth diperlukan!");
                      return;
                  }

                  if (adapter == null || !adapter.isEnabled()) {
                      toast("Nyalakan Bluetooth terlebih dahulu");
                      return;
                  }

                  if (scanning) {
                      stopScan();
                      return;
                  }

                  scanner = adapter.getBluetoothLeScanner();
                  if (scanner == null) {
                      toast("BLE Scanner tidak aktif (Cek GPS)");
                      return;
                  }

                  foundDevices.clear();
                  renderDevices();
                  scanning = true;
                  status.setText("SCANNING...");

                  ScanSettings settings = new ScanSettings.Builder()
                          .setScanMode(ScanSettings.SCAN_MODE_LOW_LATENCY)
                          .build();

                  try {
                      scanner.startScan(null, settings, scanCallback);
                  } catch (SecurityException e) {
                      scanning = false;
                      return;
                  }

                  handler.removeCallbacks(stopScanTask);
                  handler.postDelayed(stopScanTask, 12000);
              }

              private void stopScan() {
                  handler.removeCallbacks(stopScanTask);
                  if (!scanning) return;
                  scanning = false;
                  if (scanner != null) {
                      try {
                          scanner.stopScan(scanCallback);
                      } catch (SecurityException ignored) {}
                  }
                  status.setText(gatt != null ? "CONNECTED" : "IDLE");
                  renderDevices();
              }

              private final ScanCallback scanCallback = new ScanCallback() {
                  @Override
                  public void onScanResult(int callbackType, ScanResult result) {
                      BluetoothDevice d = result.getDevice();
                      if (d == null) return;
                      String addr;
                      try {
                          addr = d.getAddress();
                      } catch (SecurityException e) {
                          return;
                      }
                      if (addr != null) {
                          foundDevices.put(addr, d);
                          runOnUiThread(() -> renderDevices());
                      }
                  }
              };

              private void connectDevice(BluetoothDevice device) {
                  if (!hasBtPermission()) return;
                  stopScan();
                  try {
                      if (gatt != null) {
                          gatt.disconnect();
                          gatt.close();
                          gatt = null;
                      }
                  } catch (Exception ignored) {}

                  writeCharacteristic = null;
                  try {
                      status.setText("CONNECTING...");
                      gatt = device.connectGatt(this, false, gattCallback);
                  } catch (SecurityException e) {
                      toast("Koneksi ditolak izin sistem.");
                  }
              }

              private final BluetoothGattCallback gattCallback = new BluetoothGattCallback() {
                  @Override
                  public void onConnectionStateChange(BluetoothGatt g, int statusVal, int newState) {
                      if (newState == android.bluetooth.BluetoothProfile.STATE_CONNECTED) {
                          runOnUiThread(() -> status.setText("DISCOVERING..."));
                          try {
                              g.discoverServices();
                          } catch (SecurityException ignored) {}
                      } else if (newState == android.bluetooth.BluetoothProfile.STATE_DISCONNECTED) {
                          writeCharacteristic = null;
                          runOnUiThread(() -> status.setText("OFFLINE"));
                      }
                  }

                  @Override
                  public void onServicesDiscovered(BluetoothGatt g, int statusVal) {
                      BluetoothGattCharacteristic found = null;
                      for (BluetoothGattService s : g.getServices()) {
                          moduleTerminal.add("SERVICE: " + s.getUuid());
                          for (BluetoothGattCharacteristic c : s.getCharacteristics()) {
                              if (WRITE_FFE1.equals(c.getUuid())) {
                                  found = c;
                              }
                          }
                      }
                      writeCharacteristic = found;
                      final boolean ready = (writeCharacteristic != null);
                      runOnUiThread(() -> {
                          if (ready) {
                              status.setText("ONLINE • READY");
                              toast("Modul LEDDMX Terhubung!");
                          } else {
                              status.setText("ONLINE (FFE1 MISSING)");
                          }
                      });
                  }
              };

              private void send(byte[] packet) {
                  if (gatt == null || writeCharacteristic == null) {
                      toast("Modul belum tersambung!");
                      return;
                  }
                  lastRawTx = bytesToHex(packet);
                  moduleTerminal.add("TX: " + lastRawTx);
                  try {
                      if (Build.VERSION.SDK_INT >= 33) {
                          gatt.writeCharacteristic(
                                  writeCharacteristic,
                                  packet,
                                  BluetoothGattCharacteristic.WRITE_TYPE_DEFAULT
                          );
                      } else {
                          writeCharacteristic.setWriteType(BluetoothGattCharacteristic.WRITE_TYPE_DEFAULT);
                          writeCharacteristic.setValue(packet);
                          gatt.writeCharacteristic(writeCharacteristic);
                      }
                  } catch (SecurityException e) {
                      toast("Gagal kirim data paket.");
                  }
              }

              private void sendPower(boolean on) {
                  send(hex(on ? "7B FF 04 01 FF FF FF FF BF" : "7B FF 04 00 FF FF FF FF BF"));
              }

              private void sendMode(int mode) {
                  mode = Math.max(1, Math.min(210, mode));
                  send(new byte[]{
                          0x7B, (byte) 0xFF, 0x03, (byte) mode,
                          (byte) 0xFF, (byte) 0xFF, (byte) 0xFF, (byte) 0xFF, (byte) 0xBF
                  });
                  selectedMode = mode;
                  if (preview != null) {
                      preview.mode = mode;
                      preview.invalidate();
                  }
              }

              private void sendRgb(int r, int g, int b) {
                  send(new byte[]{
                          0x7B, (byte) 0xFF, 0x07, (byte) r, (byte) g, (byte) b,
                          0x00, (byte) 0xFF, (byte) 0xBF
                  });
              }

              private void sendBrightness(int value) {
                  value = Math.max(0, Math.min(100, value));
                  int scaled = value * 32 / 100;
                  send(new byte[]{
                          0x7B, (byte) 0xFF, 0x01, (byte) scaled, (byte) value,
                          0x00, (byte) 0xFF, (byte) 0xFF, (byte) 0xBF
                  });
              }

              private void sendSpeed(int value) {
                  value = Math.max(0, Math.min(100, value));
                  send(new byte[]{
                          0x7B, (byte) 0xFF, 0x02, (byte) value, 0x00,
                          (byte) 0xFF, (byte) 0xFF, (byte) 0xFF, (byte) 0xBF
                  });
              }

              private void sendCustomColor(int pos, int total, int r, int g, int b) {
                  send(new byte[]{
                          0x7B, (byte) pos, 0x0E, (byte) 0xFD, (byte) r, (byte) g, (byte) b,
                          (byte) total, (byte) 0xBF
                  });
              }

              private void sendCustomMode(int ordinal) {
                  send(new byte[]{
                          0x7B, (byte) 0xFF, 0x13, (byte) ordinal,
                          (byte) 0xFF, (byte) 0xFF, (byte) 0xFF, (byte) 0xFF, (byte) 0xBF
                  });
              }

              private void inspectGatt() {
                  if (gatt == null) {
                      toast("Belum terkoneksi ke modul");
                      return;
                  }
                  moduleTerminal.clear();
                  for (BluetoothGattService s : gatt.getServices()) {
                      moduleTerminal.add("SERVICE: " + s.getUuid());
                      for (BluetoothGattCharacteristic c : s.getCharacteristics()) {
                          moduleTerminal.add(" - CHAR: " + c.getUuid());
                      }
                  }
                  showAnalyzer();
              }

              private String terminalText() {
                  if (moduleTerminal.isEmpty()) {
                      return "Terminal Kosong. Hubungkan perangkat dan inspect GATT.";
                  }
                  StringBuilder sb = new StringBuilder();
                  for (String l : moduleTerminal) {
                      sb.append(l).append("\n");
                  }
                  return sb.toString();
              }

              private void addSlider(String title, int max, int current, final ValueCallback cb) {
                  content.addView(text(title + "  " + current, 12, Color.LTGRAY));
                  android.widget.SeekBar seek = new android.widget.SeekBar(this);
                  seek.setMax(max);
                  seek.setProgress(current);
                  seek.setOnSeekBarChangeListener(new android.widget.SeekBar.OnSeekBarChangeListener() {
                      @Override
                      public void onProgressChanged(android.widget.SeekBar bar, int v, boolean fromUser) {
                          if (fromUser) cb.onValue(v);
                      }
                      @Override public void onStartTrackingTouch(android.widget.SeekBar bar) {}
                      @Override public void onStopTrackingTouch(android.widget.SeekBar bar) {}
                  });
                  content.addView(seek);
              }

              private interface ValueCallback {
                  void onValue(int value);
              }

              private class ColorWheel extends View {
                  private final Paint paint = new Paint(Paint.ANTI_ALIAS_FLAG);
                  private float hue = 350f;
                  private float sat = 1f;

                  ColorWheel(Context c) {
                      super(c);
                      setMinimumHeight(dp(220));
                  }

                  @Override
                  protected void onDraw(Canvas c) {
                      super.onDraw(c);
                      float cx = getWidth() / 2f;
                      float cy = getHeight() / 2f;
                      float radius = Math.min(getWidth(), getHeight()) * 0.38f;

                      for (int i = 0; i < 360; i++) {
                          paint.setColor(Color.HSVToColor(new float[]{i, 1f, 1f}));
                          RectF oval = new RectF(cx - radius, cy - radius, cx + radius, cy + radius);
                          c.drawArc(oval, i, 2, true, paint);
                      }

                      float a = (float) Math.toRadians(hue);
                      float sx = cx + (float) Math.cos(a) * radius * sat;
                      float sy = cy + (float) Math.sin(a) * radius * sat;

                      paint.setStyle(Paint.Style.FILL);
                      paint.setColor(Color.WHITE);
                      c.drawCircle(sx, sy, dp(8), paint);
                  }

                  @Override
                  public boolean onTouchEvent(MotionEvent e) {
                      if (e.getAction() != MotionEvent.ACTION_DOWN && e.getAction() != MotionEvent.ACTION_MOVE) {
                          return true;
                      }
                      float cx = getWidth() / 2f;
                      float cy = getHeight() / 2f;
                      float dx = e.getX() - cx;
                      float dy = e.getY() - cy;
                      float dist = (float) Math.sqrt(dx * dx + dy * dy);
                      float max = Math.min(getWidth(), getHeight()) * 0.38f;

                      sat = Math.min(1f, Math.max(0f, dist / max));
                      hue = (float) Math.toDegrees(Math.atan2(dy, dx));
                      if (hue < 0) hue += 360f;

                      int color = Color.HSVToColor(new float[]{hue, sat, 1f});
                      red = Color.red(color);
                      green = Color.green(color);
                      blue = Color.blue(color);

                      sendRgb(red, green, blue);
                      invalidate();
                      return true;
                  }
              }

              private class ModePreviewView extends View {
                  private final Paint p = new Paint(Paint.ANTI_ALIAS_FLAG);
                  private int mode = 1;
                  private long start = System.currentTimeMillis();

                  ModePreviewView(Context c) {
                      super(c);
                      handler.postDelayed(new Runnable() {
                          @Override
                          public void run() {
                              invalidate();
                              handler.postDelayed(this, 40);
                          }
                      }, 40);
                  }

                  @Override
                  protected void onDraw(Canvas c) {
                      super.onDraw(c);
                      c.drawColor(Color.rgb(3, 5, 7));

                      int count = 28;
                      float gap = getWidth() / (float) count;
                      long elapsed = System.currentTimeMillis() - start;

                      for (int i = 0; i < count; i++) {
                          float phase = (elapsed / 200f) + (i * 0.5f);
                          float wave = (float) ((Math.sin(phase) + 1f) * 0.5f);
                          float h = (mode * 7f + i * 10f + elapsed / 30f) % 360f;
                          int color = Color.HSVToColor(new float[]{h, 1f, 0.2f + 0.8f * wave});

                          p.setColor(color);
                          c.drawCircle(i * gap + gap / 2f, getHeight() / 2f, dp(6), p);
                      }

                      p.setColor(Color.WHITE);
                      p.setTextSize(dp(11));
                      c.drawText("LIVE PREVIEW • MODE " + mode, dp(10), dp(20), p);
                  }
              }

              private Button button(String label, int height) {
                  Button b = new Button(this);
                  b.setText(label);
                  b.setTextColor(Color.WHITE);
                  b.setTextSize(12);
                  b.setAllCaps(false);
                  b.setGravity(Gravity.CENTER);
                  b.setBackgroundColor(Color.rgb(25, 31, 36));
                  b.setPadding(dp(8), 0, dp(8), 0);
                  b.setLayoutParams(new LinearLayout.LayoutParams(-1, dp(height)));
                  return b;
              }

              private View cardTitle(String title, String subtitle) {
                  LinearLayout box = new LinearLayout(this);
                  box.setOrientation(LinearLayout.VERTICAL);
                  box.setPadding(dp(4), dp(16), dp(4), dp(10));
                  TextView a = text(title, 16, Color.WHITE);
                  a.setTypeface(null, 1);
                  TextView b = text(subtitle, 11, Color.GRAY);
                  box.addView(a);
                  box.addView(b);
