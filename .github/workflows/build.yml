              // ====================================================
              // COLOR WHEEL
              // ====================================================

              private class ColorWheel
                      extends View {

                  Paint paint =
                          new Paint(
                                  Paint.ANTI_ALIAS_FLAG);

                  float cx;
                  float cy;
                  float radius;

                  int r = 255;
                  int g = 0;
                  int b = 0;

                  float selectedAngle = 0f;

                  public ColorWheel(Context c) {
                      super(c);
                      setLayerType(
                              View.LAYER_TYPE_SOFTWARE,
                              null);
                  }

                  @Override
                  protected void onDraw(
                          Canvas c) {

                      super.onDraw(c);

                      cx = getWidth() / 2f;
                      cy = getHeight() / 2f;

                      radius =
                              Math.min(
                                      getWidth(),
                                      getHeight())
                              * 0.38f;

                      paint.setShader(
                              new SweepGradient(
                                      cx,
                                      cy,
                                      new int[] {
                                              Color.RED,
                                              Color.MAGENTA,
                                              Color.BLUE,
                                              Color.CYAN,
                                              Color.GREEN,
                                              Color.YELLOW,
                                              Color.RED
                                      },
                                      null));

                      c.drawCircle(
                              cx,
                              cy,
                              radius,
                              paint);

                      paint.setShader(null);

                      paint.setColor(
                              Color.argb(
                                      220,
                                      8,
                                      11,
                                      16));

                      c.drawCircle(
                              cx,
                              cy,
                              radius * .42f,
                              paint);

                      float a =
                              selectedAngle;

                      float sx =
                              cx +
                              (float)Math.cos(a)
                              * radius;

                      float sy =
                              cy +
                              (float)Math.sin(a)
                              * radius;

                      paint.setStyle(
                              Paint.Style.STROKE);

                      paint.setStrokeWidth(
                              dp(3));

                      paint.setColor(
                              Color.WHITE);

                      c.drawCircle(
                              sx,
                              sy,
                              dp(9),
                              paint);

                      paint.setStyle(
                              Paint.Style.FILL);

                      paint.setColor(
                              Color.WHITE);

                      c.drawCircle(
                              sx,
                              sy,
                              dp(4),
                              paint);
                  }

                  @Override
                  public boolean onTouchEvent(
                          MotionEvent e) {

                      if (e.getAction() ==
                              MotionEvent.ACTION_DOWN ||
                              e.getAction() ==
                              MotionEvent.ACTION_MOVE ||
                              e.getAction() ==
                              MotionEvent.ACTION_UP) {

                          float dx =
                                  e.getX() - cx;

                          float dy =
                                  e.getY() - cy;

                          selectedAngle =
                                  (float)Math.atan2(
                                          dy,
                                          dx);

                          if (selectedAngle < 0)
                              selectedAngle +=
                                      Math.PI * 2;

                          hsvToRgb(
                                  selectedAngle /
                                  (float)(Math.PI * 2));

                          invalidate();
                          return true;
                      }

                      return true;
                  }

                  private void hsvToRgb(
                          float h) {

                      float x =
                              h * 6f;

                      int sector =
                              (int)Math.floor(x);

                      float f =
                              x - sector;

                      switch (sector % 6) {

                          case 0:
                              r = 255;
                              g = (int)(255 * f);
                              b = 0;
                              break;

                          case 1:
                              r = (int)(255 * (1-f));
                              g = 255;
                              b = 0;
                              break;

                          case 2:
                              r = 0;
                              g = 255;
                              b = (int)(255*f);
                              break;

                          case 3:
                              r = 0;
                              g = (int)(255*(1-f));
                              b = 255;
                              break;

                          case 4:
                              r = (int)(255*f);
                              g = 0;
                              b = 255;
                              break;

                          default:
                              r = 255;
                              g = 0;
                              b = (int)(255*(1-f));
                              break;
                      }
                  }
              }

              // ====================================================
              // LIVE LED STRIP PREVIEW
              // ====================================================

              private class LedStripView
                      extends View {

                  Paint paint =
                          new Paint(
                                  Paint.ANTI_ALIAS_FLAG);

                  String template =
                          "RAINBOW";

                  long started =
                          System.currentTimeMillis();

                  public LedStripView(Context c) {

                      super(c);

                      handler.post(
                              new Runnable() {

                                  @Override
                                  public void run() {

                                      invalidate();

                                      handler.postDelayed(
                                              this,
                                              40);
                                  }
                              });
                  }

                  @Override
                  protected void onDraw(
                          Canvas c) {

                      int count = 42;

                      float w =
                              getWidth()
                              / (float)count;

                      long elapsed =
                              System.currentTimeMillis()
                              - started;

                      int shift =
                              (int)(
                                      elapsed / 80
                              );

                      for (int i = 0;
                           i < count;
                           i++) {

                          int color;

                          if (template.equals(
                                  "STRIPE / BELANG")) {

                              int band =
                                      ((i + shift / 3)
                                      / 5) % 4;

                              int[] colors = {
                                      Color.RED,
                                      Color.WHITE,
                                      Color.BLUE,
                                      Color.GREEN
                              };

                              color =
                                      colors[band];

                          } else {

                              float hue =
                                      ((i + shift)
                                      % count)
                                      / (float)count;

                              color =
                                      Color.HSVToColor(
                                              new float[] {
                                                      hue * 360f,
                                                      1f,
                                                      1f
                                              });
                          }

                          paint.setColor(color);

                          RectF r =
                                  new RectF(
                                          i*w + 2,
                                          35,
                                          (i+1)*w - 2,
                                          95);

                          c.drawRoundRect(
                                  r,
                                  12,
                                  12,
                                  paint);
                      }

                      paint.setColor(
                              Color.WHITE);

                      paint.setTextSize(
                              dp(12));

                      c.drawText(
                              template,
                              dp(10),
                              dp(22),
                              paint);
                  }
              }

              @Override
              protected void onDestroy() {

                  stopScan();
                  disconnect();

                  super.onDestroy();
              }
          }
