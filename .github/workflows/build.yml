    private void scanBluetooth() {

        if (adapter == null) {

            toast(
                    "Bluetooth tidak tersedia"
            );

            return;
        }

        if (!adapter.isEnabled()) {

            try {

                startActivity(
                        new Intent(
                                BluetoothAdapter
                                        .ACTION_REQUEST_ENABLE
                        )
                );

            } catch (Exception e) {

                toast(
                        "Aktifkan Bluetooth terlebih dahulu"
                );
            }

            return;
        }

        if (!permissionsOkay()) {

            requestBluetoothPermissions();
            return;
        }

        try {

            scanner =
                    adapter.getBluetoothLeScanner();

            if (scanner == null) {

                toast(
                        "BLE scanner tidak tersedia"
                );

                return;
            }

            if (scanning) {
                stopScan();
            }

            devices.clear();
            deviceMap.clear();

            scanning = true;

            buildScanPage();

            ScanSettings settings =
                    new ScanSettings.Builder()
                            .setScanMode(
                                    ScanSettings
                                            .SCAN_MODE_LOW_LATENCY
                            )
                            .build();

            scanner.startScan(
                    null,
                    settings,
                    scanCallback
            );

            handler.postDelayed(
                    this::stopScan,
                    15000
            );

        } catch (SecurityException e) {

            toast(
                    "Permission Bluetooth belum diberikan"
            );

        } catch (Exception e) {

            toast(
                    "Scan error: " +
                            e.getClass()
                                    .getSimpleName()
            );
        }
    }

