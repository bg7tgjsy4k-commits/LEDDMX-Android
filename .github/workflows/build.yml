    View slider(
            String name,
            int val,
            int min,
            int max,
            final IntConsumer f
    ) {

        LinearLayout box =
                col();

        box.setPadding(
                18,
                4,
                18,
                4
        );

        box.addView(
                txt(
                        name + "  " + val,
                        13,
                        TEXT
                )
        );

        SeekBar s =
                new SeekBar(this);

        s.setMax(
                max - min
        );

        s.setProgress(
                val - min
        );

        s.setOnSeekBarChangeListener(
                new SeekBar.OnSeekBarChangeListener() {

                    public void onProgressChanged(
                            SeekBar b,
                            int p,
                            boolean u
                    ) {

                        f.accept(
                                p + min
                        );

                        (
                                (TextView)
                                        box.getChildAt(0)
                        ).setText(
                                name
                                        + "  "
                                        + (p + min)
                        );
                    }

                    public void onStartTrackingTouch(
                            SeekBar b
                    ) {}

                    public void onStopTrackingTouch(
                            SeekBar b
                    ) {}
                }
        );

        box.addView(s);

        return box;
    }

