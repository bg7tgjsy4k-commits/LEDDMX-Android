                          } else {

                              int duration =
                                  q.contains("cepat")
                                  ||
                                  q.contains("fast")
                                  ? 100
                                  : 250;

                              for(int i=0;i<12;i++) {

                                  int a =
                                      cs.get(
                                          i % cs.size()
