              private void saveSlot(int slot) {

                  StringBuilder sb =
                          new StringBuilder();

                  for (Frame f : frames) {

                      sb.append(
                              f.lr
                      ).append(",");

                      sb.append(
                              f.lg
                      ).append(",");

                      sb.append(
                              f.lb
                      ).append(",");

                      sb.append(
                              f.rr
                      ).append(",");

                      sb.append(
                              f.rg
                      ).append(",");

                      sb.append(
                              f.rb
                      ).append(",");

                      sb.append(
                              f.duration
                      ).append(";");

                  }

                  prefs.edit()
                          .putString(
                                  "slot_" + slot,
                                  sb.toString()
                          )
                          .apply();
              }

              private void loadSlot(int slot) {

                  String data =
                          prefs.getString(
                                  "slot_" + slot,
                                  null
                          );

                  if (data == null) {
                      frames.clear();

                      frames.add(
                              new Frame(
                                      255,0,0,
                                      0,0,255,
                                      300
                              )
                      );

                      return;
                  }

                  frames.clear();

                  String[] rows =
                          data.split(";");

                  for (String row :
                          rows) {

                      try {

                          String[] p =
                                  row.split(",");

                          frames.add(
                                  new Frame(
                                          Integer.parseInt(p[0]),
                                          Integer.parseInt(p[1]),
                                          Integer.parseInt(p[2]),
                                          Integer.parseInt(p[3]),
                                          Integer.parseInt(p[4]),
                                          Integer.parseInt(p[5]),
                                          Integer.parseInt(p[6])
                                  )
                          );

                      } catch (Exception ignored) {}
                  }

                  if (frames.isEmpty()) {

                      frames.add(
                              new Frame(
                                      255,0,0,
                                      0,0,255,
                                      300
                              )
                      );
                  }
              }

