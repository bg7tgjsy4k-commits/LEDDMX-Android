name: Build LEDDMX AI Pro FINAL

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Create Android project and Gradle Wrapper
        shell: bash
        run: |
          set -e

          rm -rf app build.gradle settings.gradle gradle.properties gradlew gradlew.bat gradle
          mkdir -p app/src/main/java/com/leddmx/pro
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "LEDDMX-AI-Pro"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.leddmx.pro'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.leddmx.pro'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName "1.0"
              }
          }
          EOF

          cat > app/src/main/res/values/colors.xml <<'EOF'
          <resources>
              <color name="black">#000000</color>
              <color name="white">#FFFFFF</color>
              <color name="dark">#101114</color>
              <color name="panel">#191B20</color>
              <color name="accent">#00E5FF</color>
          </resources>
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">LEDDMX AI Pro</string>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.BLUETOOTH" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" />
              <uses-permission
                  android:name="android.permission.BLUETOOTH_CONNECT"
                  android:maxSdkVersion="35" />
              <uses-permission
                  android:name="android.permission.BLUETOOTH_SCAN"
                  android:usesPermissionFlags="neverForLocation"
                  android:maxSdkVersion="35" />

              <uses-feature
                  android:name="android.hardware.bluetooth_le"
                  android:required="false" />

              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:theme="@style/AppTheme"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>

              <style name="AppTheme"
                  parent="android:style/Theme.Material.NoActionBar">

                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">#101114</item>
                  <item name="android:navigationBarColor">#101114</item>
                  <item name="android:colorAccent">#00E5FF</item>

              </style>

          </resources>
          EOF

      - name: Write BluetoothService.java
        shell: bash
        run: |
          cat > app/src/main/java/com/leddmx/pro/BluetoothService.java <<'EOF'
          package com.leddmx.pro;

          import android.bluetooth.BluetoothGatt;
          import android.bluetooth.BluetoothGattCharacteristic;

          public class BluetoothService {

              private static BluetoothService instance;

              public static synchronized BluetoothService getInstance() {
                  if (instance == null) {
                      instance = new BluetoothService();
                  }
                  return instance;
              }

              public static final String SERVICE_FFE0 =
                      "0000FFE0-0000-1000-8000-00805F9B34FB";

              public static final String CHAR_FFE1 =
                      "0000FFE1-0000-1000-8000-00805F9B34FB";

              public static final String CHAR_FFF4 =
                      "0000FFF4-0000-1000-8000-00805F9B34FB";

              public BluetoothGatt gatt;
              public BluetoothGattCharacteristic writeChar;

              public boolean isConnected = false;

              public int lastUsedMode = 171;

              public void sendPacket(byte[] data) {

                  if (gatt == null || writeChar == null) {
                      return;
                  }

                  try {
                      writeChar.setValue(data);
                      gatt.writeCharacteristic(writeChar);
                  } catch (SecurityException ignored) {
                  } catch (Exception ignored) {
                  }
              }
          }
          EOF

      - name: Write MainActivity.java
        shell: bash
        run: |
          cat > app/src/main/java/com/leddmx/pro/MainActivity.java <<'EOF'
          package com.leddmx.pro;

          import android.Manifest;
          import android.app.Activity;
          import android.bluetooth.BluetoothAdapter;
          import android.bluetooth.BluetoothDevice;
          import android.bluetooth.BluetoothGatt;
          import android.bluetooth.BluetoothGattCallback;
          import android.bluetooth.BluetoothGattCharacteristic;
          import android.bluetooth.BluetoothGattService;
          import android.bluetooth.le.BluetoothLeScanner;
          import android.bluetooth.le.ScanCallback;
          import android.bluetooth.le.ScanResult;
          import android.content.Context;
          import android.content.SharedPreferences;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.graphics.drawable.GradientDrawable;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.GridLayout;
          import android.widget.LinearLayout;
          import android.widget.SeekBar;
          import android.widget.Spinner;
          import android.widget.TextView;
          import android.widget.Toast;

          import java.util.ArrayList;
          import java.util.List;
          import java.util.Locale;

          public class MainActivity extends Activity {

              private final Handler handler = new Handler();

              private BluetoothAdapter bluetoothAdapter;
              private BluetoothLeScanner scanner;
              private BluetoothGatt gatt;

              private TextView status;
              private TextView currentMode;

              private LinearLayout content;

              private SharedPreferences prefs;

              private int currentModeNumber = 171;

              private final ArrayList<Frame> frames = new ArrayList<>();

              private int selectedSlot = 171;

              private boolean playing = false;

              private final Runnable previewRunnable = new Runnable() {
                  private int index = 0;

                  @Override
                  public void run() {

                      if (!playing || frames.isEmpty()) {
                          return;
                      }

                      if (index >= frames.size()) {
                          index = 0;
                      }

                      Frame f = frames.get(index);

                      applyPreviewColor(
                              (f.lr + f.rr) / 2,
                              (f.lg + f.rg) / 2,
                              (f.lb + f.rb) / 2
                      );

                      index++;

                      handler.postDelayed(
                              this,
                              Math.max(50, f.duration)
                      );
                  }
              };

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  prefs = getSharedPreferences(
                          "leddmx_slots",
                          MODE_PRIVATE
                  );

                  bluetoothAdapter =
                          android.bluetooth.BluetoothManager.class
                                  .cast(getSystemService(
                                          Context.BLUETOOTH_SERVICE))
                                  .getAdapter();

                  buildRoot();
                  showHome();

                  requestBluetoothPermission();
              }

              private void requestBluetoothPermission() {

                  if (Build.VERSION.SDK_INT >= 31) {

                      if (checkSelfPermission(
                              Manifest.permission.BLUETOOTH_SCAN)
                              != PackageManager.PERMISSION_GRANTED) {

                          requestPermissions(
                                  new String[]{
                                          Manifest.permission.BLUETOOTH_SCAN,
                                          Manifest.permission.BLUETOOTH_CONNECT
                                  },
                                  100
                          );
                      }
                  }
              }

              private void buildRoot() {

                  LinearLayout root =
                          new LinearLayout(this);

                  root.setOrientation(
                          LinearLayout.VERTICAL
                  );

                  root.setBackgroundColor(
                          Color.rgb(16,17,20)
                  );

                  LinearLayout top =
                          new LinearLayout(this);

                  top.setGravity(Gravity.CENTER_VERTICAL);
                  top.setPadding(24,18,24,18);

                  TextView title =
                          text("LEDDMX AI PRO",22);

                  top.addView(
                          title,
                          new LinearLayout.LayoutParams(
                                  0,
                                  -2,
                                  1
                          )
                  );

                  Button connect =
                          button("SCAN");

                  connect.setOnClickListener(
                          v -> scan()
                  );

                  top.addView(connect);

                  root.addView(top);

                  status =
                          text("DISCONNECTED",14);

                  status.setPadding(
                          24,0,24,15
                  );

                  root.addView(status);

                  content =
                          new LinearLayout(this);

                  content.setOrientation(
                          LinearLayout.VERTICAL
                  );

                  content.setPadding(
                          18,10,18,10
                  );

                  root.addView(
                          content,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  0,
                                  1
                          )
                  );

                  LinearLayout nav =
                          new LinearLayout(this);

                  nav.setPadding(8,8,8,8);

                  String[] names = {
                          "HOME",
                          "MODES",
                          "CUSTOM",
                          "AI",
                          "SETTINGS"
                  };

                  for (String name : names) {

                      Button b =
                              button(name);

                      b.setTextSize(11);

                      b.setOnClickListener(v -> {

                          switch (name) {

                              case "HOME":
                                  showHome();
                                  break;

                              case "MODES":
                                  showModes();
                                  break;

                              case "CUSTOM":
                                  showCustom();
                                  break;

                              case "AI":
                                  showAI();
                                  break;

                              case "SETTINGS":
                                  showSettings();
                                  break;
                          }

                      });

                      nav.addView(
                              b,
                              new LinearLayout.LayoutParams(
                                      0,
                                      60,
                                      1
                              )
                      );
                  }

                  root.addView(nav);

                  setContentView(root);
              }

              private void clearContent() {

                  stopPreview();
                  content.removeAllViews();
              }

              private void showHome() {

                  clearContent();

                  content.addView(
                          text("HOME",28)
                  );

                  currentMode =
                          text(
                                  "MODE " +
                                  currentModeNumber,
                                  22
                          );

                  content.addView(
                          currentMode
                  );

                  Button on =
                          button("POWER ON");

                  on.setOnClickListener(
                          v -> sendMode(
                                  currentModeNumber
                          )
                  );

                  content.addView(on);

                  Button off =
                          button("POWER OFF");

                  off.setOnClickListener(
                          v -> sendOff()
                  );

                  content.addView(off);

                  TextView info =
                          text(
                                  "Last mode akan dipanggil kembali saat ON.",
                                  14
                          );

                  content.addView(info);

                  SeekBar brightness =
                          new SeekBar(this);

                  brightness.setMax(100);
                  brightness.setProgress(100);

                  content.addView(
                          label("BRIGHTNESS")
                  );

                  content.addView(
                          brightness
                  );

                  SeekBar speed =
                          new SeekBar(this);

                  speed.setMax(900);
                  speed.setProgress(350);

                  content.addView(
                          label("PREVIEW SPEED")
                  );

                  content.addView(speed);

                  Button custom =
                          button(
                                  "OPEN CUSTOM / DIY STUDIO"
                          );

                  custom.setOnClickListener(
                          v -> showCustom()
                  );

                  content.addView(custom);

                  Button ai =
                          button(
                                  "AI ANIMATION"
                          );

                  ai.setOnClickListener(
                          v -> showAI()
                  );

                  content.addView(ai);
              }

              private void showModes() {

                  clearContent();

                  content.addView(
                          text("MODES 1 - 210",28)
                  );

                  content.addView(
                          text(
                                  "Preset mode dari controller.",
                                  14
                          )
                  );

                  GridLayout grid =
                          new GridLayout(this);

                  grid.setColumnCount(4);

                  for (int i=1; i<=210; i++) {

                      final int mode = i;

                      Button b =
                              button(
                                      String.format(
                                              Locale.US,
                                              "%03d",
                                              mode
                                      )
                              );

                      b.setTextSize(12);

                      b.setOnClickListener(
                              v -> sendMode(mode)
                      );

                      GridLayout.LayoutParams lp =
                              new GridLayout.LayoutParams();

                      lp.width = 0;
                      lp.height = 58;
                      lp.columnSpec =
                              GridLayout.spec(
                                      GridLayout.UNDEFINED,
                                      1f
                              );

                      lp.setMargins(4,4,4,4);

                      grid.addView(b,lp);
                  }

                  content.addView(
                          grid,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  0,
                                  1
                          )
                  );
              }

              private void showCustom() {

                  clearContent();

                  content.addView(
                          text(
                                  "CUSTOM STUDIO",
                                  28
                          )
                  );

                  content.addView(
                          text(
                                  "Slot lokal 171 - 210",
                                  14
                          )
                  );

                  Spinner slot =
                          new Spinner(this);

                  String[] slots =
                          new String[40];

                  for (int i=0;i<40;i++) {
                      slots[i] =
                              "CUSTOM " + (171+i);
                  }

                  android.widget.ArrayAdapter<String> adapter =
                          new android.widget.ArrayAdapter<>(
                                  this,
                                  android.R.layout.simple_spinner_dropdown_item,
                                  slots
                          );

                  slot.setAdapter(adapter);

                  slot.setSelection(
                          selectedSlot - 171
                  );

                  slot.setOnItemSelectedListener(
                          new android.widget.AdapterView.OnItemSelectedListener() {

                              @Override
                              public void onItemSelected(
                                      android.widget.AdapterView<?> parent,
                                      View view,
                                      int position,
                                      long id) {

                                  selectedSlot =
                                          171 + position;

                                  loadSlot();
                              }

                              @Override
                              public void onNothingSelected(
                                      android.widget.AdapterView<?> parent) {
                              }
                          }
                  );

                  content.addView(slot);

                  LinearLayout editor =
                          new LinearLayout(this);

                  editor.setOrientation(
                          LinearLayout.VERTICAL
                  );

                  content.addView(
                          editor,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  0,
                                  1
                          )
                  );

                  loadSlot();

                  rebuildEditor(editor);
              }

              private void rebuildEditor(
                      LinearLayout editor) {

                  editor.removeAllViews();

                  Button add =
                          button("ADD FRAME");

                  add.setOnClickListener(v -> {

                      frames.add(
                              new Frame(
                                      255,0,0,
                                      255,0,0,
                                      400
                              )
                      );

                      rebuildEditor(editor);
                  });

                  editor.addView(add);

                  Button duplicate =
                          button("DUPLICATE LAST");

                  duplicate.setOnClickListener(v -> {

                      if (!frames.isEmpty()) {

                          Frame f =
                                  frames.get(
                                          frames.size()-1
                                  );

                          frames.add(
                                  new Frame(
                                          f.lr,f.lg,f.lb,
                                          f.rr,f.rg,f.rb,
                                          f.duration
                                  )
                          );

                          rebuildEditor(editor);
                      }
                  });

                  editor.addView(duplicate);

                  Button clear =
                          button("CLEAR TIMELINE");

                  clear.setOnClickListener(v -> {

                      frames.clear();

                      rebuildEditor(editor);
                  });

                  editor.addView(clear);

                  for (int i=0;i<frames.size();i++) {

                      final int index = i;

                      Frame f =
                              frames.get(i);

                      LinearLayout row =
                              new LinearLayout(this);

                      row.setPadding(
                              8,10,8,10
                      );

                      row.setOrientation(
                              LinearLayout.VERTICAL
                      );

                      row.addView(
                              text(
                                      "FRAME " +
                                      (i+1),
                                      18
                              )
                      );

                      TextView preview =
                              text(
                                      "LEFT  RGB(" +
                                      f.lr + "," +
                                      f.lg + "," +
                                      f.lb +
                                      ")   RIGHT RGB(" +
                                      f.rr + "," +
                                      f.rg + "," +
                                      f.rb + ")",
                                      13
                              );

                      row.addView(preview);

                      Button color =
                              button(
                                      "COLOR WHEEL"
                              );

                      color.setOnClickListener(
                              v -> openColorEditor(
                                      f,
                                      editor
                              )
                      );

                      row.addView(color);

                      SeekBar duration =
                              new SeekBar(this);

                      duration.setMax(1950);
                      duration.setProgress(
                              Math.max(
                                      50,
                                      f.duration - 50
                              )
                      );

                      duration.setOnSeekBarChangeListener(
                              new SeekBar.OnSeekBarChangeListener() {

                                  public void onProgressChanged(
                                          SeekBar s,
                                          int p,
                                          boolean fromUser) {

                                      f.duration =
                                              50 + p;
                                  }

                                  public void onStartTrackingTouch(
                                          SeekBar s) {}

                                  public void onStopTrackingTouch(
                                          SeekBar s) {}
                              }
                      );

                      row.addView(
                              label(
                                      "DURATION " +
                                      f.duration +
                                      " ms"
                              )
                      );

                      row.addView(duration);

                      Button del =
                              button("DELETE FRAME");

                      del.setOnClickListener(v -> {

                          frames.remove(index);

                          rebuildEditor(editor);
                      });

                      row.addView(del);

                      content.addView(row);
                  }

                  Button stripe =
                          button(
                                  "GENERATE STRIPE / BELANG"
                          );

                  stripe.setOnClickListener(v -> {

                      frames.clear();

                      int[][] c = {
                              {255,0,0},
                              {0,255,0},
                              {0,0,255},
                              {255,255,0}
                      };

                      for (int i=0;i<8;i++) {

                          int[] x =
                                  c[i % c.length];

                          frames.add(
                                  new Frame(
                                          x[0],x[1],x[2],
                                          x[0],x[1],x[2],
                                          180
                                  )
                          );
                      }

                      rebuildEditor(editor);
                  });

                  content.addView(stripe);

                  Button chase =
                          button(
                                  "GENERATE CHASE"
                          );

                  chase.setOnClickListener(v -> {

                      frames.clear();

                      for (int i=0;i<12;i++) {

                          int r =
                                  (i % 3 == 0) ? 255 : 0;

                          int g =
                                  (i % 3 == 1) ? 255 : 0;

                          int b =
                                  (i % 3 == 2) ? 255 : 0;

                          frames.add(
                                  new Frame(
                                          r,g,b,
                                          b,r,g,
                                          120
                                  )
                          );
                      }

                      rebuildEditor(editor);
                  });

                  content.addView(chase);

                  Button rainbow =
                          button(
                                  "GENERATE RAINBOW"
                          );

                  rainbow.setOnClickListener(v -> {

                      frames.clear();

                      int[] colors = {
                              Color.RED,
                              Color.YELLOW,
                              Color.GREEN,
                              Color.CYAN,
                              Color.BLUE,
                              Color.MAGENTA
                      };

                      for (int c : colors) {

                          frames.add(
                                  new Frame(
                                          Color.red(c),
                                          Color.green(c),
                                          Color.blue(c),
                                          Color.blue(c),
                                          Color.red(c),
                                          Color.green(c),
                                          180
                                  )
                          );
                      }

                      rebuildEditor(editor);
                  });

                  content.addView(rainbow);

                  Button previewBtn =
                          button(
                                  "▶ PREVIEW BEFORE SEND"
                          );

                  previewBtn.setOnClickListener(
                          v -> showPreview()
                  );

                  content.addView(previewBtn);

                  Button save =
                          button(
                                  "SAVE CUSTOM SLOT " +
                                  selectedSlot
                          );

                  save.setOnClickListener(
                          v -> saveSlot()
                  );

                  content.addView(save);

                  Button send =
                          button(
                                  "TEST / SEND"
                          );

                  send.setOnClickListener(
                          v -> testFrames()
                  );

                  content.addView(send);
              }

              private void openColorEditor(
                      Frame f,
                      LinearLayout editor) {

                  clearContent();

                  content.addView(
                          text(
                                  "COLOR EDITOR",
                                  28
                          )
                  );

                  content.addView(
                          text(
                                  "LEFT / RIGHT dapat diatur terpisah.",
                                  14
                          )
                  );

                  EditText left =
                          edit(
                                  f.lr + "," +
                                  f.lg + "," +
                                  f.lb
                          );

                  EditText right =
                          edit(
                                  f.rr + "," +
                                  f.rg + "," +
                                  f.rb
                          );

                  content.addView(
                          label("LEFT RGB")
                  );

                  content.addView(left);

                  content.addView(
                          label("RIGHT RGB")
                  );

                  content.addView(right);

                  TextView wheel =
                          text(
                                  "⭕ RGB COLOR WHEEL\n" +
                                  "Gunakan input RGB di bawah.\n" +
                                  "Format: R,G,B",
                                  18
                          );

                  wheel.setGravity(
                          Gravity.CENTER
                  );

                  wheel.setPadding(
                          20,50,20,50
                  );

                  GradientDrawable gd =
                          new GradientDrawable(
                                  GradientDrawable.Orientation.TL_BR,
                                  new int[]{
                                          Color.RED,
                                          Color.YELLOW,
                                          Color.GREEN,
                                          Color.CYAN,
                                          Color.BLUE,
                                          Color.MAGENTA,
                                          Color.RED
                                  }
                          );

                  gd.setCornerRadius(500);

                  wheel.setBackground(gd);

                  content.addView(wheel);

                  Button apply =
                          button("APPLY");

                  apply.setOnClickListener(v -> {

                      int[] l =
                              parseRGB(
                                      left.getText().toString()
                              );

                      int[] r =
                              parseRGB(
                                      right.getText().toString()
                              );

                      if (l != null) {
                          f.lr=l[0];
                          f.lg=l[1];
                          f.lb=l[2];
                      }

                      if (r != null) {
                          f.rr=r[0];
                          f.rg=r[1];
                          f.rb=r[2];
                      }

                      showCustom();
                  });

                  content.addView(apply);

                  Button back =
                          button("BACK");

                  back.setOnClickListener(
                          v -> showCustom()
                  );

                  content.addView(back);
              }

              private int[] parseRGB(String s) {

                  try {

                      String[] p =
                              s.trim().split(",");

                      if (p.length != 3) {
                          return null;
                      }

                      int r =
                              clamp(
                                      Integer.parseInt(
                                              p[0].trim()
                                      )
                              );

                      int g =
                              clamp(
                                      Integer.parseInt(
                                              p[1].trim()
                                      )
                              );

                      int b =
                              clamp(
                                      Integer.parseInt(
                                              p[2].trim()
                                      )
                              );

                      return new int[]{r,g,b};

                  } catch (Exception e) {

                      return null;
                  }
              }

              private int clamp(int v) {

                  return Math.max(
                          0,
                          Math.min(255,v)
                  );
              }

              private void showPreview() {

                  clearContent();

                  content.addView(
                          text(
                                  "ANIMATION PREVIEW",
                                  28
                          )
                  );

                  TextView screen =
                          text(
                                  "PREVIEW",
                                  32
                          );

                  screen.setGravity(
                          Gravity.CENTER
                  );

                  screen.setMinimumHeight(350);

                  content.addView(screen);

                  Button play =
                          button("▶ PLAY");

                  play.setOnClickListener(v -> {

                      playing = true;

                      startPreview(screen);
                  });

                  content.addView(play);

                  Button pause =
                          button("⏸ PAUSE");

                  pause.setOnClickListener(
                          v -> stopPreview()
                  );

                  content.addView(pause);

                  Button restart =
                          button("↻ RESTART");

                  restart.setOnClickListener(v -> {

                      stopPreview();

                      playing = true;

                      startPreview(screen);
                  });

                  content.addView(restart);

                  Button send =
                          button(
                                  "SEND TO LED"
                          );

                  send.setOnClickListener(
                          v -> testFrames()
                  );

                  content.addView(send);

                  Button back =
                          button("BACK TO EDITOR");

                  back.setOnClickListener(
                          v -> showCustom()
                  );

                  content.addView(back);
              }

              private void startPreview(
                      TextView screen) {

                  handler.removeCallbacks(
                          previewRunnable
                  );

                  handler.post(
                          new Runnable() {

                              @Override
                              public void run() {

                                  if (!playing ||
                                      frames.isEmpty()) {
                                      return;
                                  }

                                  Frame f =
                                          frames.get(
                                                  (int)(
                                                          System.currentTimeMillis()
                                                          / Math.max(
                                                                  50,
                                                                  fDuration()
                                                          )
                                                  ) %
                                                  frames.size()
                                          );

                                  int r =
                                          (f.lr + f.rr) / 2;

                                  int g =
                                          (f.lg + f.rg) / 2;

                                  int b =
                                          (f.lb + f.rb) / 2;

                                  screen.setBackgroundColor(
                                          Color.rgb(
                                                  r,g,b
                                          )
                                  );

                                  screen.setText(
                                          "FRAME\n" +
                                          "L " +
                                          f.lr + "," +
                                          f.lg + "," +
                                          f.lb +
                                          "\nR " +
                                          f.rr + "," +
                                          f.rg + "," +
                                          f.rb
                                  );

                                  handler.postDelayed(
                                          this,
                                          Math.max(
                                                  50,
                                                  f.duration
                                          )
                                  );
                              }
                          }
                  );
              }

              private int fDuration() {

                  if (frames.isEmpty()) {
                      return 300;
                  }

                  return frames.get(0).duration;
              }

              private void stopPreview() {

                  playing = false;

                  handler.removeCallbacks(
                          previewRunnable
                  );
              }

              private void applyPreviewColor(
                      int r,
                      int g,
                      int b) {
              }

              private void testFrames() {

                  if (frames.isEmpty()) {

                      Toast.makeText(
                              this,
                              "Timeline masih kosong.",
                              Toast.LENGTH_SHORT
                      ).show();

                      return;
                  }

                  playing = true;

                  handler.removeCallbacks(
                          previewRunnable
                  );

                  handler.post(
                          new Runnable() {

                              int index = 0;

                              @Override
                              public void run() {

                                  if (!playing ||
                                      frames.isEmpty()) {
                                      return;
                                  }

                                  Frame f =
                                          frames.get(
                                                  index %
                                                  frames.size()
                                          );

                                  int r =
                                          (f.lr + f.rr) / 2;

                                  int g =
                                          (f.lg + f.rg) / 2;

                                  int b =
                                          (f.lb + f.rb) / 2;

                                  sendColor(
                                          r,g,b
                                  );

                                  index++;

                                  handler.postDelayed(
                                          this,
                                          Math.max(
                                                  50,
                                                  f.duration
                                          )
                                  );
                              }
                          }
                  );
              }

              private void saveSlot() {

                  StringBuilder s =
                          new StringBuilder();

                  for (Frame f : frames) {

                      s.append(f.lr).append(",");
                      s.append(f.lg).append(",");
                      s.append(f.lb).append(",");
                      s.append(f.rr).append(",");
                      s.append(f.rg).append(",");
                      s.append(f.rb).append(",");
                      s.append(f.duration).append(";");
                  }

                  prefs.edit()
                          .putString(
                                  "slot_" + selectedSlot,
                                  s.toString()
                          )
                          .apply();

                  Toast.makeText(
                          this,
                          "CUSTOM " +
                          selectedSlot +
                          " tersimpan.",
                          Toast.LENGTH_SHORT
                  ).show();
              }

              private void loadSlot() {

                  frames.clear();

                  String s =
                          prefs.getString(
                                  "slot_" + selectedSlot,
                                  ""
                          );

                  if (s.isEmpty()) {
                      return;
                  }

                  String[] rows =
                          s.split(";");

                  for (String row : rows) {

                      try {

                          String[] p =
                                  row.split(",");

                          if (p.length == 7) {

                              frames.add(
                                      new Frame(
                                              Integer.parseInt(p[0]),
                                              Integer.parseInt(p[1]),
                                              Integer.parseInt(p[2]),
                                              Integer.parseInt(p[3]),
                                              Integer.parseInt(p[4]),
                                              Integer.parseInt(p[5]),
                                              Integer.parseInt(p[6])
                                      )
                              );
                          }

                      } catch (Exception ignored) {
                      }
                  }
              }

              private void sendMode(int mode) {

                  if (mode < 1 ||
                      mode > 210) {
                      return;
                  }

                  currentModeNumber =
                          mode;

                  BluetoothService.getInstance()
                          .lastUsedMode =
                          mode;

                  byte[] packet = {
                          0x7B,
                          (byte)0xFF,
                          0x03,
                          (byte)mode,
                          (byte)0xFF,
                          (byte)0xFF,
                          (byte)0xFF,
                          (byte)0xFF,
                          (byte)0xBF
                  };

                  BluetoothService.getInstance()
                          .sendPacket(packet);

                  if (currentMode != null) {
                      currentMode.setText(
                              "MODE " +
                              mode
                      );
                  }

                  Toast.makeText(
                          this,
                          "MODE " + mode,
                          Toast.LENGTH_SHORT
                  ).show();
              }

              private void sendOff() {

                  byte[] packet = {
                          0x7B,
                          (byte)0xFF,
                          0x07,
                          0x00,
                          0x00,
                          0x00,
                          (byte)0xBF
                  };

                  BluetoothService.getInstance()
                          .sendPacket(packet);
              }

              private void sendColor(
                      int r,
                      int g,
                      int b) {

                  byte[] packet = {
                          0x7B,
                          (byte)0xFF,
                          0x07,
                          (byte)clamp(r),
                          (byte)clamp(g),
                          (byte)clamp(b),
                          (byte)0xBF
                  };

                  BluetoothService.getInstance()
                          .sendPacket(packet);
              }

              private void scan() {

                  if (bluetoothAdapter == null) {
                      return;
                  }

                  if (Build.VERSION.SDK_INT >= 31 &&
                      checkSelfPermission(
                              Manifest.permission.BLUETOOTH_SCAN
                      ) != PackageManager.PERMISSION_GRANTED) {

                      requestBluetoothPermission();
                      return;
                  }

                  scanner =
                          bluetoothAdapter
                                  .getBluetoothLeScanner();

                  status.setText(
                          "SCANNING..."
                  );

                  scanner.startScan(
                          scanCallback
                  );

                  handler.postDelayed(
                          () -> {

                              try {
                                  scanner.stopScan(
                                          scanCallback
                                  );
                              } catch (Exception ignored) {
                              }

                          },
                          10000
                  );
              }

              private final ScanCallback scanCallback =
                      new ScanCallback() {

                          @Override
                          public void onScanResult(
                                  int callbackType,
                                  ScanResult result) {

                              BluetoothDevice d =
                                      result.getDevice();

                              String name = null;

                              try {
                                  name =
                                          d.getName();
                              } catch (SecurityException ignored) {
                              }

                              if (name != null &&
                                  name.contains(
                                          "LEDDMX"
                                  )) {

                                  try {

                                      scanner.stopScan(
                                              this
                                      );

                                  } catch (Exception ignored) {
                                  }

                                  connect(d);
                              }
                          }
                      };

              private void connect(
                      BluetoothDevice device) {

                  status.setText(
                          "CONNECTING..."
                  );

                  if (Build.VERSION.SDK_INT >= 31 &&
                      checkSelfPermission(
                              Manifest.permission.BLUETOOTH_CONNECT
                      ) != PackageManager.PERMISSION_GRANTED) {

                      return;
                  }

                  gatt =
                          device.connectGatt(
                                  this,
                                  false,
                                  gattCallback
                          );
              }

              private final BluetoothGattCallback gattCallback =
                      new BluetoothGattCallback() {

                          @Override
                          public void onConnectionStateChange(
                                  BluetoothGatt g,
                                  int statusCode,
                                  int newState) {

                              runOnUiThread(() -> {

                                  if (newState ==
                                      BluetoothGatt.STATE_CONNECTED) {

                                      status.setText(
                                              "CONNECTED"
                                      );

                                      BluetoothService.getInstance()
                                              .gatt =
                                              g;

                                      BluetoothService.getInstance()
                                              .isConnected =
                                              true;

                                      g.discoverServices();

                                  } else {

                                      status.setText(
                                              "DISCONNECTED"
                                      );

                                      BluetoothService.getInstance()
                                              .isConnected =
                                              false;

                                      BluetoothService.getInstance()
                                              .gatt =
                                              null;

                                      BluetoothService.getInstance()
                                              .writeChar =
                                              null;
                                  }
                              });
                          }

                          @Override
                          public void onServicesDiscovered(
                                  BluetoothGatt g,
                                  int statusCode) {

                              BluetoothGattService service =
                                      g.getService(
                                              java.util.UUID.fromString(
                                                      BluetoothService.SERVICE_FFE0
                                              )
                                      );

                              if (service == null) {
                                  return;
                              }

                              BluetoothGattCharacteristic write =
                                      service.getCharacteristic(
                                              java.util.UUID.fromString(
                                                      BluetoothService.SERVICE_FFE1
                                              )
                                      );

                              if (write != null) {

                                  BluetoothService.getInstance()
                                          .writeChar =
                                          write;

                                  runOnUiThread(() ->
                                          status.setText(
                                                  "CONNECTED / READY"
                                          )
                                  );
                              }
                          }
                      };

