              EditText number(int n) {
                  EditText e=new EditText(this);
                  e.setText(""+n);
                  e.setTextColor(Color.WHITE);
                  e.setHintTextColor(Color.GRAY);
                  e.setHint("RGB");
                  e.setInputType(
                          android.text.InputType.TYPE_CLASS_NUMBER);
                  return e;
              }

              int val(EditText e) {
                  try {
                      return Math.max(0,Math.min(255,
                              Integer.parseInt(e.getText().toString())));
                  } catch(Exception x) {
                      return 0;
                  }
              }

              void generateStripe() {
                  frames.clear();

                  for(int i=0;i<8;i++) {
                      if(i%2==0)
                          frames.add(new Frame(
                                  255,0,0,
                                  0,0,255,250));
                      else
                          frames.add(new Frame(
                                  255,255,255,
                                  255,255,255,250));
                  }
              }

              void generateChase() {
                  frames.clear();

                  for(int i=0;i<8;i++) {
                      int r=(i%3==0)?255:0;
                      int g=(i%3==1)?255:0;
                      int b=(i%3==2)?255:0;

                      frames.add(new Frame(
                              r,g,b,
                              b,r,g,
                              160));
                  }
              }

              void generateRainbow() {
                  frames.clear();

                  for(int i=0;i<12;i++) {
                      float h=i*30f;

                      int c=Color.HSVToColor(
                              new float[]{h,1f,1f});

                      frames.add(new Frame(
                              Color.red(c),
                              Color.green(c),
                              Color.blue(c),
                              Color.blue(c),
                              Color.red(c),
                              Color.green(c),
                              180));
                  }
              }

