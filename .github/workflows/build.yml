              private void rebuildTimeline(
                      LinearLayout timeline,
                      StripPreview preview) {

                  timeline.removeAllViews();

                  for (int i = 0;
                       i < frames.size();
                       i++) {

                      final int index = i;

                      Frame f =
                              frames.get(i);

                      LinearLayout row =
                              horizontal();

                      TextView info =
                              text(
                                      "FRAME " +
                                      (i+1) +
                                      "\nLEFT #" +
                                      hex(
                                              f.lr,
                                              f.lg,
                                              f.lb
                                      ) +
                                      "\nRIGHT #" +
                                      hex(
                                              f.rr,
                                              f.rg,
                                              f.rb
                                      ) +
                                      "\n" +
                                      f.duration +
                                      " ms",
                                      12
                              );

                      row.addView(
                              info,
                              new LinearLayout.LayoutParams(
                                      0,
                                      100,
                                      1
                              )
                      );

                      Button edit =
                              button("EDIT");

                      edit.setOnClickListener(
                              v -> editFrame(
                                      index,
                                      preview
                              )
                      );

                      row.addView(
                              edit,
                              new LinearLayout.LayoutParams(
                                      90,
                                      70
                              )
                      );

                      Button del =
                              button("DEL");

                      del.setOnClickListener(
                              v -> {

                                  if (frames.size() > 1) {

                                      frames.remove(
                                              index
                                      );

                                      rebuildTimeline(
                                              timeline,
                                              preview
                                      );
                                  }
                              }
                      );

                      row.addView(
                              del,
                              new LinearLayout.LayoutParams(
                                      80,
                                      70
                              )
                      );

                      timeline.addView(row);
                  }
              }

              private void editFrame(
                      int index,
                      StripPreview preview) {

                  Frame f =
                          frames.get(index);

                  LinearLayout l =
                          vertical();

                  EditText dur =
                          new EditText(this);

                  dur.setText(
                          String.valueOf(
                                  f.duration
                          )
                  );

                  dur.setHint(
                          "Duration ms"
                  );

                  dur.setInputType(
                          2
                  );

                  l.addView(dur);

                  new AlertDialog.Builder(this)
                          .setTitle(
                                  "FRAME " +
                                          (index+1)
                          )
                          .setView(l)
                          .setPositiveButton(
                                  "SAVE",
                                  (d,w) -> {

                                      try {
                                          f.duration =
                                                  Integer.parseInt(
                                                          dur.getText()
                                                                  .toString()
                                                  );
                                      } catch (Exception ignored) {
                                          f.duration = 300;
                                      }

                                      preview.invalidate();
                                  }
                          )
                          .setNegativeButton(
                                  "CANCEL",
                                  null
                          )
                          .show();
              }

              // ====================================================
              // TEMPLATE GENERATOR
              // ====================================================

              private void makeTemplate(
                      String type) {

                  frames.clear();

                  int[][] colors = {
                          {255,0,0},
                          {255,128,0},
                          {255,255,0},
                          {0,255,0},
                          {0,255,255},
                          {0,0,255},
                          {180,0,255}
                  };

                  if (type.equals("RAINBOW") ||
                          type.equals("STRIPE / BELANG")) {

                      for (int[] c : colors) {

                          frames.add(
                                  new Frame(
                                          c[0],c[1],c[2],
                                          c[0],c[1],c[2],
                                          180
                                  )
                          );
                      }

                  } else if (
                          type.equals("POLICE")) {

                      frames.add(
                              new Frame(
                                      255,0,0,
                                      255,0,0,
                                      180
                              )
                      );

                      frames.add(
                              new Frame(
                                      0,0,255,
                                      0,0,255,
                                      180
                              )
                      );

                  } else if (
                          type.equals("FIRE")) {

                      frames.add(
                              new Frame(
                                      255,20,0,
                                      255,20,0,
                                      100
                              )
                      );

                      frames.add(
                              new Frame(
                                      255,120,0,
                                      255,120,0,
                                      130
                              )
                      );

                      frames.add(
                              new Frame(
                                      255,255,40,
                                      255,255,40,
                                      80
                              )
                      );

                  } else if (
                          type.equals("WATER")) {

                      frames.add(
                              new Frame(
                                      0,40,255,
                                      0,40,255,
                                      180
                              )
                      );

                      frames.add(
                              new Frame(
                                      0,220,255,
                                      0,220,255,
                                      220
                              )
                      );

                  } else {

                      frames.add(
                              new Frame(
                                      255,0,0,
                                      0,0,255,
                                      220
                              )
                      );

                      frames.add(
                              new Frame(
                                      0,255,0,
                                      255,0,255,
                                      220
                              )
                      );

                      frames.add(
                              new Frame(
                                      0,100,255,
                                      255,150,0,
                                      220
                              )
                      );
                  }
              }

              // ====================================================
              // APPLY FRAMES
              // ====================================================

              private void applyFrames() {

                  if (!connected) {
                      toast(
                              "Connect module dulu."
                      );
                      return;
                  }

                  int total =
                          frames.size();

                  for (int i = 0;
                       i < total;
                       i++) {

                      Frame f =
                              frames.get(i);

                      sendCustomColor(
                              i + 1,
                              total,
                              f.lr,
                              f.lg,
                              f.lb
                      );
                  }

                  sendCustomMode(0);

                  toast(
                          "Custom color list sent."
                  );
              }

