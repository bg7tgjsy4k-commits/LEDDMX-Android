              class ColorWheelView(
                  context:Context
              ):View(context) {

                  var onColorChanged:
                      ((Int,Int,Int)->Unit)?=null

                  var rr=255
                  var gg=0
                  var bb=0

                  val p=Paint(Paint.ANTI_ALIAS_FLAG)
                  var dragging=false

                  fun setColor(r:Int,g:Int,b:Int) {
                      rr=r
                      gg=g
                      bb=b
                      invalidate()
                  }

                  override fun onDraw(c:Canvas) {
                      super.onDraw(c)

                      val cx=width/2f
                      val cy=height/2f
                      val radius=min(width,height)/2f-28f

                      val shader=android.graphics.SweepGradient(
                          cx,
                          cy,
                          intArrayOf(
                              Color.RED,
                              Color.MAGENTA,
                              Color.BLUE,
                              Color.CYAN,
                              Color.GREEN,
                              Color.YELLOW,
                              Color.RED
                          ),
                          null
                      )

                      p.shader=shader
                      c.drawCircle(cx,cy,radius,p)

                      p.shader=null

                      val sat=android.graphics.RadialGradient(
                          cx,
                          cy,
                          radius,
                          Color.WHITE,
                          Color.TRANSPARENT,
                          Shader.TileMode.CLAMP
                      )

                      p.shader=sat
                      c.drawCircle(cx,cy,radius,p)

                      p.shader=null

                      val v=android.graphics.LinearGradient(
                          0f,
                          cy-radius,
                          0f,
                          cy+radius,
                          Color.TRANSPARENT,
                          Color.BLACK,
                          Shader.TileMode.CLAMP
                      )

                      p.shader=v
                      c.drawCircle(cx,cy,radius,p)

                      p.shader=null
                      p.style=Paint.Style.STROKE
                      p.strokeWidth=3f
                      p.color=Color.WHITE

                      val pos=colorPosition(cx,cy,radius)
                      c.drawCircle(pos.first,pos.second,9f,p)

                      p.style=Paint.Style.FILL
                  }

                  fun colorPosition(
                      cx:Float,
                      cy:Float,
                      radius:Float
                  ):Pair<Float,Float> {
                      val hsv=FloatArray(3)
                      Color.colorToHSV(
                          Color.rgb(rr,gg,bb),
                          hsv
                      )

                      val angle=Math.toRadians(
                          (hsv[0]-90).toDouble()
                      )

                      val sat=hsv[1]
                      val r=radius*sat

                      return Pair(
                          cx+(cos(angle)*r).toFloat(),
                          cy+(sin(angle)*r).toFloat()
                      )
                  }

                  override fun onTouchEvent(
                      e:android.view.MotionEvent
                  ):Boolean {
                      when(e.actionMasked) {
                          MotionEvent.ACTION_DOWN,
                          MotionEvent.ACTION_MOVE,
                          MotionEvent.ACTION_UP -> {
                              dragging=true

                              val cx=width/2f
                              val cy=height/2f
                              val dx=e.x-cx
                              val dy=e.y-cy

                              val radius=min(width,height)/2f-28f

                              val dist=hypot(dx,dy)
                                  .coerceAtMost(radius)

                              var deg=Math.toDegrees(
                                  atan2(dy.toDouble(),dx.toDouble())
                              )+90.0

                              if(deg<0)deg+=360.0

                              val hue=deg.toFloat()
                              val sat=(dist/radius)
                                  .coerceIn(0f,1f)

                              val hsv=floatArrayOf(
                                  hue,
                                  sat,
                                  1f
                              )

                              val color=Color.HSVToColor(hsv)

                              rr=Color.red(color)
                              gg=Color.green(color)
                              bb=Color.blue(color)

                              onColorChanged?.invoke(
                                  rr,gg,bb
                              )

                              invalidate()

                              if(
                                  e.actionMasked==
                                  MotionEvent.ACTION_UP
                              ) dragging=false

                              return true
                          }
                      }

                      return true
                  }
              }

              class ModePreviewView(
                  context:Context
              ):View(context) {

                  var mode=1
                  var frame=0

                  val p=Paint(Paint.ANTI_ALIAS_FLAG)

                  fun start(m:Int) {
                      mode=m
                      postInvalidateDelayed(35)
                  }

                  override fun onDraw(c:Canvas) {
                      val n=24
                      val gap=width.toFloat()/n

                      for(i in 0 until n) {
                          val x=i*gap+gap/2f

                          val phase=(frame+i*7+mode*13)%360
                          val col=Color.HSVToColor(
                              floatArrayOf(
                                  phase.toFloat(),
                                  0.9f,
                                  1f
                              )
                          )

                          p.color=col
                          c.drawCircle(
                              x,
                              height/2f,
                              min(gap,height/2f)*.32f,
                              p
                          )
                      }

                      frame=(frame+4)%360
                      postInvalidateDelayed(35)
                  }
              }

              class StripPreviewView(
                  context:Context
              ):View(context) {

                  var template="RAINBOW"
                  var frame=0
                  var primary=Color.RED
                  var animationSpeed=180
                  var animationBrightness=100
                  val colors=mutableListOf<Int>()

                  fun restart() {
                      frame=0
                      invalidate()
                  }

                  override fun onDraw(c:Canvas) {
                      val n=42
                      val gap=width.toFloat()/n

                      val speedFactor=
                          (animationSpeed.coerceAtLeast(1)/20)

                      for(i in 0 until n) {

                          val phase=when(template) {
                              "RAINBOW" ->
                                  frame+i*9
                              "WAVE" ->
                                  frame+i*14
                              "CHASE" ->
                                  if(
                                      ((i+frame/8)%8)==0
                                  ) frame*3 else 0
                              "COMET" ->
                                  frame*5-i*14
                              "SCANNER" ->
                                  abs(
                                      ((frame/4+i*8)%80)-40
                                  )*8
                              "MIRROR" ->
                                  frame+abs(i-n/2)*12
                              "PULSE" ->
                                  frame
                              "COLOUR CYCLE" ->
                                  frame*2
                              "STRIPE / BELANG" ->
                                  i*55+frame/2
                              "FADE" ->
                                  frame
                              "POLICE" ->
                                  if(
                                      ((frame/12)%2)==0
                                  ) {
                                      if(i<n/2)0 else 220
                                  } else {
                                      if(i<n/2)220 else 0
                                  }
                              "FIRE" ->
                                  10+i*2+frame*3
                              "WATER" ->
                                  190+i*3+frame*2
                              "RANDOM" ->
                                  i*17+frame*11
                              else ->
                                  frame+i*8
                          }

                          val hue=
                              ((phase%360)+360)%360

                          var col=when(template) {
                              "FIRE" ->
                                  Color.HSVToColor(
                                      floatArrayOf(
                                          hue.coerceIn(0f,55f),
                                          1f,
                                          1f
                                      )
                                  )
                              "WATER" ->
                                  Color.HSVToColor(
                                      floatArrayOf(
                                          hue.coerceIn(160f,240f),
                                          1f,
                                          1f
                                      )
                                  )
                              else ->
                                  Color.HSVToColor(
                                      floatArrayOf(
                                          hue.toFloat(),
                                          .92f,
                                          1f
                                      )
                                  )
                          }

                          if(colors.isNotEmpty()) {
                              col=colors[
                                  ((i+frame/10)%colors.size)
                              ]
                          }

                          val br=
                              animationBrightness.coerceIn(0,100)/100f

                          val r=(Color.red(col)*br).roundToInt()
                          val g=(Color.green(col)*br).roundToInt()
                          val b=(Color.blue(col)*br).roundToInt()

                          val finalColor=Color.rgb(r,g,b)

                          val cx=i*gap+gap/2f

                          val radius=
                              min(gap,height/2f)*.35f

                          val p=Paint(Paint.ANTI_ALIAS_FLAG)
                          p.color=finalColor

                          c.drawCircle(
                              cx,
                              height/2f,
                              radius,
                              p
                          )
                      }

                      frame+=max(
                          1,
                          speedFactor/20
                      )

                      postInvalidateDelayed(35)
                  }
              }
          }
