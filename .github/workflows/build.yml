              private class ColorWheel
                      extends View {

                  private final Paint paint =
                          new Paint(
                                  Paint.ANTI_ALIAS_FLAG);

                  private float cx;
                  private float cy;
                  private float radius;

                  interface Listener {
                      void changed(
                              int r,
                              int g,
                              int b);
                  }

                  private final Listener listener;

                  ColorWheel(
                          Context c,
                          Listener l) {

                      super(c);
                      listener = l;
                  }

                  @Override
                  protected void onDraw(
                          Canvas canvas) {

                      super.onDraw(canvas);

                      cx =
                              getWidth() / 2f;

                      cy =
                              getHeight() / 2f;

                      radius =
                              Math.min(
                                      getWidth(),
                                      getHeight()) *
                              0.42f;

                      SweepGradient hue =
                              new SweepGradient(
                                      cx,
                                      cy,
                                      new int[]{
                                              Color.RED,
                                              Color.MAGENTA,
                                              Color.BLUE,
                                              Color.CYAN,
                                              Color.GREEN,
                                              Color.YELLOW,
                                              Color.RED
                                      },
                                      null);

                      paint.setShader(hue);

                      canvas.drawCircle(
                              cx,
                              cy,
                              radius,
                              paint);

                      RadialGradient sat =
                              new RadialGradient(
                                      cx,
                                      cy,
                                      radius,
                                      Color.WHITE,
                                      Color.TRANSPARENT,
                                      Shader.TileMode.CLAMP);

                      paint.setShader(sat);

                      canvas.drawCircle(
                              cx,
                              cy,
                              radius,
                              paint);

                      paint.setShader(null);

                      paint.setStyle(
                              Paint.Style.STROKE);

                      paint.setStrokeWidth(5);

                      paint.setColor(
                              Color.WHITE);

                      canvas.drawCircle(
                              cx,
                              cy,
                              radius,
                              paint);

                      paint.setStyle(
                              Paint.Style.FILL);
                  }

                  @Override
                  public boolean onTouchEvent(
                          MotionEvent e) {

                      int a =
                              e.getAction();

                      if (a !=
                              MotionEvent.ACTION_DOWN
                          &&
                          a !=
                              MotionEvent.ACTION_MOVE) {

                          return true;
                      }

                      float dx =
                              e.getX() - cx;

                      float dy =
                              e.getY() - cy;

                      float dist =
                              (float)
                              Math.sqrt(
                                      dx * dx +
                                      dy * dy);

                      if (dist > radius) {
                          return true;
                      }

                      float hue =
                              (float)
                              ((Math.toDegrees(
                                      Math.atan2(
                                              dy,
                                              dx))
                                      + 360)
                                      % 360);

                      float sat =
                              Math.min(
                                      1f,
                                      dist / radius);

                      int c =
                              Color.HSVToColor(
                                      new float[]{
                                              hue,
                                              sat,
                                              1f
                                      });

                      if (listener != null) {

                          listener.changed(
                                  Color.red(c),
                                  Color.green(c),
                                  Color.blue(c));
                      }

                      return true;
                  }
              }

              private static class Frame {

                  int lr;
                  int lg;
                  int lb;

                  int rr;
                  int rg;
                  int rb;

                  int duration;

                  Frame(
                          int lr,
                          int lg,
                          int lb,
                          int rr,
                          int rg,
                          int rb,
                          int duration) {

                      this.lr = lr;
                      this.lg = lg;
                      this.lb = lb;

                      this.rr = rr;
                      this.rg = rg;
                      this.rb = rb;

                      this.duration = duration;
                  }

                  Frame copy() {

                      return new Frame(
                              lr,
                              lg,
                              lb,
                              rr,
                              rg,
                              rb,
                              duration);
                  }
              }

              private static class PreviewView
                      extends View {

                  private final Paint paint =
                          new Paint(
                                  Paint.ANTI_ALIAS_FLAG);

                  private Frame frame;

                  PreviewView(Context c) {
                      super(c);
                  }

                  void setFrame(Frame f) {

                      frame = f;
                      invalidate();
                  }

                  @Override
                  protected void onDraw(
                          Canvas canvas) {

                      canvas.drawColor(
                              Color.BLACK);

                      if (frame == null) {
                          return;
                      }

                      int w =
                              getWidth();

                      int h =
                              getHeight();

                      paint.setStyle(
                              Paint.Style.FILL);

                      paint.setColor(
                              Color.rgb(
                                      frame.lr,
                                      frame.lg,
                                      frame.lb));

                      canvas.drawRoundRect(
                              10,
                              15,
                              w / 2f - 8,
                              h - 15,
                              22,
                              22,
                              paint);

                      paint.setColor(
                              Color.rgb(
                                      frame.rr,
                                      frame.rg,
                                      frame.rb));

                      canvas.drawRoundRect(
                              w / 2f + 8,
                              15,
                              w - 10,
                              h - 15,
                              22,
                              22,
                              paint);

                      paint.setTextAlign(
                              Paint.Align.CENTER);

                      paint.setTextSize(20);

                      paint.setColor(
                              Color.WHITE);

                      canvas.drawText(
                              "LEFT",
                              w / 4f,
                              h / 2f,
                              paint);

                      canvas.drawText(
                              "RIGHT",
                              w * .75f,
                              h / 2f,
                              paint);
                  }

                  @Override
                  protected void onMeasure(
                          int ws,
                          int hs) {

                      int w =
                              MeasureSpec.getSize(ws);

                      setMeasuredDimension(
                              w,
                              Math.max(
                                      280,
                                      w / 2));
                  }
              }

              private static class ModePreview
                      extends View {

                  private final Paint paint =
                          new Paint(
                                  Paint.ANTI_ALIAS_FLAG);

                  private int mode = 1;
                  private int phase = 0;

                  private final Handler h =
                          new Handler(
                                  Looper.getMainLooper());

                  ModePreview(Context c) {

                      super(c);

                      h.postDelayed(
                              new Runnable() {

                                  @Override
                                  public void run() {

                                      phase++;

                                      invalidate();

                                      h.postDelayed(
                                              this,
                                              180);
                                  }
                              },
                              180);
                  }

                  void setMode(
                          int m) {

                      mode = m;
                      invalidate();
                  }

                  @Override
                  protected void onDraw(
                          Canvas canvas) {

                      int w =
                              getWidth();

                      int h =
                              getHeight();

                      float hue =
                              (mode * 31f +
                               phase * 8f)
                              % 360f;

                      int a =
                              Color.HSVToColor(
                                      new float[]{
                                              hue,
                                              1f,
                                              1f
                                      });

                      int b =
                              Color.HSVToColor(
                                      new float[]{
                                              (hue + 180)
                                              % 360,
                                              1f,
                                              1f
                                      });

                      paint.setColor(a);

                      canvas.drawRoundRect(
                              8,
                              8,
                              w / 2f - 5,
                              h - 8,
                              20,
                              20,
                              paint);

                      paint.setColor(b);

                      canvas.drawRoundRect(
                              w / 2f + 5,
                              8,
                              w - 8,
                              h - 8,
                              20,
                              20,
                              paint);

                      paint.setColor(
                              Color.WHITE);

                      paint.setTextAlign(
                              Paint.Align.CENTER);

                      paint.setTextSize(17);

                      canvas.drawText(
                              "MODE " +
                              mode +
                              " • ESTIMATED PREVIEW",
                              w / 2f,
                              h / 2f,
                              paint);
                  }

                  @Override
                  protected void onMeasure(
                          int ws,
                          int hs) {

                      int w =
                              MeasureSpec.getSize(ws);

                      setMeasuredDimension(
                              w,
                              Math.max(
                                      180,
                                      w / 3));
                  }
              }
          }
