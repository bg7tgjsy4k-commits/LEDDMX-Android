                                  int p =
                                          s.getProgress();


                                  send(
                                          packet(
                                                  0x7B,
                                                  0xFF,
                                                  0x01,
                                                  p * 32 / 100,
                                                  p,
                                                  0x00,
                                                  0xFF,
                                                  0xFF,
                                                  0xBF
                                          )
                                  );

                              }

                          }
                  );


                  // ==================================================
                  // SPEED
                  // ==================================================

                  root.addView(
                          text(
                                  "SPEED"
                          )
                  );


                  SeekBar speed =
                          new SeekBar(this);


                  speed.setMax(
                          255
                  );


                  speed.setProgress(
                          128
                  );


                  root.addView(speed);


                  speed.setOnSeekBarChangeListener(
                          new SeekBar.OnSeekBarChangeListener() {

                              public void onProgressChanged(
                                      SeekBar s,
                                      int p,
                                      boolean f
                              ) {
                              }


                              public void onStartTrackingTouch(
                                      SeekBar s
                              ) {
                              }


                              public void onStopTrackingTouch(
                                      SeekBar s
                              ) {

                                  send(
                                          packet(
                                                  0x7B,
                                                  0xFF,
                                                  0x02,
                                                  s.getProgress(),
                                                  0x00,
                                                  0xFF,
                                                  0xFF,
                                                  0xFF,
                                                  0xBF
                                          )
                                  );

                              }

                          }
                  );


                  // ==================================================
                  // INTERNAL MODE
                  // ==================================================

                  root.addView(
                          text(
                                  "INTERNAL MODE 0-210"
                          )
                  );


                  modeSpinner =
                          new Spinner(this);


                  modeSpinner.setAdapter(
                          new ArrayAdapter<>(
                                  this,
                                  android.R.layout.simple_spinner_dropdown_item,
                                  modes
                          )
                  );


                  root.addView(
