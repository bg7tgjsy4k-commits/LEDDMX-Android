        private fun text(
            c: Canvas,
            s: String,
            x: Float,
            y: Float,
            size: Float,
            color: Int
        ) {
            p.style = Paint.Style.FILL
            p.color = color
            p.textSize = size
            p.typeface =
                Typeface.create(
                    Typeface.DEFAULT,
                    Typeface.NORMAL
                )

            c.drawText(s, x, y, p)
        }

        override fun onTouchEvent(event: MotionEvent): Boolean {
            val x = event.x
            val y = event.y

            when (event.actionMasked) {

                MotionEvent.ACTION_DOWN -> {
                    downX = x
                    downY = y

                    if (
                        page == Page.HOME &&
                        wheelHit(
                            x,
                            y
                        )
                    ) {
                        draggingWheel = true

                        updateColorFromWheel(
                            x,
                            y,
                            width / 2f,
                            wheelCenterY(),
                            105f
                        )

                        send(
                            Protocol.rgb(currentColor),
                            "RGB"
                        )

                        return true
                    }

                    if (
                        page == Page.CUSTOM &&
                        customWheelHit(x, y)
                    ) {
                        draggingWheel = true

                        updateColorFromWheel(
                            x,
                            y,
                            115f,
                            355f,
                            100f
                        )

                        return true
                    }

                    return true
                }

                MotionEvent.ACTION_MOVE -> {
                    if (draggingWheel) {
                        if (page == Page.HOME) {
                            updateColorFromWheel(
                                x,
                                y,
                                width / 2f,
                                wheelCenterY(),
                                105f
                            )
                        } else if (page == Page.CUSTOM) {
                            updateColorFromWheel(
                                x,
                                y,
                                115f,
                                355f,
                                100f
                            )
                        }

                        return true
                    }

                    if (page == Page.HOME) {
                        if (
                            y > wheelCenterY() + 120f &&
                            y < wheelCenterY() + 175f
                        ) {
                            val left = 28f
                            val right = width - 28f

                            brightness =
                                (((x - left) /
                                    (right - left)) * 100f)
                                    .roundToInt()
                                    .coerceIn(0, 100)

                            invalidate()
                            return true
                        }

                        if (
                            y > wheelCenterY() + 185f &&
                            y < wheelCenterY() + 240f
                        ) {
                            val left = 28f
                            val right = width - 28f

                            speed =
                                (((x - left) /
                                    (right - left)) * 100f)
                                    .roundToInt()
                                    .coerceIn(0, 100)

                            invalidate()
                            return true
                        }
                    }

                    if (
                        page == Page.EFFECTS &&
                        abs(y - downY) > 35f
                    ) {
                        val delta =
                            ((downY - y) / 30f)
                                .roundToInt()

                        effectScroll =
                            (effectScroll + delta)
                                .coerceIn(
                                    0,
                                    max(
                                        0,
                                        PatternNames.ALL.size - 12
                                    )
                                )

                        downY = y
                        invalidate()
                        return true
                    }

                    return true
                }

                MotionEvent.ACTION_UP -> {
                    val dx = x - downX
                    val dy = y - downY

                    if (draggingWheel) {
                        draggingWheel = false

                        send(
                            Protocol.rgb(currentColor),
                            "RGB"
                        )

                        return true
                    }

                    if (drawer) {
                        if (x <= 310f) {
                            val index =
                                ((y - 110f) / 62f)
                                    .floorToInt()

                            val pages =
                                listOf(
                                    Page.HOME,
                                    Page.EFFECTS,
                                    Page.CUSTOM,
                                    Page.ANALYZER,
                                    Page.PROTOCOL,
                                    Page.SETTINGS
                                )

                            if (index in pages.indices) {
                                page = pages[index]
                                drawer = false
                                invalidate()
                                return true
                            }
                        }

                        drawer = false
                        invalidate()
                        return true
                    }

                    if (
                        y < 80f &&
                        x < 65f
                    ) {
                        drawer = true
                        invalidate()
                        return true
                    }

                    when (page) {
                        Page.HOME -> homeTouch(x, y)
                        Page.EFFECTS -> effectsTouch(x, y)
                        Page.CUSTOM -> customTouch(x, y)
                        Page.ANALYZER -> analyzerTouch(x, y)
                        Page.PROTOCOL -> protocolTouch(x, y)
                        Page.SETTINGS -> settingsTouch(x, y)
                    }

                    return true
                }
            }

            return true
        }

        private fun wheelCenterY(): Float {
            var y = 198f

            if (devices.isNotEmpty()) {
                y += 25f + min(devices.size, 4) * 64f
            } else {
                y += 72f
            }

            return y + 145f
        }

        private fun wheelHit(x: Float, y: Float): Boolean {
            val cx = width / 2f
            val cy = wheelCenterY()

            return hypot(
                x - cx,
                y - cy
            ) <= 115f
        }

        private fun customWheelHit(
            x: Float,
            y: Float
        ): Boolean {
            return hypot(
                x - 115f,
                y - 355f
            ) <= 110f
        }

        private fun homeTouch(
            x: Float,
            y: Float
        ) {
            if (y in 120f..184f) {
                if (x in 20f..170f) {
                    send(
                        Protocol.power(true),
                        "POWER ON"
                    )
                    return
                }

                if (x in 180f..330f) {
                    send(
                        Protocol.power(false),
                        "POWER OFF"
                    )
                    return
                }

                if (x >= 340f) {
                    if (scanning) stopScan()
                    else startScan()

                    return
                }
            }

            var yy = 198f

            if (devices.isNotEmpty()) {
                yy += 25f

                devices.values.take(4).forEach { d ->
                    if (
                        y >= yy &&
                        y <= yy + 55f
                    ) {
                        connect(d)
                        return
                    }

                    yy += 64f
                }
            } else {
                yy += 72f
            }
        }

        private fun effectsTouch(
            x: Float,
            y: Float
        ) {
            val top = 150f
            val rowH = 58f
            val colW = width / 2f

            if (y < top) return

            val row =
                ((y - top) / rowH).floorToInt()

            if (row !in 0..5) return

            val col =
                if (x < colW) 0 else 1

            val i =
                row * 2 + col

            val index =
                effectScroll + i

            if (
                index in PatternNames.ALL.indices
            ) {
                selectedEffect = index

                send(
                    Protocol.pattern(index),
                    "MODE ${index}"
                )

                invalidate()
            }
        }

        private fun customTouch(
            x: Float,
            y: Float
        ) {
            if (
                y in 480f..528f &&
                x in 185f..300f
            ) {
                if (customColors.size < 8) {
                    customColors.add(currentColor)
                }

                invalidate()
                return
            }

            if (
                y in 480f..528f &&
                x in 300f..430f
            ) {
                saveCustomSlot(171)
                return
            }

            if (y in 570f..680f) {
                val col =
                    ((x - 20f) / 135f).floorToInt()

                val row =
                    ((y - 570f) / 54f).floorToInt()

                val index =
                    row * 3 + col

                val names =
                    listOf(
                        "RAINBOW",
                        "WAVE",
                        "CHASE",
                        "COMET",
                        "SCANNER",
                        "BELANG"
                    )

                if (index in names.indices) {
                    applyTemplate(index)
                    invalidate()
                }
            }
        }

        private fun analyzerTouch(
            x: Float,
            y: Float
        ) {
            if (
                y in 158f..202f &&
                x in 22f..142f
            ) {
                showRawDialog()
                return
            }

            if (
                y in 158f..202f &&
                x in 152f..272f
            ) {
                logs.clear()
                invalidate()
                return
            }

            if (
                y in 158f..202f &&
                x in 282f..402f
            ) {
                showGattDialog()
                return
            }
        }

        private fun protocolTouch(
            x: Float,
            y: Float
        ) {
            if (
                y in 155f..587f
            ) {
                val index =
                    ((y - 155f) / 54f)
                        .floorToInt()

                when (index) {
                    0 -> send(
                        Protocol.power(true),
                        "POWER ON"
                    )

                    1 -> send(
                        Protocol.power(false),
                        "POWER OFF"
                    )

                    2 -> send(
                        Protocol.rgb(currentColor),
                        "RGB"
                    )

                    3 -> send(
                        Protocol.pattern(1),
                        "MODE 1"
                    )

                    4 -> send(
                        Protocol.pattern(171),
                        "MODE 171"
                    )

                    5 -> send(
                        Protocol.pattern(210),
                        "MODE 210"
                    )

                    6 -> send(
                        Protocol.direction(true),
                        "DIR FORWARD"
                    )

                    7 -> send(
                        Protocol.direction(false),
                        "DIR REVERSE"
                    )
                }

                return
            }

            if (
                y in 610f..662f
            ) {
                showRawDialog()
            }
        }

        private fun settingsTouch(
            x: Float,
            y: Float
        ) {
            if (
                y in 585f..635f
            ) {
                try {
                    startActivity(
                        Intent(
                            Settings.ACTION_BLUETOOTH_SETTINGS
                        )
                    )
                } catch (_: Throwable) {
                }
                return
            }

            if (
                y in 650f..705f
            ) {
                disconnect()
            }
        }

        private fun showGattDialog() {
            val g = gatt

            if (g == null) {
                AlertDialog.Builder(this@MainActivity)
                    .setTitle("GATT")
                    .setMessage(
                        "No active GATT connection."
                    )
                    .setPositiveButton("OK", null)
                    .show()
                return
            }

            val sb = StringBuilder()

            g.services.forEach { service ->
                sb.append("SERVICE\n")
                sb.append(service.uuid)
                sb.append("\n\n")

                service.characteristics.forEach { c ->
                    sb.append("CHARACTERISTIC\n")
                    sb.append(c.uuid)
                    sb.append("\nproperties=")
                    sb.append(c.properties)
                    sb.append("\n\n")
                }
            }

            if (sb.isEmpty()) {
                sb.append("NOT EXPOSED BY DEVICE")
            }

            AlertDialog.Builder(this@MainActivity)
                .setTitle("DEVICE-SOURCE GATT")
                .setMessage(sb.toString())
                .setPositiveButton("OK", null)
                .show()
        }

        private fun saveCustomSlot(slot: Int) {
            val pref =
                getSharedPreferences(
                    "slots",
                    MODE_PRIVATE
                )

            val colors =
                customColors.joinToString(",") {
                    it.toString()
                }

            pref.edit()
                .putString(
                    "slot_$slot",
                    "$colors|$customMode|$customForward"
                )
                .apply()

            sendCustomToDevice()

            Toast.makeText(
                this@MainActivity,
                "CUSTOM SLOT $slot SAVED",
                Toast.LENGTH_SHORT
            ).show()
        }

        private fun sendCustomToDevice() {
            if (customColors.isEmpty()) return

            customColors.forEachIndexed { i, color ->
                send(
                    Protocol.customColor(
                        i + 1,
                        customColors.size,
                        color
                    ),
                    "CUSTOM COLOR ${i + 1}"
                )
            }

            send(
                Protocol.customMode(customMode),
                "CUSTOM MODE"
            )

            send(
                Protocol.customDirection(customForward),
                "CUSTOM DIRECTION"
            )
        }

        private fun applyTemplate(index: Int) {
            when (index) {
                0 -> {
                    customColors.clear()

                    for (i in 0 until 7) {
                        customColors.add(
                            Color.HSVToColor(
                                floatArrayOf(
                                    i * 360f / 7f,
                                    1f,
                                    1f
                                )
                            )
                        )
                    }

                    customMode = 0
                }

                1 -> {
                    customMode = 2
                }

                2 -> {
                    customMode = 1
                }

                3 -> {
                    customMode = 5
                }

                4 -> {
                    customMode = 6
                }

                5 -> {
                    customMode = 3
                }
            }

            sendCustomToDevice()
        }
    }
}
