              private static class PreviewView
                      extends View {

                  private final Paint paint =
                          new Paint(
                                  Paint.ANTI_ALIAS_FLAG
                          );

                  private int left =
                          Color.RED;

                  private int right =
                          Color.BLUE;

                  PreviewView(Context context) {

                      super(context);

                      setBackgroundColor(
                              Color.rgb(10, 10, 12)
                      );
                  }

                  void setFrames(
                          ArrayList<AnimFrame> frames
                  ) {

                      invalidate();
                  }

                  void setFrame(
                          int left,
                          int right
                  ) {

                      this.left = left;
                      this.right = right;

                      invalidate();
                  }

                  @Override
                  protected void onDraw(
                          Canvas canvas
                  ) {

                      super.onDraw(canvas);

                      int w =
                              getWidth();

                      int h =
                              getHeight();

                      paint.setColor(left);

                      canvas.drawRect(
                              0,
                              0,
                              w / 2f,
                              h,
                              paint
                      );

                      paint.setColor(right);

                      canvas.drawRect(
                              w / 2f,
                              0,
                              w,
                              h,
                              paint
                      );

                      paint.setColor(Color.WHITE);
                      paint.setTextSize(18);
                      paint.setTextAlign(
                              Paint.Align.CENTER
                      );

                      canvas.drawText(
                              "LEFT",
                              w / 4f,
                              h / 2f,
                              paint
                      );

                      canvas.drawText(
                              "RIGHT",
                              w * 3f / 4f,
                              h / 2f,
                              paint
                      );
                  }
              }
          }
