              private void checkOTA() {

                  if(gatt == null) {
                      toast(
                          "Device belum connected."
                      );
                      return;
                  }

                  BluetoothGattService s =
                      gatt.getService(
                          UUID.fromString(
                              OTA_SERVICE
                          )
                      );

                  if(s == null) {

                      toast(
                          "OTA SERVICE: NOT EXPOSED BY DEVICE"
                      );

                  } else {

                      toast(
                          "OTA SERVICE TERDETEKSI. " +
                          "JANGAN FLASH FIRMWARE RANDOM."
                      );

                      analyzerLog.add(
                          "DEVICE OTA SERVICE = " +
                          s.getUuid()
                      );
                  }
              }

              private String joinLog() {

                  StringBuilder sb =
                      new StringBuilder();

                  for(String s:
                      analyzerLog) {

                      sb.append(s)
                        .append("\n");
                  }

                  return sb.toString();
              }

              private byte[] parseHex(
                      String text) {

                  try {

                      String x =
                          text.replace(
                              "0x",
                              ""
                          )
                          .replace(
                              " ",
                              ""
                          )
                          .replace(
                              "\n",
                              ""
                          )
                          .replace(
                              "\t",
                              ""
                          );

                      if(x.length()==0 ||
                         (x.length()%2)!=0) {
                          return null;
                      }

                      byte[] b =
                          new byte[x.length()/2];

                      for(int i=0;
                          i<b.length;
                          i++) {

                          b[i] =
                              (byte)Integer.parseInt(
                                  x.substring(
                                      i*2,
                                      i*2+2
                                  ),
                                  16
                              );
                      }

                      return b;

                  } catch(Exception e) {

                      return null;
                  }
              }

