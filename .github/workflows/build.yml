              // ======================================================
              // PERMISSIONS
              // ======================================================

              void requestPermissionsBLE() {

                  if (
                          Build.VERSION.SDK_INT >= 31
                  ) {

                      requestPermissions(
                              new String[] {
                                      Manifest.permission.BLUETOOTH_SCAN,
                                      Manifest.permission.BLUETOOTH_CONNECT
                              },
                              50
                      );

                  } else if (
                          Build.VERSION.SDK_INT >= 23
                  ) {

                      requestPermissions(
                              new String[] {
                                      Manifest.permission.ACCESS_FINE_LOCATION
                              },
                              50
                      );

                  }

              }


              boolean hasPermission() {

                  if (
                          Build.VERSION.SDK_INT >= 31
                  ) {

                      return checkSelfPermission(
                              Manifest.permission.BLUETOOTH_SCAN
                      )
                      ==
                      PackageManager.PERMISSION_GRANTED;

                  }


                  if (
                          Build.VERSION.SDK_INT < 23
                  ) {

                      return true;

                  }


                  return checkSelfPermission(
                          Manifest.permission.ACCESS_FINE_LOCATION
                  )
                  ==
                  PackageManager.PERMISSION_GRANTED;

              }


              // ======================================================
              // SCAN
              // ======================================================

              void scanBLE() {

                  if (
                          bluetoothAdapter == null
                  ) {

                      status.setText(
                              "Bluetooth tidak tersedia"
                      );

                      return;

                  }


                  if (
                          !bluetoothAdapter.isEnabled()
                  ) {

                      status.setText(
                              "Bluetooth OFF"
                      );

                      return;

                  }


                  if (
                          !hasPermission()
                  ) {

                      requestPermissionsBLE();

                      return;

                  }


                  long now =
                          System.currentTimeMillis();


                  if (
                          scanning ||
                          now - lastScan < 2500
                  ) {

                      status.setText(
                              "Tunggu 2.5 detik"
                      );

                      return;

                  }


                  lastScan =
                          now;


                  devices.clear();

                  names.clear();


                  if (
                          deviceAdapter != null
                  ) {

                      deviceAdapter.notifyDataSetChanged();

                  }


                  scanner =
                          bluetoothAdapter
                                  .getBluetoothLeScanner();


                  if (
                          scanner == null
                  ) {

                      status.setText(
                              "BLE scanner null"
                      );

                      return;

                  }


                  scanning =
                          true;


                  status.setText(
                          "Scanning..."
                  );


                  try {

                      scanner.startScan(
                              scanCallback
                      );

                  } catch (
                          Exception e
                  ) {

                      scanning =
                              false;


                      status.setText(
                              "Scan error: " +
                              e.getMessage()
                      );


                      return;

                  }


                  handler.postDelayed(
                          this::stopScan,
                          4500
                  );

              }


              void stopScan() {

                  if (
                          !scanning
                  ) {

                      return;

                  }


                  try {

                      if (
                              scanner != null
                      ) {

                          scanner.stopScan(
                                  scanCallback
                          );

                      }

                  } catch (
                          Exception ignored
                  ) {
                  }


                  scanning =
                          false;


                  status.setText(
                          names.isEmpty()
                                  ?
                                  "Scan selesai: 0 device"
                                  :
                                  "Scan selesai: pilih device lalu CONNECT"
                  );

              }


              // ======================================================
              // SCAN CALLBACK
              // ======================================================

              final ScanCallback scanCallback =
                      new ScanCallback() {

                          @Override
                          public void onScanResult(
                                  int callbackType,
                                  ScanResult result
                          ) {

                              BluetoothDevice device =
                                      result.getDevice();


                              String name =
                                      null;


                              if (
                                      result.getScanRecord()
                                              != null
                              ) {

                                  name =
                                          result
                                                  .getScanRecord()
                                                  .getDeviceName();

                              }


                              if (
                                      name == null ||
                                      name.isEmpty()
                              ) {

                                  try {

                                      name =
                                              device.getName();

                                  } catch (
                                          Exception ignored
                                  ) {
                                  }

                              }


                              if (
                                      name == null
                              ) {

                                  name =
                                          "UNKNOWN";

                              }


                              String row =
                                      name +
                                      " | " +
                                      device.getAddress();


                              if (
                                      !names.contains(row)
                              ) {

                                  devices.add(
                                          device
                                  );


                                  names.add(
                                          row
                                  );


                                  runOnUiThread(
                                          () ->
                                                  deviceAdapter
                                                          .notifyDataSetChanged()
                                  );

                              }

                          }


                          @Override
                          public void onScanFailed(
                                  int errorCode
                          ) {

                              scanning =
                                      false;


                              runOnUiThread(
                                      () ->
                                              status.setText(
                                                      "SCAN FAILED code=" +
                                                      errorCode
                                              )
                              );

                          }

                      };


              // ======================================================
              // CONNECT
              // ======================================================

              void connect(
                      BluetoothDevice device
              ) {

                  try {

                      status.setText(
                              "Connecting " +
                              device.getAddress()
                      );


                      gatt =
                              device.connectGatt(
                                      this,
                                      false,
                                      gattCallback
                              );


                  } catch (
                          Exception e
                  ) {

                      status.setText(
                              "Connect error: " +
                              e.getMessage()
                      );

                  }

              }


              // ======================================================
              // GATT CALLBACK
              // ======================================================

              final BluetoothGattCallback gattCallback =
                      new BluetoothGattCallback() {

                          @Override
                          public void onConnectionStateChange(
                                  BluetoothGatt g,
                                  int state,
                                  int newState
                          ) {

                              if (
                                      newState ==
                                              BluetoothProfile.STATE_CONNECTED
                              ) {

                                  gatt =
                                          g;


                                  runOnUiThread(
                                          () ->
                                                  status.setText(
                                                          "Connected — discovering..."
                                                  )
                                  );


                                  g.discoverServices();


                              } else {

                                  writeCharacteristic =
                                          null;


                                  runOnUiThread(
                                          () ->
                                                  status.setText(
                                                          "Disconnected"
                                                  )
                                  );


                                  try {

                                      g.close();

                                  } catch (
                                          Exception ignored
                                  ) {
                                  }

                              }

                          }


                          @Override
                          public void onServicesDiscovered(
                                  BluetoothGatt g,
                                  int state
                          ) {

                              BluetoothGattService service =
                                      g.getService(
                                              SVC
                                      );


                              writeCharacteristic =
                                      service == null
                                              ?
                                              null
                                              :
                                              service.getCharacteristic(
                                                      CH
                                              );


                              boolean ota =
                                      g.getService(
                                              OTA
                                      )
                                      != null;


                              runOnUiThread(
                                      () ->
                                              status.setText(
                                                      writeCharacteristic != null
                                                              ?
                                                              "READY FFE1" +
                                                              (
                                                                  ota
                                                                  ?
                                                                  " | OTA DETECTED"
                                                                  :
                                                                  ""
                                                              )
                                                              :
                                                              "Connected tetapi FFE1 tidak ditemukan"
                                              )
                              );

                          }

                      };


              // ======================================================
              // WRITE QUEUE
              // ======================================================

              void send(
                      byte[] data
              ) {

                  if (
                          data == null ||
                          data.length == 0
                  ) {

                      return;

                  }


                  synchronized (
                          queue
                  ) {

                      queue.add(data);

                  }


                  drainQueue();

              }


              void drainQueue() {

                  if (
                          writing
                  ) {

                      return;

                  }


                  byte[] data;


                  synchronized (
                          queue
                  ) {

                      data =
                              queue.poll();

                  }


                  if (
                          data == null
                  ) {

                      return;

                  }


                  if (
                          gatt == null ||
                          writeCharacteristic == null
                  ) {

                      status.setText(
                              "Belum READY FFE1"
                      );


                      return;

                  }


                  writing =
                          true;


                  handler.postDelayed(
                          () -> {

                              try {

                                  writeCharacteristic
                                          .setWriteType(
                                                  BluetoothGattCharacteristic
                                                          .WRITE_TYPE_DEFAULT
                                          );


                                  writeCharacteristic
                                          .setValue(
                                                  data
                                          );


                                  boolean ok =
                                          gatt.writeCharacteristic(
                                                  writeCharacteristic
                                          );


                                  if (
                                          !ok
                                  ) {

                                      status.setText(
                                              "BLE write rejected"
                                      );

                                  }

                              } catch (
                                      Exception e
                              ) {

                                  status.setText(
                                          "BLE write error"
                                  );

                              }


                              writing =
                                      false;


                              drainQueue();

                          },
                          90
                  );

              }


              // ======================================================
              // PACKET
              // ======================================================

              byte[] packet(
                      int... values
              ) {

                  byte[] result =
                          new byte[
                                  values.length
                          ];


                  for (
                          int i = 0;
                          i < values.length;
                          i++
                  ) {

                      result[i] =
                              (byte)
                                      values[i];

                  }


                  return result;

              }


              // ======================================================
              // RGB
              // ======================================================

              void setRGB() {

                  try {

                      String value =
                              rgb
                                      .getText()
                                      .toString()
                                      .trim()
                                      .replace(
                                              "#",
                                              ""
                                      );


                      if (
                              value.length() != 6
                      ) {

                          throw new Exception();

                      }


                      int color =
                              Integer.parseInt(
                                      value,
                                      16
                              );


                      send(
                              packet(
                                      0x7B,
                                      0xFF,
                                      0x07,
                                      color >> 16 & 255,
                                      color >> 8 & 255,
                                      color & 255,
                                      0x00,
                                      0xFF,
                                      0xBF
                              )
                      );


                  } catch (
                          Exception e
                  ) {

                      Toast.makeText(
                              this,
                              "HEX harus RRGGBB",
                              Toast.LENGTH_SHORT
                      ).show();

                  }

              }


              // ======================================================
              // CUSTOM LEDDMX-00
              //
              // 7B position 0E FD R G B total BF
              //
              // 7B FF 13 mode FF FF FF FF BF
              //
              // 7B FF 0D direction FF FF FF FF BF
              // ======================================================

              void applyCustom(
                      String input,
                      int mode,
                      boolean forward
              ) {

                  String[] parts =
                          input.split(
                                  ","
                          );


                  ArrayList<Integer> colors =
                          new ArrayList<>();


                  for (
                          String part :
                          parts
                  ) {

                      try {

                          String hex =
                                  part
                                          .trim()
                                          .replace(
                                                  "#",
                                                  ""
                                          );


                          if (
                                  hex.length() == 6
                          ) {

                              colors.add(
                                      Integer.parseInt(
                                              hex,
                                              16
                                      )
                              );

                          }

                      } catch (
                              Exception ignored
                      ) {
                      }

                  }


                  if (
                          colors.size() < 1 ||
                          colors.size() > 16
                  ) {

                      Toast.makeText(
                              this,
                              "Masukkan 1-16 warna",
                              Toast.LENGTH_SHORT
                      ).show();


                      return;

                  }


                  int total =
                          colors.size();


                  // ==================================================
                  // COLOR LIST
                  // ==================================================

                  for (
                          int i = 0;
                          i < total;
                          i++
                  ) {

                      int color =
                              colors.get(i);


                      send(
                              packet(
                                      0x7B,
                                      i + 1,
                                      0x0E,
                                      0xFD,
                                      color >> 16 & 255,
                                      color >> 8 & 255,
                                      color & 255,
                                      total,
                                      0xBF
                              )
                      );

                  }


                  // ==================================================
                  // CUSTOM MODE
                  // ==================================================

                  send(
                          packet(
                                  0x7B,
                                  0xFF,
                                  0x13,
                                  mode,
                                  0xFF,
                                  0xFF,
                                  0xFF,
                                  0xFF,
                                  0xBF
                          )
                  );


                  // ==================================================
                  // DIRECTION
                  // ==================================================

                  send(
                          packet(
                                  0x7B,
                                  0xFF,
                                  0x0D,
                                  forward
                                          ? 0x00
                                          : 0x01,
                                  0xFF,
                                  0xFF,
                                  0xFF,
                                  0xFF,
                                  0xBF
                          )
                  );

              }


              // ======================================================
              // RAW HEX
              // ======================================================

              byte[] parseHex(
                      String input
              ) {

                  try {

                      String[] parts =
                              input
                                      .replace(
                                              ",",
                                              " "
                                      )
                                      .trim()
                                      .split(
                                              "\\s+"
                                      );


                      byte[] data =
                              new byte[
                                      parts.length
                              ];


                      for (
                              int i = 0;
                              i < parts.length;
                              i++
                      ) {

                          data[i] =
                                  (byte)
                                          Integer.parseInt(
                                                  parts[i],
                                                  16
                                          );

                      }


                      return data;


                  } catch (
                          Exception e
                  ) {

                      return null;

                  }

              }


              // ======================================================
              // GATT INSPECTOR
              // ======================================================

              void inspectGatt() {

                  if (
                          gatt == null
                  ) {

                      Toast.makeText(
                              this,
                              "Belum connected",
                              Toast.LENGTH_SHORT
                      ).show();


                      return;

                  }


                  StringBuilder result =
                          new StringBuilder();


                  for (
                          BluetoothGattService service :
                          gatt.getServices()
                  ) {

                      result.append(
                              "SERVICE "
                      );


                      result.append(
                              service.getUuid()
                      );


                      result.append(
                              "\n"
                      );


                      for (
                              BluetoothGattCharacteristic c :
                              service.getCharacteristics()
                      ) {

                          result.append(
                                  "  CHAR "
                          );


                          result.append(
                                  c.getUuid()
                          );


                          result.append(
                                  " props="
                          );


                          result.append(
                                  c.getProperties()
                          );


                          result.append(
                                  "\n"
                          );

                      }

                  }


                  new AlertDialog.Builder(
                          this
                  )
                  .setTitle(
                          "GATT Inspector"
                  )
                  .setMessage(
                          result.toString()
                  )
                  .setPositiveButton(
                          "OK",
                          null
                  )
                  .show();

              }


              // ======================================================
              // OTA INFO
              // ======================================================

              void showOTAInfo() {

                  boolean detected =
                          gatt != null &&
                          gatt.getService(
                                  OTA
                          ) != null;


                  String message;


                  if (
                          detected
                  ) {

                      message =
                              "OTA service 5833FF01 terdeteksi.\n\n" +
                              "Firmware image dan format flashing khusus " +
                              "LEDDMX-00 belum terbukti.\n\n" +
                              "Tidak ada firmware acak yang dikirim.";

                  } else {

                      message =
                              "OTA service 5833FF01 tidak terdeteksi.";

                  }


                  new AlertDialog.Builder(
                          this
                  )
                  .setTitle(
                          "OTA / Firmware"
                  )
                  .setMessage(
                          message
                  )
                  .setPositiveButton(
                          "OK",
                          null
                  )
                  .show();

              }


              // ======================================================
              // DESTROY
              // ======================================================

              @Override
              protected void onDestroy() {

                  super.onDestroy();


                  try {

                      if (
                              gatt != null
                      ) {

                          gatt.close();

                      }

                  } catch (
                          Exception ignored
                  ) {
                  }

              }

          }
