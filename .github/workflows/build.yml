              private void startScan() {
                  if (bluetoothAdapter == null) {
                      toast(
                              "Bluetooth adapter not available"
                      );

                      return;
                  }

                  if (
                          !bluetoothAdapter.isEnabled()
                  ) {
                      toast(
                              "Bluetooth is OFF"
                      );

                      return;
                  }

                  if (scanning) {
                      stopScan();

                      return;
                  }

                  if (
                          Build.VERSION.SDK_INT >= 31
                              &&
                          checkSelfPermission(
                                  Manifest.permission.BLUETOOTH_SCAN
                          )
                                  != PackageManager.PERMISSION_GRANTED
                  ) {
                      requestBluetoothPermissions();

                      return;
                  }

                  BluetoothLeScanner scanner =
                          bluetoothAdapter
                                  .getBluetoothLeScanner();

                  if (scanner == null) {
                      toast(
                              "BLE scanner unavailable"
                      );

                      return;
                  }

                  foundDevices.clear();

                  scanCallback =
                          new ScanCallback() {

                              @Override
                              public void onScanResult(
                                      int callbackType,
                                      ScanResult result
                              ) {
                                  BluetoothDevice device =
                                          result.getDevice();

                                  String name =
                                          safeName(
                                                  device
                                          );

                                  String upper =
                                          name.toUpperCase(
                                                  Locale.US
                                          );

                                  if (
                                          upper.contains(
                                                  "LEDDMX"
                                          )
                                              ||
                                          upper.contains(
                                                  "LED LAMP"
                                          )
                                  ) {
                                      if (
                                              !foundDevices
                                                      .contains(
                                                              device
                                                      )
                                      ) {
                                          foundDevices.add(
                                                  device
                                          );
                                      }

                                      runOnUiThread(
                                              MainActivity.this
                                                      ::showScanResults
                                      );
                                  }
                              }

                              @Override
                              public void onScanFailed(
                                      int errorCode
                              ) {
                                  runOnUiThread(
                                          () -> toast(
                                                  "BLE scan failed: "
                                                          + errorCode
                                          )
                                  );
                              }
                          };

                  try {
                      scanner.startScan(
                              scanCallback
                      );

                      scanning = true;

                      statusText.setText(
                              "● SCANNING..."
                      );

                      handler.postDelayed(
                              this::stopScan,
                              9000
                      );

                      showScanResults();

                  } catch (Exception e) {
                      toast(
                              "Unable to start scan"
                      );
                  }
              }

              private void showScanResults() {
                  page = "SCAN";

                  clearBody();

                  heading(
                          "BLE DEVICES"
                  );

                  if (
                          foundDevices.isEmpty()
                  ) {
                      body.addView(
                              text(
                                      "Searching for LEDDMX...",
                                      13
                              )
                      );

                      return;
                  }

                  for (
                          BluetoothDevice device :
                          foundDevices
                  ) {
                      Button b =
                              button(
                                      safeName(device)
                                              + "\n"
                                              + safeAddress(device)
                              );

                      b.setOnClickListener(
                              v -> connect(
                                      device
                              )
                      );

                      body.addView(b);
                  }
              }

              private void stopScan() {
                  if (!scanning) {
                      return;
                  }

                  try {
                      if (
                              bluetoothAdapter != null
                                      &&
                              bluetoothAdapter
                                      .getBluetoothLeScanner()
                                      != null
                                      &&
                              scanCallback != null
                      ) {
                          bluetoothAdapter
                                  .getBluetoothLeScanner()
                                  .stopScan(
                                          scanCallback
                                  );
                      }
                  } catch (Exception ignored) {
                  }

                  scanning = false;

                  if (statusText != null) {
                      statusText.setText(
                              "● SCAN COMPLETE"
                      );
                  }
              }

              private void connect(
                      BluetoothDevice device
              ) {
                  stopScan();

                  statusText.setText(
                          "● CONNECTING "
                                  + safeName(device)
                  );

                  try {
                      bluetoothGatt =
                              device.connectGatt(
                                      this,
                                      false,
                                      gattCallback
                              );
                  } catch (Exception e) {
                      statusText.setText(
                              "● CONNECTION ERROR"
                      );

                      toast(
                              "GATT connection failed"
                      );
                  }
              }

              private final BluetoothGattCallback
                      gattCallback =
                      new BluetoothGattCallback() {

                          @Override
                          public void onConnectionStateChange(
                                  BluetoothGatt gatt,
                                  int status,
                                  int newState
                          ) {
                              runOnUiThread(
                                      () -> {
                                          if (
                                                  newState
                                                          ==
                                                  BluetoothProfile
                                                          .STATE_CONNECTED
                                          ) {
                                              statusText.setText(
                                                      "● CONNECTED • DISCOVERING"
                                              );

                                              try {
                                                  gatt.requestMtu(
                                                          23
                                                  );
                                              } catch (
                                                      Exception ignored
                                              ) {
                                              }

                                              try {
                                                  gatt.discoverServices();
                                              } catch (
                                                      Exception e
                                              ) {
                                                  statusText.setText(
                                                          "● SERVICE DISCOVERY ERROR"
                                                  );
                                              }
                                          } else {
                                              writeCharacteristic =
                                                      null;

                                              statusText.setText(
                                                      "● DISCONNECTED"
                                              );
                                          }
                                      }
                              );
                          }

                          @Override
                          public void onServicesDiscovered(
                                  BluetoothGatt gatt,
                                  int status
                          ) {
                              writeCharacteristic =
                                      null;

                              for (
                                      BluetoothGattService service :
                                      gatt.getServices()
                              ) {
                                  for (
                                          BluetoothGattCharacteristic characteristic :
                                          service.getCharacteristics()
                                  ) {
                                      if (
                                              CHAR_FFE1.equals(
                                                      characteristic
                                                              .getUuid()
                                              )
                                      ) {
                                          writeCharacteristic =
                                                  characteristic;
                                      }
                                  }
                              }

                              if (
                                      writeCharacteristic
                                              != null
                              ) {
                                  statusText.setText(
                                          "● READY • FFE1 WRITE"
                                  );
                              } else {
                                  statusText.setText(
                                          "● CONNECTED • FFE1 NOT FOUND"
                                  );
                              }

                              log(
                                      "DEVICE GATT DISCOVERY: "
                                              + gatt
                                              .getServices()
                                              .size()
                                              + " SERVICES"
                              );
                          }

                          @Override
                          public void onCharacteristicWrite(
                                  BluetoothGatt gatt,
                                  BluetoothGattCharacteristic characteristic,
                                  int status
                          ) {
                              handler.postDelayed(
                                      MainActivity.this
                                              ::nextWrite,
                                      50
                              );
                          }

                          @Override
                          public void onCharacteristicChanged(
                                  BluetoothGatt gatt,
                                  BluetoothGattCharacteristic characteristic
                          ) {
                              log(
                                      "RX/NOTIFY DEVICE: "
                                              + hex(
                                              characteristic
                                                      .getValue()
                                      )
                              );
                          }

                          @Override
                          public void onCharacteristicRead(
                                  BluetoothGatt gatt,
                                  BluetoothGattCharacteristic characteristic,
                                  int status
                          ) {
                              log(
                                      "RX/READ DEVICE: "
                                              + hex(
                                              characteristic
                                                      .getValue()
                                      )
                              );
                          }
                      };

              private void send(byte[] data) {
                  if (
                          writeCharacteristic
                                  == null
                  ) {
                      toast(
                              "Connect to module first"
                      );

                      return;
                  }

                  writeQueue.add(data);

                  nextWrite();
              }

              private void nextWrite() {
                  if (
                          writeBusy
                                  ||
                          writeQueue.isEmpty()
                                  ||
                          writeCharacteristic
                                  == null
                  ) {
                      return;
                  }

                  writeBusy = true;

                  byte[] data =
                          writeQueue.poll();

                  log(
                          "TX DEVICE COMMAND: "
                                  + hex(data)
                  );

                  try {
                      writeCharacteristic.setWriteType(
                              BluetoothGattCharacteristic
                                      .WRITE_TYPE_DEFAULT
                      );

                      writeCharacteristic.setValue(
                              data
                      );

                      boolean accepted =
                              bluetoothGatt
                                      .writeCharacteristic(
                                              writeCharacteristic
                                      );

                      if (!accepted) {
                          writeBusy = false;

                          handler.postDelayed(
                                  this::nextWrite,
                                  80
                          );
                      }

                  } catch (Exception e) {
                      writeBusy = false;

                      handler.postDelayed(
                              this::nextWrite,
                              80
                      );
                  }
              }

              private void readGatt() {
                  if (
                          bluetoothGatt == null
                  ) {
                      toast(
                              "Module not connected"
                      );

                      return;
                  }

                  StringBuilder result =
                          new StringBuilder();

                  for (
                          BluetoothGattService service :
                          bluetoothGatt.getServices()
                  ) {
                      result.append(
                                      "DEVICE SERVICE: "
                                              + service
                                              .getUuid()
                              )
                              .append("\n");

                      for (
                              BluetoothGattCharacteristic characteristic :
                              service
                                      .getCharacteristics()
                      ) {
                          result.append(
                                          "  DEVICE CHARACTERISTIC: "
                                                  + characteristic
                                                  .getUuid()
                                  )
                                  .append(
                                          " PROPERTIES="
                                                  + characteristic
                                                  .getProperties()
                                  )
                                  .append("\n");
                      }
                  }

                  log(
                          result.toString()
                  );

                  showAnalyzer();
              }

