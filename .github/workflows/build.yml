                  void strip(
                      Canvas c,
                      float l,
                      float top,
                      float r,
                      float bot
                  ) {

                      for (
                          int i = 0;
                          i < 36;
                          i++
                      ) {

                          float x =
                              l +
                              (r - l)
                              *
                              i
                              /
                              35f;

                          float ph =
                              (
                                  System.currentTimeMillis()
                                  / 90f
                                  +
                                  i * 7
                              )
                              % 360;

                          p.setColor(
                              Color.HSVToColor(
                                  new float[] {
                                      ph,
                                      1,
                                      1
                                  }
                              )
                          );

                          c.drawRoundRect(
                              x - 4,
                              top + 8,
                              x + 4,
                              bot - 8,
                              5,
                              5,
                              p
                          );
                      }

                      postInvalidateDelayed(50);
                  }

                  void wheel(
                      Canvas c,
                      float cx,
                      float cy,
                      float rad
                  ) {

                      for (
                          int i = 0;
                          i < 120;
                          i++
                      ) {

                          float a = i * 3f;

                          float a2 =
                              (float)
                              Math.toRadians(a);

                          float a3 =
                              (float)
                              Math.toRadians(
                                  a + 3.2
                              );

                          p.setColor(
                              Color.HSVToColor(
                                  new float[] {
                                      a,
                                      1,
                                      1
                                  }
                              )
                          );

                          Path q =
                              new Path();

                          q.moveTo(
                              cx,
                              cy
                          );

                          q.lineTo(
                              cx +
                              (float)
                              Math.cos(a2)
                              *
                              rad,
                              cy +
                              (float)
                              Math.sin(a2)
                              *
                              rad
                          );

                          q.lineTo(
                              cx +
                              (float)
                              Math.cos(a3)
                              *
                              rad,
                              cy +
                              (float)
                              Math.sin(a3)
                              *
                              rad
                          );

                          q.close();

                          c.drawPath(
                              q,
                              p
                          );
                      }

                      p.setStyle(
                          Paint.Style.STROKE
                      );

                      p.setStrokeWidth(4);

                      p.setColor(
                          Color.WHITE
                      );

                      float a =
                          (float)
                          Math.toRadians(
                              hue
                          );

                      c.drawCircle(
                          cx +
                          (float)
                          Math.cos(a)
                          *
                          rad
                          *
                          .82f,
                          cy +
                          (float)
                          Math.sin(a)
                          *
                          rad
                          *
                          .82f,
                          9,
                          p
                      );

                      p.setStyle(
                          Paint.Style.FILL
                      );

                      p.setColor(
                          Color.BLACK
                      );

                      c.drawCircle(
                          cx,
                          cy,
                          48,
                          p
                      );

                      p.setColor(color);

                      c.drawCircle(
                          cx,
                          cy,
                          39,
                          p
                      );
                  }

