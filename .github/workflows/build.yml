name: LEDDMX Pro FINAL BUILD

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build LEDDMX Pro
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 7.6.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.6.1'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2"

      - name: Create project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf app
          rm -rf gradle
          rm -f build.gradle
          rm -f settings.gradle
          rm -f gradle.properties
          rm -f gradlew
          rm -f gradlew.bat

          mkdir -p app/src/main/java/com/leddmx/pro
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          rootProject.name = "LEDDMX-Pro"
          include ":app"
          EOF

          cat > build.gradle <<'EOF'
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }

              dependencies {
                  classpath "com.android.tools.build:gradle:7.4.2"
              }
          }

          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=false
          android.enableJetifier=false
          EOF

          cat > app/build.gradle <<'EOF'
          apply plugin: "com.android.application"

          android {
              compileSdkVersion 33

              defaultConfig {
                  applicationId "com.leddmx.pro"
                  minSdkVersion 21
                  targetSdkVersion 33
                  versionCode 1
                  versionName "1.0-FINAL"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">LEDDMX Pro</string>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.BLUETOOTH" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" />
              <uses-permission android:name="android.permission.BLUETOOTH_SCAN" />
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />

              <uses-feature
                  android:name="android.hardware.bluetooth_le"
                  android:required="false" />

              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:theme="@android:style/Theme.Material.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > app/src/main/java/com/leddmx/pro/MainActivity.java <<'JAVA'
          package com.leddmx.pro;

          import android.Manifest;
          import android.app.Activity;
          import android.bluetooth.BluetoothAdapter;
          import android.bluetooth.BluetoothDevice;
          import android.bluetooth.BluetoothGatt;
          import android.bluetooth.BluetoothGattCallback;
          import android.bluetooth.BluetoothGattCharacteristic;
          import android.bluetooth.BluetoothGattService;
          import android.bluetooth.BluetoothManager;
          import android.bluetooth.BluetoothProfile;
          import android.bluetooth.le.BluetoothLeScanner;
          import android.bluetooth.le.ScanCallback;
          import android.bluetooth.le.ScanResult;
          import android.content.ClipData;
          import android.content.ClipboardManager;
          import android.content.Context;
          import android.content.pm.PackageManager;
          import android.graphics.Canvas;
          import android.graphics.Color;
          import android.graphics.Paint;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.view.Gravity;
          import android.view.MotionEvent;
          import android.view.View;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.LinearLayout;
          import android.widget.PopupWindow;
          import android.widget.ScrollView;
          import android.widget.SeekBar;
          import android.widget.TextView;
          import android.widget.Toast;

          import java.text.SimpleDateFormat;
          import java.util.ArrayDeque;
          import java.util.ArrayList;
          import java.util.Date;
          import java.util.Locale;
          import java.util.UUID;

          public class MainActivity extends Activity {

              static final UUID FFE0 =
                      UUID.fromString("0000ffe0-0000-1000-8000-00805f9b34fb");

              static final UUID FFE1 =
                      UUID.fromString("0000ffe1-0000-1000-8000-00805f9b34fb");

              static final UUID OTA =
                      UUID.fromString("5833ff01-9b8b-5191-6142-22a4536ef123");

              final Handler handler =
                      new Handler(Looper.getMainLooper());

              BluetoothAdapter adapter;
              BluetoothGatt gatt;
              BluetoothGattCharacteristic tx;

              BluetoothLeScanner scanner;
              ScanCallback scanCallback;

              boolean scanning;
              boolean power = true;

              int r = 255;
              int g = 0;
              int b = 0;
              int brightness = 100;
              int speed = 50;
              int mode = 1;

              String page = "HOME";
              String output = "BOTH";

              LinearLayout root;
              LinearLayout body;
              TextView status;

              final ArrayList<BluetoothDevice> devices =
                      new ArrayList<>();

              final ArrayDeque<byte[]> queue =
                      new ArrayDeque<>();

              final ArrayList<String> terminal =
                      new ArrayList<>();

              boolean writing;

              android.content.SharedPreferences prefs;

              int dp(int v) {
                  return (int)(v *
                          getResources()
                                  .getDisplayMetrics()
                                  .density + .5f);
              }

              LinearLayout box() {
                  LinearLayout x =
                          new LinearLayout(this);

                  x.setOrientation(
                          LinearLayout.VERTICAL);

                  x.setPadding(
                          dp(10),
                          dp(6),
                          dp(10),
                          dp(6));

                  return x;
              }

              LinearLayout row() {
                  LinearLayout x = box();
                  x.setOrientation(
                          LinearLayout.HORIZONTAL);
                  return x;
              }

              TextView label(String s, int size) {
                  TextView t = new TextView(this);
                  t.setText(s);
                  t.setTextSize(size);
                  t.setTextColor(Color.WHITE);
                  t.setPadding(
                          dp(10),
                          dp(7),
                          dp(10),
                          dp(7));
                  return t;
              }

              Button btn(String s) {
                  Button b = new Button(this);
                  b.setText(s);
                  b.setTextColor(Color.WHITE);
                  return b;
              }

              @Override
              protected void onCreate(Bundle state) {
                  super.onCreate(state);

                  prefs =
                          getSharedPreferences(
                                  "LEDDMX",
                                  MODE_PRIVATE);

                  BluetoothManager bm =
                          (BluetoothManager)
                                  getSystemService(
                                          BLUETOOTH_SERVICE);

                  if (bm != null)
                      adapter = bm.getAdapter();

                  build();
                  permissions();
              }

              void build() {
                  root = box();
                  root.setBackgroundColor(
                          Color.rgb(9,12,16));

                  setContentView(root);

                  LinearLayout top = row();

                  Button menu = btn("☰");

                  top.addView(
                          menu,
                          new LinearLayout.LayoutParams(
                                  dp(58),
                                  dp(58)));

                  TextView title =
                          label(
                                  "LEDDMX PRO",
                                  21);

                  title.setGravity(
                          Gravity.CENTER_VERTICAL);

                  top.addView(
                          title,
                          new LinearLayout.LayoutParams(
                                  0,
                                  dp(58),
                                  1));

                  Button scan = btn("SCAN");

                  top.addView(
                          scan,
                          new LinearLayout.LayoutParams(
                                  dp(90),
                                  dp(58)));

                  root.addView(top);

                  status =
                          label(
                                  "● DISCONNECTED",
                                  13);

                  status.setTextColor(
                          Color.YELLOW);

                  root.addView(status);

                  ScrollView scroll =
                          new ScrollView(this);

                  body = box();

                  scroll.addView(body);

                  root.addView(
                          scroll,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  0,
                                  1));

                  menu.setOnClickListener(
                          v -> drawer());

                  scan.setOnClickListener(
                          v -> scan());

                  home();
              }

              void clear() {
                  body.removeAllViews();
              }

              void title(String s) {
                  TextView t =
                          label(s,22);

                  t.setTextColor(Color.CYAN);

                  body.addView(t);
              }

              void home() {
                  page = "HOME";
                  clear();

                  title("LEDDMX-00-b2cd");

                  body.addView(
                          label(
                                  "POWER • RGB • BRIGHTNESS • SPEED",
                                  12));

                  Button p =
                          btn(
                                  power
                                          ? "POWER ON"
                                          : "POWER OFF");

                  p.setOnClickListener(
                          v -> {
                              power = !power;
                              p.setText(
                                      power
                                              ? "POWER ON"
                                              : "POWER OFF");
                              send(
                                      powerPacket(
                                              power));
                          });

                  body.addView(p);

                  body.addView(
                          new ColorWheel(this),
                          new LinearLayout.LayoutParams(
                                  -1,
                                  dp(250)));

                  body.addView(
                          label(
                                  "RGB  "
                                          + r
                                          + " / "
                                          + g
                                          + " / "
                                          + b,
                                  14));

                  slider(
                          "BRIGHTNESS",
                          brightness,
                          value -> {
                              brightness = value;
                              send(
                                      brightnessPacket(
                                              value));
                          });

                  slider(
                          "SPEED",
                          speed,
                          value -> {
                              speed = value;
                              send(
                                      speedPacket(
                                              value));
                          });

                  LinearLayout outputs = row();

                  for (String o :
                          new String[]{
                                  "LEFT",
                                  "RIGHT",
                                  "BOTH"}) {

                      Button q = btn(o);

                      q.setOnClickListener(
                              v -> {
                                  output = o;
                                  toast(
                                          "PREVIEW: "
                                                  + o
                                                  + "\n"
                                                  + "HARDWARE ROUTING: NOT PROVEN");
                              });

                      outputs.addView(
                              q,
                              new LinearLayout.LayoutParams(
                                      0,
                                      dp(52),
                                      1));
                  }

                  body.addView(outputs);

                  Button effects =
                          btn("210 EFFECTS");

                  effects.setOnClickListener(
                          v -> effects());

                  body.addView(effects);

                  Button custom =
                          btn("CUSTOM STUDIO");

                  custom.setOnClickListener(
                          v -> custom());

                  body.addView(custom);
              }

              interface Action {
                  void go(int value);
              }

              void slider(
                      String name,
                      int value,
                      Action action) {

                  TextView t =
                          label(
                                  name
                                          + " : "
                                          + value,
                                  14);

                  body.addView(t);

                  SeekBar s =
                          new SeekBar(this);

                  s.setMax(100);
                  s.setProgress(value);

                  s.setOnSeekBarChangeListener(
                          new SeekBar.OnSeekBarChangeListener() {

                              public void onProgressChanged(
                                      SeekBar bar,
                                      int value,
                                      boolean user) {

                                  t.setText(
                                          name
                                                  + " : "
                                                  + value);

                                  if (user)
                                      action.go(value);
                              }

                              public void onStartTrackingTouch(
                                      SeekBar b) {}

                              public void onStopTrackingTouch(
                                      SeekBar b) {}
                          });

                  body.addView(s);
              }

              void effects() {
                  page = "EFFECTS";
                  clear();

                  title("210 BUILT-IN EFFECTS");

                  for (int i=1;i<=210;i++) {

                      final int m=i;

                      Button q =
                              btn(
                                      String.format(
                                              Locale.US,
                                              "%03d  %s",
                                              i,
                                              Patterns.NAME[i]));

                      q.setOnClickListener(
                              v -> {
                                  mode=m;
                                  send(
                                          modePacket(m));

                                  toast(
                                          "MODE "
                                                  + m
                                                  + "\n"
                                                  + Patterns.NAME[m]);
                              });

                      body.addView(
                              q,
                              new LinearLayout.LayoutParams(
                                      -1,
                                      dp(48)));
                  }
              }

              void custom() {
                  page = "CUSTOM";
                  clear();

                  title("CUSTOM STUDIO");

                  body.addView(
                          new Strip(this),
                          new LinearLayout.LayoutParams(
                                  -1,
                                  dp(125)));

                  body.addView(
                          label(
                                  "LIVE ANIMATION TEMPLATES",
                                  14));

                  LinearLayout t = row();

                  for (String n :
                          new String[]{
                                  "RAINBOW",
                                  "WAVE",
                                  "CHASE",
                                  "COMET",
                                  "SCANNER",
                                  "PULSE",
                                  "STRIPE",
                                  "FIRE"}) {

                      Button q=btn(n);

                      q.setOnClickListener(
                              v -> toast(
                                      "LIVE PREVIEW: "
                                              + n));

                      t.addView(
                              q,
                              new LinearLayout.LayoutParams(
                                      0,
                                      dp(50),
                                      1));
                  }

                  body.addView(t);

                  body.addView(
                          new ColorWheel(this),
                          new LinearLayout.LayoutParams(
                                  -1,
                                  dp(250)));

                  slider(
                          "BRIGHTNESS",
                          brightness,
                          v -> brightness=v);

                  slider(
                          "SPEED",
                          speed,
                          v -> speed=v);

                  LinearLayout dir=row();

                  Button f=btn("FORWARD");
                  Button rev=btn("REVERSE");

                  f.setOnClickListener(
                          v -> send(
                                  directionPacket(0)));

                  rev.setOnClickListener(
                          v -> send(
                                  directionPacket(1)));

                  dir.addView(
                          f,
                          new LinearLayout.LayoutParams(
                                  0,
                                  dp(52),
                                  1));

                  dir.addView(
                          rev,
                          new LinearLayout.LayoutParams(
                                  0,
                                  dp(52),
                                  1));

                  body.addView(dir);

                  body.addView(
                          label(
                                  "OUTPUT PREVIEW",
                                  14));

                  LinearLayout out=row();

                  for (String x :
                          new String[]{
                                  "WHOLE",
                                  "LEFT",
                                  "RIGHT",
                                  "BOTH"}) {

                      Button q=btn(x);

                      q.setOnClickListener(
                              v -> {
                                  output=x;
                                  toast(
                                          "Preview: "
                                                  + x
                                                  + "\n"
                                                  + "Hardware routing: NOT PROVEN");
                              });

                      out.addView(
                              q,
                              new LinearLayout.LayoutParams(
                                      0,
                                      dp(50),
                                      1));
                  }

                  body.addView(out);

                  Button apply =
                          btn(
                                  "APPLY CUSTOM COLOR");

                  apply.setOnClickListener(
                          v -> {

                              send(
                                      customColor(
                                              1,
                                              r,
                                              g,
                                              b,
                                              1));

                              send(
                                      customMode(0));

                              toast(
                                      "Custom pattern sent");
                          });

                  body.addView(apply);

                  body.addView(
                          label(
                                  "LOCAL SLOTS 171–210",
                                  15));

                  for (int i=171;i<=210;i++) {

                      final int slot=i;

                      Button q =
                              btn(
                                      "SAVE SLOT "
                                              + slot);

                      q.setOnClickListener(
                              v -> {

                                  prefs.edit()
                                          .putInt(
                                                  "slot_"
                                                          + slot,
                                                  mode)
                                          .apply();

                                  toast(
                                          "Saved slot "
                                                  + slot);
                              });

                      body.addView(q);
                  }
              }

              void analyzer() {
                  page="ANALYZER";
                  clear();

                  title(
                          "MODULE / MCU ANALYZER");

                  body.addView(
                          label(
                                  "DEVICE-SOURCE TERMINAL",
                                  14));

                  body.addView(
                          label(
                                  "Only data actually exposed by the connected module is shown.",
                                  12));

                  Button read=btn(
                          "READ GATT");

                  read.setOnClickListener(
                          v -> readGatt());

                  body.addView(read);

                  EditText raw =
                          new EditText(this);

                  raw.setHint(
                          "RAW HEX — explicit SEND only");

                  raw.setTextColor(Color.WHITE);

                  raw.setHintTextColor(
                          Color.GRAY);

                  body.addView(raw);

                  Button sendRaw =
                          btn(
                                  "SEND RAW HEX");

                  sendRaw.setOnClickListener(
                          v -> {

                              try {
                                  send(
                                          parseHex(
                                                  raw.getText()
                                                          .toString()));
                              } catch(Exception e) {
                                  toast(
                                          "INVALID HEX");
                              }
                          });

                  body.addView(sendRaw);

                  Button copy =
                          btn("COPY TERMINAL");

                  copy.setOnClickListener(
                          v -> {

                              ClipboardManager cm =
                                      (ClipboardManager)
                                              getSystemService(
                                                      CLIPBOARD_SERVICE);

                              if(cm!=null) {
                                  cm.setPrimaryClip(
                                          ClipData.newPlainText(
                                                  "LEDDMX",
                                                  terminalText()));
                              }

                              toast("COPIED");
                          });

                  body.addView(copy);

                  body.addView(
                          label(
                                  terminalText(),
                                  11));
              }

              void protocol() {
                  analyzer();

                  title("PROTOCOL LAB");

                  body.addView(
                          label(
                                  "Known baseline packets are editable through RAW HEX.",
                                  12));
              }

              void settings() {
                  page="SETTINGS";
                  clear();

                  title("SETTINGS");

                  body.addView(
                          label(
                                  "Language: Indonesian / English",
                                  14));

                  body.addView(
                          label(
                                  "Power baseline: 7B FF 04 01/00 FF FF FF FF BF",
                                  13));

                  body.addView(
                          label(
                                  "BLE service: FFE0",
                                  13));

                  body.addView(
                          label(
                                  "BLE write characteristic: FFE1",
                                  13));

                  body.addView(
                          label(
                                  "OTA service detection only.",
                                  13));

                  body.addView(
                          label(
                                  "Password packet: NOT VERIFIED.",
                                  13));

                  body.addView(
                          label(
                                  "LEFT/RIGHT hardware routing: NOT PROVEN.",
                                  13));
              }

              void drawer() {

                  final PopupWindow popup =
                          new PopupWindow(this);

                  LinearLayout menu=box();

                  menu.setBackgroundColor(
                          Color.rgb(20,24,30));

                  String[] items={
                          "HOME",
                          "210 EFFECTS",
                          "CUSTOM STUDIO",
                          "MODULE / MCU ANALYZER",
                          "PROTOCOL LAB",
                          "SETTINGS"
                  };

                  for(String item:items) {

                      Button q=btn(item);

                      q.setOnClickListener(
                              v -> {

                                  popup.dismiss();

                                  if(item.equals(
                                          "HOME"))
                                      home();

                                  else if(item.equals(
                                          "210 EFFECTS"))
                                      effects();

                                  else if(item.equals(
                                          "CUSTOM STUDIO"))
                                      custom();

                                  else if(item.equals(
                                          "MODULE / MCU ANALYZER"))
                                      analyzer();

                                  else if(item.equals(
                                          "PROTOCOL LAB"))
                                      protocol();

                                  else
                                      settings();
                              });

                      menu.addView(
                              q,
                              new LinearLayout.LayoutParams(
                                      dp(300),
                                      dp(58)));
                  }

                  popup.setContentView(menu);

                  popup.setWidth(dp(305));
                  popup.setHeight(-1);

                  popup.setBackgroundDrawable(
                          new android.graphics.drawable
                                  .ColorDrawable(
                                  Color.rgb(20,24,30)));

                  popup.setFocusable(true);
                  popup.setOutsideTouchable(true);

                  popup.showAtLocation(
                          root,
                          Gravity.LEFT | Gravity.TOP,
                          0,
                          0);
              }

              void permissions() {

                  if(Build.VERSION.SDK_INT>=31) {

                      requestPermissions(
                              new String[]{
                                      Manifest.permission.BLUETOOTH_SCAN,
                                      Manifest.permission.BLUETOOTH_CONNECT
                              },
                              10);

                  } else if(Build.VERSION.SDK_INT>=23) {

                      requestPermissions(
                              new String[]{
                                      Manifest.permission.ACCESS_FINE_LOCATION
                              },
                              11);
                  }
              }

              void scan() {

                  if(adapter==null) {
                      toast(
                              "BLUETOOTH UNAVAILABLE");
                      return;
                  }

                  if(!adapter.isEnabled()) {
                      toast(
                              "BLUETOOTH OFF");
                      return;
                  }

                  if(scanning) {
                      stopScan();
                      return;
                  }

                  if(Build.VERSION.SDK_INT>=31 &&
                          checkSelfPermission(
                                  Manifest.permission.BLUETOOTH_SCAN)
                                  !=
                                  PackageManager.PERMISSION_GRANTED) {

                      permissions();
                      return;
                  }

                  scanner =
                          adapter.getBluetoothLeScanner();

                  if(scanner==null) {
                      toast(
                              "BLE SCANNER UNAVAILABLE");
                      return;
                  }

                  devices.clear();

                  scanCallback =
                          new ScanCallback() {

                              @Override
                              public void onScanResult(
                                      int type,
                                      ScanResult result) {

                                  BluetoothDevice d=
                                          result.getDevice();

                                  String name=safeName(d);

                                  if(name.toUpperCase(
                                          Locale.US)
                                          .contains("LEDDMX")) {

                                      if(!devices.contains(d))
                                          devices.add(d);

                                      runOnUiThread(
                                              MainActivity.this
                                                      ::scanResults);
                                  }
                              }

                              @Override
                              public void onScanFailed(
                                      int code) {

                                  runOnUiThread(
                                          () -> toast(
                                                  "SCAN ERROR "
                                                          + code));
                              }
                          };

                  try {

                      scanner.startScan(
                              scanCallback);

                      scanning=true;

                      status.setText(
                              "● SCANNING");

                      scanResults();

                      handler.postDelayed(
                              this::stopScan,
                              9000);

                  } catch(Exception e) {

                      toast(
                              "SCAN START FAILED");
                  }
              }

              void scanResults() {

                  page="SCAN";
                  clear();

                  title(
                          "BLE DEVICES");

                  if(devices.isEmpty()) {

                      body.addView(
                              label(
                                      "Searching LEDDMX...",
                                      13));

                      return;
                  }

                  for(BluetoothDevice d:devices) {

                      Button q =
                              btn(
                                      safeName(d)
                                              + "\n"
                                              + safeAddress(d));

                      q.setOnClickListener(
                              v -> connect(d));

                      body.addView(q);
                  }
              }

              void stopScan() {

                  if(!scanning)
                      return;

                  try {

                      if(scanner!=null &&
                              scanCallback!=null)
                          scanner.stopScan(
                                  scanCallback);

                  } catch(Exception ignored) {}

                  scanning=false;

                  if(status!=null)
                      status.setText(
                              "● SCAN COMPLETE");
              }

              void connect(
                      BluetoothDevice d) {

                  stopScan();

                  status.setText(
                          "● CONNECTING "
                                  + safeName(d));

                  try {

                      gatt =
                              d.connectGatt(
                                      this,
                                      false,
                                      callback);

                  } catch(Exception e) {

                      status.setText(
                              "● CONNECTION ERROR");
                  }
              }

              final BluetoothGattCallback callback =
                      new BluetoothGattCallback() {

                          @Override
                          public void onConnectionStateChange(
                                  BluetoothGatt x,
                                  int st,
                                  int state) {

                              runOnUiThread(
                                      () -> {

                                          if(state ==
                                                  BluetoothProfile
                                                          .STATE_CONNECTED) {

                                              status.setText(
                                                      "● CONNECTED");

                                              try {
                                                  x.discoverServices();
                                              } catch(Exception ignored) {}

                                          } else {

                                              tx=null;

                                              status.setText(
                                                      "● DISCONNECTED");
                                          }
                                      });
                          }

                          @Override
                          public void onServicesDiscovered(
                                  BluetoothGatt x,
                                  int st) {

                              tx=null;

                              for(BluetoothGattService s:
                                      x.getServices()) {

                                  log(
                                          "DEVICE SERVICE: "
                                                  + s.getUuid());

                                  for(BluetoothGattCharacteristic c:
                                          s.getCharacteristics()) {

                                      log(
                                              "DEVICE CHARACTERISTIC: "
                                                      + c.getUuid()
                                                      + " PROP="
                                                      + c.getProperties());

                                      if(FFE1.equals(
                                              c.getUuid()))
                                          tx=c;
                                  }
                              }

                              runOnUiThread(
                                      () -> status.setText(
                                              tx!=null
                                                      ? "● READY • FFE1"
                                                      : "● FFE1 NOT FOUND"));
                          }

                          @Override
                          public void onCharacteristicWrite(
                                  BluetoothGatt x,
                                  BluetoothGattCharacteristic c,
                                  int st) {

                              handler.postDelayed(
                                      MainActivity.this
                                              ::nextWrite,
                                      60);
                          }

                          @Override
                          public void onCharacteristicChanged(
                                  BluetoothGatt x,
                                  BluetoothGattCharacteristic c) {

                              log(
                                      "RX/NOTIFY DEVICE: "
                                              + hex(
                                              c.getValue()));
                          }

                          @Override
                          public void onCharacteristicRead(
                                  BluetoothGatt x,
                                  BluetoothGattCharacteristic c,
                                  int st) {

                              log(
                                      "RX/READ DEVICE: "
                                              + hex(
