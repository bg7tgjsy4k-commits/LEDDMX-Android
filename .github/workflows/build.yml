              private void generateFromNaturalLanguage(
                      String text
              ) {

                  String q =
                          text.toLowerCase(
                                  Locale.US
                          );

                  timelineFrames.clear();

                  int c1 = Color.RED;
                  int c2 = Color.BLUE;

                  if (q.contains("hijau")
                          &&
                          q.contains("biru")) {

                      c1 = Color.GREEN;
                      c2 = Color.BLUE;

                  } else if (
                          q.contains("kuning")
                                  &&
                                  q.contains("biru")) {

                      c1 = Color.YELLOW;
                      c2 = Color.BLUE;

                  } else if (
                          q.contains("putih")
                                  &&
                                  q.contains("merah")) {

                      c1 = Color.WHITE;
                      c2 = Color.RED;

                  } else if (
                          q.contains("cyan")) {

                      c1 = Color.CYAN;
                      c2 = Color.BLUE;

                  } else if (
                          q.contains("ungu")
                                  ||
                                  q.contains("purple")) {

                      c1 = Color.MAGENTA;
                      c2 = Color.BLUE;
                  }

                  int duration = 150;

                  if (q.contains("cepat")
                          ||
                          q.contains("fast")) {

                      duration = 80;

                  } else if (
                          q.contains("lambat")
                                  ||
                                  q.contains("slow")) {

                      duration = 350;
                  }

                  timelineFrames.add(
                          new AnimFrame(
                                  c1,
                                  c2,
                                  duration
                          )
                  );

                  timelineFrames.add(
                          new AnimFrame(
                                  c2,
                                  c1,
                                  duration
                          )
                  );

                  if (q.contains("rainbow")
                          ||
                          q.contains("pelangi")) {

                      loadTemplate(
                              "Rainbow"
                      );
                  }

                  if (q.contains("police")
                          ||
                          q.contains("polisi")) {

                      loadTemplate(
                              "Police"
                      );
                  }

                  if (q.contains("api")
                          ||
                          q.contains("fire")) {

                      loadTemplate(
                              "Fire"
                      );
                  }

                  if (q.contains("air")
                          ||
                          q.contains("water")) {

                      loadTemplate(
                              "Water"
                      );
                  }

                  if (q.contains("belang")
                          ||
                          q.contains("stripe")
                          ||
                          q.contains("chase")) {

                      timelineFrames.clear();

                      timelineFrames.add(
                              new AnimFrame(
                                      c1,
                                      c2,
                                      duration
                              )
                      );

                      timelineFrames.add(
                              new AnimFrame(
                                      c2,
                                      c1,
                                      duration
                              )
                      );

                      timelineFrames.add(
                              new AnimFrame(
                                      c1,
                                      c2,
                                      duration
                              )
                      );
                  }
              }

