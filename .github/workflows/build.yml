    private void editFrame(int index) {

        if (index < 0 ||
                index >= frames.size()) {
            return;
        }

        Frame f =
                frames.get(index);

        buildBase(
                "EDIT FRAME " +
                        (index + 1),
                true
        );

        EditText r =
                field(String.valueOf(f.r));

        EditText g =
                field(String.valueOf(f.g));

        EditText b =
                field(String.valueOf(f.b));

        EditText duration =
                field(String.valueOf(f.duration));

        content.addView(
                label("RED 0–255")
        );

        content.addView(r);

        content.addView(
                label("GREEN 0–255")
        );

        content.addView(g);

        content.addView(
                label("BLUE 0–255")
        );

        content.addView(b);

        content.addView(
                label("DURATION ms")
        );

        content.addView(duration);

        Button apply =
                button("APPLY");

        apply.setOnClickListener(
                v -> {

                    f.r =
                            clamp(
                                    number(r, f.r),
                                    0,
                                    255
                            );

                    f.g =
                            clamp(
                                    number(g, f.g),
                                    0,
                                    255
                            );

                    f.b =
                            clamp(
                                    number(b, f.b),
                                    0,
                                    255
                            );

                    f.duration =
                            Math.max(
                                    30,
                                    number(
                                            duration,
                                            f.duration
                                    )
                            );

                    frameEditor();
                }
        );

        content.addView(apply);

        Button delete =
                button("DELETE FRAME");

        delete.setOnClickListener(
                v -> {

                    if (frames.size() > 1) {
                        frames.remove(index);
                    }

                    frameEditor();
                }
        );

        content.addView(delete);
    }

