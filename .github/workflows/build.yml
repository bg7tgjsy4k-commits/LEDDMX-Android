            );

            setOnTouchListener(
                    (v,e) -> {

                        if(
                                e.getAction()
                                        ==
                                MotionEvent.ACTION_DOWN

                                        ||

                                e.getAction()
                                        ==
                                MotionEvent.ACTION_MOVE
                        ) {

                            float x =
                                    e.getX()
                                            - cx;

                            float y =
                                    e.getY()
                                            - cy;

                            float rr =
                                    (float)
                                            Math.sqrt(
                                                    x*x
                                                            +
                                                    y*y
                                            );

                            if(rr <= rad) {

                                hsv[0] =
                                        (float)
                                                (
                                                        (
                                                                Math.toDegrees(
                                                                        Math.atan2(
                                                                                y,
                                                                                x
                                                                        )
                                                                )
                                                                +
                                                                360
                                                        )
                                                        %
                                                        360
                                                );

                                hsv[1] =
                                        Math.min(
                                                1,
                                                rr / rad
                                        );

                                listener.on(
                                        hsv
                                );

                                invalidate();

                                return true;
                            }
                        }

                        return true;
                    }
            );
        }

        protected void onDraw(
                Canvas c
        ) {

            cx =
                    getWidth()
                            / 2f;

            cy =
                    getHeight()
                            / 2f;

            rad =
                    Math.min(
                            getWidth(),
                            getHeight()
                    )
                    / 2f
                    - 25;

            for(int i = 0; i < 360; i++) {

                p.setColor(
                        Color.HSVToColor(
                                new float[]{
                                        i,
                                        1,
                                        1
                                }
                        )
                );

                c.drawArc(
                        cx-rad,
                        cy-rad,
                        cx+rad,
                        cy+rad,
                        i,
                        1,
                        true,
                        p
                );
            }

            p.setShader(
                    new RadialGradient(
                            cx,
                            cy,
                            rad,
                            Color.WHITE,
                            Color.TRANSPARENT,
                            Shader.TileMode.CLAMP
                    )
            );

            c.drawCircle(
                    cx,
                    cy,
                    rad,
                    p
            );

            p.setShader(null);

            float a =
                    (float)
                            Math.toRadians(
                                    hsv[0]
                            );

            float rr =
                    rad
                            * hsv[1];

            p.setStyle(
                    Paint.Style.STROKE
            );

            p.setStrokeWidth(5);

            p.setColor(
                    Color.WHITE
            );

            c.drawCircle(
                    cx
                            +
                    (float)
                            Math.cos(a)
                            * rr,

                    cy
                            +
                    (float)
                            Math.sin(a)
                            * rr,

                    9,
                    p
            );

            p.setStyle(
                    Paint.Style.FILL
            );
        }

        interface HsvListener {
            void on(float[] h);
        }
    }

    class StripPreview
            extends View {

        Paint p =
                new Paint(3);

        StripPreview(
                Context c
        ) {

            super(c);

            setMinimumHeight(
                    100
            );
        }

        protected void onDraw(
                Canvas c
        ) {

            int n =
                    48;

            float w =
                    getWidth()
                            / (float)n;

            long q =
                    System.currentTimeMillis();

            for(int i = 0; i < n; i++) {

                int cc =
                        Color.HSVToColor(
                                new float[]{
                                        (
                                                i
                                                        *
                                                360f
                                                        /
                                                n
                                                        +
                                                (
                                                        q / 12
                                                )
                                                        %
                                                360
                                        ),
                                        1,
                                        1
                                }
                        );

                p.setColor(cc);

                float x =
                        i*w + 2;

                c.drawRoundRect(
                        x,
                        25,
                        x+w-3,
                        75,
                        9,
                        9,
                        p
                );
            }

            postInvalidateDelayed(
                    35
            );
        }
    }

    class DrawerLayoutCompat
            extends FrameLayout {

        LinearLayout panel;

        DrawerLayoutCompat(
                Context c
        ) {

            super(c);
        }

        void addDrawer(
                LinearLayout d
        ) {

            panel = d;

            panel.setTranslationX(
                    -getResources()
                            .getDisplayMetrics()
                            .widthPixels
                            *
                            .86f
            );

            addView(
                    panel,
                    new FrameLayout.LayoutParams(
                            (int)
                                    (
                                            getResources()
                                                    .getDisplayMetrics()
                                                    .widthPixels
                                                    *
                                                    .86f
                                    ),
                            -1,
                            Gravity.LEFT
                    )
            );
        }

        void open() {

            panel.animate()
                    .translationX(0)
                    .setDuration(180)
                    .start();
        }

        void close() {

            panel.animate()
                    .translationX(
                            -getResources()
                                    .getDisplayMetrics()
                                    .widthPixels
                                    *
                                    .86f
                    )
                    .setDuration(180)
                    .start();
        }

        @Override
        protected void dispatchDraw(
                Canvas c
        ) {

            super.dispatchDraw(c);

            if(
                    panel.getTranslationX()
                            >
                    -getWidth()+5
            ) {

                Paint p =
                        new Paint();

                p.setColor(
                        0x99000000
                );

                c.drawRect(
                        panel.getWidth(),
                        0,
                        getWidth(),
                        getHeight(),
                        p
                );
            }
        }
    }
