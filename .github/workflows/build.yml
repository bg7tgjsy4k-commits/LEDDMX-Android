                new LinearLayout.LayoutParams(
                        0,
                        52,
                        1
                )
        );

        scan.addView(
                stop,
                new LinearLayout.LayoutParams(
                        0,
                        52,
                        1
                )
        );

        add(scan);

        add(
                txt(
                        "BLE scan is unfiltered. Every device actually seen by the phone is listed below.",
