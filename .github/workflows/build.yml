                        "MIC / EQ"
                )
        );


        Spinner mic =
                new Spinner(this);


        mic.setAdapter(
                new ArrayAdapter<String>(
                        this,
                        android.R.layout.simple_spinner_dropdown_item,
                        new String[] {
                                "MIC OFF",
                                "EQ 1",
                                "EQ 2",
                                "EQ 3",
                                "EQ 4",
                                "EQ 5",
                                "EQ 6",
                                "EQ 7"
                        }
                )
        );


        root.addView(
                mic
        );


        Button applyMic =
                makeButton(
                        "APPLY MIC / EQ"
                );


        root.addView(
                applyMic
