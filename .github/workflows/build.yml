name: LEDDMX-Pro-v40

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 33 packages
        shell: bash
        run: |
          set -e
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2"

      - name: Install Gradle 7.6.1
        shell: bash
        run: |
          set -e
          curl -fsSL -o "$RUNNER_TEMP/gradle.zip" \
            https://services.gradle.org/distributions/gradle-7.6.1-bin.zip
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-7.6.1/bin" >> "$GITHUB_PATH"

      - name: Create clean Android project
        shell: bash
        run: |
          set -e

          rm -rf app
          rm -f build.gradle
          rm -f settings.gradle
          rm -f settings.gradle.kts
          rm -f gradle.properties

          mkdir -p app/src/main/java/com/leddmx/pro
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "LEDDMX-Pro-v40"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '7.4.2' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=false
          android.nonTransitiveRClass=false
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.leddmx.pro'
              compileSdk 33

              defaultConfig {
                  applicationId 'com.leddmx.pro'
                  minSdk 21
                  targetSdk 33
                  versionCode 40
                  versionName '40.0'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }
          EOF

          cat > app/src/main/res/values/colors.xml <<'EOF'
          <resources>
              <color name="black">#000000</color>
              <color name="white">#FFFFFF</color>
          </resources>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowActionModeOverlay">true</item>
                  <item name="android:colorAccent">#00E5FF</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">#07090D</item>
                  <item name="android:navigationBarColor">#07090D</item>
                  <item name="android:windowBackground">#07090D</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission
                  android:name="android.permission.BLUETOOTH"
                  android:maxSdkVersion="30" />

              <uses-permission
                  android:name="android.permission.BLUETOOTH_ADMIN"
                  android:maxSdkVersion="30" />

              <uses-permission
                  android:name="android.permission.ACCESS_FINE_LOCATION"
                  android:maxSdkVersion="30" />

              <uses-permission
                  android:name="android.permission.BLUETOOTH_SCAN" />

              <uses-permission
                  android:name="android.permission.BLUETOOTH_CONNECT" />

              <application
                  android:theme="@style/AppTheme"
                  android:label="LEDDMX Pro"
                  android:allowBackup="false"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > app/src/main/java/com/leddmx/pro/Patterns.java <<'EOF'
          package com.leddmx.pro;

          public final class Patterns {

              public static final String[] NAMES = new String[] {
          EOF

          curl -fsSL \
            https://raw.githubusercontent.com/user154lt/LEDDMX-00/main/PatternList.kt \
            -o /tmp/PatternList.kt || true

          python3 - <<'PY2'
          import re

          path = "/tmp/PatternList.kt"
          values = []

          try:
              text = open(path, encoding="utf-8").read()
              values = re.findall(r'"((?:\\.|[^"\\])*)"', text)
          except Exception:
              values = []

          if len(values) < 211:
              values = [f"Mode {i:03d}" for i in range(211)]

          values = values[:211]

          with open(
              "app/src/main/java/com/leddmx/pro/Patterns.java",
              "a",
              encoding="utf-8"
          ) as f:

              for i, value in enumerate(values):
                  value = value.replace("\\", "\\\\")
                  value = value.replace('"', '\\"')

                  comma = "," if i < len(values) - 1 else ""

                  f.write(
                      '                  "' +
                      value +
                      '"' +
                      comma +
                      '\n'
                  )

              f.write("              };\n")
              f.write("          }\n")
          PY2

          cat > app/src/main/java/com/leddmx/pro/MainActivity.java <<'EOF'
          package com.leddmx.pro;

          import android.Manifest;
          import android.app.Activity;
          import android.bluetooth.BluetoothAdapter;
          import android.bluetooth.BluetoothDevice;
          import android.bluetooth.BluetoothGatt;
          import android.bluetooth.BluetoothGattCallback;
          import android.bluetooth.BluetoothGattCharacteristic;
          import android.bluetooth.BluetoothGattDescriptor;
          import android.bluetooth.BluetoothGattService;
          import android.bluetooth.BluetoothManager;
          import android.bluetooth.BluetoothProfile;
          import android.bluetooth.le.BluetoothLeScanner;
          import android.bluetooth.le.ScanCallback;
          import android.bluetooth.le.ScanResult;
          import android.bluetooth.le.ScanSettings;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.graphics.Canvas;
          import android.graphics.Color;
          import android.graphics.Paint;
          import android.graphics.RectF;
          import android.graphics.SweepGradient;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.provider.Settings;
          import android.view.Gravity;
          import android.view.MotionEvent;
          import android.view.View;
          import android.view.ViewGroup;
          import android.widget.ArrayAdapter;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.FrameLayout;
          import android.widget.GridLayout;
          import android.widget.LinearLayout;
          import android.widget.ListView;
          import android.widget.ScrollView;
          import android.widget.SeekBar;
          import android.widget.Spinner;
          import android.widget.TextView;
          import android.widget.Toast;

          import java.util.ArrayDeque;
          import java.util.ArrayList;
          import java.util.LinkedHashMap;
          import java.util.Locale;
          import java.util.UUID;
          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;

          public class MainActivity extends Activity {

              private static final UUID LED_SERVICE =
                  UUID.fromString("0000FFE0-0000-1000-8000-00805F9B34FB");

              private static final UUID LED_WRITE =
                  UUID.fromString("0000FFE1-0000-1000-8000-00805F9B34FB");

              private static final UUID OTA_SERVICE =
                  UUID.fromString("5833FF01-9B8B-5191-6142-22A4536EF123");

              private static final UUID OTA_WRITE =
                  UUID.fromString("5833FF02-9B8B-5191-6142-22A4536EF123");

              private static final UUID OTA_NOTIFY =
                  UUID.fromString("5833FF03-9B8B-5191-6142-22A4536EF123");

              private static final UUID CCCD =
                  UUID.fromString("00002902-0000-1000-8000-00805F9B34FB");

              private final Handler main =
                  new Handler(Looper.getMainLooper());

              private final ExecutorService tx =
                  Executors.newSingleThreadExecutor();

              private final ArrayDeque<byte[]> queue =
                  new ArrayDeque<>();

              private final LinkedHashMap<String, BluetoothDevice> deviceMap =
                  new LinkedHashMap<>();

              private final ArrayList<String> deviceLabels =
                  new ArrayList<>();

              private final ArrayList<String> modeNames =
                  new ArrayList<>();

              private BluetoothAdapter adapter;
              private BluetoothLeScanner scanner;
              private BluetoothGatt gatt;
              private BluetoothGattCharacteristic writeChar;

              private boolean scanning = false;
              private boolean writing = false;

              private TextView status;
              private TextView pageTitle;

              private FrameLayout pageHost;
              private FrameLayout drawer;

              private ListView deviceList;
              private ArrayAdapter<String> deviceAdapter;

              private StripView stripPreview;
              private ColorWheelView colorWheel;

              private EditText rawHex;
              private EditText hexColor;
              private EditText customColors;

              private Spinner customMode;
              private Spinner customDirection;

              private int currentMode = 1;
              private int brightnessValue = 100;
              private int speedValue = 128;
              private int selectedColor = Color.CYAN;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  getWindow().setStatusBarColor(
                      Color.rgb(7, 9, 13)
                  );

                  getWindow().setNavigationBarColor(
                      Color.rgb(7, 9, 13)
                  );

                  adapter =
                      ((BluetoothManager)
                          getSystemService(BLUETOOTH_SERVICE))
                          .getAdapter();

                  for (String n : Patterns.NAMES) {
                      modeNames.add(n);
                  }

                  buildShell();
                  requestBlePermissions();
              }

              private int dp(float value) {
                  return (int)(
                      value *
                      getResources()
                          .getDisplayMetrics()
                          .density +
                      0.5f
                  );
              }

              private TextView label(
                  String text,
                  float size
              ) {
                  TextView t = new TextView(this);

                  t.setText(text);
                  t.setTextColor(
                      Color.rgb(225, 230, 238)
                  );
                  t.setTextSize(size);

                  t.setPadding(
                      dp(12),
                      dp(7),
                      dp(12),
                      dp(7)
                  );

                  return t;
              }

              private TextView titleText(String text) {
                  TextView t = label(text, 24);

                  t.setTextColor(Color.WHITE);
                  t.setTypeface(
                      null,
                      android.graphics.Typeface.BOLD
                  );

                  t.setPadding(
                      dp(18),
                      dp(14),
                      dp(8),
                      dp(4)
                  );

                  return t;
              }

              private Button button(String text) {
                  Button b = new Button(this);

                  b.setText(text);
                  b.setAllCaps(false);
                  b.setTextColor(Color.WHITE);
                  b.setTextSize(13);

                  b.setMinHeight(dp(48));
                  b.setMinimumHeight(dp(48));

                  b.setClickable(true);
                  b.setFocusable(true);

                  b.setBackgroundColor(
                      Color.rgb(31, 38, 49)
                  );

                  return b;
              }

              private LinearLayout row() {
                  LinearLayout r =
                      new LinearLayout(this);

                  r.setOrientation(
                      LinearLayout.HORIZONTAL
                  );

                  r.setPadding(
                      dp(8),
                      dp(4),
                      dp(8),
                      dp(4)
                  );

                  return r;
              }

              private LinearLayout column() {
                  LinearLayout c =
                      new LinearLayout(this);

                  c.setOrientation(
                      LinearLayout.VERTICAL
                  );

                  return c;
              }

              private void addWeight(
                  LinearLayout parent,
                  View view
              ) {
                  parent.addView(
                      view,
                      new LinearLayout.LayoutParams(
                          0,
                          ViewGroup.LayoutParams.WRAP_CONTENT,
                          1f
                      )
                  );
              }

              private void addFull(
                  LinearLayout parent,
                  View view
              ) {
                  parent.addView(
                      view,
                      new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT
                      )
                  );
              }

              private ScrollView scroll(
                  View content
              ) {
                  ScrollView s =
                      new ScrollView(this);

                  s.setFillViewport(true);
                  s.setClipToPadding(false);

                  s.addView(
                      content,
                      new ScrollView.LayoutParams(
                          -1,
                          -2
                      )
                  );

                  return s;
              }

              private void buildShell() {

                  FrameLayout shell =
                      new FrameLayout(this);

                  shell.setBackgroundColor(
                      Color.rgb(7, 9, 13)
                  );

                  LinearLayout base =
                      column();

                  shell.addView(
                      base,
                      new FrameLayout.LayoutParams(
                          -1,
                          -1
                      )
                  );

                  LinearLayout top = row();

                  top.setGravity(
                      Gravity.CENTER_VERTICAL
                  );

                  Button menu = button("☰");
                  menu.setTextSize(24);

                  top.addView(
                      menu,
                      new LinearLayout.LayoutParams(
                          dp(58),
                          dp(58)
                      )
                  );

                  pageTitle =
                      label("LEDDMX PRO", 20);

                  pageTitle.setTypeface(
                      null,
                      android.graphics.Typeface.BOLD
                  );

                  top.addView(
                      pageTitle,
                      new LinearLayout.LayoutParams(
                          0,
                          dp(58),
                          1f
                      )
                  );

                  status =
                      label(
                          "BLE: belum terhubung",
                          12
                      );

                  status.setGravity(
                      Gravity.CENTER_VERTICAL
                  );

                  status.setTextColor(
                      Color.rgb(130, 220, 255)
                  );

                  top.addView(
                      status,
                      new LinearLayout.LayoutParams(
                          dp(150),
                          dp(58)
                      )
                  );

                  base.addView(top);

                  pageHost =
                      new FrameLayout(this);

                  pageHost.setBackgroundColor(
                      Color.rgb(7, 9, 13)
                  );

                  base.addView(
                      pageHost,
                      new LinearLayout.LayoutParams(
                          -1,
                          0,
                          1f
                      )
                  );

                  menu.setOnClickListener(
                      v -> toggleDrawer()
                  );

                  drawer =
                      new FrameLayout(this);

                  drawer.setBackgroundColor(
                      Color.rgb(14, 18, 25)
                  );

                  drawer.setVisibility(
                      View.GONE
                  );

                  FrameLayout.LayoutParams dl =
                      new FrameLayout.LayoutParams(
                          dp(300),
                          -1
                      );

                  dl.gravity = Gravity.LEFT;

                  shell.addView(
                      drawer,
                      dl
                  );

                  buildDrawer();

                  setContentView(shell);

                  showPage(
                      "HOME",
                      this::buildHome
                  );
              }

              private void buildDrawer() {

                  LinearLayout d = column();

                  d.setPadding(
                      dp(10),
                      dp(16),
                      dp(10),
                      dp(16)
                  );

                  drawer.addView(
                      d,
                      new FrameLayout.LayoutParams(
                          -1,
                          -1
                      )
                  );

                  addFull(
                      d,
                      titleText("LEDDMX PRO")
                  );

                  addFull(
                      d,
                      label(
                          "Controller • Studio • Analyzer",
                          12
                      )
                  );

                  String[][] items = {
                      {"⌂  Home", "HOME"},
                      {"✦  210 Effects", "EFFECTS"},
                      {"▣  Custom Studio", "CUSTOM"},
                      {"★  My Modes 171–210", "SLOTS"},
                      {"◉  Color", "COLOR"},
                      {"✧  AI Scene Composer", "AI"},
                      {"⌁  Module / MCU Analyzer", "ANALYZER"},
                      {"⌘  Protocol Lab", "PROTOCOL"},
                      {"▤  GATT / BLE Inspector", "GATT"},
                      {"⇧  OTA / Firmware", "OTA"},
                      {"⚙  Settings", "SETTINGS"}
                  };

                  for (String[] item : items) {

                      Button b =
                          button(item[0]);

                      b.setGravity(
                          Gravity.LEFT |
                          Gravity.CENTER_VERTICAL
                      );

                      addFull(d, b);

                      b.setOnClickListener(
                          v -> {
                              drawer.setVisibility(
                                  View.GONE
                              );
                              navigate(item[1]);
                          }
                      );
                  }
              }

              private void toggleDrawer() {
                  if (drawer.getVisibility()
                      == View.VISIBLE) {

                      drawer.setVisibility(
                          View.GONE
                      );

                  } else {

                      drawer.setVisibility(
                          View.VISIBLE
                      );
                  }
              }

              private interface PageBuilder {
                  View build();
              }

              private void navigate(
                  String page
              ) {

                  if ("HOME".equals(page)) {
                      showPage(
                          "HOME",
                          this::buildHome
                      );

                  } else if ("EFFECTS".equals(page)) {
                      showPage(
                          "210 EFFECTS",
                          this::buildEffects
                      );

                  } else if ("CUSTOM".equals(page)) {
                      showPage(
                          "CUSTOM STUDIO",
                          this::buildCustom
                      );

                  } else if ("SLOTS".equals(page)) {
                      showPage(
                          "MY MODES 171–210",
                          this::buildSlots
                      );

                  } else if ("COLOR".equals(page)) {
                      showPage(
                          "COLOR",
                          this::buildColor
                      );

                  } else if ("AI".equals(page)) {
                      showPage(
                          "AI SCENE COMPOSER",
                          this::buildAI
                      );

                  } else if ("ANALYZER".equals(page)) {
                      showPage(
                          "MODULE / MCU ANALYZER",
                          this::buildAnalyzer
                      );

                  } else if ("PROTOCOL".equals(page)) {
                      showPage(
                          "PROTOCOL LAB",
                          this::buildProtocol
                      );

                  } else if ("GATT".equals(page)) {
                      showPage(
                          "GATT / BLE INSPECTOR",
                          this::buildGatt
                      );

                  } else if ("OTA".equals(page)) {
                      showPage(
                          "OTA / FIRMWARE",
                          this::buildOta
                      );

                  } else {
                      showPage(
                          "SETTINGS",
                          this::buildSettings
                      );
                  }
              }

              private void showPage(
                  String title,
                  PageBuilder builder
              ) {

                  pageTitle.setText(title);

                  pageHost.removeAllViews();

                  View page = builder.build();

                  page.setClickable(false);

                  pageHost.addView(
                      page,
                      new FrameLayout.LayoutParams(
                          -1,
                          -1
                      )
                  );
              }

              private View buildHome() {

                  LinearLayout c = column();

                  c.setPadding(
                      dp(10),
                      dp(4),
                      dp(10),
                      dp(24)
                  );

                  addFull(
                      c,
                      titleText(
                          "Control your LEDDMX"
                      )
                  );

                  LinearLayout hero = row();

                  hero.setPadding(
                      dp(12),
                      dp(8),
                      dp(12),
                      dp(12)
                  );

                  LinearLayout heroText =
                      column();

                  addWeight(
                      hero,
                      heroText
                  );

                  addFull(
                      heroText,
                      label(
                          "LIVE CONTROLLER",
                          11
                      )
                  );

                  addFull(
                      heroText,
                      label(
                          "Scan perangkat BLE di sekitar, pilih modul, lalu connect.",
                          14
                      )
                  );

                  Button scan =
                      button("SCAN BLE");

                  hero.addView(
                      scan,
                      new LinearLayout.LayoutParams(
                          dp(120),
                          dp(52)
                      )
                  );

                  addFull(c, hero);

                  scan.setOnClickListener(
                      v -> scanBle()
                  );

                  addFull(
                      c,
                      label(
                          "DEVICES FOUND",
                          12
                      )
                  );

                  deviceList =
                      new ListView(this);

                  deviceAdapter =
                      new ArrayAdapter<String>(
                          this,
                          android.R.layout.simple_list_item_1,
                          deviceLabels
                      );

                  deviceList.setAdapter(
                      deviceAdapter
                  );

                  deviceList.setClickable(true);

                  deviceList.setOnItemClickListener(
                      (parent, view, position, id) -> {

                          String line =
                              deviceLabels.get(
                                  position
                              );

                          String[] parts =
                              line.split(
                                  "\\|\\s*"
                              );

                          String address =
                              parts.length > 1
                                  ? parts[1].trim()
                                  : line.trim();

                          BluetoothDevice d =
                              deviceMap.get(address);

                          if (d != null) {
                              connect(d);
                          }
                      }
                  );

                  c.addView(
                      deviceList,
                      new LinearLayout.LayoutParams(
                          -1,
                          dp(170)
                      )
                  );

                  LinearLayout power =
                      row();

                  Button on =
                      button("POWER ON");

                  Button off =
                      button("POWER OFF");

                  addWeight(power, on);
                  addWeight(power, off);

                  addFull(c, power);

                  on.setOnClickListener(
                      v -> send(
                          powerPacket(true)
                      )
                  );

                  off.setOnClickListener(
                      v -> send(
                          powerPacket(false)
                      )
                  );

                  addFull(
                      c,
                      label(
                          "Brightness  •  " +
                          brightnessValue +
                          "%",
                          12
                      )
                  );

                  SeekBar br =
                      new SeekBar(this);

                  br.setMax(100);
                  br.setProgress(
                      brightnessValue
                  );

                  addFull(c, br);

                  br.setOnSeekBarChangeListener(
                      new SeekBar.OnSeekBarChangeListener() {

                          public void onProgressChanged(
                              SeekBar s,
                              int p,
                              boolean fromUser
                          ) {
                              brightnessValue = p;
                          }

                          public void onStartTrackingTouch(
                              SeekBar s
                          ) {
                          }

                          public void onStopTrackingTouch(
                              SeekBar s
                          ) {
                              send(
                                  brightnessPacket(
                                      s.getProgress()
                                  )
                              );
                          }
                      }
                  );

                  addFull(
                      c,
                      label(
                          "Speed  •  " +
                          speedValue,
                          12
                      )
                  );

                  SeekBar sp =
                      new SeekBar(this);

                  sp.setMax(255);
                  sp.setProgress(
                      speedValue
                  );

                  addFull(c, sp);

                  sp.setOnSeekBarChangeListener(
                      new SeekBar.OnSeekBarChangeListener() {

                          public void onProgressChanged(
                              SeekBar s,
                              int p,
                              boolean fromUser
                          ) {
                              speedValue = p;
                          }

                          public void onStartTrackingTouch(
                              SeekBar s
                          ) {
                          }

                          public void onStopTrackingTouch(
                              SeekBar s
                          ) {
                              send(
                                  speedPacket(
                                      s.getProgress()
                                  )
                              );
                          }
                      }
                  );

                  LinearLayout quick =
                      row();

                  Button fx =
                      button("210 EFFECTS");

                  Button cs =
                      button("CUSTOM STUDIO");

                  Button an =
                      button("ANALYZER");

                  addWeight(quick, fx);
                  addWeight(quick, cs);
                  addWeight(quick, an);

                  addFull(c, quick);

                  fx.setOnClickListener(
                      v -> navigate("EFFECTS")
                  );

                  cs.setOnClickListener(
                      v -> navigate("CUSTOM")
                  );

                  an.setOnClickListener(
                      v -> navigate("ANALYZER")
                  );

                  return scroll(c);
              }

              private View buildEffects() {

                  LinearLayout c =
                      column();

                  c.setPadding(
                      dp(8),
                      dp(8),
                      dp(8),
                      dp(30)
                  );

                  addFull(
                      c,
                      label(
                          "Tap a mode to send it immediately. Preview is an app-side visual approximation; packet is sent to the module.",
                          12
                      )
                  );

                  stripPreview =
                      new StripView(this);

                  stripPreview.setMode(
                      currentMode
                  );

                  c.addView(
                      stripPreview,
                      new LinearLayout.LayoutParams(
                          -1,
                          dp(105)
                      )
                  );

                  GridLayout grid =
                      new GridLayout(this);

                  grid.setColumnCount(2);
                  grid.setUseDefaultMargins(false);

                  addFull(c, grid);

                  for (int i = 0; i <= 210; i++) {

                      final int mode = i;

                      String name =
                          mode < modeNames.size()
                              ? modeNames.get(mode)
                              : "Mode " +
                                String.format(
                                    Locale.US,
                                    "%03d",
                                    mode
                                );

                      Button b =
