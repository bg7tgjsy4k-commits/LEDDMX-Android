              // ======================================================
              // CHASE
              // ======================================================

              private void generateChase() {

                  frames.clear();


                  int[][] colors = {

                          {255, 0, 0},

                          {255, 100, 0},

                          {255, 255, 0},

                          {0, 255, 0},

                          {0, 255, 255},

                          {0, 0, 255},

                          {180, 0, 255},

                          {255, 0, 180}

                  };


                  for (
                          int[] c :
                          colors
                  ) {

                      frames.add(
                              new Frame(
                                      c[0],
                                      c[1],
                                      c[2],
                                      c[0],
                                      c[1],
                                      c[2],
                                      140
                              )
                      );
                  }


                  buildEditor();
              }


              // ======================================================
              // RAINBOW
              // ======================================================

              private void generateRainbow() {

                  frames.clear();


                  for (
                          int i = 0;
                          i < 24;
                          i++
                  ) {

                      float hue =
                              i * 15f;


                      int c =
                              Color.HSVToColor(
                                      new float[]{
                                              hue,
                                              1f,
                                              1f
                                      }
                              );


                      frames.add(
                              new Frame(
                                      Color.red(c),
                                      Color.green(c),
                                      Color.blue(c),
                                      Color.red(c),
                                      Color.green(c),
                                      Color.blue(c),
                                      120
                              )
                      );
                  }


                  buildEditor();
              }


              // ======================================================
              // SAVE
              // ======================================================

              private void saveSlot() {

                  SharedPreferences prefs =
                          getSharedPreferences(
                                  "leddmx_slots",
                                  MODE_PRIVATE
                          );


                  SharedPreferences.Editor e =
                          prefs.edit();


                  e.putInt(
                          "slot_" +
                                  selectedMode +
                                  "_count",
                          frames.size()
                  );


                  for (
                          int i = 0;
                          i < frames.size();
                          i++
                  ) {

                      Frame f =
                              frames.get(i);


                      String data =
                              f.lr + "," +
                              f.lg + "," +
                              f.lb + "," +
                              f.rr + "," +
                              f.rg + "," +
                              f.rb + "," +
                              f.duration;


                      e.putString(
                              "slot_" +
                                      selectedMode +
                                      "_" +
                                      i,
                              data
                      );
                  }


                  e.apply();


                  toast(
                          "SLOT " +
                                  selectedMode +
                                  " SAVED"
                  );
              }


              // ======================================================
              // LOAD
              // ======================================================

              private void loadSlot() {

                  SharedPreferences prefs =
                          getSharedPreferences(
                                  "leddmx_slots",
                                  MODE_PRIVATE
                          );


                  int count =
                          prefs.getInt(
                                  "slot_" +
                                          selectedMode +
                                          "_count",
                                  0
                          );


                  if (count <= 0) {
                      return;
                  }


                  ArrayList<Frame> loaded =
                          new ArrayList<>();


                  for (
                          int i = 0;
                          i < count;
                          i++
                  ) {

                      String data =
                              prefs.getString(
                                      "slot_" +
                                              selectedMode +
                                              "_" +
                                              i,
                                      null
                              );


                      if (data == null) {
                          continue;
                      }


                      try {

                          String[] p =
                                  data.split(",");


                          if (p.length >= 7) {

                              loaded.add(
                                      new Frame(
                                              Integer.parseInt(p[0]),
                                              Integer.parseInt(p[1]),
                                              Integer.parseInt(p[2]),
                                              Integer.parseInt(p[3]),
                                              Integer.parseInt(p[4]),
                                              Integer.parseInt(p[5]),
                                              Integer.parseInt(p[6])
                                      )
                              );
                          }

                      } catch (Exception ignored) {
                      }
                  }


                  if (!loaded.isEmpty()) {

                      frames.clear();

                      frames.addAll(
                              loaded
                      );
                  }
              }


