name: LEDDMX AI PRO FINAL

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build LEDDMX AI PRO
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. JAVA 17
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # ============================================================
      # 3. INSTALL GRADLE
      # ============================================================

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'


      # ============================================================
      # 4. CREATE PROJECT
      # ============================================================

      - name: Create Android project
        shell: bash
        run: |

          set -e

          rm -rf app
          rm -f build.gradle
          rm -f settings.gradle
          rm -f gradle.properties

          mkdir -p app/src/main/java/com/leddmx/pro
          mkdir -p app/src/main/res/values


      # ============================================================
      # 5. SETTINGS.GRADLE
      # ============================================================

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "LEDDMX-AI-PRO"

          include(":app")
          EOF


      # ============================================================
      # 6. ROOT BUILD.GRADLE
      # ============================================================

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF


      # ============================================================
      # 7. GRADLE PROPERTIES
      # ============================================================

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF


      # ============================================================
      # 8. APP BUILD.GRADLE
      # ============================================================

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {

              namespace 'com.leddmx.pro'

              compileSdk 35

              defaultConfig {

                  applicationId 'com.leddmx.pro'

                  minSdk 23

                  targetSdk 35

                  versionCode 1

                  versionName '1.0'
              }

              compileOptions {

                  sourceCompatibility JavaVersion.VERSION_17

                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF


      # ============================================================
      # 9. COLORS
      # ============================================================

          cat > app/src/main/res/values/colors.xml <<'EOF'
          <resources>

              <color name="black">#000000</color>

              <color name="white">#FFFFFF</color>

          </resources>
          EOF


      # ============================================================
      # 10. THEME
      # ============================================================

          cat > app/src/main/res/values/themes.xml <<'EOF'
          <resources>

              <style
                  name="AppTheme"
                  parent="android:style/Theme.Material.NoActionBar">

                  <item name="android:fontFamily">sans</item>

                  <item name="android:windowActionModeOverlay">true</item>

                  <item name="android:colorAccent">#FFFFFF</item>

                  <item name="android:navigationBarColor">#000000</item>

                  <item name="android:statusBarColor">#000000</item>

                  <item name="android:windowLightStatusBar">false</item>

              </style>

          </resources>
          EOF


      # ============================================================
      # 11. MANIFEST
      # ============================================================

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission
                  android:name="android.permission.BLUETOOTH" />

              <uses-permission
                  android:name="android.permission.BLUETOOTH_ADMIN" />

              <uses-permission
                  android:name="android.permission.BLUETOOTH_SCAN"
                  android:usesPermissionFlags="neverForLocation" />

              <uses-permission
                  android:name="android.permission.BLUETOOTH_CONNECT" />

              <uses-feature
                  android:name="android.hardware.bluetooth_le"
                  android:required="false" />

              <application
                  android:allowBackup="false"
                  android:label="LEDDMX AI PRO"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">

                      <intent-filter>

                          <action
                              android:name="android.intent.action.MAIN" />

                          <category
                              android:name="android.intent.category.LAUNCHER" />

                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF


      # ============================================================
      # 12. BLUETOOTH SERVICE
      # ============================================================

          cat > app/src/main/java/com/leddmx/pro/BluetoothService.java <<'EOF'
          package com.leddmx.pro;

          import android.bluetooth.BluetoothGatt;
          import android.bluetooth.BluetoothGattCharacteristic;

          import java.util.UUID;

          public class BluetoothService {

              public static final UUID SERVICE_FFE0 =
                      UUID.fromString(
                              "0000FFE0-0000-1000-8000-00805F9B34FB"
                      );

              public static final UUID CHAR_FFE1 =
                      UUID.fromString(
                              "0000FFE1-0000-1000-8000-00805F9B34FB"
                      );

              private static BluetoothService instance;

              public BluetoothGatt gatt;

              public BluetoothGattCharacteristic writeChar;

              public boolean connected = false;

              private BluetoothService() {
              }

              public static synchronized BluetoothService getInstance() {

                  if (instance == null) {
                      instance = new BluetoothService();
                  }

                  return instance;
              }

              public synchronized void send(byte[] packet) {

                  if (
                          gatt == null ||
                          writeChar == null ||
                          !connected
                  ) {
                      return;
                  }

                  try {

                      writeChar.setValue(packet);

                      writeChar.setWriteType(
                              BluetoothGattCharacteristic
                                      .WRITE_TYPE_NO_RESPONSE
                      );

                      gatt.writeCharacteristic(
                              writeChar
                      );

                  } catch (Exception ignored) {
                  }
              }

              public void disconnect() {

                  try {

                      if (gatt != null) {

                          gatt.disconnect();

                          gatt.close();
                      }

                  } catch (Exception ignored) {
                  }

                  gatt = null;

                  writeChar = null;

                  connected = false;
              }
          }
          EOF


      # ============================================================
      # 13. MAIN ACTIVITY
      # ============================================================

          cat > app/src/main/java/com/leddmx/pro/MainActivity.java <<'EOF'
          package com.leddmx.pro;

          import android.Manifest;
          import android.app.Activity;
          import android.bluetooth.BluetoothAdapter;
          import android.bluetooth.BluetoothDevice;
          import android.bluetooth.BluetoothGatt;
          import android.bluetooth.BluetoothGattCallback;
          import android.bluetooth.BluetoothGattCharacteristic;
          import android.bluetooth.BluetoothGattService;
          import android.bluetooth.BluetoothManager;
          import android.bluetooth.le.BluetoothLeScanner;
          import android.bluetooth.le.ScanCallback;
          import android.bluetooth.le.ScanResult;
          import android.content.Context;
          import android.content.SharedPreferences;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.GridLayout;
          import android.widget.LinearLayout;
          import android.widget.SeekBar;
          import android.widget.TextView;
          import android.widget.Toast;

          import java.util.ArrayList;
          import java.util.Locale;

          public class MainActivity extends Activity {

              private final BluetoothService ble =
                      BluetoothService.getInstance();

              private BluetoothAdapter adapter;

              private BluetoothLeScanner scanner;

              private final Handler handler =
                      new Handler(Looper.getMainLooper());

              private LinearLayout content;

              private TextView connectionStatus;

              private TextView modeStatus;

              private int selectedMode = 171;

              private int brightness = 255;

              private final ArrayList<Frame> frames =
                      new ArrayList<>();

              private int previewIndex = 0;

              private boolean previewPlaying = false;

              private final Runnable previewRunnable =
                      new Runnable() {

                          @Override
                          public void run() {

                              if (
                                      !previewPlaying ||
                                      frames.isEmpty()
                              ) {
                                  return;
                              }

                              showPreviewFrame(
                                      frames.get(previewIndex)
                              );

                              int delay =
                                      Math.max(
                                              30,
                                              frames
                                                      .get(previewIndex)
                                                      .duration
                                      );

                              previewIndex++;

                              if (
                                      previewIndex >=
                                      frames.size()
                              ) {
                                  previewIndex = 0;
                              }

                              handler.postDelayed(
                                      this,
                                      delay
                              );
                          }
                      };


              // ======================================================
              // ACTIVITY
              // ======================================================

              @Override
              protected void onCreate(
                      Bundle savedInstanceState
              ) {

                  super.onCreate(
                          savedInstanceState
                  );

                  BluetoothManager manager =
                          (BluetoothManager)
                                  getSystemService(
                                          Context.BLUETOOTH_SERVICE
                                  );

                  if (manager != null) {
                      adapter =
                              manager.getAdapter();
                  }

                  createDefaultAnimation();

                  buildHome();

                  requestBluetoothPermission();
              }


              // ======================================================
              // PERMISSION
              // ======================================================

              private void requestBluetoothPermission() {

                  if (Build.VERSION.SDK_INT >= 31) {

                      boolean scan =
                              checkSelfPermission(
                                      Manifest.permission
                                              .BLUETOOTH_SCAN
                              ) ==
                                      PackageManager
                                              .PERMISSION_GRANTED;

                      boolean connect =
                              checkSelfPermission(
                                      Manifest.permission
                                              .BLUETOOTH_CONNECT
                              ) ==
                                      PackageManager
                                              .PERMISSION_GRANTED;

                      if (!scan || !connect) {

                          requestPermissions(
                                  new String[]{
                                          Manifest.permission
                                                  .BLUETOOTH_SCAN,
                                          Manifest.permission
                                                  .BLUETOOTH_CONNECT
                                  },
                                  100
                          );
                      }
                  }
              }


              // ======================================================
              // BASE UI
              // ======================================================

              private void createBase() {

                  LinearLayout root =
                          new LinearLayout(this);

                  root.setOrientation(
                          LinearLayout.VERTICAL
                  );

                  root.setPadding(
                          14,
                          14,
                          14,
                          8
                  );

                  root.setBackgroundColor(
                          Color.BLACK
                  );


                  LinearLayout header =
                          new LinearLayout(this);

                  header.setGravity(
                          Gravity.CENTER_VERTICAL
                  );


                  TextView title =
                          text(
                                  "LEDDMX AI PRO",
                                  22,
                                  Color.WHITE
                          );


                  header.addView(
                          title,
                          new LinearLayout.LayoutParams(
                                  0,
                                  -2,
                                  1
                          )
                  );


                  connectionStatus =
                          text(
                                  ble.connected
                                          ? "CONNECTED"
                                          : "OFFLINE",
                                  12,
                                  ble.connected
                                          ? Color.GREEN
                                          : Color.GRAY
                          );


                  header.addView(
                          connectionStatus
                  );


                  root.addView(
                          header
                  );


                  content =
                          new LinearLayout(this);

                  content.setOrientation(
                          LinearLayout.VERTICAL
                  );


                  root.addView(
                          content,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  0,
                                  1
                          )
                  );


                  LinearLayout navigation =
                          new LinearLayout(this);

                  navigation.setGravity(
                          Gravity.CENTER
                  );


                  addNavigationButton(
                          navigation,
                          "HOME",
                          v -> buildHome()
                  );


                  addNavigationButton(
                          navigation,
                          "MODES",
                          v -> buildModes()
                  );


                  addNavigationButton(
                          navigation,
                          "CUSTOM",
                          v -> buildCustom()
                  );


                  addNavigationButton(
                          navigation,
                          "AI",
                          v -> buildAI()
                  );


                  addNavigationButton(
                          navigation,
                          "SET",
                          v -> buildSettings()
                  );


                  root.addView(
                          navigation
                  );


                  setContentView(
                          root
                  );
              }


              // ======================================================
              // HOME
              // ======================================================

              private void buildHome() {

                  stopPreview();

                  createBase();

                  content.addView(
                          text(
                                  "CONTROLLER",
                                  18,
                                  Color.WHITE
                          )
                  );


                  Button scan =
                          button(
                                  "SCAN & CONNECT"
                          );

                  scan.setOnClickListener(
                          v -> scan()
                  );

                  content.addView(
                          scan
                  );


                  modeStatus =
                          text(
                                  "MODE " +
                                  selectedMode,
                                  28,
                                  Color.WHITE
                          );

                  modeStatus.setGravity(
                          Gravity.CENTER
                  );


                  content.addView(
                          modeStatus,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  90
                          )
                  );


                  Button powerOn =
                          button(
                                  "POWER ON / RESTORE MODE"
                          );

                  powerOn.setOnClickListener(
                          v -> sendMode(
                                  selectedMode
                          )
                  );

                  content.addView(
                          powerOn
                  );


                  Button powerOff =
                          button(
                                  "POWER OFF"
                          );

                  powerOff.setOnClickListener(
                          v -> sendOff()
                  );

                  content.addView(
                          powerOff
                  );


                  content.addView(
                          text(
                                  "BRIGHTNESS",
                                  14,
                                  Color.LTGRAY
                          )
                  );


                  SeekBar bar =
                          new SeekBar(this);

                  bar.setMax(255);

                  bar.setProgress(
                          brightness
                  );

                  bar.setOnSeekBarChangeListener(
                          new SeekBar
                                  .OnSeekBarChangeListener() {

                              @Override
                              public void onProgressChanged(
                                      SeekBar seekBar,
                                      int value,
                                      boolean fromUser
                              ) {

                                  brightness =
                                          value;
                              }

                              @Override
                              public void onStartTrackingTouch(
                                      SeekBar seekBar
                              ) {
                              }

                              @Override
                              public void onStopTrackingTouch(
                                      SeekBar seekBar
                              ) {
                              }
                          }
                  );

                  content.addView(
                          bar
                  );


                  content.addView(
                          text(
                                  "Quick Modes",
                                  18,
                                  Color.WHITE
                          )
                  );


                  GridLayout grid =
                          new GridLayout(this);

                  grid.setColumnCount(4);


                  int[] quickModes = {
                          1,
                          10,
                          20,
                          30,
                          50,
                          75,
                          100,
                          125,
                          150,
                          171,
                          200,
                          210
                  };


                  for (
                          int mode :
                          quickModes
                  ) {

                      final int m =
                              mode;

                      Button b =
                              button(
                                      String.valueOf(m)
                              );

                      b.setOnClickListener(
                              v -> sendMode(m)
                      );


                      GridLayout.LayoutParams p =
                              new GridLayout.LayoutParams();

                      p.width = 0;

                      p.columnSpec =
                              GridLayout.spec(
                                      GridLayout.UNDEFINED,
                                      1f
                              );


                      grid.addView(
                              b,
                              p
                      );
                  }


                  content.addView(
                          grid
                  );
              }


              // ======================================================
              // MODES
              // ======================================================

              private void buildModes() {

                  stopPreview();

                  createBase();


                  content.addView(
                          text(
                                  "MODES 1 - 210",
                                  22,
                                  Color.WHITE
                          )
                  );


                  content.addView(
                          text(
                                  "Preset controller modes",
                                  13,
                                  Color.GRAY
                          )
                  );


                  EditText search =
                          new EditText(this);

                  search.setHint(
                          "Mode number"
                  );

                  search.setTextColor(
                          Color.WHITE
                  );

                  search.setHintTextColor(
                          Color.GRAY
                  );


                  content.addView(
                          search
                  );


                  GridLayout grid =
                          new GridLayout(this);

                  grid.setColumnCount(3);


                  for (
                          int mode = 1;
                          mode <= 210;
                          mode++
                  ) {

                      final int m =
                              mode;

                      Button b =
                              button(
                                      String.format(
                                              Locale.US,
                                              "%03d",
                                              m
                                      )
                              );


                      b.setOnClickListener(
                              v -> sendMode(m)
                      );


                      GridLayout.LayoutParams p =
                              new GridLayout.LayoutParams();

                      p.width = 0;

                      p.columnSpec =
                              GridLayout.spec(
                                      GridLayout.UNDEFINED,
                                      1f
                              );


                      grid.addView(
                              b,
                              p
                      );
                  }


                  content.addView(
                          grid,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  0,
                                  1
                          )
                  );
              }


              // ======================================================
              // CUSTOM
              // ======================================================

              private void buildCustom() {

                  stopPreview();

                  createBase();


                  content.addView(
                          text(
                                  "CUSTOM STUDIO",
                                  24,
                                  Color.WHITE
                          )
                  );


                  content.addView(
                          text(
                                  "Custom slots 171 - 210",
                                  14,
                                  Color.LTGRAY
                          )
                  );


                  for (
                          int slot = 171;
                          slot <= 210;
                          slot++
                  ) {

                      final int s =
                              slot;


                      Button b =
                              button(
                                      "SLOT " +
                                      s +
                                      (
                                              s ==
                                                      selectedMode
                                                      ? "  ACTIVE"
                                                      : ""
                                      )
                              );


                      b.setOnClickListener(
                              v -> {

                                  selectedMode =
                                          s;

                                  loadSlot();

                                  buildCustom();
                              }
                      );


                      content.addView(
                              b
                      );
                  }


                  Button editor =
                          button(
                                  "OPEN ANIMATION EDITOR"
                          );

                  editor.setOnClickListener(
                          v -> buildEditor()
                  );

                  content.addView(
                          editor
                  );


                  Button preview =
                          button(
                                  "PREVIEW"
                          );

                  preview.setOnClickListener(
                          v -> buildPreview()
                  );

                  content.addView(
                          preview
                  );
              }


              // ======================================================
              // EDITOR
              // ======================================================

              private void buildEditor() {

                  stopPreview();

                  createBase();


                  content.addView(
                          text(
                                  "ANIMATION EDITOR",
                                  24,
                                  Color.WHITE
                          )
                  );


                  content.addView(
                          text(
                                  "Slot " +
                                  selectedMode,
                                  16,
                                  Color.LTGRAY
                          )
                  );


                  EditText command =
                          new EditText(this);

                  command.setHint(
                          "contoh: merah biru bergantian"
                  );

                  command.setTextColor(
                          Color.WHITE
                  );

                  command.setHintTextColor(
                          Color.GRAY
                  );


                  content.addView(
                          command
                  );


                  Button generate =
                          button(
                                  "AI GENERATE"
                          );

                  generate.setOnClickListener(
                          v -> generateAnimation(
                                  command
                                          .getText()
                                          .toString()
                          )
                  );

                  content.addView(
                          generate
                  );


                  content.addView(
                          text(
                                  "TIMELINE",
                                  18,
                                  Color.WHITE
                          )
                  );


                  LinearLayout timeline =
                          new LinearLayout(this);

                  timeline.setOrientation(
                          LinearLayout.VERTICAL
                  );


                  for (
                          int i = 0;
                          i < frames.size();
                          i++
                  ) {

                      final int index =
                              i;

                      Frame f =
                              frames.get(i);


                      Button row =
                              button(
                                      "#" +
                                      (i + 1) +
                                      "  LEFT " +
                                      rgb(
                                              f.lr,
                                              f.lg,
                                              f.lb
                                      ) +
                                      "  RIGHT " +
                                      rgb(
                                              f.rr,
                                              f.rg,
                                              f.rb
                                      ) +
                                      "  " +
                                      f.duration +
                                      "ms"
                              );


                      row.setOnClickListener(
                              v -> editFrame(
                                      index
                              )
                      );


                      timeline.addView(
                              row
                      );
                  }


                  content.addView(
                          timeline,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  0,
                                  1
                          )
                  );


                  Button add =
                          button(
                                  "ADD FRAME"
                          );

                  add.setOnClickListener(
                          v -> {

                              frames.add(
                                      new Frame(
                                              255,
                                              0,
                                              0,
                                              255,
                                              0,
                                              0,
                                              500
                                      )
                              );

                              buildEditor();
                          }
                  );

                  content.addView(
                          add
                  );


                  Button duplicate =
                          button(
                                  "DUPLICATE LAST FRAME"
                          );

                  duplicate.setOnClickListener(
                          v -> {

                              if (!frames.isEmpty()) {

                                  Frame f =
                                          frames.get(
                                                  frames.size() - 1
                                          );

                                  frames.add(
                                          f.copy()
                                  );
                              }

                              buildEditor();
                          }
                  );

                  content.addView(
                          duplicate
                  );


                  Button stripe =
                          button(
                                  "GENERATE STRIPE / BELANG"
                          );

                  stripe.setOnClickListener(
                          v -> generateStripe()
                  );

                  content.addView(
                          stripe
                  );


                  Button chase =
                          button(
                                  "GENERATE CHASE"
                          );

                  chase.setOnClickListener(
                          v -> generateChase()
                  );

                  content.addView(
                          chase
                  );


                  Button rainbow =
                          button(
                                  "GENERATE RAINBOW"
                          );

                  rainbow.setOnClickListener(
                          v -> generateRainbow()
                  );

                  content.addView(
                          rainbow
                  );


                  Button save =
                          button(
                                  "SAVE SLOT " +
                                  selectedMode
                          );

                  save.setOnClickListener(
                          v -> saveSlot()
                  );

                  content.addView(
                          save
                  );


                  Button preview =
                          button(
                                  "PREVIEW BEFORE SEND"
                          );

                  preview.setOnClickListener(
                          v -> buildPreview()
                  );

                  content.addView(
                          preview
                  );
              }


              // ======================================================
              // EDIT FRAME
              // ======================================================

              private void editFrame(
                      int index
              ) {

                  if (
                          index < 0 ||
                          index >= frames.size()
                  ) {
                      return;
                  }


                  Frame f =
                          frames.get(index);


                  createBase();


                  content.addView(
                          text(
                                  "EDIT FRAME " +
                                  (index + 1),
                                  22,
                                  Color.WHITE
                          )
                  );


                  EditText lr =
                          edit(
                                  f.lr
                          );

                  EditText lg =
                          edit(
                                  f.lg
                          );

                  EditText lb =
                          edit(
                                  f.lb
                          );


                  EditText rr =
                          edit(
                                  f.rr
                          );

                  EditText rg =
                          edit(
                                  f.rg
                          );

                  EditText rb =
                          edit(
                                  f.rb
                          );


                  EditText duration =
                          edit(
                                  f.duration
                          );


                  addField(
                          "LEFT R",
                          lr
                  );

                  addField(
                          "LEFT G",
                          lg
                  );

                  addField(
                          "LEFT B",
                          lb
                  );


                  addField(
                          "RIGHT R",
                          rr
                  );

                  addField(
                          "RIGHT G",
                          rg
                  );

                  addField(
                          "RIGHT B",
                          rb
                  );


                  addField(
                          "DURATION MS",
                          duration
                  );


                  Button apply =
                          button(
                                  "APPLY"
                          );


                  apply.setOnClickListener(
                          v -> {

                              f.lr =
                                      read(
                                              lr,
                                              f.lr
                                      );

                              f.lg =
                                      read(
                                              lg,
                                              f.lg
                                      );

                              f.lb =
                                      read(
                                              lb,
                                              f.lb
                                      );


                              f.rr =
                                      read(
                                              rr,
                                              f.rr
                                      );

                              f.rg =
                                      read(
                                              rg,
                                              f.rg
                                      );

                              f.rb =
                                      read(
                                              rb,
                                              f.rb
                                      );


                              f.duration =
                                      Math.max(
                                              30,
                                              read(
                                                      duration,
                                                      f.duration
                                              )
                                      );


                              buildEditor();
                          }
                  );


                  content.addView(
                          apply
                  );


                  Button delete =
                          button(
                                  "DELETE FRAME"
                          );


                  delete.setOnClickListener(
                          v -> {

                              if (
                                      frames.size() >
                                              1
                              ) {
                                  frames.remove(
                                          index
                                  );
                              }

                              buildEditor();
                          }
                  );


                  content.addView(
                          delete
                  );


                  Button back =
                          button(
                                  "BACK"
                          );


                  back.setOnClickListener(
                          v -> buildEditor()
                  );


                  content.addView(
                          back
                  );
              }


