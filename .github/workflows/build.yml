                  Button pause=button("Ⅱ PAUSE");
                  Button restart=button("↻ RESTART");

                  LinearLayout controls=new LinearLayout(this);
                  controls.addView(play,new LinearLayout.LayoutParams(0,62,1));
                  controls.addView(pause,new LinearLayout.LayoutParams(0,62,1));
                  controls.addView(restart,new LinearLayout.LayoutParams(0,62,1));
                  add(controls);

                  final boolean[] running={false};
                  final int[] index={0};

                  Runnable tick=new Runnable() {
                      @Override public void run() {
                          if(!running[0] || frames.size()==0) return;

                          Frame f=frames.get(index[0]);

                          preview.setFrame(f);
                          frameLabel.setText(
                                  "FRAME "+(index[0]+1)+
                                  " / "+frames.size());

                          index[0]=(index[0]+1)%frames.size();

                          int delay=f.duration;

                          if(previewSpeed.getProgress()>0) {
                              delay=Math.max(
                                      30,
                                      delay-
                                      previewSpeed.getProgress()/2);
                          }

                          handler.postDelayed(this,delay);
                      }
                  };

                  play.setOnClickListener(v->{
                      if(frames.size()==0)return;
                      running[0]=true;
                      handler.removeCallbacksAndMessages(null);
                      handler.post(tick);
                  });

                  pause.setOnClickListener(v->{
                      running[0]=false;
                      handler.removeCallbacksAndMessages(null);
                  });

                  restart.setOnClickListener(v->{
                      index[0]=0;
                      preview.setFrame(frames.get(0));
                      frameLabel.setText("FRAME 1 / "+frames.size());
                  });

                  space(10);

                  Button edit=button("← EDIT ANIMATION");
                  edit.setOnClickListener(v->showEditor());
                  add(edit);

                  Button send=button("⚡ SEND TO LED");
                  send.setOnClickListener(v->{
                      running[0]=false;
                      handler.removeCallbacksAndMessages(null);
                      playToLED();
                  });
                  add(send);

                  Button save=button("SAVE SLOT "+editSlot);
                  save.setOnClickListener(v->saveSlot(editSlot));
                  add(save);

                  if(frames.size()>0) {
                      preview.setFrame(frames.get(0));
                  }
              }

              void playToLED() {
                  if(frames.size()==0) {
                      Toast.makeText(this,
                              "Belum ada frame",
                              Toast.LENGTH_SHORT).show();
                      return;
                  }

                  if(!connected) {
                      Toast.makeText(this,
                              "Hubungkan LEDDMX terlebih dahulu",
                              Toast.LENGTH_SHORT).show();
                      return;
                  }

                  playIndex=0;
                  sendNextFrame();
              }

              int playIndex=0;

              void sendNextFrame() {
                  if(playIndex>=frames.size()) {
                      playIndex=0;
                      return;
                  }

                  Frame f=frames.get(playIndex);

                  /*
                   * Protocol yang diketahui dari modul ini hanya
                   * mendukung pengiriman warna live melalui FFE1.
                   *
                   * LEFT/RIGHT dipertahankan sebagai data editor/
                   * preview. Jalur hardware terpisah belum dipastikan.
                   *
                   * Karena itu kita TIDAK mengarang command LEFT/RIGHT.
                   */

                  int r=(f.lr+f.rr)/2;
                  int g=(f.lg+f.rg)/2;
                  int b=(f.lb+f.rb)/2;

                  sendColor(r,g,b);

                  playIndex++;

                  handler.postDelayed(
                          this::sendNextFrame,
                          Math.max(50,f.duration));
              }

              void saveSlot(int slot) {
                  StringBuilder s=new StringBuilder();

                  for(Frame f:frames) {
                      s.append(f.lr).append(',')
                       .append(f.lg).append(',')
                       .append(f.lb).append(',')
                       .append(f.rr).append(',')
                       .append(f.rg).append(',')
                       .append(f.rb).append(',')
                       .append(f.duration).append(';');
                  }

                  prefs.edit()
                          .putString("slot_"+slot,s.toString())
                          .apply();
              }

              void loadSlot(int slot) {
                  frames.clear();

                  String data=prefs.getString(
                          "slot_"+slot,null);

                  if(data==null || data.isEmpty()) {
                      frames.add(new Frame(
                              255,0,0,
                              0,0,255,
                              300));
                      return;
                  }

                  try {
                      String[] fs=data.split(";");

                      for(String x:fs) {
                          if(x.trim().isEmpty())continue;

                          String[] a=x.split(",");

                          if(a.length>=7) {
                              frames.add(new Frame(
                                      Integer.parseInt(a[0]),
                                      Integer.parseInt(a[1]),
                                      Integer.parseInt(a[2]),
                                      Integer.parseInt(a[3]),
                                      Integer.parseInt(a[4]),
                                      Integer.parseInt(a[5]),
                                      Integer.parseInt(a[6])
                              ));
                          }
                      }
                  } catch(Exception e) {
                      frames.clear();
                      frames.add(new Frame(
                              255,0,0,
                              0,0,255,300));
                  }

                  if(frames.size()==0) {
                      frames.add(new Frame(
                              255,0,0,
                              0,0,255,300));
                  }
              }

