name: Build LEDDMX AI PRO - Direct BLE Controller

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Create Android Project
        shell: bash
        run: |
          set -e

          rm -rf app build.gradle settings.gradle gradle.properties local.properties gradlew gradlew.bat gradle

          mkdir -p app/src/main/java/com/leddmx/pro
          mkdir -p app/src/main/res/values
          mkdir -p gradle/wrapper

          echo "sdk.dir=$ANDROID_HOME" > local.properties

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "LEDDMX-AI-PRO"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=false
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.leddmx.pro'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.leddmx.pro'
                  minSdk 23
                  targetSdk 35
                  versionCode 30
                  versionName '30.0'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">LEDDMX AI PRO</string>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.BLUETOOTH" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" />

              <uses-permission
                  android:name="android.permission.BLUETOOTH_SCAN"
                  android:usesPermissionFlags="neverForLocation" />

              <uses-permission
                  android:name="android.permission.BLUETOOTH_CONNECT" />

              <uses-permission
                  android:name="android.permission.ACCESS_FINE_LOCATION" />

              <uses-feature
                  android:name="android.hardware.bluetooth_le"
                  android:required="false" />

              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:theme="@android:style/Theme.Material.NoActionBar"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > app/src/main/java/com/leddmx/pro/MainActivity.java <<'EOF'
          package com.leddmx.pro;

          import android.Manifest;
          import android.app.Activity;
          import android.bluetooth.BluetoothAdapter;
          import android.bluetooth.BluetoothDevice;
          import android.bluetooth.BluetoothGatt;
          import android.bluetooth.BluetoothGattCallback;
          import android.bluetooth.BluetoothGattCharacteristic;
          import android.bluetooth.BluetoothGattService;
          import android.bluetooth.BluetoothManager;
          import android.bluetooth.le.BluetoothLeScanner;
          import android.bluetooth.le.ScanCallback;
          import android.bluetooth.le.ScanResult;
          import android.content.Context;
          import android.content.SharedPreferences;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.os.Handler;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.SeekBar;
          import android.widget.Spinner;
          import android.widget.ArrayAdapter;
          import android.widget.TextView;
          import android.widget.Toast;

          import java.util.ArrayList;
          import java.util.Locale;
          import java.util.UUID;

          public class MainActivity extends Activity {

              private static final UUID SERVICE_UUID =
                      UUID.fromString("0000FFE0-0000-1000-8000-00805F9B34FB");

              private static final UUID WRITE_UUID =
                      UUID.fromString("0000FFE1-0000-1000-8000-00805F9B34FB");

              private static final UUID ALT_SERVICE_UUID =
                      UUID.fromString("5833FF01-9B8B-5191-6142-22A4536EF123");

              private BluetoothAdapter adapter;
              private BluetoothLeScanner scanner;
              private BluetoothGatt gatt;
              private BluetoothGattCharacteristic writeChar;

              private TextView status;
              private LinearLayout content;

              private final Handler handler = new Handler();

              private boolean scanning = false;
              private boolean playing = false;

              private int brightness = 100;
              private int speed = 50;
              private int direction = 0;

              private int selectedMode = 1;
              private int selectedSlot = 171;

              private int pixelCount = 1;
              private int pixelType = 0;
              private int colorOrder = 1;

              private final ArrayList<Frame> frames = new ArrayList<>();
              private final ArrayList<BluetoothDevice> devices = new ArrayList<>();

              private SharedPreferences prefs;

              private static class Frame {
                  int left;
                  int right;
                  int duration;

                  Frame(int left, int right, int duration) {
                      this.left = left;
                      this.right = right;
                      this.duration = duration;
                  }
              }

              @Override
              protected void onCreate(Bundle state) {
                  super.onCreate(state);

                  prefs = getSharedPreferences("leddmx_pro", MODE_PRIVATE);

                  BluetoothManager manager =
                          (BluetoothManager)getSystemService(Context.BLUETOOTH_SERVICE);

                  if (manager != null) {
                      adapter = manager.getAdapter();
                  }

                  loadSlot(171);

                  buildRoot();
                  showHome();

                  requestBlePermissions();
              }

              private void requestBlePermissions() {
                  ArrayList<String> p = new ArrayList<>();

                  if (android.os.Build.VERSION.SDK_INT >= 31) {
                      if (checkSelfPermission(Manifest.permission.BLUETOOTH_SCAN)
                              != PackageManager.PERMISSION_GRANTED) {
                          p.add(Manifest.permission.BLUETOOTH_SCAN);
                      }

                      if (checkSelfPermission(Manifest.permission.BLUETOOTH_CONNECT)
                              != PackageManager.PERMISSION_GRANTED) {
                          p.add(Manifest.permission.BLUETOOTH_CONNECT);
                      }
                  } else {
                      if (checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION)
                              != PackageManager.PERMISSION_GRANTED) {
                          p.add(Manifest.permission.ACCESS_FINE_LOCATION);
                      }
                  }

                  if (!p.isEmpty()) {
                      requestPermissions(p.toArray(new String[0]), 900);
                  }
              }

              private void buildRoot() {

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setBackgroundColor(Color.rgb(10,11,14));

                  LinearLayout top = new LinearLayout(this);
                  top.setGravity(Gravity.CENTER_VERTICAL);
                  top.setPadding(20,14,20,10);

                  TextView title = new TextView(this);
                  title.setText("LEDDMX AI PRO");
                  title.setTextColor(Color.CYAN);
                  title.setTextSize(20);
                  title.setTypeface(null,1);

                  top.addView(title,new LinearLayout.LayoutParams(0,-2,1));

                  Button scan = button("SCAN");
                  scan.setOnClickListener(v -> showScan());
                  top.addView(scan);

                  root.addView(top);

                  status = new TextView(this);
                  status.setText("● DISCONNECTED");
                  status.setTextColor(Color.YELLOW);
                  status.setPadding(20,0,20,12);

                  root.addView(status);

                  ScrollView scroll = new ScrollView(this);

                  content = new LinearLayout(this);
                  content.setOrientation(LinearLayout.VERTICAL);
                  content.setPadding(16,8,16,30);

                  scroll.addView(content);

                  root.addView(scroll,new LinearLayout.LayoutParams(-1,0,1));

                  setContentView(root);
              }

              private Button button(String text) {

                  Button b = new Button(this);
                  b.setText(text);
                  b.setTextColor(Color.WHITE);
                  b.setBackgroundColor(Color.rgb(30,34,42));

                  return b;
              }

              private TextView label(String text) {

                  TextView t = new TextView(this);
                  t.setText(text);
                  t.setTextColor(Color.WHITE);
                  t.setTextSize(15);
                  t.setPadding(4,12,4,8);

                  return t;
              }

              private void clear() {
                  content.removeAllViews();
              }

              private void showHome() {

                  clear();

                  content.addView(label("DIRECT BLE CONTROLLER"));

                  Button power = button("POWER ON");
                  power.setOnClickListener(v -> sendPower(true));
                  content.addView(power);

                  Button off = button("POWER OFF");
                  off.setOnClickListener(v -> sendPower(false));
                  content.addView(off);

                  content.addView(label("CURRENT MODE: " + selectedMode));

                  LinearLayout modeRow = new LinearLayout(this);

                  Button prev = button("◀ PREV");
                  prev.setOnClickListener(v -> {
                      selectedMode--;
                      if(selectedMode < 1) selectedMode = 210;
                      sendMode(selectedMode);
                      showHome();
                  });

                  Button next = button("NEXT ▶");
                  next.setOnClickListener(v -> {
                      selectedMode++;
                      if(selectedMode > 210) selectedMode = 1;
                      sendMode(selectedMode);
                      showHome();
                  });

                  modeRow.addView(prev,new LinearLayout.LayoutParams(0,-2,1));
                  modeRow.addView(next,new LinearLayout.LayoutParams(0,-2,1));

                  content.addView(modeRow);

                  Button presets = button("PRESET MODES 1–210");
                  presets.setOnClickListener(v -> showModes());
                  content.addView(presets);

                  Button rgb = button("RGB / COLOR");
                  rgb.setOnClickListener(v -> showRgb());
                  content.addView(rgb);

                  Button custom = button("CUSTOM STUDIO");
                  custom.setOnClickListener(v -> showCustom());
                  content.addView(custom);

                  Button ai = button("AI ANIMATION");
                  ai.setOnClickListener(v -> showAI());
                  content.addView(ai);

                  Button config = button("MODULE CONFIG");
                  config.setOnClickListener(v -> showConfig());
                  content.addView(config);

                  Button raw = button("RAW BLE COMMAND");
                  raw.setOnClickListener(v -> showRaw());
                  content.addView(raw);

                  Button settings = button("SETTINGS");
                  settings.setOnClickListener(v -> showSettings());
                  content.addView(settings);
              }

              private void showModes() {

                  clear();

                  content.addView(label("PRESET MODES 1–210"));

                  for(int i=1;i<=210;i++) {

                      final int mode = i;

                      Button b = button("MODE " + mode + "  •  " + modeName(mode));

                      b.setOnClickListener(v -> {
                          selectedMode = mode;
                          sendMode(mode);
                          Toast.makeText(this,
                                  "MODE "+mode+" SENT",
                                  Toast.LENGTH_SHORT).show();
                      });

                      content.addView(b);
                  }

                  Button back = button("BACK");
                  back.setOnClickListener(v -> showHome());
                  content.addView(back);
              }

              private String modeName(int m) {

                  if(m==1) return "Forward Dreaming";
                  if(m==2) return "Backward Dreaming";
                  if(m==3) return "Forward 7 Colors";
                  if(m==4) return "Backward 7 Colors";
                  if(m==5) return "Forward RGB";
                  if(m==6) return "Backward RGB";
                  if(m==23) return "Forward Trailing 7 Colors";
                  if(m==24) return "Backward Trailing 7 Colors";
                  if(m==39) return "Forward Streaming 7 Colors";
                  if(m==57) return "Open Curtain";
                  if(m==58) return "Close Curtain";
                  if(m==75) return "Hop 7 Colors";
                  if(m==78) return "Strobe 7 Colors";
                  if(m==81) return "Gradual 7 Colors";

                  if(m>=161 && m<=184) return "Flow";
                  if(m>=185 && m<=198) return "Run";
                  if(m>=199 && m<=204) return "Swab";
                  if(m>=205 && m<=210) return "Curtain Swab";

                  return "Controller Preset";
              }

              private void showRgb() {

                  clear();

                  content.addView(label("DIRECT RGB"));

                  EditText r = number("R 0–255");
                  EditText g = number("G 0–255");
                  EditText b = number("B 0–255");

                  content.addView(r);
                  content.addView(g);
                  content.addView(b);

                  Button send = button("SEND RGB");

                  send.setOnClickListener(v -> {

                      int rv = parse(r,0);
                      int gv = parse(g,0);
                      int bv = parse(b,0);

                      sendRgb(rv,gv,bv);

                  });

                  content.addView(send);

                  content.addView(label("BRIGHTNESS"));

                  SeekBar bs = new SeekBar(this);
                  bs.setMax(100);
                  bs.setProgress(brightness);

                  TextView bt = label("Brightness: "+brightness+"%");

                  bs.setOnSeekBarChangeListener(
                          new SeekBar.OnSeekBarChangeListener() {

                              public void onProgressChanged(
                                      SeekBar s,int p,boolean from) {

                                  brightness=p;
                                  bt.setText("Brightness: "+p+"%");
                                  sendBrightness(p);
                              }

                              public void onStartTrackingTouch(SeekBar s){}
                              public void onStopTrackingTouch(SeekBar s){}
                          });

                  content.addView(bt);
                  content.addView(bs);

                  Button off = button("OFF");
                  off.setOnClickListener(v -> sendPower(false));
                  content.addView(off);

                  Button back = button("BACK");
                  back.setOnClickListener(v -> showHome());
                  content.addView(back);
              }

              private EditText number(String hint) {

                  EditText e = new EditText(this);
                  e.setHint(hint);
                  e.setHintTextColor(Color.GRAY);
                  e.setTextColor(Color.WHITE);
                  e.setInputType(2);
                  e.setPadding(12,8,12,8);

                  return e;
              }

              private int parse(EditText e,int fallback) {

                  try {
                      return Integer.parseInt(e.getText().toString());
                  } catch(Exception ex) {
                      return fallback;
                  }
              }

              private void showConfig() {

                  clear();

                  content.addView(label("MODULE / IC CONFIG"));

                  content.addView(label(
                          "Konfigurasi dikirim menggunakan command LEDDMX yang terdokumentasi."
                  ));

                  EditText type = number("Pixel / IC Type");
                  EditText count = number("Pixel Count");
                  content.addView(type);
                  content.addView(count);

                  String[] orders = {
                          "RGB",
                          "RBG",
                          "GRB",
                          "GBR",
                          "BRG",
                          "BGR"
                  };

                  Spinner order = new Spinner(this);

                  ArrayAdapter<String> oa =
                          new ArrayAdapter<>(
                                  this,
                                  android.R.layout.simple_spinner_dropdown_item,
                                  orders);

                  order.setAdapter(oa);
                  order.setSelection(Math.max(0,Math.min(5,colorOrder-1)));

                  content.addView(order);

                  Button apply = button("APPLY CONFIG");

                  apply.setOnClickListener(v -> {

                      pixelType=parse(type,0);
                      pixelCount=Math.max(1,parse(count,1));
                      colorOrder=order.getSelectedItemPosition()+1;

                      sendPixelConfig(
                              pixelType,
                              pixelCount,
                              colorOrder
                      );
                  });

                  content.addView(apply);

                  Button forward = button("DIRECTION FORWARD");

                  forward.setOnClickListener(v -> {
                      direction=0;
                      sendDirection(0);
                  });

                  content.addView(forward);

                  Button backward = button("DIRECTION BACKWARD");

                  backward.setOnClickListener(v -> {
                      direction=1;
                      sendDirection(1);
                  });

                  content.addView(backward);

                  content.addView(label(
                          "Type / pixel count / RGB order bergantung pada controller dan strip yang terpasang."
                  ));

                  Button back = button("BACK");
                  back.setOnClickListener(v -> showHome());
                  content.addView(back);
              }

              private void showCustom() {

                  clear();

                  content.addView(label(
                          "CUSTOM STUDIO • LOCAL SLOTS 171–210"
                  ));

                  String[] slots = new String[40];

                  for(int i=0;i<40;i++) {
                      slots[i]="SLOT "+(171+i);
                  }

                  Spinner spinner = new Spinner(this);

                  ArrayAdapter<String> sa =
                          new ArrayAdapter<>(
                                  this,
                                  android.R.layout.simple_spinner_dropdown_item,
                                  slots);

                  spinner.setAdapter(sa);
                  spinner.setSelection(selectedSlot-171);

                  spinner.setOnItemSelectedListener(
                          new android.widget.AdapterView.OnItemSelectedListener() {

                              public void onItemSelected(
                                      android.widget.AdapterView<?> p,
                                      View v,
                                      int pos,
                                      long id) {

                                  selectedSlot=171+pos;
                                  loadSlot(selectedSlot);
                              }

                              public void onNothingSelected(
                                      android.widget.AdapterView<?> p){}
                          });

                  content.addView(spinner);

                  Button templates = button("ANIMATION TEMPLATES");
                  templates.setOnClickListener(v -> showTemplates());
                  content.addView(templates);

                  Button add = button("+ ADD FRAME");

                  add.setOnClickListener(v -> {

                      frames.add(
                              new Frame(
                                      Color.RED,
                                      Color.BLUE,
                                      300));

                      showCustom();
                  });

                  content.addView(add);

                  for(int i=0;i<frames.size();i++) {

                      final int index=i;
                      final Frame f=frames.get(i);

                      LinearLayout card =
                              new LinearLayout(this);

                      card.setOrientation(
                              LinearLayout.VERTICAL);

                      card.setPadding(10,10,10,10);

                      TextView title=label(
                              "FRAME "+(i+1)+
                              "   "+f.duration+"ms"
                      );

                      card.addView(title);

                      LinearLayout colors =
                              new LinearLayout(this);

                      TextView left =
                              colorBox("LEFT",f.left);

                      TextView right =
                              colorBox("RIGHT",f.right);

                      left.setOnClickListener(v ->
                              cycleLeft(index));

                      right.setOnClickListener(v ->
                              cycleRight(index));

                      colors.addView(
                              left,
                              new LinearLayout.LayoutParams(
                                      0,90,1));

                      colors.addView(
                              right,
                              new LinearLayout.LayoutParams(
                                      0,90,1));

                      card.addView(colors);

                      Button duplicate=button("DUPLICATE");

                      duplicate.setOnClickListener(v -> {

                          Frame copy =
                                  new Frame(
                                          f.left,
                                          f.right,
                                          f.duration);

                          frames.add(index+1,copy);

                          showCustom();
                      });

                      card.addView(duplicate);

                      Button delete=button("DELETE");

                      delete.setOnClickListener(v -> {

                          if(frames.size()>1) {
                              frames.remove(index);
                          }

                          showCustom();
                      });

                      card.addView(delete);

                      content.addView(card);
                  }

                  Button preview=button("PREVIEW");

                  preview.setOnClickListener(v -> showPreview());

                  content.addView(preview);

                  Button save=button("SAVE SLOT ON PHONE");

                  save.setOnClickListener(v -> saveSlot());

                  content.addView(save);

                  Button back=button("BACK");

                  back.setOnClickListener(v -> showHome());

                  content.addView(back);
              }

              private TextView colorBox(String text,int color) {

                  TextView t=new TextView(this);

                  t.setText(text);
                  t.setGravity(Gravity.CENTER);
                  t.setTextColor(Color.WHITE);
                  t.setTextSize(15);
                  t.setBackgroundColor(color);

                  return t;
              }

              private void cycleLeft(int index) {

                  int[] colors={
                          Color.RED,
                          Color.GREEN,
                          Color.BLUE,
                          Color.YELLOW,
                          Color.CYAN,
                          Color.MAGENTA,
                          Color.WHITE,
                          Color.BLACK
                  };

                  Frame f=frames.get(index);

                  int pos=0;

                  for(int i=0;i<colors.length;i++) {
                      if(colors[i]==f.left) {
                          pos=i;
                          break;
                      }
                  }

                  f.left=colors[(pos+1)%colors.length];

                  showCustom();
              }

              private void cycleRight(int index) {

                  int[] colors={
                          Color.RED,
                          Color.GREEN,
                          Color.BLUE,
                          Color.YELLOW,
                          Color.CYAN,
                          Color.MAGENTA,
                          Color.WHITE,
                          Color.BLACK
                  };

                  Frame f=frames.get(index);

                  int pos=0;

                  for(int i=0;i<colors.length;i++) {
                      if(colors[i]==f.right) {
                          pos=i;
                          break;
                      }
                  }

                  f.right=colors[(pos+1)%colors.length];

                  showCustom();
              }

              private void showTemplates() {

                  clear();

                  content.addView(
                          label("ANIMATION TEMPLATES"));

                  addTemplate(
                          "RAINBOW",
                          () -> generateRainbow());

                  addTemplate(
                          "RAINBOW FLOW",
                          () -> generateRainbowFlow());

                  addTemplate(
                          "WAVE",
                          () -> generateWave());

                  addTemplate(
                          "COMET",
                          () -> generateComet());

                  addTemplate(
                          "SCANNER",
                          () -> generateScanner());

                  addTemplate(
                          "MIRROR",
                          () -> generateMirror());

                  addTemplate(
                          "PULSE",
                          () -> generatePulse());

                  addTemplate(
                          "COLOR CYCLE",
                          () -> generateColorCycle());

                  addTemplate(
                          "BELANG / ALTERNATING",
                          () -> generateBelang());

                  addTemplate(
                          "CHASE",
                          () -> generateChase());

                  addTemplate(
                          "STROBE",
                          () -> generateStrobe());

                  addTemplate(
                          "FADE",
                          () -> generateFade());

                  addTemplate(
                          "POLICE",
                          () -> generatePolice());

                  addTemplate(
                          "FIRE",
                          () -> generateFire());

                  addTemplate(
                          "WATER",
                          () -> generateWater());

                  addTemplate(
                          "RANDOM",
                          () -> generateRandom());

                  Button back=button("BACK");
                  back.setOnClickListener(v -> showCustom());
                  content.addView(back);
              }

              private void addTemplate(
                      String name,
                      Runnable action) {

                  Button b=button(name);

                  b.setOnClickListener(v -> {
                      action.run();
                      showPreview();
                  });

                  content.addView(b);
              }

              private void generateRainbow() {

                  frames.clear();

                  int[] c={
                          Color.RED,
                          Color.YELLOW,
                          Color.GREEN,
                          Color.CYAN,
                          Color.BLUE,
                          Color.MAGENTA
                  };

                  for(int i=0;i<c.length;i++) {
                      frames.add(
                              new Frame(
                                      c[i],
                                      c[(i+3)%c.length],
                                      220));
                  }
              }

              private void generateRainbowFlow() {

                  frames.clear();

                  int[] c={
                          Color.RED,
                          Color.YELLOW,
                          Color.GREEN,
                          Color.CYAN,
                          Color.BLUE,
                          Color.MAGENTA
                  };

                  for(int i=0;i<12;i++) {

                      int a=c[i%c.length];

                      frames.add(
                              new Frame(
                                      a,
                                      c[(i+2)%c.length],
                                      130));
                  }
              }

              private void generateWave() {

                  frames.clear();

                  int[] c={
                          Color.BLUE,
                          Color.CYAN,
                          Color.WHITE,
                          Color.CYAN
                  };

                  for(int i=0;i<16;i++) {

                      frames.add(
                              new Frame(
                                      c[i%c.length],
                                      c[(i+2)%c.length],
                                      100));
                  }
              }

              private void generateComet() {

                  frames.clear();

                  for(int i=0;i<8;i++) {

                      frames.add(
                              new Frame(
                                      Color.rgb(
                                              255,
                                              Math.max(0,255-i*30),
                                              0),
                                      Color.BLUE,
                                      90));
                  }

                  for(int i=7;i>=0;i--) {

                      frames.add(
                              new Frame(
                                      Color.rgb(
                                              255,
                                              Math.max(0,255-i*30),
                                              0),
                                      Color.BLUE,
                                      90));
                  }
              }

              private void generateScanner() {

                  frames.clear();

                  for(int i=0;i<7;i++) {

                      frames.add(
                              new Frame(
                                      Color.RED,
                                      Color.BLUE,
                                      70));
                  }

                  for(int i=0;i<7;i++) {

                      frames.add(
                              new Frame(
                                      Color.BLUE,
                                      Color.RED,
                                      70));
                  }
              }

              private void generateMirror() {

                  frames.clear();

                  frames.add(
                          new Frame(
                                  Color.RED,
