    // ==============================================================
    // PERMISSION
    // ==============================================================

    void requestBlePermissions() {

        if (
                Build.VERSION.SDK_INT >= 31
        ) {

            requestPermissions(
                    new String[] {
                            Manifest.permission.BLUETOOTH_SCAN,
                            Manifest.permission.BLUETOOTH_CONNECT
                    },
                    50
            );

        } else if (
                Build.VERSION.SDK_INT >= 23
        ) {

            requestPermissions(
                    new String[] {
                            Manifest.permission.ACCESS_FINE_LOCATION
                    },
                    50
            );

        }

    }


    boolean hasScanPermission() {

        if (
                Build.VERSION.SDK_INT >= 31
        ) {

            return
                    checkSelfPermission(
                            Manifest.permission.BLUETOOTH_SCAN
                    )
                    ==
                    PackageManager.PERMISSION_GRANTED;

        }


        if (
                Build.VERSION.SDK_INT < 23
        ) {

            return true;

        }


        return
                checkSelfPermission(
                        Manifest.permission.ACCESS_FINE_LOCATION
                )
                ==
                PackageManager.PERMISSION_GRANTED;

    }


    // ==============================================================
    // BLE SCAN
    // ==============================================================

    void scanBle() {

        if (
                bluetoothAdapter == null
        ) {

            status.setText(
                    "Status: Bluetooth adapter tidak tersedia"
            );

            return;

        }


        if (
                !bluetoothAdapter.isEnabled()
        ) {

            status.setText(
                    "Status: Bluetooth OFF"
            );

            return;

        }


        if (
                !hasScanPermission()
        ) {

            requestBlePermissions();

            return;

        }


        long now =
                System.currentTimeMillis();


        if (
                now - lastScanTime < 2500
        ) {

            status.setText(
                    "Status: tunggu 2.5 detik sebelum scan lagi"
            );

            return;

        }


        if (scanning) {

            return;

        }


        lastScanTime =
                now;


        devices.clear();

        deviceNames.clear();

        deviceAdapter.notifyDataSetChanged();


        activeScanner =
                bluetoothAdapter
                        .getBluetoothLeScanner();


        if (
                activeScanner == null
        ) {

            status.setText(
                    "Status: BLE scanner null"
            );

            return;

        }


        scanning = true;


        scanner =
                activeScanner;


        status.setText(
                "Status: SCANNING..."
        );


        try {

            scanner.startScan(
                    scanCallback
            );

        } catch (
                Exception e
        ) {

            scanning = false;

            status.setText(
                    "SCAN ERROR: " +
                    e.getClass()
                            .getSimpleName()
            );

            return;

        }


        handler.postDelayed(
                this::stopScan,
                4500
        );

    }


    // ==============================================================
    // STOP SCAN
    // ==============================================================

    void stopScan() {

        if (
                !scanning
        ) {

            return;

        }


        try {

            if (
                    scanner != null
            ) {

                scanner.stopScan(
                        scanCallback
                );

            }

        } catch (
                Exception ignored
        ) {
        }


        scanning = false;


        if (
                devices.isEmpty()
        ) {

            status.setText(
                    "Status: scan selesai — device 0"
            );

        } else {

            status.setText(
                    "Status: scan selesai — pilih device lalu CONNECT"
            );

        }

    }


    // ==============================================================
    // SCAN CALLBACK
    // ==============================================================

    final ScanCallback scanCallback =
            new ScanCallback() {

                @Override
                public void onScanResult(
                        int callbackType,
                        ScanResult result
                ) {

                    BluetoothDevice device =
                            result.getDevice();


                    String name = null;


                    if (
                            result.getScanRecord()
                                    != null
                    ) {

                        name =
                                result
                                        .getScanRecord()
                                        .getDeviceName();

                    }


                    if (
                            name == null ||
                            name.trim().isEmpty()
                    ) {

                        try {

                            name =
                                    device.getName();

                        } catch (
                                Exception ignored
                        ) {
                        }

                    }


                    if (
                            name == null
                    ) {

                        name =
                                "UNKNOWN";

                    }


                    String row =
                            name +
                            " | " +
                            device.getAddress();


                    if (
                            !deviceNames.contains(row)
                    ) {

                        devices.add(device);

                        deviceNames.add(row);

                        runOnUiThread(
                                () ->
                                        deviceAdapter
                                                .notifyDataSetChanged()
                        );

                    }

                }


                @Override
                public void onScanFailed(
                        int errorCode
                ) {

                    scanning = false;


                    String message;


                    switch (
                            errorCode
                    ) {

                        case 1:
                            message =
                                    "ALREADY_STARTED";
                            break;

                        case 2:
                            message =
                                    "APPLICATION_REGISTRATION_FAILED";
                            break;

                        case 3:
                            message =
                                    "INTERNAL_ERROR";
                            break;

                        case 4:
                            message =
                                    "FEATURE_UNSUPPORTED";
                            break;

                        case 5:
                            message =
                                    "OUT_OF_HARDWARE_RESOURCES";
                            break;

                        case 6:
                            message =
                                    "SCANNING_TOO_FREQUENTLY";
                            break;

                        default:
                            message =
                                    "CODE " +
                                    errorCode;
                            break;

                    }


                    runOnUiThread(
                            () ->
                                    status.setText(
                                            "SCAN FAILED: " +
                                            message
                                    )
                    );

                }

            };


    // ==============================================================
    // CONNECT
    // ==============================================================

    void connect(
            BluetoothDevice device
    ) {

        try {

            status.setText(
                    "Status: connecting " +
                    device.getAddress()
            );


            gatt =
                    device.connectGatt(
                            this,
                            false,
                            gattCallback
                    );


        } catch (
                Exception e
        ) {

            status.setText(
                    "Connect error: " +
                    e.getMessage()
            );

        }

    }


    // ==============================================================
    // GATT CALLBACK
    // ==============================================================

    final BluetoothGattCallback gattCallback =
            new BluetoothGattCallback() {

                @Override
                public void onConnectionStateChange(
                        BluetoothGatt g,
                        int statusCode,
                        int newState
                ) {

                    if (
                            newState ==
                                    BluetoothProfile.STATE_CONNECTED
                    ) {

                        runOnUiThread(
                                () ->
                                        status.setText(
                                                "Status: connected — discovering services..."
                                        )
                        );


                        gatt =
                                g;


                        g.discoverServices();


                    } else {

                        writeCharacteristic =
                                null;


                        runOnUiThread(
                                () ->
                                        status.setText(
                                                "Status: disconnected"
                                        )
                        );


                        try {

                            g.close();

                        } catch (
                                Exception ignored
                        ) {
                        }

                    }

                }


                @Override
                public void onServicesDiscovered(
                        BluetoothGatt g,
                        int statusCode
                ) {

                    BluetoothGattService service =
                            g.getService(
                                    SERVICE_UUID
                            );


                    if (
                            service != null
                    ) {

                        writeCharacteristic =
                                service.getCharacteristic(
                                        WRITE_UUID
                                );

                    } else {

                        writeCharacteristic =
                                null;

                    }


                    boolean ready =
                            writeCharacteristic
                                    != null;


                    boolean ota =
                            g.getService(
                                    OTA_SERVICE
                            )
                            != null;


                    runOnUiThread(
                            () -> {

                                if (ready) {

                                    if (ota) {

                                        status.setText(
                                                "READY FFE1 | OTA SERVICE DETECTED"
                                        );

                                    } else {

                                        status.setText(
                                                "READY FFE1"
                                        );

                                    }

                                } else {

                                    status.setText(
                                            "Connected tetapi FFE1 tidak ditemukan"
                                    );

                                }

                            }
                    );

                }

            };


    // ==============================================================
    // QUEUE SEND
    // ==============================================================

    void send(
            byte[] data
    ) {

        if (
                data == null ||
                data.length == 0
        ) {

            return;

        }


        synchronized (
                writeQueue
        ) {

            writeQueue.add(
                    data
            );

        }


        drainQueue();

    }


    // ==============================================================
    // DRAIN QUEUE
    // ==============================================================

    void drainQueue() {

        if (
                writing
        ) {

            return;

        }


        byte[] data;


        synchronized (
                writeQueue
        ) {

            data =
                    writeQueue.poll();

        }


        if (
                data == null
        ) {

            return;

        }


        if (
                gatt == null ||
                writeCharacteristic == null
        ) {

            status.setText(
                    "Status: belum READY FFE1"
            );

            return;

        }


        writing = true;


        handler.postDelayed(
                () -> {

                    try {

                        writeCharacteristic.setWriteType(
                                BluetoothGattCharacteristic
                                        .WRITE_TYPE_DEFAULT
                        );


                        writeCharacteristic.setValue(
                                data
                        );


                        boolean ok =
                                gatt.writeCharacteristic(
                                        writeCharacteristic
                                );


                        if (
                                !ok
                        ) {

                            status.setText(
                                    "BLE write rejected"
                            );

                        }

                    } catch (
                            Exception e
                    ) {

                        status.setText(
                                "BLE write error: " +
                                e.getClass()
                                        .getSimpleName()
                        );

                    }


                    writing = false;


                    drainQueue();

                },
                90
        );

    }


    // ==============================================================
    // PACKET BUILDER
    // ==============================================================

    byte[] packet(
            int... values
    ) {

        byte[] result =
                new byte[
                        values.length
                ];


        for (
                int i = 0;
                i < values.length;
                i++
        ) {

            result[i] =
                    (byte)
                            values[i];

        }


        return result;

    }


    // ==============================================================
    // POWER
    //
    // Known working LEDDMX-00 baseline:
    //
    // ON  = 01
    // OFF = 00
    // ==============================================================

    byte[] powerPacket(
            boolean on
    ) {

        return packet(
                0x7B,
                0xFF,
                0x04,
                on ? 0x01 : 0x00,
                0xFF,
                0xFF,
                0xFF,
                0xFF,
                0xBF
        );

    }


    // ==============================================================
    // RGB
    // ==============================================================

    byte[] rgbPacket(
            int r,
            int g,
            int b
    ) {

        return packet(
                0x7B,
                0xFF,
                0x07,
                r,
                g,
                b,
                0x00,
                0xFF,
                0xBF
        );

    }


    // ==============================================================
    // BRIGHTNESS
    // ==============================================================

    byte[] brightnessPacket(
            int percent
    ) {

        percent =
                Math.max(
                        0,
                        Math.min(
                                100,
                                percent
                        )
                );


        int scaled =
                (percent * 32) / 100;


        return packet(
                0x7B,
                0xFF,
                0x01,
                scaled,
                percent,
                0x00,
                0xFF,
                0xFF,
                0xBF
        );

    }


    // ==============================================================
    // SPEED
    // ==============================================================

    byte[] speedPacket(
            int value
    ) {

        value =
                Math.max(
                        0,
                        Math.min(
                                255,
                                value
                        )
                );


        return packet(
                0x7B,
                0xFF,
                0x02,
                value,
                0x00,
                0xFF,
                0xFF,
                0xFF,
                0xBF
        );

    }


    // ==============================================================
    // INTERNAL MODE
    // ==============================================================

    byte[] modePacket(
            int mode
    ) {

        mode =
                Math.max(
                        0,
                        Math.min(
                                210,
                                mode
                        )
                );


        return packet(
                0x7B,
                0xFF,
                0x03,
                mode,
                0xFF,
                0xFF,
                0xFF,
                0xFF,
                0xBF
        );

    }


    // ==============================================================
    // MIC / EQ
    // ==============================================================

    byte[] micPacket(
            int mode
    ) {

        mode =
                Math.max(
                        0,
                        Math.min(
                                7,
                                mode
                        )
                );


        return packet(
                0x7B,
                0xFF,
                0x0B,
                mode,
                0x00,
                0xFF,
                0xFF,
                0xBF
        );

    }


    // ==============================================================
    // RGB UI
    // ==============================================================

    void setRGB() {

        try {

            String text =
                    rgbInput
                            .getText()
                            .toString()
                            .trim()
                            .replace(
                                    "#",
                                    ""
                            );


            if (
                    text.length() != 6
            ) {

                throw new Exception();

            }


            int rgb =
                    Integer.parseInt(
                            text,
                            16
                    );


            int r =
                    (rgb >> 16)
                            & 0xFF;


            int g =
                    (rgb >> 8)
                            & 0xFF;


            int b =
                    rgb
                            & 0xFF;


            send(
                    rgbPacket(
                            r,
                            g,
                            b
                    )
            );


        } catch (
                Exception e
        ) {

            Toast.makeText(
                    this,
                    "HEX harus RRGGBB",
                    Toast.LENGTH_SHORT
            ).show();

        }

    }


    // ==============================================================
    // CUSTOM ANIMATION
    //
    // Proven LEDDMX-00 format:
    //
    // 7B position 0E FD R G B total BF
    //
    // Then:
    //
    // 7B FF 13 mode FF FF FF FF BF
    //
    // Then:
    //
    // 7B FF 0D direction FF FF FF FF BF
    // ==============================================================

    void applyCustom(
            String colorText,
            int customMode,
            boolean forward
    ) {

        String[] colors =
                colorText.split(
                        ","
                );


        ArrayList<Integer> list =
                new ArrayList<>();


        for (
                String item :
                colors
        ) {

            try {

                String hex =
                        item
                                .trim()
                                .replace(
                                        "#",
                                        ""
                                );


                if (
                        hex.length() != 6
                ) {

                    continue;

                }


                int value =
                        Integer.parseInt(
                                hex,
                                16
                        );


                list.add(
                        value
                );


            } catch (
                    Exception ignored
            ) {
            }

        }


        if (
                list.size() < 1 ||
                list.size() > 16
        ) {

            Toast.makeText(
                    this,
                    "Masukkan 1-16 warna HEX",
                    Toast.LENGTH_SHORT
            ).show();


            return;

        }


        int total =
                list.size();


        // ----------------------------------------------------------
        // SEND COLOR LIST
        // ----------------------------------------------------------

        for (
                int i = 0;
                i < total;
                i++
        ) {

            int color =
                    list.get(i);


            int r =
                    (color >> 16)
                            & 0xFF;


            int g =
                    (color >> 8)
                            & 0xFF;


            int b =
                    color
                            & 0xFF;


            send(
                    packet(
                            0x7B,
                            i + 1,
                            0x0E,
                            0xFD,
                            r,
                            g,
                            b,
                            total,
                            0xBF
                    )
            );

        }


        // ----------------------------------------------------------
        // CUSTOM MODE
        // ----------------------------------------------------------

        send(
                packet(
                        0x7B,
                        0xFF,
                        0x13,
                        customMode,
                        0xFF,
                        0xFF,
                        0xFF,
                        0xFF,
                        0xBF
                )
        );


        // ----------------------------------------------------------
        // DIRECTION
        // ----------------------------------------------------------

        send(
                packet(
                        0x7B,
                        0xFF,
                        0x0D,
                        forward
                                ? 0x00
                                : 0x01,
                        0xFF,
                        0xFF,
                        0xFF,
                        0xFF,
                        0xBF
                )
        );

    }


    // ==============================================================
    // RAW HEX
    // ==============================================================

    byte[] parseHex(
            String text
    ) {

        text =
                text
                        .replace(
                                ",",
                                " "
                        )
                        .trim();


        if (
                text.isEmpty()
        ) {

            return null;

        }


        String[] parts =
                text.split(
                        "\\s+"
                );


        byte[] result =
                new byte[
                        parts.length
                ];


        try {

            for (
                    int i = 0;
                    i < parts.length;
                    i++
            ) {

                result[i] =
                        (byte)
                                Integer.parseInt(
                                        parts[i],
                                        16
                                );

            }


        } catch (
                Exception e
        ) {

            return null;

        }


        return result;

    }


    // ==============================================================
    // GATT INSPECTOR
    // ==============================================================

    void inspectGatt() {

        if (
                gatt == null
        ) {

            Toast.makeText(
                    this,
                    "Belum connected",
                    Toast.LENGTH_SHORT
            ).show();


            return;

        }


        StringBuilder text =
                new StringBuilder();


        for (
                BluetoothGattService service :
                gatt.getServices()
        ) {

            text.append(
                    "\nSERVICE\n"
            );


            text.append(
                    service.getUuid()
            );


            text.append(
                    "\n"
            );


            for (
                    BluetoothGattCharacteristic characteristic :
                    service.getCharacteristics()
            ) {

                text.append(
                        "CHAR "
                );


                text.append(
                        characteristic.getUuid()
                );


                text.append(
                        " | properties="
                );


                text.append(
                        characteristic.getProperties()
                );


                text.append(
                        "\n"
                );

            }

        }


        new AlertDialog.Builder(
                this
        )
        .setTitle(
                "GATT Inspector"
        )
        .setMessage(
                text.toString()
        )
        .setPositiveButton(
                "OK",
                null
        )
        .show();

    }


    // ==============================================================
    // OTA INFO
    // ==============================================================

    void showOtaInfo() {

        boolean detected =
                gatt != null &&
                gatt.getService(
                        OTA_SERVICE
                ) != null;


        String message;


        if (
                detected
        ) {

            message =
                    "OTA SERVICE TERDETEKSI\n\n" +
                    "5833FF01\n" +
                    "5833FF02 WRITE\n" +
                    "5833FF03 NOTIFY\n\n" +
                    "Service terdeteksi, tetapi firmware image / format flashing khusus modul ini belum terbukti. Aplikasi tidak akan mem-flash firmware acak.";

        } else {

            message =
                    "OTA service 5833FF01/02/03 tidak terdeteksi pada koneksi saat ini.\n\n" +
                    "Tidak ada firmware acak yang dikirim.";

        }


        new AlertDialog.Builder(
                this
        )
        .setTitle(
                "OTA / Firmware"
        )
        .setMessage(
                message
        )
        .setPositiveButton(
                "OK",
                null
        )
        .show();

    }


    // ==============================================================
    // DESTROY
    // ==============================================================

    @Override
    protected void onDestroy() {

        super.onDestroy();


        try {

            if (
                    gatt != null
            ) {

                gatt.close();

            }

        } catch (
                Exception ignored
        ) {
        }

    }

}
