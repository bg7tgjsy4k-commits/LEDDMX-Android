              // ====================================================
              // COLOR WHEEL
              // ====================================================

              public static class ColorWheel
                      extends View {

                  private Paint paint =
                          new Paint(
                                  Paint.ANTI_ALIAS_FLAG
                          );

                  private Paint selector =
                          new Paint(
                                  Paint.ANTI_ALIAS_FLAG
                          );

                  private float cx;
                  private float cy;
                  private float radius;

                  private float selectedX;
                  private float selectedY;

                  private boolean touched =
                          false;

                  interface Listener {
                      void changed(
                              int r,
                              int g,
                              int b
                      );
                  }

                  private Listener listener;

                  public ColorWheel(
                          Context c) {

                      super(c);

                      selector.setStyle(
                              Paint.Style.STROKE
                      );

                      selector.setStrokeWidth(
                              4
                      );

                      selector.setColor(
                              Color.WHITE
                      );
                  }

                  public void
                  setOnColorChangedListener(
                          Listener l) {

                      listener = l;
                  }

                  @Override
                  protected void onDraw(
                          Canvas c) {

                      super.onDraw(c);

                      float w =
                              getWidth();

                      float h =
                              getHeight();

                      cx = w / 2f;
                      cy = h / 2f;

                      radius =
                              Math.min(
                                      w,
                                      h
                              ) / 2f - 28;

                      int[] colors = {
                              Color.RED,
                              Color.MAGENTA,
                              Color.BLUE,
                              Color.CYAN,
                              Color.GREEN,
                              Color.YELLOW,
                              Color.RED
                      };

                      paint.setShader(
                              new SweepGradient(
                                      cx,
                                      cy,
                                      colors,
                                      null
                              )
                      );

                      c.drawCircle(
                              cx,
                              cy,
                              radius,
                              paint
                      );

                      paint.setShader(null);

                      float inner =
                              radius * 0.28f;

                      paint.setColor(
                              Color.WHITE
                      );

                      c.drawCircle(
                              cx,
                              cy,
                              inner,
                              paint
                      );

                      if (!touched) {

                          selectedX =
                                  cx + radius * .65f;

                          selectedY =
                                  cy;
                      }

                      c.drawCircle(
                              selectedX,
                              selectedY,
                              11,
                              selector
                      );
                  }

                  @Override
                  public boolean onTouchEvent(
                          MotionEvent e) {

                      if (e.getAction() ==
                              MotionEvent.ACTION_DOWN ||
                              e.getAction() ==
                                      MotionEvent.ACTION_MOVE ||
                              e.getAction() ==
                                      MotionEvent.ACTION_UP) {

                          float dx =
                                  e.getX() - cx;

                          float dy =
                                  e.getY() - cy;

                          float d =
                                  (float)Math.sqrt(
                                          dx*dx + dy*dy
                                  );

                          if (d > radius) {

                              dx =
                                      dx / d *
                                      radius;

                              dy =
                                      dy / d *
                                      radius;
                          }

                          selectedX =
                                  cx + dx;

                          selectedY =
                                  cy + dy;

                          touched = true;

                          float hue =
                                  (float)(
                                          Math.atan2(
                                                  dy,
                                                  dx
                                          ) *
                                          180 /
                                          Math.PI
                                  );

                          hue += 90;

                          if (hue < 0) {
                              hue += 360;
                          }

                          float sat =
                                  Math.min(
                                          1f,
                                          d / radius
                                  );

                          float[] hsv =
                                  new float[]{
                                          hue,
                                          sat,
                                          1f
                                  };

                          int color =
                                  Color.HSVToColor(
                                          hsv
                                  );

                          if (listener != null) {

                              listener.changed(
                                      Color.red(color),
                                      Color.green(color),
                                      Color.blue(color)
                              );
                          }

                          invalidate();

                          return true;
                      }

                      return true;
                  }
              }

              // ====================================================
              // STRIP PREVIEW
              // ====================================================

              public static class StripPreview
                      extends View {

                  private Paint p =
                          new Paint(
                                  Paint.ANTI_ALIAS_FLAG
                          );

                  private int r = 255;
                  private int g = 0;
                  private int b = 0;

                  private float phase = 0;

                  private boolean playing =
                          false;

                  private String mode =
                          "WAVE";

                  private Handler h =
                          new Handler(
                                  Looper.getMainLooper()
                          );

                  private Runnable loop =
                          new Runnable() {

                              @Override
                              public void run() {

                                  if (playing) {

                                      phase += 0.08f;

                                      invalidate();

                                      h.postDelayed(
                                              this,
                                              40
                                      );
                                  }
                              }
                          };

                  public StripPreview(
                          Context c) {

                      super(c);

                      setLayerType(
                              View.LAYER_TYPE_SOFTWARE,
                              null
                      );
                  }

                  public void setColor(
                          int r,
                          int g,
                          int b) {

                      this.r = r;
                      this.g = g;
                      this.b = b;

                      invalidate();
                  }

                  public void start(
                          String mode) {

                      this.mode = mode;
                      playing = true;

                      h.removeCallbacks(
                              loop
                      );

                      h.post(
                              loop
                      );
                  }

                  @Override
                  protected void onDraw(
                          Canvas c) {

                      super.onDraw(c);

                      int w =
                              getWidth();

                      int hgt =
                              getHeight();

                      c.drawColor(
                              Color.rgb(
                                      5,
                                      7,
                                      10
                              )
                      );

                      int count = 60;

                      float cell =
                              (float)w / count;

                      for (int i = 0;
                           i < count;
                           i++) {

                          float x =
                                  i * cell +
                                  cell / 2f;

                          float wave =
                                  (float)(
                                          Math.sin(
                                                  i * .35f +
                                                  phase
                                          )
                                  );

                          float intensity =
                                  .35f +
                                  .65f *
                                  (
                                          wave + 1
                                  ) / 2f;

                          int rr =
                                  (int)(
                                          r *
                                          intensity
                                  );

                          int gg =
                                  (int)(
                                          g *
                                          intensity
                                  );

                          int bb =
                                  (int)(
                                          b *
                                          intensity
                                  );

                          p.setColor(
                                  Color.rgb(
                                          rr,
                                          gg,
                                          bb
                                  )
                          );

                          p.setShadowLayer(
                                  15,
                                  0,
                                  0,
                                  Color.rgb(
                                          rr,
                                          gg,
                                          bb
                                  )
                          );

                          c.drawCircle(
                                  x,
                                  hgt / 2f,
                                  Math.max(
                                          3,
                                          cell * .35f
                                  ),
                                  p
                          );
                      }

                      p.clearShadowLayer();

                      p.setColor(
                              Color.WHITE
                      );

                      p.setTextSize(14);

                      c.drawText(
                              mode,
                              14,
                              24,
                              p
                      );
                  }
              }

              // ====================================================
              // UTIL
              // ====================================================

              private int clamp(int x) {
                  return Math.max(
                          0,
                          Math.min(
                                  255,
                                  x
                          )
                  );
              }

              private String hex(
                      int r,
                      int g,
                      int b) {

                  return String.format(
                          Locale.US,
                          "%02X%02X%02X",
                          r,
                          g,
                          b
                  );
              }

              private void toast(
                      String s) {

                  Toast.makeText(
                          this,
                          s,
                          Toast.LENGTH_SHORT
                  ).show();
              }
          }
