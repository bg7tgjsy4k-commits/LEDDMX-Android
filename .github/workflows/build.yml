name: Build LEDDMX AI Pro ULTIMATE

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Create Android Project & Ultimate Source Code
        shell: bash
        run: |
          set -e

          rm -rf app build.gradle settings.gradle gradle.properties local.properties gradlew gradlew.bat gradle
          mkdir -p app/src/main/java/com/leddmx/pro
          mkdir -p app/src/main/res/values

          echo "sdk.dir=$ANDROID_HOME" > local.properties

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "LEDDMX-AI-Pro"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.2.0' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.leddmx.pro'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.leddmx.pro'
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "2.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">LEDDMX AI Pro Ultimate</string>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.BLUETOOTH" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" />
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
              <uses-permission android:name="android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation" />
              <uses-feature android:name="android.hardware.bluetooth_le" android:required="false" />
              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:theme="@android:style/Theme.Material.NoActionBar"
                  android:supportsRtl="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/leddmx/pro/BluetoothService.java <<'EOF'
          package com.leddmx.pro;
          import android.bluetooth.BluetoothGatt;
          import android.bluetooth.BluetoothGattCharacteristic;
          public class BluetoothService {
              private static BluetoothService instance;
              public static synchronized BluetoothService getInstance() {
                  if (instance == null) instance = new BluetoothService();
                  return instance;
              }
              public BluetoothGatt gatt;
              public BluetoothGattCharacteristic writeChar;
              public boolean isConnected = false;
              public int lastUsedMode = 171;
              public int brightness = 100;
              public int speed = 350;

              public void sendPacket(byte[] data) {
                  if (gatt == null || writeChar == null) return;
                  try {
                      writeChar.setValue(data);
                      gatt.writeCharacteristic(writeChar);
                  } catch (Exception ignored) {}
              }
          }
          EOF

          cat > app/src/main/java/com/leddmx/pro/MainActivity.java <<'EOF'
          package com.leddmx.pro;
          import android.Manifest;
          import android.app.Activity;
          import android.bluetooth.BluetoothAdapter;
          import android.bluetooth.BluetoothDevice;
          import android.bluetooth.BluetoothGatt;
          import android.bluetooth.BluetoothGattCallback;
          import android.bluetooth.BluetoothGattCharacteristic;
          import android.bluetooth.BluetoothGattService;
          import android.bluetooth.BluetoothManager;
          import android.bluetooth.le.BluetoothLeScanner;
          import android.bluetooth.le.ScanCallback;
          import android.bluetooth.le.ScanResult;
          import android.content.Context;
          import android.content.SharedPreferences;
          import android.graphics.Color;
          import android.graphics.drawable.GradientDrawable;
          import android.os.Bundle;
          import android.os.Handler;
          import android.text.Editable;
          import android.text.TextWatcher;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.GridLayout;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.SeekBar;
          import android.widget.Spinner;
          import android.widget.TextView;
          import android.widget.Toast;
          import java.util.ArrayList;
          import java.util.Locale;

          public class MainActivity extends Activity {
              private final Handler handler = new Handler();
              private BluetoothAdapter bluetoothAdapter;
              private BluetoothLeScanner scanner;
              private BluetoothGatt gatt;
              private TextView status, currentMode;
              private LinearLayout content;
              private SharedPreferences prefs;
              private int currentModeNumber = 171;
              private final ArrayList<Frame> frames = new ArrayList<>();
              private int selectedSlot = 171;
              private boolean playing = false;
              private TextView previewScreen;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  prefs = getSharedPreferences("leddmx_slots", MODE_PRIVATE);
                  BluetoothManager bm = (BluetoothManager) getSystemService(Context.BLUETOOTH_SERVICE);
                  if (bm != null) bluetoothAdapter = bm.getAdapter();
                  buildRoot();
                  showHome();
                  if (checkSelfPermission(Manifest.permission.BLUETOOTH_SCAN) != android.content.pm.PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(new String[]{Manifest.permission.BLUETOOTH_SCAN, Manifest.permission.BLUETOOTH_CONNECT}, 100);
                  }
              }

              private void buildRoot() {
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setBackgroundColor(Color.parseColor("#101114"));

                  LinearLayout top = new LinearLayout(this);
                  top.setGravity(Gravity.CENTER_VERTICAL);
                  top.setPadding(24,18,24,18);
                  TextView title = text("LEDDMX AI PRO ULTIMATE", 20);
                  title.setTextColor(Color.parseColor("#00E5FF"));
                  top.addView(title, new LinearLayout.LayoutParams(0, -2, 1));
                  Button connect = button("SCAN");
                  connect.setOnClickListener(v -> scan());
                  top.addView(connect);
                  root.addView(top);

                  status = text("DISCONNECTED", 13);
                  status.setPadding(24,0,24,10);
                  root.addView(status);

                  ScrollView scroll = new ScrollView(this);
                  content = new LinearLayout(this);
                  content.setOrientation(LinearLayout.VERTICAL);
                  content.setPadding(18,10,18,10);
                  scroll.addView(content, new LinearLayout.LayoutParams(-1, -2));
                  root.addView(scroll, new LinearLayout.LayoutParams(-1, 0, 1));

                  LinearLayout nav = new LinearLayout(this);
                  nav.setPadding(8,8,8,8);
                  String[] names = {"HOME", "MODES", "CUSTOM", "AI", "SETTINGS"};
                  for (String name : names) {
                      Button b = button(name);
                      b.setTextSize(11);
                      b.setOnClickListener(v -> {
                          if (name.equals("HOME")) showHome();
                          else if (name.equals("MODES")) showModes();
                          else if (name.equals("CUSTOM")) showCustom();
                          else if (name.equals("AI")) showAI();
                          else if (name.equals("SETTINGS")) showSettings();
                      });
                      nav.addView(b, new LinearLayout.LayoutParams(0, 60, 1));
                  }
                  root.addView(nav);
                  setContentView(root);
              }

              private void clearContent() {
                  stopPreview();
                  content.removeAllViews();
              }

              private void showHome() {
                  clearContent();
                  content.addView(text("HOME DASHBOARD", 24));
                  currentMode = text("MODE AKTIF: " + currentModeNumber, 18);
                  content.addView(currentMode);

                  Button on = button("POWER ON (RESTORE LAST MODE)");
                  on.setOnClickListener(v -> sendMode(currentModeNumber));
                  content.addView(on);

                  Button off = button("POWER OFF");
                  off.setOnClickListener(v -> sendOff());
                  content.addView(off);

                  content.addView(text("KONTROL UTAMA", 14));
                  SeekBar bright = new SeekBar(this);
                  bright.setMax(100);
                  bright.setProgress(BluetoothService.getInstance().brightness);
                  bright.setOnSeekBarChangeListener(new SeekBar.OnSeekBarChangeListener() {
                      public void onProgressChanged(SeekBar s, int p, boolean u) {
                          BluetoothService.getInstance().brightness = p;
                      }
                      public void onStartTrackingTouch(SeekBar s) {}
                      public void onStopTrackingTouch(SeekBar s) {}
                  });
                  content.addView(text("BRIGHTNESS: " + BluetoothService.getInstance().brightness + "%", 12));
                  content.addView(bright);

                  SeekBar spd = new SeekBar(this);
                  spd.setMax(900);
                  spd.setProgress(BluetoothService.getInstance().speed);
                  spd.setOnSeekBarChangeListener(new SeekBar.OnSeekBarChangeListener() {
                      public void onProgressChanged(SeekBar s, int p, boolean u) {
                          BluetoothService.getInstance().speed = p;
                      }
                      public void onStartTrackingTouch(SeekBar s) {}
                      public void onStopTrackingTouch(SeekBar s) {}
                  });
                  content.addView(text("DEFAULT SPEED: " + BluetoothService.getInstance().speed + "ms", 12));
                  content.addView(spd);

                  Button custom = button("BUKA CUSTOM STUDIO (171-210)");
                  custom.setOnClickListener(v -> showCustom());
                  content.addView(custom);

                  Button ai = button("AI ANIMATION GENERATOR");
                  ai.setOnClickListener(v -> showAI());
                  content.addView(ai);
              }

              private void showModes() {
                  clearContent();
                  content.addView(text("PRESET MODES (1 - 210)", 24));
                  
                  EditText search = edit("");
                  search.setHint("Cari Mode (contoh: 171, strobo, dll)...");
                  content.addView(search);

                  final GridLayout grid = new GridLayout(this);
                  grid.setColumnCount(4);
                  content.addView(grid, new LinearLayout.LayoutParams(-1, -2));

                  populateModeGrid(grid, "");

                  search.addTextChangedListener(new TextWatcher() {
                      public void beforeTextChanged(CharSequence s, int start, int count, int after) {}
                      public void onTextChanged(CharSequence s, int start, int before, int count) {
                          populateModeGrid(grid, s.toString().trim());
                      }
                      public void afterTextChanged(Editable s) {}
                  });
              }

              private void populateModeGrid(GridLayout grid, String query) {
                  grid.removeAllViews();
                  for (int i=1; i<=210; i++) {
                      final int mode = i;
                      String title = String.format(Locale.US, "%03d", mode);
                      if (!query.isEmpty() && !title.contains(query)) continue;

                      Button b = button(title);
                      b.setTextSize(12);
                      b.setOnClickListener(v -> sendMode(mode));
                      GridLayout.LayoutParams lp = new GridLayout.LayoutParams();
                      lp.width = 0; lp.height = 58;
                      lp.columnSpec = GridLayout.spec(GridLayout.UNDEFINED, 1f);
                      lp.setMargins(3,3,3,3);
                      grid.addView(b, lp);
                  }
              }

              private void showCustom() {
                  clearContent();
                  content.addView(text("CUSTOM & DIY STUDIO", 24));
                  content.addView(text("Pilih Slot Memori Lokal (171 - 210):", 12));

                  Spinner slot = new Spinner(this);
                  String[] slots = new String[40];
                  for (int i=0; i<40; i++) slots[i] = "CUSTOM SLOT " + (171+i);
                  android.widget.ArrayAdapter<String> adapter = new android.widget.ArrayAdapter<>(this, android.R.layout.simple_spinner_dropdown_item, slots);
                  slot.setAdapter(adapter);
                  slot.setSelection(selectedSlot - 171);
                  slot.setOnItemSelectedListener(new android.widget.AdapterView.OnItemSelectedListener() {
                      public void onItemSelected(android.widget.AdapterView<?> p, View v, int pos, long id) {
                          selectedSlot = 171 + pos;
                          loadSlot();
                      }
                      public void onNothingSelected(android.widget.AdapterView<?> p) {}
                  });
                  content.addView(slot);

                  LinearLayout editor = new LinearLayout(this);
                  editor.setOrientation(LinearLayout.VERTICAL);
                  content.addView(editor);
                  loadSlot();
                  rebuildEditor(editor);
              }

              private void rebuildEditor(final LinearLayout editor) {
                  editor.removeAllViews();

                  Button add = button("+ ADD FRAME");
                  add.setOnClickListener(v -> {
                      frames.add(new Frame(255,0,0, 0,0,255, 300));
                      rebuildEditor(editor);
                  });
                  editor.addView(add);

                  Button dup = button("📋 DUPLICATE LAST");
                  dup.setOnClickListener(v -> {
                      if (!frames.isEmpty()) {
                          Frame f = frames.get(frames.size()-1);
                          frames.add(new Frame(f.lr, f.lg, f.lb, f.rr, f.rg, f.rb, f.duration));
                          rebuildEditor(editor);
                      }
                  });
                  editor.addView(dup);

                  LinearLayout genLayout = new LinearLayout(this);
                  genLayout.setOrientation(LinearLayout.HORIZONTAL);
                  Button stripe = button("STRIPE");
                  stripe.setOnClickListener(v -> { generatePreset("stripe"); rebuildEditor(editor); });
                  Button chase = button("CHASE");
                  chase.setOnClickListener(v -> { generatePreset("chase"); rebuildEditor(editor); });
                  Button rainbow = button("RAINBOW");
                  rainbow.setOnClickListener(v -> { generatePreset("rainbow"); rebuildEditor(editor); });
                  genLayout.addView(stripe, new LinearLayout.LayoutParams(0, -2, 1));
                  genLayout.addView(chase, new LinearLayout.LayoutParams(0, -2, 1));
                  genLayout.addView(rainbow, new LinearLayout.LayoutParams(0, -2, 1));
                  editor.addView(genLayout);

                  LinearLayout genLayout2 = new LinearLayout(this);
                  genLayout2.setOrientation(LinearLayout.HORIZONTAL);
                  Button blink = button("BLINK");
                  blink.setOnClickListener(v -> { generatePreset("blink"); rebuildEditor(editor); });
                  Button fade = button("FADE");
                  fade.setOnClickListener(v -> { generatePreset("fade"); rebuildEditor(editor); });
                  Button belang = button("BELANG");
                  belang.setOnClickListener(v -> { generatePreset("belang"); rebuildEditor(editor); });
                  genLayout2.addView(blink, new LinearLayout.LayoutParams(0, -2, 1));
                  genLayout2.addView(fade, new LinearLayout.LayoutParams(0, -2, 1));
                  genLayout2.addView(belang, new LinearLayout.LayoutParams(0, -2, 1));
                  editor.addView(genLayout2);

                  for (int i=0; i<frames.size(); i++) {
                      final int index = i;
                      final Frame f = frames.get(i);
                      LinearLayout row = new LinearLayout(this);
                      row.setOrientation(LinearLayout.VERTICAL);
                      row.setPadding(0, 10, 0, 10);
                      row.addView(text("FRAME " + (i+1) + " (L:" + f.lr+","+f.lg+","+f.lb + " | R:" + f.rr+","+f.rg+","+f.rb + ")", 14));

                      Button editCol = button("🎨 COLOR WHEEL & EDIT LEFT/RIGHT");
                      editCol.setOnClickListener(v -> openColorEditor(f, editor));
                      row.addView(editCol);

                      SeekBar dur = new SeekBar(this);
                      dur.setMax(1950);
                      dur.setProgress(Math.max(50, f.duration - 50));
                      dur.setOnSeekBarChangeListener(new SeekBar.OnSeekBarChangeListener() {
                          public void onProgressChanged(SeekBar s, int p, boolean u) { f.duration = 50 + p; }
                          public void onStartTrackingTouch(SeekBar s) {}
                          public void onStopTrackingTouch(SeekBar s) {}
                      });
                      row.addView(text("Durasi: " + f.duration + " ms", 11));
                      row.addView(dur);

                      Button del = button("❌ HAPUS FRAME");
                      del.setOnClickListener(v -> {
                          frames.remove(index);
                          rebuildEditor(editor);
                      });
                      row.addView(del);
                      editor.addView(row);
                  }

                  Button clear = button("🗑 CLEAR ALL");
                  clear.setOnClickListener(v -> {
                      frames.clear();
                      rebuildEditor(editor);
                  });
                  editor.addView(clear);

                  Button preview = button("▶ PREVIEW ANIMASI");
                  preview.setOnClickListener(v -> showPreview());
                  editor.addView(preview);

                  Button save = button("💾 SIMPAN KE SLOT " + selectedSlot);
                  save.setOnClickListener(v -> saveSlot());
                  editor.addView(save);

                  Button test = button("⚡ TEST / KIRIM LIVE");
                  test.setOnClickListener(v -> testFrames());
                  editor.addView(test);
              }

              private void openColorEditor(final Frame f, final LinearLayout editor) {
                  clearContent();
                  content.addView(text("RGB COLOR WHEEL & EDITOR", 22));
                  content.addView(text("Atur warna sisi KIRI dan KANAN secara terpisah (Format: R,G,B 0-255)", 12));

                  final EditText etLeft = edit(f.lr + "," + f.lg + "," + f.lb);
                  final EditText etRight = edit(f.rr + "," + f.rg + "," + f.rb);
                  content.addView(text("KIRI RGB:", 12));
                  content.addView(etLeft);
                  content.addView(text("KANAN RGB:", 12));
                  content.addView(etRight);

                  TextView wheel = text("⭕ CIRCULAR RGB COLOR WHEEL ⭕\n[Ketuk untuk Preset Warna Cepat]", 16);
                  wheel.setGravity(Gravity.CENTER);
                  wheel.setPadding(20, 60, 20, 60);
                  GradientDrawable gd = new GradientDrawable(GradientDrawable.Orientation.TL_BR,
                          new int[]{Color.RED, Color.YELLOW, Color.GREEN, Color.CYAN, Color.BLUE, Color.MAGENTA, Color.RED});
                  gd.setCornerRadius(400);
                  wheel.setBackground(gd);
                  content.addView(wheel);

                  LinearLayout quick = new LinearLayout(this);
                  quick.setOrientation(LinearLayout.HORIZONTAL);
                  Button rBtn = button("MERAH");
                  rBtn.setOnClickListener(v -> { etLeft.setText("255,0,0"); etRight.setText("255,0,0"); });
                  Button gBtn = button("HIJAU");
                  gBtn.setOnClickListener(v -> { etLeft.setText("0,255,0"); etRight.setText("0,255,0"); });
                  Button bBtn = button("BIRU");
                  bBtn.setOnClickListener(v -> { etLeft.setText("0,0,255"); etRight.setText("0,0,255"); });
                  quick.addView(rBtn, new LinearLayout.LayoutParams(0, -2, 1));
                  quick.addView(gBtn, new LinearLayout.LayoutParams(0, -2, 1));
                  quick.addView(bBtn, new LinearLayout.LayoutParams(0, -2, 1));
                  content.addView(quick);

                  Button apply = button("APPLY & KEMBALI");
                  apply.setOnClickListener(v -> {
                      int[] l = parseRgbStr(etLeft.getText().toString());
                      int[] r = parseRgbStr(etRight.getText().toString());
                      if (l != null) { f.lr = l[0]; f.lg = l[1]; f.lb = l[2]; }
                      if (r != null) { f.rr = r[0]; f.rg = r[1]; f.rb = r[2]; }
                      showCustom();
                  });
                  content.addView(apply);
              }

              private int[] parseRgbStr(String s) {
                  try {
                      String[] p = s.split(",");
                      if (p.length == 3) {
                          return new int[]{
                                  Math.max(0, Math.min(255, Integer.parseInt(p[0].trim()))),
                                  Math.max(0, Math.min(255, Integer.parseInt(p[1].trim()))),
                                  Math.max(0, Math.min(255, Integer.parseInt(p[2].trim()))),
                          };
                      }
                  } catch (Exception ignored) {}
                  return null;
              }

              private void generatePreset(String type) {
                  frames.clear();
                  if (type.equals("stripe")) {
                      frames.add(new Frame(255,0,0, 0,0,255, 200));
                      frames.add(new Frame(0,255,0, 255,255,0, 200));
                  } else if (type.equals("chase")) {
                      frames.add(new Frame(255,0,0, 0,0,0, 150));
                      frames.add(new Frame(0,255,0, 255,0,0, 150));
                      frames.add(new Frame(0,0,255, 0,255,0, 150));
                  } else if (type.equals("rainbow")) {
                      frames.add(new Frame(255,0,0, 255,127,0, 200));
                      frames.add(new Frame(255,255,0, 0,255,0, 200));
                      frames.add(new Frame(0,0,255, 75,0,130, 200));
                  } else if (type.equals("blink")) {
                      frames.add(new Frame(255,255,255, 255,255,255, 250));
                      frames.add(new Frame(0,0,0, 0,0,0, 250));
                  } else if (type.equals("fade")) {
                      frames.add(new Frame(50,0,50, 50,0,50, 400));
                      frames.add(new Frame(255,0,255, 255,0,255, 400));
                  } else if (type.equals("belang")) {
                      frames.add(new Frame(255,0,0, 255,255,255, 180));
                      frames.add(new Frame(255,255,255, 255,0,0, 180));
                  }
              }

              private void showPreview() {
                  clearContent();
                  content.addView(text("LIVE PREVIEW ANIMASI", 24));

                  previewScreen = text("PREVIEW LAYAR", 24);
                  previewScreen.setGravity(Gravity.CENTER);
                  previewScreen.setMinimumHeight(350);
                  content.addView(previewScreen);

                  Button play = button("▶ PLAY");
                  play.setOnClickListener(v -> startPreviewLoop());
                  content.addView(play);

                  Button pause = button("⏸ PAUSE");
                  pause.setOnClickListener(v -> stopPreview());
                  content.addView(pause);

                  Button restart = button("↻ RESTART");
                  restart.setOnClickListener(v -> { stopPreview(); startPreviewLoop(); });
                  content.addView(restart);

                  Button back = button("KEMBALI KE EDITOR");
                  back.setOnClickListener(v -> showCustom());
                  content.addView(back);

                  playing = true;
                  startPreviewLoop();
              }

              private void startPreviewLoop() {
                  playing = true;
                  handler.post(new Runnable() {
                      int idx = 0;
                      public void run() {
                          if (!playing || frames.isEmpty()) return;
                          Frame f = frames.get(idx % frames.size());
                          int r = (f.lr + f.rr) / 2;
                          int g = (f.lg + f.rg) / 2;
                          int b = (f.lb + f.rb) / 2;
                          if (previewScreen != null) {
                              previewScreen.setBackgroundColor(Color.rgb(r, g, b));
                              previewScreen.setText("FRAME " + ((idx % frames.size()) + 1) + "\nL(" + f.lr+","+f.lg+","+f.lb + ")\nR(" + f.rr+","+f.rg+","+f.rb + ")");
                          }
                          idx++;
                          handler.postDelayed(this, Math.max(50, f.duration));
                      }
                  });
              }

              private void showAI() {
                  clearContent();
                  content.addView(text("AI ANIMATION GENERATOR", 24));
                  content.addView(text("Ketik perintah gaya animasi (contoh: 'merah biru cepat', 'pelangi lambat', 'strobo polisi', 'hijau lembut'):", 13));

                  final EditText prompt = edit("");
                  content.addView(prompt);

                  Button gen = button("GENERATE DENGAN AI");
                  gen.setOnClickListener(v -> {
                      String txt = prompt.getText().toString().toLowerCase(Locale.US);
                      frames.clear();
                      if (txt.contains("cepat") || txt.contains("strobo")) {
                          frames.add(new Frame(255,0,0, 255,0,0, 80));
                          frames.add(new Frame(0,0,255, 0,0,255, 80));
                      } else if (txt.contains("pelangi") || txt.contains("rainbow")) {
                          generatePreset("rainbow");
                      } else if (txt.contains("hijau")) {
                          frames.add(new Frame(0,255,0, 0,255,0, 300));
                          frames.add(new Frame(0,100,0, 0,100,0, 300));
                      } else {
                          generatePreset("stripe");
                      }
                      Toast.makeText(this, "AI Berhasil Membuat Animasi!", Toast.LENGTH_SHORT).show();
                      showCustom();
                  });
                  content.addView(gen);
              }

              private void showSettings() {
                  clearContent();
                  content.addView(text("SETTINGS & PROTOCOL", 24));
                  content.addView(text("BLE Service: FFE0\nBLE Characteristic: FFE1\nProtokol: LEDDMX Custom BLE", 13));

                  Button reconnect = button("SCAN & RECONNECT BLE");
                  reconnect.setOnClickListener(v -> scan());
                  content.addView(reconnect);

                  content.addView(text("RAW HEX PACKET SENDER (DEBUG)", 14));
                  final EditText rawHex = edit("7B FF 03 AB FF FF FF FF BF");
                  content.addView(rawHex);
                  Button sendRaw = button("KIRIM RAW HEX");
                  sendRaw.setOnClickListener(v -> {
                      String hexStr = rawHex.getText().toString().replaceAll("[^0-9A-Fa-f]", "");
                      if (hexStr.length() % 2 == 0 && hexStr.length() > 0) {
                          byte[] pkt = new byte[hexStr.length() / 2];
                          for (int i=0; i<pkt.length; i++) {
                              pkt[i] = (byte) Integer.parseInt(hexStr.substring(i*2, i*2+2), 16);
                          }
                          BluetoothService.getInstance().sendPacket(pkt);
                          Toast.makeText(this, "RAW HEX Terkirim!", Toast.LENGTH_SHORT).show();
                      } else {
                          Toast.makeText(this, "Format HEX Salah!", Toast.LENGTH_SHORT).show();
                      }
                  });
                  content.addView(sendRaw);
              }

              private void saveSlot() {
                  StringBuilder sb = new StringBuilder();
                  for (Frame f : frames) {
                      sb.append(f.lr).append(",").append(f.lg).append(",").append(f.lb).append(",");
                      sb.append(f.rr).append(",").append(f.rg).append(",").append(f.rb).append(",").append(f.duration).append(";");
                  }
                  prefs.edit().putString("slot_" + selectedSlot, sb.toString()).apply();
                  Toast.makeText(this, "Slot " + selectedSlot + " Tersimpan di HP!", Toast.LENGTH_SHORT).show();
              }

              private void loadSlot() {
                  frames.clear();
                  String s = prefs.getString("slot_" + selectedSlot, "");
                  if (s.isEmpty()) {
                      frames.add(new Frame(255,0,0, 0,0,255, 300));
                      return;
                  }
                  String[] rows = s.split(";");
                  for (String r : rows) {
                      try {
                          String[] p = r.split(",");
                          if (p.length == 7) {
                              frames.add(new Frame(Integer.parseInt(p[0]), Integer.parseInt(p[1]), Integer.parseInt(p[2]),
                                      Integer.parseInt(p[3]), Integer.parseInt(p[4]), Integer.parseInt(p[5]), Integer.parseInt(p[6])));
                          }
                      } catch (Exception ignored) {}
                  }
              }

              private void testFrames() {
                  if (frames.isEmpty()) return;
                  playing = true;
                  handler.post(new Runnable() {
                      int idx = 0;
                      public void run() {
                          if (!playing || frames.isEmpty()) return;
                          Frame f = frames.get(idx % frames.size());
                          int bright = BluetoothService.getInstance().brightness;
                          int r = ((f.lr + f.rr) / 2) * bright / 100;
                          int g = ((f.lg + f.rg) / 2) * bright / 100;
                          int b = ((f.lb + f.rb) / 2) * bright / 100;
                          sendColor(r, g, b);
                          idx++;
                          handler.postDelayed(this, Math.max(50, f.duration));
                      }
                  });
                  Toast.makeText(this, "Mengirim Animasi Live ke LED...", Toast.LENGTH_SHORT).show();
              }

              private void stopPreview() {
                  playing = false;
                  handler.removeCallbacksAndMessages(null);
              }

              private void sendMode(int mode) {
                  currentModeNumber = mode;
                  BluetoothService.getInstance().lastUsedMode = mode;
                  byte[] packet = {0x7B, (byte)0xFF, 0x03, (byte)mode, (byte)0xFF, (byte)0xFF, (byte)0xFF, (byte)0xFF, (byte)0xBF};
                  BluetoothService.getInstance().sendPacket(packet);
                  if (currentMode != null) currentMode.setText("MODE AKTIF: " + mode);
              }

              private void sendOff() {
                  stopPreview();
                  byte[] packet = {0x7B, (byte)0xFF, 0x07, 0x00, 0x00, 0x00, (byte)0xBF};
                  BluetoothService.getInstance().sendPacket(packet);
                  Toast.makeText(this, "POWER OFF", Toast.LENGTH_SHORT).show();
              }

              private void sendColor(int r, int g, int b) {
                  byte[] packet = {0x7B, (byte)0xFF, 0x07, (byte)Math.max(0,Math.min(255,r)), (byte)Math.max(0,Math.min(255,g)), (byte)Math.max(0,Math.min(255,b)), (byte)0xBF};
                  BluetoothService.getInstance().sendPacket(packet);
              }

              private void scan() {
                  if (bluetoothAdapter == null) return;
                  scanner = bluetoothAdapter.getBluetoothLeScanner();
                  if (scanner == null) return;
                  status.setText("SCANNING BLE...");
                  try {
                      scanner.startScan(scanCallback);
                      handler.postDelayed(() -> {
                          try { if (scanner != null) scanner.stopScan(scanCallback); } catch (Exception ignored) {}
                      }, 10000);
                  } catch (Exception ignored) {}
              }

              private final ScanCallback scanCallback = new ScanCallback() {
                  public void onScanResult(int type, ScanResult result) {
                      BluetoothDevice d = result.getDevice();
                      String name = null;
                      try { name = d.getName(); } catch (Exception ignored) {}
                      if (name != null && name.contains("LEDDMX")) {
                          try { scanner.stopScan(this); } catch (Exception ignored) {}
                          connect(d);
                      }
                  }
              };

              private void connect(BluetoothDevice device) {
                  status.setText("CONNECTING...");
                  try {
                      gatt = device.connectGatt(MainActivity.this, false, gattCallback);
                  } catch (Exception ignored) {}
              }

              private final BluetoothGattCallback gattCallback = new BluetoothGattCallback() {
                  public void onConnectionStateChange(final BluetoothGatt g, int statusVal, final int newState) {
                      runOnUiThread(() -> {
                          if (newState == BluetoothGatt.STATE_CONNECTED) {
                              status.setText("CONNECTED");
                              BluetoothService.getInstance().gatt = g;
                              BluetoothService.getInstance().isConnected = true;
                              g.discoverServices();
                          } else {
                              status.setText("DISCONNECTED");
                              BluetoothService.getInstance().isConnected = false;
                              BluetoothService.getInstance().gatt = null;
                              BluetoothService.getInstance().writeChar = null;
                          }
                      });
                  }
                  public void onServicesDiscovered(BluetoothGatt g, int statusVal) {
                      BluetoothGattService service = g.getService(java.util.UUID.fromString("0000FFE0-0000-1000-8000-00805F9B34FB"));
                      if (service == null) return;
                      BluetoothGattCharacteristic write = service.getCharacteristic(java.util.UUID.fromString("0000FFE1-0000-1000-8000-00805F9B34FB"));
                      if (write != null) {
                          BluetoothService.getInstance().writeChar = write;
                          runOnUiThread(() -> status.setText("CONNECTED / READY"));
                      }
                  }
              };

              private TextView text(String s, float size) {
                  TextView t = new TextView(this);
                  t.setText(s); t.setTextSize(size); t.setTextColor(Color.WHITE); t.setPadding(4,6,4,6);
                  return t;
              }

              private Button button(String s) {
                  Button b = new Button(this);
                  b.setText(s);
                  b.setTextColor(Color.WHITE);
                  b.setBackgroundColor(Color.parseColor("#191B20"));
                  return b;
              }

              private EditText edit(String s) {
                  EditText e = new EditText(this);
                  e.setText(s);
                  e.setTextColor(Color.WHITE);
                  e.setHintTextColor(Color.GRAY);
                  e.setBackgroundColor(Color.parseColor("#191B20"));
                  return e;
              }

              private static class Frame {
                  int lr, lg, lb, rr, rg, rb, duration;
                  Frame(int lr, int lg, int lb, int rr, int rg, int rb, int duration) {
                      this.lr=lr; this.lg=lg; this.lb=lb;
                      this.rr=rr; this.rg=rg; this.rb=rb;
                      this.duration = duration;
                  }
              }

              protected void onDestroy() {
                  stopPreview();
                  if (gatt != null) { try { gatt.disconnect(); gatt.close(); } catch (Exception ignored) {} }
                  super.onDestroy();
              }
          }
