                  void preview(
                      Canvas c,
                      float l,
                      float top,
                      float r,
                      float bot,
                      int m
                  ) {

                      int n = 18;

                      for (
                          int i = 0;
                          i < n;
                          i++
                      ) {

                          float x =
                              l +
                              (r - l)
                              *
                              i
                              /
                              (n - 1);

                          int cc;

                          if (
                              m % 5 == 0
                          ) {

                              cc =
                                  Color.HSVToColor(
                                      new float[] {
                                          (
                                              i * 360f / n
                                              +
                                              System.currentTimeMillis()
                                              / 8f
                                          )
                                          % 360,
                                          1,
                                          1
                                      }
                                  );

                          } else {

                              cc =
                                  (
                                      i ==
                                      (
                                          int
                                          )(
                                              (
                                                  System.currentTimeMillis()
                                                  / 120
                                              )
                                              % n
                                          )
                                  )
                                  ?
                                  color
                                  :
                                  Color.rgb(
                                      45,
                                      55,
                                      65
                                  );
                          }

                          p.setColor(cc);

                          c.drawCircle(
                              x,
                              (top + bot) / 2,
                              5,
                              p
                          );
                      }

                      postInvalidateDelayed(70);
                  }

