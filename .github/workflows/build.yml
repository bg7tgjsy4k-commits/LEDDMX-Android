        private fun drawColorWheel(
            c: Canvas,
            cx: Float,
            cy: Float,
            radius: Float
        ) {
            if (!wheelReady) return

            val src =
                Rect(
                    0,
                    0,
                    wheel.width,
                    wheel.height
                )

            val dst =
                RectF(
                    cx - radius,
                    cy - radius,
                    cx + radius,
                    cy + radius
                )

            c.drawBitmap(
                wheel,
                src,
                dst,
                p
            )

            val hsv = FloatArray(3)
            Color.colorToHSV(currentColor, hsv)

            val angle =
                Math.toRadians((hsv[0] - 90f).toDouble())

            val rr = hsv[1] * radius

            val sx =
                cx + cos(angle).toFloat() * rr

            val sy =
                cy + sin(angle).toFloat() * rr

            stroke.style = Paint.Style.STROKE
            stroke.strokeWidth = 4f
            stroke.color = Color.WHITE

            c.drawCircle(
                sx,
                sy,
                9f,
                stroke
            )

            stroke.strokeWidth = 2f
            stroke.color = Color.BLACK

            c.drawCircle(
                sx,
                sy,
                12f,
                stroke
            )
        }

        private fun updateColorFromWheel(
            x: Float,
            y: Float,
            cx: Float,
            cy: Float,
            radius: Float
        ) {
            val dx = x - cx
            val dy = y - cy

            val d =
                sqrt(dx * dx + dy * dy)

            val sat =
                (d / radius).coerceIn(0f, 1f)

            var hue =
                Math.toDegrees(
                    atan2(dy.toDouble(), dx.toDouble())
                ).toFloat() + 90f

            if (hue < 0f) hue += 360f

            currentColor =
                Color.HSVToColor(
                    floatArrayOf(
                        hue,
                        sat,
                        1f
                    )
                )

            invalidate()
        }

