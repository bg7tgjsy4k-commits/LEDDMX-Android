              private String gattDump() {

                  if (gatt == null) {

                      return
                          "DEVICE SOURCE\n" +
                          "NOT CONNECTED\n\n" +
                          "Connect ke modul lalu buka halaman ini lagi.";
                  }

                  StringBuilder x =
                      new StringBuilder();

                  x.append(
                      "DEVICE SOURCE — SERVICES READ FROM MODULE\n\n"
                  );

                  for (
                      BluetoothGattService s :
                      gatt.getServices()
                  ) {

                      x.append(
                          "SERVICE "
                      );

                      x.append(
                          s.getUuid()
                      );

                      x.append("\n");

                      for (
                          BluetoothGattCharacteristic c :
                          s.getCharacteristics()
                      ) {

                          x.append(
                              "  CHAR "
                          );

                          x.append(
                              c.getUuid()
                          );

                          x.append(
                              " props="
                          );

                          x.append(
                              c.getProperties()
                          );

                          x.append("\n");
                      }
                  }

                  return x.toString();
              }

