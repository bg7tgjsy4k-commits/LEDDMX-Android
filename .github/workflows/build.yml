                              AlertDialog.BUTTON_POSITIVE)
                              .setOnClickListener(v -> {

                          rebuild.run();
                          dialog.dismiss();
                      });
                  });

                  dialog.show();
              }

              private void addColorEditor(
                      LinearLayout parent,
                      String title,
                      Frame f,
                      boolean left) {

                  parent.addView(
                          text(title, 15));

                  ColorWheel wheel =
                          new ColorWheel(this);

                  parent.addView(
                          wheel,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  280));

                  EditText r =
                          number(
                                  left ? f.lr : f.rr);

                  EditText g =
                          number(
                                  left ? f.lg : f.rg);

                  EditText b =
                          number(
                                  left ? f.lb : f.rb);

                  LinearLayout row =
                          horizontal();

                  row.addView(
                          r,
                          new LinearLayout.LayoutParams(
                                  0, 60, 1));

                  row.addView(
                          g,
                          new LinearLayout.LayoutParams(
                                  0, 60, 1));

                  row.addView(
                          b,
                          new LinearLayout.LayoutParams(
                                  0, 60, 1));

                  parent.addView(row);

                  wheel.listener =
                          (rr, gg, bb) -> {

                              r.setText(
                                      String.valueOf(rr));

                              g.setText(
                                      String.valueOf(gg));

                              b.setText(
                                      String.valueOf(bb));

                              if (left) {
                                  f.lr = rr;
                                  f.lg = gg;
                                  f.lb = bb;
                              } else {
                                  f.rr = rr;
                                  f.rg = gg;
                                  f.rb = bb;
                              }
                          };

                  r.setOnFocusChangeListener(
                          (v, has) -> {

                      if (!has) {

                          int rr = value(r);
                          int gg = value(g);
                          int bb = value(b);

                          if (left) {
                              f.lr = rr;
                              f.lg = gg;
                              f.lb = bb;
                          } else {
                              f.rr = rr;
                              f.rg = gg;
                              f.rb = bb;
                          }
                      }
                  });
              }

              private void showPreview() {

                  if (frames.isEmpty()) {
                      frames.add(defaultFrame());
                  }

                  basePage("PREVIEW ANIMATION");

                  add(text(
                          "PREVIEW SAJA.\n" +
                          "Tidak ada packet BLE " +
                          "yang dikirim.",
                          14));

                  PreviewView pv =
                          new PreviewView(this);

                  add(
                          pv,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  320));

                  TextView info =
                          text(
                                  "FRAME 1 / " +
                                  frames.size(),
                                  16);

                  info.setGravity(
                          Gravity.CENTER);

                  add(info);

                  final boolean[] playing =
                          {false};

                  final int[] index =
                          {0};

                  final Runnable[] tick =
                          new Runnable[1];

                  tick[0] = () -> {

                      if (!playing[0] ||
                              frames.isEmpty()) {
                          return;
                      }

                      if (index[0] >=
                              frames.size()) {
                          index[0] = 0;
                      }

                      Frame f =
                              frames.get(index[0]);

                      pv.setFrame(f);

                      info.setText(
                              "FRAME " +
                              (index[0] + 1) +
                              " / " +
                              frames.size());

                      index[0]++;

                      handler.postDelayed(
                              tick[0],
                              Math.max(
                                      50,
                                      f.duration));
                  };

                  LinearLayout controls =
                          horizontal();

                  Button play =
                          button("▶ PLAY");

                  Button pause =
                          button("Ⅱ PAUSE");

                  Button restart =
                          button("↻ RESTART");

                  controls.addView(
                          play,
                          new LinearLayout.LayoutParams(
                                  0, 62, 1));

                  controls.addView(
                          pause,
                          new LinearLayout.LayoutParams(
                                  0, 62, 1));

                  controls.addView(
                          restart,
                          new LinearLayout.LayoutParams(
                                  0, 62, 1));

                  add(controls);

                  play.setOnClickListener(v -> {

                      playing[0] = true;

                      handler.removeCallbacks(
                              tick[0]);

                      handler.post(tick[0]);
                  });

                  pause.setOnClickListener(v -> {

                      playing[0] = false;

                      handler.removeCallbacks(
                              tick[0]);
                  });

                  restart.setOnClickListener(v -> {

                      index[0] = 0;

                      if (!frames.isEmpty()) {

                          pv.setFrame(
                                  frames.get(0));

                          info.setText(
                                  "FRAME 1 / " +
                                  frames.size());
                      }
                  });

                  Button edit =
                          button("← EDIT");

                  edit.setOnClickListener(v -> {

                      playing[0] = false;

                      handler.removeCallbacks(
                              tick[0]);

                      showEditor();
                  });

                  add(edit);

                  Button send =
                          button("⚡ SEND TO LED");

                  send.setOnClickListener(v -> {

                      playing[0] = false;

                      handler.removeCallbacks(
                              tick[0]);

                      playToLed();
                  });

                  add(send);

                  Button save =
                          button(
                                  "💾 SAVE SLOT " +
                                  editSlot);

                  save.setOnClickListener(v -> {

                      saveSlot(editSlot);

                      toast(
                              "Slot tersimpan di HP.");
                  });

                  add(save);

                  if (!frames.isEmpty()) {
                      pv.setFrame(frames.get(0));
                  }
              }

              private final Runnable sendRunnable =
                      new Runnable() {

                  @Override
                  public void run() {

                      if (!connected ||
                              frames.isEmpty()) {
                          return;
                      }

                      if (playIndex >=
                              frames.size()) {
                          playIndex = 0;
                      }

                      Frame f =
                              frames.get(playIndex);

                      /*
                       * Protocol yang sudah terbukti
                       * hanya menerima live RGB.
                       *
                       * LEFT/RIGHT tetap independen
                       * di editor dan preview.
                       *
                       * Untuk hardware live,
                       * warna digabungkan.
                       */

                      int r =
                              applyBrightness(
                                      (f.lr + f.rr) / 2);

                      int g =
                              applyBrightness(
                                      (f.lg + f.rg) / 2);

                      int b =
                              applyBrightness(
                                      (f.lb + f.rb) / 2);

                      sendColor(r, g, b);

                      playIndex++;

                      handler.postDelayed(
                              this,
                              Math.max(
                                      30,
                                      Math.round(
                                              f.duration *
                                              speedMs /
                                              300f)));
                  }
              };

              private void playToLed() {

                  if (!connected) {
                      toast(
                              "Hubungkan LEDDMX terlebih dahulu.");
                      return;
                  }

                  if (frames.isEmpty()) {
                      toast("Belum ada frame.");
                      return;
                  }

                  playIndex = 0;

                  handler.removeCallbacks(
                          sendRunnable);

                  handler.post(sendRunnable);
              }

              private void generateBlink() {

                  frames.clear();

                  frames.add(
                          new Frame(
                                  255, 0, 0,
                                  0, 0, 255,
                                  speedMs));

                  frames.add(
                          new Frame(
                                  0, 0, 0,
                                  0, 0, 0,
                                  speedMs));

                  frames.add(
                          new Frame(
                                  255, 255, 255,
                                  255, 255, 255,
                                  speedMs));

                  frames.add(
                          new Frame(
                                  0, 0, 0,
                                  0, 0, 0,
                                  speedMs));
              }

              private void generateFade() {

                  frames.clear();

                  for (int i = 0;
                       i < 16;
                       i++) {

                      float t =
                              i / 15f;

                      int r =
                              Math.round(
                                      255 * t);

                      int b =
                              Math.round(
                                      255 * (1f - t));

                      frames.add(
                              new Frame(
                                      r, 0, b,
                                      b, 0, r,
                                      speedMs));
                  }
              }

              private void generateBelang() {

                  frames.clear();

                  for (int i = 0;
                       i < 12;
                       i++) {

                      if ((i & 1) == 0) {

                          frames.add(
                                  new Frame(
                                          255, 0, 0,
                                          0, 0, 255,
                                          speedMs));

                      } else {

                          frames.add(
                                  new Frame(
                                          0, 0, 255,
                                          255, 0, 0,
                                          speedMs));
                      }
                  }
              }

              private void generateStripe() {

                  frames.clear();

                  for (int i = 0;
                       i < 12;
                       i++) {

                      if ((i & 1) == 0) {

                          frames.add(
                                  new Frame(
                                          255, 0, 0,
                                          0, 0, 255,
                                          speedMs));

                      } else {

                          frames.add(
                                  new Frame(
                                          255, 255, 255,
                                          255, 255, 255,
                                          speedMs));
                      }
                  }
              }

              private void generateChase() {

                  frames.clear();

                  int[][] c = {
                          {255,0,0},
                          {0,255,0},
                          {0,0,255},
                          {255,255,0},
                          {0,255,255},
                          {255,0,255}
                  };

                  for (int i = 0;
                       i < 18;
                       i++) {

                      int[] a =
                              c[i % c.length];

                      int[] b =
                              c[(i + 1) %
                                c.length];

                      frames.add(
                              new Frame(
                                      a[0], a[1], a[2],
                                      b[0], b[1], b[2],
                                      speedMs));
                  }
              }

              private void generateRainbow() {

                  frames.clear();

                  for (int i = 0;
                       i < 24;
                       i++) {

                      float h =
                              i * 15f;

                      int c =
                              Color.HSVToColor(
                                      new float[]{
                                              h,
                                              1f,
                                              1f
                                      });

                      int d =
                              Color.HSVToColor(
                                      new float[]{
                                              (h + 180) %
                                              360,
                                              1f,
                                              1f
                                      });

                      frames.add(
                              new Frame(
                                      Color.red(c),
                                      Color.green(c),
                                      Color.blue(c),
                                      Color.red(d),
                                      Color.green(d),
                                      Color.blue(d),
                                      speedMs));
                  }
              }

