              fun requestPermissionsIfNeeded() {
                  val list=mutableListOf<String>()

                  if(Build.VERSION.SDK_INT>=31) {
                      if(
                          ContextCompat.checkSelfPermission(
                              this,
                              Manifest.permission.BLUETOOTH_SCAN
                          ) != PackageManager.PERMISSION_GRANTED
                      ) list.add(Manifest.permission.BLUETOOTH_SCAN)

                      if(
                          ContextCompat.checkSelfPermission(
                              this,
                              Manifest.permission.BLUETOOTH_CONNECT
                          ) != PackageManager.PERMISSION_GRANTED
                      ) list.add(Manifest.permission.BLUETOOTH_CONNECT)
                  } else {
                      if(
                          ContextCompat.checkSelfPermission(
                              this,
                              Manifest.permission.ACCESS_FINE_LOCATION
                          ) != PackageManager.PERMISSION_GRANTED
                      ) list.add(Manifest.permission.ACCESS_FINE_LOCATION)
                  }

                  if(list.isNotEmpty()) {
                      ActivityCompat.requestPermissions(
                          this,
                          list.toTypedArray(),
                          REQ
                      )
                  }
              }

              fun startScan(showDialog:Boolean=false) {
                  val now=System.currentTimeMillis()

                  if(now-lastScan<2300) {
                      toast("Please wait before scanning again")
                      return
                  }

                  lastScan=now

                  val adapter=
                      (getSystemService(BLUETOOTH_SERVICE)
                          as BluetoothManager).adapter

                  if(adapter==null || !adapter.isEnabled) {
                      toast("Turn Bluetooth ON first")
                      try {
                          startActivity(
                              Intent(Settings.ACTION_BLUETOOTH_SETTINGS)
                          )
                      } catch(_:Exception){}
                      return
                  }

                  if(Build.VERSION.SDK_INT>=31 &&
                      ContextCompat.checkSelfPermission(
                          this,
                          Manifest.permission.BLUETOOTH_SCAN
                      )!=PackageManager.PERMISSION_GRANTED) {
                      requestPermissionsIfNeeded()
                      return
                  }

                  if(Build.VERSION.SDK_INT<31 &&
                      ContextCompat.checkSelfPermission(
                          this,
                          Manifest.permission.ACCESS_FINE_LOCATION
                      )!=PackageManager.PERMISSION_GRANTED) {
                      requestPermissionsIfNeeded()
                      return
                  }

                  scanner=adapter.bluetoothLeScanner

                  deviceList.clear()
                  scanning=true

                  toast("Scanning Bluetooth...")

                  try {
                      scanner?.startScan(scanCallback)
                  } catch(e:Exception) {
                      scanning=false
                      toast("Scan error: ${e.message}")
                      return
                  }

                  Handler(Looper.getMainLooper()).postDelayed({
                      stopScan()

                      if(deviceList.isEmpty()) {
                          toast(
                              "No BLE device found. Make sure LEDDMX is ON."
                          )
                      } else if(showDialog) {
                          showDevices()
                      }
                  },8000)
              }

              fun stopScan() {
                  if(!scanning)return

                  try {
                      scanner?.stopScan(scanCallback)
                  } catch(_:Exception){}

                  scanning=false
              }

              val scanCallback=object:ScanCallback() {

                  override fun onScanResult(
                      callbackType:Int,
                      result:ScanResult
                  ) {
                      val dev=result.device

                      var name=""

                      try {
                          name=dev.name ?: ""
                      } catch(_:Exception){}

                      if(name.isBlank()) {
                          try {
                              name=result.scanRecord
                                  ?.deviceName ?: ""
                          } catch(_:Exception){}
                      }

                      val useful =
                          name.contains("LEDDMX",true) ||
                          name.contains("LED",true) ||
                          name.contains("DMX",true) ||
                          name.isNotBlank()

                      if(useful &&
                          deviceList.none{
                              it.address==dev.address
                          }) {
                          deviceList.add(dev)

                          runOnUiThread {
                              status.text=
                                  "FOUND ${deviceList.size}"
                          }
                      }
                  }

                  override fun onScanFailed(errorCode:Int) {
                      runOnUiThread {
                          val message=when(errorCode) {
                              1->"ALREADY_STARTED"
                              2->"APPLICATION_REGISTRATION_FAILED"
                              3->"INTERNAL_ERROR"
                              4->"FEATURE_UNSUPPORTED"
                              5->"OUT_OF_HARDWARE_RESOURCES"
                              6->"SCANNING_TOO_FREQUENTLY"
                              else->"SCAN ERROR $errorCode"
                          }

                          toast(message)
                          scanning=false
                      }
                  }
              }

              fun connect(device:BluetoothDevice) {
                  try {
                      status.text="CONNECTING..."

                      gatt?.close()
                      gatt=null
                      writeChar=null

                      gatt=device.connectGatt(
                          this,
                          false,
                          gattCallback,
                          BluetoothDevice.TRANSPORT_LE
                      )
                  } catch(e:Exception) {
                      status.text="CONNECT ERROR"
                      toast(e.message ?: "Connection failed")
                  }
              }

              val gattCallback=object:BluetoothGattCallback() {

                  override fun onConnectionStateChange(
                      g:BluetoothGatt,
                      statusCode:Int,
                      newState:Int
                  ) {
                      runOnUiThread {
                          if(newState==BluetoothProfile.STATE_CONNECTED) {
                              gatt=g
                              connectedName=try {
                                  g.device.name ?: g.device.address
                              } catch(e:Exception) {
                                  g.device.address
                              }

                              status.text="CONNECTED"

                              try {
                                  g.discoverServices()
                              } catch(_:Exception){}
                          } else {
                              connectedName="DISCONNECTED"
                              writeChar=null
                              status.text="DISCONNECTED"
                          }
                      }
                  }

                  override fun onServicesDiscovered(
                      g:BluetoothGatt,
                      statusCode:Int
                  ) {
                      val service=g.getService(SERVICE)

                      writeChar=service?.getCharacteristic(WRITE)

                      runOnUiThread {
                          if(writeChar!=null) {
                              status.text="READY"
                              toast("LEDDMX module READY")
                          } else {
                              status.text="CONNECTED"
                              toast(
                                  "FFE1 not exposed by device"
                              )
                          }
                      }
                  }

                  override fun onCharacteristicChanged(
                      g:BluetoothGatt,
                      characteristic:BluetoothGattCharacteristic
                  ) {
                      val bytes=characteristic.value ?: return

                      val h=bytes.joinToString(" ") {
                          "%02X".format(it.toInt() and 255)
                      }

                      rxLog.add(
                          "${System.currentTimeMillis()}  MODULE RX  $h"
                      )

                      if(rxLog.size>500)rxLog.removeAt(0)
                  }

                  override fun onCharacteristicRead(
                      g:BluetoothGatt,
                      characteristic:BluetoothGattCharacteristic,
                      value:ByteArray,
                      statusCode:Int
                  ) {
                      val h=value.joinToString(" ") {
                          "%02X".format(it.toInt() and 255)
                      }

                      rxLog.add(
                          "${System.currentTimeMillis()}  MODULE READ  $h"
                      )
                  }
              }

              fun send(bytes:ByteArray) {
                  val c=writeChar

                  if(c==null) {
                      toast("Not connected / FFE1 unavailable")
                      return
                  }

                  val h=bytes.joinToString(" ") {
                      "%02X".format(it.toInt() and 255)
                  }

                  txLog.add(
                      "${System.currentTimeMillis()}  APP TX  $h"
                  )

                  if(txLog.size>500)txLog.removeAt(0)

                  try {
                      c.writeType=
                          BluetoothGattCharacteristic.WRITE_TYPE_NO_RESPONSE

                      c.value=bytes

                      gatt?.writeCharacteristic(c)
                  } catch(e:Exception) {
                      toast("TX error")
                  }

                  Handler(Looper.getMainLooper()).postDelayed({},55)
              }

              fun sendRGB() {
