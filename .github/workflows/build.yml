          cat > app/src/main/java/com/leddmx/finalapp/BluetoothService.java <<'EOF'
          package com.leddmx.finalapp;

          import android.bluetooth.BluetoothGatt;
          import android.bluetooth.BluetoothGattCharacteristic;

          import java.util.UUID;

          public class BluetoothService {

              private static BluetoothService instance;

              public static final UUID SERVICE_FFE0 =
                      UUID.fromString("0000FFE0-0000-1000-8000-00805F9B34FB");

              public static final UUID CHAR_FFE1 =
                      UUID.fromString("0000FFE1-0000-1000-8000-00805F9B34FB");

              public static final UUID CHAR_FFF4 =
                      UUID.fromString("0000FFF4-0000-1000-8000-00805F9B34FB");

              public BluetoothGatt gatt;
              public BluetoothGattCharacteristic writeChar;
              public boolean isConnected = false;
              public int lastUsedMode = 171;

              private BluetoothService() {}

              public static synchronized BluetoothService getInstance() {
                  if (instance == null) {
                      instance = new BluetoothService();
                  }
                  return instance;
              }

              public boolean isReady() {
                  return gatt != null &&
                         writeChar != null &&
                         isConnected;
              }

              public void sendPacket(byte[] data) {
                  if (!isReady()) return;

                  try {
                      writeChar.setWriteType(
                              BluetoothGattCharacteristic.WRITE_TYPE_NO_RESPONSE
                      );

                      writeChar.setValue(data);
                      gatt.writeCharacteristic(writeChar);

                  } catch (SecurityException ignored) {
                  } catch (Exception ignored) {
                  }
              }

              public void disconnect() {
                  try {
                      if (gatt != null) {
                          gatt.disconnect();
                          gatt.close();
                      }
                  } catch (Exception ignored) {
                  }

                  gatt = null;
                  writeChar = null;
                  isConnected = false;
              }
          }
          EOF

          cat > app/src/main/java/com/leddmx/finalapp/MainActivity.java <<'EOF'
          package com.leddmx.finalapp;

          import android.Manifest;
          import android.app.Activity;
          import android.bluetooth.BluetoothAdapter;
          import android.bluetooth.BluetoothDevice;
          import android.bluetooth.BluetoothGatt;
          import android.bluetooth.BluetoothGattCallback;
          import android.bluetooth.BluetoothGattCharacteristic;
          import android.bluetooth.BluetoothGattService;
          import android.bluetooth.BluetoothManager;
          import android.bluetooth.le.BluetoothLeScanner;
          import android.bluetooth.le.ScanCallback;
          import android.bluetooth.le.ScanResult;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.view.View;
          import android.widget.Button;
          import android.widget.GridLayout;
          import android.widget.SeekBar;
          import android.widget.TextView;
          import android.widget.Toast;

          import java.util.UUID;

          public class MainActivity extends Activity {

              private BluetoothAdapter adapter;
              private BluetoothLeScanner scanner;
              private BluetoothGatt gatt;

              private final Handler handler = new Handler();

              private TextView status;
              private TextView currentMode;
              private GridLayout modeGrid;
              private Button powerButton;

              private boolean powerOn = false;
              private int lastMode = 171;

              private final BluetoothService service =
                      BluetoothService.getInstance();

              private static final UUID FFE0 =
                      BluetoothService.SERVICE_FFE0;

              private static final UUID FFE1 =
                      BluetoothService.CHAR_FFE1;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  setContentView(R.layout.activity_main);

                  status = findViewById(R.id.status);
                  currentMode = findViewById(R.id.currentMode);
                  modeGrid = findViewById(R.id.modeGrid);
                  powerButton = findViewById(R.id.btnPower);

                  setupBluetooth();
                  createModes();

                  findViewById(R.id.btnConnection)
                          .setOnClickListener(v -> startScan());

                  powerButton.setOnClickListener(v -> togglePower());

                  findViewById(R.id.btnCustom)
                          .setOnClickListener(v -> openEditor());

                  findViewById(R.id.navCustom)
                          .setOnClickListener(v -> openEditor());

                  findViewById(R.id.navModes)
                          .setOnClickListener(v -> {
                              modeGrid.setVisibility(View.VISIBLE);
                              Toast.makeText(
                                      this,
                                      "Modes 1-210",
                                      Toast.LENGTH_SHORT
                              ).show();
                          });

                  findViewById(R.id.navHome)
                          .setOnClickListener(v ->
                                  Toast.makeText(
                                          this,
                                          "HOME",
                                          Toast.LENGTH_SHORT
                                  ).show());

                  findViewById(R.id.navSettings)
                          .setOnClickListener(v ->
                                  Toast.makeText(
                                          this,
                                          "SETTINGS",
                                          Toast.LENGTH_SHORT
                                  ).show());

                  SeekBar brightness =
                          findViewById(R.id.brightness);

                  brightness.setOnSeekBarChangeListener(
                          new SeekBar.OnSeekBarChangeListener() {
                              @Override
                              public void onProgressChanged(
                                      SeekBar bar,
                                      int value,
                                      boolean fromUser) {
                                  if (fromUser) {
                                      sendBrightness(value);
                                  }
                              }

                              @Override public void onStartTrackingTouch(
                                      SeekBar bar) {}

                              @Override public void onStopTrackingTouch(
                                      SeekBar bar) {}
                          });

                  SeekBar speed =
                          findViewById(R.id.speed);

                  speed.setOnSeekBarChangeListener(
                          new SeekBar.OnSeekBarChangeListener() {
                              @Override
                              public void onProgressChanged(
                                      SeekBar bar,
                                      int value,
                                      boolean fromUser) {
                                  if (fromUser) {
                                      sendSpeed(value);
                                  }
                              }

                              @Override public void onStartTrackingTouch(
                                      SeekBar bar) {}

                              @Override public void onStopTrackingTouch(
                                      SeekBar bar) {}
                          });

                  requestPermissionsIfNeeded();
              }

              private void setupBluetooth() {

                  BluetoothManager manager =
                          (BluetoothManager)
                                  getSystemService(Context.BLUETOOTH_SERVICE);

                  adapter = manager.getAdapter();

                  if (adapter == null) {
                      status.setText("Bluetooth tidak tersedia");
                      return;
                  }

                  scanner = adapter.getBluetoothLeScanner();
              }

              private void requestPermissionsIfNeeded() {

                  if (Build.VERSION.SDK_INT >= 31) {

                      if (checkSelfPermission(
                              Manifest.permission.BLUETOOTH_SCAN)
                              != PackageManager.PERMISSION_GRANTED ||
                          checkSelfPermission(
                              Manifest.permission.BLUETOOTH_CONNECT)
                              != PackageManager.PERMISSION_GRANTED) {

                          requestPermissions(
                                  new String[]{
                                          Manifest.permission.BLUETOOTH_SCAN,
                                          Manifest.permission.BLUETOOTH_CONNECT
                                  },
                                  100
                          );
                      }

                  } else if (Build.VERSION.SDK_INT >= 23) {

                      if (checkSelfPermission(
                              Manifest.permission.ACCESS_FINE_LOCATION)
                              != PackageManager.PERMISSION_GRANTED) {

                          requestPermissions(
                                  new String[]{
                                          Manifest.permission.ACCESS_FINE_LOCATION
                                  },
                                  101
                          );
                      }
                  }
              }

              private void startScan() {

                  if (scanner == null) {
                      Toast.makeText(
                              this,
                              "Bluetooth tidak siap",
                              Toast.LENGTH_SHORT
                      ).show();
                      return;
                  }

                  status.setText("Scanning LEDDMX...");

                  try {
                      scanner.startScan(scanCallback);

                      handler.postDelayed(() -> {
                          try {
                              scanner.stopScan(scanCallback);
                          } catch (Exception ignored) {}

                          if (!service.isConnected) {
                              status.setText("LEDDMX tidak ditemukan");
                          }

                      }, 10000);

                  } catch (SecurityException e) {
                      status.setText("Permission Bluetooth ditolak");
                  }
              }

              private final ScanCallback scanCallback =
                      new ScanCallback() {

                          @Override
                          public void onScanResult(
                                  int callbackType,
                                  ScanResult result) {

                              BluetoothDevice device =
                                      result.getDevice();

                              String name = null;

                              try {
                                  name = device.getName();
                              } catch (SecurityException ignored) {}

                              if (name == null) return;

                              if (name.toUpperCase()
                                      .contains("LEDDMX")) {

                                  try {
                                      scanner.stopScan(this);
                                  } catch (Exception ignored) {}

                                  connect(device);
                              }
                          }
                      };

              private void connect(BluetoothDevice device) {

                  status.setText(
                          "Connecting " + safeName(device) + "..."
                  );

                  try {

                      gatt = device.connectGatt(
                              this,
                              false,
                              gattCallback,
                              BluetoothDevice.TRANSPORT_LE
                      );

                  } catch (SecurityException e) {
                      status.setText("Bluetooth permission error");
                  }
              }

              private String safeName(BluetoothDevice d) {

                  try {
                      String n = d.getName();
                      return n == null ? "LEDDMX" : n;
                  } catch (Exception e) {
                      return "LEDDMX";
                  }
              }

              private final BluetoothGattCallback gattCallback =
                      new BluetoothGattCallback() {

                          @Override
                          public void onConnectionStateChange(
                                  BluetoothGatt g,
                                  int statusCode,
                                  int newState) {

                              runOnUiThread(() -> {

                                  if (newState ==
                                          android.bluetooth.BluetoothProfile
                                                  .STATE_CONNECTED) {

                                      gatt = g;
                                      service.gatt = g;
                                      service.isConnected = true;

                                      status.setText("Connected");

                                      try {
                                          g.discoverServices();
                                      } catch (SecurityException ignored) {}

                                  } else {

                                      service.isConnected = false;
                                      service.gatt = null;
                                      service.writeChar = null;

                                      status.setText("Disconnected");
                                  }

                              });
                          }

                          @Override
                          public void onServicesDiscovered(
                                  BluetoothGatt g,
                                  int statusCode) {

                              BluetoothGattService s =
                                      g.getService(FFE0);

                              if (s == null) {
                                  runOnUiThread(() ->
                                          status.setText(
                                                  "FFE0 service tidak ditemukan"
                                          ));
                                  return;
                              }

                              BluetoothGattCharacteristic c =
                                      s.getCharacteristic(FFE1);

                              if (c == null) {
                                  runOnUiThread(() ->
                                          status.setText(
                                                  "FFE1 write tidak ditemukan"
                                          ));
                                  return;
                              }

                              service.gatt = g;
                              service.writeChar = c;
                              service.isConnected = true;

                              runOnUiThread(() ->
                                      status.setText(
                                              "LEDDMX READY"
                                      ));
                          }
                      };

              private void createModes() {

                  modeGrid.removeAllViews();

                  for (int i = 1; i <= 210; i++) {

                      final int mode = i;

                      Button b = new Button(this);

                      b.setText(String.valueOf(mode));
                      b.setTextSize(12);

                      GridLayout.LayoutParams lp =
                              new GridLayout.LayoutParams();

                      lp.width = 0;
                      lp.height = 55;
                      lp.columnSpec =
                              GridLayout.spec(
                                      GridLayout.UNDEFINED,
                                      1f
                              );

                      lp.setMargins(2, 2, 2, 2);

                      b.setLayoutParams(lp);

                      if (mode >= 171) {
                          b.setText(
                                  mode + "\nCUSTOM"
                          );
                      }

                      b.setOnClickListener(v ->
                              selectMode(mode));

                      modeGrid.addView(b);
                  }
              }

              private void selectMode(int mode) {

                  lastMode = mode;
                  service.lastUsedMode = mode;

                  currentMode.setText(
                          "MODE: " + mode
                  );

                  sendMode(mode);

                  powerOn = true;
                  powerButton.setText("POWER ON");
              }

              private void sendMode(int mode) {

                  byte[] packet = new byte[]{
                          0x7B,
                          (byte) 0xFF,
                          0x03,
                          (byte) mode,
                          (byte) 0xFF,
                          (byte) 0xFF,
                          (byte) 0xFF,
                          (byte) 0xFF,
                          (byte) 0xBF
                  };

                  service.sendPacket(packet);
              }

              private void togglePower() {

                  if (powerOn) {

                      byte[] off = new byte[]{
                              0x7B,
                              (byte) 0xFF,
                              0x07,
                              0x00,
                              0x00,
                              0x00,
                              (byte) 0xBF
                      };

                      service.sendPacket(off);

                      powerOn = false;
                      powerButton.setText("POWER OFF");

                  } else {

                      sendMode(lastMode);

                      powerOn = true;
                      powerButton.setText("POWER ON");
                  }
              }

              private void sendBrightness(int value) {

                  value = Math.max(0, Math.min(255, value));

                  /*
                   * Tidak mengarang command baru.
                   * Untuk sementara hanya mengirim command yang
                   * sudah terlihat di capture ketika nilai brightness
                   * memang dipetakan ke protocol.
                   */

                  byte[] packet = new byte[]{
                          0x7B,
                          (byte) 0xFF,
                          0x02,
                          (byte) value,
                          0x03,
                          (byte) lastMode,
                          (byte) 0xFF,
                          (byte) 0xFF,
                          (byte) 0xBF
                  };

                  service.sendPacket(packet);
              }

              private void sendSpeed(int value) {

                  /*
                   * Range UI 0-800.
                   * Mapping dasar agar tidak membuat nilai di luar
                   * byte protocol.
                   */

                  int protocolValue =
                          Math.max(
                                  0,
                                  Math.min(
                                          255,
                                          value / 4
                                  )
                          );

                  byte[] packet = new byte[]{
                          0x7B,
                          (byte) 0xFF,
                          0x02,
                          (byte) protocolValue,
                          0x03,
                          (byte) lastMode,
                          (byte) 0xFF,
                          (byte) 0xFF,
                          (byte) 0xBF
                  };

                  service.sendPacket(packet);
              }

              private void openEditor() {

                  Intent intent =
                          new Intent(
                                  this,
                                  EditorActivity.class
                          );

                  startActivity(intent);
              }
          }
          EOF

          cat > app/src/main/java/com/leddmx/finalapp/EditorActivity.java <<'EOF'
          package com.leddmx.finalapp;

          import android.app.Activity;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.os.Handler;
          import android.widget.ArrayAdapter;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.Spinner;
          import android.widget.TextView;
          import android.widget.Toast;

          import java.util.ArrayList;
          import java.util.List;

          public class EditorActivity extends Activity {

              private final BluetoothService service =
                      BluetoothService.getInstance();

              private final List<Integer> colors =
                      new ArrayList<>();

              private Spinner slotSpinner;
              private Spinner patternSpinner;
              private TextView frameText;
              private TextView status;

              private int speed = 150;

              private final Handler handler = new Handler();
              private boolean playing = false;
              private int playIndex = 0;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  setContentView(
                          R.layout.activity_editor
                  );

                  slotSpinner =
                          findViewById(R.id.slotSpinner);

                  patternSpinner =
                          findViewById(R.id.patternSpinner);

                  frameText =
                          findViewById(R.id.frameText);

                  status =
                          findViewById(R.id.editorStatus);

                  setupSlots();
                  setupPatterns();
                  setupColors();

                  findViewById(R.id.btnReset)
                          .setOnClickListener(
                                  v -> resetFrames()
                          );

                  findViewById(R.id.btnPreview)
                          .setOnClickListener(
                                  v -> togglePreview()
                          );

                  findViewById(R.id.btnTest)
                          .setOnClickListener(
                                  v -> testLED()
                          );

                  findViewById(R.id.btnSaveLocal)
                          .setOnClickListener(
                                  v -> saveLocal()
                          );
              }

              private void setupSlots() {

                  String[] slots = new String[40];

                  for (int i = 0; i < 40; i++) {
                      slots[i] = "CUSTOM SLOT " + (171 + i);
                  }

                  ArrayAdapter<String> adapter =
                          new ArrayAdapter<>(
                                  this,
                                  android.R.layout.simple_spinner_item,
                                  slots
                          );

                  adapter.setDropDownViewResource(
                          android.R.layout.simple_spinner_dropdown_item
                  );

                  slotSpinner.setAdapter(adapter);
              }

              private void setupPatterns() {

                  String[] patterns = {
                          "SOLID",
                          "BLINK",
                          "CHASE",
                          "STRIPE / BELANG"
                  };

                  ArrayAdapter<String> adapter =
                          new ArrayAdapter<>(
                                  this,
                                  android.R.layout.simple_spinner_item,
                                  patterns
                          );

                  adapter.setDropDownViewResource(
                          android.R.layout.simple_spinner_dropdown_item
                  );

                  patternSpinner.setAdapter(adapter);
              }

              private void setupColors() {

                  LinearLayout container =
                          findViewById(
                                  R.id.colorButtons
                          );

                  int[] palette = {
                          Color.RED,
                          Color.GREEN,
                          Color.BLUE,
                          Color.YELLOW,
                          Color.CYAN,
                          Color.MAGENTA,
                          Color.WHITE
                  };

                  for (int color : palette) {

                      Button b =
                              new Button(this);

                      b.setText("●");
                      b.setTextColor(color);

                      b.setOnClickListener(
                              v -> addColor(color)
                      );

                      container.addView(b);
                  }
              }

              private void addColor(int color) {

                  colors.add(color);

                  frameText.setText(
                          "Frames: " + colors.size()
                  );
              }

              private void resetFrames() {

                  stopPreview();

                  colors.clear();

                  frameText.setText(
                          "Frames: 0"
                  );
              }

              private void togglePreview() {

                  if (playing) {
                      stopPreview();
                      return;
                  }

                  if (colors.isEmpty()) {
                      Toast.makeText(
                              this,
                              "Tambahkan warna dulu",
                              Toast.LENGTH_SHORT
                      ).show();
                      return;
                  }

                  playing = true;

                  findViewById(R.id.btnPreview)
                          .setEnabled(false);

                  playIndex = 0;

                  playNext();
              }

              private void playNext() {

                  if (!playing || colors.isEmpty()) {
                      return;
                  }

                  int color =
                          colors.get(
                                  playIndex %
                                  colors.size()
                          );

                  sendColor(color);

                  playIndex++;

                  handler.postDelayed(
                          this::playNext,
                          speed
                  );
              }

              private void stopPreview() {

                  playing = false;

                  handler.removeCallbacksAndMessages(
                          null
                  );

                  Button b =
                          findViewById(
                                  R.id.btnPreview
                          );

                  b.setEnabled(true);
              }

              private void testLED() {

                  if (colors.isEmpty()) {
                      Toast.makeText(
                              this,
                              "Belum ada frame",
                              Toast.LENGTH_SHORT
                      ).show();
                      return;
                  }

                  sendColor(colors.get(0));

                  Toast.makeText(
                          this,
                          "Frame dikirim ke LED",
                          Toast.LENGTH_SHORT
                  ).show();
              }

              private void sendColor(int color) {

                  int r = Color.red(color);
                  int g = Color.green(color);
                  int b = Color.blue(color);

                  byte[] packet = new byte[]{
                          0x7B,
                          (byte) 0xFF,
                          0x07,
                          (byte) r,
                          (byte) g,
                          (byte) b,
                          (byte) 0xBF
                  };

                  service.sendPacket(packet);
              }

              private void saveLocal() {

                  int slot =
                          171 +
                          slotSpinner.getSelectedItemPosition();

                  status.setText(
                          "SAVED LOCAL: SLOT " + slot
                  );

                  Toast.makeText(
                          this,
                          "Custom disimpan di aplikasi",
                          Toast.LENGTH_SHORT
                  ).show();
              }

              @Override
              protected void onDestroy() {

                  stopPreview();

                  super.onDestroy();
              }
          }
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Generate Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.10.2 --distribution-type bin

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew clean assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LEDDMX-AI-Pro-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
