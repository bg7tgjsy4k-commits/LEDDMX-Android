        run: gradle --no-daemon clean assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LEDDMX-AI-Pro-Master
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
