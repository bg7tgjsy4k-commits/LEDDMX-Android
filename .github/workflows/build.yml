              private void populateModes(
                      LinearLayout grid,
                      String query
              ) {

                  grid.removeAllViews();

                  LinearLayout row = null;

                  for (int i = 1; i <= 210; i++) {

                      final int mode = i;

                      String title =
                              String.format(
                                      Locale.US,
                                      "Mode %03d",
                                      mode
                              );

                      if (!query.trim().isEmpty()
                              &&
                              !title.toLowerCase(
                                      Locale.US
                              ).contains(
                                      query.toLowerCase(
                                              Locale.US
                                      )
                              )) {
                          continue;
                      }

                      if (row == null
                              || row.getChildCount() == 3) {

                          row =
                                  new LinearLayout(
                                          this
                                  );

                          row.setOrientation(
                                  LinearLayout.HORIZONTAL
                          );

                          grid.addView(row);
                      }

                      Button b =
                              createButton(
                                      String.valueOf(mode),
                                      mode == currentMode
                                      ? Color.rgb(
                                              0,
                                              150,
                                              180
