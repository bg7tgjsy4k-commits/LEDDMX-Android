        private fun drawLedStrip(
            c: Canvas,
            x: Float,
            y: Float,
            w: Float,
            h: Float
        ) {
            rect(
                c,
                x,
                y,
                x + w,
                y + h,
                Color.rgb(4, 5, 7)
            )

            val count = 32

            for (i in 0 until count) {
                val phase =
                    (previewPhase * 1.4f + i.toFloat() / count) % 1f

                val hue =
                    ((phase * 360f) + customColors.size * 20f) % 360f

                val color =
                    Color.HSVToColor(
                        floatArrayOf(
                            hue,
                            0.95f,
                            1f
                        )
                    )

                val xx =
                    x + i * (w / count) + 4f

                circle(
                    c,
                    xx,
                    y + h / 2f,
                    6f,
                    color
                )
            }

            text(
                c,
                "LIVE PREVIEW",
                x + 12f,
                y + 22f,
                9f,
                Color.WHITE
            )
        }

