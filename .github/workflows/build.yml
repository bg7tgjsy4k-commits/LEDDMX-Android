name: Build LEDDMX Pro v36

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android Project
        shell: bash
        run: |
          set -e

          rm -rf app build.gradle settings.gradle gradle.properties local.properties
          rm -rf gradle gradlew gradlew.bat

          mkdir -p app/src/main/java/com/leddmx/pro
          mkdir -p app/src/main/res/values

          echo "sdk.dir=$ANDROID_HOME" > local.properties

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "LEDDMX-Pro"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.leddmx.pro'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.leddmx.pro'
                  minSdk 21
                  targetSdk 35
                  versionCode 36
                  versionName '36.0'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">LEDDMX Pro Controller</string>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.BLUETOOTH" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" />

              <uses-permission
                  android:name="android.permission.BLUETOOTH_SCAN"
                  android:usesPermissionFlags="0" />

              <uses-permission
                  android:name="android.permission.BLUETOOTH_CONNECT" />

              <uses-permission
                  android:name="android.permission.ACCESS_FINE_LOCATION" />

              <uses-feature
                  android:name="android.hardware.bluetooth_le"
                  android:required="false" />

              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

      - name: Write MainActivity
        shell: bash
        run: |
          cat > app/src/main/java/com/leddmx/pro/MainActivity.java <<'EOF'
          package com.leddmx.pro;

          import android.Manifest;
          import android.app.Activity;
          import android.bluetooth.BluetoothAdapter;
          import android.bluetooth.BluetoothDevice;
          import android.bluetooth.BluetoothGatt;
          import android.bluetooth.BluetoothGattCallback;
          import android.bluetooth.BluetoothGattCharacteristic;
          import android.bluetooth.BluetoothGattService;
          import android.bluetooth.BluetoothManager;
          import android.bluetooth.le.BluetoothLeScanner;
          import android.bluetooth.le.ScanCallback;
          import android.bluetooth.le.ScanResult;
          import android.content.Context;
          import android.content.SharedPreferences;
          import android.content.pm.PackageManager;
          import android.graphics.Canvas;
          import android.graphics.Color;
          import android.graphics.Paint;
          import android.graphics.SweepGradient;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.view.Gravity;
          import android.view.MotionEvent;
          import android.view.View;
          import android.widget.AdapterView;
          import android.widget.ArrayAdapter;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.SeekBar;
          import android.widget.Spinner;
          import android.widget.TextView;
          import android.widget.Toast;

          import java.util.ArrayDeque;
          import java.util.ArrayList;
          import java.util.HashMap;
          import java.util.Locale;
          import java.util.Map;
          import java.util.Queue;
          import java.util.UUID;

          public class MainActivity extends Activity {

              private static final UUID SERVICE_FFE0 =
                      UUID.fromString("0000FFE0-0000-1000-8000-00805F9B34FB");

              private static final UUID CHAR_FFE1 =
                      UUID.fromString("0000FFE1-0000-1000-8000-00805F9B34FB");

              private BluetoothAdapter bluetoothAdapter;
              private BluetoothLeScanner bleScanner;
              private BluetoothGatt bluetoothGatt;
              private BluetoothGattCharacteristic targetChar;

              private TextView statusText;
              private LinearLayout contentLayout;
              private LinearLayout scanDeviceListLayout;

              private SharedPreferences sharedPrefs;

              private final Handler handler = new Handler();

              private final Queue<byte[]> writeQueue = new ArrayDeque<>();
              private boolean writing = false;

              private final Map<String, BluetoothDevice> discoveredDevices =
                      new HashMap<>();

              private int currentMode = 1;
              private int brightness = 100;
              private int speed = 50;
              private int pixelCount = 60;
              private int direction = 0;

              private String rgbOrder = "RGB";

              private int selectedSlot = 171;

              private boolean isPlaying = false;

              private final ArrayList<AnimFrame> timelineFrames =
                      new ArrayList<>();

              private PreviewView previewView;

              private final Handler previewHandler = new Handler();

              private Runnable previewRunnable;

              private boolean english = false;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  sharedPrefs =
                          getSharedPreferences(
                                  "LEDDMX_EXACT_SLOTS",
                                  MODE_PRIVATE
                          );

                  BluetoothManager manager =
                          (BluetoothManager)
                                  getSystemService(Context.BLUETOOTH_SERVICE);

                  if (manager != null) {
                      bluetoothAdapter = manager.getAdapter();
                  }

                  if (timelineFrames.isEmpty()) {
                      timelineFrames.add(
                              new AnimFrame(
                                      Color.RED,
                                      Color.BLUE,
                                      150
                              )
                      );

                      timelineFrames.add(
                              new AnimFrame(
                                      Color.BLUE,
                                      Color.RED,
                                      150
                              )
                      );
                  }

                  buildUI();
                  showHomeDashboard();

                  requestBluetoothPermissions();
              }

              private void requestBluetoothPermissions() {

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {

                      ArrayList<String> permissions =
                              new ArrayList<>();

                      if (checkSelfPermission(
                              Manifest.permission.BLUETOOTH_SCAN)
                              != PackageManager.PERMISSION_GRANTED) {

                          permissions.add(
                                  Manifest.permission.BLUETOOTH_SCAN
                          );
                      }

                      if (checkSelfPermission(
                              Manifest.permission.BLUETOOTH_CONNECT)
                              != PackageManager.PERMISSION_GRANTED) {

                          permissions.add(
                                  Manifest.permission.BLUETOOTH_CONNECT
                          );
                      }

                      if (!permissions.isEmpty()) {
                          requestPermissions(
                                  permissions.toArray(
                                          new String[0]
                                  ),
                                  100
                          );
                      }

                  } else if (Build.VERSION.SDK_INT >=
                          Build.VERSION_CODES.M) {

                      if (checkSelfPermission(
                              Manifest.permission.ACCESS_FINE_LOCATION)
                              != PackageManager.PERMISSION_GRANTED) {

                          requestPermissions(
                                  new String[]{
                                          Manifest.permission.ACCESS_FINE_LOCATION
                                  },
                                  101
                          );
                      }
                  }
              }

              private boolean bluetoothPermissionOK() {

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {

                      return checkSelfPermission(
                              Manifest.permission.BLUETOOTH_SCAN
                      ) == PackageManager.PERMISSION_GRANTED
                              &&
                              checkSelfPermission(
                                      Manifest.permission.BLUETOOTH_CONNECT
                              ) == PackageManager.PERMISSION_GRANTED;

                  }

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {

                      return checkSelfPermission(
                              Manifest.permission.ACCESS_FINE_LOCATION
                      ) == PackageManager.PERMISSION_GRANTED;
                  }

                  return true;
              }

              private void buildUI() {

                  LinearLayout root =
                          new LinearLayout(this);

                  root.setOrientation(
                          LinearLayout.VERTICAL
                  );

                  root.setBackgroundColor(
                          Color.rgb(18, 20, 24)
                  );

                  LinearLayout topBar =
                          new LinearLayout(this);

                  topBar.setGravity(
                          Gravity.CENTER_VERTICAL
                  );

                  topBar.setPadding(
                          16, 16, 16, 10
                  );

                  TextView title =
                          new TextView(this);

                  title.setText(
                          "LEDDMX-00-b2cd Pro v36"
                  );

                  title.setTextColor(
                          Color.rgb(0, 229, 255)
                  );

                  title.setTextSize(15);

                  topBar.addView(
                          title,
                          new LinearLayout.LayoutParams(
                                  0,
                                  -2,
                                  1
                          )
                  );

                  Button scan =
                          createButton(
                                  "SCAN BLE",
                                  Color.rgb(31, 36, 48)
                          );

                  scan.setOnClickListener(
                          v -> showScanScreen()
                  );

                  topBar.addView(scan);

                  root.addView(topBar);

                  statusText =
                          new TextView(this);

                  statusText.setText(
                          "Status: Disconnected"
                  );

                  statusText.setTextColor(
                          Color.YELLOW
                  );

                  statusText.setPadding(
                          18, 0, 18, 10
                  );

                  root.addView(statusText);

                  ScrollView scroll =
                          new ScrollView(this);

                  contentLayout =
                          new LinearLayout(this);

                  contentLayout.setOrientation(
                          LinearLayout.VERTICAL
                  );

                  contentLayout.setPadding(
                          16, 8, 16, 8
                  );

                  scroll.addView(
                          contentLayout,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  -2
                          )
                  );

                  root.addView(
                          scroll,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  0,
                                  1
                          )
                  );

                  LinearLayout nav =
                          new LinearLayout(this);

                  nav.setPadding(
                          5, 5, 5, 5
                  );

                  nav.setBackgroundColor(
                          Color.rgb(26, 29, 36)
                  );

                  String[] tabs = {
                          "HOME",
                          "MODES",
                          "EDITOR",
                          "AI",
                          "RAW"
                  };

                  for (String tab : tabs) {

                      Button b =
                              createButton(
                                      tab,
                                      Color.rgb(37, 42, 52)
                              );

                      b.setTextSize(9);

                      b.setOnClickListener(
                              v -> {

                                  if (tab.equals("HOME")) {
                                      showHomeDashboard();

                                  } else if (tab.equals("MODES")) {
                                      showModeScreen();

                                  } else if (tab.equals("EDITOR")) {
                                      showEditorScreen();

                                  } else if (tab.equals("AI")) {
                                      showAIScreen();

                                  } else {
                                      showRawHexScreen();
                                  }
                              }
                      );

                      nav.addView(
                              b,
                              new LinearLayout.LayoutParams(
                                      0,
                                      65,
                                      1
                              )
                      );
                  }

                  root.addView(nav);

                  setContentView(root);
              }

              private void clearContent() {

                  stopAnimationLoop();
                  stopPreview();

                  if (contentLayout != null) {
                      contentLayout.removeAllViews();
                  }
              }

              private TextView createHeader(
                      String text
              ) {

                  TextView t =
                          new TextView(this);

                  t.setText(text);

                  t.setTextColor(
                          Color.rgb(0, 229, 255)
                  );

                  t.setTextSize(17);

                  t.setPadding(
                          0, 12, 0, 12
                  );

                  return t;
              }

              private TextView createLabel(
                      String text
              ) {

                  TextView t =
                          new TextView(this);

                  t.setText(text);

                  t.setTextColor(Color.WHITE);

                  t.setTextSize(13);

                  t.setPadding(
                          0, 8, 0, 4
                  );

                  return t;
              }

              private Button createButton(
                      String text,
                      int color
              ) {

                  Button b =
                          new Button(this);

                  b.setText(text);

                  b.setTextColor(Color.WHITE);

                  b.setBackgroundColor(color);

                  return b;
              }

              private EditText createEditText(
                      String text
              ) {

                  EditText e =
                          new EditText(this);

                  e.setText(text);

                  e.setTextColor(Color.WHITE);

                  e.setHintTextColor(
                          Color.GRAY
                  );

                  e.setBackgroundColor(
                          Color.rgb(31, 36, 48)
                  );

                  return e;
              }

              private void showHomeDashboard() {

                  clearContent();

                  contentLayout.addView(
                          createHeader(
                                  "DASHBOARD HARDWARE / FFE1"
                          )
                  );

                  LinearLayout powerRow =
                          new LinearLayout(this);

                  Button on =
                          createButton(
                                  "POWER ON",
                                  Color.rgb(0, 200, 83)
                          );

                  on.setOnClickListener(
                          v -> sendCommand(
                                  packetPower(true)
                          )
                  );

                  Button off =
                          createButton(
                                  "POWER OFF",
                                  Color.rgb(213, 0, 0)
                          );

                  off.setOnClickListener(
                          v -> sendCommand(
                                  packetPower(false)
                          )
                  );

                  powerRow.addView(
                          on,
                          new LinearLayout.LayoutParams(
                                  0, -2, 1
                          )
                  );

                  powerRow.addView(
                          off,
                          new LinearLayout.LayoutParams(
                                  0, -2, 1
                          )
                  );

                  contentLayout.addView(powerRow);

                  contentLayout.addView(
                          createLabel(
                                  "Brightness: "
                                          + brightness
                                          + "%"
                          )
                  );

                  SeekBar bright =
                          new SeekBar(this);

                  bright.setMax(100);
                  bright.setProgress(brightness);

                  bright.setOnSeekBarChangeListener(
                          new SeekBar.OnSeekBarChangeListener() {

                              public void onProgressChanged(
                                      SeekBar s,
                                      int p,
                                      boolean fromUser
                              ) {
                                  brightness = p;
                              }

                              public void onStartTrackingTouch(
                                      SeekBar s
                              ) {}

                              public void onStopTrackingTouch(
                                      SeekBar s
                              ) {
                                  sendCommand(
                                          packetBrightness(
                                                  brightness
                                          )
                                  );
                              }
                          }
                  );

                  contentLayout.addView(bright);

                  contentLayout.addView(
                          createLabel(
                                  "Speed: "
                                          + speed
                          )
                  );

                  SeekBar speedBar =
                          new SeekBar(this);

                  speedBar.setMax(255);
                  speedBar.setProgress(speed);

                  speedBar.setOnSeekBarChangeListener(
                          new SeekBar.OnSeekBarChangeListener() {

                              public void onProgressChanged(
                                      SeekBar s,
                                      int p,
                                      boolean fromUser
                              ) {
                                  speed = p;
                              }

                              public void onStartTrackingTouch(
                                      SeekBar s
                              ) {}

                              public void onStopTrackingTouch(
                                      SeekBar s
                              ) {
                                  sendCommand(
                                          packetSpeed(
                                                  speed
                                          )
                                  );
                              }
                          }
                  );

                  contentLayout.addView(speedBar);

                  Button directionButton =
                          createButton(
                                  "Direction: "
                                          + (
                                          direction == 0
                                                  ? "Forward"
                                                  : "Reverse"
                                  ),
                                  Color.rgb(31, 36, 48)
                          );

                  directionButton.setOnClickListener(
                          v -> {

                              direction =
                                      direction == 0
                                              ? 1
                                              : 0;

                              sendCommand(
                                      packetDirection(
                                              direction
                                      )
                              );

                              showHomeDashboard();
                          }
                  );

                  contentLayout.addView(
                          directionButton
                  );

                  contentLayout.addView(
                          createLabel(
                                  "Pixel Count"
                          )
                  );

                  EditText pixel =
                          createEditText(
