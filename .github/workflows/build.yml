              private void generateChase() {

                  frames.clear();

                  for(int i=0;i<10;i++) {

                      int l=(i%2==0)
                              ?Color.RED
                              :Color.BLACK;

                      int r=(i%2==0)
                              ?Color.BLACK
                              :Color.BLUE;

                      frames.add(
                              new Frame(l,r,90));
                  }
              }

              private void generateStrobe() {

                  frames.clear();

                  for(int i=0;i<8;i++) {

                      if(i%2==0) {

                          frames.add(
                                  new Frame(
                                          Color.WHITE,
                                          Color.WHITE,
                                          70));

                      } else {

                          frames.add(
                                  new Frame(
                                          Color.BLACK,
                                          Color.BLACK,
                                          70));
                      }
                  }
              }

              private void generateFade() {

                  frames.clear();

                  for(int i=0;i<=10;i++) {

                      int x=i*25;

                      frames.add(
                              new Frame(
                                      Color.rgb(x,0,0),
                                      Color.rgb(0,0,x),
                                      100));
                  }

                  for(int i=10;i>=0;i--) {

                      int x=i*25;

                      frames.add(
                              new Frame(
                                      Color.rgb(x,0,0),
                                      Color.rgb(0,0,x),
                                      100));
                  }
              }

              private void generatePolice() {

                  frames.clear();

                  for(int i=0;i<3;i++) {

                      frames.add(
                              new Frame(
                                      Color.RED,
                                      Color.BLUE,
                                      100));

                      frames.add(
                              new Frame(
                                      Color.BLACK,
                                      Color.BLACK,
                                      70));
                  }

                  for(int i=0;i<3;i++) {

                      frames.add(
                              new Frame(
                                      Color.BLUE,
                                      Color.RED,
                                      100));

                      frames.add(
                              new Frame(
                                      Color.BLACK,
                                      Color.BLACK,
                                      70));
                  }
              }

              private void generateFire() {

                  frames.clear();

                  for(int i=0;i<14;i++) {

                      int r=220+(i%4)*8;
                      int g=30+(i%6)*15;

                      frames.add(
                              new Frame(
                                      Color.rgb(
                                              Math.min(255,r),
                                              Math.min(255,g),
                                              0),
                                      Color.rgb(
                                              Math.min(255,r),
                                              Math.min(255,g),
                                              0),
                                      80));
                  }
              }

              private void generateWater() {

                  frames.clear();

                  int[] c={
                          Color.rgb(0,60,180),
                          Color.rgb(0,120,255),
                          Color.CYAN,
                          Color.BLUE,
                          Color.rgb(0,80,220)
                  };

                  for(int i=0;i<15;i++) {

                      frames.add(
                              new Frame(
                                      c[i%c.length],
                                      c[(i+2)%c.length],
                                      100));
                  }
              }

              private void generateRandom() {

                  frames.clear();

                  java.util.Random r=
                          new java.util.Random();

                  for(int i=0;i<20;i++) {

                      frames.add(
                              new Frame(
                                      Color.rgb(
                                              r.nextInt(256),
                                              r.nextInt(256),
                                              r.nextInt(256)),
                                      Color.rgb(
                                              r.nextInt(256),
                                              r.nextInt(256),
                                              r.nextInt(256)),
                                      100+r.nextInt(250)));
                  }
              }

