name: Build LEDDMX APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract and Patch Android project
        run: |
          rm -rf project
          mkdir project
          unzip -q LEDDMX_Android_Final_PHONE_BUILD.zip -d project
          
          # Cari baris error pemanggilan BluetoothGatt/getService di MainActivity.java lalu sesuaikan parameternya
          MAIN_FILE=$(find project -name "MainActivity.java")
          echo "Found MainActivity at: $MAIN_FILE"
          
          # Cetak baris yang bermasalah untuk referensi
          grep -n "getService" "$MAIN_FILE" || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        working-directory: project
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LEDDMX-Android-debug
          path: project/app/build/outputs/apk/debug/app-debug.apk
