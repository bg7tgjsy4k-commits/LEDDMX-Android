              static class ColorWheel extends View {

                  Paint p=new Paint(Paint.ANTI_ALIAS_FLAG);
                  float cx,cy,radius;
                  interface Listener {
                      void changed(int r,int g,int b);
                  }

                  Listener listener;

                  public ColorWheel(Context c) {
                      super(c);
                      p.setStrokeWidth(1);
                  }

                  @Override protected void onDraw(Canvas c) {
                      super.onDraw(c);

                      cx=getWidth()/2f;
                      cy=getHeight()/2f;
                      radius=Math.min(getWidth(),getHeight())*.40f;

                      SweepGradient sweep=new SweepGradient(
                              cx,cy,
                              new int[]{
                                      Color.RED,
                                      Color.MAGENTA,
                                      Color.BLUE,
                                      Color.CYAN,
                                      Color.GREEN,
                                      Color.YELLOW,
                                      Color.RED
                              },
                              null);

                      p.setShader(sweep);
                      p.setStyle(Paint.Style.FILL);
                      c.drawCircle(cx,cy,radius,p);

                      p.setShader(new RadialGradient(
                              cx,cy, radius,
                              Color.WHITE,
                              Color.TRANSPARENT,
                              Shader.TileMode.CLAMP));

                      c.drawCircle(cx,cy,radius,p);

                      p.setShader(null);
                      p.setStyle(Paint.Style.STROKE);
                      p.setColor(Color.WHITE);
                      p.setStrokeWidth(3);

                      c.drawCircle(cx,cy,radius,p);

                      p.setStyle(Paint.Style.FILL);
                      p.setColor(Color.WHITE);
                      c.drawCircle(cx,cy,8,p);
                  }

                  @Override public boolean onTouchEvent(
                          android.view.MotionEvent e) {

                      if(e.getAction()==MotionEvent.ACTION_DOWN ||
                              e.getAction()==MotionEvent.ACTION_MOVE) {

                          float dx=e.getX()-cx;
                          float dy=e.getY()-cy;

                          float distance=(float)Math.sqrt(
                                  dx*dx+dy*dy);

                          if(distance>radius)
                              return true;

                          float hue=(float)(
                                  Math.toDegrees(
                                          Math.atan2(dy,dx))+360)%360;

                          float sat=Math.min(
                                  1f,distance/radius);

                          int color=Color.HSVToColor(
                                  new float[]{hue,sat,1f});

                          if(listener!=null)
                              listener.changed(
                                      Color.red(color),
                                      Color.green(color),
                                      Color.blue(color));

                          return true;
                      }

                      return true;
                  }
              }

              static class PreviewView extends View {

                  Paint p=new Paint(Paint.ANTI_ALIAS_FLAG);
                  Frame frame;

                  public PreviewView(Context c) {
                      super(c);
                      p.setStyle(Paint.Style.FILL);
                  }

                  void setFrame(Frame f) {
                      frame=f;
                      invalidate();
                  }

                  @Override protected void onDraw(Canvas c) {
                      super.onDraw(c);

                      c.drawColor(Color.BLACK);

                      if(frame==null)return;

                      int w=getWidth();
                      int h=getHeight();

                      p.setColor(Color.rgb(
                              frame.lr,frame.lg,frame.lb));

                      c.drawRoundRect(
                              15,25,
                              w/2f-10,h-25,
                              25,25,p);

                      p.setColor(Color.rgb(
                              frame.rr,frame.rg,frame.rb));

                      c.drawRoundRect(
                              w/2f+10,25,
                              w-15,h-25,
                              25,25,p);

                      p.setColor(Color.WHITE);
                      p.setTextSize(24);
                      p.setTextAlign(Paint.Align.CENTER);

                      c.drawText(
                              "LEFT",
                              w/4f,
                              h/2f,
                              p);

                      c.drawText(
                              "RIGHT",
                              w*3/4f,
                              h/2f,
                              p);
                  }
              }

              static class AlertDialogCompat {

                  Activity a;
                  String title;
                  View view;
                  Runnable done;

                  AlertDialogCompat(
                          Activity a,
                          String title,
                          View view,
                          Runnable done) {
                      this.a=a;
                      this.title=title;
                      this.view=view;
                      this.done=done;
                  }

                  void show() {
                      android.app.AlertDialog d=
                              new android.app.AlertDialog.Builder(a)
                                      .setTitle(title)
                                      .setView(view)
                                      .setPositiveButton(
                                              "DONE",
                                              (x,w)->{
                                                  if(done!=null)
                                                      done.run();
                                              })
                                      .setNegativeButton(
                                              "CANCEL",null)
                                      .create();

                      d.show();
                  }
              }
          }
