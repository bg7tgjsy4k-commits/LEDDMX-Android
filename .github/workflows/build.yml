      - name: Download exact LEDDMX mode names
        shell: bash
        run: |
          set -euxo pipefail

          cd LEDDMX-Pro

          mkdir -p app/src/main/java/com/leddmx/pro

          curl -fL --retry 5 --retry-delay 2 \
            -o PatternList.kt \
            https://raw.githubusercontent.com/user154lt/LEDDMX-00/main/PatternList.kt

          python3 <<'PY'
import re
from pathlib import Path

src = Path("PatternList.kt").read_text(encoding="utf-8")

# Extract every quoted string from the upstream list.
items = re.findall(r'"((?:\\.|[^"\\])*)"', src)

# Decode simple Kotlin escapes.
items = [
    x.replace('\\"', '"')
     .replace("\\\\", "\\")
     .replace("\\n", "\n")
    for x in items
]

# Keep the upstream list intact.
# The source contains 211 entries indexed 0..210.
if len(items) < 211:
    raise SystemExit(
        "PatternList extraction failed: only %d entries found" % len(items)
    )

items = items[:211]

out = []
out.append("package com.leddmx.pro;")
out.append("")
out.append("public final class Patterns {")
out.append("    private Patterns() {}")
out.append("    public static final String[] NAMES = new String[] {")

for s in items:
    s = s.replace("\\", "\\\\").replace('"', '\\"').replace("\n", "\\n")
    out.append('        "' + s + '",')

out.append("    };")
out.append("}")

Path(
    "app/src/main/java/com/leddmx/pro/Patterns.java"
).write_text("\n".join(out), encoding="utf-8")
PY

          test -s app/src/main/java/com/leddmx/pro/Patterns.java

