    private void enqueue(byte[] packet) {
        if (!connected ||
                gatt == null ||
                writeChar == null) {
            toast("Connect LEDDMX first");
            return;
        }

        txQueue.add(packet);
        sendNext();
    }

    private void sendNext() {
        if (txBusy) return;
        if (txQueue.isEmpty()) return;

        if (gatt == null ||
                writeChar == null) {
            txQueue.clear();
            return;
        }

        byte[] p = txQueue.poll();

        try {
            writeChar.setValue(p);

            if ((writeChar.getProperties() &
                    BluetoothGattCharacteristic
                            .PROPERTY_WRITE_NO_RESPONSE) != 0) {

                writeChar.setWriteType(
                        BluetoothGattCharacteristic
                                .WRITE_TYPE_NO_RESPONSE);
            } else {
                writeChar.setWriteType(
                        BluetoothGattCharacteristic
                                .WRITE_TYPE_DEFAULT);
            }

            txBusy = true;

            addModuleLog(
                    "MODULE TX " + hex(p));

            boolean ok =
                    gatt.writeCharacteristic(
                            writeChar);

            if (!ok) {
                txBusy = false;
                main.postDelayed(
                        () -> sendNext(),
                        100);
            }

        } catch (Exception e) {
            txBusy = false;

            addModuleLog(
                    "MODULE TX ERROR " +
                    e.getMessage());

            main.postDelayed(
                    () -> sendNext(),
                    100);
        }
    }

    private void addModuleLog(
            String s) {

        synchronized (moduleLog) {
            moduleLog.add(
                    String.format(
                            Locale.US,
                            "[%tT] %s",
                            new java.util.Date(),
                            s));

            while (moduleLog.size() > 500) {
                moduleLog.remove(0);
            }
        }

        main.post(() -> {
            if (currentPage == 4)
                showAnalyzer();
        });
    }

    private byte[] parseHex(String input) {
        try {
            String s = input
                    .replace("0x", "")
                    .replace("0X", "")
                    .replace(",", " ")
                    .trim();

            if (s.isEmpty()) return null;

            String[] parts =
                    s.split("\\s+");

            if (parts.length == 1 &&
                    parts[0].length() % 2 == 0) {

                String one = parts[0];

                parts = new String[
                        one.length() / 2];

                for (int i = 0;
                     i < one.length();
                     i += 2) {

                    parts[i / 2] =
                            one.substring(i, i + 2);
                }
            }

            byte[] out =
                    new byte[parts.length];

            for (int i = 0;
                 i < parts.length;
                 i++) {

                out[i] = (byte)
                        Integer.parseInt(
                                parts[i],
                                16);
            }

            return out;

        } catch (Exception e) {
            return null;
        }
    }

    private String hex(byte[] data) {
        if (data == null) return "";

        StringBuilder s =
                new StringBuilder();

        for (byte b : data) {
            s.append(String.format(
                    Locale.US,
                    "%02X ",
                    b & 0xFF));
        }

        return s.toString().trim();
    }

