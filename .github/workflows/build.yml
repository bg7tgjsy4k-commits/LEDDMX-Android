                          } else if (tab.equals("MODES")) {
                              showModeScreen();

                          } else if (tab.equals("EDITOR")) {
                              showEditorScreen();

                          } else if (tab.equals("TEMPLATES")) {
                              showTemplatesScreen();

                          } else if (tab.equals("AI")) {
                              showAIScreen();

                          } else {
                              showRawHexScreen();
                          }
                      });

                      nav.addView(
                              b,
                              new LinearLayout.LayoutParams(
                                      0,
