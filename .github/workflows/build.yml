name: Build LEDDMX AI PRO FINAL

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      # 2. JAVA 17
      # ============================================================
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ============================================================
      # 3. GRADLE 7.6.1
      # ============================================================
      - name: Setup Gradle 7.6.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.6.1'

      # ============================================================
      # 4. CREATE PROJECT
      # ============================================================
      - name: Create Android project
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "LEDDMX AI PRO FINAL"
          echo "JDK      : 17"
          echo "GRADLE   : 7.6.1"
          echo "AGP      : 7.4.2"
          echo "SDK      : 33"
          echo "=========================================="

          rm -rf app
          rm -rf build.gradle
          rm -rf settings.gradle
          rm -rf gradle.properties

          mkdir -p app/src/main/java/com/leddmx/pro
          mkdir -p app/src/main/res/values

          # --------------------------------------------------------
          # settings.gradle
          # --------------------------------------------------------
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "LEDDMX-AI-Pro"
          include ":app"
          EOF

          # --------------------------------------------------------
          # ROOT BUILD.GRADLE
          # --------------------------------------------------------
          cat > build.gradle <<'EOF'
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }

              dependencies {
                  classpath 'com.android.tools.build:gradle:7.4.2'
              }
          }

          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          # --------------------------------------------------------
          # GRADLE PROPERTIES
          # --------------------------------------------------------
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=false
          android.nonTransitiveRClass=false
          EOF

          # --------------------------------------------------------
          # APP BUILD.GRADLE
          # --------------------------------------------------------
          cat > app/build.gradle <<'EOF'
          apply plugin: 'com.android.application'

          android {
              namespace 'com.leddmx.pro'
              compileSdkVersion 33

              defaultConfig {
                  applicationId "com.leddmx.pro"
                  minSdkVersion 21
                  targetSdkVersion 33
                  versionCode 50
                  versionName "5.0"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }
          EOF

          # --------------------------------------------------------
          # COLORS
          # --------------------------------------------------------
          cat > app/src/main/res/values/colors.xml <<'EOF'
          <resources>
              <color name="black">#07090C</color>
              <color name="white">#FFFFFF</color>
              <color name="cyan">#00D9FF</color>
          </resources>
          EOF

          # --------------------------------------------------------
          # STYLE
          # --------------------------------------------------------
          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme"
                  parent="android:style/Theme.Material.NoActionBar">

                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowActionModeOverlay">true</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">#07090C</item>
                  <item name="android:navigationBarColor">#07090C</item>
                  <item name="android:colorAccent">#00D9FF</item>
                  <item name="android:windowBackground">#07090C</item>

              </style>
          </resources>
          EOF

          # --------------------------------------------------------
          # MANIFEST
          # --------------------------------------------------------
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.BLUETOOTH" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />

              <uses-permission
                  android:name="android.permission.BLUETOOTH_SCAN"
                  android:usesPermissionFlags="neverForLocation" />

              <uses-permission
                  android:name="android.permission.BLUETOOTH_CONNECT" />

              <application
                  android:allowBackup="false"
                  android:label="LEDDMX AI PRO"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          # ========================================================
          # DOWNLOAD EXACT LEDDMX PATTERN LIST
          # ========================================================
          echo "Downloading exact LEDDMX pattern list..."

          curl -L --fail --silent --show-error \
            --connect-timeout 15 \
            --max-time 30 \
            "https://raw.githubusercontent.com/user154lt/LEDDMX-00/main/PatternList.kt" \
            -o /tmp/PatternList.kt || true

          # ========================================================
          # GENERATE JAVA PATTERN LIST
          # ========================================================
          python3 <<'PY'
          import re
          from pathlib import Path

          src = Path("/tmp/PatternList.kt")

          names = []

          if src.exists():
              text = src.read_text(errors="ignore")

              # Kotlin listOf("...")
              matches = re.findall(r'"((?:\\.|[^"\\])*)"', text)

              for x in matches:
                  x = x.replace('\\"','"').replace('\\\\','\\')
                  if x.strip():
                      names.append(x.strip())

          # Keep exactly the first 211 upstream entries when available.
          if len(names) >= 211:
              names = names[:211]

          # Fallback if GitHub is temporarily unavailable.
          if len(names) < 211:
              names = []
              for i in range(211):
                  names.append("LEDDMX EFFECT %03d" % i)

          out = Path("app/src/main/java/com/leddmx/pro/PatternList.java")

          with out.open("w") as f:
              f.write("package com.leddmx.pro;\n\n")
              f.write("public final class PatternList {\n")
              f.write("    public static final String[] NAMES = new String[] {\n")

              for i, n in enumerate(names):
                  n = n.replace("\\","\\\\").replace('"','\\"')
                  f.write('        "%s"%s\n' % (n, "," if i < len(names)-1 else ""))

              f.write("    };\n")
              f.write("}\n")

          print("PATTERN COUNT:", len(names))
          PY

          echo "PatternList.java generated."

          # ========================================================
          # FRAME MODEL
          # ========================================================
          cat > app/src/main/java/com/leddmx/pro/Frame.java <<'EOF'
          package com.leddmx.pro;

          public class Frame {

              public int lr, lg, lb;
              public int rr, rg, rb;
              public int duration;

              public Frame(
                      int lr,
                      int lg,
                      int lb,
                      int rr,
                      int rg,
                      int rb,
                      int duration) {

                  this.lr = lr;
                  this.lg = lg;
                  this.lb = lb;

                  this.rr = rr;
                  this.rg = rg;
                  this.rb = rb;

                  this.duration = duration;
              }

              public Frame copy() {
                  return new Frame(
                          lr, lg, lb,
                          rr, rg, rb,
                          duration
                  );
              }
          }
          EOF

          # ========================================================
          # MAIN ACTIVITY
          # ========================================================
