name: LEDDMX Pro FINAL

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build LEDDMX Pro
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 7.6.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.6.1'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          test -d "$ANDROID_HOME/platforms/android-33"
          test -d "$ANDROID_HOME/build-tools/33.0.2"

          echo "ANDROID PLATFORM 33: OK"
          echo "BUILD TOOLS 33.0.2: OK"

      - name: Create clean Android project
        shell: bash
        run: |
          set -e

          rm -rf app
          rm -rf gradle
          rm -rf .gradle

          rm -f build.gradle
          rm -f settings.gradle
          rm -f gradle.properties
          rm -f gradlew
          rm -f gradlew.bat

          mkdir -p app/src/main/java/com/leddmx/pro
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "LEDDMX-Pro"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }

              dependencies {
                  classpath "com.android.tools.build:gradle:7.4.2"
              }
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=false
          android.enableJetifier=false
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.leddmx.pro'
              compileSdk 33
              buildToolsVersion "33.0.2"

              defaultConfig {
                  applicationId "com.leddmx.pro"
                  minSdk 21
                  targetSdk 33
                  versionCode 1
                  versionName "1.0-FINAL"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">LEDDMX Pro</string>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.BLUETOOTH" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" />
              <uses-permission android:name="android.permission.BLUETOOTH_SCAN" />
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />

              <uses-feature
                  android:name="android.hardware.bluetooth_le"
                  android:required="false" />

              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:theme="@android:style/Theme.Material.NoActionBar"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > app/src/main/java/com/leddmx/pro/MainActivity.java <<'EOF'
          package com.leddmx.pro;

          import android.Manifest;
          import android.app.Activity;
          import android.bluetooth.BluetoothAdapter;
          import android.bluetooth.BluetoothDevice;
          import android.bluetooth.BluetoothGatt;
          import android.bluetooth.BluetoothGattCallback;
          import android.bluetooth.BluetoothGattCharacteristic;
          import android.bluetooth.BluetoothGattService;
          import android.bluetooth.BluetoothManager;
          import android.bluetooth.BluetoothProfile;
          import android.bluetooth.le.BluetoothLeScanner;
          import android.bluetooth.le.ScanCallback;
          import android.bluetooth.le.ScanResult;
          import android.content.ClipData;
          import android.content.ClipboardManager;
          import android.content.Context;
          import android.content.pm.PackageManager;
          import android.graphics.Canvas;
          import android.graphics.Color;
          import android.graphics.Paint;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.view.Gravity;
          import android.view.MotionEvent;
          import android.view.View;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.LinearLayout;
          import android.widget.PopupWindow;
          import android.widget.ScrollView;
          import android.widget.SeekBar;
          import android.widget.TextView;
          import android.widget.Toast;

          import java.text.SimpleDateFormat;
          import java.util.ArrayDeque;
          import java.util.ArrayList;
          import java.util.Date;
          import java.util.Locale;
          import java.util.UUID;

          public class MainActivity extends Activity {

              private static final UUID FFE0 =
                      UUID.fromString(
                              "0000ffe0-0000-1000-8000-00805f9b34fb");

              private static final UUID FFE1 =
                      UUID.fromString(
                              "0000ffe1-0000-1000-8000-00805f9b34fb");

              private static final UUID OTA =
                      UUID.fromString(
                              "5833ff01-9b8b-5191-6142-22a4536ef123");

              private final Handler handler =
                      new Handler(Looper.getMainLooper());

              private BluetoothAdapter adapter;
              private BluetoothLeScanner scanner;
              private BluetoothGatt gatt;
              private BluetoothGattCharacteristic tx;
              private ScanCallback scanCallback;

              private boolean scanning = false;
              private boolean power = true;
              private boolean writing = false;

              private int red = 255;
              private int green = 0;
              private int blue = 0;
              private int brightness = 100;
              private int speed = 50;
              private int mode = 1;

              private String output = "BOTH";

              private LinearLayout root;
              private LinearLayout body;
              private TextView status;

              private final ArrayList<BluetoothDevice> devices =
                      new ArrayList<>();

              private final ArrayDeque<byte[]> writeQueue =
                      new ArrayDeque<>();

              private final ArrayList<String> terminal =
                      new ArrayList<>();

              private int dp(int v) {
                  return (int)(
                          v *
                          getResources()
                                  .getDisplayMetrics()
                                  .density +
                          0.5f);
              }

              @Override
              protected void onCreate(Bundle state) {
                  super.onCreate(state);

                  BluetoothManager manager =
                          (BluetoothManager)
                                  getSystemService(
                                          BLUETOOTH_SERVICE);

                  if (manager != null)
                      adapter = manager.getAdapter();

                  buildUi();
                  requestBlePermissions();
              }

              private LinearLayout vertical() {
                  LinearLayout l =
                          new LinearLayout(this);

                  l.setOrientation(
                          LinearLayout.VERTICAL);

                  l.setPadding(
                          dp(10),
                          dp(8),
                          dp(10),
                          dp(8));

                  return l;
              }

              private LinearLayout horizontal() {
                  LinearLayout l = vertical();
                  l.setOrientation(
                          LinearLayout.HORIZONTAL);
                  return l;
              }

              private TextView text(
                      String value,
                      int size) {

                  TextView t =
                          new TextView(this);

                  t.setText(value);
                  t.setTextSize(size);
                  t.setTextColor(Color.WHITE);
                  t.setPadding(
                          dp(8),
                          dp(7),
                          dp(8),
                          dp(7));

                  return t;
              }

              private Button button(
                      String value) {

                  Button b =
                          new Button(this);

                  b.setText(value);
                  b.setTextColor(Color.WHITE);

                  return b;
              }

              private void buildUi() {

                  root = vertical();

                  root.setBackgroundColor(
                          Color.rgb(9,12,16));

                  setContentView(root);

                  LinearLayout top =
                          horizontal();

                  Button menu =
                          button("☰");

                  top.addView(
                          menu,
                          new LinearLayout.LayoutParams(
                                  dp(58),
                                  dp(58)));

                  TextView title =
                          text(
                                  "LEDDMX PRO",
                                  21);

                  title.setGravity(
                          Gravity.CENTER_VERTICAL);

                  top.addView(
                          title,
                          new LinearLayout.LayoutParams(
                                  0,
                                  dp(58),
                                  1));

                  Button scan =
                          button("SCAN");

                  top.addView(
                          scan,
                          new LinearLayout.LayoutParams(
                                  dp(90),
                                  dp(58)));

                  root.addView(top);

                  status =
                          text(
                                  "● DISCONNECTED",
                                  13);

                  status.setTextColor(
                          Color.YELLOW);

                  root.addView(status);

                  ScrollView scroll =
                          new ScrollView(this);

                  body = vertical();

                  scroll.addView(body);

                  root.addView(
                          scroll,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  0,
                                  1));

                  menu.setOnClickListener(
                          v -> showMenu());

                  scan.setOnClickListener(
                          v -> scan());

                  showHome();
              }

              private void clearBody() {
                  body.removeAllViews();
              }

              private void heading(
                      String value) {

                  TextView t =
                          text(value,22);

                  t.setTextColor(Color.CYAN);

                  body.addView(t);
              }

              private void showHome() {

                  clearBody();

                  heading("LEDDMX-00");

                  body.addView(
                          text(
                                  "BLE CONTROLLER • FFE0 / FFE1",
                                  12));

                  Button powerButton =
                          button(
                                  power
                                          ? "POWER ON"
                                          : "POWER OFF");

                  powerButton.setOnClickListener(
                          v -> {

                              power = !power;

                              powerButton.setText(
                                      power
                                              ? "POWER ON"
                                              : "POWER OFF");

                              enqueue(
                                      powerPacket(
                                              power));
                          });

                  body.addView(powerButton);

                  body.addView(
                          new ColorWheel(this),
                          new LinearLayout.LayoutParams(
                                  -1,
                                  dp(250)));

                  body.addView(
                          text(
                                  "RGB: "
                                          + red
                                          + " / "
                                          + green
                                          + " / "
                                          + blue,
                                  14));

                  addSlider(
                          "BRIGHTNESS",
                          brightness,
                          v -> {
                              brightness = v;
                              enqueue(
                                      brightnessPacket(v));
                          });

                  addSlider(
                          "SPEED",
                          speed,
                          v -> {
                              speed = v;
                              enqueue(
                                      speedPacket(v));
                          });

                  LinearLayout outputs =
                          horizontal();

                  for (String o :
                          new String[]{
                                  "LEFT",
                                  "RIGHT",
                                  "BOTH"}) {

                      Button q = button(o);

                      q.setOnClickListener(
                              v -> {

                                  output = o;

                                  toast(
                                          "PREVIEW "
                                                  + o
                                                  + "\n"
                                                  + "HARDWARE ROUTING: NOT PROVEN");
                              });

                      outputs.addView(
                              q,
                              new LinearLayout.LayoutParams(
                                      0,
                                      dp(52),
                                      1));
                  }

                  body.addView(outputs);

                  Button effects =
                          button("210 EFFECTS");

                  effects.setOnClickListener(
                          v -> showEffects());

                  body.addView(effects);

                  Button custom =
                          button("CUSTOM STUDIO");

                  custom.setOnClickListener(
                          v -> showCustom());

                  body.addView(custom);
              }

              private interface SliderAction {
                  void run(int value);
              }

              private void addSlider(
                      String name,
                      int initial,
                      SliderAction action) {

                  TextView value =
                          text(
                                  name
                                          + " : "
                                          + initial,
                                  14);

                  body.addView(value);

                  SeekBar bar =
                          new SeekBar(this);

                  bar.setMax(100);
                  bar.setProgress(initial);

                  bar.setOnSeekBarChangeListener(
                          new SeekBar.OnSeekBarChangeListener() {

                              @Override
                              public void onProgressChanged(
                                      SeekBar seek,
                                      int v,
                                      boolean fromUser) {

                                  value.setText(
                                          name
                                                  + " : "
                                                  + v);

                                  if (fromUser)
                                      action.run(v);
                              }

                              @Override
                              public void onStartTrackingTouch(
                                      SeekBar seek) {
                              }

                              @Override
                              public void onStopTrackingTouch(
                                      SeekBar seek) {
                              }
                          });

                  body.addView(bar);
              }

              private void showEffects() {

                  clearBody();

                  heading(
                          "210 BUILT-IN EFFECTS");

                  for (int i=1;i<=210;i++) {

                      final int selected = i;

                      String name =
                              Patterns.NAME.length > i
                                      ? Patterns.NAME[i]
                                      : "Mode " + i;

                      Button q =
                              button(
                                      String.format(
                                              Locale.US,
                                              "%03d  %s",
                                              i,
                                              name));

                      q.setOnClickListener(
                              v -> {

                                  mode = selected;

                                  enqueue(
                                          modePacket(
                                                  selected));

                                  toast(
                                          "MODE "
                                                  + selected);
                              });

                      body.addView(
                              q,
                              new LinearLayout.LayoutParams(
                                      -1,
                                      dp(48)));
                  }
              }

              private void showCustom() {

                  clearBody();

                  heading(
                          "CUSTOM STUDIO");

                  body.addView(
                          new StripPreview(this),
                          new LinearLayout.LayoutParams(
                                  -1,
                                  dp(130)));

                  body.addView(
                          text(
                                  "ANIMATION TEMPLATES",
                                  14));

                  LinearLayout templates =
                          horizontal();

                  String[] names = {
                          "RAINBOW",
                          "WAVE",
                          "CHASE",
                          "COMET",
                          "SCANNER",
                          "PULSE",
                          "STRIPE",
                          "FIRE"
                  };

                  for (String name : names) {

                      Button q =
                              button(name);

                      q.setOnClickListener(
                              v -> toast(
                                      "LIVE PREVIEW: "
                                              + name));

                      templates.addView(
                              q,
                              new LinearLayout.LayoutParams(
                                      0,
                                      dp(50),
                                      1));
                  }

                  body.addView(templates);

                  body.addView(
                          new ColorWheel(this),
                          new LinearLayout.LayoutParams(
                                  -1,
                                  dp(250)));

                  addSlider(
                          "BRIGHTNESS",
                          brightness,
                          v -> brightness=v);

                  addSlider(
                          "SPEED",
                          speed,
                          v -> speed=v);

                  LinearLayout direction =
                          horizontal();

                  Button forward =
                          button("FORWARD");

                  Button reverse =
                          button("REVERSE");

                  forward.setOnClickListener(
                          v -> enqueue(
                                  directionPacket(0)));

                  reverse.setOnClickListener(
                          v -> enqueue(
                                  directionPacket(1)));

                  direction.addView(
                          forward,
                          new LinearLayout.LayoutParams(
                                  0,
                                  dp(52),
                                  1));

                  direction.addView(
                          reverse,
                          new LinearLayout.LayoutParams(
                                  0,
                                  dp(52),
                                  1));

                  body.addView(direction);

                  LinearLayout out =
                          horizontal();

                  for (String o :
                          new String[]{
                                  "WHOLE",
                                  "LEFT",
                                  "RIGHT",
                                  "BOTH"}) {

                      Button q =
                              button(o);

                      q.setOnClickListener(
                              v -> {

                                  output = o;

                                  toast(
                                          "PREVIEW "
                                                  + o
                                                  + "\n"
                                                  + "ROUTING NOT PROVEN");
                              });

                      out.addView(
                              q,
                              new LinearLayout.LayoutParams(
                                      0,
                                      dp(50),
                                      1));
                  }

                  body.addView(out);

                  Button apply =
                          button(
                                  "APPLY CUSTOM");

                  apply.setOnClickListener(
                          v -> {

                              enqueue(
                                      customColor(
                                              1,
                                              red,
                                              green,
                                              blue,
                                              1));

                              enqueue(
                                      customMode(0));

                              toast(
                                      "CUSTOM PATTERN SENT");
                          });

                  body.addView(apply);

                  body.addView(
                          text(
                                  "SLOTS 171–210",
                                  15));

                  for (int i=171;i<=210;i++) {

                      final int slot = i;

                      Button save =
                              button(
                                      "SAVE SLOT "
                                              + slot);

                      save.setOnClickListener(
                              v -> {

                                  getPreferences(
                                          MODE_PRIVATE)
                                          .edit()
                                          .putInt(
                                                  "slot_"
                                                          + slot,
                                                  mode)
                                          .apply();

                                  toast(
                                          "SLOT "
                                                  + slot
                                                  + " SAVED");
                              });

                      body.addView(save);
                  }
              }

              private void showAnalyzer() {

                  clearBody();

                  heading(
                          "MODULE / MCU ANALYZER");

                  body.addView(
                          text(
                                  "DEVICE-SOURCE TERMINAL",
                                  14));

                  body.addView(
                          text(
                                  "Only data actually read from the module is displayed here.",
                                  12));

                  Button read =
                          button("READ GATT");

                  read.setOnClickListener(
                          v -> readGatt());

                  body.addView(read);

                  EditText raw =
                          new EditText(this);

                  raw.setTextColor(Color.WHITE);
                  raw.setHintTextColor(Color.GRAY);
                  raw.setHint(
                          "RAW HEX");

                  body.addView(raw);

                  Button send =
                          button("SEND RAW HEX");

                  send.setOnClickListener(
                          v -> {

                              try {

                                  enqueue(
                                          parseHex(
                                                  raw.getText()
