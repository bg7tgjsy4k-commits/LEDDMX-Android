                  );

                  contentLayout.addView(
                          label(
                                  "RGB BYTE ORDER"
                          )
                  );

                  LinearLayout rgb =
                          new LinearLayout(this);

                  String[] orders = {
                          "RGB",
                          "RBG",
                          "GRB",
                          "GBR",
                          "BRG",
                          "BGR"
                  };

                  for (String order : orders) {

                      Button b =
