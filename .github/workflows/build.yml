                  deviceDialog.show();

                  refreshDeviceDialog();
              }

              private void refreshDeviceDialog() {

                  if (deviceList == null) {
                      return;
                  }

                  runOnUiThread(() -> {

                      deviceList.removeAllViews();

                      if (devices.isEmpty()) {

                          TextView empty =
                                  text(
                                          "Scanning...\n\n" +
                                          "Belum ada LEDDMX.\n" +
                                          "Pastikan modul menyala.",
                                          15
                                  );

                          empty.setGravity(
                                  Gravity.CENTER
                          );

                          deviceList.addView(
                                  empty
                          );

                          return;
                      }

                      for (ScanResult r :
                              devices) {

                          BluetoothDevice d =
                                  r.getDevice();

                          String name = "";

                          try {
                              name = d.getName();
                          } catch (Exception ignored) {}

                          if (name == null ||
                                  name.trim().isEmpty()) {

                              name = "LEDDMX";
                          }

                          Button b =
                                  button(
                                          name +
                                          "\n" +
                                          d.getAddress() +
                                          "   RSSI " +
                                          r.getRssi()
                                  );

                          b.setOnClickListener(
                                  v -> {

                                      stopScan();

                                      if (deviceDialog != null) {
                                          deviceDialog.dismiss();
                                      }

                                      connect(d);
                                  }
                          );

                          deviceList.addView(
                                  b,
                                  new LinearLayout.LayoutParams(
                                          ViewGroup.LayoutParams.MATCH_PARENT,
                                          75
                                  )
                          );
                      }
                  });
              }

              private void stopScan() {

                  if (!scanning) {
                      return;
                  }

                  scanning = false;

                  try {

                      if (scanner != null &&
                              scanCallback != null) {

                          scanner.stopScan(
                                  scanCallback
                          );
                      }

                  } catch (Exception ignored) {}

                  scanCallback = null;
              }

              // ====================================================
              // GATT CONNECT
              // ====================================================

              private void connect(
                      BluetoothDevice device) {

                  if (!bluetoothPermission()) {
                      requestBluetoothPermission();
                      return;
                  }

                  try {

                      if (gatt != null) {
                          gatt.close();
                          gatt = null;
                      }

                      toast(
                              "Connecting " +
                                      device.getAddress()
                      );

                      gatt =
                              device.connectGatt(
                                      this,
                                      false,
                                      new BluetoothGattCallback() {

                                          @Override
                                          public void
                                          onConnectionStateChange(
                                                  BluetoothGatt g,
                                                  int status,
                                                  int state) {

                                              if (state ==
                                                      BluetoothProfile
                                                              .STATE_CONNECTED) {

                                                  MainActivity.this.gatt =
                                                          g;

                                                  connected = true;

                                                  runOnUiThread(
                                                          () -> {

                                                              toast(
                                                                      "LEDDMX connected"
                                                              );

                                                              showHome();
                                                          }
                                                  );

                                                  try {
                                                      g.discoverServices();
                                                  } catch (Exception ignored) {}

                                              } else if (
                                                      state ==
                                                              BluetoothProfile
                                                                      .STATE_DISCONNECTED) {

                                                  connected = false;
                                                  writeChar = null;

                                                  runOnUiThread(
                                                          () -> {

                                                              toast(
                                                                      "LEDDMX disconnected"
                                                              );

                                                              showHome();
                                                          }
                                                  );
                                              }
                                          }

                                          @Override
                                          public void
                                          onServicesDiscovered(
                                                  BluetoothGatt g,
                                                  int status) {

                                              BluetoothGattService s =
                                                      g.getService(
                                                              UUID.fromString(
                                                                      SERVICE
                                                              )
                                                      );

                                              if (s != null) {

                                                  writeChar =
                                                          s.getCharacteristic(
                                                                  UUID.fromString(
                                                                          WRITE
                                                                  )
                                                          );
                                              }

                                              if (writeChar == null) {

                                                  runOnUiThread(
                                                          () ->
                                                                  toast(
                                                                          "FFE1 tidak ditemukan"
                                                                  )
                                                  );

                                              } else {

                                                  runOnUiThread(
                                                          () ->
                                                                  toast(
                                                                          "FFE0 / FFE1 READY"
                                                                  )
                                                  );
                                              }
                                          }

                                          @Override
                                          public void
                                          onCharacteristicChanged(
                                                  BluetoothGatt g,
                                                  BluetoothGattCharacteristic c) {

                                              byte[] data =
                                                      c.getValue();

                                              addRaw(
                                                      "MODULE RX",
                                                      data
                                              );
                                          }
                                      }
                              );

                  } catch (Exception e) {

                      toast(
                              "Connect error: " +
                                      e.getMessage()
                      );
                  }
              }

              private void disconnect() {

                  stopScan();

                  try {

                      if (gatt != null) {
                          gatt.disconnect();
                          gatt.close();
                      }

                  } catch (Exception ignored) {}

                  gatt = null;
                  writeChar = null;
                  connected = false;

                  showHome();
              }

              // ====================================================
              // BLE WRITE
              // ====================================================

              private void send(byte[] packet) {

                  if (!connected ||
                          gatt == null ||
                          writeChar == null) {

                      toast("LED belum terhubung.");
                      return;
                  }

                  try {

                      writeChar.setWriteType(
                              BluetoothGattCharacteristic
                                      .WRITE_TYPE_NO_RESPONSE
                      );

                      writeChar.setValue(packet);

                      boolean ok =
                              gatt.writeCharacteristic(
                                      writeChar
                              );

                      addRaw(
                              "MODULE TX",
                              packet
                      );

                      if (!ok) {
                          toast(
                                  "BLE write busy / rejected"
                          );
                      }

                  } catch (Exception e) {

                      toast(
                              "BLE TX error: " +
                                      e.getMessage()
                      );
                  }
              }

              private byte[] packet(
                      int... values) {

                  byte[] b =
                          new byte[values.length];

                  for (int i = 0;
                       i < values.length;
                       i++) {

                      b[i] =
                              (byte)(values[i] & 0xFF);
                  }

                  return b;
              }

              // ====================================================
              // PROVEN LEDDMX COMMANDS
              // ====================================================

              private void sendPower(boolean on) {

                  send(
                          packet(
                                  0x7B,
                                  0xFF,
                                  0x04,
                                  on ? 0x01 : 0x00,
                                  0xFF,
                                  0xFF,
                                  0xFF,
                                  0xFF,
                                  0xBF
                          )
                  );
              }

              private void sendMode(int mode) {

                  if (mode < 1 ||
                          mode > 255) {
                      return;
                  }

                  selectedMode = mode;

                  prefs.edit()
                          .putInt(
                                  "mode",
                                  mode
                          )
                          .apply();

                  send(
                          packet(
                                  0x7B,
                                  0xFF,
                                  0x03,
                                  mode,
                                  0xFF,
                                  0xFF,
                                  0xFF,
                                  0xFF,
                                  0xBF
                          )
                  );
              }

              private void sendRgb(
                      int r,
                      int g,
                      int b) {

                  send(
                          packet(
                                  0x7B,
                                  0xFF,
                                  0x07,
                                  clamp(r),
                                  clamp(g),
                                  clamp(b),
                                  0x00,
                                  0xFF,
                                  0xBF
                          )
                  );
              }

              private void sendSpeed(int percent) {

                  int s =
                          clamp(percent);

                  send(
                          packet(
                                  0x7B,
                                  0xFF,
                                  0x02,
                                  s,
                                  0x00,
                                  0xFF,
                                  0xFF,
                                  0xFF,
                                  0xBF
                          )
                  );
              }

              private void sendDirection(
                      boolean reverse) {

                  send(
                          packet(
                                  0x7B,
                                  0xFF,
                                  0x0D,
                                  reverse ? 1 : 0,
                                  0xFF,
                                  0xFF,
                                  0xFF,
                                  0xFF,
                                  0xBF
                          )
                  );
              }

              // ====================================================
              // CUSTOM COLOR LIST
              // ====================================================

              private void sendCustomColor(
                      int position,
                      int total,
                      int r,
                      int g,
                      int b) {

                  send(
                          packet(
                                  0x7B,
                                  position,
                                  0x0E,
                                  0xFD,
                                  r,
                                  g,
                                  b,
                                  total,
                                  0xBF
                          )
                  );
              }

              private void sendCustomMode(
                      int modeOrdinal) {

                  send(
                          packet(
                                  0x7B,
                                  0xFF,
                                  0x13,
                                  modeOrdinal,
                                  0xFF,
                                  0xFF,
                                  0xFF,
                                  0xFF,
                                  0xBF
                          )
                  );
              }

