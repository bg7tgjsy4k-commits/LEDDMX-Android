              private byte[] parseHex(
                      String s) {

                  try {

                      s = s.replace(
                              "0x",
                              ""
                      );

                      s = s.replace(
                              "0X",
                              ""
                      );

                      s = s.replace(
                              ",",
                              " "
                      );

                      String[] p =
                              s.trim()
                                      .split(
                                              "\\s+"
                                      );

                      if (p.length == 0) {
                          return null;
                      }

                      byte[] b =
                              new byte[p.length];

                      for (int i = 0;
                           i < p.length;
                           i++) {

                          b[i] =
                                  (byte)Integer.parseInt(
                                          p[i],
                                          16
                                  );
                      }

                      return b;

                  } catch (Exception e) {

                      return null;
                  }
              }

