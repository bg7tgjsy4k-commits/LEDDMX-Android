              // ============================================================
              // GATT INSPECTOR
              // ============================================================

              private void showGatt() {

                  if (gatt == null) {

                      toast(
                              "Belum terhubung."
                      );

                      return;
                  }

                  StringBuilder s =
                          new StringBuilder();

                  s.append(
                          "LEDDMX GATT\n\n"
                  );

                  for (
                          BluetoothGattService service :
                          gatt.getServices()
                  ) {

                      String uuid =
                              service.getUuid()
                                      .toString();

                      s.append(
                              uuid
                      );

                      if (
                              uuid.equalsIgnoreCase(
                                      OTA_SERVICE
                              )
                      ) {

                          s.append(
                                  "  <-- OTA SERVICE"
                          );
                      }

                      s.append("\n");

                      for (
                              BluetoothGattCharacteristic c :
                              service.getCharacteristics()
                      ) {

                          s.append(
                                  "  "
                          );

                          s.append(
                                  c.getUuid()
                                          .toString()
                          );

                          s.append(
                                  " properties="
                          );

                          s.append(
                                  c.getProperties()
                          );

                          s.append("\n");
                      }

                      s.append("\n");
                  }

                  new AlertDialog.Builder(this)
                          .setTitle(
                                  "GATT TABLE"
                          )
                          .setMessage(
                                  s.toString()
                          )
                          .setPositiveButton(
                                  "OK",
                                  null
                          )
                          .show();
              }

              // ============================================================
              // ANIMATION TEST
              // ============================================================

              private void startAnimation() {

                  if (
                          customColors.isEmpty()
                  )
                      return;

                  animationRunning = true;

                  animateStep(0);
              }

              private void animateStep(
                      int index
              ) {

                  if (!animationRunning)
                      return;

                  if (
                          customColors.isEmpty()
                  )
                      return;

                  int i =
                          index
                                  %
                          customColors.size();

                  send(
                          rgbPacket(
                                  customColors.get(i)
                          )
                  );

                  handler.postDelayed(
                          () -> animateStep(
                                  index + 1
                          ),
                          Math.max(
                                  50,
                                  100 - speed
                          )
                  );
              }

              private void stopAnimation() {

                  animationRunning = false;
              }

              // ============================================================
              // HELPERS
              // ============================================================

              private int clamp(
                      int value,
                      int min,
                      int max
              ) {

                  return Math.max(
                          min,
                          Math.min(
                                  max,
                                  value
                          )
                  );
              }

              private void toast(
                      String message
              ) {

                  Toast.makeText(
                          this,
                          message,
                          Toast.LENGTH_SHORT
                  ).show();
              }

              @Override
              protected void onDestroy() {

                  stopAnimation();
                  stopScan();

                  txQueue.clear();

                  try {

                      if (gatt != null)
                          gatt.close();

                  } catch (Exception ignored) {
                  }

                  super.onDestroy();
              }
          }
