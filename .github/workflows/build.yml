name: Build LEDDMX AI Pro v13

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Create Android project
        shell: bash
        run: |
          set -e

          rm -rf app build.gradle settings.gradle gradle.properties

          mkdir -p app/src/main/java/com/leddmx/pro
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "LEDDMX-AI-Pro"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=false
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.leddmx.pro'
              compileSdk 35

              defaultConfig {
                  applicationId "com.leddmx.pro"
                  minSdk 23
                  targetSdk 35
                  versionCode 13
                  versionName "13.0"
              }
          }
          EOF

          cat > app/src/main/res/values/colors.xml <<'EOF'
          <resources>
              <color name="black">#08090B</color>
              <color name="white">#FFFFFF</color>
          </resources>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme"
                  parent="android:style/Theme.Material.NoActionBar">

                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">#08090B</item>
                  <item name="android:navigationBarColor">#08090B</item>
                  <item name="android:colorAccent">#00D9FF</item>

              </style>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.BLUETOOTH" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />

              <uses-permission
                  android:name="android.permission.BLUETOOTH_SCAN"
                  android:usesPermissionFlags="neverForLocation" />

              <uses-permission
                  android:name="android.permission.BLUETOOTH_CONNECT" />

              <application
                  android:allowBackup="false"
                  android:label="LEDDMX AI Pro"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > app/src/main/java/com/leddmx/pro/MainActivity.java <<'EOF'
          package com.leddmx.pro;

          import android.Manifest;
          import android.app.Activity;
          import android.app.AlertDialog;
          import android.bluetooth.BluetoothAdapter;
          import android.bluetooth.BluetoothDevice;
          import android.bluetooth.BluetoothGatt;
          import android.bluetooth.BluetoothGattCallback;
          import android.bluetooth.BluetoothGattCharacteristic;
          import android.bluetooth.BluetoothGattService;
          import android.bluetooth.BluetoothManager;
          import android.bluetooth.BluetoothProfile;
          import android.content.Context;
          import android.content.SharedPreferences;
          import android.content.pm.PackageManager;
          import android.graphics.Canvas;
          import android.graphics.Color;
          import android.graphics.Paint;
          import android.graphics.RadialGradient;
          import android.graphics.Shader;
          import android.graphics.SweepGradient;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.text.Editable;
          import android.text.InputType;
          import android.text.TextWatcher;
          import android.view.Gravity;
          import android.view.MotionEvent;
          import android.view.View;
          import android.view.ViewGroup;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.GridLayout;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.SeekBar;
          import android.widget.Space;
          import android.widget.TextView;
          import android.widget.Toast;

          import java.util.ArrayList;
          import java.util.Locale;
          import java.util.UUID;
          import java.util.regex.Matcher;
          import java.util.regex.Pattern;

          public class MainActivity extends Activity {

              private static final String SERVICE =
                      "0000FFE0-0000-1000-8000-00805F9B34FB";

              private static final String WRITE =
                      "0000FFE1-0000-1000-8000-00805F9B34FB";

              private static final int REQ_BT = 1001;

              private BluetoothAdapter adapter;
              private BluetoothGatt gatt;
              private BluetoothGattCharacteristic writeChar;

              private boolean connected = false;
              private boolean scanning = false;

              private final Handler main =
                      new Handler(Looper.getMainLooper());

              private final Handler previewHandler =
                      new Handler(Looper.getMainLooper());

              private Runnable previewRunnable;

              private SharedPreferences prefs;

              private LinearLayout content;
              private TextView connectionText;

              private int lastMode = 1;
              private int brightness = 100;
              private int speedMs = 300;

              private int editSlot = 171;
              private int selectedFrame = 0;

              private final ArrayList<Frame> frames =
                      new ArrayList<>();

              private PreviewView previewView;

              private final BluetoothAdapter.LeScanCallback scanCallback =
                      new BluetoothAdapter.LeScanCallback() {

                          @Override
                          public void onLeScan(
                                  BluetoothDevice device,
                                  int rssi,
                                  byte[] record) {

                              String name = "";

                              try {
                                  if (device.getName() != null) {
                                      name = device.getName();
                                  }
                              } catch (SecurityException ignored) {
                              }

                              String n =
                                      name.toUpperCase(Locale.US);

                              if (n.contains("LEDDMX") ||
                                  n.contains("LED LAMP")) {

                                  stopScan();
                                  connect(device);
                              }
                          }
                      };

              private final Runnable scanTimeout =
                      new Runnable() {

                          @Override
                          public void run() {
                              stopScan();
                          }
                      };

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);

                  prefs =
                          getSharedPreferences(
                                  "leddmx_pro",
                                  MODE_PRIVATE);

                  lastMode =
                          prefs.getInt(
                                  "last_mode",
                                  1);

                  brightness =
                          prefs.getInt(
                                  "brightness",
                                  100);

                  speedMs =
                          prefs.getInt(
                                  "speed_ms",
                                  300);

                  BluetoothManager bm =
                          (BluetoothManager)
                                  getSystemService(
                                          Context.BLUETOOTH_SERVICE);

                  if (bm != null) {
                      adapter = bm.getAdapter();
                  }

                  showHome();
              }

              @Override
              protected void onDestroy() {
                  stopPreview();

                  try {
                      if (gatt != null) {
                          gatt.close();
                      }
                  } catch (Exception ignored) {
                  }

                  super.onDestroy();
              }

              private boolean btPermissionOK() {

                  if (Build.VERSION.SDK_INT >= 31) {
                      return checkSelfPermission(
                              Manifest.permission.BLUETOOTH_SCAN)
                              == PackageManager.PERMISSION_GRANTED
                              &&
                              checkSelfPermission(
                              Manifest.permission.BLUETOOTH_CONNECT)
                              == PackageManager.PERMISSION_GRANTED;
                  }

                  return true;
              }

              private void requestBT() {

                  if (Build.VERSION.SDK_INT >= 31) {

                      requestPermissions(
                              new String[]{
                                      Manifest.permission.BLUETOOTH_SCAN,
                                      Manifest.permission.BLUETOOTH_CONNECT
                              },
                              REQ_BT);

                  } else if (Build.VERSION.SDK_INT >= 23) {

                      requestPermissions(
                              new String[]{
                                      Manifest.permission.ACCESS_FINE_LOCATION
                              },
                              REQ_BT);
                  }
              }

              @Override
              public void onRequestPermissionsResult(
                      int requestCode,
                      String[] permissions,
                      int[] results) {

                  super.onRequestPermissionsResult(
                          requestCode,
                          permissions,
                          results);

                  if (requestCode == REQ_BT) {
                      if (btPermissionOK() ||
                          Build.VERSION.SDK_INT < 31) {

                          toast("Bluetooth permission OK.");

                      } else {
                          toast("Bluetooth permission ditolak.");
                      }
                  }
              }

              private void startScan() {

                  if (adapter == null) {
                      toast("Bluetooth tidak tersedia.");
                      return;
                  }

                  if (!btPermissionOK()) {
                      requestBT();
                      return;
                  }

                  if (!adapter.isEnabled()) {
                      toast("Nyalakan Bluetooth terlebih dahulu.");
                      return;
                  }

                  if (scanning) {
                      return;
                  }

                  try {

                      scanning = true;

                      adapter.startLeScan(scanCallback);

                      main.removeCallbacks(scanTimeout);
                      main.postDelayed(
                              scanTimeout,
                              10000);

                      toast("Scanning LEDDMX...");

                  } catch (SecurityException e) {

                      scanning = false;
                      toast("Izin Bluetooth ditolak.");

                  } catch (Exception e) {

                      scanning = false;
                      toast("Gagal memulai scan.");
                  }
              }

              private void stopScan() {

                  if (!scanning ||
                      adapter == null) {
                      return;
                  }

                  try {
                      adapter.stopLeScan(scanCallback);
                  } catch (Exception ignored) {
                  }

                  scanning = false;
              }

              private void connect(
                      BluetoothDevice device) {

                  if (!btPermissionOK()) {
                      requestBT();
                      return;
                  }

                  try {

                      if (gatt != null) {
                          gatt.close();
                          gatt = null;
                      }

                      String name = "LEDDMX";

                      try {
                          if (device.getName() != null) {
                              name = device.getName();
                          }
                      } catch (Exception ignored) {
                      }

                      toast("Connecting " + name);

                      if (Build.VERSION.SDK_INT >= 23) {

                          gatt =
                                  device.connectGatt(
                                          this,
                                          false,
                                          gattCallback,
                                          BluetoothDevice.TRANSPORT_LE);

                      } else {

                          gatt =
                                  device.connectGatt(
                                          this,
                                          false,
                                          gattCallback);
                      }

                  } catch (SecurityException e) {

                      toast("Bluetooth permission ditolak.");

                  } catch (Exception e) {

                      toast("Gagal connect.");
                  }
              }

              private final BluetoothGattCallback gattCallback =
                      new BluetoothGattCallback() {

                          @Override
                          public void onConnectionStateChange(
                                  BluetoothGatt g,
                                  int status,
                                  int newState) {

                              if (newState ==
                                      BluetoothProfile.STATE_CONNECTED) {

                                  gatt = g;
                                  connected = true;

                                  runOnUiThread(() -> {
                                      toast("LED connected.");
                                      showHome();
                                  });

                                  try {
                                      g.discoverServices();
                                  } catch (Exception ignored) {
                                  }

                              } else if (
                                      newState ==
                                      BluetoothProfile.STATE_DISCONNECTED) {

                                  connected = false;
                                  writeChar = null;

                                  try {
                                      g.close();
                                  } catch (Exception ignored) {
                                  }

                                  runOnUiThread(
                                          () -> showHome());
                              }
                          }

                          @Override
                          public void onServicesDiscovered(
                                  BluetoothGatt g,
                                  int status) {

                              BluetoothGattService s =
                                      g.getService(
                                              UUID.fromString(
                                                      SERVICE));

                              if (s != null) {

                                  writeChar =
                                          s.getCharacteristic(
                                                  UUID.fromString(
                                                          WRITE));
                              }

                              runOnUiThread(() -> {

                                  if (writeChar == null) {
                                      toast(
                                              "FFE1 tidak ditemukan.");
                                  } else {
                                      toast(
                                              "FFE1 siap menerima command.");
                                  }
                              });
                          }
                      };

              private void disconnect() {

                  stopScan();

                  try {
                      if (gatt != null) {
                          gatt.disconnect();
                          gatt.close();
                      }
                  } catch (Exception ignored) {
                  }

                  gatt = null;
                  writeChar = null;
                  connected = false;

                  showHome();
              }

              private void send(byte[] packet) {

                  if (!connected ||
                      gatt == null ||
                      writeChar == null) {

                      toast("LED belum terhubung.");
                      return;
                  }

                  try {

                      writeChar.setWriteType(
                              BluetoothGattCharacteristic
                                      .WRITE_TYPE_NO_RESPONSE);

                      writeChar.setValue(packet);

                      if (Build.VERSION.SDK_INT >= 33) {

                          gatt.writeCharacteristic(
                                  writeChar,
                                  packet,
                                  BluetoothGattCharacteristic
                                          .WRITE_TYPE_NO_RESPONSE);

                      } else {

                          gatt.writeCharacteristic(
                                  writeChar);
                      }

                  } catch (SecurityException e) {

                      toast("Izin Bluetooth tidak tersedia.");

                  } catch (Exception e) {

                      toast("Gagal mengirim packet.");
                  }
              }

              /*
               * PROVEN PRESET PACKET
               *
               * 7B FF 03 MODE FF FF FF FF BF
               */
              private void sendMode(int mode) {

                  if (mode < 1 ||
                      mode > 255) {
                      return;
                  }

                  lastMode = mode;

                  prefs.edit()
                          .putInt("last_mode", mode)
                          .apply();

                  send(new byte[]{
                          0x7B,
                          (byte) 0xFF,
                          0x03,
                          (byte) mode,
                          (byte) 0xFF,
                          (byte) 0xFF,
                          (byte) 0xFF,
                          (byte) 0xFF,
                          (byte) 0xBF
                  });
              }

              /*
               * PROVEN LIVE RGB PACKET
               *
               * 7B FF 07 R G B BF
               */
              private void sendColor(
                      int r,
                      int g,
                      int b) {

                  send(new byte[]{
                          0x7B,
                          (byte) 0xFF,
                          0x07,
                          (byte) clamp(r),
                          (byte) clamp(g),
                          (byte) clamp(b),
                          (byte) 0xBF
                  });
              }

              private void sendOff() {
                  sendColor(0, 0, 0);
              }

              private int clamp(int x) {
                  return Math.max(
                          0,
                          Math.min(255, x));
              }

              private int applyBrightness(
                      int c) {

                  return clamp(
                          Math.round(
                                  c *
                                  brightness /
                                  100f));
              }

              private int mixLeftRight(
                      Frame f) {

                  /*
                   * Hardware dual-channel packet
                   * belum terbukti.
                   *
                   * Karena itu default hardware
                   * menggunakan rata-rata LEFT/RIGHT.
                   *
                   * Preview tetap independen.
                   */

                  int r =
                          (f.lr + f.rr) / 2;

                  int g =
                          (f.lg + f.rg) / 2;

                  int b =
                          (f.lb + f.rb) / 2;

                  r = applyBrightness(r);
                  g = applyBrightness(g);
                  b = applyBrightness(b);

                  return Color.rgb(
                          r,
                          g,
                          b);
              }

              private void sendFrame(Frame f) {

                  int c =
                          mixLeftRight(f);

                  sendColor(
                          Color.red(c),
                          Color.green(c),
                          Color.blue(c));
              }

              private void showHome() {

                  stopPreview();

                  basePage("LEDDMX AI PRO");

                  add(heading("CONTROLLER"));

                  add(text(
                          connected
                                  ? "● CONNECTED\nLEDDMX controller siap."
                                  : "○ OFFLINE\nTekan SCAN untuk mencari controller.",
                          15));

                  Button scan =
                          button("SCAN LEDDMX");

                  scan.setOnClickListener(
                          v -> startScan());

                  add(scan);

                  Button disconnect =
                          button("DISCONNECT");

                  disconnect.setOnClickListener(
                          v -> disconnect());

                  add(disconnect);

                  addSpace(12);

                  add(heading("CURRENT MODE"));

                  TextView mode =
                          text(
                                  "MODE " + lastMode,
                                  28);

                  mode.setGravity(
                          Gravity.CENTER);

                  add(mode);

                  Button power =
                          button(
                                  "SEND MODE " +
                                  lastMode);

                  power.setOnClickListener(
                          v -> sendMode(lastMode));

                  add(power);

                  Button off =
                          button("POWER OFF");

                  off.setOnClickListener(
                          v -> sendOff());

                  add(off);

                  add(heading("BRIGHTNESS"));

                  TextView bv =
                          text(
                                  brightness + "%",
                                  14);

                  add(bv);

                  SeekBar bs =
                          new SeekBar(this);

                  bs.setMax(100);
                  bs.setProgress(brightness);

                  add(bs);

                  bs.setOnSeekBarChangeListener(
                          new SeekBar.OnSeekBarChangeListener() {

                              public void onProgressChanged(
                                      SeekBar b,
                                      int p,
                                      boolean user) {

                                  brightness =
                                          p;

                                  bv.setText(
                                          brightness +
                                          "%");

                                  prefs.edit()
                                          .putInt(
                                                  "brightness",
                                                  brightness)
                                          .apply();
                              }

                              public void onStartTrackingTouch(
                                      SeekBar b) {
                              }

                              public void onStopTrackingTouch(
                                      SeekBar b) {
                              }
                          });

                  add(heading("CUSTOM SPEED"));

                  TextView sv =
                          text(
                                  speedMs +
                                  " ms / frame",
                                  14);

                  add(sv);

                  SeekBar speed =
                          new SeekBar(this);

                  speed.setMax(950);

                  speed.setProgress(
                          1000 - speedMs);

                  add(speed);

                  speed.setOnSeekBarChangeListener(
                          new SeekBar.OnSeekBarChangeListener() {

                              public void onProgressChanged(
                                      SeekBar b,
                                      int p,
                                      boolean user) {

                                  speedMs =
                                          clamp(
                                                  1000 - p);

                                  if (speedMs < 50) {
                                      speedMs = 50;
                                  }

                                  sv.setText(
                                          speedMs +
                                          " ms / frame");

                                  prefs.edit()
                                          .putInt(
                                                  "speed_ms",
                                                  speedMs)
                                          .apply();
                              }

                              public void onStartTrackingTouch(
                                      SeekBar b) {
                              }

                              public void onStopTrackingTouch(
                                      SeekBar b) {
                              }
                          });

                  add(text(
                          "Speed berlaku untuk playback custom animation.",
                          12));
              }

              private void showModes() {

                  basePage("PRESET MODES");

                  add(text(
                          "MODE 1–210\n" +
                          "Preview di bawah adalah visual estimasi. " +
                          "Bentuk efek sebenarnya berasal dari firmware controller.",
                          14));

                  EditText search =
                          new EditText(this);

                  search.setHint(
                          "Cari mode 1–210");

                  search.setTextColor(
                          Color.WHITE);

                  search.setHintTextColor(
                          Color.GRAY);

                  add(search);

                  ModePreview mp =
                          new ModePreview(this);

                  add(mp);

                  TextView selected =
                          text(
                                  "SELECTED MODE " +
                                  lastMode,
                                  17);

                  selected.setGravity(
                          Gravity.CENTER);

                  add(selected);

                  mp.setMode(lastMode);

                  GridLayout grid =
                          new GridLayout(this);

                  grid.setColumnCount(3);

                  for (int i = 1;
                       i <= 210;
                       i++) {

                      final int mode = i;

                      Button b =
                              button(
                                      String.format(
                                              Locale.US,
                                              "%03d",
                                              mode));

                      b.setTag(mode);

                      b.setMinHeight(62);

                      b.setOnClickListener(
                              v -> {

                                  lastMode =
                                          mode;

                                  selected.setText(
                                          "SELECTED MODE " +
                                          mode);

                                  mp.setMode(
                                          mode);

                                  prefs.edit()
                                          .putInt(
                                                  "last_mode",
                                                  mode)
                                          .apply();

                                  sendMode(mode);
                              });

                      GridLayout.LayoutParams lp =
                              new GridLayout.LayoutParams();

                      lp.width = 0;
                      lp.height = 62;

                      lp.columnSpec =
                              GridLayout.spec(
                                      GridLayout.UNDEFINED,
                                      1f);

                      lp.setMargins(
                              3,
                              3,
                              3,
                              3);

                      grid.addView(
                              b,
                              lp);
                  }

                  add(grid);

                  Button auto =
                          button(
                                  "AUTO (255)");

                  auto.setOnClickListener(
                          v -> sendMode(255));

                  add(auto);

                  search.addTextChangedListener(
                          new TextWatcher() {

                              public void beforeTextChanged(
                                      CharSequence s,
                                      int st,
                                      int c,
                                      int a) {
                              }

                              public void onTextChanged(
                                      CharSequence s,
                                      int st,
                                      int before,
                                      int count) {

                                  String q =
                                          s.toString()
                                                  .trim();

                                  for (
                                          int i = 0;
                                          i < grid.getChildCount();
                                          i++) {

                                      View v =
                                              grid.getChildAt(i);

                                      int mode =
                                              (Integer)
                                                      v.getTag();

                                      boolean show =
                                              q.isEmpty()
                                              ||
                                              String.valueOf(
                                                      mode)
                                                      .contains(q);

                                      v.setVisibility(
                                              show
                                                      ? View.VISIBLE
                                                      : View.GONE);
                                  }
                              }

                              public void afterTextChanged(
                                      Editable e) {
                              }
                          });
              }

              private void showCustom() {

                  basePage("CUSTOM STUDIO");

                  add(text(
                          "Buat animation sendiri.\n" +
                          "LEFT / RIGHT disimpan independen untuk editor dan preview.",
                          14));

                  add(heading(
                          "LOCAL SLOTS 171–210"));

                  for (int slot = 171;
                       slot <= 210;
                       slot++) {

                      final int s = slot;

                      Button b =
                              button(
                                      "SLOT " +
                                      slot +
                                      (
                                              prefs.contains(
                                                      key(s))
                                                      ? " • SAVED"
                                                      : ""));

                      b.setOnClickListener(
                              v -> openEditor(s));

                      add(b);
                  }

                  Button newAnimation =
                          button(
                                  "＋ CREATE NEW ANIMATION");

                  newAnimation.setOnClickListener(
                          v -> {

                              editSlot =
                                      nextFreeSlot();

                              frames.clear();

                              frames.add(
                                      new Frame(
                                              255,
                                              0,
                                              0,
                                              0,
                                              0,
                                              255,
                                              300));

                              selectedFrame = 0;

                              showEditor();
                          });

                  addSpace(8);
                  add(newAnimation);
              }

              private int nextFreeSlot() {

                  for (int i = 171;
                       i <= 210;
                       i++) {

                      if (!prefs.contains(key(i))) {
                          return i;
                      }
                  }

                  return 171;
              }

              private String key(int slot) {
                  return "slot_" + slot;
              }

              private void openEditor(
                      int slot) {

                  editSlot = slot;

                  loadSlot(slot);

                  showEditor();
              }

              private void showEditor() {

                  stopPreview();

                  basePage(
                          "SLOT " +
                          editSlot);

                  if (frames.isEmpty()) {

                      frames.add(
                              new Frame(
                                      255,
                                      0,
                                      0,
                                      0,
                                      0,
                                      255,
                                      300));
                  }

                  add(heading(
                          "ANIMATION PREVIEW"));

                  previewView =
                          new PreviewView(this);

                  add(previewView);

                  TextView frameInfo =
                          text(
                                  "FRAME " +
                                  (selectedFrame + 1) +
                                  " / " +
                                  frames.size(),
                                  15);

                  frameInfo.setGravity(
                          Gravity.CENTER);

                  add(frameInfo);

                  Button play =
                          button("▶ PLAY");

                  play.setOnClickListener(
                          v -> startPreview());

