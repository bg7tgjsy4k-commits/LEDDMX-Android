              private void loadSlot(int slot) {

                  frames.clear();

                  String s=
                          prefs.getString(
                                  "slot_"+slot,
                                  "");

                  if(s.isEmpty()) {

                      frames.add(
                              new Frame(
                                      Color.RED,
                                      Color.BLUE,
                                      200));

                      frames.add(
                              new Frame(
                                      Color.BLACK,
                                      Color.BLACK,
                                      200));

                      return;
                  }

                  String[] rows=s.split(";");

                  for(String row:rows) {

                      try {

                          String[] p=row.split(",");

                          if(p.length>=3) {

                              frames.add(
                                      new Frame(
                                              Integer.parseInt(p[0]),
                                              Integer.parseInt(p[1]),
                                              Integer.parseInt(p[2])));
                          }

                      } catch(Exception ignored){}
                  }
              }

