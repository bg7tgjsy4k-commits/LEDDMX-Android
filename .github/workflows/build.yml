        private fun button(
            c: Canvas,
            x: Float,
            y: Float,
            w: Float,
            h: Float,
            label: String,
            color: Int
        ) {
            rect(
                c,
                x,
                y,
                x + w,
                y + h,
                color
            )

            val tp = Paint(Paint.ANTI_ALIAS_FLAG)
            tp.textSize = 11f
            tp.color =
                if (
                    color == panel ||
                    color == panel2
                ) text else Color.WHITE

            tp.typeface =
                Typeface.create(
                    Typeface.DEFAULT,
                    Typeface.BOLD
                )

            val tw = tp.measureText(label)

            c.drawText(
                label,
                x + (w - tw) / 2f,
                y + h / 2f + 4f,
                tp
            )
        }

