              private void showModeScreen() {

                  clearContent();

                  contentLayout.addView(
                          createHeader(
                                  "BUILT-IN MODES 1 - 210"
                          )
                  );

                  EditText search =
                          createEditText("");

                  search.setHint(
                          "Cari mode..."
                  );

                  contentLayout.addView(search);

                  LinearLayout grid =
                          new LinearLayout(this);

                  grid.setOrientation(
                          LinearLayout.VERTICAL
                  );

                  contentLayout.addView(grid);

                  populateModes(
                          grid,
                          ""
                  );

                  search.addTextChangedListener(
                          new android.text.TextWatcher() {

                              public void beforeTextChanged(
                                      CharSequence s,
                                      int start,
                                      int count,
                                      int after
                              ) {}

                              public void onTextChanged(
                                      CharSequence s,
                                      int start,
                                      int before,
                                      int count
                              ) {
                                  populateModes(
                                          grid,
                                          s.toString()
                                                  .trim()
                                  );
                              }

                              public void afterTextChanged(
                                      android.text.Editable s
                              ) {}
                          }
                  );
              }

              private void populateModes(
                      LinearLayout container,
                      String query
              ) {

                  container.removeAllViews();

                  LinearLayout row = null;

                  for (int i = 1; i <= 210; i++) {

                      final int mode = i;

                      String title =
                              String.format(
                                      Locale.US,
                                      "Mode %03d",
                                      mode
                              );

                      if (!query.isEmpty()
                              &&
                              !title.toLowerCase(
                                      Locale.US
                              ).contains(
                                      query.toLowerCase(
                                              Locale.US
                                      )
                              )) {
                          continue;
                      }

                      if (row == null
                              ||
                              row.getChildCount() >= 3) {

                          row =
                                  new LinearLayout(
                                          this
                                  );

                          row.setOrientation(
                                  LinearLayout.HORIZONTAL
                          );

                          container.addView(row);
                      }

                      Button b =
                              createButton(
                                      String.valueOf(
                                              mode
                                      ),
                                      mode == currentMode
                                              ? Color.rgb(
                                              0, 229, 255
                                      )
                                              : Color.rgb(
                                              31, 36, 48
                                      )
                              );

                      b.setOnClickListener(
                              v -> {

                                  currentMode =
                                          mode;

                                  sendCommand(
                                          packetMode(
                                                  mode
                                          )
                                  );

                                  Toast.makeText(
                                          MainActivity.this,
                                          "Mode "
                                                  + mode
                                                  + " dikirim",
                                          Toast.LENGTH_SHORT
                                  ).show();
                              }
                      );

                      row.addView(
                              b,
                              new LinearLayout.LayoutParams(
                                      0,
                                      72,
                                      1
                              )
                      );
                  }
              }

              private void showEditorScreen() {

                  clearContent();

                  contentLayout.addView(
                          createHeader(
                                  "CUSTOM ANIMATION / SLOT 171-210"
                          )
                  );

                  previewView =
                          new PreviewView(
