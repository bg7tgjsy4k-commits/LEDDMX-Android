      - name: Verify project
        shell: bash
        run: |
          set -euo pipefail

          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/leddmx/pro/MainActivity.java
          test -f app/src/main/java/com/leddmx/pro/Patterns.java

          grep -q "7.4.2" build.gradle
          grep -q "compileSdk 33" app/build.gradle
          grep -q "minSdk 21" app/build.gradle
          grep -q "targetSdk 33" app/build.gradle

          echo "PROJECT VERIFICATION OK"

      - name: Verify toolchain
        shell: bash
        run: |
          set -euo pipefail

          java -version
          gradle --version

          java -version 2>&1 | grep -q '17'

          gradle --version | grep -q 'Gradle 7.6.1'

          echo "TOOLCHAIN VERIFICATION OK"

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail

          export GRADLE_USER_HOME="$RUNNER_TEMP/gradle-home"

          gradle \
            --no-daemon \
            --stacktrace \
            clean \
            assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          test -s app/build/outputs/apk/debug/app-debug.apk

          ls -lh \
            app/build/outputs/apk/debug/app-debug.apk

          echo "APK BUILD SUCCESS"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LEDDMX-Pro-FINAL
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
