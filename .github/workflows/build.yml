              private void showModeScreen() {

                  clearContent();

                  contentLayout.addView(
                          header(
                                  "BUILT-IN MODES 001 - 210"
                          )
                  );

                  EditText search =
                          edit("");

                  search.setHint(
                          "Cari nomor mode..."
                  );

                  contentLayout.addView(search);

                  LinearLayout grid =
                          new LinearLayout(this);

                  grid.setOrientation(
                          LinearLayout.VERTICAL
                  );

                  contentLayout.addView(grid);

                  populateModes(
                          grid,
                          ""
                  );

                  search.addTextChangedListener(
                          new android.text.TextWatcher() {

                              public void beforeTextChanged(
                                      CharSequence s,
                                      int st,
                                      int count,
                                      int after
                              ) {
                              }

                              public void onTextChanged(
                                      CharSequence s,
                                      int st,
                                      int before,
                                      int count
                              ) {

                                  populateModes(
                                          grid,
                                          s.toString()
                                                  .trim()
                                  );
                              }

                              public void afterTextChanged(
                                      android.text.Editable e
                              ) {
                              }
                          }
                  );
              }

              private void populateModes(
                      LinearLayout container,
                      String query
              ) {

                  container.removeAllViews();

                  LinearLayout row = null;

                  for (int i = 1; i <= 210; i++) {

                      final int mode = i;

                      String text =
                              String.format(
                                      Locale.US,
                                      "%03d",
                                      mode
                              );

                      if (!query.isEmpty()
                              && !text.contains(query)) {
                          continue;
                      }

                      if (row == null
                              || row.getChildCount() >= 3) {

                          row =
                                  new LinearLayout(this);

                          container.addView(row);
                      }

                      Button b =
                              createButton(
                                      text,
                                      mode == currentMode
                                              ? Color.rgb(0, 180, 220)
                                              : Color.rgb(35, 40, 50)
                              );

                      b.setOnClickListener(
                              v -> {

                                  currentMode = mode;

                                  sendMode(mode);

                                  Toast.makeText(
                                          this,
                                          "Mode "
                                                  + mode
                                                  + " dikirim",
                                          Toast.LENGTH_SHORT
                                  ).show();

                                  showModeScreen();
                              }
                      );

                      row.addView(
                              b,
                              new LinearLayout.LayoutParams(
                                      0,
                                      65,
                                      1
                              )
                      );
                  }
              }

              private void showEditorScreen() {

                  clearContent();

                  contentLayout.addView(
                          header(
                                  "CUSTOM EDITOR / LOCAL SLOT 171-210"
                          )
                  );

                  contentLayout.addView(
                          label(
                                  "Slot custom disimpan di HP. Ini BUKAN penulisan firmware controller."
                          )
                  );

                  Spinner spinner =
                          new Spinner(this);

                  String[] slots =
                          new String[40];

                  for (int i = 0; i < 40; i++) {

                      slots[i] =
                              "CUSTOM SLOT "
                                      + (171 + i);
                  }

                  ArrayAdapter<String> adapter =
                          new ArrayAdapter<>(
                                  this,
                                  android.R.layout.simple_spinner_dropdown_item,
                                  slots
                          );

                  spinner.setAdapter(adapter);

                  spinner.setSelection(
                          Math.max(
                                  0,
                                  selectedSlot - 171
                          )
                  );

                  spinner.setOnItemSelectedListener(
                          new AdapterView.OnItemSelectedListener() {

                              public void onItemSelected(
                                      AdapterView<?> parent,
                                      View view,
                                      int position,
                                      long id
                              ) {

                                  selectedSlot =
                                          171 + position;

                                  loadSlot(
                                          selectedSlot
                                  );
                              }

                              public void onNothingSelected(
                                      AdapterView<?> parent
                              ) {
                              }
                          }
                  );

                  contentLayout.addView(spinner);

                  Button add =
                          createButton(
                                  "+ TAMBAH FRAME",
                                  Color.rgb(35, 40, 50)
                          );

                  add.setOnClickListener(
                          v -> {

                              timeline.add(
                                      new AnimFrame(
                                              Color.RED,
                                              Color.BLUE,
                                              150
                                      )
                              );

                              showEditorScreen();
                          }
                  );

                  contentLayout.addView(add);

                  if (previewView == null) {

                      previewView =
                              new PreviewView(this);
                  }

                  previewView.setFrames(
                          timeline
                  );

                  contentLayout.addView(
                          previewView,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  180
                          )
                  );

                  for (int i = 0;
                       i < timeline.size();
                       i++) {

                      final int index = i;

                      AnimFrame frame =
                              timeline.get(i);

                      LinearLayout card =
                              new LinearLayout(this);

                      card.setOrientation(
                              LinearLayout.VERTICAL
                      );

                      card.setPadding(
                              10,
                              10,
                              10,
                              10
                      );

                      card.setBackgroundColor(
                              Color.rgb(27, 30, 37)
                      );

                      card.addView(
                              label(
                                      "FRAME "
                                              + (index + 1)
                              )
                      );

                      LinearLayout colors =
                              new LinearLayout(this);

                      Button left =
                              createButton(
                                      "LEFT",
                                      frame.leftColor
                              );

                      left.setOnClickListener(
                              v -> {

                                  frame.leftColor =
                                          nextColor(
                                                  frame.leftColor
                                          );

                                  showEditorScreen();
                              }
                      );

                      Button right =
                              createButton(
                                      "RIGHT",
                                      frame.rightColor
                              );

                      right.setOnClickListener(
                              v -> {

                                  frame.rightColor =
                                          nextColor(
                                                  frame.rightColor
                                          );

                                  showEditorScreen();
                              }
                      );

                      colors.addView(
                              left,
                              new LinearLayout.LayoutParams(
                                      0,
                                      65,
                                      1
                              )
                      );

                      colors.addView(
                              right,
                              new LinearLayout.LayoutParams(
                                      0,
                                      65,
                                      1
                              )
                      );

                      card.addView(colors);

                      SeekBar duration =
                              new SeekBar(this);

                      duration.setMax(1000);

                      duration.setProgress(
                              Math.max(
                                      50,
                                      Math.min(
                                              1000,
                                              frame.duration
                                      )
                              )
                      );

                      duration.setOnSeekBarChangeListener(
                              new SeekBar.OnSeekBarChangeListener() {

                                  public void onProgressChanged(
                                          SeekBar s,
                                          int p,
                                          boolean user
                                  ) {

                                      frame.duration =
                                              Math.max(
                                                      50,
                                                      p
                                              );
                                  }

                                  public void onStartTrackingTouch(
                                          SeekBar s
                                  ) {
                                  }

