      - name: Download and Run Gradle 8.5 at Workspace Root
        shell: bash
        run: |
          set -eux
          cd $GITHUB_WORKSPACE
          
          # Download Gradle 8.5 di root workspace yang benar
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -q gradle-8.5-bin.zip
          
          # Masukkan bin Gradle 8.5 ke PATH secara presisi
          export PATH="$GITHUB_WORKSPACE/gradle-8.5/bin:$PATH"
          
          gradle --version
          gradle --no-daemon --stacktrace clean assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -eux
          cd $GITHUB_WORKSPACE
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          test -s "$APK"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LEDDMX-AI-Pro-FINAL
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
