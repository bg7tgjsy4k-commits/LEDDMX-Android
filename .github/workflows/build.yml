                      };

              void readGatt() {

                  if(gatt==null) {
                      toast(
                              "CONNECT MODULE FIRST");
                      return;
                  }

                  StringBuilder s=
                          new StringBuilder();

                  for(BluetoothGattService x:
                          gatt.getServices()) {

                      s.append(
                              "DEVICE SERVICE: ")
                              .append(x.getUuid())
                              .append("\n");

                      for(BluetoothGattCharacteristic c:
                              x.getCharacteristics()) {

                          s.append(
                                  "DEVICE CHARACTERISTIC: ")
                                  .append(c.getUuid())
                                  .append(" PROP=")
                                  .append(c.getProperties())
                                  .append("\n");
                      }
                  }

                  log(s.toString());

                  analyzer();
              }

              void send(byte[] data) {

                  if(tx==null) {
                      toast(
                              "MODULE NOT READY");
                      return;
                  }

                  queue.add(data);
                  nextWrite();
              }

              void nextWrite() {

                  if(writing ||
                          queue.isEmpty() ||
                          tx==null)
                      return;

                  writing=true;

                  byte[] data=
                          queue.poll();

                  log(
                          "TX DEVICE COMMAND: "
                                  + hex(data));

                  try {

                      tx.setWriteType(
                              BluetoothGattCharacteristic
                                      .WRITE_TYPE_DEFAULT);

                      tx.setValue(data);

                      if(!gatt.writeCharacteristic(tx)) {

                          writing=false;

                          handler.postDelayed(
                                  this::nextWrite,
                                  100);
                      }

                  } catch(Exception e) {

                      writing=false;

                      handler.postDelayed(
                              this::nextWrite,
                              100);
                  }
              }

              byte[] packet(
                      int a,int b,int c,
                      int d,int e,int f,
                      int h,int i,int j) {

                  return new byte[]{
                          (byte)a,
                          (byte)b,
                          (byte)c,
                          (byte)d,
                          (byte)e,
                          (byte)f,
                          (byte)h,
                          (byte)i,
                          (byte)j};
              }

              byte[] powerPacket(boolean on) {

                  return packet(
                          0x7B,
                          0xFF,
                          0x04,
                          on?0x01:0x00,
                          0xFF,
                          0xFF,
                          0xFF,
                          0xFF,
                          0xBF);
              }

              byte[] modePacket(int m) {

                  return packet(
                          0x7B,
                          0xFF,
                          0x03,
                          m,
                          0xFF,
                          0xFF,
                          0xFF,
                          0xFF,
                          0xBF);
              }

              byte[] rgbPacket(
                      int r,
                      int g,
                      int b) {

                  return packet(
                          0x7B,
                          0xFF,
                          0x07,
                          r,
                          b,
                          g,
                          0x00,
                          0xFF,
                          0xBF);
              }

              byte[] brightnessPacket(
                      int v) {

                  return packet(
                          0x7B,
                          0xFF,
                          0x01,
                          v*32/100,
                          v,
                          0x00,
                          0xFF,
                          0xFF,
                          0xBF);
              }

              byte[] speedPacket(
                      int v) {

                  return packet(
                          0x7B,
                          0xFF,
                          0x02,
                          v,
                          0x00,
                          0xFF,
                          0xFF,
                          0xFF,
                          0xBF);
              }

              byte[] directionPacket(
                      int d) {

                  return packet(
                          0x7B,
                          0xFF,
                          0x0D,
                          d,
                          0xFF,
                          0xFF,
                          0xFF,
                          0xFF,
                          0xBF);
              }

              byte[] customColor(
                      int position,
                      int r,
                      int g,
                      int b,
                      int total) {

                  return packet(
                          0x7B,
                          position,
                          0x0E,
                          0xFD,
                          r,
                          g,
                          b,
                          total,
                          0xBF);
              }

              byte[] customMode(
                      int ordinal) {

                  return packet(
                          0x7B,
                          0xFF,
                          0x13,
                          ordinal,
                          0xFF,
                          0xFF,
                          0xFF,
                          0xFF,
                          0xBF);
              }

              byte[] parseHex(String input) {

                  String[] p =
                          input.trim()
                                  .split("[,\\s]+");

                  if(p.length==0)
                      throw new IllegalArgumentException();

                  byte[] out =
                          new byte[p.length];

                  for(int i=0;i<p.length;i++) {

                      String x=p[i];

                      if(x.startsWith("0x") ||
                              x.startsWith("0X"))
                          x=x.substring(2);

                      if(x.length()>2)
                          throw new IllegalArgumentException();

                      out[i]=(byte)
                              Integer.parseInt(
                                      x,
                                      16);
                  }

                  return out;
              }

              String hex(byte[] data) {

                  if(data==null)
                      return "";

                  StringBuilder s=
                          new StringBuilder();

                  for(byte x:data)
                      s.append(
                                      String.format(
                                              Locale.US,
                                              "%02X",
                                              x&255))
                              .append(" ");

                  return s.toString().trim();
              }

              void log(String s) {

                  String time=
                          new SimpleDateFormat(
                                  "HH:mm:ss.SSS",
                                  Locale.US)
                                  .format(
                                          new Date());

                  terminal.add(
                          time
                                  + "  "
                                  + s);

                  while(terminal.size()>300)
                      terminal.remove(0);
              }

              String terminalText() {

                  if(terminal.isEmpty())
                      return
                              "NOT EXPOSED BY DEVICE";

                  StringBuilder s=
                          new StringBuilder();

                  for(String x:terminal)
                      s.append(x).append("\n");

                  return s.toString();
              }

              String safeName(
                      BluetoothDevice d) {

                  try {

                      String n=d.getName();

                      if(n==null ||
                              n.trim().isEmpty())
                          return "(NO NAME)";

                      return n;

                  } catch(Exception e) {

                      return "(NAME NOT EXPOSED)";
                  }
              }

              String safeAddress(
                      BluetoothDevice d) {

                  try {
                      return d.getAddress();
                  } catch(Exception e) {
                      return "(ADDRESS NOT EXPOSED)";
                  }
              }

              void toast(String s) {

                  Toast.makeText(
                          this,
                          s,
                          Toast.LENGTH_SHORT)
                          .show();
              }

