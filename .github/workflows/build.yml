            () -> {};

    private String displayDevice(
            DeviceItem item) {

        String marker =
                item.hasFfe0
                        ? " ★ LEDDMX SERVICE"
                        : "";

        return item.name +
                marker +
                "\nRSSI: " +
                item.rssi +
                "\n" +
                safeAddress(
                        item.device
                );
    }

    private final ScanCallback scanCallback =
            new ScanCallback() {

                @Override
                public void onScanResult(
                        int callbackType,
                        ScanResult result) {

                    if (result == null ||
                            result.getDevice() == null) {
                        return;
                    }

                    BluetoothDevice device =
                            result.getDevice();

                    String address =
                            safeAddress(device);

                    String name =
                            scanName(result);

                    boolean ffe0 =
                            advertisesFfe0(result);

                    DeviceItem old =
                            deviceMap.get(address);

                    if (old == null) {

                        DeviceItem item =
                                new DeviceItem(
                                        device,
                                        name,
                                        result.getRssi(),
                                        ffe0
                                );

                        deviceMap.put(
                                address,
                                item
                        );

                        devices.add(item);

                    } else {

                        old.name = name;
                        old.rssi =
                                result.getRssi();

                        old.hasFfe0 |= ffe0;
                    }

                    runOnUiThread(
                            () -> refreshDeviceList.run()
                    );
                }

                @Override
                public void onScanFailed(
                        int errorCode) {

                    scanning = false;

                    runOnUiThread(
                            () -> toast(
                                    "BLE scan gagal: " +
                                            errorCode
                            )
                    );
                }
            };

    private String scanName(
            ScanResult result) {

        try {

            if (result.getScanRecord() != null) {

                String name =
                        result.getScanRecord()
                                .getDeviceName();

                if (name != null &&
                        !name.trim().isEmpty()) {

                    return name.trim();
                }
            }

        } catch (Exception ignored) {
        }

        try {

            String name =
                    result.getDevice().getName();

            if (name != null &&
                    !name.trim().isEmpty()) {

                return name.trim();
            }

        } catch (Exception ignored) {
        }

        return "BLE DEVICE";
    }

    private boolean advertisesFfe0(
            ScanResult result) {

        try {

            if (result.getScanRecord() == null) {
                return false;
            }

            if (result.getScanRecord()
                    .getServiceUuids() == null) {
                return false;
            }

            for (android.os.ParcelUuid uuid :
                    result.getScanRecord()
                            .getServiceUuids()) {

                if (uuid.getUuid().equals(
                        BluetoothService.SERVICE_FFE0
                )) {
                    return true;
                }
            }

        } catch (Exception ignored) {
        }

        return false;
    }

    private void stopScan() {

        if (!scanning) {
            return;
        }

        scanning = false;

        handler.removeCallbacks(
                this::stopScan
        );

        try {

            if (scanner != null) {
                scanner.stopScan(
                        scanCallback
                );
            }

        } catch (Exception ignored) {
        }

        toast(
                "Scan selesai: " +
                        devices.size() +
                        " BLE device"
        );
    }

    private void connectDevice(
            DeviceItem item) {

        stopScan();

        try {

            ble.disconnect();

            toast(
                    "Connecting ke " +
                            item.name
            );

            ble.gatt =
                    item.device.connectGatt(
                            this,
                            false,
                            gattCallback,
                            BluetoothDevice.TRANSPORT_LE
                    );

        } catch (SecurityException e) {

            toast(
                    "Permission CONNECT ditolak"
            );

        } catch (Exception e) {

            toast(
                    "Connect gagal"
            );
        }
    }

    private final BluetoothGattCallback gattCallback =
            new BluetoothGattCallback() {

                @Override
                public void onConnectionStateChange(
                        BluetoothGatt gatt,
                        int status,
                        int newState) {

                    if (newState ==
                            BluetoothProfile.STATE_CONNECTED) {

                        ble.gatt = gatt;
                        ble.connected = true;

                        try {
                            gatt.requestConnectionPriority(
                                    BluetoothGatt
                                            .CONNECTION_PRIORITY_HIGH
                            );
                        } catch (Exception ignored) {
                        }

                        runOnUiThread(
                                () -> {

                                    refreshConnection();

                                    toast(
                                            "CONNECTED — discovering GATT"
                                    );
                                }
                        );

                        try {
                            gatt.discoverServices();
                        } catch (Exception ignored) {
                        }

                    } else if (
                            newState ==
                                    BluetoothProfile
                                            .STATE_DISCONNECTED) {

                        if (ble.gatt == gatt) {

                            ble.connected = false;
                            ble.writeChar = null;
                        }

                        try {
                            gatt.close();
                        } catch (Exception ignored) {
                        }

                        runOnUiThread(
                                () -> {

                                    refreshConnection();

                                    toast(
                                            "BLE disconnected"
                                    );
                                }
                        );
                    }
                }

                @Override
                public void onServicesDiscovered(
                        BluetoothGatt gatt,
                        int status) {

                    if (status !=
                            BluetoothGatt.GATT_SUCCESS) {

                        runOnUiThread(
                                () -> toast(
                                        "GATT discovery gagal: " +
                                                status
                                )
                        );

                        return;
                    }

                    BluetoothGattService service =
                            gatt.getService(
                                    BluetoothService.SERVICE_FFE0
                            );

                    if (service == null) {

                        runOnUiThread(
                                () -> toast(
                                        "Connected, FFE0 tidak ditemukan"
                                )
                        );

                        return;
                    }

                    BluetoothGattCharacteristic characteristic =
                            service.getCharacteristic(
                                    BluetoothService.CHAR_FFE1
                            );

                    if (characteristic == null) {

                        runOnUiThread(
                                () -> toast(
                                        "FFE1 tidak ditemukan"
                                )
                        );

                        return;
                    }

                    int properties =
                            characteristic.getProperties();

                    boolean writable =
                            (properties &
                                    BluetoothGattCharacteristic
                                            .PROPERTY_WRITE) != 0
                                    ||
                            (properties &
                                    BluetoothGattCharacteristic
                                            .PROPERTY_WRITE_NO_RESPONSE) != 0;

                    if (!writable) {

                        runOnUiThread(
                                () -> toast(
                                        "FFE1 tidak writable"
                                )
                        );

                        return;
                    }

                    ble.gatt = gatt;
                    ble.writeChar = characteristic;
                    ble.connected = true;

                    runOnUiThread(
                            () -> {

                                refreshConnection();

                                toast(
                                        "LEDDMX READY — FFE1"
                                );

                                buildHome();
                            }
                    );
                }
            };

    private boolean permissionsOkay() {

        if (Build.VERSION.SDK_INT >= 31) {

            return checkSelfPermission(
                    Manifest.permission.BLUETOOTH_SCAN
            ) == PackageManager.PERMISSION_GRANTED
                    &&
                    checkSelfPermission(
                            Manifest.permission.BLUETOOTH_CONNECT
                    ) == PackageManager.PERMISSION_GRANTED;

        } else if (Build.VERSION.SDK_INT >= 23) {

            return checkSelfPermission(
                    Manifest.permission.ACCESS_FINE_LOCATION
            ) == PackageManager.PERMISSION_GRANTED;
        }

        return true;
    }

    private void sendPower(
            boolean on) {

        byte value =
                (byte) (on ? 0x01 : 0x00);

        sendPacket(
                new byte[]{
                        0x7B,
                        (byte) 0xFF,
                        0x04,
                        value,
                        (byte) 0xFF,
                        (byte) 0xFF,
                        (byte) 0xFF,
                        (byte) 0xFF,
                        (byte) 0xBF
                }
        );
    }

    private void sendMode(
            int mode) {

        currentMode = mode;

        sendPacket(
                modePacket(mode)
        );
    }

    private byte[] modePacket(
            int mode) {

        return new byte[]{
                0x7B,
                (byte) 0xFF,
                0x03,
                (byte) mode,
                (byte) 0xFF,
                (byte) 0xFF,
                (byte) 0xFF,
                (byte) 0xFF,
                (byte) 0xBF
        };
    }

    private void sendBrightness() {

        int x =
                brightness * 32 / 100;

        sendPacket(
                new byte[]{
                        0x7B,
                        (byte) 0xFF,
                        0x01,
                        (byte) x,
                        (byte) brightness,
                        0x00,
                        (byte) 0xFF,
                        (byte) 0xFF,
                        (byte) 0xBF
                }
        );
    }

    private void sendSpeed() {

        sendPacket(
                new byte[]{
                        0x7B,
                        (byte) 0xFF,
                        0x02,
                        (byte) speed,
                        0x00,
                        (byte) 0xFF,
                        (byte) 0xFF,
                        (byte) 0xFF,
                        (byte) 0xBF
                }
        );
    }

    private void sendRgb() {

        sendPacket(
                new byte[]{
                        0x7B,
                        (byte) 0xFF,
                        0x07,
                        (byte) selectedR,
                        (byte) selectedG,
                        (byte) selectedB,
                        0x00,
                        (byte) 0xFF,
                        (byte) 0xBF
                }
        );
    }

    private void sendAnimation() {

        if (frames.isEmpty()) {

            toast(
                    "Animation kosong"
            );

            return;
        }

        new Thread(
                () -> {

                    for (Frame f :
                            new ArrayList<>(
                                    frames
                            )) {

                        int r =
                                f.r *
                                        brightness /
                                        255;

                        int g =
                                f.g *
                                        brightness /
                                        255;

                        int b =
                                f.b *
                                        brightness /
                                        255;

                        sendPacket(
                                new byte[]{
                                        0x7B,
                                        (byte) 0xFF,
                                        0x07,
                                        (byte) r,
                                        (byte) g,
                                        (byte) b,
                                        0x00,
                                        (byte) 0xFF,
                                        (byte) 0xBF
                                }
                        );

                        try {
                            Thread.sleep(
                                    Math.max(
                                            30,
                                            f.duration
                                    )
                            );
                        } catch (
                                InterruptedException ignored) {
                        }
                    }

                    runOnUiThread(
                            () -> toast(
                                    "Animation selesai"
                            )
                    );
                }
        ).start();
    }

    private synchronized void sendPacket(
            byte[] packet) {

        if (!ble.connected ||
                ble.writeChar == null) {

            toast(
                    "Belum terhubung ke LEDDMX"
            );

            return;
        }

        packetQueue.offer(
                packet.clone()
        );

        if (!queueRunning) {

            queueRunning = true;

            processQueue();
        }
    }

    private void processQueue() {

        byte[] packet;

        synchronized (this) {

            packet =
                    packetQueue.poll();

            if (packet == null) {

                queueRunning = false;
                return;
            }
        }

        ble.send(packet);

        handler.postDelayed(
                this::processQueue,
                70
        );
    }

    private boolean hasService(
            UUID uuid) {

        if (ble.gatt == null) {
            return false;
        }

        try {

            return ble.gatt.getService(
                    uuid
            ) != null;

        } catch (Exception e) {

            return false;
        }
    }

    private String properties(
            BluetoothGattCharacteristic c) {

        int p =
                c.getProperties();

        ArrayList<String> list =
                new ArrayList<>();

        if ((p &
                BluetoothGattCharacteristic
                        .PROPERTY_READ) != 0) {
            list.add("READ");
        }

        if ((p &
                BluetoothGattCharacteristic
                        .PROPERTY_WRITE) != 0) {
            list.add("WRITE");
        }

        if ((p &
                BluetoothGattCharacteristic
                        .PROPERTY_WRITE_NO_RESPONSE) != 0) {
            list.add("WRITE_NO_RESPONSE");
        }

        if ((p &
                BluetoothGattCharacteristic
                        .PROPERTY_NOTIFY) != 0) {
            list.add("NOTIFY");
        }

        return list.toString();
    }

    private void saveSlot(
            int slot) {

        SharedPreferences.Editor editor =
                getSharedPreferences(
                        "leddmx_slots",
                        MODE_PRIVATE
                ).edit();

        editor.putInt(
                "count_" + slot,
                frames.size()
        );

        for (int i = 0;
             i < frames.size();
             i++) {

            Frame f =
                    frames.get(i);

            editor.putString(
                    "frame_" +
                            slot +
                            "_" +
                            i,
                    f.r + "," +
                            f.g + "," +
                            f.b + "," +
                            f.duration
            );
        }

        editor.apply();

        toast(
                "SLOT " +
                        slot +
                        " SAVED"
        );
    }

    private void loadSlot(
            int slot) {

        SharedPreferences p =
                getSharedPreferences(
                        "leddmx_slots",
                        MODE_PRIVATE
                );

        int count =
                p.getInt(
                        "count_" + slot,
                        0
                );

        if (count <= 0) {
            return;
        }

        frames.clear();

        for (int i = 0;
             i < count;
             i++) {

            try {

                String value =
                        p.getString(
                                "frame_" +
                                        slot +
                                        "_" +
                                        i,
                                ""
                        );

                String[] x =
                        value.split(",");

                frames.add(
                        new Frame(
                                Integer.parseInt(x[0]),
                                Integer.parseInt(x[1]),
                                Integer.parseInt(x[2]),
                                Integer.parseInt(x[3])
                        )
                );

            } catch (Exception ignored) {
            }
        }
    }

    private byte[] parseHex(
            String input) {

        try {

            String s =
                    input
                            .replace(
                                    "0x",
                                    ""
                            )
                            .replace(
                                    "0X",
                                    ""
                            )
                            .replace(
                                    ",",
                                    " "
                            )
                            .trim();

            if (s.isEmpty()) {
                return null;
            }

            String[] parts =
                    s.split(
                            "\\s+"
                    );

            byte[] out =
                    new byte[parts.length];

            for (int i = 0;
                 i < parts.length;
                 i++) {

                int x =
                        Integer.parseInt(
                                parts[i],
                                16
                        );

                if (x < 0 ||
                        x > 255) {
                    return null;
                }

                out[i] =
                        (byte) x;
            }

            return out;

        } catch (Exception e) {

            return null;
        }
    }

    private String toHex(
            byte[] data) {

        StringBuilder sb =
                new StringBuilder();

        for (byte b : data) {

            if (sb.length() > 0) {
                sb.append(' ');
            }

            sb.append(
                    String.format(
                            Locale.US,
                            "%02X",
                            b & 0xFF
                    )
            );
        }

        return sb.toString();
    }

    private int number(
            EditText e,
            int fallback) {

        try {

            return Integer.parseInt(
                    e.getText()
                            .toString()
                            .trim()
