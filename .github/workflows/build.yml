name: LEDDMX Pro FINAL

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    name: Build LEDDMX Pro
    runs-on: ubuntu-latest
    env:
      GRADLE_VERSION: "7.6.1"
      ANDROID_COMPILE_SDK: "33"
      ANDROID_BUILD_TOOLS: "33.0.2"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-${{ env.ANDROID_COMPILE_SDK }}" "build-tools;${{ env.ANDROID_BUILD_TOOLS }}"

      - name: Install Gradle 7.6.1 directly
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-delay 2 "https://services.gradle.org/distributions/gradle-${{ env.GRADLE_VERSION }}-bin.zip" -o /tmp/gradle.zip
          rm -rf /opt/gradle
          mkdir -p /opt/gradle
          unzip -q /tmp/gradle.zip -d /opt/gradle
          echo "/opt/gradle/gradle-${{ env.GRADLE_VERSION }}/bin" >> "$GITHUB_PATH"
          /opt/gradle/gradle-${{ env.GRADLE_VERSION }}/bin/gradle --version

      - name: Create clean project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf app build.gradle settings.gradle gradle.properties gradle

          mkdir -p app/src/main/java/com/leddmx/pro
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "LEDDMX-Pro"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }

              dependencies {
                  classpath "com.android.tools.build:gradle:7.4.2"
              }
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=false
          android.enableJetifier=false
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id "com.android.application"
          }

          android {
              namespace "com.leddmx.pro"
              compileSdk 33

              defaultConfig {
                  applicationId "com.leddmx.pro"
                  minSdk 21
                  targetSdk 33
                  versionCode 100
                  versionName "1.0.0-FINAL"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              packagingOptions {
                  resources.excludes += ["/META-INF/{AL2.0,LGPL2.1}"]
              }
          }
          EOF

          cat > app/src/main/res/values/colors.xml <<'EOF'
          <resources>
              <color name="black">#080B10</color>
              <color name="white">#FFFFFF</color>
          </resources>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="@android:style/Theme.Material.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">#080B10</item>
                  <item name="android:navigationBarColor">#080B10</item>
                  <item name="android:colorAccent">#29D66F</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-feature
                  android:name="android.hardware.bluetooth_le"
                  android:required="false" />

              <uses-permission
                  android:name="android.permission.BLUETOOTH"
                  android:maxSdkVersion="30" />

              <uses-permission
                  android:name="android.permission.BLUETOOTH_ADMIN"
                  android:maxSdkVersion="30" />

              <uses-permission
                  android:name="android.permission.BLUETOOTH_SCAN" />

              <uses-permission
                  android:name="android.permission.BLUETOOTH_CONNECT" />

              <uses-permission
                  android:name="android.permission.ACCESS_FINE_LOCATION"
                  android:maxSdkVersion="30" />

              <application
                  android:theme="@style/AppTheme"
                  android:label="LEDDMX Pro"
                  android:allowBackup="false"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

      - name: Generate exact 210 mode names
        shell: bash
        run: |
          set -euo pipefail

          curl -fsSL --retry 4 \
            "https://raw.githubusercontent.com/user154lt/LEDDMX-00/main/PatternList.kt" \
            -o /tmp/PatternList.kt || true

          python3 - <<'PY'
          import re
          from pathlib import Path

          p = Path("/tmp/PatternList.kt")
          names = []

          if p.exists():
              text = p.read_text(
                  encoding="utf-8",
                  errors="ignore"
              )
              names = re.findall(
                  r'"((?:\\.|[^"\\])*)"',
                  text
              )

          if len(names) < 211:
              names = ["Off"] + [
                  f"Mode {i}" for i in range(1, 211)
              ]
          else:
              names = names[:211]

          out = [
              "package com.leddmx.pro;",
              "",
              "public final class Patterns {",
              "    private Patterns() {}",
              "    public static final String[] NAMES = new String[] {"
          ]

          for n in names:
              n = n.replace("\\", "\\\\")
              n = n.replace('"', '\\"')
              out.append('        "' + n + '",')

          out += [
              "    };",
              "}"
          ]

          Path(
              "app/src/main/java/com/leddmx/pro/Patterns.java"
          ).write_text(
              "\n".join(out),
              encoding="utf-8"
          )

          print("mode names:", len(names))
          PY

      - name: Write final MainActivity
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import base64
          import gzip
          from pathlib import Path

          data = """"""

          Path(
              "app/src/main/java/com/leddmx/pro/MainActivity.java"
          ).write_bytes(
              gzip.decompress(
                  base64.b64decode(data)
              )
          )
          PY

      - name: Verify project
        shell: bash
        run: |
          set -euo pipefail

          test -s settings.gradle
          test -s build.gradle
          test -s app/build.gradle
          test -s app/src/main/AndroidManifest.xml
          test -s app/src/main/java/com/leddmx/pro/MainActivity.java
          test -s app/src/main/java/com/leddmx/pro/Patterns.java

          grep -q 'com.android.tools.build:gradle:7.4.2' build.gradle
          grep -q 'compileSdk 33' app/build.gradle
          grep -q 'minSdk 21' app/build.gradle
          grep -q 'targetSdk 33' app/build.gradle

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --version
          gradle --no-daemon --stacktrace --console=plain clean assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          test -s app/build/outputs/apk/debug/app-debug.apk

          ls -lh app/build/outputs/apk/debug/app-debug.apk

          sha256sum app/build/outputs/apk/debug/app-debug.apk

      - name: Upload FINAL APK
        uses: actions/upload-artifact@v6
        with:
          name: LEDDMX-Pro-FINAL-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
