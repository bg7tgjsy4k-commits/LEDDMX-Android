name: Build LEDDMX AI Pro

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Create Android project
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/leddmx/pro
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "LEDDMX-AI-Pro"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.leddmx.pro'
              compileSdk 35

              defaultConfig {
                  applicationId "com.leddmx.pro"
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName "Final"
              }
          }
          EOF

          cat > app/src/main/res/values/colors.xml <<'EOF'
          <resources>
              <color name="black">#000000</color>
              <color name="white">#FFFFFF</color>
          </resources>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">#080808</item>
                  <item name="android:navigationBarColor">#080808</item>
                  <item name="android:colorAccent">#00E5FF</item>
                  <item name="android:windowActionModeOverlay">true</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.BLUETOOTH"/>
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN"/>
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT"/>
              <uses-permission android:name="android.permission.BLUETOOTH_SCAN"
                  android:usesPermissionFlags="neverForLocation"/>

              <application
                  android:theme="@style/AppTheme"
                  android:label="LEDDMX AI Pro"
                  android:allowBackup="false"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/leddmx/pro/MainActivity.java <<'EOF'
          package com.leddmx.pro;

          import android.Manifest;
          import android.app.Activity;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.content.Context;
          import android.content.SharedPreferences;
          import android.content.pm.PackageManager;
          import android.graphics.*;
          import android.graphics.drawable.GradientDrawable;
          import android.bluetooth.*;
          import android.view.*;
          import android.view.inputmethod.InputMethodManager;
          import android.widget.*;
          import java.util.*;
          import java.util.regex.*;

          public class MainActivity extends Activity {

              static final String SERVICE_UUID =
                      "0000FFE0-0000-1000-8000-00805F9B34FB";
              static final String WRITE_UUID =
                      "0000FFE1-0000-1000-8000-00805F9B34FB";

              BluetoothAdapter adapter;
              BluetoothGatt gatt;
              BluetoothGattCharacteristic writeChar;
              boolean connected = false;
              int lastMode = 171;

              LinearLayout root;
              LinearLayout content;
              TextView title;
              TextView status;

              SharedPreferences prefs;

              final Handler handler = new Handler(Looper.getMainLooper());

              int cyan = Color.rgb(0,229,255);
              int bg = Color.rgb(8,8,10);
              int panel = Color.rgb(20,20,24);

              @Override
              public void onCreate(Bundle b) {
                  super.onCreate(b);

                  prefs = getSharedPreferences("leddmx", MODE_PRIVATE);

                  if (android.os.Build.VERSION.SDK_INT >= 31 &&
                          checkSelfPermission(Manifest.permission.BLUETOOTH_SCAN)
                                  != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(new String[]{
                              Manifest.permission.BLUETOOTH_SCAN,
                              Manifest.permission.BLUETOOTH_CONNECT
                      }, 100);
                  }

                  BluetoothManager bm =
                          (BluetoothManager)getSystemService(BLUETOOTH_SERVICE);
                  adapter = bm.getAdapter();

                  showHome();
              }

              TextView tv(String text, float size) {
                  TextView t = new TextView(this);
                  t.setText(text);
                  t.setTextColor(Color.WHITE);
                  t.setTextSize(size);
                  t.setGravity(Gravity.CENTER_VERTICAL);
                  t.setPadding(18,10,18,10);
                  return t;
              }

              Button button(String text) {
                  Button b = new Button(this);
                  b.setText(text);
                  b.setTextColor(Color.WHITE);
                  b.setTextSize(13);
                  b.setAllCaps(false);
                  return b;
              }

              GradientDrawable box(int color, int radius) {
                  GradientDrawable g = new GradientDrawable();
                  g.setColor(color);
                  g.setCornerRadius(radius);
                  return g;
              }

              LinearLayout page(String name) {
                  root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setBackgroundColor(bg);

                  LinearLayout bar = new LinearLayout(this);
                  bar.setGravity(Gravity.CENTER_VERTICAL);
                  bar.setPadding(8,8,8,8);

                  title = tv(name,22);
                  title.setTypeface(null,Typeface.BOLD);

                  bar.addView(title,new LinearLayout.LayoutParams(
                          0,64,1));

                  status = tv(connected ? "● CONNECTED" : "○ OFFLINE",12);
                  status.setTextColor(connected ? Color.GREEN : Color.GRAY);
                  bar.addView(status,new LinearLayout.LayoutParams(
                          125,64));

                  root.addView(bar);

                  content = new LinearLayout(this);
                  content.setOrientation(LinearLayout.VERTICAL);
                  content.setPadding(12,4,12,8);

                  ScrollView scroll = new ScrollView(this);
                  scroll.addView(content);
                  root.addView(scroll,new LinearLayout.LayoutParams(
                          -1,0,1));

                  LinearLayout nav = new LinearLayout(this);
                  nav.setPadding(4,4,4,4);
                  nav.setBackgroundColor(Color.rgb(15,15,18));

                  String[] names = {"HOME","MODES","CUSTOM","AI","SETTINGS"};

                  for(String n:names) {
                      Button b=button(n);
                      nav.addView(b,new LinearLayout.LayoutParams(
                              0,62,1));

                      if(n.equals("HOME"))
                          b.setOnClickListener(v->showHome());
                      if(n.equals("MODES"))
                          b.setOnClickListener(v->showModes());
                      if(n.equals("CUSTOM"))
                          b.setOnClickListener(v->showCustom());
                      if(n.equals("AI"))
                          b.setOnClickListener(v->showAI());
                      if(n.equals("SETTINGS"))
                          b.setOnClickListener(v->showSettings());
                  }

                  root.addView(nav);

                  setContentView(root);
                  return root;
              }

              void add(View v) {
                  content.addView(v,new LinearLayout.LayoutParams(
                          -1,LinearLayout.LayoutParams.WRAP_CONTENT));
              }

              void space(int h) {
                  Space s=new Space(this);
                  content.addView(s,new LinearLayout.LayoutParams(1,h));
              }

              TextView heading(String s) {
                  TextView t=tv(s,18);
                  t.setTypeface(null,Typeface.BOLD);
                  t.setPadding(10,18,10,10);
                  return t;
              }

              void showHome() {
                  page("LEDDMX AI PRO");

                  add(heading("Bluetooth Controller"));

                  TextView c=tv(connected ?
                          "LED module connected\nReady to control" :
                          "LED module belum terhubung\nTekan SCAN untuk mencari LEDDMX",
                          15);
                  c.setBackground(box(panel,22));
                  add(c);

                  LinearLayout row=new LinearLayout(this);

                  Button scan=button("SCAN LEDDMX");
                  scan.setOnClickListener(v->scan());

                  Button disconnect=button("DISCONNECT");
                  disconnect.setOnClickListener(v->disconnect());

                  row.addView(scan,new LinearLayout.LayoutParams(0,60,1));
                  row.addView(disconnect,new LinearLayout.LayoutParams(0,60,1));
                  add(row);

                  space(12);

                  Button power=button("POWER  " + (connected ? "ON" : "OFF"));
                  power.setOnClickListener(v->{
                      if(connected) {
                          sendOff();
                          power.setText("POWER OFF");
                      } else {
                          scan();
                      }
                  });
                  add(power);

                  add(heading("Current Mode"));

                  TextView mode=tv("MODE " + lastMode,28);
                  mode.setGravity(Gravity.CENTER);
                  mode.setBackground(box(panel,25));
                  add(mode);

                  space(8);

                  add(heading("Speed"));

                  SeekBar speed=new SeekBar(this);
                  speed.setMax(900);
                  speed.setProgress(450);

                  TextView speedLabel=tv("Animation speed: 450 ms",14);
                  add(speedLabel);
                  add(speed);

                  speed.setOnSeekBarChangeListener(
                          new SeekBar.OnSeekBarChangeListener() {
                      public void onProgressChanged(SeekBar s,int p,boolean f) {
                          int val=Math.max(50,950-p);
                          speedLabel.setText("Animation speed: "+val+" ms");
                      }
                      public void onStartTrackingTouch(SeekBar s){}
                      public void onStopTrackingTouch(SeekBar s){}
                  });

                  add(heading("Brightness"));

                  TextView brightLabel=tv("Brightness: 100%",14);
                  add(brightLabel);

                  SeekBar bright=new SeekBar(this);
                  bright.setMax(100);
                  bright.setProgress(100);
                  add(bright);

                  bright.setOnSeekBarChangeListener(
                          new SeekBar.OnSeekBarChangeListener() {
                      public void onProgressChanged(SeekBar s,int p,boolean f) {
                          brightLabel.setText("Brightness: "+p+"%");
                      }
                      public void onStartTrackingTouch(SeekBar s){}
                      public void onStopTrackingTouch(SeekBar s){}
                  });

                  add(heading("Quick"));

                  LinearLayout quick=new LinearLayout(this);

                  Button custom=button("CUSTOM STUDIO");
                  custom.setOnClickListener(v->showCustom());

                  Button ai=button("AI ASSISTANT");
                  ai.setOnClickListener(v->showAI());

                  quick.addView(custom,new LinearLayout.LayoutParams(0,65,1));
                  quick.addView(ai,new LinearLayout.LayoutParams(0,65,1));

                  add(quick);
              }

              void scan() {
                  if(adapter==null) {
                      Toast.makeText(this,"Bluetooth tidak tersedia",
                              Toast.LENGTH_SHORT).show();
                      return;
                  }

                  if(android.os.Build.VERSION.SDK_INT>=31 &&
                          checkSelfPermission(Manifest.permission.BLUETOOTH_SCAN)
                                  !=PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(new String[]{
                              Manifest.permission.BLUETOOTH_SCAN,
                              Manifest.permission.BLUETOOTH_CONNECT
                      },100);
                      return;
                  }

                  Toast.makeText(this,"Scanning LEDDMX...",
                          Toast.LENGTH_SHORT).show();

                  adapter.startLeScan(new BluetoothAdapter.LeScanCallback() {
                      public void onLeScan(BluetoothDevice d,int rssi,byte[] data) {
                          String n=d.getName();

                          if(n!=null &&
                                  (n.toUpperCase().contains("LEDDMX") ||
                                   n.toUpperCase().contains("LED LAMP"))) {

                              adapter.stopLeScan(this);
                              runOnUiThread(()->connect(d));
                          }
                      }
                  });

                  handler.postDelayed(()->adapter.stopLeScan(
                          new BluetoothAdapter.LeScanCallback() {
                              public void onLeScan(BluetoothDevice d,int r,
                                                   byte[] x){}
                          }),10000);
              }

              void connect(BluetoothDevice d) {
                  Toast.makeText(this,
                          "Connecting "+d.getName(),
                          Toast.LENGTH_SHORT).show();

                  if(android.os.Build.VERSION.SDK_INT>=31 &&
                          checkSelfPermission(Manifest.permission.BLUETOOTH_CONNECT)
                                  !=PackageManager.PERMISSION_GRANTED) return;

                  gatt=d.connectGatt(this,false,new BluetoothGattCallback(){

                      @Override
                      public void onConnectionStateChange(
                              BluetoothGatt g,int st,int newState) {

                          if(newState==BluetoothProfile.STATE_CONNECTED) {
                              connected=true;
                              MainActivity.this.gatt=g;
                              g.discoverServices();

                              runOnUiThread(()->{
                                  Toast.makeText(MainActivity.this,
                                          "LED connected",
                                          Toast.LENGTH_SHORT).show();
                                  showHome();
                              });

                          } else if(newState==
                                  BluetoothProfile.STATE_DISCONNECTED) {
                              connected=false;
                              writeChar=null;

                              runOnUiThread(()->showHome());
                          }
                      }

                      @Override
                      public void onServicesDiscovered(
                              BluetoothGatt g,int status) {

                          BluetoothGattService s=
                                  g.getService(UUID.fromString(SERVICE_UUID));

                          if(s!=null) {
                              writeChar=s.getCharacteristic(
                                      UUID.fromString(WRITE_UUID));
                          }
                      }
                  });
              }

              void disconnect() {
                  try {
                      if(gatt!=null) gatt.disconnect();
                  } catch(Exception ignored){}
                  connected=false;
                  writeChar=null;
                  showHome();
              }

              void send(byte[] data) {
                  if(!connected || gatt==null || writeChar==null) {
                      Toast.makeText(this,
                              "LED belum terhubung",
                              Toast.LENGTH_SHORT).show();
                      return;
                  }

                  try {
                      writeChar.setWriteType(
                              BluetoothGattCharacteristic.WRITE_TYPE_NO_RESPONSE);
                      writeChar.setValue(data);
                      gatt.writeCharacteristic(writeChar);
                  } catch(Exception e) {
                      Toast.makeText(this,
                              "Gagal mengirim",
                              Toast.LENGTH_SHORT).show();
                  }
              }

              void sendMode(int mode) {
                  lastMode=mode;
                  prefs.edit().putInt("lastMode",mode).apply();

                  send(new byte[]{
                          0x7B,(byte)0xFF,0x03,
                          (byte)mode,
                          (byte)0xFF,(byte)0xFF,
                          (byte)0xFF,(byte)0xFF,
                          (byte)0xBF
                  });
              }

              void sendColor(int r,int g,int b) {
                  r=Math.max(0,Math.min(255,r));
                  g=Math.max(0,Math.min(255,g));
                  b=Math.max(0,Math.min(255,b));

                  send(new byte[]{
                          0x7B,(byte)0xFF,0x07,
                          (byte)r,(byte)g,(byte)b,
                          (byte)0xBF
                  });
              }

              void sendOff() {
                  send(new byte[]{
                          0x7B,(byte)0xFF,0x07,
                          0,0,0,(byte)0xBF
                  });
              }

              void showModes() {
                  page("MODES 1–210");

                  TextView info=tv(
                          "Preset mode • ketuk untuk menjalankan\n" +
                          "Preview di bawah adalah visual estimasi efek.",
                          13);
                  info.setBackground(box(panel,20));
                  add(info);

                  GridLayout grid=new GridLayout(this);
                  grid.setColumnCount(3);

                  for(int i=1;i<=210;i++) {
                      final int mode=i;

                      Button b=button("MODE "+mode);
                      b.setMinHeight(75);

                      b.setOnClickListener(v->{
                          sendMode(mode);
                          Toast.makeText(this,
                                  "MODE "+mode,
                                  Toast.LENGTH_SHORT).show();
                      });

                      grid.addView(b,new ViewGroup.LayoutParams(
                              0,75));

                      GridLayout.LayoutParams lp=
                              (GridLayout.LayoutParams)b.getLayoutParams();
                      lp.width=0;
                      lp.columnSpec=GridLayout.spec(
                              GridLayout.UNDEFINED,1f);
                      b.setLayoutParams(lp);
                  }

                  add(grid);
              }

              void showCustom() {
                  page("CUSTOM STUDIO");

                  add(heading("Custom Slots"));

                  TextView info=tv(
                          "Slot 171–210\n" +
                          "Animasi disimpan di aplikasi dan dapat diedit kembali.",
                          14);
                  info.setBackground(box(panel,20));
                  add(info);

                  for(int i=171;i<=210;i++) {
                      final int slot=i;

                      Button b=button("SLOT "+slot+
                              (prefs.contains("slot_"+slot) ?
                                      "  • SAVED" : ""));

                      b.setOnClickListener(v->openEditor(slot));

                      add(b);
                  }

                  space(10);

                  Button newAnim=button("＋ CREATE NEW ANIMATION");
                  newAnim.setOnClickListener(v->openEditor(171));
                  add(newAnim);
              }

              static class Frame {
                  int lr,lg,lb;
                  int rr,rg,rb;
                  int duration;

                  Frame(int a,int b,int c,int d,int e,int f,int ms) {
                      lr=a;lg=b;lb=c;
                      rr=d;rg=e;rb=f;
                      duration=ms;
                  }

                  Frame copy() {
                      return new Frame(lr,lg,lb,rr,rg,rb,duration);
                  }
              }

              ArrayList<Frame> frames=new ArrayList<>();
              int editSlot=171;

              void openEditor(int slot) {
                  editSlot=slot;
                  loadSlot(slot);

                  showEditor();
              }

              void showEditor() {
                  page("ANIMATION STUDIO");

                  add(heading("SLOT "+editSlot));

                  TextView info=tv(
                          "Buat animasi secara bebas.\n" +
                          "Setiap frame memiliki warna LEFT dan RIGHT sendiri.",
                          14);
                  info.setBackground(box(panel,20));
                  add(info);

                  add(heading("Output"));

                  LinearLayout target=new LinearLayout(this);

                  Button both=button("BOTH");
                  Button left=button("LEFT");
                  Button right=button("RIGHT");

                  target.addView(both,new LinearLayout.LayoutParams(0,60,1));
                  target.addView(left,new LinearLayout.LayoutParams(0,60,1));
                  target.addView(right,new LinearLayout.LayoutParams(0,60,1));

                  add(target);

                  both.setOnClickListener(v->Toast.makeText(this,
                          "Editor mendukung LEFT + RIGHT independen",
                          Toast.LENGTH_SHORT).show());

                  left.setOnClickListener(v->Toast.makeText(this,
                          "LEFT dipilih",
                          Toast.LENGTH_SHORT).show());

                  right.setOnClickListener(v->Toast.makeText(this,
                          "RIGHT dipilih",
                          Toast.LENGTH_SHORT).show());

                  add(heading("Timeline / Frames"));

                  LinearLayout timeline=new LinearLayout(this);
                  timeline.setOrientation(LinearLayout.VERTICAL);
                  add(timeline);

                  Runnable rebuild=()->{
                      timeline.removeAllViews();

                      for(int i=0;i<frames.size();i++) {
                          final int index=i;
                          Frame f=frames.get(i);

                          LinearLayout row=new LinearLayout(this);
                          row.setOrientation(LinearLayout.VERTICAL);
                          row.setPadding(10,10,10,10);
                          row.setBackground(box(panel,18));

                          TextView head=tv(
                                  "FRAME "+(index+1)+
                                  "   "+f.duration+" ms",
                                  15);
                          head.setTypeface(null,Typeface.BOLD);
                          row.addView(head);

                          LinearLayout colors=new LinearLayout(this);

                          View lv=new View(this);
                          lv.setBackgroundColor(
                                  Color.rgb(f.lr,f.lg,f.lb));

                          View rv=new View(this);
                          rv.setBackgroundColor(
                                  Color.rgb(f.rr,f.rg,f.rb));

                          colors.addView(lv,new LinearLayout.LayoutParams(
                                  0,65,1));
                          colors.addView(rv,new LinearLayout.LayoutParams(
                                  0,65,1));

                          row.addView(colors);

                          Button edit=button("EDIT FRAME");
                          edit.setOnClickListener(v->
                                  editFrame(index,rebuild));

                          Button dup=button("DUPLICATE");
                          dup.setOnClickListener(v->{
                              frames.add(index+1,f.copy());
                              rebuild.run();
                          });

                          Button del=button("DELETE");
                          del.setOnClickListener(v->{
                              if(frames.size()>1) {
                                  frames.remove(index);
                                  rebuild.run();
                              }
                          });

                          LinearLayout actions=new LinearLayout(this);
                          actions.addView(edit,new LinearLayout.LayoutParams(
                                  0,58,1));
                          actions.addView(dup,new LinearLayout.LayoutParams(
                                  0,58,1));
                          actions.addView(del,new LinearLayout.LayoutParams(
                                  0,58,1));

                          row.addView(actions);

                          timeline.addView(row,new LinearLayout.LayoutParams(
                                  -1,LinearLayout.LayoutParams.WRAP_CONTENT));

                          spaceIn(timeline,8);
                      }
                  };

                  rebuild.run();

                  Button addFrame=button("＋ ADD FRAME");
                  addFrame.setOnClickListener(v->{
                      frames.add(new Frame(
                              255,0,0,
                              0,0,255,
                              300));
                      rebuild.run();
                  });

                  add(addFrame);

                  space(8);

                  add(heading("Generator Tools"));

                  LinearLayout gen=new LinearLayout(this);

                  Button stripe=button("STRIPE");
                  Button chase=button("CHASE");
                  Button rainbow=button("RAINBOW");

                  gen.addView(stripe,new LinearLayout.LayoutParams(0,60,1));
                  gen.addView(chase,new LinearLayout.LayoutParams(0,60,1));
                  gen.addView(rainbow,new LinearLayout.LayoutParams(0,60,1));

                  add(gen);

                  stripe.setOnClickListener(v->{
                      generateStripe();
                      rebuild.run();
                  });

                  chase.setOnClickListener(v->{
                      generateChase();
                      rebuild.run();
                  });

                  rainbow.setOnClickListener(v->{
                      generateRainbow();
                      rebuild.run();
                  });

                  space(8);

                  Button preview=button("▶ PREVIEW ANIMATION");
                  preview.setOnClickListener(v->showPreview());
                  add(preview);

                  Button save=button("SAVE SLOT "+editSlot);
                  save.setOnClickListener(v->{
                      saveSlot(editSlot);
                      Toast.makeText(this,
                              "Animation saved",
                              Toast.LENGTH_SHORT).show();
                  });
                  add(save);

                  Button send=button("SEND / TEST LED");
                  send.setOnClickListener(v->playToLED());
                  add(send);

                  Button back=button("BACK TO CUSTOM");
                  back.setOnClickListener(v->showCustom());
                  add(back);
              }

              void spaceIn(LinearLayout l,int h) {
                  Space s=new Space(this);
                  l.addView(s,new LinearLayout.LayoutParams(1,h));
              }

              void editFrame(int index,Runnable rebuild) {
                  Frame f=frames.get(index);

                  LinearLayout box=new LinearLayout(this);
                  box.setOrientation(LinearLayout.VERTICAL);
                  box.setPadding(25,20,25,20);

                  TextView h=tv("EDIT FRAME "+(index+1),20);
                  box.addView(h);

                  TextView lh=tv("LEFT COLOR",16);
                  box.addView(lh);

                  ColorWheel wheel=new ColorWheel(this);
                  box.addView(wheel,new LinearLayout.LayoutParams(-1,320));

                  SeekBar hue=new SeekBar(this);
                  hue.setMax(360);
                  box.addView(hue);

                  TextView hex=tv("#FF0000",15);
                  box.addView(hex);

                  TextView rh=tv("RIGHT COLOR",16);
                  box.addView(rh);

                  EditText r=number(f.lr);
                  EditText g=number(f.lg);
                  EditText b=number(f.lb);

                  LinearLayout rgb=new LinearLayout(this);
                  rgb.addView(r,new LinearLayout.LayoutParams(0,60,1));
                  rgb.addView(g,new LinearLayout.LayoutParams(0,60,1));
                  rgb.addView(b,new LinearLayout.LayoutParams(0,60,1));
                  box.addView(rgb);

                  TextView durationText=
                          tv("Duration: "+f.duration+" ms",14);
                  box.addView(durationText);

                  SeekBar duration=new SeekBar(this);
                  duration.setMax(1950);
                  duration.setProgress(
                          Math.max(50,f.duration)-50);
                  box.addView(duration);

                  duration.setOnSeekBarChangeListener(
                          new SeekBar.OnSeekBarChangeListener(){
                      public void onProgressChanged(
                              SeekBar s,int p,boolean from) {
                          f.duration=50+p;
                          durationText.setText(
                                  "Duration: "+f.duration+" ms");
                      }
                      public void onStartTrackingTouch(SeekBar s){}
                      public void onStopTrackingTouch(SeekBar s){}
                  });

                  wheel.listener=(rr,gg,bb)->{
                      r.setText(""+rr);
                      g.setText(""+gg);
                      b.setText(""+bb);
