name: Build LEDDMX Pro

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build LEDDMX Pro APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 7.6.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.6.1'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: |
          set -e
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2"

      - name: Create clean project
        shell: bash
        run: |
          set -e

          rm -rf LEDDMX-Pro
          mkdir -p LEDDMX-Pro/app/src/main/java/com/leddmx/pro
          mkdir -p LEDDMX-Pro/app/src/main/res/drawable
          mkdir -p LEDDMX-Pro/app/src/main/res/mipmap-hdpi
          mkdir -p LEDDMX-Pro/app/src/main/res/values

          cat > LEDDMX-Pro/settings.gradle <<'EOF'
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = "LEDDMX-Pro"
include(":app")
EOF

          cat > LEDDMX-Pro/build.gradle <<'EOF'
plugins {
    id 'com.android.application' version '7.4.2' apply false
}
EOF

          cat > LEDDMX-Pro/gradle.properties <<'EOF'
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=false
android.enableJetifier=false
EOF

          cat > LEDDMX-Pro/app/build.gradle <<'EOF'
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.leddmx.pro'
    compileSdk 33

    defaultConfig {
        applicationId 'com.leddmx.pro'
        minSdk 21
        targetSdk 33
        versionCode 1
        versionName '1.0-FINAL'
    }

    buildTypes {
        debug {
            minifyEnabled false
            shrinkResources false
        }

        release {
            minifyEnabled false
            shrinkResources false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}
EOF

          cat > LEDDMX-Pro/app/src/main/res/values/colors.xml <<'EOF'
<resources>
    <color name="black">#05070A</color>
    <color name="white">#FFFFFF</color>
</resources>
EOF

          cat > LEDDMX-Pro/app/src/main/res/values/strings.xml <<'EOF'
<resources>
    <string name="app_name">LEDDMX Pro</string>
</resources>
EOF

          cat > LEDDMX-Pro/app/src/main/AndroidManifest.xml <<'EOF'
<manifest xmlns:android="http://schemas.android.com/apk/res/android">

    <uses-feature
        android:name="android.hardware.bluetooth_le"
        android:required="false" />

    <uses-permission android:name="android.permission.BLUETOOTH" />
    <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" />

    <uses-permission
        android:name="android.permission.BLUETOOTH_SCAN"
        android:usesPermissionFlags="neverForLocation" />

    <uses-permission
        android:name="android.permission.BLUETOOTH_CONNECT" />

    <uses-permission
        android:name="android.permission.ACCESS_FINE_LOCATION" />

    <application
        android:allowBackup="false"
        android:label="LEDDMX Pro"
        android:theme="@style/AppTheme"
        android:supportsRtl="true">

        <activity
            android:name=".MainActivity"
            android:screenOrientation="portrait"
            android:exported="true">

            <intent-filter>
                <action android:name="android.intent.action.MAIN" />
                <category android:name="android.intent.category.LAUNCHER" />

            </intent-filter>

        </activity>

    </application>

</manifest>
EOF

          cat > LEDDMX-Pro/app/src/main/res/values/styles.xml <<'EOF'
<resources>

    <style name="AppTheme"
        parent="android:style/Theme.Material.NoActionBar">

        <item name="android:fontFamily">sans</item>
        <item name="android:windowLightStatusBar">false</item>
        <item name="android:statusBarColor">#05070A</item>
        <item name="android:navigationBarColor">#05070A</item>
        <item name="android:colorAccent">#28D760</item>
        <item name="android:windowActionModeOverlay">true</item>

    </style>

</resources>
EOF

      - name: Write MainActivity
        shell: bash
        run: |
          set -e

          cat > LEDDMX-Pro/app/src/main/java/com/leddmx/pro/MainActivity.java <<'EOF'
