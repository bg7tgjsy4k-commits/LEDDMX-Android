              private void showColorPickerForFrame(
                      int index,
                      boolean left
              ) {

                  if (index < 0
                          ||
                          index >= timelineFrames.size()) {
                      return;
                  }

                  final AnimFrame frame =
                          timelineFrames.get(
                                  index
                          );

                  ColorWheelView wheel =
                          new ColorWheelView(
                                  this
                          );

                  wheel.setColor(
                          left
                                  ? frame.leftColor
                                  : frame.rightColor
                  );

                  new android.app.AlertDialog.Builder(
                          this
                  )
                          .setTitle(
                                  left
                                          ? "FRAME LEFT"
                                          : "FRAME RIGHT"
                          )
                          .setView(wheel)
                          .setPositiveButton(
                                  "APPLY",
                                  (d, w) -> {

                                      if (left) {
                                          frame.leftColor =
                                                  wheel.getColor();
                                      } else {
                                          frame.rightColor =
                                                  wheel.getColor();
                                      }

                                      showEditorScreen();
                                  }
                          )
                          .setNegativeButton(
                                  "CANCEL",
                                  null
                          )
                          .show();
              }

