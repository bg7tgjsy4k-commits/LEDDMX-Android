name: LEDDMX-Pro-v40

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 7.6.1
        run: |
          set -e
          wget -q https://services.gradle.org/distributions/gradle-7.6.1-bin.zip
          unzip -q gradle-7.6.1-bin.zip -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-7.6.1/bin" >> "$GITHUB_PATH"

      - name: Generate Android project
        shell: bash
        run: |
          set -e

          mkdir -p app/src/main/java/com/leddmx/pro
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "LEDDMX-Pro-v40"

          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '7.4.2' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=false
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.leddmx.pro'

              compileSdk 33

              defaultConfig {
                  applicationId 'com.leddmx.pro'

                  minSdk 21
                  targetSdk 33

                  versionCode 40
                  versionName '40.0'
              }
          }
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>

              <style
                  name="AppTheme"
                  parent="android:style/Theme.Material.NoActionBar">

                  <item name="android:fontFamily">
                      sans
                  </item>

                  <item name="android:colorAccent">
                      #00E5FF
                  </item>

                  <item name="android:navigationBarColor">
                      #000000
                  </item>

                  <item name="android:statusBarColor">
                      #000000
                  </item>

                  <item name="android:windowLightStatusBar">
                      false
                  </item>

              </style>

          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission
                  android:name="android.permission.BLUETOOTH"
                  android:maxSdkVersion="30" />

              <uses-permission
                  android:name="android.permission.BLUETOOTH_ADMIN"
                  android:maxSdkVersion="30" />

              <uses-permission
                  android:name="android.permission.ACCESS_FINE_LOCATION"
                  android:maxSdkVersion="30" />

              <uses-permission
                  android:name="android.permission.BLUETOOTH_SCAN"
                  android:usesPermissionFlags="neverForLocation" />

              <uses-permission
                  android:name="android.permission.BLUETOOTH_CONNECT" />

              <application
                  android:theme="@style/AppTheme"
                  android:label="LEDDMX Pro"
                  android:allowBackup="false">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>

                          <action
                              android:name="android.intent.action.MAIN" />

                          <category
                              android:name="android.intent.category.LAUNCHER" />

                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          # ==========================================================
          # AMBIL DAFTAR MODE LEDDMX-00 ASLI
          # ==========================================================

          wget -qO PatternList.kt \
            https://raw.githubusercontent.com/user154lt/LEDDMX-00/main/PatternList.kt

          python3 - <<'PY'
          import re

          src = open(
              "PatternList.kt",
              encoding="utf-8"
          ).read()

          values = re.findall(
              r'"((?:[^"\\]|\\.)*)"',
              src
          )

          values = [
              bytes(v, "utf-8").decode(
                  "unicode_escape"
              )
              for v in values
          ]

          values = values[:211]

          with open(
              "/tmp/modes.txt",
              "w",
              encoding="utf-8"
          ) as f:

              for i, value in enumerate(values):

                  value = (
                      value
                      .replace("\\", "\\\\")
                      .replace('"', '\\"')
                  )

                  comma = "," if i < len(values) - 1 else ""

                  f.write(
                      '        "' +
                      value +
                      '"' +
                      comma +
                      "\n"
                  )

          PY

          # ==========================================================
          # MAIN ACTIVITY
          # ==========================================================

          cat > app/src/main/java/com/leddmx/pro/MainActivity.java <<'EOF'
          package com.leddmx.pro;

          import android.Manifest;
          import android.app.*;
          import android.bluetooth.*;
          import android.bluetooth.le.*;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.os.*;
          import android.widget.*;

          import java.util.*;
          import java.util.UUID;


          public class MainActivity
                  extends Activity {


              // ======================================================
              // LEDDMX BLE
              // ======================================================

              static final UUID SVC =
                      UUID.fromString(
                              "0000FFE0-0000-1000-8000-00805F9B34FB"
                      );


              static final UUID CH =
                      UUID.fromString(
                              "0000FFE1-0000-1000-8000-00805F9B34FB"
                      );


              // ======================================================
              // POSSIBLE OTA SERVICE
              // ======================================================

              static final UUID OTA =
                      UUID.fromString(
                              "5833FF01-9B8B-5191-6142-22A4536EF123"
                      );


              BluetoothAdapter bluetoothAdapter;

              BluetoothLeScanner scanner;

              BluetoothGatt gatt;

              BluetoothGattCharacteristic writeCharacteristic;


              Handler handler =
                      new Handler(
                              Looper.getMainLooper()
                      );


              ArrayDeque<byte[]> queue =
                      new ArrayDeque<>();


              ArrayList<BluetoothDevice> devices =
                      new ArrayList<>();


              ArrayList<String> names =
                      new ArrayList<>();


              ArrayAdapter<String> deviceAdapter;


              Spinner deviceSpinner;

              Spinner modeSpinner;


              TextView status;


              EditText rgb;

              EditText custom;

              EditText raw;


              boolean scanning = false;

              boolean writing = false;


              long lastScan = 0;


              // ======================================================
              // EXACT 0-210 LIST WILL BE INSERTED DURING BUILD
              // ======================================================

              final String[] modes = {

          __MODES__

              };


              final String[] customModes = {

                  "GD - Gradual",
                  "FD - Fade",
                  "FW - Forward",
                  "FS - Flash",
                  "AC - Off",
                  "PU - Pulse",
                  "FL - Flutter",
                  "HO - Hop"

              };


              // ======================================================
              // BASIC UI
              // ======================================================

              TextView text(
                      String value
              ) {

                  TextView t =
                          new TextView(this);

                  t.setText(value);

                  t.setTextColor(
                          Color.WHITE
                  );

                  t.setTextSize(14);

                  t.setPadding(
