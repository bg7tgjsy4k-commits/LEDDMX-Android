                  body.addView(send);

                  Button copy =
                          button(
                                  "COPY TERMINAL");

                  copy.setOnClickListener(
                          v -> {

                              ClipboardManager cm =
                                      (ClipboardManager)
                                              getSystemService(
                                                      CLIPBOARD_SERVICE);

                              if(cm!=null) {

                                  cm.setPrimaryClip(
                                          ClipData.newPlainText(
                                                  "LEDDMX",
