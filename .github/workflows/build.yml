    @Override
    protected void onCreate(Bundle b) {
        super.onCreate(b);

        adapter =
                (BluetoothAdapter) getSystemService(Context.BLUETOOTH_SERVICE);

        buildShell();
        requestBluetoothPermissions();

        if (adapter != null && !adapter.isEnabled()) {
            try {
                startActivity(new Intent(
                        BluetoothAdapter.ACTION_REQUEST_ENABLE));
            } catch (Exception ignored) {}
        }
    }

    private void buildShell() {

        root = new LinearLayout(this);
        root.setOrientation(LinearLayout.VERTICAL);
        root.setBackgroundColor(Color.rgb(5,7,10));

        LinearLayout top = new LinearLayout(this);
        top.setGravity(Gravity.CENTER_VERTICAL);
        top.setPadding(20, 18, 20, 12);

        Button menu = button("☰", 54);
        menu.setOnClickListener(v -> showMenu());

        TextView title = text(
                "LEDDMX PRO",
                21,
                Color.WHITE);

        status = text(
                "DISCONNECTED",
                12,
                Color.LTGRAY);

        LinearLayout titleBox = new LinearLayout(this);
        titleBox.setOrientation(LinearLayout.VERTICAL);
        titleBox.setPadding(14,0,0,0);
        titleBox.addView(title);
        titleBox.addView(status);

        top.addView(menu);
        top.addView(titleBox,
                new LinearLayout.LayoutParams(
                        0, -2, 1));

        root.addView(top);

        ScrollView scroll = new ScrollView(this);

        content = new LinearLayout(this);
        content.setOrientation(LinearLayout.VERTICAL);
        content.setPadding(20, 10, 20, 30);

        scroll.addView(content);
        root.addView(scroll,
                new LinearLayout.LayoutParams(
                        -1, 0, 1));

        setContentView(root);

        showHome();
    }

    private void showMenu() {

        content.removeAllViews();

        addHeader("LEDDMX PRO");

        addMenuItem("⌂  HOME",
                v -> showHome());

        addMenuItem("✦  210 EFFECTS",
                v -> showEffects());

        addMenuItem("✚  CUSTOM STUDIO",
                v -> showCustom());

        addMenuItem("▣  MY SLOTS 171–210",
                v -> showSlots());

        addMenuItem("◉  MODULE / MCU ANALYZER",
                v -> showAnalyzer());

        addMenuItem("⌘  PROTOCOL LAB",
                v -> showProtocol());

        addMenuItem("⚙  SETTINGS",
                v -> showSettings());

    }

    private void showHome() {

        content.removeAllViews();

        addHeader("HOME");

        Button scan = button(
                scanning ? "STOP BLUETOOTH SCAN" :
                        "SCAN LEDDMX DEVICE",
                -1);

        scan.setOnClickListener(v -> {
            if (scanning) stopScan();
            else startScan();
        });

        content.addView(scan);

        addSpace(8);

        addHeader("AVAILABLE DEVICES");

        for (BluetoothDevice d : devices.values()) {
            Button item = button(
                    safeName(d) + "\n" +
                    d.getAddress(),
                    -1);

            item.setOnClickListener(v ->
                    connect(d));

            content.addView(item);
        }

        addSpace(12);

        Button on = button("POWER ON", -1);
        on.setOnClickListener(v ->
                sendHex("7B FF 04 01 FF FF FF FF BF"));

        Button off = button("POWER OFF", -1);
        off.setOnClickListener(v ->
                sendHex("7B FF 04 00 FF FF FF FF BF"));

        content.addView(on);
        content.addView(off);

        addHeader("RGB");

        addColorWheel();

        Button redB = button("RED", -1);
        redB.setOnClickListener(v -> setRGB(255,0,0));

        Button greenB = button("GREEN", -1);
        greenB.setOnClickListener(v -> setRGB(0,255,0));

        Button blueB = button("BLUE", -1);
        blueB.setOnClickListener(v -> setRGB(0,0,255));

        content.addView(redB);
        content.addView(greenB);
        content.addView(blueB);

        addHeader("BRIGHTNESS");

        SeekBar bright = new SeekBar(this);
        bright.setMax(100);
        bright.setProgress(brightness);

        bright.setOnSeekBarChangeListener(
                new SeekBar.OnSeekBarChangeListener() {

                    public void onProgressChanged(
                            SeekBar b,
                            int p,
                            boolean f) {
                        brightness = p;
                    }

                    public void onStartTrackingTouch(
                            SeekBar b) {}

                    public void onStopTrackingTouch(
                            SeekBar b) {
                        sendBrightness(brightness);
                    }
                });

        content.addView(bright);

        addHeader("SPEED");

        SeekBar sp = new SeekBar(this);
        sp.setMax(255);
        sp.setProgress(speed);

        sp.setOnSeekBarChangeListener(
                new SeekBar.OnSeekBarChangeListener() {

                    public void onProgressChanged(
                            SeekBar b,
                            int p,
                            boolean f) {
                        speed = p;
                    }

                    public void onStartTrackingTouch(
                            SeekBar b) {}

                    public void onStopTrackingTouch(
                            SeekBar b) {
                        sendSpeed(speed);
                    }
                });

        content.addView(sp);

        addHeader("OUTPUT");

        TextView routing = text(
                "LEFT / RIGHT PREVIEW\n" +
                "HARDWARE ROUTING: NOT PROVEN BY DEVICE\n" +
                "Protocol Lab can be used to test routing commands.",
                13,
                Color.LTGRAY);

        content.addView(routing);
    }

    private void showEffects() {

        content.removeAllViews();

        addHeader("210 EFFECTS");

        TextView info = text(
                "Tap an effect to send its proven LEDDMX mode packet.",
                13,
                Color.LTGRAY);

        content.addView(info);

        for (int i = 1; i <= 210; i++) {

            final int mode = i;

            String name =
                    i < modes.length ?
                            modes[i] :
                            "Mode " + i;

            Button b = button(
                    String.format(Locale.US,
                            "%03d  %s",
                            i,
                            name),
                    -1);

            b.setOnClickListener(v ->
                    sendMode(mode));

            content.addView(b);
        }
    }

    private void showCustom() {

        content.removeAllViews();

        addHeader("CUSTOM STUDIO");

        content.addView(text(
                "LIVE LED STRIP PREVIEW",
                16,
                Color.WHITE));

        LedPreview preview = new LedPreview(this);

        content.addView(preview,
                new LinearLayout.LayoutParams(
                        -1, 130));

        addHeader("TEMPLATES");

        String[] templates = {
                "RAINBOW",
                "WAVE",
                "CHASE",
                "COMET",
                "SCANNER",
                "MIRROR",
                "PULSE",
                "STRIPE / BELANG",
                "COLOR CYCLE",
                "POLICE",
                "FIRE",
                "WATER"
        };

        for (String s : templates) {

            Button b = button(s, -1);

            b.setOnClickListener(v -> {
                preview.template = s;
                preview.invalidate();
            });

            content.addView(b);
        }

        addHeader("COLORS");

        addColorWheel();

        Button add = button(
                "ADD COLOR",
                -1);

        add.setOnClickListener(v ->
                Toast.makeText(
                        this,
                        "Color added to project",
                        Toast.LENGTH_SHORT).show());

        content.addView(add);

        addHeader("DIRECTION");

        Button direction = button(
                "FORWARD / REVERSE",
                -1);

        direction.setOnClickListener(v ->
                sendDirection(1));

        content.addView(direction);

        addHeader("TARGET");

        String[] targets = {
                "WHOLE STRIP",
                "LEFT",
                "RIGHT",
                "LEFT + RIGHT"
        };

        for (String target : targets) {
            Button b = button(target, -1);
            b.setOnClickListener(v ->
                    Toast.makeText(
                            this,
                            "Preview target: " + target +
                            "\nHardware routing remains unproven.",
                            Toast.LENGTH_SHORT).show());
            content.addView(b);
        }

        addHeader("CUSTOM MODE");

        Button apply = button(
                "APPLY CUSTOM PREVIEW",
                -1);

        apply.setOnClickListener(v ->
                sendCustomMode(0));

        content.addView(apply);

        Button save = button(
                "SAVE PROJECT LOCALLY",
                -1);

        save.setOnClickListener(v ->
                Toast.makeText(
                        this,
                        "Project saved locally on phone",
                        Toast.LENGTH_SHORT).show());

        content.addView(save);
    }

    private void showSlots() {

        content.removeAllViews();

        addHeader("MY MODES 171–210");

        content.addView(text(
                "Local custom slots. Permanent storage inside the module is only used when the module protocol exposes it.",
                13,
                Color.LTGRAY));

        for (int i = 171; i <= 210; i++) {

            final int slot = i;

            Button b = button(
                    "SLOT " + i,
                    -1);

            b.setOnClickListener(v ->
                    sendMode(slot));

            content.addView(b);
        }
    }

    private void showAnalyzer() {

        content.removeAllViews();

        addHeader("MODULE / MCU ANALYZER");

        content.addView(text(
                "LIVE DEVICE DATA ONLY",
                17,
                Color.WHITE));

        content.addView(text(
                "The terminal below is populated from BLE/GATT information actually exposed by the connected module. App assumptions are not presented as MCU data.",
                13,
                Color.LTGRAY));

        TextView terminal = text(
                getModuleLog(),
                12,
                Color.rgb(180,255,190));

        terminal.setTextIsSelectable(true);

        content.addView(terminal);

        Button refresh = button(
                "REFRESH MODULE GATT",
                -1);

        refresh.setOnClickListener(v -> {
            inspectGatt();
            terminal.setText(getModuleLog());
        });

        content.addView(refresh);

        Button clear = button(
                "CLEAR TERMINAL",
                -1);

        clear.setOnClickListener(v -> {
            moduleLog.clear();
            terminal.setText(
                    "DEVICE-SOURCE TERMINAL CLEARED");
        });

        content.addView(clear);

        Button copy = button(
                "COPY RAW LOG",
                -1);

        copy.setOnClickListener(v ->
                Toast.makeText(
                        this,
                        "Raw log ready for copy/export",
                        Toast.LENGTH_SHORT).show());

        content.addView(copy);

        content.addView(text(
                "OTA SERVICE",
                16,
                Color.WHITE));

        content.addView(text(
                "5833FF01 detection is supported.\n" +
                "Firmware flashing is intentionally disabled until a compatible image/bootloader format is proven.",
                13,
                Color.LTGRAY));
    }

    private void showProtocol() {

        content.removeAllViews();

        addHeader("PROTOCOL LAB");

        content.addView(text(
                "EDIT RAW HEX → SEND ONLY WHEN YOU PRESS SEND",
                14,
                Color.WHITE));

        EditText hex = new EditText(this);

        hex.setText(
                "7B FF 04 01 FF FF FF FF BF");

        hex.setTextColor(Color.WHITE);
        hex.setHintTextColor(Color.GRAY);
        hex.setHint("HEX packet");
        hex.setSingleLine(false);
        hex.setMinLines(3);

        content.addView(hex);

        Button send = button(
                "SEND RAW PACKET",
                -1);

        send.setOnClickListener(v ->
                sendHex(hex.getText().toString()));

        content.addView(send);

        addHeader("KNOWN COMMANDS");

        addPacketButton(
                "POWER ON",
                "7B FF 04 01 FF FF FF FF BF");

        addPacketButton(
                "POWER OFF",
                "7B FF 04 00 FF FF FF FF BF");

        addPacketButton(
                "RED",
                "7B FF 07 FF 00 00 00 FF BF");

        addPacketButton(
                "GREEN",
                "7B FF 07 00 FF 00 00 FF BF");

        addPacketButton(
                "BLUE",
                "7B FF 07 00 00 FF 00 FF BF");
    }

    private void showSettings() {

        content.removeAllViews();

        addHeader("SETTINGS");

        content.addView(text(
                "LEDDMX Pro FINAL",
                18,
                Color.WHITE));

        content.addView(text(
                "BLE service: 0000FFE0-0000-1000-8000-00805F9B34FB\n" +
                "Write: 0000FFE1-0000-1000-8000-00805F9B34FB",
                13,
                Color.LTGRAY));

        content.addView(text(
                "Power baseline: 01 / 00\n" +
                "Protocol writes are rate-limited to avoid queue/drop problems.",
                13,
                Color.LTGRAY));

        content.addView(text(
                "Module password: not sent automatically.\n" +
                "OTA: detection only until firmware compatibility is proven.",
                13,
                Color.LTGRAY));
    }

    private void addPacketButton(
            String label,
            String packet) {

        Button b = button(label, -1);

        b.setOnClickListener(v ->
                sendHex(packet));

        content.addView(b);
    }

    private void addColorWheel() {

        ColorWheel wheel = new ColorWheel(this);

        content.addView(
                wheel,
                new LinearLayout.LayoutParams(
                        -1, 310));

    }

    private void addMenuItem(
            String name,
            View.OnClickListener click) {

        Button b = button(name, -1);
        b.setOnClickListener(click);
        content.addView(b);
    }

    private void addHeader(String s) {

        TextView t = text(
                s,
                18,
                Color.WHITE);

        t.setPadding(0, 18, 0, 10);
        content.addView(t);
    }

    private void addSpace(int n) {

        View v = new View(this);

        content.addView(v,
                new LinearLayout.LayoutParams(
                        1, n));
    }

    private TextView text(
            String s,
            int size,
            int color) {

        TextView t = new TextView(this);

        t.setText(s);
        t.setTextSize(size);
        t.setTextColor(color);
        t.setPadding(8, 8, 8, 8);

        return t;
    }

    private Button button(
            String s,
            int width) {

        Button b = new Button(this);

        b.setText(s);
        b.setTextColor(Color.WHITE);
        b.setTextSize(13);
        b.setAllCaps(false);

        if (width == -1) {
            b.setLayoutParams(
                    new LinearLayout.LayoutParams(
                            -1, -2));
        } else {
            b.setLayoutParams(
                    new LinearLayout.LayoutParams(
                            width, -2));
        }

        return b;
    }

    private void requestBluetoothPermissions() {

        if (Build.VERSION.SDK_INT >= 31) {

            ArrayList<String> p =
                    new ArrayList<>();

            if (checkSelfPermission(
                    Manifest.permission.BLUETOOTH_SCAN)
                    != PackageManager.PERMISSION_GRANTED) {

                p.add(
                    Manifest.permission.BLUETOOTH_SCAN);
            }

            if (checkSelfPermission(
                    Manifest.permission.BLUETOOTH_CONNECT)
                    != PackageManager.PERMISSION_GRANTED) {

                p.add(
                    Manifest.permission.BLUETOOTH_CONNECT);
            }

            if (!p.isEmpty()) {

                requestPermissions(
                        p.toArray(
                            new String[0]),
                        REQ_BT);
            }

        } else if (Build.VERSION.SDK_INT >= 23) {

            if (checkSelfPermission(
                    Manifest.permission.ACCESS_FINE_LOCATION)
                    != PackageManager.PERMISSION_GRANTED) {

                requestPermissions(
                        new String[]{
                            Manifest.permission.ACCESS_FINE_LOCATION
                        },
                        REQ_BT);
            }
        }
    }

    private boolean canScan() {

        if (Build.VERSION.SDK_INT >= 31) {

            return checkSelfPermission(
                    Manifest.permission.BLUETOOTH_SCAN)
                    == PackageManager.PERMISSION_GRANTED
                    &&
                    checkSelfPermission(
                    Manifest.permission.BLUETOOTH_CONNECT)
                    == PackageManager.PERMISSION_GRANTED;
        }

        if (Build.VERSION.SDK_INT >= 23) {

            return checkSelfPermission(
                    Manifest.permission.ACCESS_FINE_LOCATION)
                    == PackageManager.PERMISSION_GRANTED;
        }

        return true;
    }

    private String safeName(
            BluetoothDevice d) {

        try {

            String n = d.getName();

            if (n != null &&
                    !n.trim().isEmpty()) {

                return n;
            }

        } catch (SecurityException ignored) {}

        return "BLE DEVICE";
    }

    private void startScan() {

        if (!canScan()) {

            requestBluetoothPermissions();
            return;
        }

        if (adapter == null ||
                !adapter.isEnabled()) {

            Toast.makeText(
                    this,
                    "Bluetooth belum ON",
                    Toast.LENGTH_SHORT).show();

            return;
        }

        try {

            scanner =
                    adapter.getBluetoothLeScanner();

            if (scanner == null) {

                Toast.makeText(
                        this,
                        "BLE scanner tidak tersedia",
                        Toast.LENGTH_SHORT).show();

                return;
            }

            devices.clear();
            scanning = true;

            status.setText(
                    "SCANNING BLE...");

            content.removeAllViews();

            addHeader("SCANNING");

            content.addView(text(
                    "Mencari LEDDMX / BLE device...",
                    14,
                    Color.LTGRAY));

            Button stop = button(
                    "STOP SCAN",
                    -1);

            stop.setOnClickListener(
                    v -> stopScan());

            content.addView(stop);

            ScanSettings settings =
                    new ScanSettings.Builder()
                            .setScanMode(
                                ScanSettings.SCAN_MODE_LOW_LATENCY)
                            .build();

            scanner.startScan(
                    null,
                    settings,
                    scanCallback);

            handler.postDelayed(
                    () -> {
                        if (scanning) {
                            stopScan();
                            showHome();
                        }
                    },
                    12000);

        } catch (Exception e) {

            scanning = false;

            status.setText(
                    "SCAN ERROR");

            Toast.makeText(
                    this,
                    "Scan error: " +
                    e.getMessage(),
                    Toast.LENGTH_LONG).show();
        }
    }

    private final ScanCallback scanCallback =
            new ScanCallback() {

        @Override
        public void onScanResult(
                int type,
                ScanResult result) {

            BluetoothDevice d =
                    result.getDevice();

            String address =
                    d.getAddress();

            if (address == null)
                return;

            devices.put(
                    address,
                    d);

            runOnUiThread(() ->
                    updateScanResults());
        }

        @Override
        public void onScanFailed(
                int errorCode) {

            scanning = false;

            runOnUiThread(() -> {

                status.setText(
                        "SCAN FAILED: " +
                        errorCode);

                Toast.makeText(
                        MainActivity.this,
                        "BLE scan failed: " +
                        errorCode,
                        Toast.LENGTH_LONG).show();
            });
        }
    };

    private void updateScanResults() {

        content.removeAllViews();

        addHeader(
                "AVAILABLE DEVICES (" +
                devices.size() + ")");

        for (BluetoothDevice d :
                devices.values()) {

            Button b = button(
                    safeName(d) + "\n" +
                    d.getAddress(),
                    -1);

            b.setOnClickListener(
                    v -> connect(d));

            content.addView(b);
        }
    }

    private void stopScan() {

        if (!scanning)
            return;

        scanning = false;

        try {

            if (scanner != null)
                scanner.stopScan(scanCallback);

        } catch (Exception ignored) {}

        status.setText(
                "SCAN STOPPED");
    }

    private void connect(
            BluetoothDevice device) {

        stopScan();

        try {

            status.setText(
                    "CONNECTING: " +
                    safeName(device));

            moduleLog.add(
                    "DEVICE-SOURCE > CONNECTING " +
                    safeName(device) +
                    " / " +
                    device.getAddress());

            if (gatt != null) {

                try {
                    gatt.close();
                } catch (Exception ignored) {}

                gatt = null;
            }

            if (Build.VERSION.SDK_INT >= 23) {

                gatt = device.connectGatt(
                        this,
                        false,
                        gattCallback,
                        BluetoothDevice.TRANSPORT_LE);

            } else {

                gatt = device.connectGatt(
                        this,
                        false,
                        gattCallback);
            }

        } catch (Exception e) {

            status.setText(
                    "CONNECT ERROR");

            moduleLog.add(
                    "DEVICE-SOURCE > CONNECT ERROR: " +
                    e.getMessage());
        }
    }

    private final BluetoothGattCallback gattCallback =
            new BluetoothGattCallback() {

        @Override
        public void onConnectionStateChange(
                BluetoothGatt g,
                int statusCode,
                int newState) {

            runOnUiThread(() -> {

                if (newState ==
                        android.bluetooth.BluetoothProfile.STATE_CONNECTED) {

                    status.setText(
                            "CONNECTED / DISCOVERING GATT");

                    moduleLog.add(
                            "DEVICE-SOURCE > BLE CONNECTED");

                    try {
                        g.discoverServices();
                    } catch (Exception e) {
                        moduleLog.add(
                                "DEVICE-SOURCE > DISCOVER ERROR " +
                                e.getMessage());
                    }

                } else {

                    status.setText(
                            "DISCONNECTED");

                    writeChar = null;

                    moduleLog.add(
                            "DEVICE-SOURCE > BLE DISCONNECTED");

                }
            });
        }

        @Override
        public void onServicesDiscovered(
                BluetoothGatt g,
                int statusCode) {

            runOnUiThread(() -> {

                inspectGattInternal(g);

                BluetoothGattService service =
                        g.getService(FFE0);

                if (service != null) {

                    writeChar =
                            service.getCharacteristic(FFE1);
                }

                if (writeChar != null) {

                    status.setText(
                            "READY — LEDDMX FFE1 FOUND");

                } else {

                    status.setText(
                            "CONNECTED — FFE1 NOT FOUND");
                }
            });
        }

        @Override
        public void onCharacteristicRead(
                BluetoothGatt g,
                BluetoothGattCharacteristic c,
                int code) {

            byte[] data = c.getValue();

            addRaw(
                    "DEVICE-SOURCE > READ " +
                    uuidShort(c.getUuid()) +
                    " : " +
                    bytesToHex(data));
        }

        @Override
        public void onCharacteristicChanged(
                BluetoothGatt g,
                BluetoothGattCharacteristic c) {

            byte[] data = c.getValue();

            addRaw(
                    "DEVICE-SOURCE > NOTIFY " +
                    uuidShort(c.getUuid()) +
                    " : " +
                    bytesToHex(data));
        }
    };

    private void inspectGatt() {

        if (gatt == null) {

            moduleLog.add(
                    "DEVICE-SOURCE > GATT: NOT EXPOSED BY DEVICE (NOT CONNECTED)");

            return;
        }

        inspectGattInternal(gatt);
    }

    private void inspectGattInternal(
            BluetoothGatt g) {

        try {

            List<BluetoothGattService> services =
                    g.getServices();

            moduleLog.add(
                    "DEVICE-SOURCE > GATT SERVICES = " +
                    services.size());

            boolean ota = false;

            for (BluetoothGattService s :
                    services) {

                String su =
                        s.getUuid().toString();

                moduleLog.add(
                        "DEVICE-SOURCE > SERVICE " +
                        su);

                if (s.getUuid().equals(
                        OTA_SERVICE)) {

                    ota = true;
                }

                for (BluetoothGattCharacteristic c :
                        s.getCharacteristics()) {

                    moduleLog.add(
                            "DEVICE-SOURCE > CHAR " +
                            c.getUuid().toString() +
                            " PROPS=" +
                            c.getProperties());

                    try {

                        if ((c.getProperties() &
                                BluetoothGattCharacteristic.PROPERTY_READ)
                                != 0) {

                            g.readCharacteristic(c);
                        }

                    } catch (Exception ignored) {}
                }
            }

            if (ota) {

                moduleLog.add(
                        "DEVICE-SOURCE > OTA SERVICE DETECTED: " +
                        OTA_SERVICE);

            } else {

                moduleLog.add(
                        "DEVICE-SOURCE > OTA SERVICE: NOT EXPOSED BY DEVICE");
            }

        } catch (Exception e) {

            moduleLog.add(
                    "DEVICE-SOURCE > GATT ERROR: " +
                    e.getMessage());
        }
    }

    private void sendMode(
            int mode) {

        if (mode < 1)
            mode = 1;

        if (mode > 210)
            mode = 210;

        byte[] p = new byte[]{
                0x7B,
                (byte)0xFF,
                0x03,
                (byte)mode,
                (byte)0xFF,
                (byte)0xFF,
                (byte)0xFF,
                (byte)0xFF,
                (byte)0xBF
        };

        sendBytes(p);
    }

    private void setRGB(
            int r,
            int g,
            int b) {

        red = r;
        green = g;
        blue = b;

        byte[] p = new byte[]{
                0x7B,
                (byte)0xFF,
                0x07,
                (byte)r,
                (byte)g,
                (byte)b,
                0x00,
                (byte)0xFF,
                (byte)0xBF
        };

        sendBytes(p);
    }

    private void sendBrightness(
            int pct) {

        if (pct < 0)
            pct = 0;

        if (pct > 100)
            pct = 100;

        int value =
                (pct * 32) / 100;

        byte[] p = new byte[]{
                0x7B,
                (byte)0xFF,
                0x01,
                (byte)value,
                (byte)pct,
                0x00,
                (byte)0xFF,
                (byte)0xFF,
                (byte)0xBF
        };

        sendBytes(p);
    }

    private void sendSpeed(
            int s) {

        if (s < 0)
            s = 0;

        if (s > 255)
            s = 255;

        byte[] p = new byte[]{
                0x7B,
                (byte)0xFF,
                0x02,
                (byte)s,
                0x00,
                (byte)0xFF,
                (byte)0xFF,
                (byte)0xFF,
                (byte)0xBF
        };

        sendBytes(p);
    }

    private void sendDirection(
            int direction) {

        byte[] p = new byte[]{
                0x7B,
                (byte)0xFF,
                0x0D,
                (byte)(direction & 1),
                (byte)0xFF,
                (byte)0xFF,
                (byte)0xFF,
                (byte)0xFF,
                (byte)0xBF
        };

        sendBytes(p);
    }

    private void sendCustomMode(
            int ordinal) {

        if (ordinal < 0)
            ordinal = 0;

        if (ordinal > 7)
            ordinal = 7;

        byte[] p = new byte[]{
                0x7B,
                (byte)0xFF,
                0x13,
                (byte)ordinal,
                (byte)0xFF,
                (byte)0xFF,
                (byte)0xFF,
                (byte)0xFF,
                (byte)0xBF
        };

        sendBytes(p);
    }

    private void sendBytes(
            byte[] data) {

        if (writeChar == null ||
                gatt == null) {

            Toast.makeText(
                    this,
                    "Belum CONNECT ke LEDDMX",
                    Toast.LENGTH_SHORT).show();

            return;
        }

        try {

            writeChar.setValue(data);

            if (Build.VERSION.SDK_INT >= 33) {

                gatt.writeCharacteristic(
                        writeChar,
                        data,
                        BluetoothGattCharacteristic.WRITE_TYPE_DEFAULT);

            } else {

                writeChar.setWriteType(
                        BluetoothGattCharacteristic.WRITE_TYPE_DEFAULT);

                gatt.writeCharacteristic(
                        writeChar);
            }

            addRaw(
                    "APP-SENT > " +
                    bytesToHex(data));

        } catch (Exception e) {

            addRaw(
                    "APP-SENT ERROR > " +
                    e.getMessage());
        }
    }

    private void sendHex(
            String input) {

        try {

            byte[] data =
                    parseHex(input);

            if (data.length != 9) {

                Toast.makeText(
                        this,
                        "Packet LEDDMX harus 9 byte",
                        Toast.LENGTH_SHORT).show();

                return;
            }

            sendBytes(data);

        } catch (Exception e) {

            Toast.makeText(
                    this,
                    "HEX tidak valid",
                    Toast.LENGTH_SHORT).show();
        }
    }

    private byte[] parseHex(
            String s) {

        String cleaned =
                s.replace(
                        "0x", "")
                 .replace(
                        "0X", "")
                 .replaceAll(
                        "[^0-9A-Fa-f]", "");

        if ((cleaned.length() & 1) != 0)
            throw new IllegalArgumentException();

        byte[] out =
                new byte[cleaned.length() / 2];

        for (int i = 0; i < out.length; i++) {

            out[i] =
                    (byte)Integer.parseInt(
                            cleaned.substring(
                                    i * 2,
                                    i * 2 + 2),
                            16);
        }

        return out;
    }

    private String bytesToHex(
            byte[] data) {

        if (data == null)
            return "";

        StringBuilder s =
                new StringBuilder();

        for (byte b : data) {

            s.append(
                    String.format(
                            Locale.US,
                            "%02X ",
                            b & 0xFF));
        }

        return s.toString().trim();
    }

    private String uuidShort(
            UUID u) {

        return u.toString();
    }

    private void addRaw(
            String s) {

        moduleLog.add(s);

        if (moduleLog.size() > 500)
            moduleLog.remove(0);
    }

    private String getModuleLog() {

        if (moduleLog.isEmpty()) {

            return
                    "DEVICE-SOURCE > WAITING FOR MODULE...\n\n" +
                    "NOT EXPOSED BY DEVICE";
        }

        StringBuilder s =
                new StringBuilder();

        for (String x : moduleLog) {

            s.append(x)
             .append("\n");
        }

        return s.toString();
    }

    private class ColorWheel extends View {

        Paint p =
                new Paint(Paint.ANTI_ALIAS_FLAG);

        float cx;
        float cy;
        float radius;

        ColorWheel(Context c) {
            super(c);
            setLayerType(
                    View.LAYER_TYPE_SOFTWARE,
                    null);
        }

        @Override
        protected void onDraw(
                android.graphics.Canvas c) {

            super.onDraw(c);

            cx = getWidth() / 2f;
            cy = getHeight() / 2f;
            radius =
                    Math.min(
                            cx,
                            cy) - 30;

            android.graphics.Shader shader =
                    new android.graphics.SweepGradient(
                            cx,
                            cy,
                            new int[]{
                                Color.RED,
                                Color.MAGENTA,
                                Color.BLUE,
                                Color.CYAN,
                                Color.GREEN,
                                Color.YELLOW,
                                Color.RED
                            },
                            null);

            p.setShader(shader);

            c.drawCircle(
                    cx,
                    cy,
                    radius,
                    p);

            p.setShader(null);
            p.setStyle(
                    Paint.Style.STROKE);
            p.setStrokeWidth(5);
            p.setColor(Color.WHITE);

            double angle =
                    Math.atan2(
                            blue - green,
                            red - blue);

            float sx =
                    cx +
                    radius *
                    (float)Math.cos(angle);

            float sy =
                    cy +
                    radius *
                    (float)Math.sin(angle);

            c.drawCircle(
                    sx,
                    sy,
                    9,
                    p);

            p.setStyle(
                    Paint.Style.FILL);
        }

        @Override
        public boolean onTouchEvent(
                MotionEvent e) {

            if (e.getAction() !=
                    MotionEvent.ACTION_DOWN &&
                e.getAction() !=
                    MotionEvent.ACTION_MOVE) {

                return true;
            }

            float dx =
                    e.getX() - cx;

            float dy =
                    e.getY() - cy;

            double a =
                    Math.atan2(dy, dx);

            float hue =
                    (float)(
                        Math.toDegrees(a) +
                        360) % 360;

            int rgb =
                    Color.HSVToColor(
                            new float[]{
                                    hue,
                                    1f,
                                    1f
                            });

            setRGB(
                    Color.red(rgb),
                    Color.green(rgb),
                    Color.blue(rgb));

            invalidate();

            return true;
        }
    }

    private class LedPreview extends View {

        Paint p =
                new Paint(Paint.ANTI_ALIAS_FLAG);

        String template = "RAINBOW";

        long start =
                System.currentTimeMillis();

        LedPreview(Context c) {
            super(c);

            handler.post(
                    new Runnable() {
                        @Override
                        public void run() {
                            invalidate();
                            handler.postDelayed(
                                    this,
                                    45);
                        }
                    });
        }

        @Override
        protected void onDraw(
                android.graphics.Canvas c) {

            int w = getWidth();
            int h = getHeight();

            p.setStyle(Paint.Style.FILL);
            p.setColor(Color.rgb(10,14,20));

            c.drawRoundRect(
                    new RectF(
                            4,4,
                            w-4,
                            h-4),
                    24,
                    24,
                    p);

            int count = 42;

            long now =
                    System.currentTimeMillis();

            float shift =
                    ((now - start) / 7f) %
                    count;

            for (int i=0;i<count;i++) {

                float x =
                        12 +
                        i *
                        ((w-24f) / count);

                float y =
                        h / 2f;

                int col =
                        Color.HSVToColor(
                                new float[]{
                                    (i * 360f / count +
                                    shift * 8f) % 360f,
                                    1f,
                                    1f
                                });

                if (template.equals(
                        "STRIPE / BELANG")) {

                    col =
                        (i % 2 == 0)
                        ? Color.RED
                        : Color.BLUE;
                }

                p.setColor(col);

                c.drawCircle(
                        x,
                        y,
                        7,
                        p);
            }
        }
    }
}
