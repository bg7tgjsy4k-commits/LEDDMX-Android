              private void addCustomColor(
                      int color
              ) {

                  if (
                          customColors.size()
                                  >= 16
                  ) {

                      toast(
                              "Maksimum 16 warna."
                      );

                      return;
                  }

                  customColors.add(color);
              }

              private void drawPreview() {

                  if (ledPreview == null)
                      return;

                  ledPreview.removeAllViews();

                  if (customColors.isEmpty()) {

                      ledPreview.addView(
                              text(
                                      "EMPTY",
                                      12,
                                      Color.GRAY
                              )
                      );

                      return;
                  }

                  for (
                          int c :
                          customColors
                  ) {

                      TextView led =
                              new TextView(this);

                      led.setBackgroundColor(c);

                      led.setText("●");
                      led.setTextColor(Color.WHITE);
                      led.setGravity(
                              Gravity.CENTER
                      );

                      ledPreview.addView(
                              led,
                              new LinearLayout.LayoutParams(
                                      42,
                                      65
                              )
                      );
                  }
              }

              // ============================================================
              // APPLY CUSTOM PATTERN
              // ============================================================

              private void applyCustom() {

                  if (
                          customColors.isEmpty()
                  ) {

                      toast(
                              "Tambahkan minimal 1 warna."
                      );

                      return;
                  }

                  final int total =
                          customColors.size();

                  /*
                   * LEDDMX-00 protocol:
                   *
                   * Each color:
                   *
                   * 7B POSITION 0E FD R G B TOTAL BF
                   *
                   * Position starts at 1.
                   */

                  for (
                          int i = 0;
                          i < total;
                          i++
                  ) {

                      send(
                              customColorPacket(
                                      customColors.get(i),
                                      i + 1,
                                      total
                              )
                      );
                  }

                  handler.postDelayed(
                          () -> {

                              /*
                               * Custom mode:
                               * 0 = GD
                               * 1 = FD
                               * 2 = FW
                               * 3 = FS
                               * 4 = AC
                               * 5 = PU
                               * 6 = FL
                               * 7 = HO
                               */

                              send(
                                      customModePacket(
                                              customMode
                                      )
                              );

                              handler.postDelayed(
                                      () -> send(
                                              directionPacket(
                                                      customForward
                                              )
                                      ),
                                      100
                              );

                          },
                          Math.max(
                                  120,
                                  total * 60
                          )
                  );

                  status.setText(
                          "CUSTOM SENT: "
                                  + total
                                  + " COLORS / MODE "
                                  + customMode
                  );

                  toast(
                          "Custom pattern dikirim ke IC."
                  );
              }

              // ============================================================
              // SAVE LOCAL SLOT
              // ============================================================

              private void saveSlot() {

                  StringBuilder data =
                          new StringBuilder();

                  data.append(
                          customMode
                  );

                  data.append("|");

                  data.append(
                          customForward
                                  ? "F"
                                  : "R"
                  );

                  data.append("|");

                  for (
                          int c :
                          customColors
                  ) {

                      data.append(
                              String.format(
                                      Locale.US,
                                      "%08X",
                                      c
                              )
                      );

                      data.append(",");
                  }

                  prefs.edit()
                          .putString(
                                  "slot_" + slot,
                                  data.toString()
                          )
                          .apply();

                  toast(
                          "Slot "
                                  + slot
                                  + " tersimpan di HP."
                  );
              }

