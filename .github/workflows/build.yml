              private static class ColorWheel
                      extends View {

                  private Paint paint =
                      new Paint(
                          Paint.ANTI_ALIAS_FLAG
                      );

                  private float cx;
                  private float cy;
                  private float radius;

                  private float sat=1f;
                  private float hue=0f;

                  interface Listener {
                      void onColorChanged(
                          int color
                      );
                  }

                  private Listener listener;

                  ColorWheel(Context c) {
                      super(c);
                      setLayerType(
                          View.LAYER_TYPE_SOFTWARE,
                          null
                      );
                  }

                  void setOnColorChangedListener(
                          Listener l) {
                      listener=l;
                  }

                  void setColor(
                          int color) {

                      float[] hsv =
                          new float[3];

                      Color.colorToHSV(
                          color,
                          hsv
                      );

                      hue=hsv[0];
                      sat=hsv[1];

                      invalidate();
                  }

                  @Override
                  protected void onDraw(
                          Canvas canvas) {

                      super.onDraw(canvas);

                      float w=getWidth();
                      float h=getHeight();

                      cx=w/2f;
                      cy=h/2f;
                      radius=Math.min(w,h)/2f-18;

                      int[] colors = {
                          Color.RED,
                          Color.MAGENTA,
                          Color.BLUE,
                          Color.CYAN,
                          Color.GREEN,
                          Color.YELLOW,
                          Color.RED
                      };

                      paint.setShader(
                          new SweepGradient(
                              cx,
                              cy,
                              colors,
                              null
                          )
                      );

                      canvas.drawCircle(
                          cx,
                          cy,
                          radius,
                          paint
                      );

                      paint.setShader(
                          new RadialGradient(
                              cx,
                              cy,
                              radius,
                              Color.WHITE,
                              Color.TRANSPARENT,
                              Shader.TileMode.CLAMP
                          )
                      );

                      canvas.drawCircle(
                          cx,
                          cy,
                          radius,
                          paint
                      );

                      paint.setShader(null);

                      double a =
                          Math.toRadians(hue-90);

                      float rr =
                          radius*sat;

                      float px =
                          cx +
                          (float)Math.cos(a)*rr;

                      float py =
                          cy +
                          (float)Math.sin(a)*rr;

                      paint.setStyle(
                          Paint.Style.STROKE
                      );

                      paint.setStrokeWidth(5);

                      paint.setColor(
                          Color.WHITE
                      );

                      canvas.drawCircle(
                          px,
                          py,
                          10,
                          paint
                      );

                      paint.setStrokeWidth(2);

                      paint.setColor(
                          Color.BLACK
                      );

                      canvas.drawCircle(
                          px,
                          py,
                          13,
                          paint
                      );

                      paint.setStyle(
                          Paint.Style.FILL
                      );
                  }

                  @Override
                  public boolean onTouchEvent(
                          MotionEvent event) {

                      if(event.getAction() ==
                         MotionEvent.ACTION_DOWN ||
                         event.getAction() ==
                         MotionEvent.ACTION_MOVE ||
                         event.getAction() ==
                         MotionEvent.ACTION_UP) {

                          float dx =
                              event.getX()-cx;

                          float dy =
                              event.getY()-cy;

                          float distance =
                              (float)Math.sqrt(
                                  dx*dx+dy*dy
                              );

                          sat =
                              Math.max(
                                  0f,
                                  Math.min(
                                      1f,
                                      distance/radius
                                  )
                              );

                          float angle =
                              (float)Math.toDegrees(
                                  Math.atan2(
                                      dy,
                                      dx
                                  )
                              );

                          hue =
                              angle+90;

                          if(hue<0)
                              hue+=360;

                          if(hue>=360)
                              hue-=360;

                          invalidate();

                          if(listener!=null) {

                              listener.onColorChanged(
                                  Color.HSVToColor(
                                      new float[]{
                                          hue,
                                          sat,
                                          1f
                                      }
                                  )
                              );
                          }

                          return true;
                      }

                      return true;
                  }

                  @Override
                  protected void onMeasure(
                          int widthSpec,
                          int heightSpec) {

                      int w =
                          MeasureSpec.getSize(
                              widthSpec
                          );

                      setMeasuredDimension(
                          w,
                          Math.min(
                              w,
                              650
                          )
                      );
                  }
              }

              private static class PreviewView
                      extends View {

                  private Paint paint =
                      new Paint(
                          Paint.ANTI_ALIAS_FLAG
                      );

                  private ArrayList<Frame> frames =
                      new ArrayList<>();

                  private int index=0;

                  private boolean playing=false;

                  private Handler handler =
                      new Handler(
                          Looper.getMainLooper()
                      );

                  private int left=Color.RED;
                  private int right=Color.BLUE;

                  PreviewView(Context c) {
                      super(c);
                  }

                  void setColor(
                          int l,
                          int r) {

                      left=l;
                      right=r;
                      invalidate();
                  }

                  void start(
                          ArrayList<Frame> f) {

                      frames.clear();
                      frames.addAll(f);

                      if(frames.isEmpty())
                          return;

                      index=0;
                      playing=true;

                      tick();
                  }

                  void stop() {
                      playing=false;
                      handler.removeCallbacksAndMessages(
                          null
                      );
                  }

                  private void tick() {

                      if(!playing ||
                         frames.isEmpty())
                          return;

                      Frame f =
                          frames.get(
                              index %
                              frames.size()
                          );

                      left=f.left;
                      right=f.right;

                      invalidate();

                      index++;

                      handler.postDelayed(
                          this::tick,
                          Math.max(
                              50,
                              f.duration
                          )
                      );
                  }

                  @Override
                  protected void onDraw(
                          Canvas canvas) {

                      super.onDraw(canvas);

                      canvas.drawColor(
                          Color.BLACK
                      );

                      int w=getWidth();
                      int h=getHeight();

                      int segments=24;

                      for(int i=0;
                          i<segments;
                          i++) {

                          float x1 =
                              i*(w/(float)segments);

                          float x2 =
                              x1 +
                              w/(float)segments -
                              3;

                          int c =
                              i <
                              segments/2
                              ? left
                              : right;

                          paint.setColor(c);

                          canvas.drawRoundRect(
                              x1,
                              h*0.25f,
                              x2,
                              h*0.75f,
                              8,
                              8,
                              paint
                          );
                      }

                      paint.setColor(
                          Color.WHITE
                      );

                      paint.setTextAlign(
                          Paint.Align.CENTER
                      );

                      paint.setTextSize(16);

                      canvas.drawText(
                          "LEFT",
                          w*0.25f,
                          h*0.92f,
                          paint
                      );

                      canvas.drawText(
                          "RIGHT",
                          w*0.75f,
                          h*0.92f,
                          paint
                      );
                  }

                  @Override
                  protected void onMeasure(
                          int widthSpec,
                          int heightSpec) {

                      int w =
                          MeasureSpec.getSize(
                              widthSpec
                          );

                      setMeasuredDimension(
                          w,
                          Math.max(
                              180,
                              w/3
                          )
                      );
                  }
              }
          }
