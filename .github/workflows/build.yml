              private byte[] parseHex(String text) {

                  try {

                      String clean=
                              text.replace(
                                      "0x","")
                                  .replace(
                                      "0X","")
                                  .replace(
                                      ","," ")
                                  .trim();

                      if(clean.isEmpty())
                          return null;

                      String[] p=
                              clean.split("\\s+");

                      byte[] out=
                              new byte[p.length];

                      for(int i=0;i<p.length;i++) {

                          int x=
                                  Integer.parseInt(
                                          p[i],
                                          16);

                          if(x<0 || x>255)
                              return null;

                          out[i]=(byte)x;
                      }

                      return out;

                  } catch(Exception e) {

                      return null;
                  }
              }

