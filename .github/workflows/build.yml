              private static class Frame {

                  int lr;
                  int lg;
                  int lb;

                  int rr;
                  int rg;
                  int rb;

                  int duration;

                  Frame(
                          int lr,
                          int lg,
                          int lb,
                          int rr,
                          int rg,
                          int rb,
                          int duration) {

                      this.lr=lr;
                      this.lg=lg;
                      this.lb=lb;

                      this.rr=rr;
                      this.rg=rg;
                      this.rb=rb;

                      this.duration =
                              duration;
                  }
              }

