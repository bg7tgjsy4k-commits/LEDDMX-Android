name: Build LEDDMX Pro FINAL

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 33
        shell: bash
        run: |
          set -e
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2"

      - name: Install Gradle 7.6.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.6.1'

      - name: Create clean Android project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf LEDDMX-Android

          mkdir -p LEDDMX-Android/app/src/main/java/com/leddmx/pro
          mkdir -p LEDDMX-Android/app/src/main/res/values

          cd LEDDMX-Android

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "LEDDMX-Pro"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '7.4.2' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=false
          android.enableJetifier=false
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.leddmx.pro'
              compileSdk 33

              defaultConfig {
                  applicationId 'com.leddmx.pro'
                  minSdk 21
                  targetSdk 33
                  versionCode 100
                  versionName '1.0.0-final'
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }

                  debug {
                      minifyEnabled false
                  }
              }
          }
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">LEDDMX Pro</string>
          </resources>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="@android:style/Theme.Material.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">#080A0F</item>
                  <item name="android:navigationBarColor">#080A0F</item>
                  <item name="android:colorAccent">#27D17F</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission
                  android:name="android.permission.BLUETOOTH"
                  android:maxSdkVersion="30"/>

              <uses-permission
                  android:name="android.permission.BLUETOOTH_ADMIN"
                  android:maxSdkVersion="30"/>

              <uses-permission
                  android:name="android.permission.ACCESS_FINE_LOCATION"/>

              <uses-permission
                  android:name="android.permission.BLUETOOTH_SCAN"/>

              <uses-permission
                  android:name="android.permission.BLUETOOTH_CONNECT"/>

              <uses-permission
                  android:name="android.permission.BLUETOOTH_ADVERTISE"/>

              <uses-feature
                  android:name="android.hardware.bluetooth_le"
                  android:required="false"/>

              <application
                  android:allowBackup="false"
                  android:label="@string/app_name"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="false">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

      - name: Generate exact 210 mode names
        shell: bash
        run: |
          set -euo pipefail

          cd LEDDMX-Android

          curl -fsSL \
            --retry 3 \
            --connect-timeout 10 \
            --max-time 30 \
            https://raw.githubusercontent.com/user154lt/LEDDMX-00/main/PatternList.kt \
            -o /tmp/PatternList.kt

          python3 - <<'PY'
          from pathlib import Path
          import re

          src = Path('/tmp/PatternList.kt').read_text(encoding='utf-8')

          items = re.findall(
              r'"((?:\\.|[^"\\])*)"',
              src
          )

          if len(items) < 211:
              raise SystemExit(
                  f"PatternList parse returned {len(items)} strings"
              )

          items = items[:211]

          def esc(s):
              return (
                  s
                  .replace('\\', '\\\\')
                  .replace('"', '\\"')
                  .replace('\n', ' ')
              )

          out = [
              'package com.leddmx.pro;',
              '',
              'public final class Patterns {',
              '  public static final String[] NAMES = new String[] {'
          ]

          for s in items:
              out.append(f'    "{esc(s)}",')

          out += [
              '  };',
              '  private Patterns() {}',
              '}'
          ]

          Path(
              'app/src/main/java/com/leddmx/pro/Patterns.java'
          ).write_text(
              '\n'.join(out),
              encoding='utf-8'
          )

          print(f"Generated {len(items)} exact mode names")
          PY

      - name: Write final MainActivity
        shell: bash
        run: |
          set -euo pipefail

          cd LEDDMX-Android

          cat > app/src/main/java/com/leddmx/pro/MainActivity.java <<'JAVA'
          package com.leddmx.pro;

          import android.Manifest;
          import android.app.Activity;
          import android.bluetooth.*;
          import android.bluetooth.le.*;
          import android.content.*;
          import android.content.pm.PackageManager;
          import android.graphics.*;
          import android.os.*;
          import android.view.*;
          import android.widget.Toast;

          import java.util.*;
          import java.util.UUID;

          public class MainActivity extends Activity {

              static final UUID SVC =
                  UUID.fromString(
                      "0000FFE0-0000-1000-8000-00805F9B34FB"
                  );

              static final UUID WR =
                  UUID.fromString(
                      "0000FFE1-0000-1000-8000-00805F9B34FB"
                  );

              static final UUID OTA =
                  UUID.fromString(
                      "5833FF01-9B8B-5191-6142-22A4536EF123"
                  );

              static final int REQ = 90;

              BluetoothAdapter adapter;
              BluetoothLeScanner scanner;
              ScanCallback scanCb;

              BluetoothGatt gatt;
              BluetoothGattCharacteristic writeChar;

              final ArrayList<Dev> devices =
                  new ArrayList<>();

              final ArrayList<Integer> colors =
                  new ArrayList<>();

              final ArrayList<String> terminal =
                  new ArrayList<>();

              final ArrayDeque<byte[]> txq =
                  new ArrayDeque<>();

              final Handler main =
                  new Handler(Looper.getMainLooper());

              Draw v;

              boolean scanning = false;
              boolean ready = false;
              boolean drawer = false;
              boolean writing = false;

              int page = 0;

              int color =
                  Color.rgb(0, 255, 140);

              int brightness = 100;
              int speedValue = 50;
              int mode = 1;

              float hue = 150f;

              long lastWrite = 0;

              static class Dev {
                  BluetoothDevice d;
                  String name;
                  int rssi;

                  Dev(
                      BluetoothDevice d,
                      String n,
                      int r
                  ) {
                      this.d = d;
                      name = n;
                      rssi = r;
                  }
              }

              @Override
              public void onCreate(Bundle b) {
                  super.onCreate(b);

                  getWindow().setStatusBarColor(
                      Color.rgb(8, 10, 15)
                  );

                  getWindow().setNavigationBarColor(
                      Color.rgb(8, 10, 15)
                  );

                  colors.add(color);

                  setupBt();

                  v = new Draw(this);

                  setContentView(v);

                  requestBtPerms();
              }

              void setupBt() {
                  BluetoothManager m =
                      (BluetoothManager)
                      getSystemService(
                          BLUETOOTH_SERVICE
                      );

                  adapter = m.getAdapter();

                  scanner =
                      adapter == null
                      ? null
                      : adapter.getBluetoothLeScanner();
              }

              boolean has(String p) {
                  return
                      Build.VERSION.SDK_INT < 23
                      ||
                      checkSelfPermission(p)
                      ==
                      PackageManager.PERMISSION_GRANTED;
              }

              void requestBtPerms() {

                  ArrayList<String> p =
                      new ArrayList<>();

                  if (Build.VERSION.SDK_INT >= 31) {

                      if (!has(
                          Manifest.permission.BLUETOOTH_SCAN
                      )) {
                          p.add(
                              Manifest.permission.BLUETOOTH_SCAN
                          );
                      }

                      if (!has(
                          Manifest.permission.BLUETOOTH_CONNECT
                      )) {
                          p.add(
                              Manifest.permission.BLUETOOTH_CONNECT
                          );
                      }

                  } else if (
                      Build.VERSION.SDK_INT >= 23
                      &&
                      !has(
                          Manifest.permission.ACCESS_FINE_LOCATION
                      )
                  ) {

                      p.add(
                          Manifest.permission.ACCESS_FINE_LOCATION
                      );
                  }

                  if (!p.isEmpty()) {
                      requestPermissions(
                          p.toArray(new String[0]),
                          REQ
                      );
                  }
              }

              @Override
              public void onRequestPermissionsResult(
                  int r,
                  String[] p,
                  int[] g
              ) {

                  super.onRequestPermissionsResult(
                      r,
                      p,
                      g
                  );

                  if (r == REQ) {

                      boolean ok = true;

                      for (int x : g) {
                          if (
                              x !=
                              PackageManager.PERMISSION_GRANTED
                          ) {
                              ok = false;
                          }
                      }

                      log(
                          "DEVICE-SOURCE PERMISSION: "
                          +
                          (ok ? "GRANTED" : "DENIED")
                      );

                      v.invalidate();
                  }
              }

              void scan() {

                  if (adapter == null) {
                      toast(
                          "Bluetooth LE tidak tersedia"
                      );
                      return;
                  }

                  if (!adapter.isEnabled()) {

                      try {
                          startActivity(
                              new Intent(
                                  BluetoothAdapter
                                  .ACTION_REQUEST_ENABLE
                              )
                          );
                      } catch (Exception e) {
                      }

                      toast(
                          "Nyalakan Bluetooth lalu SCAN lagi"
                      );

                      return;
                  }

                  requestBtPerms();

                  if (
                      Build.VERSION.SDK_INT >= 31
                      &&
                      (
                          !has(
                              Manifest.permission.BLUETOOTH_SCAN
                          )
                          ||
                          !has(
                              Manifest.permission.BLUETOOTH_CONNECT
                          )
                      )
                  ) {

                      toast(
                          "Izin Bluetooth belum diberikan"
                      );

                      return;
                  }

                  stopScan();

                  devices.clear();

                  v.invalidate();

                  scanCb =
                      new ScanCallback() {

                      @Override
                      public void onScanResult(
                          int type,
                          ScanResult r
                      ) {

                          BluetoothDevice d =
                              r.getDevice();

                          String n = null;

                          if (
                              r.getScanRecord() != null
                          ) {
                              n =
                                  r.getScanRecord()
                                   .getDeviceName();
                          }

                          try {
                              if (n == null) {
                                  n = d.getName();
                              }
                          } catch (Exception e) {
                          }

                          if (
                              n == null
                              ||
                              n.trim().isEmpty()
                          ) {
                              n = "UNKNOWN BLE";
                          }

                          int idx = -1;

                          for (
                              int i = 0;
                              i < devices.size();
                              i++
                          ) {

                              if (
                                  devices
                                  .get(i)
                                  .d
                                  .getAddress()
                                  .equals(
                                      d.getAddress()
                                  )
                              ) {
                                  idx = i;
                                  break;
                              }
                          }

                          if (idx < 0) {

                              devices.add(
                                  new Dev(
                                      d,
                                      n,
                                      r.getRssi()
                                  )
                              );

                          } else {

                              devices
                                  .get(idx)
                                  .name = n;

                              devices
                                  .get(idx)
                                  .rssi =
                                      r.getRssi();
                          }

                          log(
                              "DEVICE-SOURCE SCAN: "
                              +
                              n
                              +
                              " | "
                              +
                              d.getAddress()
                              +
                              " | RSSI "
                              +
                              r.getRssi()
                          );

                          v.invalidate();
                      }

                      @Override
                      public void onBatchScanResults(
                          List<ScanResult> rs
                      ) {

                          for (
                              ScanResult r : rs
                          ) {

                              onScanResult(
                                  ScanSettings
                                  .CALLBACK_TYPE_ALL_MATCHES,
                                  r
                              );
                          }
                      }

                      @Override
                      public void onScanFailed(
                          int e
                      ) {

                          scanning = false;

                          log(
                              "DEVICE-SOURCE SCAN ERROR: "
                              + e
                          );

                          toast(
                              "BLE scan error "
                              + e
                          );

                          v.invalidate();
                      }
                  };

                  try {

                      scanner.startScan(scanCb);

                      scanning = true;

                      log(
                          "DEVICE-SOURCE SCAN STARTED: "
                          +
                          "ALL BLE DEVICES"
                      );

                      v.invalidate();

                      main.postDelayed(
                          () -> stopScan(),
                          15000
                      );

                  } catch (Exception e) {

                      log(
                          "DEVICE-SOURCE SCAN EXCEPTION: "
                          + e
                      );

                      toast(
                          "Gagal memulai BLE scan"
                      );
                  }
              }

              void stopScan() {

                  if (
                      scanner != null
                      &&
                      scanCb != null
                  ) {

                      try {
                          scanner.stopScan(scanCb);
                      } catch (Exception e) {
                      }
                  }

                  scanning = false;
              }

              void connect(Dev x) {

                  stopScan();

                  if (gatt != null) {
                      try {
                          gatt.close();
                      } catch (Exception e) {
                      }
                  }

                  ready = false;
                  writeChar = null;

                  log(
                      "DEVICE-SOURCE CONNECT: "
                      +
                      x.name
                      +
                      " | "
                      +
                      x.d.getAddress()
                  );

                  try {

                      gatt =
                          x.d.connectGatt(
                              this,
                              false,
                              new BluetoothGattCallback() {

                          @Override
                          public void onConnectionStateChange(
                              BluetoothGatt g,
                              int st,
                              int ns
                          ) {

                              if (
                                  ns ==
                                  BluetoothProfile
                                  .STATE_CONNECTED
                              ) {

                                  log(
                                      "DEVICE-SOURCE GATT: "
                                      +
                                      "CONNECTED"
                                  );

                                  main.postDelayed(
                                      () -> {

                                          try {
                                              g.discoverServices();
                                          } catch (
                                              Exception e
                                          ) {
                                          }

                                      },
                                      300
                                  );

                              } else {

                                  ready = false;

                                  writeChar = null;

                                  log(
                                      "DEVICE-SOURCE GATT: "
                                      +
                                      "DISCONNECTED status="
                                      +
                                      st
                                  );

                                  main.post(
                                      () ->
                                      v.invalidate()
                                  );
                              }
                          }

                          @Override
                          public void onServicesDiscovered(
                              BluetoothGatt g,
                              int st
                          ) {

                              boolean found = false;

                              for (
                                  BluetoothGattService s :
                                  g.getServices()
                              ) {

                                  log(
                                      "DEVICE-SOURCE SERVICE: "
                                      +
                                      s.getUuid()
                                  );

                                  if (
                                      s.getUuid()
                                      .equals(OTA)
                                  ) {

                                      log(
                                          "DEVICE-SOURCE OTA "
                                          +
                                          "SERVICE DETECTED: "
                                          +
                                          s.getUuid()
                                      );
                                  }

                                  for (
                                      BluetoothGattCharacteristic c :
                                      s.getCharacteristics()
                                  ) {

                                      int props =
                                          c.getProperties();

                                      log(
                                          "DEVICE-SOURCE CHAR: "
                                          +
                                          c.getUuid()
                                          +
                                          " props="
                                          +
                                          props
                                      );

                                      if (
                                          c.getUuid()
                                          .equals(WR)
                                      ) {

                                          writeChar = c;
                                          found = true;
                                      }

                                      if (
                                          (
                                              props
                                              &
                                              BluetoothGattCharacteristic
                                              .PROPERTY_NOTIFY
                                          ) != 0
                                      ) {

                                          try {

                                              g.setCharacteristicNotification(
                                                  c,
                                                  true
                                              );

                                          } catch (
                                              Exception e
                                          ) {
                                          }
                                      }
                                  }
                              }

                              ready = found;

                              log(
                                  found
                                  ?
                                  "DEVICE-SOURCE READY: "
                                  +
                                  "FFE1 WRITE FOUND"
                                  :
                                  "DEVICE-SOURCE READY: "
                                  +
                                  "FFE1 NOT FOUND"
                              );

                              main.post(
                                  () ->
                                  v.invalidate()
                              );
                          }

                          @Override
                          public void onCharacteristicChanged(
                              BluetoothGatt g,
                              BluetoothGattCharacteristic c,
                              byte[] val
                          ) {

                              log(
                                  "DEVICE-SOURCE RX "
                                  +
                                  hex(val)
                              );

                              main.post(
                                  () ->
                                  v.invalidate()
                              );
                          }

                          @Override
                          public void onCharacteristicRead(
                              BluetoothGatt g,
                              BluetoothGattCharacteristic c,
                              int st
                          ) {

                              log(
                                  "DEVICE-SOURCE READ "
                                  +
                                  c.getUuid()
                                  +
                                  " status="
                                  +
                                  st
                                  +
                                  " "
                                  +
                                  hex(c.getValue())
                              );

                              main.post(
                                  () ->
                                  v.invalidate()
                              );
                          }

                      },
                      Build.VERSION.SDK_INT >= 23
                      ?
                      BluetoothDevice.TRANSPORT_LE
                      :
                      0
                  );

                  } catch (Exception e) {

                      log(
                          "DEVICE-SOURCE CONNECT EXCEPTION: "
                          + e
                      );
                  }
              }

              void send(byte[] p) {

                  if (
                      !ready
                      ||
                      gatt == null
                      ||
                      writeChar == null
                  ) {

                      toast(
                          "Belum CONNECTED / "
                          +
                          "FFE1 belum ditemukan"
                      );

                      return;
                  }

                  txq.add(p.clone());

                  drain();
              }

              void drain() {

                  if (
                      writing
                      ||
                      txq.isEmpty()
                  ) {
                      return;
                  }

                  long wait =
                      Math.max(
                          0,
                          80 -
                          (
                              System.currentTimeMillis()
                              -
                              lastWrite
                          )
                      );

                  if (wait > 0) {

                      main.postDelayed(
                          this::drain,
                          wait
                      );

                      return;
                  }

                  byte[] p = txq.poll();

                  writing = true;

                  lastWrite =
                      System.currentTimeMillis();

                  writeChar.setValue(p);

                  try {

                      gatt.writeCharacteristic(
                          writeChar
                      );

                  } catch (Exception e) {

                      writing = false;

                      log(
                          "DEVICE-SOURCE TX ERROR "
                          + e
                      );

                      return;
                  }

                  log(
                      "DEVICE-SOURCE TX "
                      +
                      hex(p)
                  );

                  main.postDelayed(
                      () -> {

                          writing = false;
                          drain();

                      },
                      90
                  );

                  v.invalidate();
              }

              void power(boolean on) {

                  send(
                      new byte[] {
                          0x7B,
                          (byte)0xFF,
                          0x04,
                          (byte)(on ? 1 : 0),
                          (byte)0xFF,
                          (byte)0xFF,
                          (byte)0xFF,
                          (byte)0xFF,
                          (byte)0xBF
                      }
                  );
              }

              void mode(int m) {

                  send(
                      new byte[] {
                          0x7B,
                          (byte)0xFF,
                          0x03,
                          (byte)m,
                          (byte)0xFF,
                          (byte)0xFF,
                          (byte)0xFF,
                          (byte)0xFF,
                          (byte)0xBF
                      }
                  );
              }

              void rgb(int c) {

                  send(
                      new byte[] {
                          0x7B,
                          (byte)0xFF,
                          0x07,
                          (byte)Color.red(c),
                          (byte)Color.green(c),
                          (byte)Color.blue(c),
                          0,
                          (byte)0xFF,
                          (byte)0xBF
                      }
                  );
              }

              void bright(int q) {

                  q =
                      Math.max(
                          0,
                          Math.min(
                              100,
                              q
                          )
                      );

                  send(
                      new byte[] {
                          0x7B,
                          (byte)0xFF,
                          0x01,
                          (byte)(q * 32 / 100),
                          (byte)q,
                          0,
                          (byte)0xFF,
                          (byte)0xFF,
                          (byte)0xBF
                      }
                  );
              }

              void setSpeed(int q) {

                  q =
                      Math.max(
                          0,
                          Math.min(
                              100,
                              q
                          )
                      );

                  send(
                      new byte[] {
                          0x7B,
                          (byte)0xFF,
                          0x02,
                          (byte)q,
                          0,
                          (byte)0xFF,
                          (byte)0xFF,
                          (byte)0xFF,
                          (byte)0xBF
                      }
                  );
              }

              void direction(int d) {

                  send(
                      new byte[] {
                          0x7B,
                          (byte)0xFF,
                          0x0D,
                          (byte)(d & 1),
                          (byte)0xFF,
                          (byte)0xFF,
                          (byte)0xFF,
                          (byte)0xFF,
                          (byte)0xBF
                      }
                  );
              }

              void customColor(
                  int pos,
                  int total,
                  int c
              ) {

                  send(
                      new byte[] {
                          0x7B,
                          (byte)pos,
                          0x0E,
                          (byte)0xFD,
                          (byte)Color.red(c),
                          (byte)Color.green(c),
                          (byte)Color.blue(c),
                          (byte)total,
                          (byte)0xBF
                      }
                  );
              }

              void customMode(int ord) {

                  send(
                      new byte[] {
                          0x7B,
                          (byte)0xFF,
                          0x13,
                          (byte)ord,
                          (byte)0xFF,
                          (byte)0xFF,
                          (byte)0xFF,
                          (byte)0xFF,
                          (byte)0xBF
                      }
                  );
              }

              String hex(byte[] b) {

                  StringBuilder s =
                      new StringBuilder();

                  for (byte x : b) {

                      s.append(
                          String.format(
                              Locale.US,
                              "%02X ",
                              x & 255
                          )
                      );
                  }

                  return s.toString().trim();
              }

              void log(String s) {

                  String t =
                      new java.text
                      .SimpleDateFormat(
                          "HH:mm:ss.SSS",
                          Locale.US
                      ).format(
                          new Date()
                      )
                      +
                      "  "
                      +
                      s;

                  terminal.add(t);

                  if (
                      terminal.size() > 300
                  ) {
                      terminal.remove(0);
                  }

                  if (v != null) {
                      v.invalidate();
                  }
              }

              void toast(String s) {

                  Toast.makeText(
                      this,
                      s,
                      Toast.LENGTH_SHORT
                  ).show();
              }

              int hsv(float h) {

                  return Color.HSVToColor(
                      new float[] {
                          h,
                          1f,
                          1f
                      }
                  );
              }

