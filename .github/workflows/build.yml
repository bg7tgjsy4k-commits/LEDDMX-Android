          output.append(
              "    private Patterns() {}"
          )
          output.append("}")

          with open(
              "app/src/main/java/com/leddmx/pro/Patterns.java",
              "w",
              encoding="utf-8"
          ) as f:
              f.write(
                  "\n".join(output)
                  + "\n"
              )
          PY

          gradle wrapper \
            --gradle-version 7.6.1 \
            --distribution-type bin

          chmod +x gradlew

      - name: Verify Gradle
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --version

      - name: Verify source files
        shell: bash
        run: |
          set -euo pipefail

          test -f settings.gradle
          test -f build.gradle
          test -f gradle.properties
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/res/values/strings.xml
          test -f app/src/main/java/com/leddmx/pro/MainActivity.java
          test -f app/src/main/java/com/leddmx/pro/Patterns.java

          echo "SOURCE CHECK OK"

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            clean \
            assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"
          test -s "$APK"

          echo "========================================"
          echo "        LEDDMX PRO BUILD SUCCESS"
          echo "========================================"

          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LEDDMX-Pro-FINAL
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
