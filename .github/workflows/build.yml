    private class StripPreview
            extends View {

        Paint paint =
                new Paint(
                        Paint.ANTI_ALIAS_FLAG
                );

        StripPreview(Context context) {
            super(context);
        }

        @Override
        protected void onDraw(
                Canvas canvas) {

            super.onDraw(canvas);

            canvas.drawColor(
                    Color.rgb(
                            5, 7, 9
                    )
            );

            int count =
                    Math.max(
                            18,
                            frames.size() *
                                    2
                    );

            float w =
                    getWidth();

            float h =
                    getHeight();

            float spacing =
                    w / count;

            for (int i = 0;
                 i < count;
                 i++) {

                int color;

                if (frames.isEmpty()) {

                    color =
                            Color.rgb(
                                    40,
                                    40,
                                    40
                            );

                } else {

                    Frame f =
                            frames.get(
                                    i %
                                            frames.size()
                            );

                    color =
                            Color.rgb(
                                    f.r,
                                    f.g,
                                    f.b
                            );
                }

                paint.setColor(color);

                float x =
                        spacing *
                                i +
                                spacing /
                                        2;

                canvas.drawCircle(
                        x,
                        h / 2,
                        Math.min(
                                12,
                                spacing /
                                        3
                        ),
                        paint
                );
            }
        }
    }

    private class ColorWheel
            extends View {

        Paint paint =
                new Paint(
                        Paint.ANTI_ALIAS_FLAG
                );

        ColorWheel(Context context) {
            super(context);
            setLayerType(
                    View.LAYER_TYPE_SOFTWARE,
                    null
            );
        }

        @Override
        protected void onDraw(
                Canvas canvas) {

            super.onDraw(canvas);

            float cx =
                    getWidth() /
                            2f;

            float cy =
                    getHeight() /
                            2f;

            float radius =
                    Math.min(
                            getWidth(),
                            getHeight()
                    ) *
                            0.38f;

            for (int i = 0;
                 i < 360;
                 i++) {

                float hue =
                        i;

                paint.setColor(
                        Color.HSVToColor(
                                new float[]{
                                        hue,
                                        1f,
                                        1f
                                }
                        )
                );

                paint.setStyle(
                        Paint.Style.STROKE
                );

                paint.setStrokeWidth(
                        18
                );

                canvas.drawArc(
                        new RectF(
                                cx - radius,
                                cy - radius,
                                cx + radius,
                                cy + radius
                        ),
                        i,
                        2,
                        false,
                        paint
                );
            }

            paint.setStyle(
                    Paint.Style.FILL
            );

            float[] hsv =
                    new float[3];

            Color.RGBToHSV(
                    selectedR,
                    selectedG,
                    selectedB,
                    hsv
            );

            double angle =
                    Math.toRadians(
                            hsv[0] - 90
                    );

            float x =
                    cx +
                            (float)
                                    Math.cos(angle)
                                    *
                                    radius;

            float y =
                    cy +
                            (float)
                                    Math.sin(angle)
                                    *
                                    radius;

            paint.setColor(WHITE);

            canvas.drawCircle(
                    x,
                    y,
                    11,
                    paint
            );

            paint.setColor(
                    Color.rgb(
                            selectedR,
                            selectedG,
                            selectedB
                    )
            );

            canvas.drawCircle(
                    x,
                    y,
                    7,
                    paint
            );
        }

        @Override
        public boolean onTouchEvent(
                MotionEvent event) {

            if (event.getAction() ==
                    MotionEvent.ACTION_DOWN ||
                    event.getAction() ==
                            MotionEvent.ACTION_MOVE) {

                float cx =
                        getWidth() /
                                2f;

                float cy =
                        getHeight() /
                                2f;

                float dx =
                        event.getX() -
                                cx;

                float dy =
                        event.getY() -
                                cy;

                double degrees =
                        Math.toDegrees(
                                Math.atan2(
                                        dy,
                                        dx
                                )
                        ) + 90;

                if (degrees < 0) {
                    degrees += 360;
                }

                float hue =
                        (float) degrees;

                int color =
                        Color.HSVToColor(
                                new float[]{
                                        hue,
                                        1f,
                                        1f
                                }
                        );

                selectedR =
                        Color.red(color);

                selectedG =
                        Color.green(color);

                selectedB =
                        Color.blue(color);

                invalidate();

                if (event.getAction() ==
                        MotionEvent.ACTION_UP) {

                    sendRgb();
                }

                return true;
            }

            return true;
        }
    }
