    static class Dmx {

        static byte[] frame(
                int... x
        ) {

            byte[] b =
                    new byte[x.length];

            for(int i = 0; i < x.length; i++)
                b[i] =
                        (byte)x[i];

            return b;
        }

        static byte[] power(
                boolean on
        ) {

            return frame(
                    0x7B,
                    0xFF,
                    0x04,
                    on
                            ? 0x01
                            : 0x00,
                    0xFF,
                    0xFF,
                    0xFF,
                    0xFF,
                    0xBF
            );
        }

        static byte[] mode(
                int m
        ) {

            return frame(
                    0x7B,
                    0xFF,
                    0x03,
                    m,
                    0xFF,
                    0xFF,
                    0xFF,
                    0xFF,
                    0xBF
            );
        }

        static byte[] rgb(
                int r,
                int g,
                int b
        ) {

            return frame(
                    0x7B,
                    0xFF,
                    0x07,
                    r,
                    g,
                    b,
                    0x00,
                    0xFF,
                    0xBF
            );
        }

        static byte[] brightness(
                int p
        ) {

            int q =
                    Math.max(
                            0,
                            Math.min(
                                    255,
                                    p * 32 / 100
                            )
                    );

            return frame(
                    0x7B,
                    0xFF,
                    0x01,
                    q,
                    p,
                    0x00,
                    0xFF,
                    0xFF,
                    0xBF
            );
        }

        static byte[] speed(
                int p
        ) {

            return frame(
                    0x7B,
                    0xFF,
                    0x02,
                    p,
                    0x00,
                    0xFF,
                    0xFF,
                    0xFF,
                    0xBF
            );
        }

        static byte[] direction(
                int d
        ) {

            return frame(
                    0x7B,
                    0xFF,
                    0x0D,
                    d,
                    0xFF,
                    0xFF,
                    0xFF,
                    0xFF,
                    0xBF
            );
        }

        static byte[] customColor(
                int pos,
                int r,
                int g,
                int b,
                int total
        ) {

            return frame(
                    0x7B,
                    pos,
                    0x0E,
                    0xFD,
                    r,
                    g,
                    b,
                    total,
                    0xBF
            );
        }

        static byte[] customMode(
                int ord
        ) {

            return frame(
                    0x7B,
                    0xFF,
                    0x13,
                    ord,
                    0xFF,
                    0xFF,
                    0xFF,
                    0xFF,
                    0xBF
            );
        }
    }

