                        this,
                        hsv -> {

                            rgb =
                                    Color.HSVToColor(
                                            hsv
                                    );

                            send(
                                    Dmx.rgb(
                                            Color.red(rgb),
                                            Color.green(rgb),
                                            Color.blue(rgb)
                                    )
                            );
                        }
                )
        );

        add(
                slider(
                        "BRIGHTNESS",
                        brightness,
                        1,
                        100,
                        v -> {

                            brightness = v;

                            send(
                                    Dmx.brightness(v)
                            );
                        }
                )
        );

        add(
                slider(
                        "SPEED",
                        speed,
                        1,
                        100,
                        v -> {

                            speed = v;

                            send(
                                    Dmx.speed(v)
                            );
                        }
                )
        );

        add(
                txt(
                        gatt == null
                                ? "NO MODULE CONNECTED"
                                : "CONNECTED • FFE0 / FFE1 READY",
                        13,
                        gatt == null
                                ? MUTED
                                : GREEN
                )
        );
    }

    void addDeviceList() {

        add(
                h2(
                        "NEARBY BLE DEVICES"
                )
        );

        if(devices.isEmpty()) {

            add(
                    txt(
                            "No device seen yet. Turn the LEDDMX module ON, keep it close, then tap SCAN DEVICES.",
                            13,
                            MUTED
                    )
            );

            return;
        }

        for(
                Map.Entry<String,BluetoothDevice> e
                : devices.entrySet()
        ) {

            BluetoothDevice d =
                    e.getValue();

            LinearLayout r =
                    row();

            String n =
                    safeName(d);

            TextView t =
                    txt(
                            n
                                    + "\n"
                                    + e.getKey()
                                    + "  "
                                    + deviceInfo.getOrDefault(
                                            e.getKey(),
                                            ""
                                    ),
                            13,
                            TEXT
                    );

            r.addView(
                    t,
                    new LinearLayout.LayoutParams(
                            0,
                            70,
                            1
                    )
            );

            Button c =
                    btn(
                            "CONNECT"
                    );

            c.setOnClickListener(
                    v -> connect(d)
            );

            r.addView(
                    c,
                    new LinearLayout.LayoutParams(
                            110,
                            55
                    )
            );

            add(r);
        }
    }

    String safeName(
            BluetoothDevice d
    ) {

        try {

            String n =
                    d.getName();

            return n == null
                    ? "Unnamed BLE"
                    : n;

        } catch(SecurityException e) {

            return "BLE Device";
        }
    }

    void scan() {

        if(adapter == null) {

            initBle();

            return;
        }

        if(!adapter.isEnabled()) {

            try {

                startActivity(
                        new Intent(
                                BluetoothAdapter.ACTION_BLUETOOTH_SETTINGS
                        )
                );

            } catch(Exception ignored) {}

            return;
        }

        if(
                System.currentTimeMillis()
                        - lastScan
                        < 3000
        )
            return;

        lastScan =
                System.currentTimeMillis();

        if(scanner == null)
            scanner =
                    adapter.getBluetoothLeScanner();

        if(scanner == null)
            return;

        stopScan();

        devices.clear();

        showHome();

        scanCallback =
                new ScanCallback() {

                    @Override
                    public void onScanResult(
                            int type,
                            ScanResult r
                    ) {

                        runOnUiThread(
                                () -> {

                                    BluetoothDevice d =
                                            r.getDevice();

                                    String address =
                                            d.getAddress();

                                    devices.put(
                                            address,
                                            d
                                    );

                                    deviceInfo.put(
                                            address,
                                            "RSSI "
                                                    + r.getRssi()
                                                    + " dBm • ADVERTISED"
                                    );

                                    setStatus(
                                            "SCANNING • "
                                                    + devices.size()
                                                    + " DEVICE(S)",
                                            GREEN
                                    );

                                    showHome();
                                }
                        );
                    }

                    @Override
                    public void onScanFailed(
                            int e
                    ) {

                        runOnUiThread(
                                () ->
                                        setStatus(
                                                "SCAN ERROR "
                                                        + e,
                                                Color.RED
                                        )
                        );
                    }
                };

        try {

            scanner.startScan(
                    scanCallback
            );

            scanning = true;

            handler.postDelayed(
                    this::stopScan,
                    12000
            );

        } catch(Exception e) {

            setStatus(
                    "SCAN FAILED",
                    Color.RED
            );
        }
    }

    void stopScan() {

        if(
                scanner != null
                        &&
                scanCallback != null
                        &&
                scanning
        ) {

            try {

                scanner.stopScan(
                        scanCallback
                );

            } catch(Exception ignored) {}
        }

        scanning = false;
    }

    void connect(
            BluetoothDevice d
    ) {

        stopScan();

        setStatus(
                "CONNECTING • "
                        + safeName(d),
                Color.YELLOW
        );

        if(gatt != null) {

            try {
                gatt.close();
            } catch(Exception ignored) {}

            gatt = null;
            tx = null;
        }

        gatt =
                d.connectGatt(
                        this,
                        false,
                        new BluetoothGattCallback() {

                            @Override
                            public void onConnectionStateChange(
                                    BluetoothGatt g,
                                    int st,
                                    int ns
                            ) {

                                if(
                                        ns
                                                ==
                                        BluetoothProfile.STATE_CONNECTED
                                ) {

                                    runOnUiThread(
                                            () ->
                                                    setStatus(
                                                            "CONNECTED • DISCOVERING",
                                                            GREEN
                                                    )
                                    );

                                    gatt = g;

                                    g.discoverServices();

                                } else {

                                    runOnUiThread(
                                            () ->
                                                    setStatus(
                                                            "DISCONNECTED",
                                                            Color.RED
                                                    )
                                    );
                                }
                            }

                            @Override
                            public void onServicesDiscovered(
                                    BluetoothGatt g,
                                    int st
                            ) {

                                for(
                                        BluetoothGattService s
                                        : g.getServices()
                                ) {

                                    logModule(
                                            "SERVICE "
                                                    + s.getUuid()
                                    );

                                    if(
                                            s.getUuid()
                                                    .toString()
                                                    .equalsIgnoreCase(
                                                            SERVICE
                                                    )
                                    ) {

                                        for(
                                                BluetoothGattCharacteristic c
                                                : s.getCharacteristics()
                                        ) {

                                            logModule(
                                                    "CHAR "
                                                            + c.getUuid()
                                                            + " PROPS="
                                                            + c.getProperties()
                                            );

                                            if(
                                                    c.getUuid()
                                                            .toString()
                                                            .equalsIgnoreCase(
                                                                    WRITE
                                                            )
                                            ) {

                                                tx = c;

                                                if(
                                                        (
                                                                c.getProperties()
                                                                        &
                                                                (
                                                                        BluetoothGattCharacteristic.PROPERTY_NOTIFY
                                                                                |
                                                                        BluetoothGattCharacteristic.PROPERTY_INDICATE
                                                                )
                                                        )
                                                        !=
                                                        0
                                                ) {

                                                    g.setCharacteristicNotification(
                                                            c,
                                                            true
                                                    );

                                                    for(
                                                            BluetoothGattDescriptor x
                                                            : c.getDescriptors()
                                                    ) {

                                                        x.setValue(
                                                                BluetoothGattDescriptor.ENABLE_NOTIFICATION_VALUE
                                                        );

                                                        g.writeDescriptor(x);
                                                    }
                                                }
                                            }
                                        }
                                    }

                                    if(
                                            s.getUuid()
                                                    .toString()
                                                    .equalsIgnoreCase(
                                                            OTA
                                                    )
                                    ) {

                                        logModule(
                                                "OTA SERVICE DETECTED "
                                                        + OTA
                                        );
                                    }
                                }

                                runOnUiThread(
                                        () -> {

                                            if(tx != null) {

                                                setStatus(
                                                        "READY • LEDDMX-00 CHANNEL",
                                                        GREEN
                                                );

                                            } else {

                                                setStatus(
                                                        "CONNECTED • FFE1 NOT FOUND",
                                                        Color.YELLOW
                                                );
                                            }
                                        }
                                );
                            }

                            @Override
                            public void onCharacteristicChanged(
                                    BluetoothGatt g,
                                    BluetoothGattCharacteristic c
                            ) {

                                logModule(
                                        "RX "
                                                + hex(
                                                        c.getValue()
                                                )
                                );
                            }

                            @Override
                            public void onCharacteristicRead(
                                    BluetoothGatt g,
                                    BluetoothGattCharacteristic c,
                                    int st
                            ) {

                                logModule(
                                        "READ "
                                                + c.getUuid()
                                                + " => "
                                                + hex(
                                                        c.getValue()
                                                )
                                );
                            }
                        },
                        Build.VERSION.SDK_INT >= 23
                                ? BluetoothDevice.TRANSPORT_LE
                                : 0
                );
    }

    void logModule(
            String s
    ) {

        String line =
                "[DEVICE-SOURCE] "
                        + s;

        String old =
                prefs.getString(
                        "log",
                        ""
                );

        String all =
                old
                        + line
                        + "\n";

        if(all.length() > 12000)
            all =
                    all.substring(
                            all.length() - 12000
                    );

        prefs.edit()
                .putString(
                        "log",
                        all
                )
                .apply();
    }

    void send(
            byte[] data
    ) {

        if(
                tx == null
                        ||
                gatt == null
        ) {

            logModule(
                    "NOT SENT • NO FFE1 CONNECTION"
            );

            return;
        }

        synchronized(queue) {

            queue.add(data);
        }

        pump();
    }

    void pump() {

        if(writing)
            return;

        byte[] b;

        synchronized(queue) {

            b =
                    queue.poll();
        }

        if(b == null)
            return;

        long wait =
                Math.max(
                        0,
                        80
                                -
                        (
                                System.currentTimeMillis()
                                        -
                                lastWrite
                        )
                );

        writing = true;

        handler.postDelayed(
                () -> {

                    try {

                        tx.setValue(b);

                        tx.setWriteType(
                                (
                                        tx.getProperties()
                                                &
                                        BluetoothGattCharacteristic.PROPERTY_WRITE_NO_RESPONSE
                                )
                                !=
                                0

                                ?

                                BluetoothGattCharacteristic.WRITE_TYPE_NO_RESPONSE

                                :

                                BluetoothGattCharacteristic.WRITE_TYPE_DEFAULT
                        );

                        boolean ok =
                                gatt.writeCharacteristic(
                                        tx
                                );

                        logModule(
                                "TX "
                                        + hex(b)
                                        + " RESULT="
                                        + ok
                        );

                    } catch(Exception e) {

                        logModule(
                                "TX ERROR "
                                        + e.getMessage()
                        );
                    }

                    lastWrite =
                            System.currentTimeMillis();

                    writing = false;

                    pump();

                },
                wait
        );
    }

    static String hex(
            byte[] b
    ) {

        StringBuilder s =
                new StringBuilder();

        for(byte x : b) {

            s.append(
                    String.format(
                            Locale.US,
                            "%02X ",
                            x & 255
                    )
            );
        }

        return s.toString().trim();
    }

