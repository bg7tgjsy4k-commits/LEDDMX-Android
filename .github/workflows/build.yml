              private void addColorEditor(
                      Frame f,
                      boolean left) {

                  LinearLayout box =
                          vertical();

                  TextView value =
                          text(
                                  rgbText(f, left),
                                  14);

                  box.addView(value);

                  ColorWheel wheel =
                          new ColorWheel(
                                  this,
                                  (r,g,b) -> {

                                      if (left) {
                                          f.lr = r;
                                          f.lg = g;
                                          f.lb = b;
                                      } else {
                                          f.rr = r;
                                          f.rg = g;
                                          f.rb = b;
                                      }

                                      value.setText(
                                              rgbText(
                                                      f,
                                                      left));
                                  });

                  box.addView(
                          wheel,
                          new LinearLayout.LayoutParams(
                                  ViewGroup.LayoutParams.MATCH_PARENT,
                                  340));

                  LinearLayout rgb =
                          horizontal();

                  EditText er =
                          numberField(
                                  "R");

                  EditText eg =
                          numberField(
                                  "G");

                  EditText eb =
                          numberField(
                                  "B");

                  setRGBFields(
                          f,
                          left,
                          er,
                          eg,
                          eb);

                  TextWatcher watcher =
                          new TextWatcher() {

                              public void beforeTextChanged(
                                      CharSequence s,
                                      int st,
                                      int c,
                                      int a) {
                              }

                              public void onTextChanged(
                                      CharSequence s,
                                      int st,
                                      int before,
                                      int count) {

                                  try {

                                      int r =
                                              clamp(
                                                      Integer.parseInt(
                                                              er.getText()
                                                                      .toString()));

                                      int g =
                                              clamp(
                                                      Integer.parseInt(
                                                              eg.getText()
                                                                      .toString()));

                                      int b =
                                              clamp(
                                                      Integer.parseInt(
                                                              eb.getText()
                                                                      .toString()));

                                      if (left) {

                                          f.lr = r;
                                          f.lg = g;
                                          f.lb = b;

                                      } else {

                                          f.rr = r;
                                          f.rg = g;
                                          f.rb = b;
                                      }

                                      value.setText(
                                              rgbText(
                                                      f,
                                                      left));

                                  } catch (Exception ignored) {
                                  }
                              }

                              public void afterTextChanged(
                                      Editable e) {
                              }
                          };

                  er.addTextChangedListener(
                          watcher);

                  eg.addTextChangedListener(
                          watcher);

                  eb.addTextChangedListener(
                          watcher);

                  rgb.addView(er,
                          weightParams());

                  rgb.addView(eg,
                          weightParams());

                  rgb.addView(eb,
                          weightParams());

                  box.addView(rgb);

                  add(box);
              }

              private void setRGBFields(
                      Frame f,
                      boolean left,
                      EditText r,
                      EditText g,
                      EditText b) {

                  r.setText(
                          String.valueOf(
                                  left ? f.lr : f.rr));

                  g.setText(
                          String.valueOf(
                                  left ? f.lg : f.rg));

                  b.setText(
                          String.valueOf(
                                  left ? f.lb : f.rb));
              }

              private LinearLayout.LayoutParams
              weightParams() {

                  return new LinearLayout.LayoutParams(
                          0,
                          60,
                          1f);
              }

              private EditText numberField(
                      String hint) {

                  EditText e =
                          new EditText(this);

                  e.setHint(hint);
                  e.setInputType(
                          InputType.TYPE_CLASS_NUMBER);
                  e.setTextColor(Color.WHITE);
                  e.setHintTextColor(Color.GRAY);

                  return e;
              }

              private String rgbText(
                      Frame f,
                      boolean left) {

                  if (left) {

                      return String.format(
                              Locale.US,
                              "RGB(%d,%d,%d)",
                              f.lr,
                              f.lg,
                              f.lb);

                  } else {

                      return String.format(
                              Locale.US,
                              "RGB(%d,%d,%d)",
                              f.rr,
                              f.rg,
                              f.rb);
                  }
              }

              private void addGenerator(
                      String title,
                      String type,
                      int a,
                      int b) {

                  Button btn =
                          button(title);

                  btn.setOnClickListener(
                          v -> {

                              generate(
                                      type,
                                      a,
                                      b);

                              showEditor();
                          });

                  add(btn);
              }

              private void generate(
                      String type,
                      int ca,
                      int cb) {

                  frames.clear();

                  if ("blink".equals(type)) {

                      for (int i = 0;
                           i < 8;
                           i++) {

                          int c =
                                  i % 2 == 0
                                          ? ca
                                          : cb;

                          frames.add(
                                  solidFrame(
                                          c,
                                          c,
                                          150));
                      }

                  } else if ("belang".equals(type)) {

                      for (int i = 0;
                           i < 10;
                           i++) {

                          frames.add(
                                  new Frame(
                                          Color.red(
                                                  i % 2 == 0
                                                          ? ca
                                                          : cb),
                                          Color.green(
                                                  i % 2 == 0
                                                          ? ca
                                                          : cb),
                                          Color.blue(
                                                  i % 2 == 0
                                                          ? ca
                                                          : cb),

                                          Color.red(
                                                  i % 2 == 0
                                                          ? cb
                                                          : ca),
                                          Color.green(
                                                  i % 2 == 0
                                                          ? cb
                                                          : ca),
                                          Color.blue(
                                                  i % 2 == 0
                                                          ? cb
                                                          : ca),

                                          220));
                      }

                  } else if ("fade".equals(type)) {

                      int ar = Color.red(ca);
                      int ag = Color.green(ca);
                      int ab = Color.blue(ca);

                      int br = Color.red(cb);
                      int bg = Color.green(cb);
                      int bb = Color.blue(cb);

                      for (int i = 0;
                           i < 16;
                           i++) {

                          float t =
                                  i / 15f;

                          int r =
                                  Math.round(
                                          ar +
                                          (br - ar) * t);

                          int g =
                                  Math.round(
                                          ag +
                                          (bg - ag) * t);

                          int bl =
                                  Math.round(
                                          ab +
                                          (bb - ab) * t);

                          frames.add(
                                  solidFrame(
                                          Color.rgb(
                                                  r,g,bl),
                                          Color.rgb(
                                                  br, bg, bb),
                                          80));
                      }

                      for (int i = 14;
                           i >= 0;
                           i--) {

                          float t =
                                  i / 15f;

                          int r =
                                  Math.round(
                                          ar +
                                          (br - ar) * t);

                          int g =
                                  Math.round(
                                          ag +
                                          (bg - ag) * t);

                          int bl =
                                  Math.round(
                                          ab +
                                          (bb - ab) * t);

                          frames.add(
                                  solidFrame(
                                          Color.rgb(
                                                  r,g,bl),
                                          Color.rgb(
                                                  br,bg,bb),
                                          80));
                      }

                  } else if ("stripe".equals(type)) {

                      for (int i = 0;
                           i < 12;
                           i++) {

                          int l =
                                  i % 2 == 0
                                          ? ca
                                          : cb;

                          int r =
                                  i % 2 == 0
                                          ? cb
                                          : ca;

                          frames.add(
                                  solidFrame(
                                          l,
                                          r,
                                          140));
                      }

                  } else if ("chase".equals(type)) {

                      for (int i = 0;
                           i < 12;
                           i++) {

                          int l =
                                  i % 2 == 0
                                          ? ca
                                          : Color.BLACK;

                          int r =
                                  i % 2 == 0
                                          ? Color.BLACK
                                          : ca;

                          frames.add(
                                  solidFrame(
                                          l,
                                          r,
                                          110));
                      }

                  } else if ("rainbow".equals(type)) {

                      for (int i = 0;
                           i < 24;
                           i++) {

                          int c =
                                  Color.HSVToColor(
                                          new float[]{
                                                  i * 15f,
                                                  1f,
                                                  1f
                                          });

                          int d =
                                  Color.HSVToColor(
                                          new float[]{
                                                  i * 15f + 180f,
                                                  1f,
                                                  1f
                                          });

                          frames.add(
                                  solidFrame(
                                          c,
                                          d,
                                          100));
                      }

                  }

                  selectedFrame = 0;
              }

              private Frame solidFrame(
                      int left,
                      int right,
                      int duration) {

                  return new Frame(
                          Color.red(left),
                          Color.green(left),
                          Color.blue(left),

                          Color.red(right),
                          Color.green(right),
                          Color.blue(right),

                          duration);
              }

              private void saveSlot(
                      int slot) {

                  StringBuilder s =
                          new StringBuilder();

                  for (Frame f : frames) {

                      s.append(
                              f.lr).append(',')
                              .append(f.lg).append(',')
                              .append(f.lb).append(',')

                              .append(f.rr).append(',')
                              .append(f.rg).append(',')
                              .append(f.rb).append(',')

                              .append(f.duration)
                              .append(';');
                  }

                  prefs.edit()
                          .putString(
                                  key(slot),
                                  s.toString())
                          .apply();
              }

              private void loadSlot(
                      int slot) {

                  frames.clear();

                  String data =
                          prefs.getString(
                                  key(slot),
                                  "");

                  if (data.isEmpty()) {

                      frames.add(
                              new Frame(
                                      255,
                                      0,
                                      0,
                                      0,
                                      0,
                                      255,
                                      300));

                      selectedFrame = 0;
                      return;
                  }

                  String[] list =
                          data.split(";");

                  for (String row : list) {

                      if (row.trim().isEmpty()) {
                          continue;
                      }

                      String[] p =
                              row.split(",");

                      if (p.length < 7) {
                          continue;
                      }

                      try {

                          frames.add(
                                  new Frame(
                                          Integer.parseInt(p[0]),
                                          Integer.parseInt(p[1]),
                                          Integer.parseInt(p[2]),
                                          Integer.parseInt(p[3]),
                                          Integer.parseInt(p[4]),
                                          Integer.parseInt(p[5]),
                                          Integer.parseInt(p[6])));
                      } catch (Exception ignored) {
                      }
                  }

                  if (frames.isEmpty()) {

                      frames.add(
                              new Frame(
                                      255,
                                      0,
                                      0,
                                      0,
                                      0,
                                      255,
                                      300));
                  }

                  selectedFrame = 0;
              }

              private void startPreview() {

                  if (frames.isEmpty()) {
                      return;
                  }

                  stopPreview();

                  previewRunnable =
                          new Runnable() {

                              @Override
                              public void run() {

                                  if (frames.isEmpty()) {
                                      return;
                                  }

                                  if (selectedFrame >=
                                          frames.size()) {

                                      selectedFrame = 0;
                                  }

                                  updatePreview();

                                  Frame f =
                                          frames.get(
                                                  selectedFrame);

                                  int delay =
                                          Math.max(
                                                  50,
                                                  Math.round(
                                                          f.duration *
                                                          speedMs /
                                                          300f));

                                  selectedFrame++;

                                  if (selectedFrame >=
                                          frames.size()) {

                                      selectedFrame = 0;
                                  }

                                  previewHandler.postDelayed(
                                          this,
                                          delay);
                              }
                          };

                  previewHandler.post(
                          previewRunnable);
              }

              private void stopPreview() {

                  if (previewRunnable != null) {

                      previewHandler.removeCallbacks(
                              previewRunnable);

                      previewRunnable = null;
                  }
              }

              private void updatePreview() {

                  if (previewView == null ||
                      frames.isEmpty()) {
                      return;
                  }

                  previewView.setFrame(
                          frames.get(
                                  Math.min(
                                          selectedFrame,
                                          frames.size() - 1)));
              }

              private void aiGenerate(
                      String prompt) {

                  String p =
                          prompt.toLowerCase(
                                  Locale.US);

                  ArrayList<Integer> colors =
                          new ArrayList<>();

                  Pattern colorPattern =
                          Pattern.compile(
                                  "merah|red|" +
                                  "hijau|green|" +
                                  "biru|blue|" +
                                  "putih|white|" +
                                  "kuning|yellow|" +
                                  "ungu|purple|" +
                                  "cyan|orange|pink|" +
                                  "magenta");

                  Matcher m =
                          colorPattern.matcher(p);

                  while (m.find()) {

                      colors.add(
                              colorFromWord(
                                      m.group()));
                  }

                  if (colors.isEmpty()) {
                      colors.add(Color.RED);
                  }

                  int duration = 300;

                  if (p.contains("cepat") ||
                      p.contains("fast") ||
                      p.contains("kencang")) {

                      duration = 100;

                  } else if (
                          p.contains("lambat") ||
                          p.contains("slow") ||
                          p.contains("pelan")) {

                      duration = 700;
                  }

                  frames.clear();

                  if (p.contains("rainbow") ||
                      p.contains("pelangi")) {

                      generate(
                              "rainbow",
                              colors.get(0),
                              colors.size() > 1
                                      ? colors.get(1)
                                      : Color.BLUE);

                  } else if (
                          p.contains("fade") ||
                          p.contains("gradasi")) {

                      generate(
                              "fade",
                              colors.get(0),
                              colors.size() > 1
                                      ? colors.get(1)
                                      : Color.BLUE);

                  } else if (
                          p.contains("belang") ||
                          p.contains("alternating") ||
                          p.contains("bergantian")) {

                      generate(
                              "belang",
                              colors.get(0),
                              colors.size() > 1
                                      ? colors.get(1)
                                      : Color.WHITE);

                  } else if (
                          p.contains("stripe")) {

                      generate(
                              "stripe",
                              colors.get(0),
                              colors.size() > 1
                                      ? colors.get(1)
                                      : Color.BLUE);

                  } else if (
                          p.contains("chase") ||
                          p.contains("running") ||
                          p.contains("jalan") ||
                          p.contains("lari")) {

                      generate(
                              "chase",
                              colors.get(0),
                              colors.size() > 1
                                      ? colors.get(1)
                                      : Color.BLUE);

                  } else {

                      if (p.contains("strobo") ||
                          p.contains("strobe") ||
                          p.contains("blink")) {

                          generate(
                                  "blink",
                                  colors.get(0),
                                  colors.size() > 1
                                          ? colors.get(1)
                                          : Color.WHITE);

                      } else {

                          for (int i = 0;
                               i < colors.size() * 2;
                               i++) {

                              int a =
                                      colors.get(
                                              i %
                                              colors.size());

                              int b =
                                      colors.get(
                                              (i + 1) %
                                              colors.size());

                              frames.add(
                                      solidFrame(
                                              a,
                                              b,
                                              duration));
                          }
                      }
                  }

                  for (Frame f : frames) {
                      f.duration = duration;
                  }

                  selectedFrame = 0;
              }

              private int colorFromWord(
                      String w) {

                  if (w.equals("merah") ||
                      w.equals("red")) {
                      return Color.RED;
                  }

                  if (w.equals("hijau") ||
                      w.equals("green")) {
                      return Color.GREEN;
                  }

                  if (w.equals("biru") ||
                      w.equals("blue")) {
                      return Color.BLUE;
                  }

                  if (w.equals("putih") ||
                      w.equals("white")) {
                      return Color.WHITE;
                  }

                  if (w.equals("kuning") ||
                      w.equals("yellow")) {
                      return Color.YELLOW;
                  }

                  if (w.equals("ungu") ||
                      w.equals("purple")) {
                      return Color.rgb(
                              160,
                              0,
                              255);
                  }

                  if (w.equals("cyan")) {
                      return Color.CYAN;
                  }

                  if (w.equals("orange")) {
                      return Color.rgb(
                              255,
                              120,
                              0);
                  }

                  if (w.equals("pink") ||
                      w.equals("magenta")) {
                      return Color.MAGENTA;
                  }

                  return Color.WHITE;
              }

