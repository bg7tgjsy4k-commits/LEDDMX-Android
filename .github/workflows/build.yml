name: Build LEDDMX AI Pro FINAL

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Create Android Project & Local Properties
        shell: bash
        run: |
          set -e

          rm -rf app build.gradle settings.gradle gradle.properties local.properties gradlew gradlew.bat gradle
          mkdir -p app/src/main/java/com/leddmx/pro
          mkdir -p app/src/main/res/values

          echo "sdk.dir=$ANDROID_HOME" > local.properties

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "LEDDMX-AI-Pro"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.2.0' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.leddmx.pro'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.leddmx.pro'
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">LEDDMX AI Pro</string>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.BLUETOOTH" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" />
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
              <uses-permission android:name="android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation" />
              <uses-feature android:name="android.hardware.bluetooth_le" android:required="false" />
              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:theme="@android:style/Theme.Material.NoActionBar"
                  android:supportsRtl="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/leddmx/pro/BluetoothService.java <<'EOF'
          package com.leddmx.pro;
          import android.bluetooth.BluetoothGatt;
          import android.bluetooth.BluetoothGattCharacteristic;
          public class BluetoothService {
              private static BluetoothService instance;
              public static synchronized BluetoothService getInstance() {
                  if (instance == null) instance = new BluetoothService();
                  return instance;
              }
              public BluetoothGatt gatt;
              public BluetoothGattCharacteristic writeChar;
              public boolean isConnected = false;
              public int lastUsedMode = 171;
              public void sendPacket(byte[] data) {
                  if (gatt == null || writeChar == null) return;
                  try {
                      writeChar.setValue(data);
                      gatt.writeCharacteristic(writeChar);
                  } catch (Exception ignored) {}
              }
          }
          EOF

          cat > app/src/main/java/com/leddmx/pro/MainActivity.java <<'EOF'
          package com.leddmx.pro;
          import android.Manifest;
          import android.app.Activity;
          import android.bluetooth.BluetoothAdapter;
          import android.bluetooth.BluetoothDevice;
          import android.bluetooth.BluetoothGatt;
          import android.bluetooth.BluetoothGattCallback;
          import android.bluetooth.BluetoothGattCharacteristic;
          import android.bluetooth.BluetoothGattService;
          import android.bluetooth.BluetoothManager;
          import android.bluetooth.le.BluetoothLeScanner;
          import android.bluetooth.le.ScanCallback;
          import android.bluetooth.le.ScanResult;
          import android.content.Context;
          import android.content.SharedPreferences;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.os.Handler;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.GridLayout;
          import android.widget.LinearLayout;
          import android.widget.Spinner;
          import android.widget.TextView;
          import android.widget.Toast;
          import java.util.ArrayList;
          import java.util.Locale;

          public class MainActivity extends Activity {
              private final Handler handler = new Handler();
              private BluetoothAdapter bluetoothAdapter;
              private BluetoothLeScanner scanner;
              private BluetoothGatt gatt;
              private TextView status;
              private TextView currentMode;
              private LinearLayout content;
              private SharedPreferences prefs;
              private int currentModeNumber = 171;
              private final ArrayList<Frame> frames = new ArrayList<>();
              private int selectedSlot = 171;
              private boolean playing = false;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  prefs = getSharedPreferences("leddmx_slots", MODE_PRIVATE);
                  BluetoothManager bm = (BluetoothManager) getSystemService(Context.BLUETOOTH_SERVICE);
                  if (bm != null) bluetoothAdapter = bm.getAdapter();
                  buildRoot();
                  showHome();
                  if (checkSelfPermission(Manifest.permission.BLUETOOTH_SCAN) != android.content.pm.PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(new String[]{Manifest.permission.BLUETOOTH_SCAN, Manifest.permission.BLUETOOTH_CONNECT}, 100);
                  }
              }

              private void buildRoot() {
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setBackgroundColor(Color.rgb(16,17,20));

                  LinearLayout top = new LinearLayout(this);
                  top.setGravity(Gravity.CENTER_VERTICAL);
                  top.setPadding(24,18,24,18);
                  TextView title = text("LEDDMX AI PRO", 22);
                  top.addView(title, new LinearLayout.LayoutParams(0, -2, 1));
                  Button connect = button("SCAN");
                  connect.setOnClickListener(v -> scan());
                  top.addView(connect);
                  root.addView(top);

                  status = text("DISCONNECTED", 14);
                  status.setPadding(24,0,24,15);
                  root.addView(status);

                  content = new LinearLayout(this);
                  content.setOrientation(LinearLayout.VERTICAL);
                  content.setPadding(18,10,18,10);
                  root.addView(content, new LinearLayout.LayoutParams(-1, 0, 1));

                  LinearLayout nav = new LinearLayout(this);
                  nav.setPadding(8,8,8,8);
                  String[] names = {"HOME", "MODES", "CUSTOM", "AI", "SETTINGS"};
                  for (int i=0; i<names.length; i++) {
                      final String name = names[i];
                      Button b = button(name);
                      b.setTextSize(11);
                      b.setOnClickListener(v -> {
                          if (name.equals("HOME")) showHome();
                          else if (name.equals("MODES")) showModes();
                          else if (name.equals("CUSTOM")) showCustom();
                          else if (name.equals("AI")) showAI();
                          else if (name.equals("SETTINGS")) showSettings();
                      });
                      nav.addView(b, new LinearLayout.LayoutParams(0, 60, 1));
                  }
                  root.addView(nav);
                  setContentView(root);
              }

              private void clearContent() {
                  stopPreview();
                  content.removeAllViews();
              }

              private void showHome() {
                  clearContent();
                  content.addView(text("HOME", 28));
                  currentMode = text("MODE " + currentModeNumber, 22);
                  content.addView(currentMode);

                  Button on = button("POWER ON");
                  on.setOnClickListener(v -> sendMode(currentModeNumber));
                  content.addView(on);

                  Button off = button("POWER OFF");
                  off.setOnClickListener(v -> sendOff());
                  content.addView(off);

                  Button custom = button("OPEN CUSTOM / DIY STUDIO");
                  custom.setOnClickListener(v -> showCustom());
                  content.addView(custom);

                  Button ai = button("AI ANIMATION");
                  ai.setOnClickListener(v -> showAI());
                  content.addView(ai);
              }

              private void showModes() {
                  clearContent();
                  content.addView(text("MODES 1 - 210", 28));
                  GridLayout grid = new GridLayout(this);
                  grid.setColumnCount(4);
                  for (int i=1; i<=210; i++) {
                      final int mode = i;
                      Button b = button(String.format(Locale.US, "%03d", mode));
                      b.setTextSize(12);
                      b.setOnClickListener(v -> sendMode(mode));
                      GridLayout.LayoutParams lp = new GridLayout.LayoutParams();
                      lp.width = 0; lp.height = 58;
                      lp.columnSpec = GridLayout.spec(GridLayout.UNDEFINED, 1f);
                      lp.setMargins(4,4,4,4);
                      grid.addView(b, lp);
                  }
                  content.addView(grid, new LinearLayout.LayoutParams(-1, 0, 1));
              }

              private void showCustom() {
                  clearContent();
                  content.addView(text("CUSTOM STUDIO", 28));
                  Spinner slot = new Spinner(this);
                  String[] slots = new String[40];
                  for (int i=0; i<40; i++) slots[i] = "CUSTOM " + (171+i);
                  android.widget.ArrayAdapter<String> adapter = new android.widget.ArrayAdapter<String>(this, android.R.layout.simple_spinner_dropdown_item, slots);
                  slot.setAdapter(adapter);
                  slot.setSelection(selectedSlot - 171);
                  slot.setOnItemSelectedListener(new android.widget.AdapterView.OnItemSelectedListener() {
                      public void onItemSelected(android.widget.AdapterView<?> p, View v, int pos, long id) {
                          selectedSlot = 171 + pos;
                          loadSlot();
                      }
                      public void onNothingSelected(android.widget.AdapterView<?> p) {}
                  });
                  content.addView(slot);

                  LinearLayout editor = new LinearLayout(this);
                  editor.setOrientation(LinearLayout.VERTICAL);
                  content.addView(editor, new LinearLayout.LayoutParams(-1, 0, 1));
                  loadSlot();
                  rebuildEditor(editor);
              }

              private void rebuildEditor(final LinearLayout editor) {
                  editor.removeAllViews();
                  Button add = button("ADD FRAME");
                  add.setOnClickListener(v -> {
                      frames.add(new Frame(255,0,0, 255,0,0, 400));
                      rebuildEditor(editor);
                  });
                  editor.addView(add);

                  Button clear = button("CLEAR TIMELINE");
                  clear.setOnClickListener(v -> {
                      frames.clear();
                      rebuildEditor(editor);
                  });
                  editor.addView(clear);

                  for (int i=0; i<frames.size(); i++) {
                      final int index = i;
                      Frame f = frames.get(i);
                      LinearLayout row = new LinearLayout(this);
                      row.setOrientation(LinearLayout.VERTICAL);
                      row.addView(text("FRAME " + (i+1), 16));
                      
                      Button del = button("DELETE");
                      del.setOnClickListener(v -> {
                          frames.remove(index);
                          rebuildEditor(editor);
                      });
                      row.addView(del);
                      editor.addView(row);
                  }

                  Button save = button("SAVE SLOT");
                  save.setOnClickListener(v -> saveSlot());
                  editor.addView(save);

                  Button send = button("TEST / SEND");
                  send.setOnClickListener(v -> testFrames());
                  editor.addView(send);
              }

              private void showAI() {
                  clearContent();
                  content.addView(text("AI ANIMATION", 28));
                  final EditText cmd = edit("");
                  content.addView(cmd);
                  Button gen = button("GENERATE");
                  gen.setOnClickListener(v -> {
                      generateAI(cmd.getText().toString());
                      showCustom();
                  });
                  content.addView(gen);
              }

              private void generateAI(String s) {
                  frames.clear();
                  frames.add(new Frame(255,0,0, 0,0,255, 400));
                  frames.add(new Frame(0,0,255, 255,0,0, 400));
              }

              private void showSettings() {
                  clearContent();
                  content.addView(text("SETTINGS", 28));
                  content.addView(text("BLE SERVICE: FFE0\nWRITE: FFE1", 14));
              }

              private void saveSlot() {
                  StringBuilder s = new StringBuilder();
                  for (int i=0; i<frames.size(); i++) {
                      Frame f = frames.get(i);
                      s.append(f.lr).append(",").append(f.lg).append(",").append(f.lb).append(",");
                      s.append(f.rr).append(",").append(f.rg).append(",").append(f.rb).append(",").append(f.duration).append(";");
                  }
                  prefs.edit().putString("slot_" + selectedSlot, s.toString()).apply();
                  Toast.makeText(this, "Disimpan ke Slot " + selectedSlot, Toast.LENGTH_SHORT).show();
              }

              private void loadSlot() {
                  frames.clear();
                  String s = prefs.getString("slot_" + selectedSlot, "");
                  if (s.isEmpty()) return;
                  String[] rows = s.split(";");
                  for (int i=0; i<rows.length; i++) {
                      try {
                          String[] p = rows[i].split(",");
                          if (p.length == 7) {
                              frames.add(new Frame(Integer.parseInt(p[0]), Integer.parseInt(p[1]), Integer.parseInt(p[2]),
                                      Integer.parseInt(p[3]), Integer.parseInt(p[4]), Integer.parseInt(p[5]), Integer.parseInt(p[6])));
                          }
                      } catch (Exception ignored) {}
                  }
              }

              private void testFrames() {
                  if (frames.isEmpty()) {
                      Toast.makeText(this, "Kosong", Toast.LENGTH_SHORT).show();
                      return;
                  }
                  playing = true;
                  handler.post(new Runnable() {
                      int idx = 0;
                      public void run() {
                          if (!playing || frames.isEmpty()) return;
                          Frame f = frames.get(idx % frames.size());
                          sendColor((f.lr + f.rr)/2, (f.lg + f.rg)/2, (f.lb + f.rb)/2);
                          idx++;
                          handler.postDelayed(this, f.duration);
                      }
                  });
              }

              private void stopPreview() {
                  playing = false;
                  handler.removeCallbacksAndMessages(null);
              }

              private void sendMode(int mode) {
                  currentModeNumber = mode;
                  BluetoothService.getInstance().lastUsedMode = mode;
                  byte[] packet = {0x7B, (byte)0xFF, 0x03, (byte)mode, (byte)0xFF, (byte)0xFF, (byte)0xFF, (byte)0xFF, (byte)0xBF};
                  BluetoothService.getInstance().sendPacket(packet);
                  if (currentMode != null) currentMode.setText("MODE " + mode);
              }

              private void sendOff() {
                  stopPreview();
                  byte[] packet = {0x7B, (byte)0xFF, 0x07, 0x00, 0x00, 0x00, (byte)0xBF};
                  BluetoothService.getInstance().sendPacket(packet);
              }

              private void sendColor(int r, int g, int b) {
                  byte[] packet = {0x7B, (byte)0xFF, 0x07, (byte)Math.max(0,Math.min(255,r)), (byte)Math.max(0,Math.min(255,g)), (byte)Math.max(0,Math.min(255,b)), (byte)0xBF};
                  BluetoothService.getInstance().sendPacket(packet);
              }

              private void scan() {
                  if (bluetoothAdapter == null) return;
                  scanner = bluetoothAdapter.getBluetoothLeScanner();
                  if (scanner == null) return;
                  status.setText("SCANNING...");
                  try {
                      scanner.startScan(scanCallback);
                      handler.postDelayed(() -> {
                          try { if (scanner != null) scanner.stopScan(scanCallback); } catch (Exception ignored) {}
                      }, 10000);
                  } catch (Exception ignored) {}
              }

              private final ScanCallback scanCallback = new ScanCallback() {
                  public void onScanResult(int type, ScanResult result) {
                      BluetoothDevice d = result.getDevice();
                      String name = null;
                      try { name = d.getName(); } catch (Exception ignored) {}
                      if (name != null && name.contains("LEDDMX")) {
                          try { scanner.stopScan(this); } catch (Exception ignored) {}
                          connect(d);
                      }
                  }
              };

              private void connect(BluetoothDevice device) {
                  status.setText("CONNECTING...");
                  try {
                      gatt = device.connectGatt(MainActivity.this, false, gattCallback);
                  } catch (Exception ignored) {}
              }

              private final BluetoothGattCallback gattCallback = new BluetoothGattCallback() {
                  public void onConnectionStateChange(final BluetoothGatt g, int statusVal, final int newState) {
                      runOnUiThread(() -> {
                          if (newState == BluetoothGatt.STATE_CONNECTED) {
                              status.setText("CONNECTED");
                              BluetoothService.getInstance().gatt = g;
                              BluetoothService.getInstance().isConnected = true;
                              g.discoverServices();
                          } else {
                              status.setText("DISCONNECTED");
                              BluetoothService.getInstance().isConnected = false;
                              BluetoothService.getInstance().gatt = null;
                              BluetoothService.getInstance().writeChar = null;
                          }
                      });
                  }
                  public void onServicesDiscovered(BluetoothGatt g, int statusVal) {
                      BluetoothGattService service = g.getService(java.util.UUID.fromString("0000FFE0-0000-1000-8000-00805F9B34FB"));
                      if (service == null) return;
                      BluetoothGattCharacteristic write = service.getCharacteristic(java.util.UUID.fromString("0000FFE1-0000-1000-8000-00805F9B34FB"));
                      if (write != null) {
                          BluetoothService.getInstance().writeChar = write;
                          runOnUiThread(() -> status.setText("CONNECTED / READY"));
                      }
                  }
              };

              private TextView text(String s, float size) {
                  TextView t = new TextView(this);
                  t.setText(s); t.setTextSize(size); t.setTextColor(Color.WHITE); t.setPadding(8,8,8,8);
                  return t;
              }

              private Button button(String s) {
                  Button b = new Button(this);
                  b.setText(s); b.setTextColor(Color.WHITE);
                  return b;
              }

              private EditText edit(String s) {
                  EditText e = new EditText(this);
                  e.setText(s); e.setTextColor(Color.WHITE); e.setHintTextColor(Color.GRAY);
                  return e;
              }

              private static class Frame {
                  int lr, lg, lb, rr, rg, rb, duration;
                  Frame(int lr, int lg, int lb, int rr, int rg, int rb, int duration) {
                      this.lr=lr; this.lg=lg; this.lb=lb;
                      this.rr=rr; this.rg=rg; this.rb=rb;
                      this.duration = duration;
                  }
              }

              protected void onDestroy() {
                  stopPreview();
                  if (gatt != null) { try { gatt.disconnect(); gatt.close(); } catch (Exception ignored) {} }
                  super.onDestroy();
              }
          }
          EOF

      - name: Build Debug APK
        run: gradle --no-daemon clean assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LEDDMX-AI-Pro-FINAL
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
