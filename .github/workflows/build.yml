name: LEDDMX AI Pro FINAL

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Create Android project
        shell: bash
        run: |
          set -e

          mkdir -p app/src/main/java/com/leddmx/pro
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "LEDDMX-AI-Pro"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=false
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.leddmx.pro'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.leddmx.pro'
                  minSdk 23
                  targetSdk 35
                  versionCode 13
                  versionName '13.0'
              }
          }
          EOF

          cat > app/src/main/res/values/colors.xml <<'EOF'
          <resources>
              <color name="black">#000000</color>
              <color name="white">#FFFFFF</color>
          </resources>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme"
                  parent="@android:style/Theme.Material.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">#000000</item>
                  <item name="android:navigationBarColor">#000000</item>
                  <item name="android:colorAccent">#00D9FF</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.BLUETOOTH"/>
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN"/>
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>

              <uses-permission
                  android:name="android.permission.BLUETOOTH_SCAN"
                  android:usesPermissionFlags="neverForLocation"/>

              <uses-permission
                  android:name="android.permission.BLUETOOTH_CONNECT"/>

              <application
                  android:theme="@style/AppTheme"
                  android:label="LEDDMX AI Pro"
                  android:allowBackup="false"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>

              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/leddmx/pro/MainActivity.java <<'EOF'
          package com.leddmx.pro;

          import android.Manifest;
          import android.app.Activity;
          import android.app.AlertDialog;
          import android.bluetooth.BluetoothAdapter;
          import android.bluetooth.BluetoothDevice;
          import android.bluetooth.BluetoothGatt;
          import android.bluetooth.BluetoothGattCallback;
          import android.bluetooth.BluetoothGattCharacteristic;
          import android.bluetooth.BluetoothGattService;
          import android.bluetooth.BluetoothManager;
          import android.bluetooth.le.BluetoothLeScanner;
          import android.bluetooth.le.ScanCallback;
          import android.bluetooth.le.ScanResult;
          import android.content.Context;
          import android.content.SharedPreferences;
          import android.content.pm.PackageManager;
          import android.graphics.Canvas;
          import android.graphics.Color;
          import android.graphics.Paint;
          import android.graphics.RadialGradient;
          import android.graphics.Shader;
          import android.graphics.SweepGradient;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.text.InputType;
          import android.view.Gravity;
          import android.view.MotionEvent;
          import android.view.View;
          import android.view.ViewGroup;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.SeekBar;
          import android.widget.Space;
          import android.widget.TextView;
          import android.widget.Toast;

          import java.util.ArrayList;
          import java.util.Locale;
          import java.util.regex.Matcher;
          import java.util.regex.Pattern;

          public class MainActivity extends Activity {

              private static final String SERVICE_UUID =
                      "0000FFE0-0000-1000-8000-00805F9B34FB";

              private static final String WRITE_UUID =
                      "0000FFE1-0000-1000-8000-00805F9B34FB";

              private static final int REQ_BLE = 1001;

              private BluetoothAdapter adapter;
              private BluetoothGatt gatt;
              private BluetoothGattCharacteristic writeChar;
              private BluetoothLeScanner scanner;

              private boolean scanning = false;
              private boolean connected = false;

              private final Handler handler =
                      new Handler(Looper.getMainLooper());

              private final ArrayList<BluetoothDevice> devices =
                      new ArrayList<>();

              private final ArrayList<Frame> frames =
                      new ArrayList<>();

              private SharedPreferences prefs;

              private int lastMode = 1;
              private int editSlot = 171;
              private int playIndex = 0;

              private int brightness = 100;
              private int speedMs = 300;

              private TextView statusText;

              private final ScanCallback scanCallback =
                      new ScanCallback() {

                  @Override
                  public void onScanResult(
                          int callbackType,
                          ScanResult result) {

                      BluetoothDevice d = result.getDevice();

                      if (d == null) return;

                      if (!devices.contains(d)) {
                          devices.add(d);
                          showDeviceDialog();
                      }
                  }
              };

              @Override
              protected void onCreate(Bundle state) {
                  super.onCreate(state);

                  prefs = getSharedPreferences(
                          "leddmx",
                          MODE_PRIVATE);

                  BluetoothManager manager =
                          (BluetoothManager)
                                  getSystemService(
                                          BLUETOOTH_SERVICE);

                  adapter = manager.getAdapter();

                  frames.add(defaultFrame());

                  showHome();
              }

              private boolean hasBlePermission() {

                  if (Build.VERSION.SDK_INT >= 31) {
                      return checkSelfPermission(
                              Manifest.permission.BLUETOOTH_SCAN)
                              == PackageManager.PERMISSION_GRANTED
                              &&
                              checkSelfPermission(
                                      Manifest.permission.BLUETOOTH_CONNECT)
                              == PackageManager.PERMISSION_GRANTED;
                  }

                  return checkSelfPermission(
                          Manifest.permission.ACCESS_FINE_LOCATION)
                          == PackageManager.PERMISSION_GRANTED;
              }

              private void requestBlePermission() {

                  if (Build.VERSION.SDK_INT >= 31) {

                      requestPermissions(
                              new String[]{
                                      Manifest.permission.BLUETOOTH_SCAN,
                                      Manifest.permission.BLUETOOTH_CONNECT
                              },
                              REQ_BLE);

                  } else {

                      requestPermissions(
                              new String[]{
                                      Manifest.permission.ACCESS_FINE_LOCATION
                              },
                              REQ_BLE);
                  }
              }

              @Override
              public void onRequestPermissionsResult(
                      int requestCode,
                      String[] permissions,
                      int[] results) {

                  super.onRequestPermissionsResult(
                          requestCode,
                          permissions,
                          results);

                  if (requestCode == REQ_BLE) {

                      if (hasBlePermission()) {
                          startScan();
                      } else {
                          toast("Permission Bluetooth diperlukan.");
                      }
                  }
              }

              private void startScan() {

                  if (!hasBlePermission()) {
                      requestBlePermission();
                      return;
                  }

                  if (adapter == null) {
                      toast("Bluetooth tidak tersedia.");
                      return;
                  }

                  if (!adapter.isEnabled()) {
                      toast("Nyalakan Bluetooth terlebih dahulu.");
                      return;
                  }

                  scanner = adapter.getBluetoothLeScanner();

                  if (scanner == null) {
                      toast("BLE scanner tidak tersedia.");
                      return;
                  }

                  devices.clear();
                  scanning = true;

                  scanner.startScan(scanCallback);

                  toast("Scanning BLE...");

                  handler.postDelayed(() -> {

                      if (scanning) {

                          scanning = false;

                          try {
                              scanner.stopScan(scanCallback);
                          } catch (Exception ignored) {}

                          showDeviceDialog();
                      }

                  }, 8000);
              }

              private void showDeviceDialog() {

                  if (isFinishing()) return;

                  LinearLayout box = vertical();

                  if (devices.isEmpty()) {

                      box.addView(
                              text(
                                      "Belum ada perangkat.\n\n" +
                                      "Pastikan LEDDMX-00-b2cd " +
                                      "menyala.",
                                      16));

                  } else {

                      for (BluetoothDevice d : devices) {

                          String name;

                          try {
                              name = d.getName();
                          } catch (Exception e) {
                              name = null;
                          }

                          if (name == null ||
                                  name.trim().isEmpty()) {
                              name = "BLE DEVICE";
                          }

                          Button b =
                                  button(
                                          name + "\n" +
                                          d.getAddress());

                          b.setOnClickListener(v -> {
                              connect(d);
                          });

                          box.addView(b);
                      }
                  }

                  new AlertDialog.Builder(this)
                          .setTitle("BLE DEVICES")
                          .setView(box)
                          .setNegativeButton("CLOSE", null)
                          .show();
              }

              private void connect(BluetoothDevice device) {

                  if (!hasBlePermission()) {
                      requestBlePermission();
                      return;
                  }

                  try {

                      if (gatt != null) {
                          gatt.close();
                          gatt = null;
                      }

                      connected = false;
                      writeChar = null;

                      gatt = device.connectGatt(
                              this,
                              false,
                              gattCallback);

                      toast("Menghubungkan...");

                  } catch (Exception e) {
                      toast("Gagal konek BLE.");
                  }
              }

              private final BluetoothGattCallback gattCallback =
                      new BluetoothGattCallback() {

                  @Override
                  public void onConnectionStateChange(
                          BluetoothGatt g,
                          int status,
                          int newState) {

                      runOnUiThread(() -> {

                          if (newState ==
                                  BluetoothGatt.STATE_CONNECTED) {

                              connected = true;

                              status(
                                      "CONNECTED");

                              try {
                                  g.discoverServices();
                              } catch (Exception ignored) {}

                              toast("LEDDMX terhubung.");

                          } else {

                              connected = false;
                              writeChar = null;

                              status("DISCONNECTED");
                          }
                      });
                  }

                  @Override
                  public void onServicesDiscovered(
                          BluetoothGatt g,
                          int status) {

                      BluetoothGattService service =
                              g.getService(
                                      java.util.UUID.fromString(
                                              SERVICE_UUID));

                      if (service == null) {
                          toast("Service FFE0 tidak ditemukan.");
                          return;
                      }

                      writeChar =
                              service.getCharacteristic(
                                      java.util.UUID.fromString(
                                              WRITE_UUID));

                      if (writeChar == null) {
                          toast("Characteristic FFE1 tidak ditemukan.");
                      } else {
                          toast("BLE siap digunakan.");
                      }
                  }
              };

              private void send(byte[] data) {

                  if (!connected ||
                          gatt == null ||
                          writeChar == null) {

                      toast("Hubungkan LEDDMX terlebih dahulu.");
                      return;
                  }

                  try {

                      int properties =
                              writeChar.getProperties();

                      if ((properties &
                              BluetoothGattCharacteristic
                                      .PROPERTY_WRITE_NO_RESPONSE)
                              != 0) {

                          writeChar.setWriteType(
                                  BluetoothGattCharacteristic
                                          .WRITE_TYPE_NO_RESPONSE);

                      } else {

                          writeChar.setWriteType(
                                  BluetoothGattCharacteristic
                                          .WRITE_TYPE_DEFAULT);
                      }

                      if (Build.VERSION.SDK_INT >= 33) {

                          gatt.writeCharacteristic(
                                  writeChar,
                                  data,
                                  writeChar.getWriteType());

                      } else {

                          writeChar.setValue(data);
                          gatt.writeCharacteristic(
                                  writeChar);
                      }

                  } catch (Exception e) {

                      toast("Gagal kirim packet.");
                  }
              }

              private void sendMode(int mode) {

                  mode = Math.max(1,
                          Math.min(210, mode));

                  lastMode = mode;

                  byte[] p = new byte[]{
                          0x7B,
                          (byte)0xFF,
                          0x03,
                          (byte)mode,
                          (byte)0xFF,
                          (byte)0xFF,
                          (byte)0xFF,
                          (byte)0xFF,
                          (byte)0xBF
                  };

                  send(p);

                  status("MODE " + mode);
              }

              private void sendColor(
                      int r,
                      int g,
                      int b) {

                  byte[] p = new byte[]{
                          0x7B,
                          (byte)0xFF,
                          0x07,
                          (byte)clamp(r),
                          (byte)clamp(g),
                          (byte)clamp(b),
                          (byte)0xBF
                  };

                  send(p);
              }

              private void powerOff() {
                  sendColor(0, 0, 0);
                  status("OFF");
              }

              private int applyBrightness(int v) {

                  return clamp(
                          Math.round(
                                  v *
                                  (brightness / 100f)));
              }

              private void showHome() {

                  basePage("LEDDMX AI PRO");

                  statusText =
                          text(
                                  connected
                                  ? "CONNECTED"
                                  : "DISCONNECTED",
                                  16);

                  add(statusText);

                  Button connect =
                          button("🔵 CONNECT LEDDMX");

                  connect.setOnClickListener(
                          v -> startScan());

                  add(connect);

                  addSpace(8);

                  Button off =
                          button("⏻ POWER OFF");

                  off.setOnClickListener(
                          v -> powerOff());

                  add(off);

                  add(heading("PRESET MODE 1 - 210"));

                  LinearLayout modeRow =
                          horizontal();

                  EditText modeInput =
                          number(lastMode);

                  modeRow.addView(
                          modeInput,
                          new LinearLayout.LayoutParams(
                                  0, 60, 1));

                  Button sendMode =
                          button("SEND MODE");

                  modeRow.addView(
                          sendMode,
                          new LinearLayout.LayoutParams(
                                  0, 60, 1));

                  add(modeRow);

                  sendMode.setOnClickListener(v -> {

                      int mode = value(modeInput);

                      if (mode < 1 || mode > 210) {
                          toast("Mode harus 1 - 210.");
                          return;
                      }

                      sendMode(mode);
                  });

                  addSpace(8);

                  ModePreviewView preview =
                          new ModePreviewView(this);

                  add(
                          preview,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  250));

                  modeInput.setOnKeyListener(
                          (v, key, event) -> {

                              preview.setMode(
                                      value(modeInput));

                              return false;
                          });

                  SeekBar speed =
                          new SeekBar(this);

                  speed.setMax(950);
                  speed.setProgress(
                          Math.max(
                                  50,
                                  Math.min(
                                          1000,
                                          speedMs))
                          - 50);

                  add(heading("SPEED"));
                  add(speed);

                  speed.setOnSeekBarChangeListener(
                          new SeekBar.OnSeekBarChangeListener() {

                      public void onProgressChanged(
                              SeekBar s,
                              int p,
                              boolean fromUser) {

                          speedMs = 50 + p;
                      }

                      public void onStartTrackingTouch(
                              SeekBar s) {}

                      public void onStopTrackingTouch(
                              SeekBar s) {}
                  });

                  SeekBar bright =
                          new SeekBar(this);

                  bright.setMax(100);
                  bright.setProgress(brightness);

                  add(heading("BRIGHTNESS"));
                  add(bright);

                  bright.setOnSeekBarChangeListener(
                          new SeekBar.OnSeekBarChangeListener() {

                      public void onProgressChanged(
                              SeekBar s,
                              int p,
                              boolean fromUser) {

                          brightness = p;
                      }

                      public void onStartTrackingTouch(
                              SeekBar s) {}

                      public void onStopTrackingTouch(
                              SeekBar s) {}
                  });

                  addSpace(12);

                  Button custom =
                          button("🎨 CUSTOM STUDIO");

                  custom.setOnClickListener(
                          v -> showCustom());

                  add(custom);

                  Button ai =
                          button("✨ AI ASSISTANT");

                  ai.setOnClickListener(
                          v -> showAI());

                  add(ai);

                  Button settings =
                          button("⚙ SETTINGS");

                  settings.setOnClickListener(
                          v -> showSettings());

                  add(settings);
              }

              private void showCustom() {

                  basePage("CUSTOM STUDIO");

                  add(text(
                          "CUSTOM SLOT 171 - 210\n" +
                          "Animation disimpan di HP.",
                          15));

                  LinearLayout slotRow =
                          horizontal();

                  EditText slot =
                          number(editSlot);

                  slotRow.addView(
                          slot,
                          new LinearLayout.LayoutParams(
                                  0, 60, 1));

                  Button load =
                          button("LOAD");

                  slotRow.addView(
                          load,
                          new LinearLayout.LayoutParams(
                                  0, 60, 1));

                  add(slotRow);

                  load.setOnClickListener(v -> {

                      int s = value(slot);

                      if (s < 171 || s > 210) {
                          toast("Slot harus 171 - 210.");
                          return;
                      }

                      editSlot = s;
                      loadSlot(s);
                      showEditor();
                  });

                  Button editor =
                          button("OPEN FULL EDITOR");

                  editor.setOnClickListener(
                          v -> showEditor());

                  add(editor);

                  Button preview =
                          button("▶ PREVIEW");

                  preview.setOnClickListener(
                          v -> showPreview());

                  add(preview);

                  Button ai =
                          button("✨ GENERATE WITH AI");

                  ai.setOnClickListener(
                          v -> showAI());

                  add(ai);

                  Button back =
                          button("← HOME");

                  back.setOnClickListener(
                          v -> showHome());

                  add(back);
              }

              private void showEditor() {

                  basePage(
                          "EDITOR SLOT " +
                          editSlot);

                  add(text(
                          "LEFT / RIGHT dibuat " +
                          "independen di editor.\n" +
                          "Hardware live memakai " +
                          "packet RGB yang terbukti.",
                          13));

                  LinearLayout framesBox =
                          vertical();

                  Runnable[] rebuild =
                          new Runnable[1];

                  rebuild[0] = () -> {

                      framesBox.removeAllViews();

                      for (int i = 0;
                           i < frames.size();
                           i++) {

                          final int index = i;

                          LinearLayout row =
                                  horizontal();

                          row.addView(
                                  text(
                                          "FRAME " +
                                          (index + 1) +
                                          "\n" +
                                          frames.get(i)
                                                  .duration +
                                          "ms",
                                          14),
                                  new LinearLayout.LayoutParams(
                                          0, 75, 1));

                          Button edit =
                                  button("EDIT");

                          row.addView(
                                  edit,
                                  new LinearLayout.LayoutParams(
                                          0, 65, 1));

                          Button dup =
                                  button("COPY");

                          row.addView(
                                  dup,
                                  new LinearLayout.LayoutParams(
                                          0, 65, 1));

                          Button del =
                                  button("DEL");

                          row.addView(
                                  del,
                                  new LinearLayout.LayoutParams(
                                          0, 65, 1));

                          edit.setOnClickListener(
                                  v -> editFrame(
                                          index,
                                          rebuild[0]));

                          dup.setOnClickListener(
                                  v -> {

                                      frames.add(
                                              index + 1,
                                              frames.get(index)
                                                      .copy());

                                      rebuild[0].run();
                                  });

                          del.setOnClickListener(
                                  v -> {

                                      if (frames.size() <= 1) {
                                          return;
                                      }

                                      frames.remove(index);
                                      rebuild[0].run();
                                  });

                          framesBox.addView(row);
                      }
                  };

                  add(framesBox);

                  rebuild[0].run();

                  Button addFrame =
                          button("+ ADD FRAME");

                  addFrame.setOnClickListener(v -> {

                      frames.add(
                              frames.get(
                                      frames.size() - 1)
                                      .copy());

                      rebuild[0].run();
                  });

                  add(addFrame);

                  add(heading("GENERATOR"));

                  LinearLayout gen1 =
                          horizontal();

                  Button stripe =
                          button("STRIPE");

                  Button chase =
                          button("CHASE");

                  Button rainbow =
                          button("RAINBOW");

                  gen1.addView(
                          stripe,
                          new LinearLayout.LayoutParams(
                                  0, 60, 1));

                  gen1.addView(
                          chase,
                          new LinearLayout.LayoutParams(
                                  0, 60, 1));

                  gen1.addView(
                          rainbow,
                          new LinearLayout.LayoutParams(
                                  0, 60, 1));

                  add(gen1);

                  stripe.setOnClickListener(v -> {
                      generateStripe();
                      rebuild[0].run();
                  });

                  chase.setOnClickListener(v -> {
                      generateChase();
                      rebuild[0].run();
                  });

                  rainbow.setOnClickListener(v -> {
                      generateRainbow();
                      rebuild[0].run();
                  });

                  LinearLayout gen2 =
                          horizontal();

                  Button blink =
                          button("BLINK");

                  Button fade =
                          button("FADE");

                  Button belang =
                          button("BELANG");

                  gen2.addView(
                          blink,
                          new LinearLayout.LayoutParams(
                                  0, 60, 1));

                  gen2.addView(
                          fade,
                          new LinearLayout.LayoutParams(
                                  0, 60, 1));

                  gen2.addView(
                          belang,
                          new LinearLayout.LayoutParams(
                                  0, 60, 1));

                  add(gen2);

                  blink.setOnClickListener(v -> {
                      generateBlink();
                      rebuild[0].run();
                  });

                  fade.setOnClickListener(v -> {
                      generateFade();
                      rebuild[0].run();
                  });

                  /*
                   * BELANG tetap sebagai generator
                   * visual/editor. Tidak mengarang
                   * packet hardware baru.
                   */
                  belang.setOnClickListener(v -> {
                      generateBelang();
                      rebuild[0].run();
                  });

                  Button preview =
                          button(
                                  "▶ PREVIEW BEFORE SEND");

                  preview.setOnClickListener(
                          v -> showPreview());

                  add(preview);

                  Button save =
                          button(
                                  "💾 SAVE SLOT " +
                                  editSlot);

                  save.setOnClickListener(v -> {

                      saveSlot(editSlot);

                      toast(
                              "Slot " +
                              editSlot +
                              " tersimpan di HP.");
                  });

                  add(save);

                  Button send =
                          button(
                                  "⚡ SEND / TEST LED");

                  send.setOnClickListener(
                          v -> playToLed());

                  add(send);

                  Button back =
                          button(
                                  "← BACK");

                  back.setOnClickListener(
                          v -> showCustom());

                  add(back);
              }

              private void editFrame(
                      int index,
                      Runnable rebuild) {

                  Frame f =
                          frames.get(index);

                  LinearLayout box =
                          vertical();

                  addColorEditor(
                          box,
                          "LEFT RGB",
                          f,
                          true);

                  addColorEditor(
                          box,
                          "RIGHT RGB",
                          f,
                          false);

                  TextView duration =
                          text(
                                  "Duration: " +
                                  f.duration +
                                  " ms",
                                  14);

                  box.addView(duration);

                  SeekBar bar =
                          new SeekBar(this);

                  bar.setMax(1950);

                  bar.setProgress(
                          Math.max(
                                  50,
                                  f.duration) - 50);

                  box.addView(bar);

                  bar.setOnSeekBarChangeListener(
                          new SeekBar.OnSeekBarChangeListener() {

                      public void onProgressChanged(
                              SeekBar s,
                              int p,
                              boolean user) {

                          f.duration =
                                  50 + p;

                          duration.setText(
                                  "Duration: " +
                                  f.duration +
                                  " ms");
                      }

                      public void onStartTrackingTouch(
                              SeekBar s) {}

                      public void onStopTrackingTouch(
                              SeekBar s) {}
                  });

                  AlertDialog dialog =
                          new AlertDialog.Builder(this)
                                  .setTitle(
                                          "FRAME " +
                                          (index + 1))
                                  .setView(box)
                                  .setPositiveButton(
                                          "APPLY",
                                          null)
                                  .setNegativeButton(
                                          "CANCEL",
                                          null)
                                  .create();

                  dialog.setOnShowListener(
