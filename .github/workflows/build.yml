name: LEDDMX-Pro-v39

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v4


      # ============================================================
      # JAVA 17
      # ============================================================
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # ============================================================
      # GRADLE 7.6.1
      # ============================================================
      - name: Install Gradle 7.6.1
        run: |
          wget -q https://services.gradle.org/distributions/gradle-7.6.1-bin.zip
          unzip -q gradle-7.6.1-bin.zip -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-7.6.1/bin" >> "$GITHUB_PATH"


      # ============================================================
      # CREATE PROJECT
      # ============================================================
      - name: Create Android project
        shell: bash
        run: |

          set -e

          mkdir -p app/src/main/java/com/leddmx/pro
          mkdir -p app/src/main/res/values


          # ========================================================
          # SETTINGS
          # ========================================================

          cat > settings.gradle <<'EOF'
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = "LEDDMX-Pro-v39"

include(":app")
EOF


          # ========================================================
          # ROOT BUILD
          # ========================================================

          cat > build.gradle <<'EOF'
plugins {
    id 'com.android.application' version '7.4.2' apply false
}
EOF


          # ========================================================
          # GRADLE PROPERTIES
          # ========================================================

          cat > gradle.properties <<'EOF'
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=false
EOF


          # ========================================================
          # APP BUILD
          # ========================================================

          cat > app/build.gradle <<'EOF'
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.leddmx.pro'

    compileSdk 33

    defaultConfig {
        applicationId 'com.leddmx.pro'

        minSdk 21
        targetSdk 33

        versionCode 39
        versionName '39.0'
    }
}
EOF


          # ========================================================
          # COLORS
          # ========================================================

          cat > app/src/main/res/values/colors.xml <<'EOF'
<resources>

    <color name="black">#000000</color>
    <color name="white">#FFFFFF</color>

</resources>
EOF


          # ========================================================
          # STYLE
          # ========================================================

          cat > app/src/main/res/values/styles.xml <<'EOF'
<resources>

    <style
        name="AppTheme"
        parent="android:style/Theme.Material.NoActionBar">

        <item name="android:fontFamily">sans</item>

        <item name="android:colorAccent">
            #00E5FF
        </item>

        <item name="android:navigationBarColor">
            #000000
        </item>

        <item name="android:statusBarColor">
            #000000
        </item>

        <item name="android:windowLightStatusBar">
            false
        </item>

    </style>

</resources>
EOF


          # ========================================================
          # MANIFEST
          # ========================================================

          cat > app/src/main/AndroidManifest.xml <<'EOF'
<manifest xmlns:android="http://schemas.android.com/apk/res/android">

    <!-- Android <= 30 -->
    <uses-permission
        android:name="android.permission.BLUETOOTH"
        android:maxSdkVersion="30" />

    <uses-permission
        android:name="android.permission.BLUETOOTH_ADMIN"
        android:maxSdkVersion="30" />

    <uses-permission
        android:name="android.permission.ACCESS_FINE_LOCATION"
        android:maxSdkVersion="30" />

    <!-- Android 12+ -->
    <uses-permission
        android:name="android.permission.BLUETOOTH_SCAN"
        android:usesPermissionFlags="neverForLocation" />

    <uses-permission
        android:name="android.permission.BLUETOOTH_CONNECT" />


    <application
        android:theme="@style/AppTheme"
        android:label="LEDDMX Pro"
        android:allowBackup="false"
        android:supportsRtl="true">

        <activity
            android:name=".MainActivity"
            android:screenOrientation="portrait"
            android:exported="true">

            <intent-filter>

                <action
                    android:name="android.intent.action.MAIN" />

                <category
                    android:name="android.intent.category.LAUNCHER" />

            </intent-filter>

        </activity>

    </application>

</manifest>
EOF


          # ========================================================
          # MAIN ACTIVITY
          # ========================================================

          cat > app/src/main/java/com/leddmx/pro/MainActivity.java <<'EOF'
