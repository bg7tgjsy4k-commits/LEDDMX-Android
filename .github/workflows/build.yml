              private void showRaw() {

                  basePage("RAW HEX");

                  EditText input =
                          new EditText(this);

                  input.setTextColor(
                          Color.WHITE);

                  input.setHintTextColor(
                          Color.GRAY);

                  input.setHint(
                          "7B FF 07 FF 00 00 BF");

                  input.setMinLines(3);

