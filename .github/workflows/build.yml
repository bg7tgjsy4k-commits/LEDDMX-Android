    private void applyTemplate(String name) {

        frames.clear();

        if (name.equals("RAINBOW")) {

            for (int i = 0; i < 24; i++) {

                int c =
                        Color.HSVToColor(
                                new float[]{
                                        i * 15f,
                                        1f,
                                        1f
                                }
                        );

                frames.add(
                        new Frame(
                                Color.red(c),
                                Color.green(c),
                                Color.blue(c),
                                120
                        )
                );
            }

        } else if (name.equals("CHASE")) {

            int[][] colors = {
                    {255, 0, 0},
                    {255, 120, 0},
                    {255, 255, 0},
                    {0, 255, 0},
                    {0, 255, 255},
                    {0, 0, 255},
                    {180, 0, 255}
            };

            for (int[] c : colors) {

                frames.add(
                        new Frame(
                                c[0],
                                c[1],
                                c[2],
                                140
                        )
                );
            }

        } else if (name.equals("BELANG / STRIPE")) {

            frames.add(
                    new Frame(255, 0, 0, 220)
            );

            frames.add(
                    new Frame(0, 0, 255, 220)
            );

            frames.add(
                    new Frame(255, 255, 255, 220)
            );

            frames.add(
                    new Frame(0, 0, 0, 220)
            );

        } else if (name.equals("POLICE")) {

            for (int i = 0; i < 4; i++) {

                frames.add(
                        new Frame(255, 0, 0, 120)
                );

                frames.add(
                        new Frame(0, 0, 255, 120)
                );
            }

        } else {

            frames.add(
                    new Frame(
                            selectedR,
                            selectedG,
                            selectedB,
                            250
                    )
            );

            frames.add(
                    new Frame(
                            0,
                            0,
                            0,
                            250
                    )
            );
        }

        if (previewView != null) {
            previewView.invalidate();
        }

        toast(
                name +
                        " generated • " +
                        frames.size() +
                        " frames"
        );
    }

