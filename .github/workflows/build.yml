name: Build LEDDMX APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create Android project
        run: |
          rm -rf project
          mkdir -p project/app/src/main/java/com/leddmx/finalapp
          mkdir -p project/app/src/main/res/values

          cat > project/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "LEDDMX"
          include(":app")
          EOF

          cat > project/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.2.0' apply false
          }
          EOF

          cat > project/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=false
          EOF

          cat > project/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.leddmx.finalapp'
              compileSdk 34

              defaultConfig {
                  applicationId 'com.leddmx.finalapp'
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName '4.0'
              }
          }
          EOF

          cat > project/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation" />
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-feature android:name="android.hardware.bluetooth_le" android:required="true" />

              <application
                  android:allowBackup="false"
                  android:label="LEDDMX AI Pro"
                  android:theme="@style/AppTheme">

                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > project/app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="@android:style/Theme.Material.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowBackground">#121212</item>
                  <item name="android:textColor">#FFFFFF</item>
              </style>
          </resources>
          EOF

          cat > project/app/src/main/java/com/leddmx/finalapp/MainActivity.java <<'EOF'
          package com.leddmx.finalapp;

          import android.Manifest;
          import android.app.Activity;
          import android.bluetooth.BluetoothAdapter;
          import android.bluetooth.BluetoothDevice;
          import android.bluetooth.BluetoothGatt;
          import android.bluetooth.BluetoothGattCallback;
          import android.bluetooth.BluetoothGattCharacteristic;
          import android.bluetooth.BluetoothGattService;
          import android.bluetooth.BluetoothManager;
          import android.bluetooth.le.BluetoothLeScanner;
          import android.bluetooth.le.ScanCallback;
          import android.bluetooth.le.ScanResult;
          import android.content.Context;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.SeekBar;
          import android.widget.TextView;
          import java.util.ArrayList;
          import java.util.UUID;

          public class MainActivity extends Activity {
              private BluetoothAdapter adapter;
              private BluetoothLeScanner scanner;
              private BluetoothGatt gatt;
              private BluetoothGattCharacteristic writeChar;
              private final ArrayList<BluetoothDevice> devices = new ArrayList<>();
              
              private LinearLayout deviceList;
              private LinearLayout connectionPanel;
              private TextView status;
              private TextView speedLabel;
              private TextView diyStatus;

              private boolean isConnected = false;
              private boolean powerState = true;
              private int lastUsedMode = 171;
              
              private final Handler handler = new Handler(Looper.getMainLooper());
              private final Handler animHandler = new Handler(Looper.getMainLooper());
              
              private boolean isDiyPlaying = false;
              private ArrayList<Integer> diyColors = new ArrayList<>();
              private int animIndex = 0;
              private int animSpeedMs = 300;

              private final Runnable animRunnable = new Runnable() {
                  @Override
                  public void run() {
                      if (isDiyPlaying && diyColors.size() > 0 && gatt != null && writeChar != null) {
                          int color = diyColors.get(animIndex);
                          byte r = (byte) Color.red(color);
                          byte g = (byte) Color.green(color);
                          byte b = (byte) Color.blue(color);
                          
                          sendPacket(new byte[]{0x7B, (byte)0xFF, 0x07, r, g, b, (byte)0xBF});
                          
                          animIndex = (animIndex + 1) % diyColors.size();
                          animHandler.postDelayed(this, animSpeedMs);
                      }
                  }
              };

              private final ScanCallback scanCallback = new ScanCallback() {
                  @Override
                  public void onScanResult(int callbackType, ScanResult result) {
                      BluetoothDevice device = result.getDevice();
                      if (device == null) return;
                      String name = device.getName();
                      if (name == null || name.isEmpty()) name = "Unknown Device";

                      boolean exists = false;
                      for (BluetoothDevice d : devices) {
                          if (d.getAddress().equals(device.getAddress())) { exists = true; break; }
                      }
                      if (!exists) {
                          devices.add(device);
                          addDeviceButton(device, name);
                      }
                  }
              };

              private final BluetoothGattCallback gattCallback = new BluetoothGattCallback() {
                  @Override
                  public void onConnectionStateChange(BluetoothGatt g, int statusCode, int newState) {
                      if (newState == BluetoothGatt.STATE_CONNECTED) {
                          gatt = g;
                          isConnected = true;
                          handler.post(() -> status.setText("Terhubung - Siap"));
                          g.discoverServices();
                      } else if (newState == BluetoothGatt.STATE_DISCONNECTED) {
                          gatt = null;
                          isConnected = false;
                          handler.post(() -> status.setText("Terputus"));
                          writeChar = null;
                      }
                  }

                  @Override
                  public void onServicesDiscovered(BluetoothGatt g, int statusCode) {
                      if (statusCode != BluetoothGatt.GATT_SUCCESS) return;
                      BluetoothGattService service = g.getService(UUID.fromString("0000FFE0-0000-1000-8000-00805F9B34FB"));
                      if (service != null) {
                          writeChar = service.getCharacteristic(UUID.fromString("0000FFE1-0000-1000-8000-00805F9B34FB"));
                      }
                  }
              };

              private void sendPacket(byte[] data) {
                  if (gatt == null || writeChar == null) return;
                  try {
                      writeChar.setValue(data);
                      gatt.writeCharacteristic(writeChar);
                  } catch (Exception ignored) {}
              }

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  BluetoothManager manager = (BluetoothManager) getSystemService(Context.BLUETOOTH_SERVICE);
                  adapter = manager.getAdapter();
                  buildUi();
                  requestPermissions(new String[]{Manifest.permission.BLUETOOTH_SCAN, Manifest.permission.BLUETOOTH_CONNECT, Manifest.permission.ACCESS_FINE_LOCATION}, 100);
              }

              private void buildUi() {
                  ScrollView scroll = new ScrollView(this);
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(20, 20, 20, 20);
                  root.setBackgroundColor(Color.parseColor("#121212"));

                  // TOP BAR
                  LinearLayout topBar = new LinearLayout(this);
                  topBar.setOrientation(LinearLayout.HORIZONTAL);
                  Button menuBtn = new Button(this);
                  menuBtn.setText("☰");
                  menuBtn.setTextColor(Color.WHITE);
                  menuBtn.setBackgroundColor(Color.parseColor("#333333"));
                  menuBtn.setOnClickListener(v -> connectionPanel.setVisibility(connectionPanel.getVisibility() == View.GONE ? View.VISIBLE : View.GONE));
                  topBar.addView(menuBtn, new LinearLayout.LayoutParams(120, LinearLayout.LayoutParams.WRAP_CONTENT));
                  
                  TextView title = new TextView(this);
                  title.setText("LEDDMX AI Pro");
                  title.setTextColor(Color.WHITE);
                  title.setTextSize(18);
                  title.setGravity(Gravity.CENTER);
                  topBar.addView(title, new LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1));
                  root.addView(topBar);

                  // CONNECTION PANEL
                  connectionPanel = new LinearLayout(this);
                  connectionPanel.setOrientation(LinearLayout.VERTICAL);
                  connectionPanel.setVisibility(View.GONE);
                  status = new TextView(this);
                  status.setText("Status: Belum Terhubung");
                  status.setTextColor(Color.parseColor("#03DAC5"));
                  connectionPanel.addView(status);
                  Button scan = new Button(this);
                  scan.setText("SCAN PERANGKAT");
                  scan.setOnClickListener(v -> startScan());
                  connectionPanel.addView(scan);
                  deviceList = new LinearLayout(this);
                  deviceList.setOrientation(LinearLayout.VERTICAL);
                  connectionPanel.addView(deviceList);
                  root.addView(connectionPanel);

                  // POWER BUTTON
                  Button btnPower = new Button(this);
                  btnPower.setText("POWER ON/OFF");
                  btnPower.setBackgroundColor(Color.parseColor("#CF6679"));
                  btnPower.setTextColor(Color.WHITE);
                  btnPower.setOnClickListener(v -> togglePower());
                  root.addView(btnPower);

                  // --- PANEL AI & DIY ANIMATOR STUDIO ---
                  TextView diyTitle = new TextView(this);
                  diyTitle.setText("\n🤖 AI & DIY ANIMATOR STUDIO");
                  diyTitle.setTextColor(Color.parseColor("#03DAC5"));
                  diyTitle.setTextSize(16);
                  root.addView(diyTitle);

                  LinearLayout aiRow = new LinearLayout(this);
                  aiRow.setOrientation(LinearLayout.HORIZONTAL);
                  Button btnAiStrobe = new Button(this);
                  btnAiStrobe.setText("AI Strobe");
                  btnAiStrobe.setBackgroundColor(Color.parseColor("#3700B3"));
                  btnAiStrobe.setTextColor(Color.WHITE);
                  btnAiStrobe.setOnClickListener(v -> {
                      diyColors.clear();
                      diyColors.add(Color.RED);
                      diyColors.add(Color.WHITE);
                      diyColors.add(Color.BLUE);
                      animSpeedMs = 150;
                      startDiyAnim();
                  });
                  aiRow.addView(btnAiStrobe, new LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1));

                  Button btnAiWave = new Button(this);
                  btnAiWave.setText("AI Flow");
                  btnAiWave.setBackgroundColor(Color.parseColor("#018786"));
                  btnAiWave.setTextColor(Color.WHITE);
                  btnAiWave.setOnClickListener(v -> {
                      diyColors.clear();
                      diyColors.add(Color.BLUE);
                      diyColors.add(Color.CYAN);
                      diyColors.add(Color.GREEN);
                      diyColors.add(Color.YELLOW);
                      animSpeedMs = 400;
                      startDiyAnim();
                  });
                  aiRow.addView(btnAiWave, new LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1));
                  root.addView(aiRow);

                  // MANUAL PALETTE
                  LinearLayout palette = new LinearLayout(this);
                  palette.setOrientation(LinearLayout.HORIZONTAL);
                  palette.setPadding(0, 10, 0, 10);
                  int[] paletteColors = {Color.RED, Color.GREEN, Color.BLUE, Color.YELLOW, Color.CYAN, Color.MAGENTA, Color.WHITE};
                  for (int c : paletteColors) {
                      Button btnC = new Button(this);
                      btnC.setBackgroundColor(c);
                      LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(0, 80, 1);
                      lp.setMargins(3, 3, 3, 3);
                      btnC.setLayoutParams(lp);
                      btnC.setOnClickListener(v -> {
                          diyColors.add(c);
                      });
                      palette.addView(btnC);
                  }
                  root.addView(palette);

                  diyStatus = new TextView(this);
                  diyStatus.setText("Status Custom: Berhenti");
                  diyStatus.setTextColor(Color.YELLOW);
                  root.addView(diyStatus);

                  LinearLayout diyControl = new LinearLayout(this);
                  diyControl.setOrientation(LinearLayout.HORIZONTAL);
                  Button btnPlay = new Button(this);
                  btnPlay.setText("▶ PUTAR CUSTOM");
                  btnPlay.setBackgroundColor(Color.parseColor("#00C853"));
                  btnPlay.setTextColor(Color.WHITE);
                  btnPlay.setOnClickListener(v -> startDiyAnim());
                  diyControl.addView(btnPlay, new LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1));

                  Button btnStop = new Button(this);
                  btnStop.setText("⏹ BERHENTI");
                  btnStop.setBackgroundColor(Color.parseColor("#D50000"));
                  btnStop.setTextColor(Color.WHITE);
                  btnStop.setOnClickListener(v -> stopDiyAnim());
                  diyControl.addView(btnStop, new LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1));
                  root.addView(diyControl);

                  // SPEED SLIDER
                  speedLabel = new TextView(this);
                  speedLabel.setText("\nKecepatan Animasi IC: 50%");
                  speedLabel.setTextColor(Color.WHITE);
                  root.addView(speedLabel);
                  SeekBar speedBar = new SeekBar(this);
                  speedBar.setMax(100);
                  speedBar.setProgress(50);
                  speedBar.setOnSeekBarChangeListener(new SeekBar.OnSeekBarChangeListener() {
                      @Override public void onProgressChanged(SeekBar seekBar, int p, boolean f) {
                          speedLabel.setText("Kecepatan Animasi IC: " + p + "%");
                          if (f) {
                              int val = (p * 255) / 100;
                              sendPacket(new byte[]{0x7B, (byte)0xFF, 0x02, (byte)val, (byte)0x03, (byte)lastUsedMode, (byte)0xFF, (byte)0xFF, (byte)0xBF});
                          }
                      }
                      @Override public void onStartTrackingTouch(SeekBar seekBar) {}
                      @Override public void onStopTrackingTouch(SeekBar seekBar) {}
                  });
                  root.addView(speedBar);

                  // MODE 1-210
                  TextView modeTitle = new TextView(this);
                  modeTitle.setText("\nPILIHAN MODE IC (1-210)");
                  modeTitle.setTextColor(Color.parseColor("#03DAC5"));
                  root.addView(modeTitle);

                  LinearLayout modes = new LinearLayout(this);
                  modes.setOrientation(LinearLayout.VERTICAL);
                  String[] btnColors = {"#B71C1C", "#4A148C", "#0D47A1", "#004D40", "#F57F17", "#3E2723"};

                  for (int start = 1; start <= 210; start += 5) {
                      LinearLayout row = new LinearLayout(this);
                      for (int mode = start; mode < start + 5 && mode <= 210; mode++) {
                          final int id = mode;
                          Button b = new Button(this);
                          b.setText(String.valueOf(id));
                          b.setTextColor(Color.WHITE);
                          b.setBackgroundColor(Color.parseColor(btnColors[id % btnColors.length]));
                          b.setOnClickListener(v -> {
                              stopDiyAnim(); // Matikan custom anim jika mode IC dipilih
                              sendMode(id);
                          });
                          row.addView(b, new LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1));
                      }
                      modes.addView(row);
                  }
                  root.addView(modes);

                  scroll.addView(root);
                  setContentView(scroll);
              }

              private void startDiyAnim() {
                  if (diyColors.isEmpty()) {
                      diyColors.add(Color.RED);
                      diyColors.add(Color.BLUE);
                  }
                  isDiyPlaying = true;
                  animIndex = 0;
                  diyStatus.setText("Status Custom: Sedang Berjalan...");
                  animHandler.removeCallbacks(animRunnable);
                  animHandler.post(animRunnable);
              }

              private void stopDiyAnim() {
                  isDiyPlaying = false;
                  diyStatus.setText("Status Custom: Berhenti");
                  animHandler.removeCallbacks(animRunnable);
              }

              private void sendMode(int mode) {
                  lastUsedMode = mode;
                  byte[] packet = new byte[]{
                          0x7B, (byte) 0xFF, 0x03, (byte) mode,
                          (byte) 0xFF, (byte) 0xFF, (byte) 0xFF, (byte) 0xFF, (byte) 0xBF
                  };
                  sendPacket(packet);
              }

              private void togglePower() {
                  powerState = !powerState;
                  if (powerState) {
                      sendMode(lastUsedMode);
                  } else {
                      stopDiyAnim();
                      sendPacket(new byte[]{0x7B, (byte)0xFF, 0x07, 0x00, 0x00, 0x00, (byte)0xBF});
                  }
              }

              private void startScan() {
                  if (adapter == null) return;
                  scanner = adapter.getBluetoothLeScanner();
                  if (scanner == null) return;
                  devices.clear();
                  deviceList.removeAllViews();
                  status.setText("Mencari...");
                  try {
                      scanner.startScan(scanCallback);
                      handler.postDelayed(() -> {
                          try {
                              if (scanner != null) scanner.stopScan(scanCallback);
                          } catch (Exception ignored) {}
                      }, 10000);
                  } catch (Exception ignored) {}
              }

              private void addDeviceButton(BluetoothDevice device, String name) {
                  Button b = new Button(this);
                  b.setText(name + "\n" + device.getAddress());
                  b.setBackgroundColor(Color.DKGRAY);
                  b.setTextColor(Color.WHITE);
                  b.setOnClickListener(v -> {
                      if (gatt != null) gatt.close();
                      try { device.connectGatt(MainActivity.this, false, gattCallback, BluetoothDevice.TRANSPORT_LE); } catch (Exception ignored) {}
                  });
                  deviceList.addView(b);
              }
          }
          EOF

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build APK
        working-directory: project
        run: gradle --no-daemon clean assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LEDDMX-Android-debug
          path: project/app/build/outputs/apk/debug/app-debug.apk
