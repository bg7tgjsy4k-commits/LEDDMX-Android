          import android.webkit.WebViewClient;

          import java.io.BufferedReader;
          import java.io.InputStream;
          import java.io.InputStreamReader;
          import java.util.ArrayList;
          import java.util.HashSet;
          import java.util.Locale;
          import java.util.UUID;

          public class MainActivity extends Activity {

              private static final UUID SERVICE =
                  UUID.fromString(
                      "0000FFE0-0000-1000-8000-00805F9B34FB"
                  );

              private static final UUID WRITE =
                  UUID.fromString(
                      "0000FFE1-0000-1000-8000-00805F9B34FB"
                  );

              private static final UUID OTA_SERVICE =
                  UUID.fromString(
                      "5833FF01-9B8B-5191-6142-22A4536EF123"
                  );

              private static final UUID OTA_WRITE =
                  UUID.fromString(
                      "5833FF02-9B8B-5191-6142-22A4536EF123"
                  );

              private static final UUID OTA_NOTIFY =
                  UUID.fromString(
                      "5833FF03-9B8B-5191-6142-22A4536EF123"
                  );

              private WebView web;

              private BluetoothAdapter adapter;
              private BluetoothLeScanner scanner;

              private BluetoothGatt gatt;

              private BluetoothGattCharacteristic tx;

              private boolean scanning=false;
              private boolean connected=false;

              private long lastScan=0;

              private final Handler handler =
                  new Handler(Looper.getMainLooper());

              private final HashSet<String> addresses =
                  new HashSet<>();

              private final ArrayList<String> rxHistory =
                  new ArrayList<>();

              private final ArrayList<String> txHistory =
                  new ArrayList<>();

              private final ScanCallback scanCallback =
                  new ScanCallback(){

                      @Override
                      public void onScanResult(
                          int callbackType,
                          ScanResult result){

                          BluetoothDevice device =
                              result.getDevice();

                          String name=null;

                          try{

                              if(
                                  result.getScanRecord()!=null
                              ){

                                  name=
                                      result
                                      .getScanRecord()
                                      .getDeviceName();
                              }

                          }catch(Exception ignored){}

                          if(
                              name==null ||
                              name.trim().isEmpty()
                          ){

                              try{
                                  name=device.getName();
                              }catch(Exception ignored){}
                          }

                          if(name==null){
                              name="";
                          }

                          String upper=
                              name.toUpperCase(
                                  Locale.US
                              );

                          /*
                           * LEDDMX device name is the
                           * primary target.
                           */

                          if(
                              !upper.contains("LEDDMX")
                          ){
                              return;
                          }

                          String address;

                          try{
                              address=
                                  device.getAddress();
                          }catch(Exception e){
                              return;
                          }

                          if(
                              address==null ||
                              addresses.contains(address)
                          ){
                              return;
                          }

                          addresses.add(address);

                          final String n=name;
                          final String a=address;

                          runJs(
                              "deviceFound("+
                              js(n)+","+
                              js(a)+");"
                          );
                      }

                      @Override
                      public void onScanFailed(
                          int errorCode){

                          scanning=false;

                          runJs(
                              "scanError("+
                              errorCode+
                              ");"
                          );
                      }
                  };

              @Override
              protected void onCreate(
                  Bundle savedInstanceState){

                  super.onCreate(
                      savedInstanceState
                  );

                  BluetoothManager manager=
                      (BluetoothManager)
                      getSystemService(
                          Context.BLUETOOTH_SERVICE
                      );

                  if(manager!=null){
                      adapter=manager.getAdapter();
                  }

                  web=new WebView(this);

                  WebSettings settings=
                      web.getSettings();

                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);

                  web.setWebViewClient(
                      new WebViewClient()
                  );

                  web.addJavascriptInterface(
                      new Bridge(),
                      "LED"
                  );

                  setContentView(web);

                  web.loadUrl(
                      "file:///android_asset/index.html"
                  );
              }

              private boolean permissionsGranted(){

                  if(Build.VERSION.SDK_INT>=31){

                      return
                          checkSelfPermission(
                              Manifest.permission.BLUETOOTH_SCAN
                          )==
                          PackageManager.PERMISSION_GRANTED
                          &&
                          checkSelfPermission(
                              Manifest.permission.BLUETOOTH_CONNECT
                          )==
                          PackageManager.PERMISSION_GRANTED;

                  }

                  if(Build.VERSION.SDK_INT>=23){

                      return
                          checkSelfPermission(
                              Manifest.permission.ACCESS_FINE_LOCATION
                          )==
                          PackageManager.PERMISSION_GRANTED;
                  }

                  return true;
              }

              private void requestPermissionsIfNeeded(){

                  if(
                      permissionsGranted()
                  ){
                      startScan();
                      return;
                  }

                  if(Build.VERSION.SDK_INT>=31){

                      requestPermissions(
                          new String[]{
                              Manifest.permission.BLUETOOTH_SCAN,
                              Manifest.permission.BLUETOOTH_CONNECT
                          },
                          200
                      );

                  }else if(Build.VERSION.SDK_INT>=23){

                      requestPermissions(
                          new String[]{
                              Manifest.permission.ACCESS_FINE_LOCATION
                          },
                          201
                      );
                  }
              }

              @Override
              public void onRequestPermissionsResult(
                  int requestCode,
                  String[] permissions,
                  int[] grantResults){

                  super.onRequestPermissionsResult(
                      requestCode,
                      permissions,
                      grantResults
                  );

                  if(
                      requestCode==200 ||
                      requestCode==201
                  ){

                      boolean ok=true;

                      for(
                          int x:grantResults
                      ){

                          if(
                              x!=PackageManager.PERMISSION_GRANTED
                          ){
                              ok=false;
                          }
                      }

                      if(ok){
                          startScan();
                      }else{
                          runJs(
                              "logDevice("+
                              js(
                                  "BLUETOOTH PERMISSION DENIED"
                              )+
                              ");"
                          );
                      }
                  }
              }

              private void startScan(){

                  if(adapter==null){

                      runJs(
                          "logDevice("+
                          js(
                              "BLUETOOTH ADAPTER NOT AVAILABLE"
                          )+
                          ");"
                      );

                      return;
                  }

                  try{

                      if(
                          !adapter.isEnabled()
                      ){

                          runJs(
                              "bluetoothOff();"
                          );

                          return;
                      }

                  }catch(Exception e){

                      runJs(
                          "logDevice("+
                          js(
                              "BLUETOOTH STATUS ERROR"
                          )+
                          ");"
                      );

                      return;
                  }

                  long now=
                      System.currentTimeMillis();

                  if(
                      now-lastScan<2500
                  ){

                      runJs(
                          "scanBusy();"
                      );

                      return;
                  }

                  lastScan=now;

                  scanner=
                      adapter
                      .getBluetoothLeScanner();

                  if(scanner==null){

                      runJs(
                          "scanError(4);"
                      );

                      return;
                  }

                  try{
                      scanner.stopScan(
                          scanCallback
                      );
                  }catch(Exception ignored){}

                  addresses.clear();

                  scanning=true;

                  runJs(
                      "scanStarted();"
                  );

                  ScanSettings settings=
                      new ScanSettings.Builder()
                      .setScanMode(
                          ScanSettings.SCAN_MODE_LOW_LATENCY
                      )
                      .build();

                  try{

                      scanner.startScan(
                          null,
                          settings,
                          scanCallback
                      );

                  }catch(Exception e){

                      scanning=false;

                      runJs(
                          "logDevice("+
                          js(
                              "SCAN START ERROR: "+
                              e.toString()
                          )+
                          ");"
                      );

                      return;
                  }

                  handler.postDelayed(
                      new Runnable(){
                          @Override
                          public void run(){
                              stopScan();
                          }
                      },
                      8000
                  );
              }

              private void stopScan(){

                  if(!scanning){
                      return;
                  }

                  scanning=false;

                  try{

                      if(scanner!=null){
                          scanner.stopScan(
                              scanCallback
                          );
                      }

                  }catch(Exception ignored){}

                  runJs(
                      "scanStopped();"
                  );
              }

              private void connect(
                  String address){

                  if(!permissionsGranted()){

                      requestPermissionsIfNeeded();

                      return;
                  }

                  try{

                      BluetoothDevice device=
                          adapter.getRemoteDevice(
                              address
                          );

                      if(gatt!=null){

                          try{
                              gatt.disconnect();
                          }catch(Exception ignored){}

                          try{
                              gatt.close();
                          }catch(Exception ignored){}

                          gatt=null;
                      }

                      tx=null;
                      connected=false;

                      runJs(
                          "logDevice("+
                          js(
                              "CONNECTING TO "+
                              address
                          )+
                          ");"
                      );

                      gatt=
                          device.connectGatt(
                              this,
                              false,
                              gattCallback,
                              BluetoothDevice.TRANSPORT_LE
                          );

                  }catch(Exception e){

                      runJs(
                          "logDevice("+
                          js(
                              "CONNECT ERROR: "+
                              e.toString()
                          )+
                          ");"
                      );
                  }
              }

              private void disconnect(){

                  try{

                      if(gatt!=null){
                          gatt.disconnect();
                          gatt.close();
                      }

                  }catch(Exception ignored){}

                  gatt=null;
                  tx=null;
                  connected=false;

                  runJs(
                      "connectionState(false);"
                  );
              }

              private final BluetoothGattCallback
                  gattCallback=
                  new BluetoothGattCallback(){

                      @Override
                      public void onConnectionStateChange(
                          BluetoothGatt g,
                          int status,
                          int newState){

                          if(
                              newState==
                              android.bluetooth.BluetoothProfile
                              .STATE_CONNECTED
                          ){

                              connected=true;

                              runJs(
                                  "connectionState(true);"
                              );

                              try{
                                  g.discoverServices();
                              }catch(Exception e){
                                  runJs(
                                      "logDevice("+
                                      js(
                                          "DISCOVER SERVICES ERROR: "+
                                          e.toString()
                                      )+
                                      ");"
                                  );
                              }

                          }else{

                              connected=false;
                              tx=null;

                              runJs(
                                  "connectionState(false);"
                              );
                          }
                      }

                      @Override
                      public void onServicesDiscovered(
                          BluetoothGatt g,
                          int status){

                          BluetoothGattService service=
                              g.getService(
                                  SERVICE
                              );

                          if(service!=null){

                              tx=
                                  service
                                  .getCharacteristic(
                                      WRITE
                                  );
                          }

                          boolean ota=false;

                          BluetoothGattService
                              otaService=
                              g.getService(
                                  OTA_SERVICE
                              );

                          if(otaService!=null){

                              ota=true;
                          }

                          StringBuilder info=
                              new StringBuilder();

                          for(
                              BluetoothGattService s:
                              g.getServices()
                          ){

                              info.append(
                                  "SERVICE  "
                              );

                              info.append(
                                  s.getUuid()
                                      .toString()
                                      .toUpperCase(
                                          Locale.US
                                      )
                              );

                              info.append("\n");

                              for(
                                  BluetoothGattCharacteristic c:
                                  s.getCharacteristics()
                              ){

                                  info.append(
                                      "  CHAR   "
                                  );

                                  info.append(
                                      c.getUuid()
                                          .toString()
                                          .toUpperCase(
                                              Locale.US
                                          )
                                  );

                                  info.append(
                                      "  PROPERTIES="
                                  );

                                  info.append(
                                      c.getProperties()
                                  );

                                  info.append("\n");
                              }
                          }

                          runJs(
                              "showGatt("+
                              js(info.toString())+
                              ");"
                          );

                          runJs(
                              "moduleReady("+
                              (tx!=null)+
                              ","+
                              ota+
                              ");"
                          );
                      }

                      @Override
                      public void onCharacteristicChanged(
                          BluetoothGatt g,
                          BluetoothGattCharacteristic c){

                          byte[] value=
                              c.getValue();

                          String hex=
                              bytesToHex(value);

                          rxHistory.add(hex);

                          runJs(
                              "rx("+
                              js(hex)+
                              ");"
                          );
                      }

                      @Override
                      public void onCharacteristicRead(
                          BluetoothGatt g,
                          BluetoothGattCharacteristic c,
                          int status){

                          byte[] value=
                              c.getValue();

                          String hex=
                              bytesToHex(value);

                          rxHistory.add(hex);

                          runJs(
                              "rx("+
                              js(hex)+
                              ");"
                          );
                      }
                  };

              private void send(
                  byte[] data){

                  if(
                      !connected ||
                      gatt==null ||
                      tx==null
                  ){

                      runJs(
                          "logDevice("+
                          js(
                              "NOT READY: CONNECT LEDDMX FIRST"
                          )+
                          ");"
                      );

                      return;
                  }

                  String hex=
                      bytesToHex(data);

                  txHistory.add(hex);

                  runJs(
                      "tx("+
                      js(hex)+
                      ");"
                  );

                  try{

                      tx.setValue(data);

                      if(Build.VERSION.SDK_INT>=33){

                          gatt.writeCharacteristic(
                              tx,
                              data,
                              BluetoothGattCharacteristic
                                  .WRITE_TYPE_NO_RESPONSE
                          );

                      }else{

                          tx.setWriteType(
                              BluetoothGattCharacteristic
                                  .WRITE_TYPE_NO_RESPONSE
                          );

                          gatt.writeCharacteristic(
                              tx
                          );
                      }

                  }catch(Exception e){

                      runJs(
                          "logDevice("+
                          js(
                              "TX ERROR: "+
                              e.toString()
                          )+
                          ");"
                      );
                  }
              }

              private byte[] parseHex(
                  String value){

                  String[] p=
                      value.trim()
                          .split("\\s+");

                  byte[] out=
                      new byte[p.length];

                  for(
                      int i=0;
                      i<p.length;
                      i++
                  ){

                      out[i]=
                          (byte)
                          Integer.parseInt(
                              p[i],
                              16
                          );
                  }

                  return out;
              }

              private String bytesToHex(
                  byte[] data){

                  StringBuilder s=
                      new StringBuilder();

                  for(
                      byte b:data
                  ){

                      s.append(
                          String.format(
                              Locale.US,
                              "%02X ",
                              b&255
                          )
                      );
                  }

                  return s.toString().trim();
              }

              private String js(
                  String value){

                  if(value==null){
                      return "''";
                  }

                  return "'"+
                      value
                      .replace(
                          "\\",
                          "\\\\"
                      )
                      .replace(
                          "'",
                          "\\'"
                      )
                      .replace(
                          "\r",
                          ""
                      )
                      .replace(
                          "\n",
                          "\\n"
                      )+
                      "'";
              }

              private void runJs(
                  String script){

                  runOnUiThread(
                      new Runnable(){

                          @Override
                          public void run(){

                              if(web==null){
                                  return;
                              }

                              web.evaluateJavascript(
                                  "javascript:"+
                                  script,
                                  null
                              );
                          }
                      }
                  );
              }

              public class Bridge {

                  @JavascriptInterface
                  public void scan(){
                      requestPermissionsIfNeeded();
                  }

                  @JavascriptInterface
                  public void stopScan(){
                      MainActivity.this.stopScan();
                  }

                  @JavascriptInterface
                  public void connect(
                      String address){

                      MainActivity.this.connect(
                          address
                      );
                  }

                  @JavascriptInterface
                  public void disconnect(){
                      MainActivity.this.disconnect();
                  }

                  @JavascriptInterface
                  public void power(
                      boolean on){

                      send(
                          parseHex(
                              on
                              ?
                              "7B FF 04 01 FF FF FF FF BF"
                              :
                              "7B FF 04 00 FF FF FF FF BF"
                          )
                      );
                  }

                  @JavascriptInterface
                  public void mode(
                      int mode){

                      mode=
                          Math.max(
                              1,
                              Math.min(
                                  210,
                                  mode
                              )
                          );

                      send(
                          parseHex(
                              String.format(
                                  Locale.US,
                                  "7B FF 03 %02X FF FF FF FF BF",
                                  mode
                              )
                          )
                      );
                  }

                  @JavascriptInterface
                  public void color(
                      int r,
                      int g,
                      int b){

                      r=
                          Math.max(
                              0,
                              Math.min(
                                  255,
                                  r
                              )
                          );

                      g=
                          Math.max(
                              0,
                              Math.min(
                                  255,
                                  g
                              )
                          );

                      b=
                          Math.max(
                              0,
                              Math.min(
                                  255,
                                  b
                              )
                          );

                      send(
                          parseHex(
                              String.format(
                                  Locale.US,
                                  "7B FF 07 %02X %02X %02X 00 FF BF",
                                  r,
                                  g,
                                  b
                              )
                          )
                      );
                  }

                  @JavascriptInterface
                  public void brightness(
                      int pct){

                      pct=
                          Math.max(
                              0,
                              Math.min(
                                  100,
                                  pct
                              )
                          );

                      int scaled=
                          pct*32/100;

                      send(
                          parseHex(
                              String.format(
                                  Locale.US,
                                  "7B FF 01 %02X %02X 00 FF FF BF",
                                  scaled,
                                  pct
                              )
                          )
                      );
                  }

                  @JavascriptInterface
                  public void speed(
                      int value){

                      value=
                          Math.max(
                              0,
                              Math.min(
                                  255,
                                  value
                              )
                          );

                      send(
                          parseHex(
                              String.format(
                                  Locale.US,
                                  "7B FF 02 %02X 00 FF FF FF BF",
                                  value
                              )
                          )
                      );
                  }

                  @JavascriptInterface
                  public void direction(
                      int dir){

                      dir=
                          dir==0?0:1;

                      send(
                          parseHex(
                              String.format(
                                  Locale.US,
                                  "7B FF 0D %02X FF FF FF FF BF",
                                  dir
                              )
                          )
                      );
                  }

                  @JavascriptInterface
                  public void customColor(
                      int position,
                      int r,
                      int g,
                      int b,
                      int total){

                      position=
                          Math.max(
                              1,
                              Math.min(
                                  255,
                                  position
                              )
                          );

                      total=
                          Math.max(
                              1,
                              Math.min(
                                  255,
                                  total
                              )
                          );

                      send(
                          parseHex(
                              String.format(
                                  Locale.US,
                                  "7B %02X 0E FD %02X %02X %02X %02X BF",
                                  position,
                                  r&255,
                                  g&255,
                                  b&255,
                                  total
                              )
                          )
                      );
                  }

                  @JavascriptInterface
                  public void customMode(
                      int ordinal){

                      ordinal=
                          Math.max(
                              0,
                              Math.min(
                                  7,
                                  ordinal
                              )
                          );

                      send(
                          parseHex(
                              String.format(
                                  Locale.US,
                                  "7B FF 13 %02X FF FF FF FF BF",
                                  ordinal
                              )
                          )
                      );
                  }

                  @JavascriptInterface
                  public void hex(
                      String value){

                      try{

                          send(
                              parseHex(value)
                          );

                      }catch(Exception e){

                          runJs(
                              "logDevice("+
                              js(
                                  "INVALID HEX"
                              )+
                              ");"
                          );
                      }
                  }

                  @JavascriptInterface
                  public String modes(){

                      StringBuilder out=
                          new StringBuilder();

                      try{

                          InputStream input=
                              getAssets()
                              .open(
                                  "modes.txt"
                              );

                          BufferedReader reader=
                              new BufferedReader(
                                  new InputStreamReader(
                                      input,
                                      "UTF-8"
                                  )
                              );

                          String line;

                          while(
                              (line=
                                  reader.readLine())
                                  !=null
                          ){

                              out.append(
                                  line
                              );

                              out.append(
                                  "\n"
                              );
                          }

                          reader.close();

                      }catch(Exception ignored){}

                      return out.toString();
                  }
              }
          }
          EOF

      - name: Download exact LEDDMX mode names
        shell: bash
        run: |
          curl -L -s \
            https://raw.githubusercontent.com/user154lt/LEDDMX-00/main/PatternList.kt \
            -o /tmp/PatternList.kt || true

          python3 - <<'PY'
          import re
          from pathlib import Path

          out = Path("app/src/main/assets/modes.txt")

          src = ""

          p = Path("/tmp/PatternList.kt")

          if p.exists():
              src = p.read_text(
                  encoding="utf-8",
                  errors="ignore"
              )

          vals = re.findall(
              r'"((?:[^"\\]|\\.)*)"',
              src
          )

          vals = vals[:211]

          lines=[]

          for i in range(1,211):

              idx=i-1

              if idx < len(vals):
                  name=vals[idx]
              else:
                  name=f"MODE {i}"

              name=name.replace(
                  '\\"',
                  '"'
              )

              name=name.replace(
                  '\\n',
                  ' '
              )

              lines.append(
                  f"{i}|{name}"
              )

          out.write_text(
              "\n".join(lines)+"\n",
              encoding="utf-8"
          )
          PY

