                                  Color.CYAN
                          )
                  );

                  body.addView(
                          text(
                                  "Kirim frame mentah ke FFE1. Gunakan dengan hati-hati.",
                                  12,
                                  Color.LTGRAY
                          )
                  );

                  EditText hex =
                          input(
                                  "7B FF 07 FF 00 00 00 FF BF"
                          );

                  body.addView(hex);

                  Button sendHex =
                          btn(
                                  "KIRIM HEX",
                                  Color.rgb(
                                          0,
                                          130,
                                          145
                                  )
                          );

                  sendHex.setOnClickListener(
                          v -> {

                              try {

                                  String raw =
                                          hex.getText()
                                                  .toString()
                                                  .trim();

                                  String[] p =
                                          raw.split(
                                                  "\\s+"
                                          );

                                  byte[] data =
                                          new byte[p.length];

                                  for (
                                          int i = 0;
                                          i < p.length;
                                          i++
                                  ) {

                                      data[i] =
                                              (byte)
                                                      Integer.parseInt(
                                                              p[i],
                                                              16
                                                      );
                                  }

                                  send(data);

                              } catch (Exception e) {

                                  toast(
                                          "HEX salah."
                                  );
                              }
                          }
                  );

                  body.addView(sendHex);
              }

