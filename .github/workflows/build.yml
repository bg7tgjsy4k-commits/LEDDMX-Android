              private int nextColor(int color) {

                  if (color == Color.RED) {
                      return Color.GREEN;
                  }

                  if (color == Color.GREEN) {
                      return Color.BLUE;
                  }

                  if (color == Color.BLUE) {
                      return Color.YELLOW;
                  }

                  if (color == Color.YELLOW) {
                      return Color.MAGENTA;
                  }

                  if (color == Color.MAGENTA) {
                      return Color.CYAN;
                  }

                  return Color.RED;
              }

