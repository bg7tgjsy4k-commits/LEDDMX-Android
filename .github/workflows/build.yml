              private void showProtocol() {

                  showAnalyzer();

                  heading("PROTOCOL LAB");

                  body.addView(
                          text(
                                  "Known packet shapes can be inspected and sent manually.",
                                  12));
              }

              private void showSettings() {

                  clearBody();

                  heading("SETTINGS");

                  body.addView(
                          text(
                                  "Language: Indonesian / English",
                                  14));

                  body.addView(
                          text(
                                  "SERVICE FFE0",
                                  13));

                  body.addView(
                          text(
                                  "WRITE FFE1",
                                  13));

                  body.addView(
                          text(
                                  "Power baseline: 7B FF 04 01/00 FF FF FF FF BF",
                                  13));

                  body.addView(
                          text(
                                  "OTA: DETECTION ONLY",
                                  13));

                  body.addView(
                          text(
                                  "Password: NOT VERIFIED",
                                  13));

                  body.addView(
                          text(
                                  "LEFT/RIGHT HARDWARE ROUTING: NOT PROVEN",
                                  13));
              }

              private void showMenu() {

                  PopupWindow popup =
                          new PopupWindow(this);

                  LinearLayout menu =
                          vertical();

                  menu.setBackgroundColor(
                          Color.rgb(20,24,30));

                  String[] items = {
                          "HOME",
                          "210 EFFECTS",
                          "CUSTOM STUDIO",
                          "MODULE / MCU ANALYZER",
                          "PROTOCOL LAB",
                          "SETTINGS"
                  };

                  for (String item : items) {

                      Button q =
                              button(item);

                      q.setOnClickListener(
                              v -> {

                                  popup.dismiss();

                                  if(item.equals(
                                          "HOME"))
                                      showHome();

                                  else if(item.equals(
                                          "210 EFFECTS"))
                                      showEffects();

                                  else if(item.equals(
                                          "CUSTOM STUDIO"))
                                      showCustom();

                                  else if(item.equals(
                                          "MODULE / MCU ANALYZER"))
                                      showAnalyzer();

                                  else if(item.equals(
                                          "PROTOCOL LAB"))
                                      showProtocol();

                                  else
                                      showSettings();
                              });

                      menu.addView(
                              q,
                              new LinearLayout.LayoutParams(
                                      dp(310),
                                      dp(58)));
                  }

                  popup.setContentView(menu);

                  popup.setWidth(dp(315));
                  popup.setHeight(-1);

                  popup.setBackgroundDrawable(
                          new android.graphics.drawable
                                  .ColorDrawable(
                                  Color.rgb(20,24,30)));

                  popup.setFocusable(true);
                  popup.setOutsideTouchable(true);

                  popup.showAtLocation(
                          root,
                          Gravity.LEFT | Gravity.TOP,
                          0,
                          0);
              }

              private void requestBlePermissions() {

                  if(Build.VERSION.SDK_INT >= 31) {

                      requestPermissions(
                              new String[]{
                                      Manifest.permission.BLUETOOTH_SCAN,
                                      Manifest.permission.BLUETOOTH_CONNECT
                              },
                              100);

                  } else if(Build.VERSION.SDK_INT >= 23) {

                      requestPermissions(
                              new String[]{
                                      Manifest.permission.ACCESS_FINE_LOCATION
                              },
                              101);
                  }
              }

              private void scan() {

                  if(adapter == null) {

                      toast(
                              "BLUETOOTH UNAVAILABLE");

                      return;
                  }

                  if(!adapter.isEnabled()) {

                      toast(
                              "TURN BLUETOOTH ON");

                      return;
                  }

                  if(scanning) {

                      stopScan();

                      return;
                  }

                  if(Build.VERSION.SDK_INT >= 31 &&
                          checkSelfPermission(
                                  Manifest.permission.BLUETOOTH_SCAN)
                                  != PackageManager.PERMISSION_GRANTED) {

                      requestBlePermissions();

                      return;
                  }

                  scanner =
                          adapter.getBluetoothLeScanner();

                  if(scanner == null) {

                      toast(
                              "BLE SCANNER UNAVAILABLE");

                      return;
                  }

                  devices.clear();

                  scanCallback =
                          new ScanCallback() {

                              @Override
                              public void onScanResult(
                                      int callbackType,
                                      ScanResult result) {

                                  BluetoothDevice device =
                                          result.getDevice();

                                  String name =
                                          safeName(device);

                                  if(name.toUpperCase(
                                          Locale.US)
                                          .contains("LEDDMX")) {

                                      if(!devices.contains(device))
                                          devices.add(device);

                                      runOnUiThread(
                                              MainActivity.this
                                                      ::showScanResults);
                                  }
                              }

                              @Override
                              public void onScanFailed(
                                      int errorCode) {

                                  runOnUiThread(
                                          () -> toast(
                                                  "SCAN ERROR "
                                                          + errorCode));
                              }
                          };

                  try {

                      scanner.startScan(
                              scanCallback);

                      scanning = true;

                      status.setText(
                              "● SCANNING");

                      showScanResults();

                      handler.postDelayed(
                              this::stopScan,
                              9000);

                  } catch(Exception e) {

                      toast(
                              "SCAN FAILED");
                  }
              }

              private void showScanResults() {

                  clearBody();

                  heading(
                          "BLE DEVICES");

                  if(devices.isEmpty()) {

                      body.addView(
                              text(
                                      "Searching LEDDMX...",
                                      13));

                      return;
                  }

                  for(BluetoothDevice device :
                          devices) {

                      Button q =
                              button(
                                      safeName(device)
                                              + "\n"
                                              + safeAddress(device));

                      q.setOnClickListener(
                              v -> connect(device));

                      body.addView(q);
                  }
              }

              private void stopScan() {

                  if(!scanning)
                      return;

                  try {

                      if(scanner != null &&
                              scanCallback != null) {

                          scanner.stopScan(
                                  scanCallback);
                      }

                  } catch(Exception ignored) {
                  }

                  scanning = false;

                  if(status != null)
                      status.setText(
                              "● SCAN COMPLETE");
              }

              private void connect(
                      BluetoothDevice device) {

                  stopScan();

                  status.setText(
                          "● CONNECTING");

                  try {

                      gatt =
                              device.connectGatt(
                                      this,
                                      false,
                                      gattCallback);

                  } catch(Exception e) {

                      status.setText(
                              "● CONNECTION ERROR");
                  }
              }

              private final BluetoothGattCallback
                      gattCallback =
                      new BluetoothGattCallback() {

                  @Override
                  public void onConnectionStateChange(
                          BluetoothGatt g,
                          int statusCode,
                          int newState) {

                      runOnUiThread(
                              () -> {

                                  if(newState ==
                                          BluetoothProfile
                                                  .STATE_CONNECTED) {

                                      status.setText(
                                              "● CONNECTED");

                                      try {
                                          g.discoverServices();
                                      } catch(Exception ignored) {
                                      }

                                  } else {

                                      tx = null;

                                      status.setText(
                                              "● DISCONNECTED");
                                  }
                              });
                  }

                  @Override
                  public void onServicesDiscovered(
                          BluetoothGatt g,
                          int statusCode) {

                      tx = null;

                      for(BluetoothGattService service :
                              g.getServices()) {

                          log(
                                  "DEVICE SERVICE: "
                                          + service.getUuid());

                          if(OTA.equals(
                                  service.getUuid())) {

                              log(
                                      "DEVICE OTA SERVICE DETECTED");
                          }

                          for(BluetoothGattCharacteristic c :
                                  service.getCharacteristics()) {

                              log(
                                      "DEVICE CHARACTERISTIC: "
                                              + c.getUuid()
                                              + " PROP="
                                              + c.getProperties());

                              if(FFE1.equals(
                                      c.getUuid())) {

                                  tx = c;
                              }
                          }
                      }

                      runOnUiThread(
                              () -> status.setText(
                                      tx != null
                                              ? "● READY • FFE1"
                                              : "● FFE1 NOT FOUND"));
                  }

                  @Override
                  public void onCharacteristicWrite(
                          BluetoothGatt g,
                          BluetoothGattCharacteristic c,
                          int statusCode) {

                      writing = false;

                      handler.postDelayed(
                              MainActivity.this::nextWrite,
                              70);
                  }

                  @Override
                  public void onCharacteristicChanged(
                          BluetoothGatt g,
                          BluetoothGattCharacteristic c) {

                      log(
                              "RX/NOTIFY DEVICE: "
                                      + hex(
                                      c.getValue()));
                  }

                  @Override
                  public void onCharacteristicRead(
                          BluetoothGatt g,
                          BluetoothGattCharacteristic c,
                          int statusCode) {

                      log(
                              "RX/READ DEVICE: "
                                      + hex(
                                      c.getValue()));
                  }
              };

              private void readGatt() {

                  if(gatt == null) {

                      toast(
                              "CONNECT MODULE FIRST");

                      return;
                  }

                  for(BluetoothGattService service :
                          gatt.getServices()) {

                      log(
                              "DEVICE SERVICE: "
                                      + service.getUuid());

                      for(BluetoothGattCharacteristic c :
                              service.getCharacteristics()) {

                          log(
                                  "DEVICE CHARACTERISTIC: "
                                          + c.getUuid()
                                          + " PROP="
                                          + c.getProperties());
                      }
                  }

                  toast(
                          "GATT DATA READ");
              }

              private void enqueue(byte[] data) {

                  if(tx == null) {

                      toast(
                              "MODULE NOT READY");

                      return;
                  }

                  writeQueue.add(data);
                  nextWrite();
              }

              private void nextWrite() {

                  if(writing ||
                          writeQueue.isEmpty() ||
                          tx == null ||
                          gatt == null)
                      return;

                  writing = true;

                  byte[] data =
                          writeQueue.poll();

                  log(
                          "TX DEVICE COMMAND: "
                                  + hex(data));

                  try {

                      tx.setWriteType(
                              BluetoothGattCharacteristic
                                      .WRITE_TYPE_DEFAULT);

                      tx.setValue(data);

                      boolean result =
                              gatt.writeCharacteristic(tx);

                      if(!result) {

                          writing = false;

                          handler.postDelayed(
                                  this::nextWrite,
                                  100);
                      }

                  } catch(Exception e) {

                      writing = false;

                      handler.postDelayed(
                              this::nextWrite,
                              100);
                  }
              }

              private byte[] makePacket(
                      int a,
                      int b,
                      int c,
                      int d,
                      int e,
                      int f,
                      int h,
                      int i,
                      int j) {

                  return new byte[]{
                          (byte)a,
                          (byte)b,
                          (byte)c,
                          (byte)d,
                          (byte)e,
                          (byte)f,
                          (byte)h,
                          (byte)i,
                          (byte)j
                  };
              }

              private byte[] powerPacket(
                      boolean on) {

                  return makePacket(
                          0x7B,
                          0xFF,
                          0x04,
                          on ? 0x01 : 0x00,
                          0xFF,
                          0xFF,
                          0xFF,
                          0xFF,
                          0xBF);
              }

              private byte[] modePacket(
                      int m) {

                  return makePacket(
                          0x7B,
                          0xFF,
                          0x03,
                          m,
                          0xFF,
                          0xFF,
                          0xFF,
                          0xFF,
                          0xBF);
              }

              private byte[] rgbPacket(
                      int r,
                      int g,
                      int b) {

                  return makePacket(
                          0x7B,
                          0xFF,
                          0x07,
                          r,
                          b,
                          g,
                          0x00,
                          0xFF,
                          0xBF);
              }

              private byte[] brightnessPacket(
                      int value) {

                  return makePacket(
                          0x7B,
                          0xFF,
                          0x01,
                          value * 32 / 100,
                          value,
                          0x00,
                          0xFF,
                          0xFF,
                          0xBF);
              }

              private byte[] speedPacket(
                      int value) {

                  return makePacket(
                          0x7B,
                          0xFF,
                          0x02,
                          value,
                          0x00,
                          0xFF,
                          0xFF,
                          0xFF,
                          0xBF);
              }

              private byte[] directionPacket(
                      int direction) {

                  return makePacket(
                          0x7B,
                          0xFF,
                          0x0D,
                          direction,
                          0xFF,
                          0xFF,
                          0xFF,
                          0xFF,
                          0xBF);
              }

              private byte[] customColor(
                      int position,
                      int r,
                      int g,
                      int b,
                      int total) {

                  return makePacket(
                          0x7B,
                          position,
                          0x0E,
                          0xFD,
                          r,
                          g,
                          b,
                          total,
                          0xBF);
              }

              private byte[] customMode(
                      int ordinal) {

                  return makePacket(
                          0x7B,
                          0xFF,
                          0x13,
                          ordinal,
                          0xFF,
                          0xFF,
                          0xFF,
                          0xFF,
                          0xBF);
              }

              private byte[] parseHex(
                      String input) {

                  String cleaned =
                          input.trim();

                  if(cleaned.isEmpty())
                      throw new IllegalArgumentException();

                  String[] parts =
                          cleaned.split(
                                  "[,\\s]+");

                  byte[] data =
                          new byte[parts.length];

                  for(int i=0;
                      i<parts.length;
                      i++) {

                      String x =
                              parts[i];

                      if(x.startsWith("0x") ||
                              x.startsWith("0X"))
                          x=x.substring(2);

                      if(x.length()==0 ||
                              x.length()>2)
                          throw new IllegalArgumentException();

                      data[i]=(byte)
                              Integer.parseInt(
                                      x,
                                      16);
                  }

                  return data;
              }

              private String hex(
                      byte[] data) {

                  if(data == null)
                      return "";

                  StringBuilder out =
                          new StringBuilder();

                  for(byte value : data) {

                      out.append(
                              String.format(
                                      Locale.US,
                                      "%02X",
                                      value & 255));

                      out.append(" ");
                  }

                  return out.toString()
                          .trim();
              }

              private void log(
                      String message) {

                  String time =
                          new SimpleDateFormat(
                                  "HH:mm:ss.SSS",
                                  Locale.US)
                                  .format(
                                          new Date());

                  terminal.add(
                          time
                                  + "  "
                                  + message);

                  while(terminal.size()>300)
                      terminal.remove(0);
              }

              private String terminalText() {

                  if(terminal.isEmpty())
                      return
                              "NOT EXPOSED BY DEVICE";

                  StringBuilder out =
                          new StringBuilder();

                  for(String line :
                          terminal) {

                      out.append(line)
                              .append("\n");
                  }

                  return out.toString();
              }

              private String safeName(
                      BluetoothDevice device) {

                  try {

                      String name =
                              device.getName();

                      if(name == null ||
                              name.trim().isEmpty())
                          return "(NO NAME)";

                      return name;

                  } catch(Exception e) {

                      return "(NAME NOT EXPOSED)";
                  }
              }

              private String safeAddress(
                      BluetoothDevice device) {

                  try {
                      return device.getAddress();
                  } catch(Exception e) {
                      return "(ADDRESS NOT EXPOSED)";
                  }
              }

              private void toast(
                      String message) {

                  Toast.makeText(
                          this,
                          message,
                          Toast.LENGTH_SHORT)
                          .show();
              }

              private class ColorWheel
                      extends View {

                  private final Paint paint =
                          new Paint(
                                  Paint.ANTI_ALIAS_FLAG);

                  private float cx;
                  private float cy;
                  private float radius;

                  ColorWheel(Context context) {
                      super(context);
                  }

                  @Override
                  protected void onDraw(
                          Canvas canvas) {

                      cx =
                              getWidth() / 2f;

                      cy =
                              getHeight() / 2f;

                      radius =
                              Math.min(
                                      cx,
                                      cy) - 15;

                      for(int angle=0;
                          angle<360;
                          angle++) {

                          paint.setColor(
                                  Color.HSVToColor(
                                          new float[]{
                                                  angle,
                                                  1f,
                                                  1f
                                          }));

                          canvas.drawArc(
                                  cx-radius,
                                  cy-radius,
                                  cx+radius,
                                  cy+radius,
                                  angle,
                                  1.2f,
                                  true,
                                  paint);
                      }

                      paint.setStyle(
                              Paint.Style.STROKE);

                      paint.setStrokeWidth(5);

                      paint.setColor(
                              Color.WHITE);

                      canvas.drawCircle(
                              cx,
                              cy,
                              radius,
                              paint);

                      paint.setStyle(
                              Paint.Style.FILL);
                  }

                  @Override
                  public boolean onTouchEvent(
                          MotionEvent event) {

                      if(event.getAction() !=
                              MotionEvent.ACTION_DOWN &&
                              event.getAction() !=
                                      MotionEvent.ACTION_MOVE)
                          return true;

                      float dx =
                              event.getX() - cx;

                      float dy =
                              event.getY() - cy;

                      double angle =
                              Math.toDegrees(
                                      Math.atan2(
                                              dy,
                                              dx));

                      if(angle < 0)
                          angle += 360;

                      int color =
                              Color.HSVToColor(
                                      new float[]{
                                              (float)angle,
                                              1f,
                                              1f
                                      });

                      red =
                              Color.red(color);

                      green =
                              Color.green(color);

                      blue =
                              Color.blue(color);

                      enqueue(
                              rgbPacket(
                                      red,
                                      green,
                                      blue));

                      invalidate();

                      return true;
                  }
              }

              private class StripPreview
                      extends View {

                  private final Paint paint =
                          new Paint(
                                  Paint.ANTI_ALIAS_FLAG);

                  private float phase = 0;

                  StripPreview(Context context) {

                      super(context);

                      post(
                              new Runnable() {

                                  @Override
                                  public void run() {

                                      phase += 5;

                                      invalidate();

                                      postDelayed(
                                              this,
                                              40);
                                  }
                              });
                  }

                  @Override
                  protected void onDraw(
                          Canvas canvas) {

                      int count = 42;

                      float width =
                              getWidth() /
                                      (float)count;

                      for(int i=0;
                          i<count;
                          i++) {

                          float hue =
                                  (i * 9 +
                                          phase) %
                                          360;

                          paint.setColor(
                                  Color.HSVToColor(
                                          new float[]{
                                                  hue,
                                                  1f,
                                                  1f
                                          }));

                          canvas.drawRoundRect(
                                  i * width + 2,
                                  getHeight()/2f - 14,
                                  (i+1)*width - 2,
                                  getHeight()/2f + 14,
                                  8,
                                  8,
                                  paint);
                      }
                  }
              }

              @Override
              protected void onDestroy() {

                  stopScan();

                  try {

                      if(gatt != null)
                          gatt.close();

                  } catch(Exception ignored) {
                  }

                  super.onDestroy();
              }
          }
