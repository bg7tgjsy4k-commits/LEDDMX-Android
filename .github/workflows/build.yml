              private void startBleScan() {

                  if (!bluetoothPermissionOK()) {

                      requestBluetoothPermissions();

                      Toast.makeText(
                              this,
                              "Permission Bluetooth diperlukan",
                              Toast.LENGTH_SHORT
                      ).show();

                      return;
                  }

                  if (bluetoothAdapter == null
                          ||
                          !bluetoothAdapter.isEnabled()) {

                      Toast.makeText(
                              this,
                              "Aktifkan Bluetooth",
                              Toast.LENGTH_SHORT
                      ).show();

                      return;
                  }

                  try {

                      bleScanner =
                              bluetoothAdapter
                                      .getBluetoothLeScanner();

                  } catch (SecurityException e) {

                      return;
                  }

                  if (bleScanner == null) {
                      return;
                  }

                  discoveredDevices.clear();

                  if (scanDeviceListLayout != null) {
                      scanDeviceListLayout.removeAllViews();
                  }

                  statusText.setText(
                          "Status: Scanning BLE..."
                  );

                  try {

                      bleScanner.startScan(
                              new ScanCallback() {

                                  @Override
                                  public void onScanResult(
                                          int callbackType,
                                          ScanResult result
                                  ) {

                                      BluetoothDevice device =
                                              result.getDevice();

                                      String deviceName =
                                              "";

                                      try {

                                          if (device.getName()
                                                  != null) {

                                              deviceName =
                                                      device.getName();
                                          }

                                      } catch (
                                              SecurityException ignored
                                      ) {}

                                      if (
                                              deviceName.isEmpty()
                                                      &&
                                                      result.getScanRecord()
                                                              != null
                                                      &&
                                                      result.getScanRecord()
                                                              .getDeviceName()
                                                              != null
                                      ) {

                                          deviceName =
                                                  result.getScanRecord()
                                                          .getDeviceName();
                                      }

                                      if (deviceName == null) {
                                          deviceName = "";
                                      }

                                      String address;

                                      try {

                                          address =
                                                  device.getAddress();

                                      } catch (
                                              SecurityException e
                                      ) {

                                          return;
                                      }

                                      final String finalName =
                                              deviceName;

                                      final BluetoothDevice finalDevice =
                                              device;

                                      final int rssi =
                                              result.getRssi();

                                      boolean interesting =
                                              finalName
                                                      .toUpperCase(
                                                              Locale.US
                                                      )
                                                      .contains(
                                                              "LEDDMX"
                                                      )
                                                      ||
                                                      finalName
                                                              .toLowerCase(
                                                                      Locale.US
                                                              )
                                                              .contains(
                                                                      "b2cd"
                                                              );

                                      if (!interesting
                                              &&
                                              result.getScanRecord()
                                                      != null) {

                                          interesting =
                                                  result.getScanRecord()
                                                          .getServiceUuids()
                                                          != null
                                                          &&
                                                          result.getScanRecord()
                                                                  .getServiceUuids()
                                                                  .toString()
                                                                  .toLowerCase(
                                                                          Locale.US
                                                                  )
                                                                  .contains(
                                                                          "ffe0"
                                                                  );
                                      }

                                      if (!interesting) {
                                          return;
                                      }

                                      if (discoveredDevices.containsKey(
                                              address
                                      )) {
                                          return;
                                      }

                                      discoveredDevices.put(
                                              address,
                                              finalDevice
                                      );

                                      runOnUiThread(
                                              () -> addScanDevice(
                                                      finalDevice,
                                                      finalName,
                                                      rssi
                                              )
                                      );
                                  }

                                  @Override
                                  public void onScanFailed(
                                          int errorCode
                                  ) {

                                      runOnUiThread(
                                              () -> statusText.setText(
                                                      "Status: Scan failed "
                                                              + errorCode
                                              )
                                      );
                                  }
                              }
                      );

                      handler.postDelayed(
                              this::stopBleScan,
                              12000
                      );

                  } catch (SecurityException ignored) {
                  }
              }

              private void addScanDevice(
                      BluetoothDevice device,
                      String name,
                      int rssi
              ) {

                  if (scanDeviceListLayout == null) {
                      return;
                  }

                  String shownName =
                          name.isEmpty()
                                  ? "LEDDMX / BLE Device"
                                  : name;

                  Button b =
                          createButton(
                                  shownName
                                          + "\n"
                                          + safeAddress(
                                          device
                                  )
                                          + "   RSSI "
                                          + rssi,
                                  Color.rgb(
                                          0, 131, 143
                                  )
                          );

                  b.setOnClickListener(
                          v -> {

                              stopBleScan();

                              connectDevice(
                                      device
                              );
                          }
                  );

                  scanDeviceListLayout.addView(
                          b
                  );
              }

              private String safeAddress(
                      BluetoothDevice device
              ) {

                  try {
                      return device.getAddress();
                  } catch (SecurityException e) {
                      return "UNKNOWN";
                  }
              }

              private void stopBleScan() {

                  if (bleScanner == null) {
                      return;
                  }

                  try {
                      bleScanner.stopScan(
                              new ScanCallback() {}
                      );
                  } catch (Exception ignored) {
                  }

                  statusText.setText(
                          "Status: Scan stopped"
                  );
              }

              private void connectDevice(
                      BluetoothDevice device
              ) {

                  if (!bluetoothPermissionOK()) {
                      requestBluetoothPermissions();
                      return;
                  }

                  disconnectGatt();

                  statusText.setText(
                          "Status: Connecting..."
                  );

                  try {

                      bluetoothGatt =
                              device.connectGatt(
                                      this,
                                      false,
                                      new BluetoothGattCallback() {

                                          @Override
                                          public void onConnectionStateChange(
                                                  BluetoothGatt gatt,
                                                  int status,
                                                  int newState
                                          ) {

                                              if (
                                                      newState
                                                              ==
                                                              BluetoothGatt.STATE_CONNECTED
                                              ) {

                                                  bluetoothGatt =
                                                          gatt;

                                                  runOnUiThread(
                                                          () ->
                                                                  statusText.setText(
                                                                          "Status: Connected / Discovering FFE1..."
                                                                  )
                                                  );

                                                  try {

                                                      gatt.discoverServices();

                                                  } catch (
                                                          Exception ignored
                                                  ) {}

                                              } else if (
                                                      newState
                                                              ==
                                                              BluetoothGatt.STATE_DISCONNECTED
                                              ) {

                                                  if (bluetoothGatt
                                                          == gatt) {

                                                      bluetoothGatt =
                                                              null;

                                                      targetChar =
                                                              null;
                                                  }

                                                  try {
                                                      gatt.close();
                                                  } catch (
                                                          Exception ignored
                                                  ) {}

                                                  runOnUiThread(
                                                          () ->
                                                                  statusText.setText(
                                                                          "Status: Disconnected"
                                                                  )
                                                  );
                                              }
                                          }

                                          @Override
                                          public void onServicesDiscovered(
                                                  BluetoothGatt gatt,
                                                  int status
                                          ) {

                                              if (
                                                      status
                                                              !=
                                                              BluetoothGatt.GATT_SUCCESS
                                              ) {

                                                  runOnUiThread(
                                                          () ->
                                                                  statusText.setText(
                                                                          "GATT service error: "
                                                                                  + status
                                                                  )
                                                  );

                                                  return;
                                              }

                                              BluetoothGattCharacteristic found =
                                                      null;

                                              for (
                                                      BluetoothGattService service
                                                              :
                                                              gatt.getServices()
                                              ) {

                                                  if (
                                                          SERVICE_FFE0.equals(
                                                                  service.getUuid()
                                                          )
                                                                  ||
                                                                  service.getUuid()
                                                                          .toString()
                                                                          .equalsIgnoreCase(
                                                                                  SERVICE_FFE0.toString()
                                                                          )
                                                  ) {

                                                      for (
                                                              BluetoothGattCharacteristic c
                                                                      :
                                                                      service.getCharacteristics()
                                                      ) {

                                                          if (
                                                                  CHAR_FFE1.equals(
                                                                          c.getUuid()
                                                                  )
                                                                          ||
                                                                          c.getUuid()
                                                                                  .toString()
                                                                                  .equalsIgnoreCase(
                                                                                          CHAR_FFE1.toString()
                                                                                  )
                                                          ) {

                                                              found = c;
                                                              break;
                                                          }
                                                      }
                                                  }

                                                  if (found != null) {
                                                      break;
                                                  }
                                              }

                                              targetChar =
                                                      found;

                                              if (found != null) {

                                                  try {

                                                      if (
                                                              (found.getProperties()
                                                                      &
                                                                      BluetoothGattCharacteristic.PROPERTY_WRITE)
                                                                      !=
                                                                      0
                                                      ) {

                                                          found.setWriteType(
                                                                  BluetoothGattCharacteristic.WRITE_TYPE_DEFAULT
                                                          );

                                                      } else {

                                                          found.setWriteType(
                                                                  BluetoothGattCharacteristic.WRITE_TYPE_NO_RESPONSE
                                                          );
                                                      }

                                                  } catch (Exception ignored) {
                                                  }

                                                  runOnUiThread(
                                                          () -> {

                                                              statusText.setText(
                                                                      "Status: CONNECTED / FFE1 READY"
                                                              );

                                                              Toast.makeText(
                                                                      MainActivity.this,
                                                                      "LEDDMX FFE1 siap",
                                                                      Toast.LENGTH_SHORT
                                                              ).show();

                                                              showHomeDashboard();
                                                          }
                                                  );

                                              } else {

                                                  runOnUiThread(
                                                          () ->
                                                                  statusText.setText(
                                                                          "Status: Connected, FFE1 tidak ditemukan"
                                                                  )
                                                  );
                                              }
                                          }

                                          @Override
                                          public void onCharacteristicWrite(
                                                  BluetoothGatt gatt,
                                                  BluetoothGattCharacteristic characteristic,
                                                  int status
                                          ) {

                                              handler.postDelayed(
                                                      () -> {

                                                          writing =
                                                                  false;

                                                          drainWriteQueue();

                                                      },
                                                      45
                                              );
                                          }
                                      }
                              );

                  } catch (SecurityException ignored) {
                  }
              }

              private void disconnectGatt() {

                  if (bluetoothGatt != null) {

                      try {
                          bluetoothGatt.disconnect();
                      } catch (Exception ignored) {
                      }

                      try {
                          bluetoothGatt.close();
                      } catch (Exception ignored) {
                      }
                  }

                  bluetoothGatt = null;
                  targetChar = null;

                  writeQueue.clear();
                  writing = false;
              }

              private void sendCommand(
                      byte[] data
              ) {

                  if (
                          bluetoothGatt == null
                                  ||
                                  targetChar == null
                  ) {

                      Toast.makeText(
                              this,
                              "Belum terhubung ke FFE1",
                              Toast.LENGTH_SHORT
                      ).show();

                      return;
                  }

                  synchronized (writeQueue) {

                      writeQueue.add(
                              data.clone()
                      );
                  }

                  drainWriteQueue();
              }

              private void drainWriteQueue() {

                  if (writing) {
                      return;
                  }

                  if (writeQueue.isEmpty()) {
                      return;
                  }

                  if (
                          bluetoothGatt == null
                                  ||
                                  targetChar == null
                  ) {

                      writeQueue.clear();
                      return;
                  }

                  byte[] data;

                  synchronized (writeQueue) {
                      data = writeQueue.poll();
                  }

                  if (data == null) {
                      return;
                  }

                  writing = true;

                  try {

                      if (
                              (targetChar.getProperties()
                                      &
                                      BluetoothGattCharacteristic.PROPERTY_WRITE)
                                      != 0
                      ) {

                          targetChar.setWriteType(
                                  BluetoothGattCharacteristic.WRITE_TYPE_DEFAULT
                          );

                      } else {

                          targetChar.setWriteType(
                                  BluetoothGattCharacteristic.WRITE_TYPE_NO_RESPONSE
                          );
                      }

                      targetChar.setValue(data);

                      boolean accepted =
                              bluetoothGatt.writeCharacteristic(
                                      targetChar
                              );

                      if (!accepted) {

                          writing = false;

                          handler.postDelayed(
                                  this::drainWriteQueue,
                                  80
                          );
                      }

                  } catch (Exception e) {

                      writing = false;

                      handler.postDelayed(
                              this::drainWriteQueue,
                              100
                      );
                  }
              }

              /*
               * Proven LEDDMX Dialect-B style packets.
               */

              private byte[] packetPower(
                      boolean on
              ) {

                  return new byte[]{
                          (byte) 0x7B,
                          (byte) 0xFF,
                          (byte) 0x04,
                          (byte) (on ? 0x01 : 0x00),
                          (byte) 0xFF,
                          (byte) 0xFF,
                          (byte) 0xFF,
                          (byte) 0xFF,
                          (byte) 0xBF
                  };
              }

              private byte[] packetMode(
                      int mode
              ) {

                  mode =
                          Math.max(
                                  1,
                                  Math.min(
                                          210,
                                          mode
                                  )
                          );

                  return new byte[]{
                          (byte) 0x7B,
                          (byte) 0xFF,
                          (byte) 0x03,
                          (byte) mode,
                          (byte) 0xFF,
                          (byte) 0xFF,
                          (byte) 0xFF,
                          (byte) 0xFF,
                          (byte) 0xBF
                  };
              }

              private byte[] packetBrightness(
                      int percent
              ) {

                  percent =
                          Math.max(
                                  0,
                                  Math.min(
                                          100,
                                          percent
                                  )
                          );

                  int scaled =
                          Math.round(
                                  percent * 32f / 100f
                          );

                  return new byte[]{
                          (byte) 0x7B,
                          (byte) 0xFF,
                          (byte) 0x01,
                          (byte) scaled,
                          (byte) percent,
                          (byte) 0x01,
                          (byte) 0xFF,
                          (byte) 0xFF,
                          (byte) 0xBF
                  };
              }

              private byte[] packetSpeed(
                      int value
              ) {

                  value =
                          Math.max(
                                  0,
                                  Math.min(
                                          255,
                                          value
                                  )
                          );

                  return new byte[]{
                          (byte) 0x7B,
                          (byte) 0xFF,
                          (byte) 0x02,
                          (byte) value,
                          (byte) 0x00,
                          (byte) 0xFF,
                          (byte) 0xFF,
                          (byte) 0xFF,
                          (byte) 0xBF
                  };
              }

              private byte[] packetDirection(
                      int dir
              ) {

                  dir =
                          dir == 0
                                  ? 0
                                  : 1;

                  return new byte[]{
                          (byte) 0x7B,
                          (byte) 0xFF,
                          (byte) 0x0D,
                          (byte) dir,
                          (byte) 0xFF,
                          (byte) 0xFF,
                          (byte) 0xFF,
                          (byte) 0xFF,
                          (byte) 0xBF
                  };
              }

              private byte[] packetRGB(
                      int r,
                      int g,
                      int b
              ) {

                  r =
                          Math.max(
                                  0,
                                  Math.min(
                                          255,
                                          r
                                  )
                          );

                  g =
                          Math.max(
                                  0,
                                  Math.min(
                                          255,
                                          g
                                  )
                          );

                  b =
                          Math.max(
                                  0,
                                  Math.min(
                                          255,
                                          b
                                  )
                          );

                  return new byte[]{
                          (byte) 0x7B,
                          (byte) 0xFF,
                          (byte) 0x07,
                          (byte) r,
                          (byte) g,
                          (byte) b,
                          (byte) 0x00,
                          (byte) 0xFF,
                          (byte) 0xBF
                  };
              }

              private byte[] packetPixelConfig(
                      int pixels
              ) {

                  pixels =
                          Math.max(
                                  1,
                                  Math.min(
                                          65535,
                                          pixels
                                  )
                          );

                  return new byte[]{
                          (byte) 0x7B,
                          (byte) 0xFF,
                          (byte) 0x05,
                          (byte) 0x01,
                          (byte) ((pixels >> 8) & 0xFF),
                          (byte) (pixels & 0xFF),
                          (byte) 0x00,
                          (byte) 0xFF,
                          (byte) 0xBF
                  };
              }

              private byte[] packetRGBOrder(
                      int order
              ) {

                  order =
                          Math.max(
                                  1,
                                  Math.min(
                                          6,
                                          order
                                  )
                          );

                  return new byte[]{
                          (byte) 0x7B,
                          (byte) 0xFF,
                          (byte) 0x07,
                          (byte) order,
                          (byte) 0xFF,
                          (byte) 0xFF,
                          (byte) 0xFF,
                          (byte) 0xFF,
                          (byte) 0xBF
                  };
              }

              private void sendRGBColor(
                      int color
              ) {

                  sendCommand(
                          packetRGB(
                                  Color.red(color),
                                  Color.green(color),
                                  Color.blue(color)
                          )
                  );
              }

              private void startAnimationLoop() {

                  if (timelineFrames.isEmpty()) {
                      return;
                  }

                  isPlaying = true;

                  handler.removeCallbacksAndMessages(
                          null
                  );

                  handler.post(
                          new Runnable() {

                              int index = 0;

                              @Override
                              public void run() {

                                  if (
                                          !isPlaying
                                                  ||
                                                  timelineFrames.isEmpty()
                                  ) {
                                      return;
                                  }

                                  AnimFrame frame =
                                          timelineFrames.get(
                                                  index
                                                          %
                                                          timelineFrames.size()
                                          );

                                  int r1 =
                                          Color.red(
                                                  frame.leftColor
                                          );

                                  int g1 =
                                          Color.green(
                                                  frame.leftColor
                                          );

                                  int b1 =
                                          Color.blue(
                                                  frame.leftColor
                                          );

                                  int r2 =
                                          Color.red(
                                                  frame.rightColor
                                          );

                                  int g2 =
                                          Color.green(
                                                  frame.rightColor
                                          );

                                  int b2 =
                                          Color.blue(
                                                  frame.rightColor
                                          );

                                  /*
                                   * Exact independent LEFT/RIGHT
                                   * hardware packet is not assumed.
                                   *
                                   * Therefore preview remains dual-channel,
                                   * while live hardware sends a safe proven
                                   * 0x07 RGB packet using the average color.
                                   */

                                  int r =
                                          (r1 + r2) / 2;

                                  int g =
                                          (g1 + g2) / 2;

                                  int b =
                                          (b1 + b2) / 2;

                                  sendCommand(
                                          packetRGB(
                                                  r,
                                                  g,
                                                  b
                                          )
                                  );

                                  index++;

                                  handler.postDelayed(
                                          this,
                                          Math.max(
                                                  80,
                                                  frame.duration
                                          )
                                  );
                              }
                          }
                  );
              }

              private void stopAnimationLoop() {

                  isPlaying = false;

                  handler.removeCallbacksAndMessages(
                          null
                  );
              }

              private void startPreview() {

                  stopPreview();

                  if (previewView == null) {
                      return;
                  }

                  previewRunnable =
                          new Runnable() {

                              int index = 0;

                              @Override
                              public void run() {

                                  if (
                                          previewView == null
                                                  ||
                                                  timelineFrames.isEmpty()
                                  ) {
                                      return;
                                  }

                                  AnimFrame f =
                                          timelineFrames.get(
                                                  index
                                                          %
                                                          timelineFrames.size()
                                          );

                                  previewView.setColors(
                                          f.leftColor,
                                          f.rightColor
                                  );

                                  index++;

                                  previewHandler.postDelayed(
                                          this,
                                          Math.max(
                                                  80,
                                                  f.duration
                                          )
                                  );
                              }
                          };

                  previewHandler.post(
                          previewRunnable
                  );
              }

              private void stopPreview() {

                  if (previewRunnable != null) {

                      previewHandler.removeCallbacks(
                              previewRunnable
                      );

                      previewRunnable = null;
                  }
              }

              private void saveSlotToLocal(
                      int slot
              ) {

                  StringBuilder sb =
                          new StringBuilder();

                  for (
                          AnimFrame frame
                                  :
                          timelineFrames
                  ) {

                      sb.append(
                                      frame.leftColor
                              )
                              .append(",")
                              .append(
                                      frame.rightColor
                              )
                              .append(",")
                              .append(
                                      frame.duration
                              )
                              .append(";");
                  }

                  sharedPrefs
                          .edit()
                          .putString(
                                  "slot_" + slot,
                                  sb.toString()
                          )
                          .apply();
              }

              private void loadSlotFromLocal(
                      int slot
              ) {

                  String data =
                          sharedPrefs.getString(
                                  "slot_" + slot,
                                  ""
                          );

                  timelineFrames.clear();

                  if (data.isEmpty()) {

                      timelineFrames.add(
                              new AnimFrame(
                                      Color.RED,
                                      Color.BLUE,
                                      150
                              )
                      );

                      timelineFrames.add(
                              new AnimFrame(
                                      Color.BLUE,
                                      Color.RED,
                                      150
                              )
                      );

                      return;
                  }

                  String[] rows =
                          data.split(";");

                  for (String row : rows) {

                      try {

                          String[] p =
                                  row.split(",");

                          if (p.length >= 3) {

                              timelineFrames.add(
                                      new AnimFrame(
                                              Integer.parseInt(
                                                      p[0]
                                              ),
                                              Integer.parseInt(
                                                      p[1]
                                              ),
                                              Integer.parseInt(
                                                      p[2]
                                              )
                                      )
                              );
                          }

                      } catch (Exception ignored) {
                      }
                  }

                  if (timelineFrames.isEmpty()) {

                      timelineFrames.add(
                              new AnimFrame(
                                      Color.RED,
                                      Color.BLUE,
                                      150
                              )
                      );
                  }
              }

              @Override
              protected void onDestroy() {

                  stopAnimationLoop();
                  stopPreview();
                  disconnectGatt();

                  super.onDestroy();
              }

              private static class AnimFrame {

                  int leftColor;
                  int rightColor;
                  int duration;

                  AnimFrame(
                          int left,
                          int right,
                          int duration
                  ) {

                      this.leftColor = left;
                      this.rightColor = right;
                      this.duration = duration;
                  }
              }

              public interface ColorChangedListener {

                  void onColorChanged(int color);
              }

              private static class PreviewView
                      extends View {

                  private final Paint paint =
                          new Paint(
                                  Paint.ANTI_ALIAS_FLAG
                          );

                  private int leftColor =
                          Color.RED;

                  private int rightColor =
                          Color.BLUE;

                  PreviewView(
                          Context context
                  ) {

                      super(context);

                      setBackgroundColor(
                              Color.rgb(
                                      10, 12, 16
                              )
                      );
                  }

                  void setColors(
                          int left,
                          int right
                  ) {

                      leftColor = left;
                      rightColor = right;

                      postInvalidate();
                  }

                  @Override
                  protected void onDraw(
                          Canvas canvas
                  ) {

                      super.onDraw(canvas);

                      float w =
                              getWidth();

                      float h =
                              getHeight();

                      float radius =
                              Math.min(
                                      w / 4f,
                                      h / 2.5f
                              );

                      paint.setColor(
                              leftColor
                      );

                      canvas.drawCircle(
                              w * 0.28f,
                              h * 0.5f,
                              radius,
                              paint
                      );

                      paint.setColor(
                              rightColor
                      );

                      canvas.drawCircle(
                              w * 0.72f,
                              h * 0.5f,
                              radius,
                              paint
                      );

                      paint.setStyle(
                              Paint.Style.STROKE
                      );

                      paint.setStrokeWidth(4);

                      paint.setColor(
                              Color.WHITE
                      );

                      canvas.drawCircle(
                              w * 0.28f,
                              h * 0.5f,
                              radius,
                              paint
                      );

                      canvas.drawCircle(
                              w * 0.72f,
                              h * 0.5f,
                              radius,
                              paint
                      );

                      paint.setStyle(
                              Paint.Style.FILL
                      );
                  }
              }

              private static class ColorWheelView
                      extends View {

                  private final Paint paint =
                          new Paint(
                                  Paint.ANTI_ALIAS_FLAG
                          );

                  private final float[] hsv =
                          new float[]{
                                  0f,
                                  1f,
                                  1f
                          };

                  private ColorChangedListener listener;

                  ColorWheelView(
                          Context context
                  ) {

                      super(context);

                      setLayerType(
                              View.LAYER_TYPE_SOFTWARE,
                              null
                      );
                  }

                  int getColor() {

                      return Color.HSVToColor(
                              hsv
                      );
                  }

                  void setColor(
                          int color
                  ) {

                      Color.colorToHSV(
                              color,
                              hsv
                      );

                      invalidate();
                  }

                  void setOnColorChangedListener(
                          ColorChangedListener l
                  ) {

                      listener = l;
                  }

                  @Override
                  protected void onDraw(
                          Canvas canvas
                  ) {

                      super.onDraw(canvas);

                      float cx =
                              getWidth() / 2f;

                      float cy =
                              getHeight() / 2f;

                      float radius =
                              Math.min(
                                      cx,
                                      cy
                              ) - 20;

                      int[] colors =
                              new int[361];

                      for (int i = 0;
                           i <= 360;
                           i++) {

                          colors[i] =
                                  Color.HSVToColor(
                                          new float[]{
                                                  i,
                                                  1f,
                                                  1f
                                          }
                                  );
                      }

                      paint.setShader(
                              new SweepGradient(
                                      cx,
                                      cy,
                                      colors,
                                      null
                              )
                      );

                      canvas.drawCircle(
                              cx,
                              cy,
                              radius,
                              paint
                      );

                      paint.setShader(null);

                      float angle =
                              (float)
                                      Math.toRadians(
                                              hsv[0] - 90
                                      );

                      float x =
                              cx
                                      +
                                      (float)
                                              Math.cos(
                                                      angle
                                              )
                                              * radius;

                      float y =
                              cy
                                      +
                                      (float)
                                              Math.sin(
                                                      angle
                                              )
                                              * radius;

                      paint.setStyle(
                              Paint.Style.STROKE
                      );

                      paint.setStrokeWidth(8);

                      paint.setColor(
                              Color.WHITE
                      );

                      canvas.drawCircle(
                              x,
                              y,
                              14,
                              paint
                      );

                      paint.setStyle(
                              Paint.Style.FILL
                      );
                  }

                  @Override
                  public boolean onTouchEvent(
                          MotionEvent event
                  ) {

                      if (
                              event.getAction()
                                      != MotionEvent.ACTION_DOWN
                                      &&
                                      event.getAction()
                                              != MotionEvent.ACTION_MOVE
                      ) {

                          return true;
                      }

                      float cx =
                              getWidth() / 2f;

                      float cy =
                              getHeight() / 2f;

                      float dx =
                              event.getX() - cx;

                      float dy =
                              event.getY() - cy;

                      double angle =
                              Math.toDegrees(
                                      Math.atan2(
                                              dy,
                                              dx
                                      )
                              );

                      angle += 90;

                      if (angle < 0) {
                          angle += 360;
                      }

                      hsv[0] =
                              (float)
                                      angle;

                      hsv[1] = 1f;
                      hsv[2] = 1f;

                      invalidate();

                      if (listener != null) {
                          listener.onColorChanged(
                                  getColor()
                          );
                      }

                      return true;
                  }
              }
          }
