          cat > app/src/main/java/com/leddmx/aipro/Protocol.kt <<'EOF'
package com.leddmx.aipro

import android.graphics.Color
import java.util.Locale

object Protocol {

    /*
     * For the user's known LEDDMX-00 baseline:
     * ON  = 7B FF 04 01 FF FF FF FF BF
     * OFF = 7B FF 04 00 FF FF FF FF BF
     *
     * The public Dmx00Data source uses 03/02 on another implementation.
     * We preserve the user's known-working 01/00 baseline here.
     */

    fun power(on: Boolean): ByteArray =
        byteArrayOf(
            0x7B,
            0xFF.toByte(),
            0x04,
            if (on) 0x01 else 0x00,
            0xFF.toByte(),
            0xFF.toByte(),
            0xFF.toByte(),
            0xFF.toByte(),
            0xBF.toByte()
        )

    fun rgb(color: Int): ByteArray {
        return byteArrayOf(
            0x7B,
            0xFF.toByte(),
            0x07,
            Color.red(color).toByte(),
            Color.green(color).toByte(),
            Color.blue(color).toByte(),
            0x00,
            0xFF.toByte(),
            0xBF.toByte()
        )
    }

    fun brightness(value: Int): ByteArray {
        val p = value.coerceIn(0, 100)
        val adjusted = (p * 32) / 100

        return byteArrayOf(
            0x7B,
            0xFF.toByte(),
            0x01,
            adjusted.toByte(),
            p.toByte(),
            0x00,
            0xFF.toByte(),
            0xFF.toByte(),
            0xBF.toByte()
        )
    }

    fun speed(value: Int): ByteArray {
        return byteArrayOf(
            0x7B,
            0xFF.toByte(),
            0x02,
            value.coerceIn(0, 255).toByte(),
            0x00,
            0xFF.toByte(),
            0xFF.toByte(),
            0xFF.toByte(),
            0xBF.toByte()
        )
    }

    fun pattern(index: Int): ByteArray {
        return byteArrayOf(
            0x7B,
            0xFF.toByte(),
            0x03,
            index.coerceIn(0, 210).toByte(),
            0xFF.toByte(),
            0xFF.toByte(),
            0xFF.toByte(),
            0xFF.toByte(),
            0xBF.toByte()
        )
    }

    fun direction(forward: Boolean): ByteArray {
        return byteArrayOf(
            0x7B,
            0xFF.toByte(),
            0x0D,
            if (forward) 0x00 else 0x01,
            0xFF.toByte(),
            0xFF.toByte(),
            0xFF.toByte(),
            0xFF.toByte(),
            0xBF.toByte()
        )
    }

    fun mic(eq: Int): ByteArray {
        return byteArrayOf(
            0x7B,
            0xFF.toByte(),
            0x0B,
            eq.coerceIn(0, 255).toByte(),
            0x00,
            0xFF.toByte(),
            0xFF.toByte(),
            0xBF.toByte()
        )
    }

    fun customColor(
        position: Int,
        total: Int,
        color: Int
    ): ByteArray {
        return byteArrayOf(
            0x7B,
            position.coerceIn(1, 255).toByte(),
            0x0E,
            0xFD.toByte(),
            Color.red(color).toByte(),
            Color.green(color).toByte(),
            Color.blue(color).toByte(),
            total.coerceIn(1, 255).toByte(),
            0xBF.toByte()
        )
    }

    /*
     * GD, FD, FW, FS, AC, PU, FL, HO
     */
    fun customMode(ordinal: Int): ByteArray {
        return byteArrayOf(
            0x7B,
            0xFF.toByte(),
            0x13,
            ordinal.coerceIn(0, 7).toByte(),
            0xFF.toByte(),
            0xFF.toByte(),
            0xFF.toByte(),
            0xFF.toByte(),
            0xBF.toByte()
        )
    }

    fun customDirection(forward: Boolean): ByteArray {
        return direction(forward)
    }

    fun toHex(data: ByteArray): String =
        data.joinToString(" ") {
            "%02X".format(Locale.US, it.toInt() and 0xFF)
        }

    fun fromHex(text: String): ByteArray? {
        return try {
            val cleaned = text
                .replace("0x", "", true)
                .replace(",", " ")
                .trim()

            val tokens = cleaned.split(Regex("\\s+")).filter { it.isNotBlank() }

            if (tokens.isEmpty()) return null

            val result = ByteArray(tokens.size)

            tokens.forEachIndexed { index, token ->
                val v = token.toInt(16)
                if (v !in 0..255) return null
                result[index] = v.toByte()
            }

            result
        } catch (_: Throwable) {
            null
        }
    }
}
EOF

          cat > app/src/main/java/com/leddmx/aipro/MainActivity.kt <<'EOF'
package com.leddmx.aipro

import android.Manifest
import android.app.Activity
import android.app.AlertDialog
import android.bluetooth.*
import android.bluetooth.le.*
import android.content.Context
import android.content.Intent
import android.content.pm.PackageManager
import android.graphics.*
import android.graphics.drawable.ColorDrawable
import android.os.*
import android.provider.Settings
import android.view.*
import android.view.inputmethod.InputMethodManager
import android.widget.EditText
import android.widget.Toast
import java.util.*
import kotlin.math.*

class MainActivity : Activity() {

    companion object {
        private const val REQ_BT = 501
        private val SERVICE_UUID =
            UUID.fromString("0000FFE0-0000-1000-8000-00805F9B34FB")
        private val WRITE_UUID =
            UUID.fromString("0000FFE1-0000-1000-8000-00805F9B34FB")

        private val OTA_SERVICE =
            UUID.fromString("5833FF01-9B8B-5191-6142-22A4536EF123")

        private const val SCAN_MS = 8000L
    }

    private lateinit var root: DmxView

    private val handler = Handler(Looper.getMainLooper())

    private var bluetoothManager: BluetoothManager? = null
    private var bluetoothAdapter: BluetoothAdapter? = null
    private var scanner: BluetoothLeScanner? = null

    private var scanning = false
    private var gatt: BluetoothGatt? = null
    private var writeChar: BluetoothGattCharacteristic? = null

    private val devices = LinkedHashMap<String, DeviceRow>()

    private val txQueue: ArrayDeque<ByteArray> = ArrayDeque()
    private var txBusy = false

    private var lastScan = 0L

    private val scanCallback = object : ScanCallback() {
        override fun onScanResult(callbackType: Int, result: ScanResult) {
            val device = result.device
            val recordName = result.scanRecord?.deviceName
            val name =
                recordName?.takeIf { it.isNotBlank() }
                    ?: try {
                        device.name?.takeIf { it.isNotBlank() }
                    } catch (_: Throwable) {
                        null
                    }
                    ?: "UNKNOWN BLE"

            devices[device.address] = DeviceRow(
                device,
                name,
                result.rssi
            )

            root.invalidate()
        }

        override fun onBatchScanResults(results: MutableList<ScanResult>) {
            results.forEach { onScanResult(ScanSettings.CALLBACK_TYPE_ALL_MATCHES, it) }
        }

        override fun onScanFailed(errorCode: Int) {
            scanning = false

            val message = when (errorCode) {
                1 -> "ALREADY_STARTED"
                2 -> "APPLICATION_REGISTRATION_FAILED"
                3 -> "INTERNAL_ERROR"
                4 -> "FEATURE_UNSUPPORTED"
                5 -> "OUT_OF_HARDWARE_RESOURCES"
                6 -> "SCANNING_TOO_FREQUENTLY"
                else -> "SCAN_ERROR_$errorCode"
            }

            root.logDevice("SCAN ERROR: $message")
            root.invalidate()
        }
    }

    private val gattCallback = object : BluetoothGattCallback() {

        override fun onConnectionStateChange(
            g: BluetoothGatt,
            status: Int,
            newState: Int
        ) {
            runOnUiThread {
                if (newState == BluetoothProfile.STATE_CONNECTED) {
                    root.logDevice("GATT CONNECTED status=$status")
                    root.status = "DISCOVERING..."
                    root.invalidate()

                    handler.postDelayed({
                        try {
                            g.discoverServices()
                        } catch (_: Throwable) {
                        }
                    }, 300)
                } else if (newState == BluetoothProfile.STATE_DISCONNECTED) {
                    root.logDevice("GATT DISCONNECTED status=$status")
                    writeChar = null
                    root.status = "DISCONNECTED"
                    root.invalidate()
                }
            }
        }

        override fun onServicesDiscovered(
            g: BluetoothGatt,
            status: Int
        ) {
            runOnUiThread {
                root.logDevice("SERVICES DISCOVERED status=$status")

                val service = g.getService(SERVICE_UUID)
                writeChar = service?.getCharacteristic(WRITE_UUID)

                if (writeChar != null) {
                    root.status = "READY"
                    root.logDevice("DEVICE SOURCE: FFE1 WRITE READY")
                } else {
                    root.status = "CONNECTED / FFE1 NOT FOUND"
                    root.logDevice("DEVICE SOURCE: FFE1 NOT EXPOSED BY DEVICE")
                }

                g.services.forEach { s ->
                    root.logDevice(
                        "DEVICE SOURCE: SERVICE ${s.uuid}"
                    )

                    s.characteristics.forEach { c ->
                        root.logDevice(
                            "DEVICE SOURCE: CHAR ${c.uuid} props=${c.properties}"
                        )

                        if (
                            c.properties and
                            BluetoothGattCharacteristic.PROPERTY_NOTIFY != 0
                        ) {
                            try {
                                g.setCharacteristicNotification(c, true)
                            } catch (_: Throwable) {
                            }
                        }
                    }
                }

                val ota = g.getService(OTA_SERVICE)

                if (ota != null) {
                    root.otaDetected = true
                    root.logDevice(
                        "DEVICE SOURCE: OTA SERVICE DETECTED $OTA_SERVICE"
                    )
                } else {
                    root.otaDetected = false
                    root.logDevice(
                        "DEVICE SOURCE: OTA SERVICE NOT EXPOSED BY DEVICE"
                    )
                }

                root.invalidate()
            }
        }

        override fun onCharacteristicChanged(
            g: BluetoothGatt,
            characteristic: BluetoothGattCharacteristic
        ) {
            val data = characteristic.value ?: return

            runOnUiThread {
                root.logDevice(
                    "DEVICE RX ${characteristic.uuid}: ${Protocol.toHex(data)}"
                )
            }
        }

        override fun onCharacteristicRead(
            g: BluetoothGatt,
            characteristic: BluetoothGattCharacteristic,
            status: Int
        ) {
            val data = characteristic.value ?: ByteArray(0)

            runOnUiThread {
                root.logDevice(
                    "DEVICE READ ${characteristic.uuid} status=$status: ${Protocol.toHex(data)}"
                )
            }
        }

        override fun onDescriptorRead(
            g: BluetoothGatt,
            descriptor: BluetoothGattDescriptor,
            status: Int
        ) {
            runOnUiThread {
                root.logDevice(
                    "DEVICE DESCRIPTOR ${descriptor.uuid} status=$status"
                )
            }
        }
    }

    override fun onCreate(savedInstanceState: Bundle?) {
        super.onCreate(savedInstanceState)

        window.statusBarColor = Color.rgb(8, 10, 13)
        window.navigationBarColor = Color.rgb(8, 10, 13)

        bluetoothManager =
            getSystemService(Context.BLUETOOTH_SERVICE) as BluetoothManager

        bluetoothAdapter = bluetoothManager?.adapter

        root = DmxView(this)
        setContentView(root)

        requestBlePermissions()
    }

    private fun requestBlePermissions() {
        if (Build.VERSION.SDK_INT >= 31) {
            val p = arrayOf(
                Manifest.permission.BLUETOOTH_SCAN,
                Manifest.permission.BLUETOOTH_CONNECT
            )

            if (p.any { checkSelfPermission(it) != PackageManager.PERMISSION_GRANTED }) {
                requestPermissions(p, REQ_BT)
            }
        } else {
            if (
                checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION)
                != PackageManager.PERMISSION_GRANTED
            ) {
                requestPermissions(
                    arrayOf(Manifest.permission.ACCESS_FINE_LOCATION),
                    REQ_BT
                )
            }
        }
    }

    private fun canBle(): Boolean {
        if (bluetoothAdapter == null) {
            Toast.makeText(
                this,
                "Bluetooth adapter tidak tersedia",
                Toast.LENGTH_SHORT
            ).show()
            return false
        }

        if (Build.VERSION.SDK_INT >= 31) {
            if (
                checkSelfPermission(Manifest.permission.BLUETOOTH_SCAN)
                != PackageManager.PERMISSION_GRANTED ||
                checkSelfPermission(Manifest.permission.BLUETOOTH_CONNECT)
                != PackageManager.PERMISSION_GRANTED
            ) {
                requestBlePermissions()
                return false
            }
        } else {
            if (
                checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION)
                != PackageManager.PERMISSION_GRANTED
            ) {
                requestBlePermissions()
                return false
            }
        }

        return true
    }

    fun startScan() {
        if (!canBle()) return

        val adapter = bluetoothAdapter ?: return

        if (!adapter.isEnabled) {
            try {
                startActivityForResult(
                    Intent(BluetoothAdapter.ACTION_REQUEST_ENABLE),
                    90
                )
            } catch (_: Throwable) {
            }
            return
        }

        val now = SystemClock.elapsedRealtime()

        if (now - lastScan < 2500) {
            root.logDevice("SCAN BLOCKED: cooldown")
            root.invalidate()
            return
        }

        lastScan = now
        devices.clear()

        scanner = adapter.bluetoothLeScanner

        if (scanner == null) {
            root.logDevice("SCAN ERROR: scanner unavailable")
            return
        }

        scanning = true
        root.status = "SCANNING..."
        root.logDevice("SCAN START")

        val filters = listOf(
            ScanFilter.Builder().setDeviceName("LEDDMX-00").build(),
            ScanFilter.Builder().build()
        )

        val settings = ScanSettings.Builder()
            .setScanMode(ScanSettings.SCAN_MODE_LOW_LATENCY)
            .build()

        try {
            scanner?.startScan(
                filters,
                settings,
                scanCallback
            )
        } catch (e: Throwable) {
            scanning = false
            root.logDevice("SCAN START ERROR: ${e.message}")
        }

        handler.postDelayed({
            stopScan()
        }, SCAN_MS)

        root.invalidate()
    }

    fun stopScan() {
        if (!scanning) return

        try {
            scanner?.stopScan(scanCallback)
        } catch (_: Throwable) {
        }

        scanning = false
        root.status =
            if (writeChar != null) "READY" else "DISCONNECTED"

        root.logDevice("SCAN STOP - ${devices.size} DEVICE(S)")
        root.invalidate()
    }

    fun connect(row: DeviceRow) {
        if (!canBle()) return

        stopScan()

        try {
            gatt?.close()
        } catch (_: Throwable) {
        }

        writeChar = null
        root.status = "CONNECTING..."
        root.logDevice(
            "CONNECT ${row.name} ${row.device.address}"
        )
        root.invalidate()

        try {
            gatt =
                row.device.connectGatt(
                    this,
                    false,
                    gattCallback,
                    BluetoothDevice.TRANSPORT_LE
                )
        } catch (e: Throwable) {
            root.status = "CONNECT ERROR"
            root.logDevice("CONNECT ERROR: ${e.message}")
        }
    }

    fun disconnect() {
        try {
            gatt?.disconnect()
            gatt?.close()
        } catch (_: Throwable) {
        }

        gatt = null
        writeChar = null
        root.status = "DISCONNECTED"
        root.logDevice("DISCONNECTED")
        root.invalidate()
    }

    fun send(data: ByteArray, label: String = "TX") {
        if (writeChar == null || gatt == null) {
            root.logDevice("TX BLOCKED: FFE1 NOT READY")
            root.invalidate()
            return
        }

        txQueue.add(data.copyOf())
        root.logDevice(
            "$label QUEUED: ${Protocol.toHex(data)}"
        )

        processTx()
    }

    private fun processTx() {
        if (txBusy) return

        val c = writeChar ?: return
        val g = gatt ?: return
        if (txQueue.isEmpty()) return

        val data = txQueue.removeFirst()
        txBusy = true

        try {
            c.writeType =
                BluetoothGattCharacteristic.WRITE_TYPE_NO_RESPONSE

            c.value = data

            val ok = g.writeCharacteristic(c)

            if (!ok) {
                root.logDevice("TX WRITE RETURNED FALSE")
            } else {
                root.logDevice(
                    "DEVICE TX: ${Protocol.toHex(data)}"
                )
            }
        } catch (e: Throwable) {
            root.logDevice("TX ERROR: ${e.message}")
        }

        handler.postDelayed({
            txBusy = false
            processTx()
        }, 75)
    }

    fun showRawDialog() {
        val input = EditText(this)
        input.setText("")
        input.hint = "7B FF 03 01 FF FF FF FF BF"
        input.setTextColor(Color.WHITE)
        input.setHintTextColor(Color.GRAY)

        val box = AlertDialog.Builder(this)
            .setTitle("RAW HEX → DEVICE")
            .setMessage(
                "Packet akan dikirim langsung ke FFE1.\n" +
                    "Gunakan hanya bila memang ingin melakukan eksperimen protokol."
            )
            .setView(input)
            .setNegativeButton("CANCEL", null)
            .setPositiveButton("SEND") { _, _ ->
                val data = Protocol.fromHex(input.text.toString())

                if (data == null) {
                    Toast.makeText(
                        this,
                        "HEX tidak valid",
                        Toast.LENGTH_SHORT
                    ).show()
                } else {
                    send(data, "RAW")
                }
            }
            .create()

        box.window?.setSoftInputMode(
            WindowManager.LayoutParams.SOFT_INPUT_STATE_ALWAYS_VISIBLE
        )

        box.show()
    }

    data class DeviceRow(
        val device: BluetoothDevice,
        val name: String,
        val rssi: Int
    )

    inner class DmxView(context: Context) :
        View(context) {

        private val bg = Color.rgb(8, 10, 13)
        private val panel = Color.rgb(18, 22, 27)
        private val panel2 = Color.rgb(25, 30, 36)
        private val text = Color.rgb(238, 242, 246)
        private val sub = Color.rgb(150, 158, 168)
        private val green = Color.rgb(48, 209, 111)
        private val red = Color.rgb(255, 82, 82)
