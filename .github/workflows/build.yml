              private void generateAI(
                      String command) {

                  frames.clear();

                  String c =
                          command == null
                          ? ""
                          : command
                                  .toLowerCase(
                                          Locale.US)
                                  .trim();

                  if (c.isEmpty()) {
                      frames.add(
                              defaultFrame());

                      return;
                  }

                  int d = speedMs;

                  if (c.contains("super cepat") ||
                      c.contains("sangat cepat")) {

                      d = 70;

                  } else if (c.contains("cepat") ||
                             c.contains("fast")) {

                      d = 120;

                  } else if (c.contains("pelan") ||
                             c.contains("lambat") ||
                             c.contains("slow")) {

                      d = 700;
                  }

                  if (c.contains("rainbow") ||
                      c.contains("pelangi")) {

                      generateRainbow();
                      return;
                  }

                  if (c.contains("chase") ||
                      c.contains("running") ||
                      c.contains("berjalan") ||
                      c.contains("jalan")) {

                      generateChase();
                      return;
                  }

                  if (c.contains("fade") ||
                      c.contains("fading") ||
                      c.contains("memudar")) {

                      generateFade();
                      return;
                  }

                  if (c.contains("strobo") ||
                      c.contains("strobe") ||
                      c.contains("flash")) {

                      ArrayList<Integer>
                              colors =
                              extractColors(c);

                      if (colors.isEmpty()) {
                          colors.add(Color.RED);
                      }

                      for (int i = 0;
                           i < 12;
                           i++) {

                          int col =
                                  (i & 1) == 0
                                  ? colors.get(
                                          (i / 2) %
                                          colors.size())
                                  : Color.BLACK;

                          addColorFrame(
                                  col,
                                  col,
                                  d);
                      }

                      return;
                  }

                  if (c.contains("belang") ||
                      c.contains("stripe") ||
                      c.contains("bergantian") ||
                      c.contains("alternating")) {

                      ArrayList<Integer>
                              colors =
                              extractColors(c);

                      if (colors.size() < 2) {

                          colors.clear();

                          colors.add(
                                  Color.RED);

                          colors.add(
                                  Color.BLUE);
                      }

                      for (int i = 0;
                           i < 12;
                           i++) {

                          int a =
                              colors.get(
                                  i %
                                  colors.size());

                          int b =
                              colors.get(
                                  (i + 1) %
                                  colors.size());

                          addColorFrame(
                                  a,
                                  b,
                                  d);
                      }

                      return;
                  }

                  if (c.contains("kiri") &&
                      c.contains("kanan")) {

                      int left =
                              colorFromText(
                                      c,
                                      Color.RED);

                      int right =
                              colorFromTextAfter(
                                      c,
                                      "kanan",
                                      Color.BLUE);

                      for (int i = 0;
                           i < 8;
                           i++) {

                          addColorFrame(
                                  left,
                                  right,
                                  d);
                      }

                      return;
                  }

                  ArrayList<Integer>
                          colors =
                          extractColors(c);

                  if (colors.size() >= 2) {

                      for (int i = 0;
                           i < 12;
                           i++) {

                          int a =
                              colors.get(
                                  i %
                                  colors.size());

                          int b =
                              colors.get(
                                  (i + 1) %
                                  colors.size());

                          addColorFrame(
                                  a,
                                  b,
                                  d);
                      }

                      return;
                  }

                  int color =
                          colors.isEmpty()
                          ? colorFromText(
                                  c,
                                  Color.RED)
                          : colors.get(0);

                  for (int i = 0;
                       i < 6;
                       i++) {

                      addColorFrame(
                              color,
                              color,
                              d);
                  }
              }

              private ArrayList<Integer>
                      extractColors(String s) {

                  ArrayList<Integer> result =
                          new ArrayList<>();

                  Pattern p =
                          Pattern.compile(
                                  "merah|red|" +
                                  "hijau|green|" +
                                  "biru|blue|" +
                                  "putih|white|" +
                                  "kuning|yellow|" +
                                  "ungu|purple|" +
                                  "cyan|orange|pink");

                  Matcher m =
                          p.matcher(s);

                  while (m.find()) {

                      result.add(
                              colorFromText(
                                      m.group(),
                                      Color.WHITE));
                  }

                  return result;
              }

              private int colorFromText(
                      String s,
                      int fallback) {

                  s =
                          s.toLowerCase(
                                  Locale.US);

                  if (s.contains("merah") ||
                      s.contains("red"))
                      return Color.RED;

                  if (s.contains("hijau") ||
                      s.contains("green"))
                      return Color.GREEN;

                  if (s.contains("biru") ||
                      s.contains("blue"))
                      return Color.BLUE;

                  if (s.contains("putih") ||
                      s.contains("white"))
                      return Color.WHITE;

                  if (s.contains("kuning") ||
                      s.contains("yellow"))
                      return Color.YELLOW;

                  if (s.contains("cyan"))
                      return Color.CYAN;

                  if (s.contains("ungu") ||
                      s.contains("purple"))
                      return Color.MAGENTA;

                  if (s.contains("orange"))
                      return Color.rgb(
                              255,128,0);

                  if (s.contains("pink"))
                      return Color.rgb(
                              255,80,150);

                  return fallback;
              }

              private int colorFromTextAfter(
                      String text,
                      String word,
                      int fallback) {

                  int pos =
                          text.indexOf(word);

                  if (pos < 0)
                      return fallback;

                  return colorFromText(
                          text.substring(pos),
                          fallback);
              }

              private void addColorFrame(
                      int left,
                      int right,
                      int duration) {

                  frames.add(
                          new Frame(
                                  Color.red(left),
                                  Color.green(left),
                                  Color.blue(left),
                                  Color.red(right),
                                  Color.green(right),
                                  Color.blue(right),
                                  duration));
              }

              private void saveSlot(int slot) {

                  if (frames.isEmpty())
                      return;

                  StringBuilder data =
                          new StringBuilder();

                  for (Frame f :
                          frames) {

                      data.append(f.lr)
                              .append(',');

                      data.append(f.lg)
                              .append(',');

                      data.append(f.lb)
                              .append(',');

                      data.append(f.rr)
                              .append(',');

                      data.append(f.rg)
                              .append(',');

                      data.append(f.rb)
                              .append(',');

                      data.append(f.duration)
                              .append(';');
                  }

                  prefs.edit()
                          .putString(
                                  "slot_" + slot,
                                  data.toString())
                          .apply();
              }

              private void loadSlot(int slot) {

                  frames.clear();

                  String data =
                          prefs.getString(
                                  "slot_" + slot,
                                  null);

                  if (data == null ||
                      data.isEmpty()) {

                      frames.add(
                              defaultFrame());

                      return;
                  }

                  try {

                      String[] list =
                              data.split(";");

                      for (String item :
                              list) {

                          if (item.trim()
                                  .isEmpty())
                              continue;

                          String[] p =
                                  item.split(",");

                          if (p.length != 7)
                              continue;

                          frames.add(
                                  new Frame(
                                      Integer.parseInt(p[0]),
                                      Integer.parseInt(p[1]),
                                      Integer.parseInt(p[2]),
                                      Integer.parseInt(p[3]),
                                      Integer.parseInt(p[4]),
                                      Integer.parseInt(p[5]),
                                      Integer.parseInt(p[6])));
                      }

                  } catch (Exception e) {

                      frames.clear();
                  }

                  if (frames.isEmpty()) {
                      frames.add(
                              defaultFrame());
                  }
              }

