        for(int i = 0; i < colors.size(); i++) {

            int c =
                    colors.get(i);

            send(
                    Dmx.customColor(
                            i + 1,
                            Color.red(c),
                            Color.green(c),
                            Color.blue(c),
                            colors.size()
                    )
