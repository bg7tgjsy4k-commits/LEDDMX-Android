              private void generateAnimation(
                      String command
              ) {

                  String q =
                          command.toLowerCase(
                                  Locale.US
                          );


                  frames.clear();


                  if (
                          q.contains("rainbow") ||
                          q.contains("pelangi")
                  ) {

                      generateRainbow();

                      return;
                  }


                  if (
                          q.contains("stripe") ||
                          q.contains("belang")
                  ) {

                      generateStripe();

                      return;
                  }


                  if (
                          q.contains("chase") ||
                          q.contains("kejar")
                  ) {

                      generateChase();

                      return;
                  }


                  if (
                          q.contains("merah") &&
                          q.contains("biru")
                  ) {

                      frames.add(
                              new Frame(
                                      255,
                                      0,
                                      0,
                                      0,
                                      0,
                                      255,
                                      q.contains("cepat")
                                              ? 180
                                              : 400
                              )
                      );


                      frames.add(
                              new Frame(
                                      0,
                                      0,
                                      255,
                                      255,
                                      0,
                                      0,
                                      q.contains("cepat")
                                              ? 180
                                              : 400
                              )
                      );


                      buildEditor();

                      return;
                  }


                  if (
                          q.contains("hijau")
                  ) {

                      frames.add(
                              new Frame(
                                      0,
                                      255,
                                      0,
                                      0,
                                      255,
                                      0,
                                      500
                              )
                      );

                  } else if (
                          q.contains("biru")
                  ) {

                      frames.add(
                              new Frame(
                                      0,
                                      0,
                                      255,
                                      0,
                                      0,
                                      255,
                                      500
                              )
                      );

                  } else {

                      frames.add(
                              new Frame(
                                      255,
                                      0,
                                      0,
                                      255,
                                      0,
                                      0,
                                      500
                              )
                      );
                  }


                  buildEditor();
              }


