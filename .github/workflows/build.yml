                              14,
                              Color.WHITE
                          );

                          y += 60;
                      }
                  }

                  @Override
                  public boolean onTouchEvent(
                      MotionEvent e
                  ) {

                      float x = e.getX();
                      float y = e.getY();

                      if (
                          e.getAction()
                          ==
                          MotionEvent.ACTION_DOWN
                      ) {

                          dx = x;
                          dy = y;

                          return true;
                      }

                      if (
                          page == 2
                          &&
                          (
                              e.getAction()
                              ==
                              MotionEvent.ACTION_MOVE
                              ||
                              e.getAction()
                              ==
                              MotionEvent.ACTION_UP
                          )
                          &&
                          Math.hypot(
                              x - getWidth() / 2,
                              y - 380
                          ) < 130
                      ) {

                          float h =
                              (float)
                              Math.toDegrees(
                                  Math.atan2(
                                      y - 380,
                                      x - getWidth() / 2
                                  )
                              );

                          if (h < 0) {
                              h += 360;
                          }

                          color = hsv(h);
                          hue = h;

                          if (!colors.isEmpty()) {
                              colors.set(
                                  0,
                                  color
                              );
                          }

                          invalidate();

                          if (
                              e.getAction()
                              ==
                              MotionEvent.ACTION_UP
                          ) {
                              rgb(color);
                          }

                          return true;
                      }

                      if (
                          e.getAction()
                          !=
                          MotionEvent.ACTION_UP
                      ) {
                          return true;
                      }

                      if (drawer) {

                          if (
                              x >
                              getWidth() * .82f
                          ) {

                              drawer = false;

                              invalidate();

                              return true;
                          }

                          int idx =
                              (int)
                              (
                                  (y - 94)
                                  / 60
                              );

                          if (
                              idx >= 0
                              &&
                              idx < 7
                          ) {

                              page = idx;

                              drawer = false;

                              invalidate();
                          }

                          return true;
                      }

                      if (
                          y < 90
                          &&
                          x < 62
                      ) {

                          drawer = true;

                          invalidate();

                          return true;
                      }

                      if (page == 0) {

                          if (
                              y > 225
                              &&
                              y < 295
                          ) {

                              if (
                                  x <
                                  getWidth() / 2
                              ) {
                                  power(true);
                              } else {
                                  power(false);
                              }

                              return true;
                          }

                          if (
                              y > 450
                              &&
                              y < 520
                          ) {

                              brightness =
                                  Math.max(
                                      0,
                                      Math.min(
                                          100,
                                          (
                                              int
                                              )(
                                                  (
                                                      x - 24
                                                  )
                                                  /
                                                  (
                                                      getWidth()
                                                      - 48
                                                  )
                                                  *
                                                  100
                                              )
                                          )
                                      );

                              bright(
                                  brightness
                              );

                              invalidate();

                              return true;
                          }

                          if (
                              y > 525
                              &&
                              y < 595
                          ) {

                              speedValue =
                                  Math.max(
                                      0,
                                      Math.min(
                                          100,
                                          (
                                              int
                                              )(
                                                  (
                                                      x - 24
                                                  )
                                                  /
                                                  (
                                                      getWidth()
                                                      - 48
                                                  )
                                                  *
                                                  100
                                              )
                                          )
                                      );

                              setSpeed(
                                  speedValue
                              );

                              invalidate();

                              return true;
                          }

                          if (
                              y > 600
                              &&
                              y < 680
                          ) {

                              scan();

                              return true;
                          }

                          if (y >= 690) {

                              int i =
                                  (
                                      int
                                  )(
                                      (
                                          y - 700
                                      )
                                      / 70
                                  );

                              if (
                                  i >= 0
                                  &&
                                  i < devices.size()
                              ) {

                                  connect(
                                      devices.get(i)
                                  );

                                  return true;
                              }
                          }

                      } else if (
                          page == 1
                          &&
                          y >= 300
                      ) {

                          int i =
                              1 +
                              (
                                  int
                                  )(
                                      (
                                          y - 300
                                      )
                                      / 56
                                  );

                          if (
                              i >= 1
                              &&
                              i <= 210
                          ) {

                              mode = i;

                              mode(i);

                              invalidate();

                              return true;
                          }

                      } else if (
                          page == 2
                          &&
                          y >= 690
                      ) {

                          customColor(
                              1,
                              colors.size(),
                              color
                          );

                          customMode(0);

                          return true;
                      }

                      return true;
                  }
              }
          }
          JAVA

      - name: Verify project
        shell: bash
        run: |
          set -euo pipefail

          cd LEDDMX-Android

          test -s settings.gradle
          test -s build.gradle
          test -s app/build.gradle
          test -s app/src/main/AndroidManifest.xml
          test -s app/src/main/java/com/leddmx/pro/MainActivity.java
          test -s app/src/main/java/com/leddmx/pro/Patterns.java

          grep -q 'BLUETOOTH_SCAN' \
            app/src/main/AndroidManifest.xml

          grep -q 'startScan' \
            app/src/main/java/com/leddmx/pro/MainActivity.java

          grep -q 'connectGatt' \
            app/src/main/java/com/leddmx/pro/MainActivity.java

          grep -q '0000FFE1' \
            app/src/main/java/com/leddmx/pro/MainActivity.java

      - name: Build APK with Gradle 7.6.1
        shell: bash
        run: |
          set -euo pipefail

          cd LEDDMX-Android

          gradle --version

          gradle \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            clean \
            assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          test -s \
            LEDDMX-Android/app/build/outputs/apk/debug/app-debug.apk

          ls -lh \
            LEDDMX-Android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LEDDMX-Pro-FINAL
          path: LEDDMX-Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
