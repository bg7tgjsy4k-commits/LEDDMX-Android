              private void clearContent() {
                  stopAnimationLoop();
                  contentLayout.removeAllViews();
              }

              private TextView header(String text) {

                  TextView t =
                          new TextView(this);

                  t.setText(text);

                  t.setTextColor(
                          Color.CYAN
                  );

                  t.setTextSize(17);

                  t.setPadding(
                          0,
