                          );

                  on.setOnClickListener(
                          v -> sendPower(true)
                  );

                  Button off =
                          createButton(
                                  "POWER OFF",
                                  Color.rgb(200, 0, 0)
                          );

                  off.setOnClickListener(
                          v -> sendPower(false)
                  );

                  power.addView(
                          on,
                          new LinearLayout.LayoutParams(
                                  0,
                                  -2,
                                  1
                          )
                  );

                  power.addView(
                          off,
                          new LinearLayout.LayoutParams(
                                  0,
                                  -2,
