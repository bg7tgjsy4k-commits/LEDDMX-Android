                                                  0x04,
                                                  0x00,
                                                  0xFF,
                                                  0xFF,
                                                  0xFF,
                                                  0xFF,
                                                  0xBF
                                          )
                                  )
                  );


                  // ==================================================
                  // RGB
                  // ==================================================

                  root.addView(
                          text(
                                  "RGB #RRGGBB"
                          )
                  );


                  rgb =
                          new EditText(this);


                  rgb.setText(
                          "#00FFFF"
                  );


                  rgb.setTextColor(
                          Color.WHITE
                  );


                  root.addView(rgb);


                  Button setRGB =
