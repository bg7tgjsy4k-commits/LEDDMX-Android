                      );

                      timelineFrames.add(
                              new AnimFrame(
                                      Color.GREEN,
                                      Color.YELLOW,
                                      100
                              )
                      );

                      timelineFrames.add(
                              new AnimFrame(
                                      Color.YELLOW,
                                      Color.GREEN,
                                      100
                              )
                      );

                  } else if (
                          n.contains("police")
                  ) {

                      timelineFrames.add(
                              new AnimFrame(
                                      Color.RED,
                                      Color.BLUE,
                                      100
                              )
                      );

                      timelineFrames.add(
                              new AnimFrame(
                                      Color.BLUE,
                                      Color.RED,
                                      100
                              )
                      );

                  } else if (
                          n.contains("strobe")
                  ) {

                      timelineFrames.add(
                              new AnimFrame(
                                      Color.WHITE,
                                      Color.WHITE,
                                      70
                              )
                      );

                      timelineFrames.add(
                              new AnimFrame(
                                      Color.BLACK,
                                      Color.BLACK,
                                      70
                              )
                      );

                  } else if (
                          n.contains("fire")
