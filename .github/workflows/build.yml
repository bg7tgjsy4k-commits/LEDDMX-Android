              private void startScan(
                      LinearLayout list) {

                  if(adapter==null) {

                      Toast.makeText(
                              this,
                              "Bluetooth tidak tersedia",
                              Toast.LENGTH_SHORT).show();

                      return;
                  }

                  if(android.os.Build.VERSION.SDK_INT>=31 &&
                          checkSelfPermission(
                                  Manifest.permission.BLUETOOTH_SCAN)
                                  !=PackageManager.PERMISSION_GRANTED) {

                      requestBlePermissions();
                      return;
                  }

                  scanner=
                          adapter.getBluetoothLeScanner();

                  if(scanner==null) return;

                  if(scanning) {

                      try {
                          scanner.stopScan(scanCallback);
                      } catch(Exception ignored){}

                      scanning=false;
                  }

                  devices.clear();
                  list.removeAllViews();

                  scanning=true;

                  try {

                      scanner.startScan(scanCallback);

                  } catch(Exception e) {

                      scanning=false;

                      Toast.makeText(
                              this,
                              "BLE scan gagal",
                              Toast.LENGTH_SHORT).show();

                      return;
                  }

                  handler.postDelayed(() -> {

                      if(scanner!=null &&
                              scanning) {

                          try {
                              scanner.stopScan(
                                      scanCallback);
                          } catch(Exception ignored){}

                          scanning=false;
                      }

                  },10000);
              }

              private final ScanCallback scanCallback =
                      new ScanCallback() {

                  @Override
                  public void onScanResult(
                          int callbackType,
                          ScanResult result) {

                      BluetoothDevice d=
                              result.getDevice();

                      if(d==null ||
                              devices.contains(d))
                          return;

                      String name="";

                      try {

                          if(d.getName()!=null)
                              name=d.getName();

                      } catch(Exception ignored){}

                      /*
                       * Prioritize LEDDMX / LED LAMP,
                       * but still show other BLE devices.
                       */

                      if(name.isEmpty())
                          name="BLE DEVICE";

                      devices.add(d);

                      runOnUiThread(() -> {

                          Button b=button(
                                  name+
                                  "\n"+
                                  d.getAddress());

                          b.setOnClickListener(
                                  v -> connect(d));

                          LinearLayout parent=
                                  (LinearLayout)
                                          content.getChildAt(1);

                          if(parent!=null)
                              parent.addView(b);
                      });
                  }
              };

              private void connect(
                      BluetoothDevice device) {

                  if(android.os.Build.VERSION.SDK_INT>=31 &&
                          checkSelfPermission(
                                  Manifest.permission.BLUETOOTH_CONNECT)
                                  !=PackageManager.PERMISSION_GRANTED) {

                      requestBlePermissions();
                      return;
                  }

                  status.setText(
                          "● CONNECTING...");

                  try {

                      if(gatt!=null) {
                          gatt.close();
                          gatt=null;
                      }

                      gatt=
                              device.connectGatt(
                                      this,
                                      false,
                                      gattCallback);

                  } catch(Exception e) {

                      status.setText(
                              "● CONNECTION ERROR");
                  }
              }

              private final BluetoothGattCallback
                      gattCallback=
                      new BluetoothGattCallback() {

                  @Override
                  public void onConnectionStateChange(
                          BluetoothGatt g,
                          int statusCode,
                          int newState) {

                      if(newState==
                              BluetoothGatt.STATE_CONNECTED) {

                          gatt=g;

                          runOnUiThread(() -> {

                              status.setText(
                                      "● CONNECTED");

                              Toast.makeText(
                                      MainActivity.this,
                                      "LEDDMX CONNECTED",
                                      Toast.LENGTH_SHORT)
                                      .show();
                          });

                          try {
                              g.discoverServices();
                          } catch(Exception ignored){}

                      } else if(
                              newState==
                              BluetoothGatt.STATE_DISCONNECTED) {

                          writeChar=null;

                          runOnUiThread(() ->
                                  status.setText(
                                          "● DISCONNECTED"));
                      }
                  }

                  @Override
                  public void onServicesDiscovered(
                          BluetoothGatt g,
                          int statusCode) {

                      BluetoothGattCharacteristic
                              found=null;

                      /*
                       * FIRST PRIORITY:
                       * exact known FFE1 characteristic.
                       */

                      BluetoothGattService service=
                              g.getService(
                                      SERVICE_UUID);

                      if(service!=null) {

                          found=
                              service.getCharacteristic(
                                      WRITE_UUID);
                      }

                      /*
                       * Fallback:
                       * find writable characteristic,
                       * but FFE1 always has priority.
                       */

                      if(found==null) {

                          for(BluetoothGattService s:
                                  g.getServices()) {

                              for(BluetoothGattCharacteristic c:
                                      s.getCharacteristics()) {

                                  int props=
                                          c.getProperties();

                                  if((props &
                                          (BluetoothGattCharacteristic
                                                  .PROPERTY_WRITE |
                                           BluetoothGattCharacteristic
                                                  .PROPERTY_WRITE_NO_RESPONSE))
                                          !=0) {

                                      found=c;
                                  }
                              }
                          }
                      }

                      writeChar=found;

                      runOnUiThread(() -> {

                          if(writeChar!=null) {

                              status.setText(
                                      "● CONNECTED • FFE1 READY");

                          } else {

                              status.setText(
                                      "● CONNECTED • WRITE NOT FOUND");
                          }
                      });
                  }
              };

              private void sendPower(
                      boolean on) {

                  /*
                   * LEDDMX Dialect B:
                   * 7B FF 04 01 FF FF FF FF BF
                   * 7B FF 04 00 FF FF FF FF BF
                   */

                  byte[] p={
                          0x7B,
                          (byte)0xFF,
                          0x04,
                          (byte)(on?1:0),
                          (byte)0xFF,
                          (byte)0xFF,
                          (byte)0xFF,
                          (byte)0xFF,
                          (byte)0xBF
                  };

                  sendBle(p);
              }

              private void sendMode(
                      int mode) {

                  if(mode<1) mode=1;
                  if(mode>210) mode=210;

                  byte[] p={
                          0x7B,
                          (byte)0xFF,
                          0x03,
                          (byte)mode,
                          (byte)0xFF,
                          (byte)0xFF,
                          (byte)0xFF,
                          (byte)0xFF,
                          (byte)0xBF
                  };

                  sendBle(p);
              }

              private void sendBrightness(
                      int value) {

                  value=Math.max(
                          0,
                          Math.min(100,value));

                  int scaled=
                          (value*32)/100;

                  byte[] p={
                          0x7B,
                          (byte)0xFF,
                          0x01,
                          (byte)scaled,
                          (byte)value,
                          0x01,
                          (byte)0xFF,
                          (byte)0xFF,
                          (byte)0xBF
                  };

                  sendBle(p);
              }

              private void sendSpeed(
                      int value) {

                  value=Math.max(
                          0,
                          Math.min(255,value));

                  byte[] p={
                          0x7B,
                          (byte)0xFF,
                          0x02,
                          (byte)value,
                          0x00,
                          (byte)0xFF,
                          (byte)0xFF,
                          (byte)0xFF,
                          (byte)0xBF
                  };

                  sendBle(p);
              }

              private void sendPixelConfig(
                      int type,
                      int count,
                      int order) {

                  count=Math.max(
                          1,
                          Math.min(1024,count));

                  int hi=(count>>8)&0xFF;
                  int lo=count&0xFF;

                  byte[] p={
                          0x7B,
                          (byte)0xFF,
                          0x05,
                          (byte)type,
                          (byte)hi,
                          (byte)lo,
                          (byte)order,
                          (byte)0xFF,
                          (byte)0xBF
                  };

                  sendBle(p);
              }

              private void sendDirection(
                      int dir) {

                  byte[] p={
                          0x7B,
                          (byte)0xFF,
                          0x0D,
                          (byte)(dir?1:0),
                          (byte)0xFF,
                          (byte)0xFF,
                          (byte)0xFF,
                          (byte)0xFF,
                          (byte)0xBF
                  };

                  sendBle(p);
              }

              private void sendRgb(
                      int r,
                      int g,
                      int b) {

                  r=Math.max(0,Math.min(255,r));
                  g=Math.max(0,Math.min(255,g));
                  b=Math.max(0,Math.min(255,b));

                  /*
                   * Proven LEDDMX live RGB frame:
                   *
                   * 7B FF 07 R G B BF
                   */

                  byte[] p={
                          0x7B,
                          (byte)0xFF,
                          0x07,
                          (byte)r,
                          (byte)g,
                          (byte)b,
                          (byte)0xBF
                  };

                  sendBle(p);
              }

              private void sendBle(
                      byte[] data) {

                  if(gatt==null ||
                          writeChar==null) {

                      Toast.makeText(
                              this,
                              "Modul belum terhubung",
                              Toast.LENGTH_SHORT)
                              .show();

                      return;
                  }

                  try {

                      writeChar.setValue(data);

                      int props=
                              writeChar.getProperties();

                      if((props &
                              BluetoothGattCharacteristic
                                      .PROPERTY_WRITE_NO_RESPONSE)
                              !=0) {

                          writeChar.setWriteType(
                                  BluetoothGattCharacteristic
                                          .WRITE_TYPE_NO_RESPONSE);

                      } else {

                          writeChar.setWriteType(
                                  BluetoothGattCharacteristic
                                          .WRITE_TYPE_DEFAULT);
                      }

                      boolean result=
                              gatt.writeCharacteristic(
                                      writeChar);

                      if(!result) {

                          Toast.makeText(
                                  this,
                                  "BLE write rejected",
                                  Toast.LENGTH_SHORT)
                                  .show();
                      }

                  } catch(Exception e) {

                      Toast.makeText(
                              this,
                              "BLE ERROR: "+
                              e.getMessage(),
                              Toast.LENGTH_SHORT)
                              .show();
                  }
              }

              @Override
              protected void onDestroy() {

                  playing=false;

                  handler.removeCallbacksAndMessages(
                          null);

                  if(scanner!=null &&
                          scanning) {

                      try {
                          scanner.stopScan(
                                  scanCallback);
                      } catch(Exception ignored){}
                  }

                  if(gatt!=null) {

                      try {
                          gatt.disconnect();
                      } catch(Exception ignored){}

                      try {
                          gatt.close();
                      } catch(Exception ignored){}
                  }

                  super.onDestroy();
              }
          }
